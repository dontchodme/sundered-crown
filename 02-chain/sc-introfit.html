      /* the motes the front has already passed, going out one by one. This is
         the whole effect: an absence you can only see by what it removes. */
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < 26; i++){
        const a = shellHash(83, i) * TAU;
        const rr = 70 + shellHash(84, i) * (u.radius * 1.15);
        const out = clamp((R - rr) / 46, 0, 1);          // 1 once swallowed
        if (out >= 1) continue;
        c.globalAlpha = (1 - out) * fade * 0.95;
        c.fillStyle = out > 0.35 ? "#DDB8FF" : "#F2E4FF";
        const s = (1 - out) * (1.8 + shellHash(85, i) * 2.4) + out * 5.5;
        c.beginPath();
        c.arc(u.x + Math.cos(a) * rr, u.y + Math.sin(a) * rr, s, 0, TAU);
        c.fill();
      }
      c.restore();

      /* THE BODY: black, hard-edged, and it does not move. An eclipse has a
         centre; v1 had only a rim leaving the frame. */
      c.globalAlpha = fade;
      c.fillStyle = "#05010A";
      c.beginPath(); c.arc(u.x, u.y, BODY, 0, TAU); c.fill();

      c.save();
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = fade;
      c.strokeStyle = "#F2E4FF"; c.lineWidth = 2.6;
      c.shadowColor = "#A45CF0"; c.shadowBlur = 20;
      c.beginPath(); c.arc(u.x, u.y, BODY, 0, TAU); c.stroke();
      c.shadowBlur = 0;
      /* the corona proper — uneven, and it breathes */
      for (let i = 0; i < 22; i++){
        const a = (i / 22) * TAU + u.t * 0.35;
        const l = BODY * (0.22 + shellHash(81, i) * 0.55
                          * (0.7 + 0.3 * Math.sin(u.t * 6 + i)));
        c.globalAlpha = fade * 0.75;
        c.strokeStyle = "#DDB8FF"; c.lineWidth = 2.2;
        c.beginPath();
        c.moveTo(u.x + Math.cos(a) * BODY, u.y + Math.sin(a) * BODY);
        c.lineTo(u.x + Math.cos(a) * (BODY + l), u.y + Math.sin(a) * (BODY + l));
        c.stroke();
      }
      c.restore();
    }

    /* ---- Corollary: the proof, stepped out and then concluded -------------- */
    else if (u.w === "axiom"){
      const STEPS = 5;
      const step = clamp(u.t / 0.30, 0, 1);
      const fade = 1 - clamp((u.t - 0.52) / 0.9, 0, 1);
      const done = clamp((u.t - 0.30) / 0.22, 0, 1);

      /* the rule: straight, and it ARRIVES IN STEPS rather than flickering.
         Unmaking is a jag redrawn every frame; this is the same school
         insisting the other way. */
      const n = Math.max(1, Math.ceil(STEPS * step));
      c.globalAlpha = fade;
      c.strokeStyle = "#BCDDFF"; c.lineWidth = 5;
      c.shadowColor = "#4A9EFF"; c.shadowBlur = 18;
      c.beginPath();
      c.moveTo(u.x, u.y);
      c.lineTo(lerp(u.x, tgt.x, n / STEPS), lerp(u.y, tgt.y, n / STEPS));
      c.stroke();
      c.strokeStyle = "#FFFFFF"; c.lineWidth = 1.8; c.shadowBlur = 0;
      c.beginPath();
      c.moveTo(u.x, u.y);
      c.lineTo(lerp(u.x, tgt.x, n / STEPS), lerp(u.y, tgt.y, n / STEPS));
      c.stroke();

      for (let i = 1; i <= n; i++){          // a glyph stamped at every node
        const t2 = i / STEPS;
        this._glyph(c, lerp(u.x, tgt.x, t2), lerp(u.y, tgt.y, t2),
                    7 + i * 1.6, u.t * 1.8 + i, "#BCDDFF", fade * 0.95);
      }

      /* the conclusion: one sigil, snapping to size and holding */
      if (u.hit && done > 0){
        const pop = 1 + (1 - done) * 0.7;
        this._glyph(c, tgt.x, tgt.y, 34 * pop, -u.t * 1.6, "#FFFFFF", fade * done);
        c.globalAlpha = fade * done * 0.7;
        c.strokeStyle = "#4A9EFF"; c.lineWidth = 2.2;
        c.shadowColor = "#4A9EFF"; c.shadowBlur = 16;
        c.beginPath(); c.arc(tgt.x, tgt.y, 34 * pop * 1.5, 0, TAU); c.stroke();
        c.shadowBlur = 0;
      }
    }

    /* ---- Quarrelstorm: the RELEASE. Not arrows — drawShots draws those ----- */
    else if (u.w === "ironhail"){
      const flash = 1 - clamp(u.t / 0.22, 0, 1);
      const fade  = 1 - clamp((u.t - 0.2) / 0.7, 0, 1);
      const N = 14;                                 // == u.shots
      if (flash > 0){
        c.save();
        c.globalCompositeOperation = "lighter";
        for (let i = 0; i < N; i++){
          const a = (i / N) * TAU;
          const l = 26 + 66 * flash;
          c.globalAlpha = flash * 0.95;
          c.strokeStyle = "#E8A34E"; c.lineWidth = 3.4 * flash + 1;
          c.shadowColor = "#E8A34E"; c.shadowBlur = 14;
          c.beginPath();
          c.moveTo(u.x + Math.cos(a) * 22, u.y + Math.sin(a) * 22);
          c.lineTo(u.x + Math.cos(a) * (22 + l), u.y + Math.sin(a) * (22 + l));
          c.stroke();
        }
        c.shadowBlur = 0;
        c.restore();
      }
      /* the mount kicks: a hard ring thrown back off the release */
      const ex = clamp(u.t / 0.26, 0, 1);
      c.globalAlpha = fade * (1 - ex) * 0.9;
      c.strokeStyle = "#FFD9A0"; c.lineWidth = 4 * (1 - ex) + 1;
      c.beginPath(); c.arc(u.x, u.y, 20 + 120 * ex, 0, TAU); c.stroke();
    }

    /* ---- Bulwark: interlocking plates of light, let go ---------------------- */
    else if (u.w === "lightkeeper"){
      const ex = clamp(u.t / 0.34, 0, 1);
      const fade = 1 - clamp((u.t - 0.4) / 0.85, 0, 1);
      const R = u.radius * (1 - Math.pow(1 - ex, 2.4));
      const N = 18;
      c.save();
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU + u.t * 0.5;
        const w = TAU / N * 0.60;
        const h = 26 * (1 - ex * 0.45);
        c.save();
        c.translate(u.x + Math.cos(a + w / 2) * R, u.y + Math.sin(a + w / 2) * R);
        /* each plate TILTS as it flies — the thing that makes this read as
           armour let go rather than a ring of light expanding */
        c.rotate(a + w / 2 + Math.PI / 2 + ex * 0.5 * (i % 2 ? 1 : -1));
        c.globalAlpha = fade * (1 - ex * 0.5);
        c.fillStyle = "#F06BB833";
        c.strokeStyle = "#FFD1EC"; c.lineWidth = 2;
        c.shadowColor = "#F06BB8"; c.shadowBlur = 12;
        const wpx = R * w;
        c.beginPath();
        c.moveTo(-wpx / 2, -h / 2); c.lineTo(wpx / 2, -h / 2 + 4);
        c.lineTo(wpx / 2, h / 2 - 4); c.lineTo(-wpx / 2, h / 2);
        c.closePath(); c.fill(); c.stroke();
        c.shadowBlur = 0;
        c.restore();
      }
      c.restore();
    }

    /* ---- Reprisal: the ward spent, spiralling into one point ---------------- */
    else if (u.w === "farwarden"){
      const p = clamp(u.t / Math.max(0.001, u.life * 0.7), 0, 1);
      const fade = 1 - clamp((u.t - u.life * 0.72) / (u.life * 0.28), 0, 1);
      /* plates drawn IN, not thrown out — the pool becoming the arrow */
      for (let i = 0; i < 10; i++){
        const q = clamp(p * 1.25 - i * 0.045, 0, 1);
        if (q <= 0) continue;
        const a = shellHash(41, i) * TAU + q * 3.2;
        const rr = 150 * (1 - q);
        c.save();
        c.translate(u.x + Math.cos(a) * rr, u.y + Math.sin(a) * rr);
        c.rotate(a + q * 4);
        c.globalAlpha = fade * (1 - q * 0.55);
        c.fillStyle = "#F06BB855";
        c.strokeStyle = "#FFD1EC"; c.lineWidth = 1.8;
        c.beginPath();
        c.moveTo(-13, -7); c.lineTo(13, -4); c.lineTo(13, 4); c.lineTo(-13, 7);
        c.closePath(); c.fill(); c.stroke();
        c.restore();
      }
      /* the aim line steadies as the spin comes round */
      c.globalAlpha = fade * p * 0.8;
      c.strokeStyle = "#FFD1EC"; c.lineWidth = 1.6;
      c.setLineDash([9, 11]);
      c.beginPath(); c.moveTo(u.x, u.y); c.lineTo(tgt.x, tgt.y); c.stroke();
      c.setLineDash([]);
      c.globalAlpha = fade * p;
      c.fillStyle = "#FFFFFF";
      c.shadowColor = "#F06BB8"; c.shadowBlur = 18;
      c.beginPath(); c.arc(u.x, u.y, 5 + 7 * p, 0, TAU); c.fill();
      c.shadowBlur = 0;
    }

    /* ---- Benediction: sent OUT, not called down ---------------------------- */
    else if (u.w === "aureole"){
      const open = clamp((u.t - 0.06) / 0.20, 0, 1);
      const fade = 1 - clamp((u.t - 0.42) / 1.0, 0, 1);
      const dx = u.tx - u.x, dy = u.ty - u.y, L = Math.hypot(dx, dy) || 1;
      c.save();
      c.globalCompositeOperation = "lighter";
      /* the lance, along the shot line. Judgement falls vertically; a bow
         sends its blessing where it was aimed. */
      c.save();
      c.translate(u.x, u.y); c.rotate(Math.atan2(dy, dx));
      const w = 34 * open * (0.4 + 0.6 * fade);
      const g = c.createLinearGradient(0, -w, 0, w);
      g.addColorStop(0, "#FFF6E200"); g.addColorStop(0.5, "#FFFFFFCC");
      g.addColorStop(1, "#FFF6E200");
      c.fillStyle = g; c.globalAlpha = 0.55 * fade;
      c.fillRect(0, -w, L * open, w * 2);
      c.restore();
      /* halo rings opening at the target */
      for (let i = 0; i < 3; i++){
        const q = clamp(open * 1.2 - i * 0.18, 0, 1);
        if (q <= 0) continue;
        c.globalAlpha = fade * (1 - q * 0.6) * 0.9;
        c.strokeStyle = "#FFF6E2"; c.lineWidth = 3 - i * 0.6;
        c.shadowColor = "#FFF6E2"; c.shadowBlur = 16;
        c.beginPath(); c.arc(u.tx, u.ty, 26 + q * (58 + i * 30), 0, TAU); c.stroke();
        c.shadowBlur = 0;
      }
      /* the heal: rings CLOSING into the caster — Dawnbringer's motes rise,
         these contract, so the two sanctified heals do not read alike */
      for (let i = 0; i < 4; i++){
        const q = (u.t * 0.85 + i / 4) % 1;
        c.globalAlpha = (1 - q) * fade * 0.85;
        c.strokeStyle = "#FFF6E2"; c.lineWidth = 2.2;
        c.beginPath(); c.arc(src.x, src.y, 16 + (1 - q) * 74, 0, TAU); c.stroke();
      }
      c.restore();
    }

    /* ---- Consecration: the censer swung, and smoke over holy ground -------- */
    else if (u.w === "censer"){
      const ex = clamp(u.t / 0.40, 0, 1);
      const fade = 1 - clamp((u.t - 0.5) / 0.9, 0, 1);
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let arm = 0; arm < 4; arm++){
        c.globalAlpha = 0.5 * fade;
        c.strokeStyle = arm % 2 ? "#C9A227" : "#FFF6E2";
        c.lineWidth = 5 - arm * 0.8;
        c.beginPath();
        for (let j = 0; j <= 30; j++){
          const t2 = j / 30;
          /* ribbons of smoke thrown off a swung censer: an outward spiral,
             wide and slow, nothing like the tight vortex Dirge draws */
          const a = arm * TAU / 4 + t2 * 2.4 + u.t * 1.6;
          const r = u.radius * 0.92 * t2 * ex;
          const px = u.x + Math.cos(a) * r;
          const py = u.y + Math.sin(a) * r * 0.86;
          j ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.stroke();
      }
      c.restore();
      for (let i = 0; i < 14; i++){               // sparks of incense
        const q = (u.t * 0.7 + shellHash(52, i)) % 1;
        const a = shellHash(53, i) * TAU;
        const r = u.radius * 0.8 * q;
        c.globalAlpha = (1 - q) * fade * 0.9;
        c.fillStyle = "#FFE9A8";
        c.beginPath();
        c.arc(u.x + Math.cos(a) * r, u.y + Math.sin(a) * r - q * 30,
              1.6 + (1 - q) * 2, 0, TAU);
        c.fill();
      }
    }

    /* ---- Forgefall: embers thrown up off the quench ------------------------- */
    else if (u.w === "emberedge"){
      const ex = clamp(u.t / 0.30, 0, 1);
      const fade = 1 - clamp((u.t - 0.5) / 0.95, 0, 1);
      c.save();
      c.globalCompositeOperation = "lighter";
      const hit = 1 - clamp(u.t / 0.16, 0, 1);
      if (hit > 0){                                // the blow itself
        c.globalAlpha = hit * 0.75;
        const g = c.createRadialGradient(u.x, u.y, 2, u.x, u.y, 112);
        g.addColorStop(0, "#FFF0C0"); g.addColorStop(0.32, "#E8761A66");
        g.addColorStop(1, "#E8761A00");
        c.fillStyle = g;
        c.beginPath(); c.arc(u.x, u.y, 112, 0, TAU); c.fill();
      }
      for (let i = 0; i < 30; i++){                // embers, rising and dying
        const q = (u.t * 0.62 + shellHash(63, i)) % 1;
        const a = shellHash(64, i) * TAU;
        const r = u.radius * 0.85 * q * (0.4 + shellHash(65, i) * 0.8);
        const rise = q * q * 96;
        c.globalAlpha = (1 - q) * fade;
        /* embers cool as they climb — the colour IS the age of the spark */
        c.fillStyle = q > 0.66 ? "#8A2E0E" : (q > 0.33 ? "#E8761A" : "#FFD08A");
        c.beginPath();
        c.arc(u.x + Math.cos(a) * r, u.y + Math.sin(a) * r * 0.8 - rise,
              1.4 + (1 - q) * 2.6, 0, TAU);
        c.fill();
      }
      c.restore();
      c.globalAlpha = fade * (1 - ex) * 0.85;      // the heat ring
      c.strokeStyle = "#E8761A"; c.lineWidth = 4 * (1 - ex) + 1;
      c.shadowColor = "#E8761A"; c.shadowBlur = 16;
      c.beginPath();
      c.arc(u.x, u.y, u.radius * (1 - Math.pow(1 - ex, 2.5)), 0, TAU); c.stroke();
      c.shadowBlur = 0;
    }
    c.restore();
  }

  /* ----------------------------------------------------------- fighter --- */
  /* The chipped outline. Notches are anchored to the mouths of fully-grown
     cracks, so the silhouette breaks exactly where the shell already split. */
  corePath(f, R, dmg){
    const p = new Path2D();
    const notches = [];
    for (const ck of shellCracks(f.side)){
      if (!ck.chip) continue;
      const grow = clamp((dmg - ck.thr) / 0.085, 0, 1);
      if (grow < 0.62) continue;
      notches.push([ck.pts[0][0],
                    (0.09 + ck.w * 0.11) * (grow - 0.62) / 0.38,
                    0.15 + ck.w * 0.10]);
    }
    const N = 128;
    for (let i = 0; i <= N; i++){
      const a = (i / N) * TAU;
      let rad = 1;
      for (const [na, depth, span] of notches){
        const d = Math.abs(((a - na) % TAU + TAU + Math.PI) % TAU - Math.PI);
        if (d < span) rad -= depth * (0.5 + 0.5 * Math.cos(Math.PI * d / span));
      }
      const x = f.x + Math.cos(a) * rad * R, y = f.y + Math.sin(a) * rad * R;
      i ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath();
    return p;
  }

  /* The loser used to simply vanish on the killing blow — the single least
     legible moment in the whole match. The shell that has been cracking for
     forty seconds now finishes the job and comes apart. Shards are annular so
     nothing piles up at the centre, and each spins about its own centroid;
     rotating them about the old ball centre made them orbit like a pinwheel. */
  drawShatter(m, f){
    const c = this.ctx, R = CONFIG.physics.ballR;
    const age = m.deathAge, life = 2.1, hold = 0.10;
    if (age > life) return;
    const k = clamp(age / life, 0, 1);
    const fly = Math.max(0, age - hold);
    const N = 13;
    c.save();
    c.lineJoin = "round";
    for (let i = 0; i < N; i++){
      const j0 = (shellHash(f.side * 23, i)     - 0.5) * 0.10;
      const j1 = (shellHash(f.side * 23, i + 1) - 0.5) * 0.10;
      const a0 = (i / N) * TAU + j0, a1 = ((i + 1) / N) * TAU + j1;
      const mid = (a0 + a1) / 2;
      const spd = 40 + shellHash(f.side * 13, i) * 85;
      const dist = spd * fly * (1 - k * 0.5);
      const spin = (shellHash(f.side * 17, i) - 0.5) * 6.5 * fly;
      const cxp = f.x + Math.cos(mid) * dist;
      const cyp = f.y + Math.sin(mid) * dist + 52 * fly * fly;    // they fall
      const inner = R * 0.30;
      c.save();
      c.globalAlpha = Math.max(0, 1 - k * k);
      /* spin about the shard's own mass, not the ball's */
      const px = f.x + Math.cos(mid) * R * 0.66, py = f.y + Math.sin(mid) * R * 0.66;
      c.translate(cxp - f.x + px, cyp - f.y + py);
      c.rotate(spin);
      c.translate(-px, -py);
      const shade = 0.55 + shellHash(f.side * 31, i) * 0.45;
      const g = c.createRadialGradient(f.x, f.y, inner, f.x, f.y, R);
      g.addColorStop(0, f.aff.dark); g.addColorStop(1, "#0C0913");
      c.fillStyle = g;
      c.beginPath();
      c.arc(f.x, f.y, R, a0, a1);
      c.arc(f.x, f.y, inner, a1, a0, true);
      c.closePath(); c.fill();
      c.globalAlpha *= 0.5 * shade;
      c.strokeStyle = f.aff.core; c.lineWidth = 1.4; c.stroke();
      c.restore();
    }
    /* the ember that was still burning inside it, going out */
    if (age < 0.55){
      c.save();
      c.globalAlpha = Math.max(0, 1 - age / 0.55);
      c.fillStyle = "#FFF4D0";
      c.shadowColor = f.aff.glow; c.shadowBlur = 40;
      c.beginPath(); c.arc(f.x, f.y, R * 0.30 * (1 - age / 0.55), 0, TAU); c.fill();
      c.restore();
    }
    c.restore();
  }

  /* THE BALL, ON ITS OWN SURFACE. A Canvas2D shadow costs in proportion to the
     surface it is drawn on, so eight blurred draws per frame on a 2.07 Mpx
     canvas is eight full-canvas blurs. Drawn into a buffer sized to the ball
     they are eight blurs on ~0.1 Mpx. Measured on an Adreno 660, the same move
     on the weapon was worth 40 ms a frame.

     The buffer's transform is the caller's transform translated so the ball
     sits in the middle, which is what lets the wrapped code go on using world
     coordinates unchanged. Nothing inside it knows it moved. */
  _ballBuf(c, m, f, body){
    const R = CONFIG.physics.ballR;
    const t = c.getTransform();
    const k = Math.hypot(t.a, t.b) || 1;
    const rad = R * 2.1 + 38;                 // desperate ring + widest blur + margin
    const S = Math.ceil(rad * 2 * k);
    if (!this._bbuf){ this._bbuf = document.createElement("canvas"); }
    const b = this._bbuf;
    if (b.width < S || b.height < S){ b.width = S; b.height = S; }
    const bx = b.getContext("2d");
    bx.setTransform(1, 0, 0, 1, 0, 0);
    bx.globalCompositeOperation = "source-over";
    bx.globalAlpha = 1;
    bx.shadowBlur = 0; bx.shadowColor = "transparent";
    bx.clearRect(0, 0, b.width, b.height);
    bx.save();
    bx.translate(S / 2, S / 2);
    bx.scale(k, k);
    bx.translate(-f.x, -f.y);                 /* world coords still work inside */
    body(bx);
    bx.restore();
    c.drawImage(b, 0, 0, S, S, f.x - rad, f.y - rad, rad * 2, rad * 2);
  }

  drawFighter(m, f){
    const c = this.ctx, R = CONFIG.physics.ballR;
    if (!f.alive){ this.drawShatter(m, f); return; }

    /* body trail */
    c.save();
    c.globalCompositeOperation = "lighter";
    const tr = f.trail;
    for (let i = 0; i < tr.length; i += 2){
      const k = (i/2) / (tr.length/2);
      c.globalAlpha = k*k*0.26; c.fillStyle = f.aff.core;
      c.beginPath(); c.arc(tr[i], tr[i+1], R*(0.30 + k*0.62), 0, TAU); c.fill();
    }
    c.restore();

    /* swing-arc ribbons: the tip's recent path, tapering. Without these a fast
       weapon is an unreadable blur; with them the arc reads as a slash. */
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    for (const tp of f.tips){
      for (let i = 2; i < tp.length; i += 2){
        const k = (i/2) / (tp.length/2);
        c.globalAlpha = k*k*0.42;
        c.strokeStyle = f.aff.glow;
        c.lineWidth = f.w.width * 0.75 * k;
        c.beginPath(); c.moveTo(tp[i-2], tp[i-1]); c.lineTo(tp[i], tp[i+1]); c.stroke();
      }
    }
    c.restore();

    /* The weapon itself, OCCLUDED BY THE OTHER RELIC'S SHELL.

       A blade whose tip is on the far side of the opponent is inside a solid
       body, and this renderer used to draw it on top of that body -- which is
       exactly why the far-side clank read as coming from nowhere. With the
       shell punched out of the clip, a swing that reaches into the opponent
       is visibly swallowed, and what the viewer sees is now the same geometry
       tickClank tests. Rule 1: the mechanic and its picture ship together. */
    const _foe = f === m.a ? m.b : m.a;
    if (_foe.alive){
      c.save();
      c.beginPath();
      c.rect(-4000, -4000, 8000, 8000);
      c.arc(_foe.x, _foe.y, R * 0.98, 0, TAU, true);   // reverse winding = hole
      c.clip();
      this.drawWeapon(m, f);
      c.restore();
    } else {
      this.drawWeapon(m, f);
    }

    this._ballBuf(c, m, f, (c) => {
    const base   = CONFIG.combat.baseHP;
    const hpFrac = clamp(f.hp / base, 0, 1);
    const maxFrac= clamp(f.maxHp / base, 0, 1);
    const dmg    = 1 - hpFrac;                 // how broken this relic is

    if (f.desperate){
      c.save();
      const pulse = 1 + Math.sin(m.t * 12) * 0.14;
      c.globalAlpha = 0.5;
      c.strokeStyle = "#E0433F"; c.lineWidth = 4;
      c.shadowColor = "#E0433F"; c.shadowBlur = 30;
      c.beginPath(); c.arc(f.x, f.y, R*1.5*pulse, 0, TAU); c.stroke();
      c.restore();
    }

    /* The relic core, drawn against a chipped outline rather than a circle.
       Silhouette is the most legible channel there is — it survives motion
       blur, thumbnail scale and peripheral vision, none of which a colour or a
       hairline does. Building the bites into the path (rather than painting
       black blobs over a circle) is what makes the glow follow the damage. */
    const shell = this.corePath(f, R, dmg);
    c.save();
    const g = c.createRadialGradient(f.x - R*0.35, f.y - R*0.35, 2, f.x, f.y, R);
    g.addColorStop(0, f.aff.glow); g.addColorStop(0.55, f.aff.core); g.addColorStop(1, f.aff.dark);
    c.fillStyle = g;
    c.shadowColor = f.aff.core; c.shadowBlur = 30 - dmg * 22;
    c.fill(shell);
    c.restore();

    /* Life retreats to the centre. A dead-ash gradient, transparent at the
       ember and opaque at the rim, so a badly hurt relic reads as a dark husk
       with something still burning inside it — legible at thumbnail size with
       no numbers involved. */
    if (dmg > 0.02){
      c.save();
      c.clip(shell);
      /* The lit heart shrinks with health, so the ball carries the same number
         twice over: the arc says it, and the size of the ember says it again.
         Two redundant readings of one value is cheap insurance on a subject
         that is often moving at 2500px/s. */
      const ash = c.createRadialGradient(f.x, f.y, R * (0.05 + (1-dmg) * 0.55),
                                         f.x, f.y, R);
      ash.addColorStop(0,    "#0A071000");
      ash.addColorStop(0.34, "#0A0710B8");
      ash.addColorStop(1,    "#0A0710F5");
      c.globalAlpha = Math.min(0.97, dmg * 1.3);
      c.fillStyle = ash;
      c.fillRect(f.x - R, f.y - R, R*2, R*2);
      c.restore();
    }

    /* Grain. A perfectly smooth sphere reads as glass or plastic, and a crack
       in glass is a different thing from a crack in stone — so the shell gets
       a handful of deterministic mottled patches, dark and light, before the
       fractures go on top of it. Cheap, and it is what makes the fracture read
       as something breaking rather than something drawn. */
    c.save();
    c.clip(shell);
    /* Bake at true device density — arena scale times the backing-store ratio —
       so the sprite is neither blurry at full resolution nor wastefully large
       at a quarter of it. */
    const dens = this.scale * this.k;
    const grain = grainSprite(f.side, R, dens);
    const gw = grain.S / dens;
    c.drawImage(grain.cv, f.x - gw / 2, f.y - gw / 2, gw, gw);
    c.restore();

    /* Fractures, drawn pass-major and batched by stroke width.

       The obvious way to taper a crack is to stroke it segment by segment with
       a shrinking lineWidth, and that is what this did. It cost 86ms a frame —
       11fps — because 14 cracks x 3 polylines x 5 passes x 8 segments is about
       1700 individual beginPath/stroke calls, and a stroke call is expensive
       almost independently of how much it draws.

       So: quantise the width, batch every segment of every crack that shares a
       width into one Path2D, and stroke each bucket once. Same picture, ~40
       strokes instead of ~1700. Measured 86ms -> under 3ms.

       (The lesson generalises. The cost was never "canvas is slow" or "it is
       one big HTML file" — it was call count, and no framework would have
       fixed it.) */
    const cracks = shellCracks(f.side);
    /* `core`, not `glow`. The glow tints are near-white by design (verdant's is
       #BCF7C7) and cracks lit with them read as white lightning drawn on the
       surface rather than the relic's own light escaping through it. */
    const lit = f.mend > 0 ? "#FFF4D0" : f.aff.core;
    c.save();
    c.clip(shell);
    c.lineCap = "round"; c.lineJoin = "round";

    /* The light in the fracture is alive: a slow breath, plus a hard flare on
       the frames after this relic is struck. A static glow reads as paint. */
    const breathe = 0.86 + Math.sin(m.t * 2.1 + f.side * 2) * 0.14;
    const flare   = 1 + (f.flash || 0) * 1.5;

    /* Five passes, and the order is the whole effect:
         bloom   — a wide, soft wash of the school's colour, so the fracture
                   looks like it is emitting rather than being drawn on
         fissure — the wide dark split, which is what makes it read as a gap
         shadow  — the broken face turned away from the light
         lit     — the broken face catching it; these two are the bevel, and
                   the bevel is what says stone rather than glowing line
         core    — the light coming up out of the crack itself                */
    const PASSES = [
      { style: lit,        wide: 2.6, narrow: 1.1, off:  0.0,
        alpha: f.mend > 0 ? 0.42 : null, blur: f.mend > 0 ? 26 : 18, glow: true },
      { style: "#030207",  wide: 3.4, narrow: 0.9, off:  0.0, alpha: 0.96, blur: 0 },
      { style: "#00000088",wide: 1.5, narrow: 0.4, off: -2.0, alpha: 0.55, blur: 0 },
      { style: "#FFFFFF",  wide: 1.2, narrow: 0.3, off:  1.9, alpha: null, blur: 0 },
      { style: f.mend > 0 ? "#FFFFFF" : lit,
        wide: 1.0, narrow: 0.24, off: 0.0,
        alpha: f.mend > 0 ? 1 : null, blur: f.mend > 0 ? 18 : 8, glow: true, core: true },
    ];

    const QUANT = 0.55;                       // width bucket, in arena units
    for (const P of PASSES){
      const bins = new Map();
      let anyGrow = 0;
      for (const ck of cracks){
        const grow = clamp((dmg - ck.thr) / 0.085, 0, 1);
        if (grow <= 0) continue;
        anyGrow = Math.max(anyGrow, grow);
        const wide = ck.w * P.wide, narrow = ck.w * P.narrow, off = ck.w * P.off;
        const add = (pts, n) => {
          n = Math.min(n, pts.length);        // a short branch can run out first
          const span = Math.max(1, pts.length - 1);
          for (let i = 1; i < n; i++){
            const km = ((i - 1) / span + i / span) / 2;
            const lw = Math.max(0.35, lerp(wide, narrow, km));
            const key = Math.max(1, Math.round(lw / QUANT));
            let p = bins.get(key);
            if (!p) bins.set(key, p = new Path2D());
            const [a0, r0] = pts[i - 1], [a1, r1] = pts[i];
            let x0 = f.x + Math.cos(a0) * r0 * R, y0 = f.y + Math.sin(a0) * r0 * R;
            let x1 = f.x + Math.cos(a1) * r1 * R, y1 = f.y + Math.sin(a1) * r1 * R;
            if (off){
              const dx = x1 - x0, dy = y1 - y0, dl = Math.hypot(dx, dy) || 1;
              const nx = -dy / dl * off, ny = dx / dl * off;
              x0 += nx; y0 += ny; x1 += nx; y1 += ny;
            }
            p.moveTo(x0, y0); p.lineTo(x1, y1);
          }
        };
        const n = Math.max(2, Math.ceil(ck.pts.length * grow));
        add(ck.pts, n);
        for (const b of ck.branches){
          if (b.at >= n - 1 || b.pts.length < 2) continue;
          const bg = clamp((n - 1 - b.at) / 2, 0, 1);
          add(b.pts, Math.max(2, Math.ceil(b.pts.length * bg)));
        }
      }
      if (!bins.size) continue;

      c.strokeStyle = P.style;
      c.globalAlpha = P.alpha != null ? P.alpha
        : P.core ? (0.40 + anyGrow * 0.28) * breathe * flare
        : P.glow ? (0.09 + anyGrow * 0.05) * breathe * flare
        : 0.16 + anyGrow * 0.10;
      /* ONE BLURRED STROKE FOR THE WHOLE NETWORK, not one per width bucket.

         `bins` exists so each crack segment is stroked at its own width, and
         that matters for the CRISP passes and not at all for the glow: after
         an 18px gaussian, a 2.6-wide line and a 1.1-wide line are the same
         smudge. The shadow was set outside this loop but every stroke inside
         it paid a full blur -- ~21 of them a frame, 30% of all blur work in
         the collapsed state.

         Drawn SHADOW-ONLY: the shape is translated far off-canvas and the
         shadow offset brings its shadow back to where the shape would have
         been, so the glow lands and the geometry underneath is untouched.
         The offset is multiplied by the live transform's x-scale because
         shadow offsets are NOT transformed by the CTM and the translate is,
         which is the one way this trick is usually got wrong. */
      if (P.blur){
        const merged = new Path2D();
        let wsum = 0;
        for (const [key, path] of bins){ merged.addPath(path); wsum += key * QUANT; }
        const tf = c.getTransform(), OFF = 1e5;
        c.save();
        c.shadowColor = lit; c.shadowBlur = P.blur;
        c.shadowOffsetX = OFF * tf.a;
        c.translate(-OFF, 0);
        c.lineWidth = wsum / bins.size;
        c.stroke(merged);
        c.restore();
      }
      for (const [key, path] of bins){
        c.lineWidth = key * QUANT;
        c.stroke(path);
      }
      c.shadowBlur = 0;
    }

    /* spall — flakes lifted off around the mouth of a fully open crack */
    c.globalAlpha = 0.5;
    c.fillStyle = "#00000099";
    const spall = new Path2D();
    for (const ck of cracks){
      if (clamp((dmg - ck.thr) / 0.085, 0, 1) <= 0.9) continue;
      const [ma, mr] = ck.pts[0];
      for (let s = 0; s < 2; s++){
        const h1 = shellHash(f.side * 7 + 3, s * 3 + 1);
        const h2 = shellHash(f.side * 7 + 3, s * 3 + 2);
        const aa = ma + (h1 - 0.5) * 0.34, rr2 = (mr - 0.08 - h2 * 0.22) * R;
        const px = f.x + Math.cos(aa) * rr2, py = f.y + Math.sin(aa) * rr2;
        const sz = 1.6 + h1 * 2.6;
        spall.moveTo(px - sz, py); spall.lineTo(px, py - sz * 0.8);
        spall.lineTo(px + sz * 0.9, py + sz * 0.4); spall.closePath();
      }
    }
    c.fill(spall);
    c.restore();

    /* --- the health ring, wrapped inside the shell ---------------------
       This replaces 340px of HUD. The information now arrives where the eye
       already is: at the ball, at the moment of impact, during the hit stop
       that the impact itself caused. */
    const rr = R * 0.80, lw = 1.7, TOP = -Math.PI/2;
    c.save();
    c.lineCap = "butt";
    /* The channel has to be dark enough to frame the ring on a *bright* relic —
       a red hairline on Dawnbringer's gold is the worst-contrast case in the
       roster, and it is invisible without this. */
    c.strokeStyle = "#000000B0"; c.lineWidth = lw + 2.6;   // recessed channel
    c.beginPath(); c.arc(f.x, f.y, rr, 0, TAU); c.stroke();

    if (maxFrac < 1){                       // life permanently eaten by Curse
      c.strokeStyle = AFFINITIES.umbral.core; c.globalAlpha = 0.6;
      c.lineWidth = lw;
      c.beginPath(); c.arc(f.x, f.y, rr, TOP + maxFrac*TAU, TOP + TAU); c.stroke();
      c.globalAlpha = 1;
    }
    /* The drain tail. The ghost lags the real value by a few tenths, so the
       segment between them is exactly the bite that was just taken — the size
       of a hit becomes something you watch happen rather than a number you
       have to read. Borrowed shamelessly from fighting games, where it has been
       solving this same problem for thirty years. */
    const ghostFrac = clamp((f.hpGhost ?? f.hp) / base, 0, 1);
    if (ghostFrac > hpFrac + 0.002){
      c.strokeStyle = "#FFE9C0";
      c.globalAlpha = 0.85;
      c.lineWidth = lw + 0.8;
      c.shadowColor = "#FF9A5A"; c.shadowBlur = 14;
      c.beginPath();
      c.arc(f.x, f.y, rr, TOP + hpFrac * TAU, TOP + ghostFrac * TAU); c.stroke();
      c.shadowBlur = 0; c.globalAlpha = 1;
    }

    if (hpFrac > 0.001){
      /* A conic gradient along the arc itself: near-black red at twelve
         o'clock brightening to hot red at the leading edge, with the light
         stop pinned to hpFrac so the brightest point is always the tip of the
         remaining life. Thin and glowing rather than thick and solid — at this
         size a heavy band reads as part of the relic's design, and a hairline
         with bloom reads as an instrument. */
      const low = hpFrac <= CONFIG.desperation.at;
      const g2 = c.createConicGradient(TOP, f.x, f.y);
      /* Even the darkest stop stays unmistakably red. Taking it down to near
         black made the head of the ring blend into the empty channel, so a
         relic at full health looked like it was missing a slice. */
      g2.addColorStop(0, "#7E0F12");
      g2.addColorStop(Math.max(0.001, hpFrac * 0.55), "#CE2018");
      g2.addColorStop(Math.max(0.002, hpFrac), "#FF8A5E");
      const rf = f.ringFlash || 0;
      c.strokeStyle = (f.mend > 0 || rf > 0.55) ? "#FFF4D0" : g2;
      c.globalAlpha = low ? 0.78 + Math.sin(m.t * 11) * 0.22 : 1;
      c.lineWidth = lw + (f.mend > 0 ? 1.2 : 0) + rf * 2.6;
      c.shadowColor = f.mend > 0 ? "#FFF4D0" : "#FF2E16";
      c.shadowBlur = f.mend > 0 ? 18 : (low ? 13 : 8) + rf * 26;
      c.beginPath(); c.arc(f.x, f.y, rr, TOP, TOP + hpFrac * TAU); c.stroke();
      c.shadowBlur = 0; c.globalAlpha = 1;

      /* The ember at the head of the arc. One bright moving point is worth
         more than any amount of extra ring: the eye locks onto it, and where
         it sits on the circle *is* the health value. */
      const ha = TOP + hpFrac * TAU;
      const hxp = f.x + Math.cos(ha) * rr, hyp = f.y + Math.sin(ha) * rr;
      c.save();
      c.globalCompositeOperation = "lighter";
      const eg = c.createRadialGradient(hxp, hyp, 0, hxp, hyp, 9 + rf * 8);
      eg.addColorStop(0, "#FFFFFF");
      eg.addColorStop(0.32, low ? "#FF5A3C" : "#FF9A5A");
      eg.addColorStop(1, "#FF3B2400");
      c.fillStyle = eg;
      c.beginPath(); c.arc(hxp, hyp, 9 + rf * 8, 0, TAU); c.fill();
      c.restore();
    }
    c.strokeStyle = "#07050CCC"; c.lineWidth = 1;     // quarter ticks
    for (const q of [0.25, 0.5, 0.75]){
      const a = TOP + q * TAU;
      c.beginPath();
      c.moveTo(f.x + Math.cos(a)*(rr-lw/2-1.4), f.y + Math.sin(a)*(rr-lw/2-1.4));
      c.lineTo(f.x + Math.cos(a)*(rr+lw/2+1.4), f.y + Math.sin(a)*(rr+lw/2+1.4));
      c.stroke();
    }
    c.restore();

    if (f.stun > 0){                                   // staggered
      c.save();
      c.globalAlpha = Math.min(0.85, f.stun * 4);
      c.strokeStyle = "#FFF4D0"; c.lineWidth = 3;
      for (let i = 0; i < 3; i++){
        const a = m.t * 9 + i * TAU/3;
        c.beginPath();
        c.arc(f.x, f.y, R*1.32, a, a + 0.7); c.stroke();
      }
      c.restore();
    }

    if (f.flash > 0){
      c.save();
      c.globalAlpha = f.flash * 0.85; c.fillStyle = "#FFFFFF";
      c.beginPath(); c.arc(f.x, f.y, R, 0, TAU); c.fill();
      c.restore();
    }

    this.drawStatus(m, f);
    });

    /* Name tag. With the HUD shrunk, "which one is which" is the one identity
       question left that still costs a saccade to the top of the frame. Loud
       for the first seconds, then a persistent whisper — enough to answer the
       question, not enough to compete with the fight. Sized in screen pixels
       (divided back out of the arena scale) so it does not balloon. */
    const k = 1 / this.scale;
    const tagA = f.stun > 0 ? 0.18
               : (m.t < 5 ? 0.9 : Math.max(0.22, 0.9 - (m.t - 5) * 0.34));
    c.save();
    c.globalAlpha = tagA;
    c.textAlign = "center";
    c.font = `800 ${17 * k}px ui-sans-serif,system-ui,sans-serif`;
    const ty = f.y + R + 21 * k;
    c.lineWidth = 5 * k; c.strokeStyle = "#000000AA";
    c.strokeText(f.w.name.toUpperCase(), f.x, ty);
    c.fillStyle = f.aff.core;
    c.fillText(f.w.name.toUpperCase(), f.x, ty);
    c.restore();
  }

  /* ------------------------------------------------------------ statuses ---
     Six relics, six statuses, and until now not one of them appeared on the
     ball. `stacks()` was read by the simulation and by a text chip in the HUD,
     so the thing being done to a relic was legible everywhere except on the
     relic — which is rule 5 exactly: the information was 1600px from the only
     thing anyone was watching.

     Each of these is built to say its own mechanic, not merely to say "a
     status is present". Light falls on Smite because it sears; blood leaves
     the shell because it bleeds; plates lift because armour is broken;
     tethers drag backwards along the line of travel because the swing is
     slowed; motes escape and do not come back because Curse eats maximum life
     for good; and Hex clamps the WEAPON, because the weapon is what it jams.
     Colour alone could not carry any of that — silhouette and motion carry it
     at thumbnail size, and they still carry it for a colour-blind viewer.

     Intensity tracks stacks, since stacks are a real mechanic and not a
     bookkeeping detail. Every position is a pure function of (side, index,
     m.t) through shellHash — never this.rng(), which would perturb the match. */
  drawStatus(m, f){
    const R = CONFIG.physics.ballR;
    let n;
    if ((n = f.stacks("smite")))      this._stSmite(m, f, R, n);
    if ((n = f.stacks("hemorrhage"))) this._stBleed(m, f, R, n);
    if ((n = f.stacks("sunder")))     this._stSunder(m, f, R, n);
    if ((n = f.stacks("entangle")))   this._stEntangle(m, f, R, n);
    if ((n = f.stacks("curse")))      this._stCurse(m, f, R, n);
    if ((n = f.stacks("hex")))        this._stHex(m, f, R, n);
    /* gated on the POOL, not on stacks -- the pool is the real state */
    if (f.shield > 0 || f.shatterFx > 0 || f.wardFade > 0 || f.spendFx > 0)
      this._stWard(m, f, R);
  }

  /* SMITE — it sears. Light comes down out of the hall and burns where it
     lands, so the damage-over-time has a visible source and a visible impact
     rather than being a tint on the shell. */
  /* WARD — FIVE PLATES, not an arc.
     v1 of this drew a continuous rose arc and the contact sheet killed it. Two
     findings, both structural rather than cosmetic:

     1. Ward is the FIRST status in the game drawn on its own school's ball.
        All six existing status animations hardcode the APPLYING school's
        colour (`#FFE7A8` smite, `#E0994A` sunder, `#A45CF0` curse) and land on
        the VICTIM, so they are always a different hue from what they sit on. A
        self-directed buff is same-on-same, and a rose ring on a rose ball has
        no contrast at all. **A self-buff must separate by VALUE, not by hue.**
        `_stSunder` already knew this — it lays `#150A04` under its plates. So
        every plate here gets a near-black outline first.
     2. At R+9 it was fighting the health ring for the same annulus. R+17.

     The two reads, restated as discrete things a viewer can count:
       HOW MUCH IS LEFT  the number of plates still on. Countable, not judged.
       HOW LONG IS LEFT  the hot rim. Lit while fresh, gone when the clock is
                         nearly out and the plate faces go dull. A switch, not
                         a gradient — a gradient is not readable in motion. */
  _stWard(m, f, R){
    const c = this.ctx, P = AFFINITIES.vigil, W = STATUS.ward;
    const st   = f.status.ward;
    const life = st ? clamp(st.t / W.dur, 0, 1) : 0;
    const frac = clamp(f.shield / W.cap, 0, 1);
    const N = 5, seg = TAU / N, gap = seg * 0.24, rr = R + 17;
    const EDGE = "#1A0512", DULL = "#7E4A66";

    if (f.shield > 0){
      const lit   = Math.max(1, Math.ceil(frac * N));
      const fresh = life > 0.34;
      c.save(); c.translate(f.x, f.y); c.lineCap = "butt";
      for (let i = 0; i < lit; i++){
        const a0 = -Math.PI/2 + i*seg + gap/2, a1 = a0 + seg - gap;
        c.globalAlpha = 1; c.shadowBlur = 0;
        c.strokeStyle = EDGE; c.lineWidth = 15;          // the value break
        c.beginPath(); c.arc(0,0, rr, a0, a1); c.stroke();
        c.strokeStyle = P.dark; c.lineWidth = 11;        // plate body
        c.beginPath(); c.arc(0,0, rr, a0, a1); c.stroke();
        c.strokeStyle = fresh ? P.core : DULL;           // face
        c.lineWidth = 6;
        c.beginPath(); c.arc(0,0, rr - 0.5, a0, a1); c.stroke();
        if (fresh){                                      // hot rim = time left
          c.strokeStyle = P.glow; c.lineWidth = 2.0;
          c.shadowColor = P.core; c.shadowBlur = 14;
          c.beginPath(); c.arc(0,0, rr - 4.2, a0 + 0.03, a1 - 0.03); c.stroke();
        }
      }
      c.restore();
    }

    /* THE BREAK — the same five plates, thrown outward and tumbling. Drawn as
       arc chunks rather than generic streaks so the eye connects them to what
       was just there: that armour, coming off. */
    if (f.shatterFx > 0){
      const k = f.shatterFx, t = 1 - k;
      c.save(); c.translate(f.x, f.y); c.lineCap = "butt";
      c.globalAlpha = k;
      for (let i = 0; i < N; i++){
        const spin = t * 0.55 * (i % 2 ? 1 : -1);
        const a0 = -Math.PI/2 + i*seg + gap/2 + spin;
        const a1 = a0 + (seg - gap) * (1 - t * 0.35);
        const r  = rr + t * 58;
        c.shadowBlur = 0;
        c.strokeStyle = EDGE;  c.lineWidth = 15;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
        c.strokeStyle = P.core; c.lineWidth = 8;
        c.shadowColor = P.core; c.shadowBlur = 22 * k;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
      }
      c.restore();
    }

    /* THE SPEND — the third ending, and the only one the relic chose. The
       plates do not scatter and they do not go out: they detach as a ring,
       accelerate along the shot's line and TIGHTEN as they go, because where
       they are going is around the shaft of the arrow. The viewer sees the
       shield leave, and then sees it arrive on the other side of the hall.
       That is the entire mechanic, on screen, with nothing to caption. */
    if (f.spendFx > 0){
      const k = f.spendFx, t = 1 - k;
      const ca = Math.cos(f.spendA || 0), sa = Math.sin(f.spendA || 0);
      const dist = t * t * 165;                       // accelerating away
      const r = rr - t * 22;                          // and closing on the shaft
      const w = 1 - t * 0.45;
      c.save();
      c.translate(f.x + ca * dist, f.y + sa * dist);
      c.lineCap = "butt";
      c.globalAlpha = k * k;
      for (let i = 0; i < N; i++){
        const a0 = -Math.PI/2 + i*seg + gap/2, a1 = a0 + (seg - gap) * (1 - t * 0.4);
        c.shadowBlur = 0;
        c.strokeStyle = EDGE;   c.lineWidth = 15 * w;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
        c.strokeStyle = P.glow; c.lineWidth = 7 * w;
        c.shadowColor = P.core; c.shadowBlur = 26 * k;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
      }
      c.restore();
    }

    /* THE EXPIRY — the opposite motion, on purpose. The plates settle INWARD
       and go out. Nothing is thrown, nobody is hit. A viewer who has seen one
       break cannot mistake this for one, and that distinction is the whole
       reason the pool and the clock are two separate reads. */
    if (f.wardFade > 0){
      const k = f.wardFade, t = 1 - k;
      c.save(); c.translate(f.x, f.y); c.lineCap = "butt";
      c.globalAlpha = k;
      for (let i = 0; i < N; i++){
        const a0 = -Math.PI/2 + i*seg + gap/2, a1 = a0 + seg - gap;
        const r  = rr - t * 15;
        c.shadowBlur = 0;
        c.strokeStyle = EDGE; c.lineWidth = 15 * k;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
        c.strokeStyle = DULL; c.lineWidth = 6 * k;
        c.beginPath(); c.arc(0,0, r, a0, a1); c.stroke();
      }
      c.restore();
    }
  }

  _stSmite(m, f, R, n){
    const c = this.ctx, N = Math.min(4, n) * 2;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    const bolts = new Path2D();
    for (let i = 0; i < N; i++){
      const ph = (m.t * 1.55 + shellHash(701 + f.side, i)) % 1;
      const a  = (shellHash(733 + f.side, i) - 0.5) * 1.8 - Math.PI / 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const fall = (1 - ph) * R * 3.0;
      bolts.moveTo(f.x + ca * (R * 0.86 + fall), f.y + sa * (R * 0.86 + fall));
      bolts.lineTo(f.x + ca * (R * 0.86 + fall * 0.42), f.y + sa * (R * 0.86 + fall * 0.42));
    }
    c.strokeStyle = "#FFE7A8"; c.globalAlpha = 0.55; c.lineWidth = 2.2;
    c.stroke(bolts);
    for (let i = 0; i < N; i++){
      const ph = (m.t * 1.55 + shellHash(701 + f.side, i)) % 1;
      if (ph < 0.70) continue;
      const a  = (shellHash(733 + f.side, i) - 0.5) * 1.8 - Math.PI / 2;
      const k2 = (ph - 0.70) / 0.30;
      c.globalAlpha = (1 - k2) * 0.95;
      c.fillStyle = "#FFF6DC";
      c.beginPath();
      c.arc(f.x + Math.cos(a) * R * 0.9, f.y + Math.sin(a) * R * 0.9,
            1.8 + 5.4 * k2, 0, TAU);
      c.fill();
    }
    c.restore();
  }

  /* HEMORRHAGE — it bleeds. Drops well at the underside and fall away, which
     now that the hall has gravity is the direction they should already be
     going. The shell keeps losing something; that is the mechanic. */
  _stBleed(m, f, R, n){
    const c = this.ctx, N = Math.min(4, n) * 2;
    c.save();
    c.lineCap = "round";
    c.globalAlpha = 0.5; c.strokeStyle = "#7E0F14"; c.lineWidth = 3.6;
    c.beginPath(); c.arc(f.x, f.y, R * 0.94, 0.30, Math.PI - 0.30); c.stroke();
    for (let i = 0; i < N; i++){
      const ph = (m.t * 0.82 + shellHash(811 + f.side, i)) % 1;
      const a  = 0.44 + shellHash(829 + f.side, i) * (Math.PI - 0.88);
      const sx = f.x + Math.cos(a) * R * 0.95, sy = f.y + Math.sin(a) * R * 0.95;
      const fall = ph * ph * R * 2.5;                  // it accelerates
      const rad  = (0.35 + 0.65 * Math.min(1, ph * 3)) * (1 - ph * 0.4) * 3.2;
      c.globalAlpha = clamp((1 - ph) * 1.7, 0, 1);
      c.strokeStyle = "#8E1226"; c.lineWidth = rad * 0.85;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx, sy + fall * 0.6); c.stroke();
      c.fillStyle = "#C0122A";
      c.beginPath(); c.arc(sx, sy + fall, rad, 0, TAU); c.fill();
    }
    c.restore();
  }

  /* SUNDER — the armour is off. Plates lift away from the shell and the dark
     gap they came out of stays behind, so "+11% damage taken" reads as a hole
     in the thing rather than as a number nobody was going to read. */
  _stSunder(m, f, R, n){
    const c = this.ctx, N = Math.min(6, n);
    c.save();
    for (let i = 0; i < N; i++){
      const a = shellHash(907 + f.side, i) * TAU;
      const wid = 0.30 + shellHash(929 + f.side, i) * 0.24;
      const lift = 3.6 + Math.sin(m.t * 3.1 + i * 1.9) * 1.2;
      c.globalAlpha = 0.9; c.fillStyle = "#150A04";
      c.beginPath();
      c.arc(f.x, f.y, R * 0.99, a - wid / 2, a + wid / 2);
      c.arc(f.x, f.y, R * 0.79, a + wid / 2, a - wid / 2, true);
      c.closePath(); c.fill();
      c.save();
      c.translate(Math.cos(a) * lift, Math.sin(a) * lift);
      c.globalAlpha = 0.96; c.fillStyle = "#6B4A2A";
      c.beginPath();
      c.arc(f.x, f.y, R * 1.03, a - wid / 2, a + wid / 2);
      c.arc(f.x, f.y, R * 0.86, a + wid / 2, a - wid / 2, true);
      c.closePath(); c.fill();
      c.strokeStyle = "#E0994A"; c.lineWidth = 1.2; c.stroke();
      c.restore();
    }
    c.restore();
  }

  /* ENTANGLE — it is being held back. The tethers trail along the line of
     travel and stretch as the relic pulls against them, so the slow is a
     force you can see acting rather than a percentage. */
  _stEntangle(m, f, R, n){
    const c = this.ctx, N = Math.min(4, n);
    const sp = Math.hypot(f.vx, f.vy) || 1;
    const bx = -f.vx / sp, by = -f.vy / sp;      // straight behind it
    const nx = -by, ny = bx;                     // across the line of travel
    c.save();
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < N; i++){
      const off = (N < 2 ? 0 : (i / (N - 1) - 0.5)) * 1.3;
      const len = R * (2.5 + 0.4 * shellHash(1013 + f.side, i))
                    * (0.86 + 0.14 * Math.sin(m.t * 3.2 + i * 1.4));
      const ax = f.x + bx * R * 0.84 + nx * off * R * 0.78;
      const ay = f.y + by * R * 0.84 + ny * off * R * 0.78;
      const ex = ax + bx * len + nx * off * R * 0.75;
      const ey = ay + by * len + ny * off * R * 0.75;
      const bow = Math.sin(m.t * 2.4 + i * 1.7) * R * 0.20;
      const mx = (ax + ex) / 2 + nx * bow, my = (ay + ey) / 2 + ny * bow;
      c.globalAlpha = 0.94; c.strokeStyle = "#0E2F16"; c.lineWidth = 5.4;
      c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
      c.globalAlpha = 0.92; c.strokeStyle = "#4FD06B"; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
      c.fillStyle = "#BCF7C7"; c.globalAlpha = 0.95;
      for (let t = 1; t <= 3; t++){          // thorns, barbed against the pull
        const u = t / 4, v = 1 - u;
        const px = v*v*ax + 2*v*u*mx + u*u*ex, py = v*v*ay + 2*v*u*my + u*u*ey;
        c.beginPath();
        c.moveTo(px + nx * 4.6, py + ny * 4.6);
        c.lineTo(px - bx * 6.2, py - by * 6.2);
        c.lineTo(px - nx * 4.6, py - ny * 4.6);
        c.closePath(); c.fill();
      }
    }
    /* One band, across the line of travel, because that is the direction the
       hold is acting in. Two arbitrary arcs read as decoration; a strap laid
       across the path reads as something catching. */
    const a0 = Math.atan2(ny, nx);
    for (const [wid, col] of [[6.2, "#0E2F16"], [2.6, "#4FD06B"]]){
      c.globalAlpha = 0.95; c.strokeStyle = col; c.lineWidth = wid;
      c.beginPath(); c.arc(f.x, f.y, R * 0.9, a0 - 1.25, a0 + 1.25); c.stroke();
      c.beginPath(); c.arc(f.x, f.y, R * 0.9, a0 + Math.PI - 1.25, a0 + Math.PI + 1.25);
      c.stroke();
    }
    c.restore();
  }

  /* CURSE — it is gone for good. Motes leave the relic and keep going; they
     never settle and never return, which is the only status here that is
     permanent. The gnaw rides the edge of the life already eaten, so the ring
     shows where it has got to. */
  _stCurse(m, f, R, n){
    const c = this.ctx, N = Math.min(8, n) * 3;
    /* A shroud pulled tight against the inside of the shell. The motes alone
       were nearly invisible at phone size — a permanent effect has to be
       readable in the frame it is looked at, not only in a still. */
    c.save();
    c.globalAlpha = 0.30 + Math.sin(m.t * 2.3) * 0.10;
    c.strokeStyle = "#2A0B47"; c.lineWidth = R * 0.30;
    c.beginPath(); c.arc(f.x, f.y, R * 0.86, 0, TAU); c.stroke();
    c.restore();
    c.save();
    c.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++){
      const ph = (m.t * 0.46 + shellHash(1103 + f.side, i)) % 1;
      const a  = shellHash(1117 + f.side, i) * TAU;
      const rr = R * (0.80 + ph * 1.5);
      c.globalAlpha = (1 - ph) * (1 - ph * 0.4) * 0.95;
      c.fillStyle = ph < 0.35 ? "#E4CCFF" : "#A45CF0";
      const px = f.x + Math.cos(a) * rr, py = f.y + Math.sin(a) * rr - ph * ph * 34;
      c.beginPath(); c.arc(px, py, 3.6 * (1 - ph * 0.55), 0, TAU); c.fill();
      if (ph < 0.5){                       // a wisp, so it reads as leaving
        c.globalAlpha *= 0.55;
        c.strokeStyle = "#A45CF0"; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(px, py); c.lineTo(px, py + 9); c.stroke();
      }
    }
    c.restore();
    const maxFrac = clamp(f.maxHp / CONFIG.combat.baseHP, 0, 1);
    if (maxFrac < 1){
      const a = -Math.PI / 2 + maxFrac * TAU;
      c.save();
      c.globalAlpha = 0.55 + Math.sin(m.t * 5.5) * 0.30;
      c.strokeStyle = AFFINITIES.umbral.glow; c.lineWidth = 4.2; c.lineCap = "round";
      c.beginPath(); c.arc(f.x, f.y, R * 0.80, a - 0.30, a + 0.08); c.stroke();
      c.restore();
    }
  }

  /* HEX — the weapon is jammed, so the clamp goes on the WEAPON. Putting it on
     the ball would have said "something is wrong with this relic"; putting it
     on the haft says which thing, and when it actually bites the jaws snap
     shut on exactly the frames the swing is locked. */
  _stHex(m, f, R, n){
    const c = this.ctx, N = Math.min(5, n);
    const reach = f.w.reach * m.actMods.reach;
    const px = f.x + Math.cos(f.theta) * reach * 0.52;
    const py = f.y + Math.sin(f.theta) * reach * 0.52;
    const jam = f.stun > 0;
    const shut = jam ? 1 : 0.30 + Math.sin(m.t * 2.2) * 0.08;
    const rr = 26 - shut * 10;
    c.save();
    c.lineCap = "round";
    c.translate(px, py); c.rotate(f.theta);
    /* Two jaws closing across the haft, not a ring around it. A ring reads as
       a marker; jaws read as a thing being held shut, which is the mechanic. */
    const gap = (1 - shut) * 13 + 3;
    for (const sgn of [-1, 1]){
      c.globalAlpha = 0.55 + shut * 0.45;
      c.strokeStyle = "#0E2136"; c.lineWidth = 8.5;
      c.beginPath(); c.arc(0, sgn * gap, rr, sgn > 0 ? 0 : Math.PI,
                           sgn > 0 ? Math.PI : TAU); c.stroke();
      c.strokeStyle = jam ? "#FFFFFF" : "#4A9EFF"; c.lineWidth = 3.4;
      c.beginPath(); c.arc(0, sgn * gap, rr, sgn > 0 ? 0 : Math.PI,
                           sgn > 0 ? Math.PI : TAU); c.stroke();
    }
    /* glyph ticks, one per stack, riding the jaws */
    c.strokeStyle = "#BCDDFF"; c.lineWidth = 2.2;
    c.globalAlpha = 0.8 + shut * 0.2;
    for (let i = 0; i < N; i++){
      const a = m.t * (jam ? 0.5 : 1.6) + i * TAU / N;
      c.beginPath();
      c.moveTo(Math.cos(a) * (rr + 2), Math.sin(a) * (rr + 2));
      c.lineTo(Math.cos(a) * (rr + 9 + shut * 5), Math.sin(a) * (rr + 9 + shut * 5));
      c.stroke();
    }
    if (jam){                              // the frames the swing is actually locked
      c.globalAlpha = Math.min(1, f.stun * 5);
      c.strokeStyle = "#FFFFFF"; c.lineWidth = 3.2;
      c.beginPath(); c.arc(0, 0, rr + 11, 0, TAU); c.stroke();
      c.lineWidth = 5; c.globalAlpha *= 0.8;
      c.beginPath(); c.moveTo(-rr * 0.7, 0); c.lineTo(rr * 0.7, 0); c.stroke();
    }
    c.restore();
  }

  drawWeapon(m, f){
    const c = this.ctx, R = CONFIG.physics.ballR;
    const pal = f.aff;
    const reach = f.w.reach * m.actMods.reach;
    const dim = f.stun > 0 ? 0.42 : 1;

    if (f.w.mode === "chain"){
      /* chain links from the relic to the head, then the head itself */
      c.save();
      c.globalAlpha = dim;
      /* The chain bows. When the head is at full extension it pulls taut; when
         it is swinging in slack it sags backwards against the direction of
         travel. Drawing it as a straight line was most of why the old flail
         looked like a stick with a ball glued to the end. */
      /* Haft first — a rigid handle turning with the weapon — then the chain
         hanging off its tip. The chain used to come straight out of the middle
         of the relic, which is why the head read as orbiting the ball instead
         of being swung. */
      /* Three separate objects, drawn as three separate objects: a haft you
         could hold, a chain of interlocking links, and a head hung off the
         last one.

         The previous pass had the geometry right and still did not read as a
         flail, and the reason was the chain: it was a line of round beads,
         which is a necklace. Chain is legible because of the *links* —
         elongated rings alternating flat/edge-on, with daylight through them.
         That, a swivel eye at the haft tip and a hanging loop on the head are
         what the eye is actually looking for. */
      const C = CONFIG.chain;
      const px = f.pivX ?? f.x, py = f.pivY ?? f.y;
      const ux0 = Math.cos(f.theta), uy0 = Math.sin(f.theta);
      const hx0 = f.x + ux0 * R * 0.40, hy0 = f.y + uy0 * R * 0.40;
      const hw = f.w.width * 0.26;

      c.save();
      c.lineCap = "butt"; c.lineJoin = "round";
      /* haft: tapered, dark underside, lit top edge, wrapped grip */
      const nx0 = -uy0, ny0 = ux0;
      const quad = (w0, w1, fill) => {
        c.beginPath();
        c.moveTo(hx0 + nx0*w0, hy0 + ny0*w0);
        c.lineTo(px  + nx0*w1, py  + ny0*w1);
        c.lineTo(px  - nx0*w1, py  - ny0*w1);
        c.lineTo(hx0 - nx0*w0, hy0 - ny0*w0);
        c.closePath(); c.fillStyle = fill; c.fill();
      };
      quad(hw * 1.35, hw * 0.95, "#2C242F");
      quad(hw * 1.00, hw * 0.66, pal.steel);
      c.globalAlpha = 0.45; quad(hw * 0.34, hw * 0.22, "#FFFFFF"); c.globalAlpha = 1;
      c.strokeStyle = "#00000066"; c.lineWidth = hw * 0.34;      // grip wrap
      for (let i = 1; i <= 5; i++){
        const t = 0.10 + i * 0.11;
        const gx = hx0 + (px - hx0) * t, gy = hy0 + (py - hy0) * t;
        c.beginPath();
        c.moveTo(gx + nx0*hw*1.0, gy + ny0*hw*1.0);
        c.lineTo(gx - nx0*hw*1.0, gy - ny0*hw*1.0);
        c.stroke();
      }
      c.fillStyle = "#5B5060";                                   // pommel
      c.beginPath(); c.arc(hx0, hy0, hw * 1.5, 0, TAU); c.fill();
      c.fillStyle = pal.core;
      c.beginPath(); c.arc(hx0, hy0, hw * 0.6, 0, TAU); c.fill();

      const dx = f.headX - px, dy = f.headY - py;
      const d = Math.hypot(dx, dy) || 1;
      const chainLen = reach * (1 - C.hilt);
      const slack = clamp(1 - d / chainLen, 0, 1);
      const trail = -Math.sign(f.headAngVel || 1);
      const bow = slack * chainLen * 0.55 * trail;
      const mx = px + dx*0.5 - (dy/d) * bow;
      const my = py + dy*0.5 + (dx/d) * bow;
      const at = t => {                              // quadratic Bezier
        const u = 1 - t;
        return [u*u*px + 2*u*t*mx + t*t*f.headX,
                u*u*py + 2*u*t*my + t*t*f.headY];
      };

      /* the swivel the chain hangs from */
      c.strokeStyle = "#8E8496"; c.lineWidth = hw * 0.5;
      c.beginPath(); c.arc(px, py, hw * 1.05, 0, TAU); c.stroke();
      c.fillStyle = "#3A3038";
      c.beginPath(); c.arc(px, py, hw * 0.5, 0, TAU); c.fill();

      /* the links */
      const links = 5, LR = f.w.width * 0.31;
      for (let i = 1; i <= links; i++){
        const t = i / (links + 0.6);
        const [lx, ly] = at(t);
        const [ax2, ay2] = at(Math.min(1, t + 0.02));
        const rot = Math.atan2(ay2 - ly, ax2 - lx);
        const edge = i % 2 === 0;
        c.save();
        c.translate(lx, ly); c.rotate(rot);
        c.lineWidth = LR * 0.44;
        c.strokeStyle = "#241E29";
        c.beginPath(); c.ellipse(0, 0, LR * 1.28, edge ? LR * 0.34 : LR * 0.82, 0, 0, TAU);
        c.stroke();
        c.strokeStyle = edge ? "#7E7488" : "#B3AABD";
        c.lineWidth = LR * 0.26;
        c.beginPath(); c.ellipse(0, 0, LR * 1.20, edge ? LR * 0.30 : LR * 0.76, 0, 0, TAU);
        c.stroke();
        c.restore();
      }
      c.restore();

      /* the loop the head hangs from */
      const [tx2, ty2] = at(0.90);
      c.save();
      c.strokeStyle = "#9A90A4"; c.lineWidth = f.w.width * 0.10;
      c.beginPath();
      c.arc((tx2 + f.headX)/2, (ty2 + f.headY)/2, f.w.width * 0.20, 0, TAU);
      c.stroke();
      c.restore();

      c.translate(f.headX, f.headY);
      c.shadowColor = pal.core; c.shadowBlur = 22;
      /* The flail head is drawn on its own path -- it never reaches the blades
         loop below -- so it needs the hoisted light wired separately or it stays
         the one shape in the game with no world lighting at all. `ang` is 0:
         the head does not ride a rotated arm, it hangs, so the caller's frame
         is already world-aligned. */
      if (!litWeapon(c, 'flailHead', f.w.artW, f.w.artW, pal, f.headSpin, 0)){
        SHAPES.flailHead(c, f.w.artW, pal, f.headSpin);
      }
      c.restore();
      return;
    }

    for (const off of f.w.blades){
      const a = f.theta + off * TAU;
      c.save();
      c.globalAlpha = dim;
      c.translate(f.x, f.y);
      c.rotate(a);
      c.translate(R - 6, 0);
      /* The glow, pre-blurred and blitted; then the shape, with no shadow.
         `lighter` because a glow is light being added, which is also what
         shadowBlur was doing here -- the sprite carries the shape's own
         colour so the sum is the same bloom for one drawImage. */
      /* Blitted with the caller's own composite operation, for the reason in
         the glyph note below: a shadow is not additive, and forcing `lighter`
         sums overlaps that used to occlude each other. */
      const _g = weaponGlow(f.w.shape, reach + 6, f.w.artW, pal, f.drawK, 20);
      c.drawImage(_g.cv, _g.ox, _g.oy);
      if (!litWeapon(c, f.w.shape, reach + 6, f.w.artW, pal, f.drawK, a)){
        const fn = SHAPES[f.w.shape];
        if (fn) fn(c, reach + 6, f.w.artW, pal, f.drawK);
      }
      if (f.ultDraw){
        /* At the nock, in the weapon's own rotated frame, so it rides the
           bow round rather than sitting on the ball.

           v1 was near-white at full blur from the first frame and read as a
           headlight rather than as a bowstring under load -- Rick, on the
           contrast sheet. It is the SCHOOL colour now, not the glow, and
           the alpha ramps quadratically so the early draw is a hint and the
           late draw is a statement. The white centre only arrives in the
           last quarter, which is the snap before the release: the one frame
           that should be loud is the one just before the arrow leaves. */
        const kk = clamp(f.ultDraw.t / f.ultDraw.dur, 0, 1);
        const nx0 = (reach + 6) * 0.24 - (reach + 6) * 0.20 * kk;
        c.save();
        c.globalCompositeOperation = "lighter";
        c.globalAlpha = kk * kk;
        c.fillStyle = pal.core;
        c.shadowColor = pal.core; c.shadowBlur = 4 + 14 * kk;
        c.beginPath(); c.arc(nx0, 0, 1.5 + 3.4 * kk, 0, TAU); c.fill();
        if (kk > 0.75){
          c.globalAlpha = (kk - 0.75) / 0.25;
          c.fillStyle = "#FFF4D0"; c.shadowBlur = 8;
          c.beginPath(); c.arc(nx0, 0, 1.6, 0, TAU); c.fill();
        }
        c.restore();
      }
      c.restore();
    }
  }

  /* ---------------------------------------------------------------- fx --- */
  /* Sparks are drawn as streaks along their own velocity, not as dots. Dots at
     this density read as grey smoke; streaks read as struck metal. */
  /* A bolt is drawn as a STREAK, not a dot. Two reasons, both legibility: a dot
     at 660 units/s strobes into a dotted line at 60fps and reads as several
     objects, and a streak states the direction of travel, which is what the
     viewer needs in order to predict whether it will connect.

     PROPORTION IS THE WHOLE THING, and the first contact sheet is what said so.
     v1 used a 36-long tail at 11 wide — a 3:1 lozenge, which read as a glowing
     PILL rather than as anything fired from a bow. Long and thin is not a
     stylistic preference here: an arrow is the most recognisable projectile
     silhouette there is, and it is recognisable entirely by aspect ratio.
     ~9:1, a hard dart head, and the tail falling to nothing behind it. */
  drawShots(m){
    if (!m.shots.length) return;
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "butt";
    for (const s of m.shots){
      const sp = Math.hypot(s.vx, s.vy) || 1;
      const tl = Math.min(88, sp * 0.105);
      const ux = s.vx / sp, uy = s.vy / sp;
      const nx = -uy, ny = ux;
      const g = c.createLinearGradient(s.x - ux*tl, s.y - uy*tl, s.x, s.y);
      g.addColorStop(0,    s.aff.dark + "00");
      g.addColorStop(0.55, s.aff.core + "88");
      g.addColorStop(1,    s.aff.glow);
      c.strokeStyle = g;
      c.lineWidth = s.r * 0.30;
      c.beginPath();
      c.moveTo(s.x - ux*tl, s.y - uy*tl); c.lineTo(s.x, s.y); c.stroke();
      /* The head: a dart, not a disc. The leading edge decides the hit, so it
         is the brightest and the sharpest thing on the object. */
      /* THE WARD, IN FLIGHT. One plate per fifth of the pool that was
         spent, formed up around the shaft. The viewer watched five plates
         leave the ball; these are those plates. Countable, not judged --
         the same reason the ward itself is five discrete plates on the
         shell rather than a continuous arc. */
      for (let i = 0; i < (s.plates || 0); i++){
        const off = (i - (s.plates - 1) / 2) * s.r * 0.62;
        const back = s.r * (0.30 + Math.abs(off) / (s.r * 2.2));
        const cx = s.x + nx*off - ux*back, cy = s.y + ny*off - uy*back;
        c.strokeStyle = s.aff.glow; c.lineWidth = s.r * 0.16;
        c.beginPath();
        c.moveTo(cx - nx*s.r*0.22 - ux*s.r*0.26, cy - ny*s.r*0.22 - uy*s.r*0.26);
        c.lineTo(cx + ux*s.r*0.30,               cy + uy*s.r*0.30);
        c.lineTo(cx + nx*s.r*0.22 - ux*s.r*0.26, cy + ny*s.r*0.22 - uy*s.r*0.26);
        c.stroke();
      }
      c.fillStyle = "#FFF4D0";
      c.beginPath();
      c.moveTo(s.x + ux*s.r*1.05,               s.y + uy*s.r*1.05);
      c.lineTo(s.x - ux*s.r*0.55 + nx*s.r*0.42, s.y - uy*s.r*0.55 + ny*s.r*0.42);
      c.lineTo(s.x - ux*s.r*0.20,               s.y - uy*s.r*0.20);
      c.lineTo(s.x - ux*s.r*0.55 - nx*s.r*0.42, s.y - uy*s.r*0.55 - ny*s.r*0.42);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  drawFx(m){
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    for (const p of m.fx){
      const k = clamp(p.life / p.max, 0, 1);
      c.globalAlpha = k * 0.92;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 40){
        const tail = Math.min(0.030, 16 / sp);
        c.strokeStyle = p.c;
        c.lineWidth = p.r * 0.80 * (0.35 + k * 0.65);
        c.beginPath();
        c.moveTo(p.x, p.y);
        c.lineTo(p.x - p.vx * tail, p.y - p.vy * tail);
        c.stroke();
      } else {
        c.fillStyle = p.c;
        c.beginPath(); c.arc(p.x, p.y, p.r * 0.55 * k, 0, TAU); c.fill();
      }
    }
    c.restore();
  }

  drawRings(m){
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    for (const r of m.rings){
      const k = 1 - clamp(r.life / r.max, 0, 1);
      const rad = lerp(r.r, r.r1, k * k * 0.7 + k * 0.3);
      c.globalAlpha = (1 - k) * 0.75;
      c.strokeStyle = r.c; c.lineWidth = r.w * (1 - k * 0.7);
      c.beginPath(); c.arc(r.x, r.y, rad, 0, TAU); c.stroke();
    }
    c.restore();
  }

  /* Floats live in arena space but must not grow with the arena scale, so
     every size is divided back out. Otherwise a damage number is 70px tall. */
  drawFloats(m){
    const c = this.ctx, k = 1 / this.scale;
    c.save();
    c.textAlign = "center";
    for (const f of m.floats){
      c.globalAlpha = clamp(f.life, 0, 1);
      c.font = `800 ${f.size * k}px ui-sans-serif,system-ui,sans-serif`;
      c.lineWidth = 7 * k; c.strokeStyle = "#000000BB";
      c.strokeText(f.text, f.x, f.y);
      c.fillStyle = f.c; c.fillText(f.text, f.x, f.y);
    }
    c.restore();
  }

  /* Status tags, at the point of contact.

     Both of these live in arena space so they land exactly where the weapon
     met the shell, but every size below is a DEVICE pixel multiplied by k, so
     the text does not grow with the hall the way the geometry does. */
  drawTags(m){
    if (!m.tags.length) return;
    const c = this.ctx, k = 1 / this.scale, A = CONFIG.arena;
    c.save();
    for (const g of m.tags){
      const age = g.max - g.life;
      if (g.first) this._tagFirst(c, g, age, k, A);
      else         this._tagQuick(c, g, age, k, A);
    }
    c.restore();
  }

  /* Every application after the first: the name, and nothing else. */
  _tagQuick(c, g, age, k, A){
    const pop  = age < 0.09 ? 0.5 + 0.5 * (age / 0.09)
                            : 1 + 0.07 * Math.exp(-(age - 0.09) * 11);
    const fade = clamp(g.life / 0.32, 0, 1);
    /* DOWNWARD, not up. The damage number spawns at this same point and
       rises, so a status tag that also rises lands on top of it and neither is
       readable — which was true of the first version of this. The number goes
       up, the name goes down, and both stay at the contact point. */
    const rise = (34 + 46 * (1 - Math.exp(-age * 4.6)) + g.off * 0.5) * k;
    const label = g.name.toUpperCase();
    const x = clamp(g.x, 110 * k, A.w - 110 * k), y = g.y + rise;
    c.save();
    c.textAlign = "center";
    c.globalAlpha = clamp(fade, 0, 1);
    c.font = `800 ${28 * pop * k}px ui-sans-serif,system-ui,sans-serif`;
    c.lineWidth = 7 * k; c.strokeStyle = "#000000D0";
    c.strokeText(label, x, y);
    c.fillStyle = g.c;
    c.fillText(label, x, y);
    /* The rule under the word is what survives the thumbnail. At phone scale
       28px of tracking-tight caps is a smudge; a bar of the school's colour
       is still a bar, and it is the colour that names the status. */
    const w = c.measureText(label).width;
    c.fillRect(x - w / 2, y + 6 * k, w, 3.4 * k);
    c.restore();
  }

  /* The first time this status has ever landed in this match: the name plus
     the one line, at the contact point, held long enough to be read. */
  _tagFirst(c, g, age, k, A){
    const inK  = clamp(age / 0.15, 0, 1);
    const pop  = 0.74 + 0.26 * (1 - Math.pow(1 - inK, 3));
    const fade = clamp(g.life / 0.45, 0, 1) * inK;
    const w = 596 * k, h = 92 * k;
    const x = clamp(g.x - w / 2, 6, A.w - w - 6);
    let   y = g.low ? A.h - h - 30 : g.y - (150 + g.off) * k;
    if (y < 6) y = g.y + 74 * k;                    // struck near the ceiling
    y = clamp(y, 6, A.h - h - 6);
    c.save();
    c.globalAlpha = clamp(fade, 0, 1);
    c.translate(x + w / 2, y + h / 2); c.scale(pop, pop);
    c.translate(-(x + w / 2), -(y + h / 2));
    c.fillStyle = "#0B0812F2";
    this.roundRect(x, y, w, h, 9 * k); c.fill();
    c.strokeStyle = g.c + "AA"; c.lineWidth = 2 * k;
    this.roundRect(x, y, w, h, 9 * k); c.stroke();
    c.fillStyle = g.c;
    this.roundRect(x, y, 8 * k, h, 4 * k); c.fill();
    c.textAlign = "left";
    c.font = `800 ${28 * k}px ui-sans-serif,system-ui,sans-serif`;
    c.fillStyle = g.c;
    c.fillText(g.name.toUpperCase(), x + 30 * k, y + 39 * k);
    c.font = `500 ${25 * k}px ui-sans-serif,system-ui,sans-serif`;
    c.fillStyle = "#C6BBA9";
    c.fillText(g.tip, x + 30 * k, y + 73 * k);
    c.restore();
  }

  /* --------------------------------------------------------------- hud --- */
  drawHud(m){
    this.drawBar(m, m.a, 14);
    this.drawBar(m, m.b, 86);
  }

  /* No health bar. Health is on the relic. What is left here is the identity
     and the two things that would be illegible on a ball moving at 2500px/s:
     the ultimate charge, and the named status chips. */
  drawBar(m, f, y){
    const c = this.ctx;
    const pad = 34;
    const cf = clamp(f.charge / f.w.ult.charge, 0, 1);
    const hot = cf > 0.85;

    /* A colour swatch, so the name binds to the ball without reading a word. */
    c.save();
    c.fillStyle = f.aff.core;
    c.shadowColor = f.aff.core; c.shadowBlur = 16;
    c.beginPath(); c.arc(pad + 11, y + 26, 11, 0, TAU); c.fill();
    c.restore();

    c.save();
    c.font = "700 38px ui-serif,Georgia,serif";
    c.fillStyle = "#EDE3D0"; c.textAlign = "left";
    c.fillText(f.w.name.toUpperCase(), pad + 32, y + 38);
    c.font = "700 17px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#6E6378";
    c.fillText(f.aff.name.toUpperCase(), pad + 34, y + 62);
    c.restore();

    /* ult charge, right-aligned */
    const cw = 300, cx = this.W - pad - cw;
    c.save();
    c.textAlign = "right";
    c.font = "700 18px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = hot ? "#FFF4D0" : "#6E6378";
    c.fillText(f.w.ult.name.toUpperCase() + (hot ? "  READY" : ""), this.W - pad, y + 26);
    c.fillStyle = "#191424";
    this.roundRect(cx, y + 36, cw, 9, 4); c.fill();
    c.fillStyle = hot ? "#FFF4D0" : f.aff.glow;
    if (hot){ c.shadowColor = "#FFF4D0"; c.shadowBlur = 14; }
    this.roundRect(cx, y + 36, cw * cf, 9, 4); c.fill();
    c.restore();

    /* The named status chips used to live here.

       They existed because a status was illegible on a ball moving at
       2500px/s — which was true when the ball said nothing. Now every status
       animates on the thing it is happening to, and a text chip 1600px away
       from the fight is the health bar all over again: accurate, well drawn,
       and nowhere near where anyone is looking. Removed, and the HUD band
       shrank with it. */
  }

  drawClock(m){
    const c = this.ctx;
    c.save();
    c.textAlign = "center";
    c.fillStyle = "#FFF4D02E";
    c.font = "700 48px ui-monospace,monospace";
    c.fillText(m.t.toFixed(1), this.W/2, this.arenaTop + 66);
    if (m.act > 0){
      c.fillStyle = m.act === 1 ? "#C9A22766" : "#E0433F88";
      c.font = "700 20px ui-sans-serif,system-ui,sans-serif";
      c.fillText(CONFIG.acts[m.act].name, this.W/2, this.arenaTop + 96);
    }
    if (m.clankCount > 0){
      c.fillStyle = "#FFF4D024";
      c.font = "700 18px ui-sans-serif,system-ui,sans-serif";
      c.fillText(m.clankCount + " CLANK" + (m.clankCount === 1 ? "" : "S"),
                 this.W/2, this.arenaTop + this.ah - 26);
    }
    c.restore();
  }

  /* Seals only. A seal is a clock event with no place in the hall, so it keeps
     the band near the top. The ultimate's name is drawn inside the arena
     transform instead — see drawUltName. */
  drawBanner(m){
    if (m.banner && !m.banner.w) this._bannerPlain(m.banner, this.arenaTop + this.ah * 0.135);
  }

  /* Letters laid out by hand so each one can be moved independently. The names
     are at most thirteen characters, so this is thirteen fillTexts — cheaper
     than the shadow it is drawn with. `fn` returns per-letter offsets. */
  _letters(c, text, cx, cy, size, track, fn){
    c.font = `700 ${size}px ui-serif,Georgia,serif`;
    const ws = [];
    let total = -track;
    for (const ch of text){ const w = c.measureText(ch).width; ws.push(w); total += w + track; }
    let x = cx - total / 2;
    for (let i = 0; i < text.length; i++){
      const o = fn ? fn(i, text.length) : null;
      const lx = x + ws[i] / 2;
      c.save();
      if (o){
        c.translate(lx + (o.dx || 0), cy + (o.dy || 0));
        if (o.rot) c.rotate(o.rot);
        if (o.s) c.scale(o.s, o.s);
        c.translate(-lx, -cy);
        if (o.a != null) c.globalAlpha *= clamp(o.a, 0, 1);
      }
      if (c.lineWidth > 0) c.strokeText(text[i], lx, cy);
      c.fillText(text[i], lx, cy);
      c.restore();
      x += ws[i] + track;
    }
  }

  /* A seal is a clock event, not a relic. It keeps the plain treatment. */
  _bannerPlain(b, y){
    const c = this.ctx;
    c.save();
    c.globalAlpha = clamp(b.life / 0.6, 0, 1);
    c.textAlign = "center";
    c.font = "700 46px ui-serif,Georgia,serif";
    c.lineWidth = 10; c.strokeStyle = "#000000CC";
    c.strokeText(b.text, this.W/2, y);
    c.fillStyle = b.color || "#C9A227";
    c.shadowColor = b.color || "#C9A227"; c.shadowBlur = 30;
    c.fillText(b.text, this.W/2, y);
    if (b.sub){
      c.shadowBlur = 0;
      c.font = "700 27px ui-sans-serif,system-ui,sans-serif";
      c.lineWidth = 8;
      c.strokeText(b.sub, this.W/2, y + 40);
      c.fillStyle = "#EDE3D0";
      c.fillText(b.sub, this.W/2, y + 40);
    }
    c.restore();
  }

  /* The ultimate's name, at its own set-piece.

     v5 moved this out of the middle of the hall because a 60px caption sat
     directly on top of the ultimate it had stopped needing to explain. Rick
     asked for it back at the point of contact, and the reason it left is still
     real — so it comes back under three conditions that the v5 version did not
     have:

       1. It is drawn BENEATH drawUltOver. The light, the blades, the vines and
          the bolts all paint over it, so as the set-piece blooms it eclipses
          its own name. The name announces; the doing takes over. It can never
          occlude the effect, because the effect is always on top of it.
       2. It sits above the anchor, clear of the densest part of the bloom, and
          is clamped inside the hall.
       3. The huge phase still lands during the wind-up, before there is
          anything to cover.

     Everything here is in ARENA units; every design pixel is multiplied by k. */
  /* Daybreak's drift. Each spark is a MODEL, not a dot — Rick: "i cant see
     the sparks. they need their own models/animation." A four-point sun
     shard: two crossed rhombi turning on the spark's own phase, a white
     core, two flame licks cycling upward, a birth streak while it is still
     flying fast, and a gutter at the end of its life. 48 at most; every
     stroke is small and nothing blurs. */
  _sparkStar(c, r, squash){
    c.beginPath();
    c.moveTo(0, -r);
    c.quadraticCurveTo(r * squash, -r * squash, r, 0);
    c.quadraticCurveTo(r * squash, r * squash, 0, r);
    c.quadraticCurveTo(-r * squash, r * squash, -r, 0);
    c.quadraticCurveTo(-r * squash, -r * squash, 0, -r);
    c.closePath();
  }

  drawSparks(m){
    if (!m.sparks || !m.sparks.length) return;
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    for (const s of m.sparks){
      const flying = s.arm > 0;
      const dying = clamp(s.life / 0.7, 0, 1);
      const pop = s.justArmed > 0 ? 1 + 1.4 * (s.justArmed / 0.3) : 1;
      const pulse = 0.82 + 0.18 * Math.sin(m.t * 10 + s.ph * 3);
      const R = (11 + 4 * Math.sin(s.ph)) * (0.5 + 0.5 * dying) * pop
              * (flying ? 0.45 : 1);
      const a = dying;
      /* in grace it IS its own motion: a comet leaving the blow */
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > 90){
        const k2 = Math.min(1, sp / 300);
        c.globalAlpha = a * 0.7 * k2;
        c.strokeStyle = "#FFD98A"; c.lineWidth = 4.2;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(s.x - (s.vx / sp) * 34 * k2, s.y - (s.vy / sp) * 34 * k2);
        c.lineTo(s.x, s.y);
        c.stroke();
      }
      /* halo */
      const g = c.createRadialGradient(s.x, s.y, 1, s.x, s.y, R * 2.4);
      g.addColorStop(0, "#FFF6E2AA"); g.addColorStop(1, "#FFD98A00");
      c.globalAlpha = a * 0.8 * pulse;
      c.fillStyle = g;
      c.beginPath(); c.arc(s.x, s.y, R * 2.4, 0, TAU); c.fill();
      /* the shard: two crossed rhombi, turning */
      c.save();
      c.translate(s.x, s.y);
      c.rotate(s.ph + m.t * (0.9 + 0.4 * Math.sin(s.ph * 2)));
      c.globalAlpha = a * pulse;
      c.fillStyle = "#FFF6E2";
      this._sparkStar(c, R, 0.22); c.fill();
      c.rotate(Math.PI / 4);
      c.globalAlpha = a * pulse * 0.7;
      c.fillStyle = "#FFD98A";
      this._sparkStar(c, R * 0.62, 0.26); c.fill();
      c.restore();
      /* flame licks: two small tongues, cycling upward off the shard */
      for (let i = 0; i < 2; i++){
        const lp = (m.t * (1.3 + 0.3 * i) + s.ph * (1 + i)) % 1;
        const lx = s.x + Math.sin(s.ph * 4 + i * 2.6) * R * 0.5;
        c.globalAlpha = a * (1 - lp) * 0.7;
        c.strokeStyle = i ? "#FFD98A" : "#FFFFFF";
        c.lineWidth = 2.2 - i * 0.8;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(lx, s.y - R * 0.4 - lp * 3);
        c.quadraticCurveTo(lx + Math.sin(lp * 9 + s.ph) * 3.5, s.y - R - lp * 9,
                           lx + Math.sin(lp * 7 + s.ph) * 2, s.y - R * 0.7 - lp * 16);
        c.stroke();
      }
      /* the core */
      c.globalAlpha = a;
      c.fillStyle = "#FFFFFF";
      c.beginPath(); c.arc(s.x, s.y, Math.max(1.6, R * 0.28), 0, TAU); c.fill();
    }
    c.restore();
  }

  drawUltName(m){
    const b = m.banner;
    if (!b || !b.w) return;
    const c = this.ctx, k = 1 / this.scale, A = CONFIG.arena;
    const max = b.max || 2.1;
    const age = max - b.life;
    const ease = t => 1 - Math.pow(1 - t, 3);
    const inK  = clamp(age / 0.14, 0, 1);
    const setK = clamp((age - 0.38) / 0.24, 0, 1);
    const out  = clamp((0.44 - b.life) / 0.44, 0, 1);
    const col  = b.color || "#C9A227";
    const glow = b.glow || col;
    const H = shellHash;

    c.save();
    c.textAlign = "center";
    c.font = `700 ${46 * k}px ui-serif,Georgia,serif`;
    const w46 = c.measureText(b.text).width;              // arena units
    let scale = lerp(lerp(2.5, 1.95, ease(inK)), 1.0, ease(setK));
    scale = Math.min(scale, (A.w - 26) / Math.max(1, w46));
    const size = 46 * scale * k;
    const track = (scale - 1) * 5 * k;

    /* The clamp has to know how far the ARRIVAL throws the letters, or the
       word clips against the wall for the first tenth of a second — which is
       exactly the tenth of a second it is largest and most looked at. */
