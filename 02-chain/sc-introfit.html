      /* Middle blows hold for 65% of the whip; only the LAST contact of a
         volley gets the full freeze. The sequence needs a finish, not five
         finishes. */
      const last = this.bi >= this.cut.beats.length - 1;
      const wdur = Math.max(P.whip, P.freeze) * (last ? 1 : 0.65);
      if (this.pt >= wdur){
        this.pt = 0;
        if (this.bi < this.cut.beats.length - 1){
          this.bi++;
          this.phase = "gap";
          CineAudio.set(0.34 * this.intensity, 1400, 0.70, 0.09);
        } else {
          this.phase = "settle";
          CineAudio.set(0.44 * this.intensity, 1900, 0.78, 0.12);   // the bloom
        }
      }

    /* BETWEEN CONTACTS -- and this means FASTER THAN REALTIME. The first
       version ran the gaps at 0.5-0.6x, which meant a volley was slower
       between blows than the fight it was interrupting: a four-gap exchange
       cost three extra seconds and, in Rick's words, hurt the flow of battle.
       gapRate is now 1.2-1.35: the exchange RUSHES between contacts and slams
       to a drop only in the last gapLead before each one. Whip - rush - catch
       - whip. A volley at these rates costs roughly nothing net, because the
       overcranked gaps pay back what the whips spend. */
    } else if (this.phase === "gap"){
      const B = this.cut.beats[this.bi];
      const rem = B.t - m.t;
      const near = rem <= P.gapLead;
      ts = near ? P.dropTo : P.gapRate;
      const u = smooth(Math.min(1, this.pt / 0.18));
      z = (this.zoom || P.rest) + ((near ? P.rest * 1.04 : P.rest) - (this.zoom || P.rest)) * u;
      bars = P.bars; wash = P.wash * (near ? 1 : 0.75);
      this.aim(B.x, B.y, P.bias * (near ? 0.85 : 0.55));
      ease = near ? 5.0 : 2.4;
      if (m.t >= B.t || this.pt > 2.5){ this.phase = "whip"; this.pt = 0; }

    /* Out of the peak immediately. Nobody has to live at 1.78x -- it is a
       strike, and the strike is over. */
    } else if (this.phase === "settle"){
      const u = smooth(this.pt / P.settle);
      ts = P.slow;
      z = P.peak + (P.rest - P.peak) * u;
      bars = P.bars; wash = P.wash;
      if (this.cut.x != null){ this.aim(this.cut.x, this.cut.y, P.bias);
        this.sx = this.cut.x; this.sy = this.cut.y; }
      ease = 3.2;
      if (this.pt >= P.settle){ this.phase = "hold"; this.pt = 0; }

    } else if (this.phase === "hold"){
      ts = P.slow;
      z = P.rest;
      bars = P.bars; wash = P.wash;
      if (this.cut.x != null){ this.aim(this.cut.x, this.cut.y, P.bias);
        this.sx = this.cut.x; this.sy = this.cut.y; }
      ease = 2.0;
      if (this.pt >= P.hold * (this._holdMul || 1)){ this.phase = "out"; this.pt = 0; }

    /* 3. THE RELEASE ------------------------------------------------------ */
    } else if (this.phase === "out"){
      const u = smooth(this.pt / P.out);
      /* Past 1.0 on the way out, so the fight does not ease back in -- it
         comes back HARD. The release is what makes the hold mean anything. */
      ts = P.slow + (1.10 - P.slow) * u;
      z = P.rest + (1 - P.rest) * u;
      bars = P.bars * (1 - u); wash = P.wash * (1 - u);
      const A = CONFIG.arena;
      this.tfx = A.w / 2; this.tfy = A.h / 2;
      ease = 3.4;
      if (this.pt >= P.out){
        this.cut = null; this.phase = "idle"; ts = 1; z = 1; bars = 0; wash = 0;
        this.tracer = null; this.sx = this.sy = null;
        CineAudio.set(0, 20000, 1, 0.10);
      }
    }
  }

  /* The ONE place the camera moves, on every phase and every frame, with a
     time constant. Exponential rather than linear so it settles without ever
     arriving abruptly -- and frame-rate independent, which `x += d * 0.2`
     is not. */
  {
    const k = 1 - Math.exp(-ease * raw);
    this.fx += (this.tfx - this.fx) * k;
    this.fy += (this.tfy - this.fy) * k;
    this.hh += raw;
    const live = this.cut && this.phase !== "whip" ? this.handheld : 0;
    this.hx = Math.sin(this.hh * 2.30) * 0.62 + Math.sin(this.hh * 3.71 + 1.1) * 0.38;
    this.hy = Math.sin(this.hh * 1.93 + 0.6) * 0.58 + Math.sin(this.hh * 4.17) * 0.42;
    this.hx *= live; this.hy *= live;
  }

  this.timeScale = ts * this.intensity + (1 - this.intensity);
  this.zoom  = 1 + (z - 1) * this.intensity;
  this.bars  = bars * this.intensity;
  this.wash  = wash * this.intensity;
  this.wallFlash = Math.max(0, this.wallFlash - raw * 1.15);
  this.flash = Math.max(0, this.flash - raw * 7.0);   // 3-4 frames, not a third of a second
  this.streak = Math.max(0, this.streak - raw * 2.6);
  if (this.tape) CineAudio.setRate(this.timeScale * (this.cut ? 1 : 1));

  return raw * this.timeScale;
};

CINE._snap = new Map(); CINE._snapOk = false;
window.CINE = CINE; window.CineAudio = CineAudio;
window.cinePlan = cinePlan; window.cineScore = cineScore;


/* ------------------------------------------------------------------ SHELL */
const cv = document.getElementById("cv");
const renderer = new Renderer(cv);
const selA = document.getElementById("selA");
const selB = document.getElementById("selB");
const logEl = document.getElementById("log");

for (const w of WEAPONS){
  for (const sel of [selA, selB]){
    const o = document.createElement("option");
    o.value = w.id; o.textContent = `${w.name} — ${AFFINITIES[w.aff].name}`;
    sel.appendChild(o);
  }
}
selA.value = "dawnbringer";
selB.value = "grudgebearer";

let match = null, speed = 1, last = performance.now(), acc = 0, loggedCount = 0;
/* The card is on by default because a first-time viewer needs it, and off by
   one click because someone watching their tenth fight does not. */
let introOn = true;
let bedHandle = null;

function newMatch(idA, idB, seedIn){
  if (idA === idB){
    const alts = WEAPONS.filter(w => w.id !== idA);
    idB = alts[Math.floor(Math.random()*alts.length)].id;
    selB.value = idB;
  }
  /* CINEMA (demo): an explicit seed, so the SAME fight can be replayed with
     the director off. That A/B is the whole argument -- if the two runs do not
     end identically, the feature is wrong. */
  const seed = seedIn !== undefined ? (seedIn >>> 0)
                                    : (Math.random() * 4294967296) >>> 0;
  window.__lastSeed = seed;
  match = new Match(idA, idB, seed);
  match.introT = introOn ? CONFIG.intro.dur : 0;
  window.__match = match;

  /* Restart the bed with the match. Seal times are offset by the card, since
     the match clock is held at zero while it is up. */
  if (bedHandle){ bedHandle.stop(); bedHandle = null; }
  CineAudio.stopBed();
  if (SFX.ctx){
    const dur = CONFIG.timeout + CONFIG.intro.dur + 6;
    const seals = CONFIG.acts.slice(1).map(a => match.introT + a.t);
    if (CINE.on && CINE.tape){
      /* CINEMA (demo). The score is pre-scheduled automation against real
         time, so slowing the sim cannot slow it -- during a set-piece the
         picture would drag while the music walked on, which is the commonest
         way this effect gets built wrong. So render the bed ONCE through an
         OfflineAudioContext using SFX.bed() unmodified, then play the result
         as one buffer whose playbackRate the director can ramp. The music now
         slows AND DROPS IN PITCH with the picture. */
      CineAudio.renderBed(dur, seals).then(buf => {
        if (buf && match && match.t < 1.0) bedHandle = CineAudio.startBed(buf);
        else if (!buf && SFX.ctx){
          const t0 = SFX.ctx.currentTime;
          bedHandle = SFX.bed(t0, dur, seals.map(t => t0 + t));
        }
      });
    } else {
      const t0 = SFX.ctx.currentTime;
      bedHandle = SFX.bed(t0, dur, seals.map(t => t0 + t));
    }
  }

  /* CINEMA (demo): watch the whole fight, then choose the shots. */
  CINE.reset();
  if (CINE.on){
    const p = cinePlan(idA, idB, seed);
    CINE.plan = p.cuts; CINE.scored = p.scored; CINE.planErr = p.err;
  } else { CINE.plan = []; CINE.scored = []; }
  if (window.__cinePanel) window.__cinePanel.refresh();

  loggedCount = 0;
  logEl.innerHTML = `<b>${WEAPON_BY_ID[idA].name}</b> vs <b>${WEAPON_BY_ID[idB].name}</b> · seed ${seed}<br>`;
}

function pumpLog(){
  if (!match) return;
  while (loggedCount < match.events.length){
    const e = match.events[loggedCount++];
    logEl.innerHTML += `${e.t.toFixed(1).padStart(5)}s  ${e.text}<br>`;
    logEl.scrollTop = logEl.scrollHeight;
  }
}

/* Keep the backing store matched to the pixels on screen. Off the moment the
   capture pipeline pins a resolution, so a headless viewport cannot shrink the
   frame the video is being rendered from. */
let autoFit = true;
function fitCanvas(){
  if (!autoFit) return;
  const r = cv.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) renderer.resize(r.width, r.height);
}
if (typeof ResizeObserver === "function") new ResizeObserver(fitCanvas).observe(cv);
else addEventListener("resize", fitCanvas);
fitCanvas();

function frame(now){
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (match){
    /* __frozen holds the sim still while still drawing — used by the capture
       tooling to photograph a single instant such as mid-clank. */
    /* CINEMA (demo). One loop body, in CINE.pump, shared with the offline
       clip renderer so the two cannot drift apart. It hands the accumulator
       WALL time scaled by the director; the sim still consumes it in identical
       CONFIG.physics.dt slices, so the sequence of steps -- and therefore the
       winner, the duration in match time, and every statistic -- is what it
       would have been at 1.0. Slowing the picture cannot slow the fight.

       `alpha` is how far the display clock sits between the last fixed step
       and the next one. At a 0.07x drop a step lands only every 7th rendered
       frame, so without this the world updates at 8 Hz behind a 60 Hz display
       and the slow motion visibly stutters. */
    const alpha = (typeof CINE !== "undefined")
      ? (window.__frozen ? 0 : CINE.pump(raw, match, speed))
      : (() => { if (window.__frozen) return 0;
                 acc += raw * speed; const dt = CONFIG.physics.dt; let n = 0;
                 while (acc >= dt && n < 40){ match.step(dt); acc -= dt; n++; }
                 return 0; })();
    if (typeof CINE !== "undefined" && alpha > 0) CINE.drawLerped(renderer, match, alpha);
    else renderer.draw(match);
    pumpLog();
  }
  requestAnimationFrame(frame);
}

document.getElementById("btnFight").onclick = () => { SFX.resume(); newMatch(selA.value, selB.value); };
document.getElementById("btnRandom").onclick = () => {
  SFX.resume();
  const pick = () => WEAPONS[Math.floor(Math.random()*WEAPONS.length)].id;
  let x = pick(), y = pick();
  while (y === x) y = pick();
  selA.value = x; selB.value = y;
  newMatch(x, y);
};
const speeds = [1, 2, 4, 0.30];
let si = 0;
document.getElementById("btnSpeed").onclick = (e) => {
  si = (si + 1) % speeds.length; speed = speeds[si];
  e.target.textContent = speed + "×";
};
const btnIntro = document.getElementById("btnIntro");
btnIntro.onclick = () => {
  introOn = !introOn;
  btnIntro.textContent = introOn ? "Intro card" : "No intro";
  btnIntro.classList.toggle("off", !introOn);
  if (match && match.t === 0) match.introT = introOn ? CONFIG.intro.dur : 0;
};

const btnMute = document.getElementById("btnMute");
btnMute.onclick = () => {
  SFX.resume(); SFX.on = !SFX.on;
  btnMute.textContent = SFX.on ? "Sound" : "Muted";
  btnMute.classList.toggle("off", !SFX.on);
};

function __inject(m){ match = m; window.__match = m; loggedCount = match.events.length; }

window.AC = { litWeapon, CONFIG, AFFINITIES, STATUS, WEAPONS, SHAPES, relicShot, relicStatus, Match, simulate, batch,
              newMatch, __inject, SFX, renderer, IC,
              /* Pin the backing store and stop the live page fitting it to the
                 window. Every capture path — render.py, verify.py — calls this
                 first, so the video's resolution is stated rather than
                 inherited from whatever viewport a harness happened to open. */
              setResolution(w, h){
                autoFit = false;
                cv.width = w; cv.height = h;
                renderer.k = w / 1080;
                return { w: cv.width, h: cv.height, k: renderer.k };
              },
              /* Synchronous draw for the capture pipeline. Stepping and drawing
                 in lockstep keeps a headless render deterministic instead of
                 racing requestAnimationFrame. */
              __draw(m){ renderer.draw(m || match); },
              get match(){ return match; } };

newMatch(selA.value, selB.value);
requestAnimationFrame(frame);

/* ==========================================================================
   CINEMA — the demo panel.  Not shipped; this exists so the feature can be
   ARGUED ABOUT rather than described. Everything that matters is A/B-able in
   two clicks, including the claim that the director cannot change the fight.
   ========================================================================== */
(() => {
  const box = document.createElement("div");
  box.id = "cinePanel";
  box.innerHTML = `
<style>
#cinePanel{position:fixed;top:10px;right:10px;z-index:99;width:290px;
  font:12px/1.45 system-ui,-apple-system,sans-serif;color:#E8D5A8;
  background:#0B0910F2;border:1px solid #C9A22766;border-radius:10px;
  padding:11px 12px;box-shadow:0 8px 34px #000A}
#cinePanel h4{margin:0 0 8px;font:600 12px system-ui;color:#C9A227;
  letter-spacing:.10em;text-transform:uppercase}
#cinePanel .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#cinePanel button{flex:1 1 auto;font:600 11px system-ui;background:#1B1626;
  color:#E8D5A8;border:1px solid #C9A22744;border-radius:6px;padding:6px 8px;
  cursor:pointer}
#cinePanel button.on{background:#C9A227;color:#140F1C;border-color:#C9A227}
#cinePanel button:hover{border-color:#C9A227}
#cinePanel .big{width:100%;flex-basis:100%}
#cinePanel label{display:block;color:#8A7F9A;font-size:10.5px;margin-top:8px;
  letter-spacing:.05em;text-transform:uppercase}
#cinePanel input[type=range]{width:100%;accent-color:#C9A227}
#cinePanel .cuts{margin-top:8px;border-top:1px solid #C9A22733;padding-top:7px;
  max-height:190px;overflow:auto;font:11px ui-monospace,Menlo,monospace}
#cinePanel .cut{display:flex;gap:6px;padding:2.5px 0;color:#B9AECA}
#cinePanel .cut b{color:#FFF4D0;min-width:44px}
#cinePanel .t3{color:#FFD98A} #cinePanel .kill{color:#E0433F}
#cinePanel .hint{color:#6E6480;font-size:10px;margin-top:7px;line-height:1.4}
#cinePanel .live{font:11px ui-monospace;color:#7FE0A0;margin-top:6px}
#cinePanel.min .body{display:none}
</style>
<h4>Cinema · demo <span style="float:right;cursor:pointer" id="cnMin">–</span></h4>
<div class="body">
  <div class="row">
    <button id="cnOn" class="on">Director ON</button>
  </div>
  <div class="row">
    <button id="cnTape" class="on">Tape-slow score</button>
  </div>
  <label>Intensity <span id="cnIv">100%</span></label>
  <input type="range" id="cnInt" min="0" max="150" value="100">
  <label>Bar to qualify <span id="cnCv">1.90</span> <span style="color:#5C5470">(zero cuts is a valid answer)</span></label>
  <input type="range" id="cnCuts" min="100" max="300" value="190">
  <div class="row">
    <button id="cnForce" class="big">Force a set-piece now &nbsp;(F)</button>
  </div>
  <div class="row">
    <button id="cnAB" class="big">Replay this seed, director OFF</button>
  </div>
  <div class="live" id="cnLive">—</div>
  <div class="cuts" id="cnCutList"></div>
  <div class="hint">C director · F force · V A/B replay.<br>
    The A/B replays the same seed. Same winner, same duration in match
    time — that is the claim.</div>
</div>`;
  document.body.appendChild(box);

  const $ = id => document.getElementById(id);
  const set = (el, v) => el.classList.toggle("on", !!v);

  $("cnMin").onclick = () => box.classList.toggle("min");

  $("cnOn").onclick = () => {
    CINE.on = !CINE.on;
    $("cnOn").textContent = CINE.on ? "Director ON" : "Director OFF";
    set($("cnOn"), CINE.on);
    if (!CINE.on) CINE.reset();
    panel.refresh();
  };
  $("cnTape").onclick = () => {
    CINE.tape = !CINE.tape;
    set($("cnTape"), CINE.tape);
    newMatch(selA.value, selB.value, window.__lastSeed);
  };
  $("cnInt").oninput = e => {
    CINE.intensity = e.target.value / 100;
    $("cnIv").textContent = e.target.value + "%";
  };
  $("cnCuts").oninput = e => {
    CINE.floor = e.target.value / 100;
    $("cnCv").textContent = CINE.floor.toFixed(2);
    if (match){
      const p = cinePlan(selA.value, selB.value, window.__lastSeed);
      CINE.plan = p.cuts.filter(c => c.t > match.t);
      panel.refresh();
    }
  };
  $("cnForce").onclick = () => { CINE.force = 1; };
  $("cnAB").onclick = () => {
    const seed = window.__lastSeed;
    const was = CINE.on;
    CINE.on = !was;
    $("cnOn").textContent = CINE.on ? "Director ON" : "Director OFF";
    set($("cnOn"), CINE.on);
    newMatch(selA.value, selB.value, seed);
  };

  addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "c" || e.key === "C") $("cnOn").click();
    if (e.key === "f" || e.key === "F") $("cnForce").click();
    if (e.key === "v" || e.key === "V") $("cnAB").click();
  });

  const panel = {
    refresh(){
      const el = $("cnCutList");
      if (!CINE.on){ el.innerHTML = '<div class="cut">director off</div>'; return; }
      if (CINE.planErr){ el.innerHTML = '<div class="cut">prescan failed: ' +
        CINE.planErr + '</div>'; return; }
      const rows = (CINE.plan || []).map(c => {
        const cls = c.fatal ? "kill" : c.tier === 3 ? "t3" : "";
        const tag = c.fatal ? "KILL" : "T" + c.tier;
        return `<div class="cut ${cls}"><b>${c.t.toFixed(1)}s</b>` +
               `<span>${tag} ${c.score.toFixed(2)} — ${(c.why||[]).join(", ")}</span></div>`;
      }).join("");
      el.innerHTML = `<div class="cut" style="color:#C9A227">THE CUT LIST — ` +
        `chosen before frame 1</div>` + (rows || '<div class="cut">no cuts</div>');
    }
  };
  window.__cinePanel = panel;

  setInterval(() => {
    if (!match) return;
    const s = CINE.on
      ? `t ${match.t.toFixed(1)}s · time ×${CINE.timeScale.toFixed(2)}` +
        ` · zoom ×${CINE.zoom.toFixed(2)} · ${CINE.phase}`
      : `t ${match.t.toFixed(1)}s · director off`;
    $("cnLive").textContent = s;
  }, 80);

  panel.refresh();
})();

</script>
</body>
</html>
