    if (u.freeze && inRange) foe.stun = Math.max(foe.stun, u.freeze);
    if (u.heal){
      const before = f.hp;
      f.hp = Math.min(f.maxHp, f.hp + u.heal);
      const got = Math.round(f.hp - before);
      if (got >= 1){
        f.mend = 1.6;
        this.float(f.x, f.y - 46, "+" + got, "#8FE3A0", 30 + got * 0.7);
      }
    }

    if (inRange && u.dmg){
      const dmg = Math.round(u.dmg * this.actMods.dmg * foe.dmgTakenMul());
      this.hurt(foe, dmg, f);
      foe.flash = 1;
      foe.ringFlash = 1;
      f.dealt += dmg;
      this.float(foe.x, foe.y - 40, dmg, "#FFF4D0", 46);
      this.spawnFx(foe.x, foe.y, f.aff.core, 34, 300, 0.7, 5);
      this.ring(foe.x, foe.y, f.aff.glow, 6, 130, 0.4, 5);
      for (const [k, n] of Object.entries(u.apply || {})){
        foe.apply(k, n);
        const first = !this.taught[k] && !!(STATUS[k] && STATUS[k].tip);
        if (first) this.taught[k] = true;
        this.statusTag(foe.x, foe.y, k, first);
      }
    }
  }

  checkEnd(){
    if (this.killFlight) return;   // the slain ball has a wall to meet first
    const a = this.a, b = this.b;
    if (a.hp <= 0 || b.hp <= 0){
      this.over = true;
      const aDead = a.hp <= 0, bDead = b.hp <= 0;
      this.winner = aDead && bDead ? (a.hp >= b.hp ? a : b) : (aDead ? b : a);
      this.loser  = this.winner === a ? b : a;
      this.loser.hp = Math.max(0, this.loser.hp);
      this.reason = "slain";
      this.shake = 46;
      this.spawnFx(this.loser.x, this.loser.y, this.loser.aff.core, 90, 520, 1.3, 7);
      this.ring(this.loser.x, this.loser.y, this.loser.aff.glow, 10, 300, 0.9, 10);
      SFX.play("death");
      this.note(`${this.winner.w.name} takes the crown — ${Math.ceil(this.winner.hp)} left`);
    } else if (this.t >= CONFIG.timeout){
      this.over = true;
      this.winner = a.hp / a.maxHp >= b.hp / b.maxHp ? a : b;
      this.loser  = this.winner === a ? b : a;
      this.reason = "timeout";
      this.note(`The seals hold — ${this.winner.w.name} ahead`);
    }
  }

  summary(){
    return {
      seed: this.seed, a: this.a.w.name, b: this.b.w.name,
      winner: this.winner ? this.winner.w.name : null,
      hp: this.winner ? Math.ceil(this.winner.hp) : null,
      duration: +this.t.toFixed(2), reason: this.reason,
      hits: { a:this.a.hits, b:this.b.hits },
      crits:{ a:this.a.crits, b:this.b.crits },
      clanks: this.clankCount,
    };
  }
}

/* ------------------------------------------------------- SHELL FRACTURE ---
   Health lives on the relic, and a relic that is losing reads as one that is
   breaking. Two rules made this safe to build:

   1. No simulation state and no simulation RNG. The fracture pattern is a pure
      function of (side, index) through a hash, so it is identical frame to
      frame, identical in the live page and the offline render, and cannot
      perturb a match. `verify.py` must return the same numbers afterwards.
   2. No animation state either. Every crack owns a damage threshold and grows
      in over a narrow window as damage crosses it. That means the repair
      animation is free: heal the relic and the cracks retract by themselves,
      in reverse, without anything having to remember they were there. */
function shellHash(a, b){
  let h = (Math.imul(a + 1, 374761393) + Math.imul(b + 1, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* The grain, baked once.

   It was nine `createRadialGradient` calls per relic per frame — eighteen live
   gradient objects a frame, sixty times a second — and it was the single cause
   of the stutter Rick reported. Measured: with the grain in, one frame in
   sixty cost **2.9 seconds** while the median frame cost 2.5ms; with it out,
   the worst frame in sixty was 6.8ms. Nothing else came close (removing the
   ember, or the conic gradient, changed nothing).

   The grain never moves in the relic's own frame, so there was never a reason
   to rebuild it. One offscreen canvas per side, blitted. */
const GRAIN_CACHE = {};
/* ------------------------------------------------------------ WEAPON GLOW
   drawWeapon used to set a blur of 20 on the context and then hand it to a
   SHAPES function, so EVERY draw inside that function -- every rivet, glyph,
   fracture face and edge highlight -- was separately gaussian-blurred. On the
   runic twinblade that is eleven blurred draws per weapon per frame and 38%
   of the frame's entire blur budget.

   A glow does not need that resolution. It is a diffuse bloom around the
   silhouette, so it is baked once per (shape, length, width, colour, blur)
   into an offscreen canvas and blitted additively, and the live shape is then
   drawn with no shadow at all. N blurred draws per weapon per frame -> 0.

   PAD is the kernel reach: a gaussian of radius b is dead by ~1.5b, and the
   sprite has to hold the whole thing or the glow gets a visible straight edge
   where the sprite ends.

   The bake runs the SAME shape function, so a shape change cannot drift out
   of its own glow. Animated shapes (the runic shards drift on SHAPES._t) bake
   at t=0 and are then static -- invisible, because the thing being cached is
   the blur, and a blur of a shard that has drifted 6px is the same blur. */

/* ------------------------------------------------------ HOISTED WORLD LIGHT
   The light belongs to the world, so it is applied by the thing that knows
   where the world is -- not by 40 shading sites inside shape functions, 18 of
   whose 42 cells never run. sundered-crown-baked-art.md.

   THE SHAPE IS DRAWN LIVE, NOT FROM A CACHED SPRITE, and that is not an
   oversight. v1 of this baked the weapon into a sprite keyed like `weaponGlow`
   does and blitted it. Measured, it made two shapes WORSE:

       greatsword  24.9% -> 12.8%      umbral greatsword  61.5% -> 4.4%
       twinblade   22.1% -> 12.0%

   because `_lit` reads `c.getTransform()`, and a sprite is baked through a pure
   translate. The cached sprite has no rotation in it, so every facet `_lit`
   already drives freezes at its unrotated value and the existing world light is
   destroyed by the thing meant to extend it.

   So the scratch is WORLD-ORIENTED: the rotation goes into the scratch, the
   shape is drawn through it, `_lit` sees a live transform and keeps working,
   and the gradient needs no counter-rotation because the buffer is already in
   world space. The blit counter-rotates once on the way out.

   The cost is that nothing can be cached across frames. That is the whole
   question this build exists to price. */
let _litScratch = null;
function litWeapon(c, shape, L, W, pal, k, ang){
  const fn = SHAPES[shape];
  if (!fn) return false;
  /* THE SCRATCH IS SIZED IN DEVICE PIXELS, NOT LOCAL UNITS. v2 baked at scale 1
     and let the blit magnify it, which was soft on screen AND made this build
     nine times cheaper to draw than the real thing -- so the perf number it
     produced would have been a measurement of a smaller weapon. Read the live
     CTM scale and rasterise at it. */
  const m = c.getTransform();
  const kx = Math.hypot(m.a, m.b) || 1;
  const R = Math.ceil(L * 1.25 + W * 1.5) + 12;
  const S = Math.ceil(R * 2 * kx);
  if (!_litScratch) _litScratch = document.createElement("canvas");
  const s = _litScratch;
  if (s.width < S || s.height < S){ s.width = S; s.height = S; }
  const sx = s.getContext("2d");
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.globalCompositeOperation = "source-over";
  sx.globalAlpha = 1;
  sx.clearRect(0, 0, s.width, s.height);
  sx.save();
  sx.translate(S / 2, S / 2);
  sx.scale(kx, kx);
  sx.rotate(ang);                       /* world orientation, so _lit still works */
  if (shape === 'flailHead') fn(sx, W, pal, k); else fn(sx, L, W, pal, k);
  sx.restore();
  /* The buffer is in world space, so "down" is just +y. No counter-rotation,
     which is the point: one expression instead of a per-site normal. */
  /* THE RAMP MUST SPAN THE WEAPON, NOT THE BUFFER. v3 ran the gradient across
     the whole scratch, which is sized for the weapon's LENGTH -- so across a
     thin blade lying flat the ramp barely changed and the light did nothing.
     Project the weapon's own local bounding box through `ang` and use its
     world-space vertical extent, so a horizontal blade gets the full top-to-
     bottom ramp across its thickness and a vertical one gets it across its
     length, which is what a real directional light does. */
  const bx0 = -L * 0.10, bx1 = L * 1.06, by0 = -W * 1.6, by1 = W * 1.6;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  let ymin = Infinity, ymax = -Infinity;
  for (const [px, py] of [[bx0,by0],[bx1,by0],[bx1,by1],[bx0,by1]]){
    const wy = (px * sa + py * ca) * kx;
    if (wy < ymin) ymin = wy;
    if (wy > ymax) ymax = wy;
  }
  const g = sx.createLinearGradient(0, S / 2 + ymin, 0, S / 2 + ymax);
  /* Light from above. The contrast in this art runs DOWNWARD -- every school's
     steel is near-white and every dark near-black -- so the top face gets a
     small lift and the underside takes the school's own `dark`. */
  g.addColorStop(0.00, "rgba(255,255,255,0.14)");
  g.addColorStop(0.45, "rgba(255,255,255,0.00)");
  g.addColorStop(0.55, pal.dark + "00");
  g.addColorStop(1.00, pal.dark + "8C");
  sx.fillStyle = g;
  sx.globalCompositeOperation = "source-atop";
  sx.fillRect(0, 0, S, S);
  sx.globalCompositeOperation = "source-over";
  c.save();
  c.rotate(-ang);                       /* undo the caller's rotation */
  c.scale(1 / kx, 1 / kx);              /* work in device pixels so the blit is 1:1 */
  c.drawImage(s, 0, 0, S, S, -S / 2, -S / 2, S, S);
  c.restore();
  return true;
}

const _glowCache = new Map();
function weaponGlow(shape, L, W, pal, k, blur){
  const key = shape + "|" + Math.round(L) + "|" + Math.round(W) + "|"
            + pal.core + "|" + (k == null ? "" : Math.round(k * 20)) + "|" + blur;
  let g = _glowCache.get(key);
  if (g) return g;
  const PAD = Math.ceil(blur * 1.5) + 4;
  const w = Math.ceil(L * 1.15) + PAD * 2, h = Math.ceil(W * 3) + PAD * 2;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  /* THE SPRITE HOLDS THE GLOW AND NOTHING ELSE. The first version baked the
     shape WITH its shadow and then drew the shape again live on top, so every
     weapon was composited twice and every blade came out visibly hotter --
     0.53/255 mean error and 3.1% of the frame changed, which the sheet caught
     instantly. Drawing the shape far off the sprite and offsetting its shadow
     back on is what separates the two. Here the offscreen transform is a pure
     translate at scale 1, so the offset is exact with no CTM correction. */
  const OFF = w + 1000;
  cx.translate(PAD, h / 2);
  cx.shadowColor = pal.core; cx.shadowBlur = blur;
  cx.shadowOffsetX = OFF;
  cx.translate(-OFF, 0);
  const fn = SHAPES[shape];
  if (fn) fn(cx, L, W, pal, k);
  g = { cv, ox: -PAD, oy: -h / 2 };
  /* Keys are (shape, length, width, colour, drawK bucket) and length only
     takes the three act-modifier values, so this saturates in the low
     hundreds. The cap is a backstop against a future knob that varies
     continuously, not a working mechanism. */
  if (_glowCache.size > 400) _glowCache.clear();
  _glowCache.set(key, g);
  return g;
}

function grainSprite(side, R, scale){
  const key = side + ":" + Math.round(scale * 100);
  if (GRAIN_CACHE[key]) return GRAIN_CACHE[key];
  const S = Math.ceil(R * 2 * scale) + 4;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const g = cv.getContext("2d");
  g.translate(S / 2, S / 2); g.scale(scale, scale);
  for (let i = 0; i < 9; i++){
    const a  = shellHash(side * 61 + 5, i * 2) * TAU;
    const rr = shellHash(side * 61 + 5, i * 2 + 1) * R * 0.82;
    const sz = R * (0.16 + shellHash(side * 61 + 9, i) * 0.26);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    const gg = g.createRadialGradient(px, py, 0, px, py, sz);
    const dark = i % 3 !== 0;
    gg.addColorStop(0, dark ? "#0000002E" : "#FFFFFF1C");
    gg.addColorStop(1, "#00000000");
    g.fillStyle = gg;
    g.beginPath(); g.arc(px, py, sz, 0, TAU); g.fill();
  }
  return (GRAIN_CACHE[key] = { cv, S });
}

const SHELL_CACHE = {};
function shellCracks(side){
  if (SHELL_CACHE[side]) return SHELL_CACHE[side];
  const N = 14, out = [];

  /* One crack: a jagged run inward from the rim, plus up to two branches that
     fork off it. Steps are small and the angular jitter is large relative to
     the radial step, which is what makes it read as a split in something
     brittle rather than a drawn line. Width tapers from the mouth (wide, at
     the rim) to the tip (hairline) — a crack that is the same width all the
     way down reads as a scratch on the surface. */
  /* Stone does not craze evenly. A brittle fracture runs almost straight for a
     while, hits something in the grain, and turns sharply — so the wobble is
     alternated between "barely" and "hard" instead of applied uniformly.
     Uniform small jitter is what made the first version read as a squiggle
     drawn on the surface rather than a split running through a rock. */
  const run = (seedA, a0, rad0, steps, wobble) => {
    const pts = [];
    let a = a0, rad = rad0;
    for (let s = 0; s <= steps; s++){
      pts.push([a, rad]);
      const kink = shellHash(seedA, s * 5 + 71) > 0.62 ? 2.35 : 0.22;
      a   += (shellHash(seedA, s * 3 + 11) - 0.5) * wobble * kink;
      rad -= 0.075 + shellHash(seedA, s * 3 + 12) * 0.115;
      if (rad < 0.08) break;
    }
    return pts;
  };

  for (let i = 0; i < N; i++){
    const r0 = shellHash(side * 91, i * 7 + 1);
    const r1 = shellHash(side * 91, i * 7 + 2);
    const r2 = shellHash(side * 91, i * 7 + 3);
    const r3 = shellHash(side * 91, i * 7 + 4);
    /* thresholds walk up the damage range so cracks arrive steadily rather
       than all at once, with a little scatter so it never looks metered */
    const thr = 0.04 + (i / N) * 0.86 + (r0 - 0.5) * 0.06;
    const a0 = i * 2.399963 + r1 * 0.8;             // golden angle, well spread
    const pts = run(side * 91 + i, a0, 1.0, 6 + Math.floor(r2 * 5), 0.52);

    const branches = [];
    const nb = r3 > 0.72 ? 2 : (r3 > 0.3 ? 1 : 0);
    for (let b = 0; b < nb; b++){
      const at = 1 + Math.floor(shellHash(side * 71 + i, b * 5 + 3) * (pts.length - 2));
      if (at >= pts.length) continue;
      const [ba, brad] = pts[at];
      const dir = shellHash(side * 71 + i, b * 5 + 4) > 0.5 ? 1 : -1;
      branches.push({
        at,
        pts: run(side * 131 + i * 5 + b, ba + dir * (0.45 + r2 * 0.4), brad,
                 2 + Math.floor(shellHash(side * 71 + i, b * 5 + 6) * 3), 0.62),
      });
    }

    out.push({ thr, pts, branches, w: 0.65 + r2 * 0.85, chip: r1 > 0.55 });
  }
  return (SHELL_CACHE[side] = out);
}

/* ---------------------------------------------------------------- RENDERER */
/* Fight-card metrics, v3.  One place for every number the card layout uses;
   the frame margin is 104 (was 118) and the card is 574 tall (was 560), which
   is free — the tape between the cards keeps its exact 678..1242 band.
   art* is a BOX, not a scale: every weapon is fitted to it (see _artBox), so
   a twinblade is not a speck next to a greatsword. */
const IC = { margin: 104, ch: 574,
             px: 76, pw: 934, tx: 98, txr: 994,
             ruleY: 176, top: 196, bot: 22, stretch: 46,
             artCX: 866, artCY: 92, artW: 250, artH: 148, artMaxS: 2.4 };
const ART_BOX = new Map();

class Renderer {
  constructor(canvas){
    this.cv = canvas;
    this.ctx = canvas.getContext("2d");
    /* W and H are the DESIGN space and are always 1080x1920. The backing store
       may be smaller — see resize() — and `k` is the ratio, applied once as a
       transform at the top of draw(). Everything downstream keeps drawing in
       design pixels, which is why every hand-tuned 188, 66 and 12 in the HUD
       still means what it meant. */
    this.W = 1080; this.H = 1920; this.k = canvas.width / 1080;
    /* The HUD used to be 340px of health bars — a second thing to look at that
       was not the fight. Health now lives inside the relic itself (see
       drawFighter), so the HUD only carries what genuinely cannot go on a
       moving ball: the two names, the school, the ultimate charge and the
       named status chips. The reclaimed height goes back to the arena. */
    this.pad = 12;
    /* 188 -> 152. The chip row under each ult bar is gone (see drawBar), so
       the two identity blocks close up and the band loses 36px. Nothing in the
       sim moves: `scale` is width-derived and `ah` follows from CONFIG.arena,
       so this is presentation only and does not force a retune. The reclaimed
       height becomes bottom margin, which the footer was already short of. */
    this.hud = 152;
    this.aw = this.W - this.pad * 2;
    this.scale = this.aw / CONFIG.arena.w;
    this.ah = CONFIG.arena.h * this.scale;
    /* The arena is width-bound — its height follows from the 520x740 sim and
       the frame width — so the height the HUD gave back cannot become more
       arena. Centre the slack instead of letting it all pool at the bottom as
       a dead black band under the footer. */
    this.arenaTop = this.hud + 24;      // the hall now nearly fills what is left
  }

  /* Match the backing store to the pixels that will actually be shown.

     The live page renders a fixed 1080x1920 and lets CSS scale it into a stage
     that is usually a third of that. On Rick's machine that is 2.07 Mpx
     rasterised to display about 0.8 — every full-canvas fill, every shadow
     blur, every clip paid for two and a half times over, for pixels no display
     ever receives. Measured: frame cost tracks backing-store area almost
     linearly (48.9 ms at 1080x1920, 16.4 at 540x960, 7.8 at 378x672).

     Capped at 1 because rendering ABOVE the design resolution buys nothing —
     the art is authored for 1080 wide — and floored so a collapsed window
     cannot produce a zero-sized canvas. The video path calls
     AC.setResolution(1080, 1920) explicitly; it does not rely on this. */
  resize(cssW, cssH){
    const k = clamp(Math.min(cssW / 1080, cssH / 1920) * (devicePixelRatio || 1),
                    0.25, 1);
    const w = Math.max(2, Math.round(1080 * k));
    if (w === this.cv.width) return false;          // nothing to do; do not clear
    this.cv.width = w; this.cv.height = Math.round(1920 * k);
    this.k = this.cv.width / 1080;
    return true;
  }

  draw(m){
    const c = this.ctx;
    /* Presentation-only clock for art that breathes. Written here, read
       only inside SHAPES. The simulation cannot see it and does not have
       a path to it. */
    SHAPES._t = m.t;
    /* The one place the backing store differs from the design space. Absolute,
       not relative, so it re-establishes itself every frame no matter what any
       draw below left behind. */
    c.setTransform(this.k, 0, 0, this.k, 0, 0);
    if (m.introT > 0 && !this._introScene){ this.drawIntro(m); return; }
    c.save();
    c.fillStyle = "#07050C";
    c.fillRect(0, 0, this.W, this.H);
    if (!this._introScene) this.drawHud(m);

    c.save();
    const sh = m.shake;
    const ox = sh ? (Math.random()-0.5) * sh : 0;
    const oy = sh ? (Math.random()-0.5) * sh : 0;
    /* Impact punch: a tiny zoom during hit stop sells the freeze. */
    const punch = m.hitStop > 0 ? 1 + Math.min(0.022, m.hitStop * 0.16) : 1;
    c.translate(this.pad + ox, this.arenaTop + oy);
    /* CINEMA (demo). During a cut the clip breathes 70px past the arena so
       impact bursts, streaks and rings at a WALL contact spill onto the bled
       floor instead of being guillotined at the wall line -- part of "action
       getting cut off" at the bottom was the arena rect itself amputating
       effect art centred on a wall-adjacent blow. Normal play keeps the exact
       original clip. */
    const cineSpill = (typeof CINE !== "undefined" && CINE.on && CINE.cut) ? 70 : 0;
    c.beginPath(); c.rect(-cineSpill, -cineSpill,
                          this.aw + cineSpill * 2, this.ah + cineSpill * 2); c.clip();
    c.translate(this.aw/2, this.ah/2); c.scale(punch, punch); c.translate(-this.aw/2, -this.ah/2);

    /* CINEMA (demo). The push, about the point of contact rather than about
       the middle of the hall.

       At zoom z a strict "never show past the wall" rule allows the centre to
       travel only (1 - 1/z) of half the frame. MEASURED: at the 1.38x this
       build uses, that is 72 sim units of a 260-unit half-arena -- so the
       clamp, not `bias`, was governing every off-centre contact, and raising
       bias was a no-op. Lean and push are not independent levers; travel is a
       function of zoom.

       So the rule is relaxed by CINE.overscan, and drawArena's base fill is
       extended by the same margin so the camera leaning past the wall shows
       more hall floor rather than a colour seam. */
    if (typeof CINE !== "undefined" && CINE.on && CINE.zoom > 1.0001){
      let z = CINE.zoom, over = 1 + (CINE.overscan || 0);
      const mx = (this.aw / 2) * (1 - 1 / z) * over;
      const my = (this.ah / 2) * (1 - 1 / z) * over;
      let px = clamp((CINE.fx + CINE.hx) * this.scale, this.aw/2 - mx, this.aw/2 + mx);
      let py = clamp((CINE.fy + CINE.hy) * this.scale, this.ah/2 - my, this.ah/2 + my);
      /* THE ACTION MUST BE ON SCREEN — and the action is not a point.

         The first fix here clamped the FOCUS POINT into the frame and its
         probe verified exactly that, which is why it passed while play kept
         showing cut-off action: a relic has a radius that the zoom multiplies
         (34 sim units is ~150px of body at 1080p whip zoom), and the letterbox
         eats the frame edges on top of it. Measured before this version:
         8/8 wall-adjacent set-pieces clipped relic body, by 137-376px at
         540-wide (cinema_edge_probe.py).

         So the constraint is now physical: BOTH relics' magnified bodies must
         sit inside the usable frame (viewport minus the current letterbox),
         solved per relic from fs = y*z - py*(z-1). When the two relics are too
         far apart to both fit at this zoom, the one nearer the focus wins --
         the contact must be visible, the rebounding loser may leave. This
         clamp WINS over the lean clamp above; the camera centre may leave the
         viewport entirely to satisfy it, and the floor bleed covers what that
         reveals. */
      if (z > 1.02 && m){
        const mm = Math.min(this.aw, this.ah) * 0.05;
        const barH = this.ah * 0.115 * (CINE.bars || 0);
        /* FEASIBILITY FIRST: pull back before choosing who to amputate. The
           per-relic clamp below can only pick a winner when both bodies
           cannot fit at this zoom -- and the frame probe showed exactly that
           happening in volley gaps, a relic up to 157px out of frame at the
           sides while the camera panned between distant blows. A camera
           operator does not crop a fighter off; they go wide. So compute the
           largest zoom at which both discs plus effect pad fit the usable
           frame, and use it when it is smaller than the director's ask. The
           pad (+22su) covers floats and impact art that hang off a relic,
           which relic-disc math alone missed -- and which is what "action
           getting cut off" looks like from the couch even when the disc is
           technically framed. Continuous in relic positions, so the pull-back
           reads as a move, not a cut. */
        const padSu = 34 + 22;
        const dx = Math.abs(m.a.x - m.b.x) * this.scale;
        const dy = Math.abs(m.a.y - m.b.y) * this.scale;
        const zx = (this.aw - 2 * mm) / Math.max(1, dx + 2 * padSu * this.scale);
        const zy = (this.ah - 2 * barH - 2 * mm) / Math.max(1, dy + 2 * padSu * this.scale);
        z = Math.max(1.02, Math.min(z, zx, zy));
        const rp = padSu * this.scale * z + mm;
        let lo = -1e9, hi = 1e9, lox = -1e9, hix = 1e9;
        /* Farther-from-focus FIRST, so the nearer relic is applied last and
           wins any conflict. The first version sorted descending and then
           reversed -- nearer first, farther overwriting it -- which handed the
           frame to a distant archer while the victim it had just shot fell out
           of the bottom of the shot. The probe caught it because it reports
           WHO clipped and how far from focus they were: 87su, i.e. the victim. */
        const pts = [m.a, m.b].sort((a2, b2) =>
          Math.hypot(b2.x - CINE.fx, b2.y - CINE.fy) -
          Math.hypot(a2.x - CINE.fx, a2.y - CINE.fy));
        for (const f of pts){
          const xs = f.x * this.scale, ys = f.y * this.scale;
          const l2 = (ys * z - (this.ah - barH - rp)) / (z - 1);
          const h2 = (ys * z - (barH + rp)) / (z - 1);
          const lx2 = (xs * z - (this.aw - rp)) / (z - 1);
          const hx2 = (xs * z - rp) / (z - 1);
          if (Math.max(lo, l2) <= Math.min(hi, h2)){
            lo = Math.max(lo, l2); hi = Math.min(hi, h2);
          } else { lo = l2; hi = h2; }        // nearer relic, applied last, wins
          if (Math.max(lox, lx2) <= Math.min(hix, hx2)){
            lox = Math.max(lox, lx2); hix = Math.min(hix, hx2);
          } else { lox = lx2; hix = hx2; }
        }
        px = clamp(px, lox, hix);
        py = clamp(py, lo, hi);
      }
      c.translate(px, py); c.scale(z, z); c.translate(-px, -py);
      this._cineFocus = [px, py];
      this._cineCam = [px, py, z];
    } else { this._cineFocus = null; this._cineCam = null; }

    this.drawArena(m);
    c.scale(this.scale, this.scale);
    this.drawMotes(m);
    this.drawUltUnder(m);
    this.drawFx(m);
    this.drawFighter(m, m.b);
    this.drawFighter(m, m.a);
    this.drawShots(m);
    this.drawSparks(m);
    this.drawUltName(m);
    this.drawUltOver(m);
    this.drawRings(m);
    this.drawFloats(m);
    this.drawTags(m);
    if (typeof CINE !== "undefined" && CINE.on && CINE.streak > 0.01)
      this.drawCineStreaks(m);
    c.restore();

    if (typeof CINE !== "undefined" && CINE.on) this.drawCine(m);

    if (m.finisher > 0){
      c.save();
      /* THE KILL FLASH -- its own pass, and it applies with the director off
         too, because the problem predates the director.

         It was a full-frame #FFF4D0 at 0.5 alpha for a full second: about
         thirty frames of the picture washed flat beige at the exact moment the
         match is decided. Two faults, the same one twice. (1) The frame is not
         the subject -- the blow is, so this is now a radial burst centred on
         the relic that just died, bright at the point of impact and gone by
         the edges. (2) It lives in m.finisher, which decays with the SIM, so
         under a 0.24x set-piece the one second became four; while a cut runs
         it is clamped against the director's wall clock instead.

         Presentation only. m.finisher is read, never written. */
      const env = (typeof CINE !== "undefined" && CINE.on && CINE.cut)
        ? Math.min(CINE.wallFlash, m.finisher)
        : Math.min(1, m.finisher);
      const dead = m.loser || m.b;
      const kx = this.pad + dead.x * this.scale;
      const ky = this.arenaTop + dead.y * this.scale;
      const KR = Math.hypot(this.aw, this.ah) * 0.55;
      c.beginPath(); c.rect(this.pad, this.arenaTop, this.aw, this.ah); c.clip();
      c.globalCompositeOperation = "lighter";
      const kg = c.createRadialGradient(kx, ky, 0, kx, ky, KR);
      const ka = Math.min(0.46, env * 0.46);
      kg.addColorStop(0, "rgba(255,244,208," + ka.toFixed(3) + ")");
      kg.addColorStop(0.30, "rgba(255,240,196," + (ka * 0.42).toFixed(3) + ")");
      kg.addColorStop(1, "rgba(255,232,170,0)");
      c.fillStyle = kg;
      c.fillRect(this.pad, this.arenaTop, this.aw, this.ah);
      c.restore();
    }
    if (0){
      c.save();
      c.globalAlpha = 0;
      c.fillStyle = "#FFF4D0";
      c.fillRect(this.pad, this.arenaTop, this.aw, this.ah);
      c.restore();
    }

    this.drawArenaFrame(m);
    this.drawClock(m);
    this.drawBanner(m);
    if (!this._introScene) this.drawFooter(m);
    if (m.over) this.drawResult(m);
    c.restore();
  }

  /* --------------------------------------------------------- CINEMA ---
     Demo overlays. All of it is drawn AFTER the arena content and reads only
     CINE, so removing this method and its two call sites removes the feature
     without touching a line of anything else.

       wash    a desaturating scrim -- the world drains while the moment holds
       bars    letterbox. The single cheapest signal that says "this is a shot"
       flash   the frame of contact
       streaks radial smear from the point of impact, three frames of it */
  drawCine(m){
    const c = this.ctx;
    const x = this.pad, y = this.arenaTop, w = this.aw, h = this.ah;

    /* Sim coords -> screen, THROUGH the cinematic camera. The overlay draws
       after c.restore(), so anything anchored to the world has to apply the
       same fixed-point transform the arena was drawn with or it will detach
       the moment the lens moves. */
    const cam = this._cineCam;
    const S = (sx, sy) => {
      let lx = sx * this.scale, ly = sy * this.scale;
      if (cam){ lx = cam[0] + (lx - cam[0]) * cam[2];
                ly = cam[1] + (ly - cam[1]) * cam[2]; }
      return [x + lx, y + ly];
    };

    /* THE TRACER -- a ranged set-piece has to show the shot being TAKEN and
       the shot LANDING, or the viewer cannot tell what caused the cinematic.
       Three parts: a ring blooming at the loose point, a fading line down the
       flight, and a comet head riding where the bolt is. All in the shooter's
       gold, clipped to the arena. */
    if (CINE.tracer){
      const T = CINE.tracer;
      const [ax, ay] = S(T.lx, T.ly);
      const [bx2, by2] = S(T.cx, T.cy);
      const hx2 = ax + (bx2 - ax) * T.prog, hy2 = ay + (by2 - ay) * T.prog;
      c.save();
      c.beginPath(); c.rect(x, y, w, h); c.clip();
      c.globalCompositeOperation = "lighter";
      /* the loose: a ring that blooms and fades over the first half second */
      const ra = clamp(1 - T.age / 0.55, 0, 1);
      if (ra > 0){
        c.globalAlpha = 0.5 * ra;
        c.strokeStyle = "#FFE9A8"; c.lineWidth = 2.5;
        c.beginPath(); c.arc(ax, ay, 14 + (1 - ra) * 46, 0, TAU); c.stroke();
        c.globalAlpha = 0.28 * ra;
        c.beginPath(); c.arc(ax, ay, 6 + (1 - ra) * 20, 0, TAU); c.stroke();
      }
      /* the flight: brightest just behind the head, gone at the tail */
      const grad = c.createLinearGradient(ax, ay, hx2, hy2);
      grad.addColorStop(0, "rgba(255,233,168,0)");
      grad.addColorStop(0.72, "rgba(255,233,168,0.10)");
      grad.addColorStop(1, "rgba(255,244,208,0.55)");
      c.strokeStyle = grad; c.lineWidth = 2.2; c.globalAlpha = 1;
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(hx2, hy2); c.stroke();
      /* the head */
      const hg = c.createRadialGradient(hx2, hy2, 0, hx2, hy2, 26);
      hg.addColorStop(0, "rgba(255,248,220,0.85)");
      hg.addColorStop(0.4, "rgba(255,236,180,0.30)");
      hg.addColorStop(1, "rgba(255,230,160,0)");
      c.fillStyle = hg;
      c.beginPath(); c.arc(hx2, hy2, 26, 0, TAU); c.fill();
      c.restore();
    }
    /* The focus in SCREEN space, left behind by the camera. Both the vignette
       and the burst are centred on it rather than on the middle of the hall --
       measured A/B: a full-frame scrim at 0.75 was invisible against an
       already-desaturated arena, and a full-frame additive flash at 0.55
       blew the whole picture to flat beige. Both failures had the same cause:
       treating the frame as the subject. The subject is the point of contact. */
    const fx = x + (this._cineFocus ? this._cineFocus[0] : w / 2);
    const fy = y + (this._cineFocus ? this._cineFocus[1] : h / 2);
    const R = Math.hypot(w, h) * 0.62;

    if (CINE.wash > 0.01){
      c.save();
      c.beginPath(); c.rect(x, y, w, h); c.clip();
      const g = c.createRadialGradient(fx, fy, R * 0.13, fx, fy, R);
      g.addColorStop(0, "rgba(6,4,12,0)");
      g.addColorStop(0.45, "rgba(6,4,12," + (0.30 * CINE.wash).toFixed(3) + ")");
      g.addColorStop(1, "rgba(4,3,9," + (0.86 * CINE.wash).toFixed(3) + ")");
      c.fillStyle = g; c.fillRect(x, y, w, h);
      c.restore();
    }

    if (CINE.flash > 0.01){
      c.save();
      c.beginPath(); c.rect(x, y, w, h); c.clip();
      c.globalCompositeOperation = "lighter";
      const g = c.createRadialGradient(fx, fy, 0, fx, fy, R * 0.52);
      const a = Math.min(0.38, CINE.flash * 0.38);
      g.addColorStop(0, "rgba(255,244,208," + a.toFixed(3) + ")");
      g.addColorStop(0.35, "rgba(255,236,180," + (a * 0.45).toFixed(3) + ")");
      g.addColorStop(1, "rgba(255,230,160,0)");
      c.fillStyle = g; c.fillRect(x, y, w, h);
      c.restore();
    }

    if (0){
    }

    if (CINE.bars > 0.01){
      const bh = h * 0.115 * CINE.bars;
      c.save();
      c.fillStyle = "#05040A";
      c.fillRect(x, y, w, bh); c.fillRect(x, y + h - bh, w, bh);
      c.globalAlpha = 0.5; c.strokeStyle = "#C9A22755"; c.lineWidth = 1;
      c.beginPath();
      c.moveTo(x, y + bh + 0.5); c.lineTo(x + w, y + bh + 0.5);
      c.moveTo(x, y + h - bh - 0.5); c.lineTo(x + w, y + h - bh - 0.5);
      c.stroke();
      c.restore();
    }
  }

  /* Radial smear, drawn inside the arena transform so it sits with the fight
     rather than on top of the letterbox. */
  drawCineStreaks(m){
    const c = this.ctx, s = CINE.streak;
    const fx = CINE.fx, fy = CINE.fy;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    for (let i = 0; i < 22; i++){
      const a = (i / 22) * TAU + (i % 3) * 0.14;
      const r0 = 70 + (i % 5) * 26, len = 120 + (i % 7) * 60 * s;
      c.globalAlpha = 0.05 + 0.10 * s * (0.4 + (i % 3) * 0.3);
      c.strokeStyle = i % 2 ? "#FFF4D0" : "#C9A227";
      c.lineWidth = 1.2 + (i % 3) * 1.1;
      c.beginPath();
      c.moveTo(fx + Math.cos(a) * r0, fy + Math.sin(a) * r0);
      c.lineTo(fx + Math.cos(a) * (r0 + len), fy + Math.sin(a) * (r0 + len));
      c.stroke();
    }
    c.restore();
  }

  /* ------------------------------------------------------------- arena --- */
  /* THE CLOSING-WALL GLOW, OFF THE FULL CANVAS.

     `strokeRect` under `shadowBlur = 30` was 38% of the frame on an Adreno
     660. The shadowbuf trick -- shrink the surface to fit the blurred thing --
     does not apply, because the thing is the arena border and its bounding box
     IS the canvas.

     A Gaussian is scale-covariant, so the surface shrinks a different way:
     blur at 1/D scale with sigma/D, scale back up. Same Gaussian, 1/D^2 of the
     pixels. The resample adds about D/2 device px of blur, which lands in
     quadrature against sigma 15 and vanishes (15 -> 15.13 at D=4).

     Only the SOFT part goes through the buffer. `shadowOffsetX` pushes the
     source rect off the buffer's left edge so the buffer receives its shadow
     and nothing else, and the 4px line is stroked at full resolution on top.
     Sharp stays sharp.

     shadowBlur is in device pixels and the CTM does not touch it, so the
     buffer wants 30/D. Amplitude is width/(sigma*sqrt(2pi)) on both sides and
     comes out equal: 4k against sigma 15 here, 4k/D against sigma 15/D there.

     Draws nothing when the walls are open. Reads no simulation state. */
  _wallGlow(c, W, H, n){
    const D = 4;
    const t = c.getTransform();
    const k = Math.hypot(t.a, t.b) || 1;             /* device px per arena unit */
    const bw = Math.max(1, Math.ceil(W * k / D)), bh = Math.max(1, Math.ceil(H * k / D));

    if (!this._gbuf) this._gbuf = document.createElement("canvas");
    const b = this._gbuf;
    if (b.width !== bw || b.height !== bh){ b.width = bw; b.height = bh; }
    const bx = b.getContext("2d");
    bx.setTransform(1, 0, 0, 1, 0, 0);
    bx.globalCompositeOperation = "source-over";
    bx.globalAlpha = 1;
    bx.clearRect(0, 0, bw, bh);

    bx.save();
    bx.scale(k / D, k / D);
    /* The source rect is drawn one full arena-width to the left of where it
       belongs and the shadow is offset back by exactly that, in device px,
       because shadowOffset is device space too. What lands on the buffer is
       the shadow alone -- the rect itself is off the edge and clipped away. */
    const OFF = W + 64;
    bx.shadowColor = "#E0433F";
    bx.shadowBlur = 30 / D;
    bx.shadowOffsetX = OFF * k / D;
    bx.strokeStyle = "#E0433F"; bx.lineWidth = 4;
    bx.strokeRect(n - OFF, n, W - n*2, H - n*2);
    bx.restore();

    c.drawImage(b, 0, 0, bw, bh, 0, 0, W, H);        /* the soft part, upscaled */

    c.strokeStyle = "#E0433F"; c.lineWidth = 4;      /* the hard part, at full res */
    c.strokeRect(n, n, W - n*2, H - n*2);
  }

  drawArena(m){
    const c = this.ctx, W = this.aw, H = this.ah;
    /* CINEMA (demo): bled outward so a camera leaning past the wall reveals
       more floor instead of a hard colour seam against the page background.
       Everything else in here still draws to the true W x H, so the walls, the
       collapse and every hitbox are exactly where they were. */
    /* 260, not 140: the physical visibility clamp can push the camera centre
       ~470px past the wall at 1080p whip zoom, revealing ~180px of beyond-wall
       floor. 140 left a seam exactly in the shots the clamp had just saved. */
    const BLEED = (typeof CINE !== "undefined" && CINE.on) ? 260 : 0;
    c.fillStyle = "#100C16";
    c.fillRect(-BLEED, -BLEED, W + BLEED * 2, H + BLEED * 2);

    /* flagstones */
    c.strokeStyle = "#FFFFFF06"; c.lineWidth = 2;
    const sx = W / 6, sy = H / 9;
    for (let i = 1; i < 6; i++){ c.beginPath(); c.moveTo(sx*i, 0); c.lineTo(sx*i, H); c.stroke(); }
    for (let j = 1; j < 9; j++){
      const off = (j % 2) ? sx * 0.5 : 0;
      c.beginPath(); c.moveTo(-off, sy*j); c.lineTo(W, sy*j); c.stroke();
    }

    /* heraldic wash: each champion stains their end of the hall */
    for (const [f, cy] of [[m.a, H*0.13], [m.b, H*0.87]]){
      const rg = c.createRadialGradient(W*0.5, cy, 0, W*0.5, cy, H*0.52);
      rg.addColorStop(0, f.aff.core + "33"); rg.addColorStop(1, "#00000000");
      c.fillStyle = rg; c.fillRect(0, 0, W, H);
    }

    /* the great sigil — slowly turning, flares as each seal breaks */
    const cx = W/2, cy = H/2, rad = Math.min(W, H) * 0.40;
    const flare = m.banner && m.banner.text && m.banner.text.includes("SEAL")
                ? 0.5 + m.banner.life * 0.4 : 0;
    c.save();
    c.translate(cx, cy);
    c.rotate(m.t * 0.055);
    c.globalAlpha = 0.20 + flare * 0.55;
    c.strokeStyle = "#C9A227"; c.lineWidth = 2.5;
    c.beginPath(); c.arc(0, 0, rad, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, rad * 0.80, 0, TAU); c.stroke();
    c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, 0, rad * 0.34, 0, TAU); c.stroke();
    for (let i = 0; i < 24; i++){                    // rune ticks
      const a = (i / 24) * TAU;
      const r0 = rad * (i % 3 === 0 ? 0.86 : 0.92), r1 = rad * 0.99;
      c.beginPath();
      c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      c.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
      c.stroke();
    }
    c.rotate(-m.t * 0.13);                            // counter-rotating star
    c.lineWidth = 2;
    c.beginPath();
    for (let i = 0; i < 7; i++){
      const a = (i * 3 / 7) * TAU;
      const x = Math.cos(a) * rad * 0.78, y = Math.sin(a) * rad * 0.78;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.stroke();
    c.restore();

    const vg = c.createRadialGradient(cx, cy, H*0.26, cx, cy, H*0.74);
    vg.addColorStop(0, "#00000000"); vg.addColorStop(1, "#000000BB");
    c.fillStyle = vg; c.fillRect(0, 0, W, H);

    if (m.inset > 0){                                  // closing walls
      const n = m.inset * this.scale;
      c.fillStyle = "#180209D9";
      c.fillRect(0,0,W,n); c.fillRect(0,H-n,W,n);
      c.fillRect(0,0,n,H); c.fillRect(W-n,0,n,H);
      this._wallGlow(c, W, H, n);
    }
  }

  drawArenaFrame(){
    const c = this.ctx, x = this.pad, y = this.arenaTop, w = this.aw, h = this.ah;
    c.save();
    c.strokeStyle = "#C9A22766"; c.lineWidth = 3; c.strokeRect(x, y, w, h);
    c.strokeStyle = "#C9A22733"; c.lineWidth = 1; c.strokeRect(x-6, y-6, w+12, h+12);
    c.strokeStyle = "#C9A227"; c.lineWidth = 3;   // corner flourishes
    const L = 34;
    for (const [px, py, dx, dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){
      c.beginPath();
      c.moveTo(px, py + dy*L); c.lineTo(px, py); c.lineTo(px + dx*L, py);
      c.stroke();
    }
    c.restore();
  }

  drawMotes(m){
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    for (const p of m.motes){
      c.globalAlpha = p.a; c.fillStyle = "#E8D5A8";
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill();
    }
    c.restore();
  }

  /* ---------------------------------------------------------- ultimates ---
     Six set-pieces, one per relic, and they exist to replace a caption.

     The old version fired a generic burst of sparks and printed
     "Drags them in: 14 damage, 3 Curse" underneath. That worked, and it was an
     admission: the mechanic was not visible, so it had to be narrated. These
     are built so that a viewer who has never seen the game can say what
     happened — light falls on them and the caster is made whole; the ground
     comes apart; they are dragged in; they are pinned by thorns — without a
     word of text and without knowing a single relic's name.

     Everything here is presentation. `m.ultFx` is written once in fireUlt and
     never read by the simulation. */

  /* Where the Crucible's kill met the arena. The cracks grow in over a
     sixth of a second and then SIT there under the death shatter — a wall
     that takes a relic at that speed is not the same wall afterwards. */
  _wallCrack(m){
    const W = m.wallCrack, c = this.ctx;
    const grow = clamp(W.t / 0.16, 0, 1);
    const fade = 1 - clamp((W.t - W.life + 0.6) / 0.6, 0, 1);
    const base = Math.atan2(W.ny, W.nx);            // into the hall
    c.save();
    c.lineCap = "round";
    for (let i = 0; i < 9; i++){
      const a = base + (shellHash(83, i) - 0.5) * 2.4;
      const len = (34 + shellHash(97, i) * 92) * grow;
      const ex = W.x + Math.cos(a) * len, ey = W.y + Math.sin(a) * len;
      c.globalAlpha = 0.8 * fade;
      c.strokeStyle = "#11131A"; c.lineWidth = 3.4;
      this._jag(c, W.x, W.y, ex, ey, 6, 7, 610 + i, 1);
      c.globalAlpha = 0.35 * fade;
      c.strokeStyle = W.glow; c.lineWidth = 1.2;
      this._jag(c, W.x, W.y, ex, ey, 6, 7, 610 + i, 1);
    }
    c.restore();
  }

  _ult(m){
    const u = m.ultFx;
    if (!u) return null;
    return { u, src: m[u.src], tgt: m[u.tgt], k: clamp(u.t / u.life, 0, 1) };
  }

  /* jagged polyline between two points — lightning, roots, floor fissures */
  _jag(c, x0, y0, x1, y1, segs, amp, seed, frac){
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const n = Math.max(2, Math.ceil(segs * clamp(frac, 0, 1)));
    c.beginPath();
    for (let i = 0; i < n; i++){
      const t = i / (segs - 1);
      const w = (shellHash(seed, i) - 0.5) * 2 * amp * Math.sin(Math.PI * t);
      const px = x0 + dx * t + nx * w, py = y0 + dy * t + ny * w;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  }

  _glyph(c, x, y, r, rot, col, alpha){
    c.save();
    c.globalAlpha = alpha; c.translate(x, y); c.rotate(rot);
    c.strokeStyle = col; c.lineWidth = r * 0.16; c.lineCap = "round";
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3 - Math.PI / 2;
      c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      c.lineTo(Math.cos(a + TAU / 3) * r * 0.5, Math.sin(a + TAU / 3) * r * 0.5);
    }
    c.stroke();
    c.restore();
  }

  /* Beneath the fighters: anything that belongs to the floor. */
  drawUltUnder(m){
    if (m.wallCrack) this._wallCrack(m);
    const s = this._ult(m); if (!s) return;
    const { u, src, tgt, k } = s, c = this.ctx, A = CONFIG.arena;
    c.save();
    c.lineCap = "round"; c.lineJoin = "round";

    if (u.w === "dawnbringer"){
      /* Daybreak on the floor: a breathing pool of dawn under the LIVE
         caster — this piece runs five seconds and the caster keeps moving.
         The old target rings left with Judgement; nothing falls anymore. */
      const rise = clamp(u.t / 0.35, 0, 1);
      const fade = 1 - clamp((u.t - (u.life - 0.5)) / 0.5, 0, 1);
      const pulse = 0.88 + 0.12 * Math.sin(u.t * 7);
      const g = c.createRadialGradient(src.x, src.y, 5, src.x, src.y, 105 * pulse);
      g.addColorStop(0, "#FFF6E255"); g.addColorStop(1, "#FFF6E200");
      c.globalAlpha = 0.8 * rise * fade;
      c.fillStyle = g;
      c.beginPath(); c.arc(src.x, src.y, 105 * pulse, 0, TAU); c.fill();
    }

    else if (u.w === "grudgebearer"){
      if (u.phase === "strike"){
        /* the floor takes the blow: molten cracks out of the impact */
        const grow = clamp(u.t / 0.22, 0, 1);
        const fade = 1 - clamp((u.t - 0.7) / 0.9, 0, 1);
        for (let i = 0; i < 8; i++){
          const a = (i / 8) * TAU + shellHash(4242, i) * 0.5;
          const len = 190 * (0.6 + shellHash(1717, i) * 0.6) * grow;
          const ex = u.x + Math.cos(a) * len, ey = u.y + Math.sin(a) * len;
          c.globalAlpha = 0.85 * fade;
          c.strokeStyle = "#2E1B0A"; c.lineWidth = 7 * (1 - u.t * 0.35);
          this._jag(c, u.x, u.y, ex, ey, 7, 12, 910 + i, 1);
          c.globalAlpha = fade;
          c.strokeStyle = "#FF8C3A"; c.lineWidth = 2.6 * (1 - u.t * 0.3);
          c.shadowColor = "#FF6A1A"; c.shadowBlur = 12;
          this._jag(c, u.x, u.y, ex, ey, 7, 12, 910 + i, 1);
          c.shadowBlur = 0;
        }
      }
      else if (u.phase === "fizzle"){
        /* the light pool dies where the caster stands */
        const out = 1 - clamp(u.t / 0.85, 0, 1);
        const g = c.createRadialGradient(src.x, src.y, 4, src.x, src.y, 110);
        g.addColorStop(0, "#FF6A1A55"); g.addColorStop(1, "#FF6A1A00");
        c.globalAlpha = 0.8 * out;
        c.fillStyle = g;
        c.beginPath(); c.arc(src.x, src.y, 110, 0, TAU); c.fill();
      }
      else {
        /* WIND. The forge light on the floor, and the floor being TAKEN:
           the pool breathes under the ball while the grit of the arena
           streams inward in tightening spirals — accretion, drawn with the
           same vocabulary as the motes the hall already floats. Anchored to
           the LIVE caster, because unlike every other set-piece this one
           lasts seconds and the caster does not stand still for it. */
        const r = clamp(u.t / 1.6, 0, 1);
        const pulse = 0.85 + 0.15 * Math.sin(u.t * 9);
        const g = c.createRadialGradient(src.x, src.y, 6, src.x, src.y, 120 * pulse);
        g.addColorStop(0, "#FF6A1A66"); g.addColorStop(1, "#FF6A1A00");
        c.globalAlpha = 0.85 * r;
        c.fillStyle = g;
        c.beginPath(); c.arc(src.x, src.y, 120 * pulse, 0, TAU); c.fill();
        for (let i = 0; i < 14; i++){
          const ph = (u.t * (0.55 + shellHash(21, i) * 0.5) + shellHash(11, i)) % 1;
          const d = 300 * (1 - ph);
          const a = shellHash(31, i) * TAU + u.t * 1.6 + ph * 2.4;
          c.globalAlpha = r * (1 - ph) * 0.55;
          c.strokeStyle = i % 3 ? "#7A5A38" : "#E8A34E";
          c.lineWidth = 2.2;
          c.beginPath();
          c.arc(src.x, src.y, Math.max(2, d), a, a + 0.5 + ph * 0.5);
          c.stroke();
        }
      }
    }

    else if (u.w === "thornwake"){
      /* roots running along the floor from caster to quarry */
      const grow = clamp(u.t / 0.30, 0, 1);
      const fade = 1 - clamp((u.t - u.life * 0.72) / (u.life * 0.28), 0, 1);
      c.globalAlpha = 0.85 * fade;
      for (let i = 0; i < 4; i++){
        c.strokeStyle = i % 2 ? "#0D3A1A" : "#2E6B2C";
        c.lineWidth = 5 - i * 0.7;
        this._jag(c, u.x, u.y, tgt.x, tgt.y, 9, 26 + i * 9, 300 + i, grow);
      }
    }

    else if (u.w === "gravemourn"){
      /* the grave opens: a turning vortex the foe is being pulled into */
      const grow = clamp(u.t / 0.22, 0, 1);
      const fade = 1 - clamp((u.t - 0.7) / 0.85, 0, 1);
      const R0 = u.radius * 0.42 * grow;
      c.globalAlpha = 0.9 * fade;
      const g = c.createRadialGradient(src.x, src.y, 2, src.x, src.y, R0);
      g.addColorStop(0, "#000000"); g.addColorStop(0.45, "#280A44EE");
      g.addColorStop(1, "#280A4400");
      c.fillStyle = g;
      c.beginPath(); c.arc(src.x, src.y, R0, 0, TAU); c.fill();
      c.strokeStyle = "#A45CF0"; c.lineWidth = 2.6;
      c.shadowColor = "#A45CF0"; c.shadowBlur = 18;
      for (let arm = 0; arm < 5; arm++){
        c.globalAlpha = (0.28 + 0.2 * fade) * fade;
        c.beginPath();
        for (let j = 0; j <= 26; j++){
          const t2 = j / 26;
          const a = arm * TAU / 5 + t2 * 3.6 - u.t * 7;
          const r = R0 * (1 - t2 * 0.96);
          const px = src.x + Math.cos(a) * r, py = src.y + Math.sin(a) * r;
          j ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.stroke();
      }
      c.shadowBlur = 0;
    }

    /* ---- Bloodprice: what runs out of the wound, on the floor -------------- */
    else if (u.w === "oathwound"){
      const open = clamp((u.t - 0.12) / 0.26, 0, 1);
      const fade = 1 - clamp((u.t - 0.6) / 0.85, 0, 1);
      c.globalAlpha = 0.8 * fade * open;
      const g = c.createRadialGradient(u.tx, u.ty + 14, 3, u.tx, u.ty + 14, 108 * open);
      g.addColorStop(0, "#5A0A18EE"); g.addColorStop(0.6, "#3A0610AA");
      g.addColorStop(1, "#3A061000");
      c.fillStyle = g;
      c.beginPath(); c.ellipse(u.tx, u.ty + 14, 108 * open, 46 * open, 0, 0, TAU); c.fill();
      /* rivulets: the pool does not stay a circle */
      for (let i = 0; i < 7; i++){
        const a = shellHash(31, i) * TAU;
        const len = 60 * open * (0.5 + shellHash(32, i));
        c.globalAlpha = 0.6 * fade * open;
        c.strokeStyle = "#5A0A18"; c.lineWidth = 4 - shellHash(33, i) * 2;
        this._jag(c, u.tx, u.ty + 14, u.tx + Math.cos(a) * len,
                  u.ty + 14 + Math.sin(a) * len * 0.42, 5, 7, 340 + i, open);
      }
    }

    /* ---- Rootfast: the root PLATE, spreading from the quarry outward ------- */
    else if (u.w === "heartwood"){
      const grow = clamp(u.t / 0.42, 0, 1);
      const brown = clamp((u.t - u.life * 0.62) / (u.life * 0.38), 0, 1);
      const fade = 1 - clamp((u.t - u.life * 0.80) / (u.life * 0.20), 0, 1);
      const N = 11;
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU + shellHash(71, i) * 0.5;
        const len = 132 * grow * (0.55 + shellHash(72, i) * 0.7);
        c.globalAlpha = 0.85 * fade;
        /* Roots run from the TARGET, not the caster — this is the whole
           difference from Bramblesnare and it has to be visible on the floor
           before the cage above it explains itself. */
        c.strokeStyle = brown > 0 ? "#4A3418" : "#0D3A1A";
        c.lineWidth = 6 - (i % 3);
        this._jag(c, tgt.x, tgt.y, tgt.x + Math.cos(a) * len,
                  tgt.y + Math.sin(a) * len * 0.5, 7, 15, 700 + i, grow);
        c.globalAlpha = 0.5 * fade * (1 - brown);
        c.strokeStyle = "#2E6B2C"; c.lineWidth = 2;
        this._jag(c, tgt.x, tgt.y, tgt.x + Math.cos(a) * len,
                  tgt.y + Math.sin(a) * len * 0.5, 7, 15, 700 + i, grow);
      }
    }

    /* ---- Eclipse: the floor goes out, in a ring running outward ------------ */
    else if (u.w === "nightfell"){
      const ex = clamp(u.t / 0.44, 0, 1);
      const fade = 1 - clamp((u.t - 0.55) / 0.9, 0, 1);
      const R = u.radius * (1 - Math.pow(1 - ex, 2.4));
      c.globalAlpha = 0.9 * fade;
      const g = c.createRadialGradient(u.x, u.y, R * 0.05, u.x, u.y, Math.max(1, R));
      g.addColorStop(0, "#05010AEE"); g.addColorStop(0.72, "#12042099");
      g.addColorStop(0.94, "#2A0A4066"); g.addColorStop(1, "#2A0A4000");
      c.fillStyle = g;
      c.beginPath(); c.arc(u.x, u.y, Math.max(1, R), 0, TAU); c.fill();
    }

    /* ---- Corollary: the construction lines, ruled on the floor ------------- */
    else if (u.w === "axiom"){
      const draw = clamp(u.t / 0.22, 0, 1);
      const fade = 1 - clamp((u.t - 0.5) / 0.8, 0, 1);
      c.globalAlpha = 0.5 * fade;
      c.strokeStyle = "#2A5C9E"; c.lineWidth = 1.2;
      /* Straight, ruled, and extended PAST the target — a construction line,
         not a strike. Nothing here wobbles; that is the point of the school
         arguing against its own twinblade. */
      const dx = tgt.x - u.x, dy = tgt.y - u.y, L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      c.beginPath();
      c.moveTo(u.x - ux * 40, u.y - uy * 40);
      c.lineTo(u.x + ux * (L + 90) * draw, u.y + uy * (L + 90) * draw);
      c.stroke();
      for (let i = 0; i < 3; i++){
        const rr = 34 + i * 26;
        c.globalAlpha = 0.28 * fade * draw;
        c.beginPath(); c.arc(tgt.x, tgt.y, rr, 0, TAU); c.stroke();
      }
    }

    /* ---- Quarrelstorm: the dust the release blows off the floor ------------ */
    else if (u.w === "ironhail"){
      const ex = clamp(u.t / 0.30, 0, 1);
      const fade = 1 - clamp((u.t - 0.35) / 0.8, 0, 1);
      const R = 210 * (1 - Math.pow(1 - ex, 2.6));
      c.globalAlpha = 0.5 * fade * (1 - ex * 0.5);
      c.strokeStyle = "#8A6A3A"; c.lineWidth = 9 * (1 - ex * 0.6);
      c.beginPath(); c.arc(u.x, u.y, Math.max(1, R), 0, TAU); c.stroke();
    }

    /* ---- Bulwark: the plates' footprint, a tiled ring ---------------------- */
    else if (u.w === "lightkeeper"){
      const ex = clamp(u.t / 0.34, 0, 1);
      const fade = 1 - clamp((u.t - 0.4) / 0.85, 0, 1);
      const R = u.radius * (1 - Math.pow(1 - ex, 2.4));
      const N = 18;
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU + u.t * 0.5;
        c.globalAlpha = 0.4 * fade * (1 - ex * 0.4);
        c.strokeStyle = "#F06BB8"; c.lineWidth = 2;
        c.beginPath();
        c.arc(u.x, u.y, Math.max(1, R), a, a + TAU / N * 0.62);
        c.stroke();
      }
    }

    /* ---- Reprisal: the draw ring, tightening as the shot is held ----------- */
    else if (u.w === "farwarden"){
      const p = clamp(u.t / Math.max(0.001, u.life * 0.7), 0, 1);
      const fade = 1 - clamp((u.t - u.life * 0.72) / (u.life * 0.28), 0, 1);
      c.globalAlpha = 0.7 * fade;
      c.strokeStyle = "#F06BB8"; c.lineWidth = 2.4;
      c.beginPath(); c.arc(u.x, u.y, 150 * (1 - p * 0.72), 0, TAU); c.stroke();
      c.globalAlpha = 0.35 * fade;
      c.lineWidth = 1.2;
      c.beginPath(); c.arc(u.x, u.y, 150, 0, TAU); c.stroke();
    }

    /* ---- Benediction: the lit ground under the blessing -------------------- */
    else if (u.w === "aureole"){
      const open = clamp((u.t - 0.06) / 0.24, 0, 1);
      const fade = 1 - clamp((u.t - 0.45) / 0.95, 0, 1);
      c.globalAlpha = 0.5 * fade * open;
      const g = c.createRadialGradient(u.tx, u.ty, 3, u.tx, u.ty, 150 * open);
      g.addColorStop(0, "#FFF6E2AA"); g.addColorStop(1, "#FFF6E200");
      c.fillStyle = g;
      c.beginPath(); c.ellipse(u.tx, u.ty, 150 * open, 62 * open, 0, 0, TAU); c.fill();
    }

    /* ---- Consecration: glyphs igniting outward across the floor ------------ */
    else if (u.w === "censer"){
      const ex = clamp(u.t / 0.40, 0, 1);
      const fade = 1 - clamp((u.t - 0.5) / 0.9, 0, 1);
      const R = u.radius * (1 - Math.pow(1 - ex, 2.2));
      const N = 12;
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU + u.t * 0.4;
        const rr = R * (0.55 + 0.45 * shellHash(51, i));
        const lit = clamp((R - rr) / 60, 0, 1);
        if (lit <= 0) continue;
        this._glyph(c, u.x + Math.cos(a) * rr, u.y + Math.sin(a) * rr,
                    13, u.t * 1.2 + i, "#C9A227", fade * lit * 0.9);
      }
      c.globalAlpha = 0.35 * fade * (1 - ex * 0.6);
      c.strokeStyle = "#C9A227"; c.lineWidth = 3;
      c.beginPath(); c.arc(u.x, u.y, Math.max(1, R), 0, TAU); c.stroke();
    }

    /* ---- Forgefall: a molten pool, crusting over as it cools --------------- */
    else if (u.w === "emberedge"){
      const ex = clamp(u.t / 0.32, 0, 1);
      const cool = clamp((u.t - 0.35) / 0.9, 0, 1);
      const fade = 1 - clamp((u.t - 0.8) / 0.8, 0, 1);
      const R = u.radius * (1 - Math.pow(1 - ex, 2.5));
      /* ALPHA AND FALLOFF, both cut hard from the first version. At 0.85 with
         a stop at 0.55 this washed the entire arena orange and hid the target
         behind its own light — a radius-220 nova reading bigger than
         Mountainfall at 300. A pool is a thing on the floor with an edge; it
         is not a light source for the hall. */
      c.globalAlpha = 0.55 * fade;
      const g = c.createRadialGradient(u.x, u.y, 4, u.x, u.y, Math.max(1, R));
      /* the pool goes from white-hot to a dark crust; `cool` is the only
         thing moving after the first third, which is what says "quenched" */
      const hot = cool > 0.6 ? "#3A1A08" : (cool > 0.25 ? "#B4491A" : "#FFD08A");
      g.addColorStop(0, hot + "DD"); g.addColorStop(0.30, "#8A2E0E66");
      g.addColorStop(0.62, "#8A2E0E1A"); g.addColorStop(1, "#8A2E0E00");
      c.fillStyle = g;
      c.beginPath(); c.arc(u.x, u.y, Math.max(1, R), 0, TAU); c.fill();
      for (let i = 0; i < 9; i++){                 // crust lines
        const a = shellHash(61, i) * TAU;
        c.globalAlpha = 0.55 * fade * cool;
        c.strokeStyle = "#25120A"; c.lineWidth = 3.4;
        this._jag(c, u.x, u.y, u.x + Math.cos(a) * R, u.y + Math.sin(a) * R,
                  6, 12, 610 + i, 1);
      }
    }
    c.restore();
  }

  /* Above the fighters: light, blades, vines, bolts, dust. */
  drawUltOver(m){
    const s = this._ult(m); if (!s) return;
    const { u, src, tgt, k } = s, c = this.ctx, A = CONFIG.arena;
    c.save();
    c.lineCap = "round"; c.lineJoin = "round";

    /* ---- Daybreak: white heat radiating off the whole relic ------------- */
    if (u.w === "dawnbringer"){
      const R = CONFIG.physics.ballR;
      const rise = clamp(u.t / 0.30, 0, 1);
      const fade = 1 - clamp((u.t - (u.life - 0.5)) / 0.5, 0, 1);
      const k2 = rise * fade;
      /* the corona: white-hot at the shell, gone by two radii */
      c.globalCompositeOperation = "lighter";
      const pulse = 0.92 + 0.08 * Math.sin(u.t * 13);
      const g = c.createRadialGradient(src.x, src.y, 2, src.x, src.y, R * 2.3 * pulse);
      g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.4, "#FFF6E288");
      g.addColorStop(1, "#FFD98A00");
      c.globalAlpha = 0.8 * k2;
      c.fillStyle = g;
      c.beginPath(); c.arc(src.x, src.y, R * 2.3 * pulse, 0, TAU); c.fill();
      /* flame tongues: deterministic flicker, licking upward off the shell */
      for (let i = 0; i < 9; i++){
        const a0 = (i / 9) * TAU + Math.sin(u.t * (2.1 + shellHash(19, i)) + i) * 0.25;
        const flick = 0.55 + 0.45 * Math.sin(u.t * (9 + shellHash(29, i) * 5) + i * 2.1);
        const len = (R * 0.9 + shellHash(39, i) * R * 0.8) * flick;
        const bx = src.x + Math.cos(a0) * (R + 2), by = src.y + Math.sin(a0) * (R + 2);
        const tx2 = src.x + Math.cos(a0) * (R + 2 + len * 0.4) - 0 ;
        const ty2 = by - len;                       // heat goes UP
        c.globalAlpha = k2 * 0.55 * flick;
        c.strokeStyle = i % 3 ? "#FFF6E2" : "#FFFFFF";
        c.lineWidth = 3.2 - (i % 3);
        c.beginPath();
        c.moveTo(bx, by);
        c.quadraticCurveTo(bx + Math.cos(a0) * len * 0.3, by - len * 0.5, tx2, ty2);
        c.stroke();
      }
      /* the ignition ring, once, at the cast */
      const ring = clamp(u.t / 0.4, 0, 1);
      if (ring < 1){
        c.globalAlpha = (1 - ring) * 0.9;
        c.strokeStyle = "#FFF6E2"; c.lineWidth = 4 * (1 - ring * 0.5);
        c.shadowColor = "#FFFFFF"; c.shadowBlur = 16;
        c.beginPath(); c.arc(src.x, src.y, R + 130 * ring, 0, TAU); c.stroke();
        c.shadowBlur = 0;
      }
      c.globalCompositeOperation = "source-over";
    }

    /* ---- Exsanguinate: a burst of blades, then the blood is drawn out */
    else if (u.w === "widowmaker"){
      const ex = clamp(u.t / 0.34, 0, 1);
      const fade = 1 - clamp((u.t - 0.3) / 0.75, 0, 1);
      const rad = u.radius * (1 - Math.pow(1 - ex, 2.2));
      const N = 14;
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU + u.t * 2.2;
        const bx = u.x + Math.cos(a) * rad, by = u.y + Math.sin(a) * rad;
        c.save();
        c.translate(bx, by); c.rotate(a + Math.PI / 2 + u.t * 6);
        c.globalAlpha = fade * (1 - ex * 0.35);
        c.fillStyle = "#E03A4E";
        c.shadowColor = "#FF97A2"; c.shadowBlur = 14;
        c.beginPath();                                    // a crescent fang
        c.moveTo(0, -13); c.quadraticCurveTo(9, 0, 0, 13);
        c.quadraticCurveTo(3.4, 0, 0, -13);
        c.fill();
        c.restore();
      }
      c.globalAlpha = fade * 0.9;
      c.strokeStyle = "#E03A4E"; c.lineWidth = 5 * (1 - ex * 0.7);
      c.shadowColor = "#E03A4E"; c.shadowBlur = 20;
      c.beginPath(); c.arc(u.x, u.y, rad, 0, TAU); c.stroke();
      c.shadowBlur = 0;
      /* threads of blood pulled back to the caster */
      if (u.hit && u.t > 0.22){
        const p = clamp((u.t - 0.22) / 0.9, 0, 1);
        for (let i = 0; i < 5; i++){
          c.globalAlpha = (1 - p) * 0.85;
          c.strokeStyle = "#8E1226"; c.lineWidth = 2.4;
          this._jag(c, tgt.x, tgt.y, src.x, src.y, 8, 30, 77 + i, 1);
          const q = (p * 1.4 + i * 0.2) % 1;
          const bx = lerp(tgt.x, src.x, q), by = lerp(tgt.y, src.y, q);
          c.globalAlpha = (1 - p) * 0.95;
          c.fillStyle = "#E03A4E";
          c.beginPath(); c.arc(bx, by, 4.2, 0, TAU); c.fill();
        }
      }
    }

    /* ---- Crucible: the forge lights, the hall bends inward, the blow ---- */
    else if (u.w === "grudgebearer"){
      const R = CONFIG.physics.ballR;
      if (u.phase === "strike"){
        /* the payoff: the singularity collapses INTO the blow and the blow
           pays it back out as heat. `stacks` sizes the flare and the slag —
           six sunder read bigger than one without a word of text. */
        const n = u.stacks || 0;
        const flash = 1 - clamp(u.t / 0.14, 0, 1);
        if (flash > 0){
          c.globalCompositeOperation = "lighter";
          const g = c.createRadialGradient(u.x, u.y, 2, u.x, u.y, 150);
          g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.4, "#FFD9A0");
          g.addColorStop(1, "#FF6A1A00");
          c.globalAlpha = flash;
          c.fillStyle = g;
          c.beginPath(); c.arc(u.x, u.y, 150, 0, TAU); c.fill();
          c.globalCompositeOperation = "source-over";
        }
        const imp = 1 - clamp(u.t / 0.20, 0, 1);       // the horizon, imploding
        if (imp > 0){
          c.globalAlpha = imp * 0.8;
          c.strokeStyle = "#0A0710"; c.lineWidth = 9 * imp;
          c.beginPath(); c.arc(u.x, u.y, R * 1.6 * imp, 0, TAU); c.stroke();
        }
        const ex = clamp(u.t / 0.45, 0, 1);
        const fade = 1 - clamp((u.t - 0.5) / 1.1, 0, 1);
        const rad = (150 + n * 28) * (1 - Math.pow(1 - ex, 2.6));
        c.globalAlpha = fade;
        c.strokeStyle = "#FFE7C2"; c.lineWidth = 5 * (1 - ex * 0.6);
        c.shadowColor = "#FF6A1A"; c.shadowBlur = 18;
        c.beginPath(); c.arc(u.x, u.y, rad, 0, TAU); c.stroke();
        c.shadowBlur = 0;
        for (let i = 0; i < 4 + n * 3; i++){           // the consumed, as slag
          const a = shellHash(131, i) * TAU;
          const d = rad * (0.4 + shellHash(141, i) * 0.7);
          c.globalAlpha = fade * 0.85;
          c.fillStyle = i % 3 ? "#FF8C3A" : "#FFD9A0";
          c.save();
          c.translate(u.x + Math.cos(a) * d, u.y + Math.sin(a) * d - ex * 26);
          c.rotate(u.t * 7 + i);
          const sz = 2.5 + shellHash(151, i) * 5;
          c.fillRect(-sz / 2, -sz / 2, sz, sz);
          c.restore();
        }
        const fl = clamp((u.t - 0.04) / 0.30, 0, 1);   // the flare column
        const fh = (70 + n * 34) * fl;
        if (fh > 0){
          c.globalCompositeOperation = "lighter";
          c.globalAlpha = fade * 0.7 * fl;
          const g2 = c.createLinearGradient(u.x, u.y, u.x, u.y - fh);
          g2.addColorStop(0, "#FFD9A0AA"); g2.addColorStop(1, "#FF6A1A00");
          c.fillStyle = g2;
          c.fillRect(u.x - 10, u.y - fh, 20, fh);
          c.globalCompositeOperation = "source-over";
        }
      }
      else if (u.phase === "fizzle"){
        /* the horizon lets go and the heat guts out DOWNWARD — a thing that
           failed, not a thing that ended */
        const out = 1 - clamp(u.t / 0.88, 0, 1);
        c.globalAlpha = out * 0.5;
        c.strokeStyle = "#0A0710"; c.lineWidth = 8 * out;
        c.beginPath();
        c.arc(src.x, src.y, R * (1.55 + (1 - out) * 0.9), 0, TAU); c.stroke();
        for (let i = 0; i < 8; i++){
          const ph = clamp(u.t * 1.4 - shellHash(161, i) * 0.3, 0, 1);
          c.globalAlpha = out * (1 - ph) * 0.8;
          c.fillStyle = i % 2 ? "#FF8C3A" : "#E8A34E";
          c.beginPath();
          c.arc(src.x + (shellHash(171, i) - 0.5) * 70,
                src.y + ph * 60 + (shellHash(181, i) - 0.5) * 20,
                2.6 * (1 - ph * 0.5), 0, TAU);
          c.fill();
        }
      }
      else {
        /* WIND: the deep-orange forge glow, the event horizon, accretion
           streamers, the hammer's wheel of heat, and the foe's dust torn
           down the pull. All anchored to the LIVE fighters — this piece
           runs seconds and both of them keep moving. */
        const r = clamp(u.t / 1.6, 0, 1);
        const pulse = 0.9 + 0.1 * Math.sin(u.t * 11);
        c.globalCompositeOperation = "lighter";
        const g = c.createRadialGradient(src.x, src.y, 2, src.x, src.y, R * 2.6 * pulse);
        g.addColorStop(0, "#FFD9A0"); g.addColorStop(0.45, "#FF6A1A88");
        g.addColorStop(1, "#FF6A1A00");
        c.globalAlpha = 0.75 * r;
        c.fillStyle = g;
        c.beginPath(); c.arc(src.x, src.y, R * 2.6 * pulse, 0, TAU); c.fill();
        c.globalCompositeOperation = "source-over";
        c.globalAlpha = 0.55 * r;                       // the event horizon
        c.strokeStyle = "#0A0710"; c.lineWidth = 10;
        c.beginPath(); c.arc(src.x, src.y, R * 1.55, 0, TAU); c.stroke();
        c.globalAlpha = 0.9 * r;                        // lensed rim, running
        c.strokeStyle = "#FFE7C2"; c.lineWidth = 1.6;
        c.shadowColor = "#FF8C3A"; c.shadowBlur = 14;
        c.beginPath();
        c.arc(src.x, src.y, R * 1.72, u.t * 5.2, u.t * 5.2 + 4.6);
        c.stroke();
        c.shadowBlur = 0;
        for (let i = 0; i < 3; i++){                    // accretion streamers
          const a0 = u.t * (6.4 + i * 0.6) + i * (TAU / 3);
          c.globalAlpha = r * 0.7;
          c.strokeStyle = i ? "#E8A34E" : "#FF7A2A";
          c.lineWidth = 2.6;
          c.beginPath();
          for (let q = 0; q < 10; q++){
            const t2 = q / 9;
            const rr = R * (3.4 - 1.6 * t2);
            const aa = a0 + t2 * 2.2;
            const px = src.x + Math.cos(aa) * rr, py = src.y + Math.sin(aa) * rr;
            q ? c.lineTo(px, py) : c.moveTo(px, py);
          }
          c.stroke();
        }
        /* the hammer's wheel: the spin itself is real (tickWeapon runs it at
           spinMul); this is the heat it leaves behind the head */
        const reach = src.w.reach + 14;
        for (let k2 = 0; k2 < 6; k2++){
          c.globalAlpha = r * 0.5 * (1 - k2 / 6);
          c.strokeStyle = k2 % 2 ? "#FFB36B" : "#FFE7C2";
          c.lineWidth = 12 - k2 * 1.4;
          c.beginPath();
          c.arc(src.x, src.y, reach, src.theta - 0.16 - k2 * 0.34,
                src.theta - k2 * 0.34);
          c.stroke();
        }
        for (let i = 0; i < 6; i++){                    // dust down the pull
          const ph = (u.t * 1.3 + shellHash(61, i)) % 1;
          const px = lerp(tgt.x, src.x, ph), py = lerp(tgt.y, src.y, ph);
          c.globalAlpha = r * (1 - ph) * 0.5;
          c.fillStyle = "#E8A34E";
          c.beginPath();
          c.arc(px + (shellHash(71, i) - 0.5) * 22 * (1 - ph),
                py + (shellHash(81, i) - 0.5) * 22 * (1 - ph),
                2.4 - ph, 0, TAU);
          c.fill();
        }
      }
    }

    /* ---- Bramblesnare: they are pinned, and you can see the thorns */
    else if (u.w === "thornwake"){
      const grow  = clamp((u.t - 0.12) / 0.30, 0, 1);
      const hold  = clamp((u.t - u.life * 0.70) / (u.life * 0.30), 0, 1);
      const alive = 1 - hold;
      const R = CONFIG.physics.ballR;
      const N = 9;
      for (let i = 0; i < N; i++){
        const a0 = (i / N) * TAU + shellHash(11, i) * 0.5;
        const side = shellHash(21, i) > 0.5 ? 1 : -1;
        const len = (R * 2.5 + shellHash(31, i) * R * 1.4) * grow;
        const bx = tgt.x + Math.cos(a0) * (R + 16), by = tgt.y + Math.sin(a0) * (R + 16);
        const ex2 = tgt.x + Math.cos(a0 + side * 1.5) * (R * 0.25);
        const ey2 = tgt.y + Math.sin(a0 + side * 1.5) * (R * 0.25);
        const cx2 = tgt.x + Math.cos(a0 + side * 0.5) * (R + len * 0.7);
        const cy2 = tgt.y + Math.sin(a0 + side * 0.5) * (R + len * 0.7);
        c.globalAlpha = alive;
        c.strokeStyle = "#16401F"; c.lineWidth = 8.5 * grow;
        c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(cx2, cy2, ex2, ey2); c.stroke();
        c.strokeStyle = "#4FD06B"; c.lineWidth = 3.4 * grow;
        c.shadowColor = "#4FD06B"; c.shadowBlur = 10;
        c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(cx2, cy2, ex2, ey2); c.stroke();
        c.shadowBlur = 0;
        /* thorns, because a smooth vine is a rope and a rope is not a threat */
        c.fillStyle = "#BCF7C7";
        for (let j = 1; j <= 4; j++){
          const t2 = j / 5, uu = 1 - t2;
          const px = uu*uu*bx + 2*uu*t2*cx2 + t2*t2*ex2;
          const py = uu*uu*by + 2*uu*t2*cy2 + t2*t2*ey2;
          const dxq = 2*uu*(cx2-bx) + 2*t2*(ex2-cx2);
          const dyq = 2*uu*(cy2-by) + 2*t2*(ey2-cy2);
          const dl = Math.hypot(dxq, dyq) || 1;
          const nx = -dyq/dl * side, ny = dxq/dl * side;
          const th = 7.5 * grow;
          c.globalAlpha = alive * 0.95;
          c.beginPath();
          c.moveTo(px + nx*1.6, py + ny*1.6);
          c.lineTo(px + nx*1.6 + dxq/dl*4.4, py + ny*1.6 + dyq/dl*4.4);
          c.lineTo(px + nx*th, py + ny*th);
          c.closePath(); c.fill();
        }
      }
      /* the snare cinching shut */
      c.globalAlpha = alive * 0.6;
      c.strokeStyle = "#4FD06B"; c.lineWidth = 2.4;
      c.beginPath();
      c.arc(tgt.x, tgt.y, (R + 20) * (1.25 - 0.25 * grow), 0, TAU); c.stroke();
    }

    /* ---- Dirge: the tethers go taut and they are reeled in */
    else if (u.w === "gravemourn"){
      const fade = 1 - clamp((u.t - 0.65) / 0.9, 0, 1);
      const snap = clamp(u.t / 0.16, 0, 1);
      for (let i = 0; i < 4; i++){
        c.globalAlpha = fade * (0.55 + 0.45 * snap);
        c.strokeStyle = i % 2 ? "#280A44" : "#A45CF0";
        c.lineWidth = i % 2 ? 6 : 2.4;
        c.shadowColor = "#A45CF0"; c.shadowBlur = i % 2 ? 0 : 14;
        this._jag(c, tgt.x, tgt.y, src.x, src.y, 10,
                  34 * (1 - snap) + 6, 501 + i, snap);
        c.shadowBlur = 0;
      }
      /* everything loose in the hall streams into the grave */
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < 30; i++){
        const ph = (u.t * 1.15 + shellHash(88, i)) % 1;
        const a  = shellHash(99, i) * TAU + ph * 4.2;
        const rr = u.radius * 0.55 * (1 - ph);
        c.globalAlpha = (1 - ph) * fade * 0.9;
        c.fillStyle = "#DDB8FF";
        c.beginPath();
        c.arc(src.x + Math.cos(a) * rr, src.y + Math.sin(a) * rr,
              1.4 + 2.6 * (1 - ph), 0, TAU);
        c.fill();
      }
      c.globalCompositeOperation = "source-over";
    }

    /* ---- Unmaking: struck by runes, then taken apart */
    else if (u.w === "spellbreaker"){
      const strike = clamp(u.t / 0.10, 0, 1);
      const fade   = 1 - clamp((u.t - 0.45) / 0.85, 0, 1);
      if (u.t < 0.42){
        const flick = 0.55 + Math.random() * 0.45;
        c.globalAlpha = flick * (1 - clamp((u.t - 0.16) / 0.26, 0, 1));
        c.strokeStyle = "#BCDDFF"; c.lineWidth = 7;
        c.shadowColor = "#4A9EFF"; c.shadowBlur = 26;
        this._jag(c, u.x, u.y, tgt.x, tgt.y, 12, 30, 7 + Math.floor(u.t * 40), strike);
        c.strokeStyle = "#FFFFFF"; c.lineWidth = 2.4;
        this._jag(c, u.x, u.y, tgt.x, tgt.y, 12, 30, 7 + Math.floor(u.t * 40), strike);
        c.shadowBlur = 0;
        for (let i = 0; i < 4; i++){         // glyphs igniting along the bolt
          const t2 = (i + 1) / 5;
          if (t2 > strike) break;
          this._glyph(c, lerp(u.x, tgt.x, t2), lerp(u.y, tgt.y, t2),
                      9 + i * 2, u.t * 3 + i, "#BCDDFF", flick * 0.9);
        }
      }
      /* the cage: rings close on them, then come apart — the "unmaking" */
      if (u.hit && u.t > 0.10){
        const p = clamp((u.t - 0.10) / 0.34, 0, 1);
        const brk = clamp((u.t - 0.48) / 0.5, 0, 1);
        const R = CONFIG.physics.ballR;
        for (let i = 0; i < 3; i++){
          const rr = (R + 46) * (1 - p * 0.62) + i * 9;
          const segs = 6;
          for (let j = 0; j < segs; j++){
            const a0 = j * TAU / segs + u.t * (i % 2 ? -1.8 : 1.8);
            const push = brk * (26 + i * 14);
            const mid = a0 + TAU / segs / 2;
            c.save();
            c.globalAlpha = fade * (1 - brk);
            c.translate(Math.cos(mid) * push, Math.sin(mid) * push);
            c.strokeStyle = i === 1 ? "#FFFFFF" : "#4A9EFF";
            c.lineWidth = 3.4 - i * 0.7;
            c.shadowColor = "#4A9EFF"; c.shadowBlur = 14;
            c.beginPath();
            c.arc(tgt.x, tgt.y, rr, a0, a0 + TAU / segs * 0.66);
            c.stroke();
            c.restore();
          }
        }
        this._glyph(c, tgt.x, tgt.y, 20 * (1 - brk), -u.t * 2.4, "#BCDDFF",
                    fade * (1 - brk) * 0.9);
      }
    }

    /* ---- Bloodprice: a seam torn open in the air, and the oath that holds -- */
    else if (u.w === "oathwound"){
      const open = clamp((u.t - 0.08) / 0.22, 0, 1);
      const shut = clamp((u.t - u.life * 0.55) / (u.life * 0.45), 0, 1);
      const fade = 1 - clamp((u.t - 0.5) / 1.0, 0, 1);
      const H = 120, w = 30 * open * (1 - shut);

      /* the wound: a vesica, dark inside, hot at the rim */
      c.save();
      c.translate(u.tx, u.ty);
      c.globalAlpha = Math.max(0, 1 - shut);
      c.beginPath();
      c.moveTo(0, -H);
      c.quadraticCurveTo(w, 0, 0, H);
      c.quadraticCurveTo(-w, 0, 0, -H);
      const wg = c.createLinearGradient(-w, 0, w, 0);
      wg.addColorStop(0, "#3A0610"); wg.addColorStop(0.5, "#120004");
      wg.addColorStop(1, "#3A0610");
      c.fillStyle = wg; c.fill();
      c.strokeStyle = "#FF97A2"; c.lineWidth = 2.6;
      c.shadowColor = "#E03A4E"; c.shadowBlur = 18;
      c.stroke();
      c.shadowBlur = 0;
      c.restore();

      /* it bleeds downward — drops leaving the seam, not thrown outward */
      c.globalCompositeOperation = "source-over";
      for (let i = 0; i < 9; i++){
        const ph = (u.t * 1.3 + shellHash(21, i)) % 1;
        c.globalAlpha = (1 - ph) * fade * 0.9 * open;
        c.fillStyle = "#E03A4E";
        const px = u.tx + (shellHash(22, i) - 0.5) * w * 1.6;
        const py = u.ty - H * 0.3 + ph * (H * 1.5);
        c.beginPath(); c.ellipse(px, py, 2.4, 4.2 + ph * 3, 0, 0, TAU); c.fill();
      }

      /* THE TETHER: a taut thread back to the caster. Straight, not jagged
         — a binding, and the thing Exsanguinate's flung fangs never had.
         (Was "THE OATH" when this relic was Oathwound. The picture did not
         change with the rename; the reason for it did.) */
      c.globalAlpha = 0.75 * fade;
      c.strokeStyle = "#8E1226"; c.lineWidth = 2.4;
      c.shadowColor = "#E03A4E"; c.shadowBlur = 10;
      c.beginPath(); c.moveTo(u.tx, u.ty); c.lineTo(src.x, src.y); c.stroke();
      c.shadowBlur = 0;
      for (let i = 0; i < 3; i++){            // beads running back down it
        const q = (u.t * 0.8 + i / 3) % 1;
        c.globalAlpha = (1 - q) * fade;
        c.fillStyle = "#FF97A2";
        c.beginPath();
        c.arc(lerp(u.tx, src.x, q), lerp(u.ty, src.y, q), 3.2, 0, TAU); c.fill();
      }
    }

    /* ---- Rootfast: a cage grown UP over the quarry, then browning ---------- */
    else if (u.w === "heartwood"){
      const grow = clamp(u.t / 0.40, 0, 1);
      const brown = clamp((u.t - u.life * 0.62) / (u.life * 0.30), 0, 1);
      const fade = 1 - clamp((u.t - u.life * 0.78) / (u.life * 0.22), 0, 1);
      const R = CONFIG.physics.ballR;
      const N = 9;
      for (let i = 0; i < N; i++){
        const a = (i / N) * TAU;
        const h = (R + 78) * grow;
        const bx = tgt.x + Math.cos(a) * (R + 16);
        const by = tgt.y + Math.sin(a) * (R + 16);
        c.globalAlpha = fade * (0.9 - brown * 0.3);
        c.strokeStyle = brown > 0.5 ? "#5A4420" : "#2E6B2C";
        c.lineWidth = 5.2 - (i % 3) * 0.9;
        c.shadowColor = brown > 0.5 ? "#00000000" : "#4FD06B";
        c.shadowBlur = brown > 0.5 ? 0 : 12;
        /* Each stem rises and BENDS IN over the quarry — the cage closes.
           Bramblesnare's roots stay on the floor and never arch. */
        c.beginPath();
        c.moveTo(bx, by);
        c.quadraticCurveTo(bx, by - h * 0.8, tgt.x + Math.cos(a) * 6, by - h);
        c.stroke();
        c.shadowBlur = 0;
        if (grow > 0.5){                      // leaves unfurling on the stems
          for (let j = 1; j <= 2; j++){
            const t2 = j / 3;
            const lx = lerp(bx, tgt.x + Math.cos(a) * 6, t2);
            const ly = lerp(by, by - h, t2);
            c.globalAlpha = fade * (1 - brown) * 0.85 * clamp((grow - 0.5) * 2, 0, 1);
            c.fillStyle = "#BCF7C7";
            c.save(); c.translate(lx, ly); c.rotate(a + j * 1.1);
            c.beginPath(); c.ellipse(0, 0, 8, 3.4, 0, 0, TAU); c.fill();
            c.restore();
          }
        }
      }
    }

    /* ---- Eclipse: an OCCULTED BODY, and a shadow front that puts lights out -
       v1 was a dark disc expanding over the arena, and it did not read. You
       cannot subtract light from a hall that is already #100C16 — the "eaten
       light" was invisible by construction, and the corona ring ended up doing
       the entire job while growing off the top of the frame.
       So the reading is inverted. The eclipse is now an OBJECT that stays put
       and holds the eye: a black body over the caster with a hard bright rim,
       which is what an eclipse actually looks like. The expanding part is a
       thin shadow FRONT, and what makes it legible is not its own darkness but
       the motes it puts out as it passes them. Light going out is visible on a
       dark background; darkness is not. */
    else if (u.w === "nightfell"){
      const ex = clamp(u.t / 0.50, 0, 1);
      const fade = 1 - clamp((u.t - 0.62) / 0.75, 0, 1);
      const R = Math.max(1, u.radius * (1 - Math.pow(1 - ex, 2.2)));
      const BODY = 54;

      /* the shadow front — thin, and it is a WAVE, not a fill */
      c.globalAlpha = 0.55 * fade * (1 - ex * 0.5);
      const g = c.createRadialGradient(u.x, u.y, Math.max(1, R * 0.86), u.x, u.y, R);
      g.addColorStop(0, "#0A031600"); g.addColorStop(0.7, "#0A0316CC");
      g.addColorStop(1, "#00000000");
      c.fillStyle = g;
      c.beginPath(); c.arc(u.x, u.y, R, 0, TAU); c.fill();
