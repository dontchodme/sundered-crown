    c.beginPath();                                              // the burl
    c.moveTo(L*0.62, -hh*0.30);
    c.bezierCurveTo(L*0.68, -hh*1.16, L*0.96, -hh*1.02, L*1.00, -hh*0.34);
    c.bezierCurveTo(L*1.04,  hh*0.28, L*0.92,  hh*1.12, L*0.74,  hh*0.94);
    c.bezierCurveTo(L*0.64,  hh*0.84, L*0.60,  hh*0.30, L*0.62, -hh*0.30);
    c.closePath();
    const g = c.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, p.steel);
    g.addColorStop(0.5, SHAPES._shade(p.steel, 0.60, 0.45));
    g.addColorStop(1,   SHAPES._shade(p.steel, 0.32, 0.45));
    c.fillStyle = g; c.fill();
    c.strokeStyle = SHAPES._shade(p.dark, 1.0, 0.10);
    c.lineWidth = Math.max(1, W*0.05); c.stroke();

    c.strokeStyle = p.core + "99";                              // grain rings
    c.lineWidth = Math.max(1, W*0.030);
    for (const rr of [0.30, 0.52]){
      c.beginPath(); c.ellipse(L*0.82, 0, hh*rr*0.72, hh*rr, 0, 0, TAU); c.stroke();
    }

    c.fillStyle = p.glow;                                       // three thorns
    for (const ty of [-0.58, 0, 0.58]){
      c.beginPath();
      c.moveTo(L*0.98, hh*ty - hh*0.13);
      c.lineTo(L*1.16, hh*ty * 1.22);
      c.lineTo(L*0.98, hh*ty + hh*0.13);
      c.closePath(); c.fill();
    }
  },

  /* --------------------------------------------------------- BLOODSWORN --
     BARBED, AND EVERY BARB POINTS BACKWARD. The grammar is that the weapon is
     built to keep what it catches: the outline is serrated against the
     direction of travel, so it reads as a thing that goes in easily and does
     not come out. Same argument as hemorrhage, in the silhouette.

     THE CELL'S FLAIR: a hammer cannot cut, so its barbs are on the RETURN --
     a long rearward spur off the back of the head that arrives after the face
     does. It shares `_whBase` entirely; everything here is added. */
  _whBarbed(c, L, W, p){
    const hh = W * 0.50;
    SHAPES._whBase(c, L, W, p);
    c.lineJoin = "miter";
    c.fillStyle = SHAPES._shade(p.steel, 0.72, 0.35);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.55);
    c.lineWidth = Math.max(1, W*0.035);

    for (const sg of [-1, 1]){                                  // hooks, top+bottom
      for (const hx of [0.70, 0.82, 0.94]){
        c.beginPath();
        c.moveTo(L*hx,          sg * hh*0.98);
        c.lineTo(L*(hx-0.09),   sg * hh*1.62);
        c.lineTo(L*(hx+0.035),  sg * hh*1.06);
        c.closePath(); c.fill(); c.stroke();
      }
    }
    c.beginPath();                                              // the return spur
    c.moveTo(L*0.66, -hh*0.34);
    c.lineTo(L*0.40, -hh*1.02);
    c.lineTo(L*0.52, -hh*0.10);
    c.lineTo(L*0.66,  hh*0.20);
    c.closePath(); c.fill(); c.stroke();

    c.fillStyle = p.core;                                       // and it is fed
    c.beginPath();
    c.moveTo(L*0.455, -hh*0.86); c.lineTo(L*0.425, -hh*0.98);
    c.lineTo(L*0.50,  -hh*0.62);
    c.closePath(); c.fill();
  },

  /* ------------------------------------------------------------- UMBRAL --
     EATEN. The grammar is ABSENCE: an umbral weapon is not decorated, it is
     incomplete, and the missing parts are the point. Curse is the only status
     in the game that never expires, and this is that -- damage already done,
     permanently.

     Implemented with `destination-out`, so the bites are real holes in the
     silhouette rather than dark paint on it. That distinction is the entire
     difference between this and a maker's mark: `silhouette_probe.py` scores
     the marks at 0.917-1.000 because paint does not move an outline.

     THE CELL'S FLAIR: the HAFT is bitten through as well, so the head is only
     tenuously attached -- which on the heaviest weapon in the game is the most
     alarming place to put a gap. On a bow the same grammar would eat the limb
     tips; on a hammer it eats the thing holding five kilos of iron. */
  _whEaten(c, L, W, p){
    const hh = W * 0.50;
    c.save();
    SHAPES._whBase(c, L, W, p);
    c.globalCompositeOperation = "destination-out";
    /* THE PATH IS SHARED so the hole and the rim cannot drift apart. The rim
       is why this is needed at all: `drawWeapon` sets a shadowBlur before it
       calls the shape, so `destination-out` removes the GLOW as well as the
       metal and leaves a hard-edged black void -- invisible on a white-on-black
       silhouette sheet, and obviously broken the moment the matrix was pulled
       in colour. An eaten thing has a lit edge where the material stops. */
    const bitePath = (cx, cy, r, seed) => {
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a = i * TAU / 10;
        const rr = r * (0.62 + 0.46 * Math.abs(Math.sin(i * 1.9 + seed)));
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
    };
    const bite = (cx, cy, r, seed) => { bitePath(cx, cy, r, seed); c.fill(); };
    const BITES = [[L*0.72, -hh*0.86, hh*0.62, 0.4],            // out of the head
                   [L*0.99,  hh*0.52, hh*0.50, 2.1],            // out of the face
                   [L*0.342, 0,       W*0.155, 3.4]];           // through the haft
    for (const b of BITES) bite(b[0], b[1], b[2], b[3]);
    c.restore();

    c.save();                                                   // the lit edges
    /* THE RIM CARRIES A SHADOW. `destination-out` removes the glow along
       with the metal, and the glow is 90%+ of the lit picture, so an
       un-lit rim still reads as a hard black hole. Giving the rim its own
       shadowBlur puts light back around the absence. */
    c.shadowColor = p.core; c.shadowBlur = 12;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.045);
    for (const b of BITES){ bitePath(b[0], b[1], b[2], b[3]); c.stroke(); }
    c.restore();

    /* what is left behind: the void does not read as a hole unless something
       is leaking out of it. Two wisps, drawn AFTER the restore so they are not
       themselves eaten. */
    c.save();
    c.globalAlpha = 0.55;
    c.fillStyle = p.core;
    for (const [bx, by, s] of [[0.72, -0.86, 1], [0.99, 0.52, -1]]){
      c.beginPath();
      c.moveTo(L*bx, hh*by);
      c.quadraticCurveTo(L*(bx-0.16), hh*(by + s*0.9),
                         L*(bx-0.30), hh*(by + s*0.4));
      c.quadraticCurveTo(L*(bx-0.14), hh*(by + s*0.2), L*bx, hh*by);
      c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
    c.restore();
  },

  /* --------------------------------------------------------- SANCTIFIED --
     RADIANT, AND PIERCED. The grammar: a sanctified weapon is not solid, it is
     a lantern -- light is meant to come THROUGH it, so the metal is cut away in
     a rosette and a halo stands off behind the working end. Both change the
     outline; the halo especially, because it is the only round thing on a
     rectilinear weapon.

     THE CELL'S FLAIR: the halo sits BEHIND the head rather than around it, so
     the hammer reads as a thing being swung out of the light. Four spurs off
     the ring, at the diagonals, so it cannot be mistaken for a wheel. */
  _whRadiant(c, L, W, p){
    const hh = W * 0.50;
    c.save();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.055);  // the halo
    c.beginPath(); c.arc(L*0.70, 0, hh*1.34, 0, TAU); c.stroke();
    c.lineWidth = Math.max(1, W*0.040);
    for (let i = 0; i < 4; i++){
      const a = Math.PI/4 + i * Math.PI/2;
      c.beginPath();
      c.moveTo(L*0.70 + Math.cos(a)*hh*1.34, Math.sin(a)*hh*1.34);
      c.lineTo(L*0.70 + Math.cos(a)*hh*1.86, Math.sin(a)*hh*1.86);
      c.stroke();
    }
    c.restore();

    SHAPES._whBase(c, L, W, p);

    c.save();                                                    // and pierced
    c.globalCompositeOperation = "destination-out";
    for (const [px, py, r] of [[0.755, 0, 0.30], [0.755, -0.62, 0.19],
                               [0.755, 0.62, 0.19], [0.875, -0.36, 0.15],
                               [0.875, 0.36, 0.15]]){
      c.beginPath(); c.arc(L*px, hh*py, hh*r, 0, TAU); c.fill();
    }
    c.restore();
  },

  /* ------------------------------------------------------------ DWARVEN --
     BUILT, NOT FORGED. The grammar is visible assembly: a dwarven weapon is
     several parts BOLTED TOGETHER, and the fasteners stand proud of the
     surface so you can see it was made by someone. The bow already does this
     with its riveted riser -- this is the same idea on a hammer, and the point
     of putting it here is that the two should look like the same workshop.

     THE CELL'S FLAIR: a hammer is the one weapon where the join has to carry
     the whole load, so the head is strapped to the haft with two long langets
     running back down the shaft, and the bolt bosses project out past the
     head's own edge. The assembly is doing visible work. */
  _whBuilt(c, L, W, p){
    const hh = W * 0.50;
    SHAPES._whBase(c, L, W, p);
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);

    c.fillStyle = iron; c.strokeStyle = dark;
    c.lineWidth = Math.max(1, W*0.030);
    for (const sg of [-1, 1]){                                   // langets
      c.beginPath();
      c.moveTo(L*0.66, sg * W*0.075);
      c.lineTo(L*0.66, sg * W*0.235);
      c.lineTo(L*0.34, sg * W*0.150);
      c.lineTo(L*0.34, sg * W*0.075);
      c.closePath(); c.fill(); c.stroke();
    }
    for (const sg of [-1, 1]){                                   // bolt bosses
      for (const bx of [0.70, 0.90]){
        c.beginPath();
        c.arc(L*bx, sg * hh*1.14, W*0.105, 0, TAU);
        c.fillStyle = iron; c.fill(); c.stroke();
        c.beginPath();
        c.arc(L*bx, sg * hh*1.14, W*0.042, 0, TAU);
        c.fillStyle = dark; c.fill();
      }
    }
    c.fillStyle = iron; c.strokeStyle = dark;                    // a wedge, driven
    c.beginPath();
    c.moveTo(L*0.60, -W*0.30); c.lineTo(L*0.665, -W*0.075);
    c.lineTo(L*0.665, W*0.075); c.lineTo(L*0.60, W*0.30);
    c.closePath(); c.fill(); c.stroke();
  },

  /* -------------------------------------------------------------- VIGIL --
     PLATED. The grammar already exists on the bow -- discrete, countable
     armour segments with a hard value break under each -- and it is the same
     material the ward puts on the shell, so the weapon and the status are
     visibly the same substance. Countable is the whole point: five plates read
     as five things, a smooth casing reads as nothing.

     THE CELL'S FLAIR: on a bow the plates lie along the limbs. On a hammer
     they stack UP the head like a pauldron, each one stepping proud of the one
     beneath, so the striking face is the last and largest plate. The thing
     that shields is also the thing that hits. */
  _whPlated(c, L, W, p){
    const hh = W * 0.50;
    SHAPES._whBase(c, L, W, p);
    c.lineJoin = "round";
    for (let i = 0; i < 4; i++){                                 // stacked plates
      const u = i / 4;
      const x = L * (0.62 + 0.10 * i);
      const h = hh * (0.92 + 0.30 * u);
      c.fillStyle = p.dark;
      c.fillRect(x, -h, L*0.115, h*2);
      c.fillStyle = p.core;
      c.fillRect(x + L*0.012, -h*0.86, L*0.091, h*1.72);
      c.fillStyle = p.glow;
      c.fillRect(x + L*0.012, -h*0.86, L*0.091, h*0.24);
    }
    c.fillStyle = p.dark;                                        // plate studs
    for (let i = 0; i < 4; i++){
      const x = L * (0.62 + 0.10 * i) + L*0.057;
      c.beginPath(); c.arc(x, 0, W*0.038, 0, TAU); c.fill();
    }
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.045);   // haft banding
    for (const gx of [0.22, 0.34, 0.46]){
      c.beginPath();
      c.moveTo(L*gx, -W*0.145); c.lineTo(L*gx, W*0.145); c.stroke();
    }
  },

  /* Short curved fang with a fine point and a hooked back edge. Built for
     opening cuts, not for stopping anything. */
  /* TWINBLADE. One arm of a pair; drawn twice, at blade offsets 0 and 0.5.

     THE BRANCH IS STRUCTURAL, NOT CHROMATIC, and that is the whole point. The
     matrix contact sheet found every row was one silhouette in six colours,
     and the proposed fix was "share the routine, bespoke one real detail
     inside it". This is the first time that has actually been built, so it is
     also the test of it: if bloodsworn and runic read as two weapons here, the
     pattern generalises to all eight shapes and the 48-cell grid is a project.

     No school iconography leaks into the shared part. A dwarven twinblade gets
     the dagger, not a dwarven chevron on a runic ring. */
  twinblade(c, L, W, p, k, aff){
    const key = p.key || aff;
    if (key === "runic")      return SHAPES._twinConjured(c, L, W, p);
    if (key === "verdant")    return SHAPES._tbGrown(c, L, W, p);
    if (key === "bloodsworn") return SHAPES._tbBarbed(c, L, W, p);
    if (key === "umbral")     return SHAPES._tbEaten(c, L, W, p);
    if (key === "sanctified") return SHAPES._tbRadiant(c, L, W, p);
    if (key === "dwarven")    return SHAPES._tbBuilt(c, L, W, p);
    if (key === "vigil")      return SHAPES._tbPlated(c, L, W, p);
    return SHAPES._twinDagger(c, L, W, p);
  },

  /* BLOODSWORN, and anything with no branch of its own: a real dagger, and it
     is defined by everything the conjured one refuses to have -- a grip that
     was gripped, a guard that stops a hand, and a spine heavy enough to have
     been forged. Rick asked for "traditional looking daggers" and traditional
     is carried by the FURNITURE, not by the blade. */
  _twinDagger(c, L, W, p){
    const bh = W * 0.17;
    c.lineJoin = "round"; c.lineCap = "butt";

    c.fillStyle = SHAPES._shade(p.dark, 1.20, 0.30);            // wrapped grip
    c.fillRect(0, -W*0.085, L*0.30, W*0.17);
    c.strokeStyle = "#12100C"; c.lineWidth = Math.max(1, W*0.045);
    for (let i = 1; i <= 5; i++){
      const gx = L * 0.30 * (i/6);
      c.beginPath(); c.moveTo(gx, -W*0.085); c.lineTo(gx + L*0.028, W*0.085); c.stroke();
    }
    c.fillStyle = p.core;                                      // pommel
    c.beginPath(); c.arc(-L*0.018, 0, W*0.105, 0, TAU); c.fill();

    /* The guard hooks BACK toward the hand. A straight bar reads as a small
       sword; the hook is what says dagger at a glance. */
    c.fillStyle = p.steel;
    c.beginPath();
    c.moveTo(L*0.30, -W*0.44); c.lineTo(L*0.355, -W*0.30);
    c.lineTo(L*0.355,  W*0.30); c.lineTo(L*0.30,  W*0.44);
    c.lineTo(L*0.265, W*0.30);  c.lineTo(L*0.265, -W*0.30);
    c.closePath(); c.fill();
    c.fillStyle = "#12100C";
    c.fillRect(L*0.355, -bh*1.2, L*0.03, bh*2.4);              // ricasso, dark

    /* Blade: a fang notch at the base, then a long taper. The notch is the one
       piece of real structure and it is what the eye catches at phone size. */
    c.beginPath();
    c.moveTo(L*0.385, -bh);
    c.lineTo(L*0.50,  -bh*1.34);                               // the notch, out
    c.lineTo(L*0.565, -bh*0.86);                               // and back in
    c.lineTo(L,        0);
    c.lineTo(L*0.565,  bh*0.92);
    c.lineTo(L*0.385,  bh);
    c.closePath();
    c.fillStyle = p.steel; c.fill();
    c.save(); c.shadowBlur = 0; c.globalAlpha = SHAPES._lit(c);  /* world light */                                // interior facet
    /* WAS "#00000055" -- one black at 33% for all 48 cells, which is a
       shadow the palette cannot reach. `_shade` off the school's own steel
       instead, so a bloodsworn dagger's dark side is a bloodsworn dark. */
    c.fillStyle = SHAPES._facet(p.steel, p.dark, 0.60);          // shadowed flat
    c.beginPath();
    c.moveTo(L*0.385, bh*0.10); c.lineTo(L*0.90, 0);
    c.lineTo(L*0.565, bh*0.92); c.lineTo(L*0.385, bh);
    c.closePath(); c.fill();
    c.restore();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.05);  // one honed edge
    c.beginPath();
    c.moveTo(L*0.385, -bh); c.lineTo(L*0.50, -bh*1.34);
    c.lineTo(L*0.565, -bh*0.86); c.lineTo(L, 0);
    c.stroke();
  },

  /* ============================================== TWINBLADE, PER SCHOOL ==
     The type is the shortest and fastest in the game -- reach 62, spin 5.7,
     drawn TWICE at blade offsets 0 and 0.5. Two consequences that no other
     type has:

       - everything here is drawn twice, so every grammar costs double
       - at spin 5.7 the pair reads as a spinning cross, and the thing a viewer
         actually sees is the OUTER TRACE of the two blades. So a grammar that
         changes the tip or the back edge shows; one that changes the grip is
         almost invisible.

     Each therefore puts its structure at the far end. */

  /* SANCTIFIED. Pierced, and the guard becomes a ring -- the smallest possible
     version of the halo, because at this reach anything larger would be a
     wheel with a knife through it. */
  _tbRadiant(c, L, W, p){
    const bh = W * 0.17;
    c.save();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.075);
    c.beginPath(); c.arc(L*0.33, 0, W*0.42, 0, TAU); c.stroke();
    c.restore();
    SHAPES._twinDagger(c, L, W, p);
    c.save();
    c.globalCompositeOperation = "destination-out";
    /* AN ERASE TAKES ITS STRENGTH FROM THE SOURCE ALPHA, and this site never
       set one -- it inherited whatever fill the base shape happened to finish
       on, so the depth of every bite in the game was decided by the last line
       of a function that knows nothing about biting. depth_build.py --erase. */
    c.fillStyle = "#00000055";
    for (let i = 0; i < 3; i++){
      c.beginPath();
      c.arc(L*(0.50 + 0.13*i), 0, bh*(0.44 - 0.07*i), 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* DWARVEN. Bolted, and the point is a CHISEL -- the same tell as the dwarven
     greatsword, which is what makes the two read as one workshop. */
  _tbBuilt(c, L, W, p){
    const bh = W * 0.17;
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);
    SHAPES._twinDagger(c, L, W, p);
    c.fillStyle = iron; c.strokeStyle = dark;
    c.lineWidth = Math.max(1, W*0.030);
    c.beginPath();                                             // the chisel
    c.moveTo(L*0.86, -bh*0.62); c.lineTo(L*1.02, -bh*0.52);
    c.lineTo(L*1.02,  bh*0.52); c.lineTo(L*0.86,  bh*0.62);
    c.closePath(); c.fill(); c.stroke();
    c.fillRect(L*0.36, -bh*1.28, L*0.055, bh*2.56);            // a collar
    c.strokeRect(L*0.36, -bh*1.28, L*0.055, bh*2.56);
    c.fillStyle = dark;
    for (const rx of [0.50, 0.64, 0.78]){
      c.beginPath(); c.arc(L*rx, 0, W*0.048, 0, TAU); c.fill();
    }
  },

  /* BLOODSWORN. The dagger already has ONE notch at the base of the blade --
     the shape's own comment calls it "the one piece of real structure". This
     school gets three more, running back down the spine, so the notch stops
     being a detail and becomes the weapon's argument. */
  _tbBarbed(c, L, W, p){
    const bh = W * 0.17;
    SHAPES._twinDagger(c, L, W, p);
    c.lineJoin = "miter";
    c.fillStyle = SHAPES._shade(p.steel, 0.74, 0.32);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.52);
    c.lineWidth = Math.max(1, W*0.030);
    for (let i = 0; i < 3; i++){
      const x = L * (0.52 + 0.13 * i);
      c.beginPath();
      c.moveTo(x,           bh*0.86);
      c.lineTo(x - L*0.085, bh*2.05);
      c.lineTo(x + L*0.035, bh*1.05);
      c.closePath(); c.fill(); c.stroke();
    }
    for (const sg of [-1, 1]){                                 // guard, hooked
      c.beginPath();
      c.moveTo(L*0.285, sg * W*0.30);
      c.quadraticCurveTo(L*0.20, sg * W*0.86, L*0.335, sg * W*0.80);
      c.quadraticCurveTo(L*0.325, sg * W*0.48, L*0.355, sg * W*0.26);
      c.closePath(); c.fill(); c.stroke();
    }
  },

  /* VERDANT. A thorn on a stem -- the smallest and most literal reading of the
     grammar in the game, and the right one: at this size a leaf with veins
     would be mush, and a thorn is exactly a short curved point. */
  _tbGrown(c, L, W, p){
    const bh = W * 0.17;
    const wood = SHAPES._shade(p.dark, 1.28, 0.22);
    c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = wood; c.lineWidth = W*0.20;                // the stem
    c.beginPath(); c.moveTo(-L*0.02, W*0.03); c.lineTo(L*0.34, 0); c.stroke();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.055);
    for (const sg of [-1, 1]){                                 // two shoots
      c.beginPath();
      c.moveTo(L*0.30, sg * W*0.06);
      c.quadraticCurveTo(L*0.20, sg * W*0.62, L*0.42, sg * W*0.56);
      c.stroke();
    }
    c.beginPath();                                             // the thorn
    c.moveTo(L*0.34, -bh*0.90);
    c.quadraticCurveTo(L*0.74, -bh*1.05, L*1.02, -bh*0.05);
    c.quadraticCurveTo(L*0.72,  bh*0.60, L*0.34,  bh*0.95);
    c.closePath();
    const g = c.createLinearGradient(0, -bh, 0, bh);
    g.addColorStop(0, p.glow); g.addColorStop(0.5, p.steel);
    g.addColorStop(1, SHAPES._shade(p.steel, 0.46, 0.38));
    c.fillStyle = g; c.fill();
    c.strokeStyle = SHAPES._shade(p.dark, 1.1, 0.12);
    c.lineWidth = Math.max(1, W*0.038);
    c.beginPath(); c.moveTo(L*0.36, 0); c.lineTo(L*0.98, -bh*0.10); c.stroke();
  },

  /* UMBRAL. The point is gone, as on the greatsword -- and on a weapon whose
     entire job is to be the fastest thing on the floor, a blunt one is the
     most upsetting version available. */
  _tbEaten(c, L, W, p){
    const bh = W * 0.17;
    c.save();
    SHAPES._twinDagger(c, L, W, p);
    c.globalCompositeOperation = "destination-out";
    /* AN ERASE TAKES ITS STRENGTH FROM THE SOURCE ALPHA, and this site never
       set one -- it inherited whatever fill the base shape happened to finish
       on, so the depth of every bite in the game was decided by the last line
       of a function that knows nothing about biting. depth_build.py --erase. */
    c.fillStyle = "#00000055";
    c.beginPath();
    c.moveTo(L*0.74, -bh*2.2);
    c.lineTo(L*0.82, -bh*0.55); c.lineTo(L*0.76, bh*0.10);
    c.lineTo(L*0.84,  bh*2.2);  c.lineTo(L*1.40, bh*2.2);
    c.lineTo(L*1.40, -bh*2.2);
    c.closePath(); c.fill();
    for (const [bx, by, r, s] of [[0.50, -0.95, 0.62, 0.4],
                                  [0.63,  1.00, 0.50, 2.1]]){
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a = i * TAU / 10;
        const rr = bh * r * (0.58 + 0.50 * Math.abs(Math.sin(i * 1.9 + s)));
        const px = L*bx + Math.cos(a) * rr, py = bh*by + Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
    }
    c.restore();
    c.save();
    c.globalAlpha = 0.5; c.fillStyle = p.core;
    c.beginPath();
    c.moveTo(L*0.80, -bh*0.30);
    c.quadraticCurveTo(L*1.04, -bh*1.20, L*1.14, -bh*0.05);
    c.quadraticCurveTo(L*0.96, -bh*0.40, L*0.82, bh*0.24);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
    c.restore();
  },

  /* VIGIL. Three lames -- not five. The blade is 62 units long and drawn
     twice; five plates at this scale is a texture, and this build has learned
     that a viewer counts objects and cannot read a texture. */
  _tbPlated(c, L, W, p){
    const bh = W * 0.17;
    SHAPES._twinDagger(c, L, W, p);
    c.fillStyle = p.dark;                                      // guard shield
    c.beginPath();
    c.moveTo(L*0.275, -W*0.52); c.lineTo(L*0.375, -W*0.40);
    c.lineTo(L*0.375,  W*0.40); c.lineTo(L*0.275,  W*0.52);
    c.closePath(); c.fill();
    c.fillStyle = p.core; c.fillRect(L*0.295, -W*0.32, L*0.062, W*0.64);
    c.fillStyle = p.glow; c.fillRect(L*0.295, -W*0.32, L*0.062, W*0.18);
    for (let i = 0; i < 3; i++){
      const x = L * (0.41 + 0.155 * i);
      const h = bh * (1.24 - 0.18 * i);
      c.fillStyle = p.dark;  c.fillRect(x, -h, L*0.135, h*2);
      c.fillStyle = p.core;  c.fillRect(x + L*0.014, -h*0.82, L*0.107, h*1.64);
      c.fillStyle = p.glow;  c.fillRect(x + L*0.014, -h*0.82, L*0.107, h*0.28);
      c.fillStyle = p.dark;
      c.beginPath(); c.arc(x + L*0.068, 0, W*0.042, 0, TAU); c.fill();
    }
  },

  /* RUNIC. NOT A BLADE. A BLADE-SHAPED CONSTELLATION.

     v1 was a swept crescent with glyphs notched along the spine, and Rick
     called it exactly right: "looks like a weird bread knife." The curve plus
     the notches read as SERRATION, and a serrated edge is the most mundane
     thing a blade can have -- it says kitchen, and it says a smith made it.
     Every stroke was arguing against the school's only thesis.

     So this is not a curved thing with decoration on it. There is no solid
     blade at all: six hard crystalline shards hang in a blade-shaped line with
     real daylight between them, light bleeds out through the gaps, they drift
     against one another, and a sigil turns backwards in the space where a hand
     would be. "Held by nothing" twice over -- no hilt, and no blade either.

     Three reasons this is the right answer and not merely a louder one:

       - It cannot be mistaken for a forged weapon at any size. Straight,
         faceted, chipped, floating. v1's failure was looking ORDINARY, and
         shards are the opposite axis entirely rather than more of the same.
       - It is COUNTABLE. Six things, with gaps. This project has learned twice
         that a viewer reads objects and cannot read a texture -- five ward
         plates over a continuous arc, discrete marks over a pattern. Those
         glyph notches were a texture pretending to be information.
       - The drift is the only self-animating art in the game and it costs one
         float. A weapon that moves while the relic is standing still says
         "this is held together by will" without a word.

     Deterministic and presentation-only: SHAPES._t is a frame clock, no rng is
     touched, and bladeSegments still derives the hit segment from f.theta.
     Nothing here can move a hitbox. */
  /* MERGED INTO `_conjure`, 2026-08-14, behind `tools/twin_identity.py`.
     The private copy is gone; the options below are what it differed by.
     `dark`, `tipX` and `tipR` exist so this shape can keep the exact ink
     it shipped with -- they default to what `_conjure` hardcoded, so
     `_gsConjured` and `_whConjured` do not move. 0 differing pixels at 20
     values of `_t` over the full 20*pi common period, at both sizes. */
  _twinConjured(c, L, W, p){
    const gap = L * 0.28, span = L - gap, bw = W * 0.52;
    const prof = (cc) => {
      cc.beginPath();
      cc.moveTo(gap,               -bw * 0.46);
      cc.lineTo(gap + span * 0.16, -bw);
      cc.lineTo(L * 0.97,          -bw * 0.13);
      cc.lineTo(L * 1.03,           0);
      cc.lineTo(L * 0.97,           bw * 0.11);
      cc.lineTo(gap + span * 0.16,  bw * 0.80);
      cc.lineTo(gap,                bw * 0.34);
      cc.closePath();
    };
    SHAPES._conjure(c, L, W, p, { n:5, gap, bw, prof, frac:0.87,
                                  beam:0.055, drift:0.065, cant:0.075,
                                  sigil:0.26, tipX:1.04, tipR:0.085,
                                  dark:"#040814" });
  },

  daggers(c, L, W, p){
    const bh = W * 0.30;
    c.fillStyle = "#2A1216";                                   // grip
    c.fillRect(0, -W*0.10, L*0.30, W*0.20);
    c.fillStyle = p.core;
    c.beginPath(); c.arc(-L*0.02, 0, W*0.13, 0, TAU); c.fill();
    c.fillStyle = p.core;                                      // small guard
    c.beginPath();
    c.moveTo(L*0.29, -W*0.40); c.lineTo(L*0.345, -W*0.26);
    c.lineTo(L*0.345, W*0.26); c.lineTo(L*0.29,  W*0.40);
    c.closePath(); c.fill();

    c.beginPath();                                             // recurved blade
    c.moveTo(L*0.35, -bh*0.85);
    c.bezierCurveTo(L*0.62, -bh*1.30, L*0.86, -bh*0.95, L, -bh*0.06);
    c.bezierCurveTo(L*0.84,  bh*0.34, L*0.60,  bh*0.72, L*0.35, bh*0.85);
    c.closePath();
    c.fillStyle = p.steel; c.fill();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.06);  // cutting edge
    c.beginPath();
    c.moveTo(L*0.35, -bh*0.85);
    c.bezierCurveTo(L*0.62, -bh*1.30, L*0.86, -bh*0.95, L, -bh*0.06);
    c.stroke();
    c.strokeStyle = p.core + "AA"; c.lineWidth = Math.max(1, W*0.04);
    c.beginPath();
    c.moveTo(L*0.40, 0); c.lineTo(L*0.88, -bh*0.12); c.stroke();
  },

  /* A broad crescent set across the line of the swing — the widest cutting
     arc in the roster, and the reason it hits from further out than it looks. */
  /* =============================================================== SCYTHE ==
     Same three layers as the warhammer. `_scBase` is the type; each grammar
     either calls it and modifies, or -- for runic -- refuses it. */
  scythe(c, L, W, p, k, aff){
    const key = p.key || aff;
    if (key === "runic")      return SHAPES._scConjured(c, L, W, p);
    if (key === "verdant")    return SHAPES._scGrown(c, L, W, p);
    if (key === "bloodsworn") return SHAPES._scBarbed(c, L, W, p);
    if (key === "umbral")     return SHAPES._scEaten(c, L, W, p);
    if (key === "sanctified") return SHAPES._scRadiant(c, L, W, p);
    if (key === "dwarven")    return SHAPES._scBuilt(c, L, W, p);
    if (key === "vigil")      return SHAPES._scPlated(c, L, W, p);
    return SHAPES._scBase(c, L, W, p);
  },

  /* The crescent, as a reusable path. Every grammar needs it -- to fill it, to
     clip to it, to stroke a plate along it -- so it is defined once. */
  _scCrescent(c, L, W){
    c.beginPath();
    c.moveTo(L*0.70, W*0.20);
    c.bezierCurveTo(L*1.02, -W*0.20, L*0.98, -W*0.95, L*0.56, -W*1.32);
    c.bezierCurveTo(L*0.88, -W*0.72, L*0.86, -W*0.10, L*0.66, W*0.30);
    c.closePath();
  },

  /* A point on the crescent's OUTER edge, and the normal there. The barbs, the
     plates and the bolts all ride this curve, and hand-placing them per grammar
     is how three grammars end up disagreeing about where the back of the blade
     is.

     THE NORMAL IS INWARD, NOT OUTWARD, AND EVERY CALL SITE ASSUMES OTHERWISE.
     Measured 2026-08-14 by `tools/scouter_check.py`, not judged by eye:

       consistent   handedness is the same at all 1921 interior samples, ‖n‖=1
                    to 3.3e-16, n.t = 2.5e-9 against a finite-difference
                    tangent, and |dP/du| never drops below 78 -- there is no
                    cusp and no flip anywhere on the curve.
       inward       `q + n*eps` is INSIDE the shipped `_scCrescent` path at
                    1921 of 1921 interior samples. The crack comment in
                    `_scConjured` was right all along; the call sites are what
                    is wrong.
       0 of 37      call sites move toward the side their own comment names.
                    ALL of them are inverted, not some.

     What that costs, per grammar: `_scRadiant`'s rays cross the blade and stick
     out of the cutting edge instead of reaching the halo, and its "pierced
     spine" destination-out holes land 0.30W off the BACK -- where the halo is,
     so what they actually pierce is the halo, chopping that arc into segments
     (573 px, `scouter_check.py --consequence`). `_scBarbed`'s barbs sweep
     across the concave face rather than dragging off the back. `_scPlated`'s
     five plates sit ON the blade instead of armouring its back. `_scGrown`'s
     "inner serration" pokes outward. `_scBuilt`'s strap sits a hairline inside
     the metal it is meant to be bolted onto.

     NOT FIXED HERE. Flipping the sign is one character and it moves six of the
     seven approved scythe silhouettes -- 0.95% of the frame (verdant) to 7.87%
     (vigil), runic 0.00% as the control that does not call this. That is a
     decision for eyes, and `scouter_check.py --sheet` is the before/after.
     Until then this comment is the truth and the call sites are not. */
  _scOuter(L, W, u){
    const p0 = [L*0.70, W*0.20], p1 = [L*1.02, -W*0.20],
          p2 = [L*0.98, -W*0.95], p3 = [L*0.56, -W*1.32];
    const it = 1 - u;
    const b = (a, bq, cq, d) => it*it*it*a + 3*it*it*u*bq + 3*it*u*u*cq + u*u*u*d;
    const db = (a, bq, cq, d) => 3*it*it*(bq-a) + 6*it*u*(cq-bq) + 3*u*u*(d-cq);
    const x = b(p0[0], p1[0], p2[0], p3[0]), y = b(p0[1], p1[1], p2[1], p3[1]);
    const tx = db(p0[0], p1[0], p2[0], p3[0]), ty = db(p0[1], p1[1], p2[1], p3[1]);
    const m = Math.hypot(tx, ty) || 1;
    return { x, y, nx: ty / m, ny: -tx / m, a: Math.atan2(ty, tx) };
  },

  _scBase(c, L, W, p){
    c.lineCap = "round";
    c.strokeStyle = SHAPES._shade(p.dark, 1.30, 0.28); c.lineWidth = W*0.15;  // snath
    c.beginPath();
    c.moveTo(0, 0); c.quadraticCurveTo(L*0.44, W*0.30, L*0.70, W*0.16);
    c.stroke();
    c.strokeStyle = p.core + "66"; c.lineWidth = W*0.05;        // bound cord
    c.beginPath();
    c.moveTo(L*0.06, 0); c.quadraticCurveTo(L*0.44, W*0.26, L*0.68, W*0.14);
    c.stroke();
    c.fillStyle = p.dark;                                       // collar
    c.beginPath(); c.arc(L*0.70, W*0.14, W*0.12, 0, TAU); c.fill();
    /* The scythe carried NO school-specific structure whatsoever and is the
       second-tightest pair in school_probe.py. The mark rides the collar. */
    SHAPES._makerMark(c, L*0.70, W*0.14, W*0.115, W*0.62, p);

    const cres = (cc) => {                                      // crescent
      cc.beginPath();
      cc.moveTo(L*0.70, W*0.20);
      cc.bezierCurveTo(L*1.02, -W*0.20, L*0.98, -W*0.95, L*0.56, -W*1.32);
      cc.bezierCurveTo(L*0.88, -W*0.72, L*0.86, -W*0.10, L*0.66, W*0.30);
      cc.closePath();
    };
    cres(c);
    const g = c.createLinearGradient(L*0.55, -W, L*0.95, W*0.2);
    /* the tail was the literal #5E6B58 -- a desaturated GREEN, i.e. verdant,
       shaded into every school's scythe. Nobody had named it. */
    g.addColorStop(0, p.glow); g.addColorStop(0.55, p.steel);
    g.addColorStop(1, SHAPES._shade(p.steel, 0.44, 0.38));
    c.fillStyle = g; c.fill();
    /* THE BACK OF THE WEDGE. The crescent is a blade seen edge-on: the inner
       curve is honed and already carries a lit stroke, so the outer half has
       to fall away or that stroke reads as a rim light on a flat sticker.
       Clip to the crescent, flood it dark, then lay the gradient back down
       shifted TOWARD the honed edge -- what stays uncovered is a band along
       the back, exactly where the metal turns away. Interior: no glow. */
    c.save(); c.shadowBlur = 0;                                 /* world light */
    const wl = SHAPES._litN(c); c.globalAlpha = Math.abs(wl);
    cres(c); c.clip();
    c.fillStyle = SHAPES._facet(p.steel, p.dark, 0.68);
    c.fillRect(L*0.40, -W*1.50, L*0.80, W*2.00);
    c.translate(-W*0.10, W*0.115 * (wl < 0 ? -1 : 1));
    cres(c); c.fillStyle = g; c.fill();
    c.restore();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.05);  // inner edge
    c.beginPath();
    c.moveTo(L*0.70, W*0.20);
    c.bezierCurveTo(L*1.02, -W*0.20, L*0.98, -W*0.95, L*0.56, -W*1.32);
    c.stroke();
  },

  /* --------------------------------------------------------------- RUNIC --
     IN PIECES -- BUT IT IS THE SNATH THAT BREAKS, NOT THE BLADE.

     v1 did what the grammar does everywhere else: deleted the haft and
     fractured the blade. On a scythe that fails, and `silhouette_probe.py` said
     so at IoU 0.162 -- past the 0.303 floor where two different weapon TYPES
     sit. Rick's read of the sheet: a floating arc and a disconnected ball, two
     objects rather than a weapon.

     THE REASON IS PROPORTION. The snath is ~60% of a scythe's footprint, and
     the L -- a long pole with a hook at the far end -- IS the type. Delete it
     and what is left is a crescent, which is a different weapon. On a hammer
     the haft is thin and the head carries the identity, so deleting the haft
     costs nothing; the grammar transferred there and did not transfer here.

     So the flair for this cell inverts which part comes apart. The snath is
     six shards suspended along the line a snath would take -- held by nothing,
     twice as literally as anywhere else, because now the thing being held by
     nothing is the handle. The crescent stays nearly whole, in two pieces, so
     the hook still reads as a hook.

     GENERAL FORM, worth carrying to the remaining types: **runic fractures
     whatever part of the type carries its IDENTITY, which is not always the
     part that carries its mass.** */
  _scConjured(c, L, W, p){
    const t = SHAPES._t || 0;

    /* the line the snath takes, sampled -- the same quadratic _scBase strokes */
    const snath = (u) => {
      const it = 1 - u;
      return { x: 2*it*u*(L*0.44) + u*u*(L*0.70),
               y: 2*it*u*(W*0.30) + u*u*(W*0.16),
               a: Math.atan2(2*it*(W*0.30) + 2*u*(W*0.16 - W*0.30),
                             2*it*(L*0.44) + 2*u*(L*0.70 - L*0.44)) };
    };

    c.save();                                        // light along the whole L
    c.globalCompositeOperation = "lighter";
    /* WIDE. At W*0.045 this was a hairline and the six shards read as six
       objects; `silhouette_probe.py` put runic 0.10 below the cross-type floor
       and Rick's read of the sheet was "two objects rather than a weapon". At
       W*0.095 the light fills the daylight, so the snath reads as ONE thing
       that has come apart -- which is the grammar's actual claim. */
    c.strokeStyle = p.core + "99"; c.lineWidth = W*0.095; c.lineCap = "round";
    c.beginPath();
    c.moveTo(L*0.04, W*0.02);
    c.quadraticCurveTo(L*0.44, W*0.30, L*0.70, W*0.16);
    c.stroke();
    c.restore();

    const NS = 6;                                    // the snath, in pieces
    for (let i = 0; i < NS; i++){
      const u0 = 0.06 + (i / NS) * 0.94, u1 = 0.06 + ((i + 0.80) / NS) * 0.94;
      const q0 = snath(u0), q1 = snath(u1);
      const drift = Math.sin(t * 2.0 + i * 2.3) * W * 0.070;
      const cant  = Math.sin(t * 1.6 + i * 1.4) * 0.10;
      const half  = W * (0.115 - 0.02 * (i / NS));   // tapers toward the collar
      c.save();
      c.translate((q0.x + q1.x) / 2, (q0.y + q1.y) / 2 + drift);
      c.rotate(q0.a + cant);
      const len = Math.hypot(q1.x - q0.x, q1.y - q0.y);
      /* p.dark, not "#040814". A near-black literal is invisible against a
         white-on-black mask and reads as a BLACK BAR through the weapon once
         the matrix is pulled in colour -- the silhouette probe cannot see it
         because the probe flattens every colour to the same white. */
      c.fillStyle = p.dark;
      c.fillRect(-len/2 - W*0.012, -half - W*0.012, len + W*0.024, half*2 + W*0.024);
      const g = c.createLinearGradient(0, -half, 0, half);
      g.addColorStop(0, p.steel); g.addColorStop(0.52, p.core); g.addColorStop(1, p.dark);
      c.fillStyle = g; c.globalAlpha = 0.94;
      c.fillRect(-len/2, -half, len, half*2); c.globalAlpha = 1;
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.032);
      c.strokeRect(-len/2, -half, len, half*2);
      c.restore();
    }

    /* THE HOOK STAYS A HOOK, AND IT IS ONLY CRACKED.

       v2 sliced it into two wedge-clipped pieces and the crescent DID NOT
       RENDER AT ALL -- `_scOuter`'s normal points into the concave side of this
       curve, so the clip wedges were opening away from the blade. The sheet
       showed a sigil and a row of blocks and no hook, which is why the number
       would not move however the daylight was tuned. Caught by looking, not by
       measuring: the metric said 0.20 either way.

       So: draw the crescent whole and punch ONE crack through it. It cannot
       miss, and it is better art -- the fracture ESCALATES toward the hand. Six
       pieces at the grip, a single crack at the far end. The closer to the
       sigil that is holding it, the less of it there is. */
    SHAPES._scCrescent(c, L, W);
    c.fillStyle = p.dark; c.fill();
    const gg = c.createLinearGradient(L*0.55, -W, L*0.95, W*0.2);
    gg.addColorStop(0, p.glow); gg.addColorStop(0.55, p.core); gg.addColorStop(1, p.dark);
    SHAPES._scCrescent(c, L, W);
    c.fillStyle = gg; c.globalAlpha = 0.94; c.fill(); c.globalAlpha = 1;
    SHAPES._scCrescent(c, L, W);
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.045); c.stroke();

    /* A SEAM, NOT A HOLE. This was `destination-out` and it read as a hard
       black bar laid across the blade -- because punching through a shadowed
       draw removes the GLOW too, and on this shape the crack crosses the
       widest, brightest part of the crescent. Filling `p.dark` and lighting
       both faces says "broken" without taking the light out of the weapon, and
       it cannot erase anything. */
    c.save();
    SHAPES._scCrescent(c, L, W); c.clip();
    c.translate(L*0.86, -W*0.42);
    c.rotate(0.55 + Math.sin(t * 1.7) * 0.06);
    c.fillStyle = p.dark;
    c.fillRect(-W*0.62, -W*0.075, W*1.24, W*0.15);
    c.shadowColor = p.core; c.shadowBlur = 10;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.038);
    c.beginPath();
    c.moveTo(-W*0.62, -W*0.075); c.lineTo(W*0.62, -W*0.075);
    c.moveTo(-W*0.62,  W*0.075); c.lineTo(W*0.62,  W*0.075);
    c.stroke();
    c.restore();

    c.save();                                        // the sigil, at the grip
    c.translate(L*0.03, W*0.01);
    c.rotate(-t * 2.4);
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.030);
    c.shadowColor = p.core; c.shadowBlur = 14;
    const rr = W * 0.22;
    c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3;
      const x = Math.cos(a) * rr * 0.60, y = Math.sin(a) * rr * 0.60;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.stroke();
    c.restore();
  },

  /* ------------------------------------------------------------- VERDANT --
     GROWN. A scythe is already the most agricultural object in the game, so
     the grammar has to work harder here than anywhere: the answer is that this
     one was never harvested WITH, it grew as a hook.

     THE CELL'S FLAIR: the snath is a runner that puts down two shoots, and the
     crescent is a single enormous THORN with the inner edge serrated into
     smaller thorns -- a bramble's grabbing hook at weapon scale. */
  _scGrown(c, L, W, p){
    const wood = SHAPES._shade(p.dark, 1.30, 0.22);
    c.lineCap = "round"; c.lineJoin = "round";

    c.strokeStyle = wood; c.lineWidth = W*0.15;                 // the runner
    c.beginPath();
    c.moveTo(0, -W*0.06);
    c.quadraticCurveTo(L*0.40, W*0.42, L*0.70, W*0.16);
    c.stroke();
    c.lineWidth = W*0.055;                                      // two shoots
    for (const [sx, sy, ex, ey] of [[0.20, 0.14, 0.30, -0.42],
                                    [0.44, 0.34, 0.56, 0.86]]){
      c.beginPath();
      c.moveTo(L*sx, W*sy);
      c.quadraticCurveTo(L*(sx+ex)*0.5, W*(sy+ey)*0.62, L*ex, W*ey);
      c.stroke();
      c.fillStyle = p.core;
      c.beginPath();
      c.ellipse(L*ex, W*ey, L*0.042, W*0.075, ey > 0 ? 0.7 : -0.7, 0, TAU);
      c.fill();
    }

    SHAPES._scCrescent(c, L, W);                                // the thorn
    const g = c.createLinearGradient(L*0.55, -W, L*0.95, W*0.2);
    g.addColorStop(0, p.glow); g.addColorStop(0.55, p.steel);
    g.addColorStop(1, SHAPES._shade(p.steel, 0.44, 0.38));
    c.fillStyle = g; c.fill();

    /* SMALL. v1 ran these to W*0.46 and turned the crescent inside out -- the
       thorn stopped reading as a blade at all. A grammar has to survive its
       type; see resume-here-v13 §4.2 on the band. */
    c.fillStyle = p.core;                                       // inner serration
    for (let i = 1; i <= 6; i++){
      const q = SHAPES._scOuter(L, W, i / 7);
      c.beginPath();
      c.moveTo(q.x - q.nx * W*0.04, q.y - q.ny * W*0.04);
      c.lineTo(q.x - q.nx * W*0.19 + Math.cos(q.a) * W*0.11,
               q.y - q.ny * W*0.19 + Math.sin(q.a) * W*0.11);
      c.lineTo(q.x - q.nx * W*0.05 + Math.cos(q.a) * W*0.13,
               q.y - q.ny * W*0.05 + Math.sin(q.a) * W*0.13);
      c.closePath(); c.fill();
    }
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.05);
    c.beginPath();
    c.moveTo(L*0.70, W*0.20);
    c.bezierCurveTo(L*1.02, -W*0.20, L*0.98, -W*0.95, L*0.56, -W*1.32);
    c.stroke();
  },

  /* ---------------------------------------------------------- BLOODSWORN --
     BARBED BACKWARD. On a hammer "backward" was the return stroke. On a scythe
     it is unambiguous: the blade cuts on the INSIDE of the curve, so the barbs
     go on the OUTSIDE, where they drag on the way out.

     THE CELL'S FLAIR: the barbs get longer toward the tip, so the far end of
     the sweep is the part that catches -- which is also the part travelling
     fastest. */
  _scBarbed(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    c.lineJoin = "miter";
    c.fillStyle = SHAPES._shade(p.steel, 0.74, 0.32);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.55);
    c.lineWidth = Math.max(1, W*0.03);
    for (let i = 1; i <= 5; i++){
      const u = i / 6;
      const q = SHAPES._scOuter(L, W, u);
      const len = W * (0.19 + 0.30 * u);           // v1 ran to 0.56 and merged
      c.beginPath();
      c.moveTo(q.x, q.y);
      c.lineTo(q.x + q.nx * len - Math.cos(q.a) * len * 0.85,
               q.y + q.ny * len - Math.sin(q.a) * len * 0.85);
      c.lineTo(q.x + Math.cos(q.a) * W * 0.16, q.y + Math.sin(q.a) * W * 0.16);
      c.closePath(); c.fill(); c.stroke();
    }
    const tip = SHAPES._scOuter(L, W, 1.0);                     // and a tip hook
    c.beginPath();
    c.moveTo(tip.x, tip.y);
    c.lineTo(tip.x + W*0.10, tip.y - W*0.52);
    c.lineTo(tip.x + W*0.34, tip.y - W*0.10);
    c.closePath(); c.fill(); c.stroke();
  },

  /* ------------------------------------------------------------- UMBRAL --
     EATEN. THE CELL'S FLAIR: the bites are taken out of the CUTTING edge, so
     the blade has gaps exactly where it is supposed to work, and the snath is
     bitten through just below the collar -- the one joint the whole weapon
     hangs from. */
  _scEaten(c, L, W, p){
    c.save();
    SHAPES._scBase(c, L, W, p);
    c.globalCompositeOperation = "destination-out";
    /* shared path — see _whEaten: destination-out removes the glow too, so an
       un-rimmed bite is a hard black hole in the picture. */
    const bitePath = (bx, by, r, seed) => {
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a = i * TAU / 10;
        const rr = r * (0.60 + 0.48 * Math.abs(Math.sin(i * 1.9 + seed)));
        const px = bx + Math.cos(a) * rr, py = by + Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
    };
    const bite = (bx, by, r, seed) => { bitePath(bx, by, r, seed); c.fill(); };
    const RIMS = [];
    /* SMALL, and off the EDGE rather than through the middle. v1 used
       0.30/0.24 centred at W*0.16 inboard and left a sliver, which reads
       as broken rather than eaten. */
    for (const [u, r, s] of [[0.32, 0.17, 0.4], [0.66, 0.14, 2.1]]){
      const q = SHAPES._scOuter(L, W, u);
      RIMS.push([q.x + q.nx * W*0.02, q.y + q.ny * W*0.02, W*r, s]);
    }
    RIMS.push([L*0.685, W*0.155, W*0.13, 1.3]);                 // the joint
    for (const b of RIMS) bite(b[0], b[1], b[2], b[3]);
    c.restore();

    c.save();
    /* THE RIM CARRIES A SHADOW. `destination-out` removes the glow along
       with the metal, and the glow is 90%+ of the lit picture, so an
       un-lit rim still reads as a hard black hole. Giving the rim its own
       shadowBlur puts light back around the absence. */
    c.shadowColor = p.core; c.shadowBlur = 12;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.040);
    for (const b of RIMS){ bitePath(b[0], b[1], b[2], b[3]); c.stroke(); }
    c.restore();

    c.save();                                                    // what leaks out
    c.globalAlpha = 0.5; c.fillStyle = p.core;
    for (const u of [0.30, 0.62]){
      const q = SHAPES._scOuter(L, W, u);
      c.beginPath();
      c.moveTo(q.x, q.y);
      c.quadraticCurveTo(q.x - q.nx * W*0.9, q.y - q.ny * W*0.9,
                         q.x - q.nx * W*0.5 - Math.cos(q.a) * W*0.5,
                         q.y - q.ny * W*0.5 - Math.sin(q.a) * W*0.5);
      c.quadraticCurveTo(q.x - q.nx * W*0.3, q.y - q.ny * W*0.3, q.x, q.y);
      c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
    c.restore();
  },

  /* ---------------------------------------------------------- SANCTIFIED --
     RADIANT AND PIERCED. THE CELL'S FLAIR: the halo does not sit behind the
     blade the way it does behind a hammer head -- it follows the crescent, a
     second arc standing off the back, so the weapon reads as a sweep of light
     with a blade inside it. The piercings run along the blade's spine. */
  _scRadiant(c, L, W, p){
    c.save();                                                    // the outer arc
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.085);
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(L*0.78, W*0.34);
    c.bezierCurveTo(L*1.26, -W*0.22, L*1.20, -W*1.20, L*0.52, -W*1.66);
    c.stroke();
    c.lineWidth = Math.max(1, W*0.045);                          // and its rays
    for (let i = 1; i <= 4; i++){
      const q = SHAPES._scOuter(L, W, i / 5);
      c.beginPath();
      c.moveTo(q.x + q.nx * W*0.10, q.y + q.ny * W*0.10);
      c.lineTo(q.x + q.nx * W*0.40, q.y + q.ny * W*0.40);
      c.stroke();
    }
    c.restore();

    SHAPES._scBase(c, L, W, p);

    c.save();                                                    // pierced spine
    c.globalCompositeOperation = "destination-out";
    for (let i = 1; i <= 4; i++){
      const q = SHAPES._scOuter(L, W, i / 5);
      c.beginPath();
      c.arc(q.x - q.nx * W*0.30 + Math.cos(q.a) * W*0.02,
            q.y - q.ny * W*0.30 + Math.sin(q.a) * W*0.02,
            W * 0.115, 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- DWARVEN --
     BUILT. THE CELL'S FLAIR: a scythe's weak point is the tang, where a long
     blade meets a long pole at an angle, so dwarven puts the whole apparatus
     there -- a bolted socket, a diagonal strut back to the snath, and a
     reinforcing spine strap bolted along the crescent's back. It looks like it
     was engineered by someone who did not trust the joint. */
  _scBuilt(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);
    c.lineJoin = "round";

    c.strokeStyle = iron; c.lineWidth = W*0.13;                  // spine strap
    c.beginPath();
    const s0 = SHAPES._scOuter(L, W, 0.06);
    c.moveTo(s0.x + s0.nx * W*0.04, s0.y + s0.ny * W*0.04);
    for (let i = 1; i <= 8; i++){
      const q = SHAPES._scOuter(L, W, 0.06 + 0.88 * i / 8);
      c.lineTo(q.x + q.nx * W*0.04, q.y + q.ny * W*0.04);
    }
    c.stroke();
    c.fillStyle = dark;
    for (let i = 0; i <= 3; i++){
      const q = SHAPES._scOuter(L, W, 0.10 + 0.26 * i);
      c.beginPath(); c.arc(q.x + q.nx * W*0.04, q.y + q.ny * W*0.04,
                           W*0.055, 0, TAU); c.fill();
    }

    c.strokeStyle = iron; c.lineWidth = W*0.10;                  // the strut
    c.beginPath();
    c.moveTo(L*0.40, W*0.28); c.lineTo(L*0.70, -W*0.22);
    c.stroke();

    c.fillStyle = iron; c.strokeStyle = dark;                    // bolted socket
    c.lineWidth = Math.max(1, W*0.03);
    c.beginPath();
    c.moveTo(L*0.62, W*0.40); c.lineTo(L*0.80, W*0.30);
    c.lineTo(L*0.78, -W*0.16); c.lineTo(L*0.60, -W*0.06);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = dark;
    for (const [bx, by] of [[0.655, 0.28], [0.745, 0.24],
                            [0.655, -0.02], [0.745, -0.06]]){
      c.beginPath(); c.arc(L*bx, W*by, W*0.05, 0, TAU); c.fill();
    }
  },

  /* --------------------------------------------------------------- VIGIL --
     PLATED. THE CELL'S FLAIR: five plates riding the OUTER edge, so the back
     of the blade is armoured and the cutting edge is bare -- the same argument
     the ward makes, that the thing which protects is the thing you present.
     Countable, because five plates read as five things. */
  _scPlated(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    for (let i = 0; i < 5; i++){
      const q = SHAPES._scOuter(L, W, 0.10 + 0.20 * i);
      c.save();
      c.translate(q.x + q.nx * W*0.10, q.y + q.ny * W*0.10);
      c.rotate(q.a);
      c.fillStyle = p.dark;   c.fillRect(-W*0.28, -W*0.30, W*0.56, W*0.46);
      c.fillStyle = p.core;   c.fillRect(-W*0.22, -W*0.24, W*0.44, W*0.34);
      c.fillStyle = p.glow;   c.fillRect(-W*0.22, -W*0.24, W*0.44, W*0.09);
      c.fillStyle = p.dark;
      c.beginPath(); c.arc(0, -W*0.06, W*0.05, 0, TAU); c.fill();
      c.restore();
    }
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);   // snath banding
    for (const gx of [0.16, 0.30, 0.44]){
      const gy = W * (0.30 * (gx / 0.70) * (1.4 - gx));
      c.beginPath();
      c.moveTo(L*gx, gy - W*0.13); c.lineTo(L*gx, gy + W*0.13); c.stroke();
    }
  },

  /* No hilt and a gap where the hand should be — it is held by nothing.
     Twin shards, so the pair reads as a spinning cross. */
  runeblade(c, L, W, p){
    const bh = W * 0.30;
    c.save();
    c.globalAlpha = 0.55;                                       // binding glyph
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);
    c.beginPath(); c.arc(L*0.13, 0, W*0.20, 0, TAU); c.stroke();
    c.beginPath(); c.arc(L*0.13, 0, W*0.32, 0.4, 2.2); c.stroke();
    c.beginPath(); c.arc(L*0.13, 0, W*0.32, 3.5, 5.3); c.stroke();
    c.restore();

    c.beginPath();                                              // crystal shard
    c.moveTo(L*0.28, 0);
    c.lineTo(L*0.42, -bh);
    c.lineTo(L*0.88, -bh*0.68);
    c.lineTo(L, 0);
    c.lineTo(L*0.88,  bh*0.68);
    c.lineTo(L*0.42,  bh);
    c.closePath();
    const g = c.createLinearGradient(L*0.28, -bh, L, bh);
    g.addColorStop(0, p.glow); g.addColorStop(0.5, p.steel); g.addColorStop(1, p.core);
    c.fillStyle = g; c.globalAlpha = 0.92; c.fill(); c.globalAlpha = 1;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.06); c.stroke();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);  // glyph ticks
    for (const gx of [0.50, 0.63, 0.76]){
      c.beginPath(); c.moveTo(L*gx, -bh*0.44); c.lineTo(L*gx, bh*0.44); c.stroke();
    }
  },

  /* The flail's head, drawn at its simulated position. Long spikes so the
     silhouette says "this arrives late and hurts". */
  /* ============================================================ FLAILHEAD ==
     The only shape with no `aff` argument -- it is called `(c, D, p, spin)` --
     so the grammar dispatches on `p.key` alone. It is also the shape the matrix
     doc calls "genuinely school-neutral", which turned out to mean nobody had
     tried: it scored IoU 1.000, the flattest cell in the game. */
  flailHead(c, D, p, spin){
    const key = p.key;
    if (key === "runic")      return SHAPES._fhConjured(c, D, p, spin);
    if (key === "verdant")    return SHAPES._fhGrown(c, D, p, spin);
    if (key === "bloodsworn") return SHAPES._fhBarbed(c, D, p, spin);
    if (key === "umbral")     return SHAPES._fhEaten(c, D, p, spin);
    if (key === "sanctified") return SHAPES._fhRadiant(c, D, p, spin);
    if (key === "dwarven")    return SHAPES._fhBuilt(c, D, p, spin);
    if (key === "vigil")      return SHAPES._fhPlated(c, D, p, spin);
    return SHAPES._fhBase(c, D, p, spin);
  },

  /* the ball, without its spikes -- every grammar wants a different set */
  _fhBall(c, D, p){
    const r = D * 0.34;
    const g = c.createRadialGradient(-r*0.35, -r*0.35, r*0.08, 0, 0, r);
    g.addColorStop(0, p.steel);
    g.addColorStop(0.6, SHAPES._shade(p.steel, 0.38, 0.42));
    g.addColorStop(1, p.dark);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.028);
    c.beginPath(); c.arc(0, 0, r*0.52, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, r*0.52, 1.1, 2.4);
    c.lineWidth = Math.max(1, D*0.05); c.stroke();
  },

  _fhBase(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);           // spikes
    for (let i = 0; i < 8; i++){
      const a = (i / 8) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.92, Math.sin(a - 0.20) * r * 0.92);
      c.lineTo(Math.cos(a + 0.20) * r * 0.92, Math.sin(a + 0.20) * r * 0.92);
      c.lineTo(Math.cos(a) * r * 1.95,        Math.sin(a) * r * 1.95);
      c.closePath(); c.fill();
    }
    c.fillStyle = p.core;
    for (let i = 0; i < 8; i++){                                // glowing tips
      const a = (i / 8) * TAU;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.80, Math.sin(a) * r * 1.80, r * 0.16, 0, TAU);
      c.fill();
    }
    const g = c.createRadialGradient(-r*0.35, -r*0.35, r*0.08, 0, 0, r);
    g.addColorStop(0, p.steel);
    g.addColorStop(0.6, SHAPES._shade(p.steel, 0.38, 0.42));
    g.addColorStop(1, p.dark);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.028);
    c.beginPath(); c.arc(0, 0, r*0.52, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, r*0.52, 1.1, 2.4); c.lineWidth = Math.max(1, D*0.05); c.stroke();
    c.restore();
  },

  /* --------------------------------------------------------------- RUNIC --
     IN PIECES. THE CELL'S FLAIR: a ball has no length to break along, so it
     breaks the only way a sphere can -- into a shell that has come APART, five
     curved plates orbiting the gap where the mass should be. The spikes are
     gone; what is left is the light that was inside it. */
  _fhConjured(c, D, p, spin){
    const r = D * 0.34, t = SHAPES._t || 0;
    c.save();
    c.rotate(spin);
    c.save();
    c.globalCompositeOperation = "lighter";
    c.fillStyle = p.glow; c.shadowColor = p.core; c.shadowBlur = 20;
    c.beginPath(); c.arc(0, 0, r*0.34, 0, TAU); c.fill();
    c.restore();
    for (let i = 0; i < 5; i++){
      const a = (i / 5) * TAU;
      const out = r * (1.02 + 0.20 * Math.sin(t * 2.0 + i * 1.7));
      const cant = Math.sin(t * 1.5 + i * 2.1) * 0.22;
      c.save();
      c.rotate(a + cant);
      c.translate(out, 0);
      c.fillStyle = p.dark;
      c.beginPath();
      c.moveTo(-r*0.30, -r*0.62); c.lineTo(r*0.34, -r*0.40);
      c.lineTo(r*0.34,  r*0.40);  c.lineTo(-r*0.30,  r*0.62);
      c.closePath(); c.fill();
      const g = c.createLinearGradient(-r*0.30, 0, r*0.34, 0);
      g.addColorStop(0, p.core); g.addColorStop(1, p.steel);
      c.fillStyle = g; c.globalAlpha = 0.94;
      c.beginPath();
      c.moveTo(-r*0.24, -r*0.54); c.lineTo(r*0.28, -r*0.34);
      c.lineTo(r*0.28,  r*0.34);  c.lineTo(-r*0.24,  r*0.54);
      c.closePath(); c.fill(); c.globalAlpha = 1;
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.022); c.stroke();
      c.restore();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- VERDANT --
     GROWN. THE CELL'S FLAIR: a spiked ball on a chain is a BURR -- the seed
     head that evolved precisely to be spiky and to catch on things. So the
     grammar barely has to reach: the spikes become hooked bristles of uneven
     length, and the ball becomes a seed case with a split down it. */
  _fhGrown(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.strokeStyle = SHAPES._shade(p.steel, 0.66, 0.30);
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < 11; i++){
      const a = (i / 11) * TAU;
      const len = r * (1.55 + 0.55 * Math.abs(Math.sin(i * 2.3)));
      c.lineWidth = Math.max(1, D * 0.030);
      c.beginPath();
      c.moveTo(Math.cos(a) * r * 0.80, Math.sin(a) * r * 0.80);
      c.quadraticCurveTo(Math.cos(a) * len, Math.sin(a) * len,
                         Math.cos(a + 0.30) * len * 0.94,
                         Math.sin(a + 0.30) * len * 0.94);
      c.stroke();
    }
    SHAPES._fhBall(c, D, p);
    c.strokeStyle = SHAPES._shade(p.dark, 1.1, 0.10);            // the split
    c.lineWidth = Math.max(1, D*0.035);
    c.beginPath();
    c.moveTo(-r*0.80, -r*0.30);
    c.quadraticCurveTo(0, r*0.10, r*0.80, -r*0.24);
    c.stroke();
    c.fillStyle = p.glow;                                        // seeds in the split
    for (const sx of [-0.42, 0, 0.42]){
      c.beginPath(); c.arc(r*sx, r*(0.02 - 0.10*Math.abs(sx)), r*0.10, 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ---------------------------------------------------------- BLOODSWORN --
     BARBED BACKWARD. THE CELL'S FLAIR: on a ball that spins there is no
     "backward" until you pick one -- so every spike hooks the SAME way round,
     which turns the whole head into a ratchet and states the direction of
     rotation in the silhouette. Nothing else in the game says which way a
     weapon is turning while it is turning. */
  _fhBarbed(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.52);
    c.lineWidth = Math.max(1, D*0.018);
    for (let i = 0; i < 7; i++){
      const a = (i / 7) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.22) * r * 0.92, Math.sin(a - 0.22) * r * 0.92);
      c.quadraticCurveTo(Math.cos(a + 0.34) * r * 1.70,
                         Math.sin(a + 0.34) * r * 1.70,
                         Math.cos(a + 0.86) * r * 1.94,
                         Math.sin(a + 0.86) * r * 1.94);
      c.quadraticCurveTo(Math.cos(a + 0.34) * r * 1.24,
                         Math.sin(a + 0.34) * r * 1.24,
                         Math.cos(a + 0.24) * r * 0.92,
                         Math.sin(a + 0.24) * r * 0.92);
      c.closePath(); c.fill(); c.stroke();
    }
    SHAPES._fhBall(c, D, p);
    c.fillStyle = p.core;
    for (let i = 0; i < 7; i++){
      const a = (i / 7) * TAU + 0.86;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.86, Math.sin(a) * r * 1.86, r * 0.13, 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- UMBRAL --
     EATEN. THE CELL'S FLAIR: half the spikes are simply MISSING, and the ball
     has a crescent bitten out of one side, so the head is visibly lighter on
     one side than the other -- an unbalanced flail, which is the most
     unsettling thing this particular weapon could be. */
  _fhEaten(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.save();
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    for (const i of [0, 1, 3, 6]){                               // four of eight
      const a = (i / 8) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.92, Math.sin(a - 0.20) * r * 0.92);
      c.lineTo(Math.cos(a + 0.20) * r * 0.92, Math.sin(a + 0.20) * r * 0.92);
      c.lineTo(Math.cos(a) * r * 1.95,        Math.sin(a) * r * 1.95);
      c.closePath(); c.fill();
    }
    c.fillStyle = p.core;
    for (const i of [0, 1, 3, 6]){
      const a = (i / 8) * TAU;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.80, Math.sin(a) * r * 1.80, r * 0.16, 0, TAU);
      c.fill();
    }
    SHAPES._fhBall(c, D, p);
    c.globalCompositeOperation = "destination-out";              // the bite
    c.beginPath();
    for (let i = 0; i < 12; i++){
      const a = -0.9 + i * (2.2 / 11);
      const rr = r * (1.02 + 0.26 * Math.abs(Math.sin(i * 1.7)));
      const px = r * 0.92 + Math.cos(a) * rr * 0.66;
      const py = -r * 0.70 + Math.sin(a) * rr * 0.66;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
    c.restore();

    c.globalAlpha = 0.5; c.fillStyle = p.core;                   // the leak
    c.beginPath();
    c.moveTo(r*0.50, -r*0.56);
    c.quadraticCurveTo(r*1.50, -r*1.30, r*1.90, -r*0.42);
    c.quadraticCurveTo(r*1.20, -r*0.62, r*0.72, -r*0.10);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
    c.restore();
  },

  /* ---------------------------------------------------------- SANCTIFIED --
     RADIANT AND PIERCED. THE CELL'S FLAIR: a spiked ball with holes in it and
     light coming out is a CENSER, which is both the correct liturgical object
     and the only version of this weapon that has ever been swung in a church.
     The halo is a ring around the equator rather than behind the head, because
     a sphere has no behind. */
  _fhRadiant(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, D*0.030);  // the ring
    c.beginPath(); c.ellipse(0, 0, r*2.05, r*0.62, 0, 0, TAU); c.stroke();

    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);            // finials
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.16) * r * 0.94, Math.sin(a - 0.16) * r * 0.94);
      c.lineTo(Math.cos(a + 0.16) * r * 0.94, Math.sin(a + 0.16) * r * 0.94);
      c.lineTo(Math.cos(a) * r * 1.52,        Math.sin(a) * r * 1.52);
      c.closePath(); c.fill();
      c.fillStyle = p.glow;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.66, Math.sin(a) * r * 1.66, r * 0.16, 0, TAU);
      c.fill();
      c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    }
    SHAPES._fhBall(c, D, p);
    c.save();                                                     // pierced
    c.globalCompositeOperation = "destination-out";
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU + 0.5;
      c.beginPath();
      c.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.19, 0, TAU);
      c.fill();
    }
    c.restore();
    c.save();                                                     // light inside
    c.globalCompositeOperation = "lighter";
    c.fillStyle = p.glow; c.globalAlpha = 0.55;
    c.beginPath(); c.arc(0, 0, r*0.34, 0, TAU); c.fill();
    c.restore();
    c.restore();
  },

  /* ------------------------------------------------------------- DWARVEN --
     BUILT. THE CELL'S FLAIR: the head is two hemispheres BOLTED TOGETHER along
     a visible equatorial band, and the spikes are separate square studs screwed
     into it rather than forged out of it -- so the silhouette is stepped where
     every other flail's is smooth. */
  _fhBuilt(c, D, p, spin){
    const r = D * 0.34;
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);
    c.save();
    c.rotate(spin);
    c.fillStyle = iron; c.strokeStyle = dark;
    c.lineWidth = Math.max(1, D*0.018);
    for (let i = 0; i < 8; i++){                                  // studs
      const a = (i / 8) * TAU;
      c.save();
      c.translate(Math.cos(a) * r * 1.32, Math.sin(a) * r * 1.32);
      c.rotate(a);
      c.fillRect(-r*0.46, -r*0.30, r*0.92, r*0.60);
      c.strokeRect(-r*0.46, -r*0.30, r*0.92, r*0.60);
      c.fillStyle = dark;
      c.fillRect(r*0.20, -r*0.30, r*0.26, r*0.60);
      c.fillStyle = iron;
      c.restore();
    }
    SHAPES._fhBall(c, D, p);
    c.fillStyle = iron; c.strokeStyle = dark;                     // equator band
    c.fillRect(-r*1.02, -r*0.20, r*2.04, r*0.40);
    c.strokeRect(-r*1.02, -r*0.20, r*2.04, r*0.40);
    c.fillStyle = dark;
    for (const bx of [-0.66, -0.22, 0.22, 0.66]){
      c.beginPath(); c.arc(r*bx, 0, r*0.10, 0, TAU); c.fill();
    }
    c.restore();
  },

  /* --------------------------------------------------------------- VIGIL --
     PLATED. THE CELL'S FLAIR: six plates laid over the sphere like the gores
     of a helmet, each stepping proud of the last, so the ball reads as
     ARMOURED rather than spiked -- and the spikes shorten to studs, because a
     vigil weapon's argument is that it survives the exchange, not that it wins
     the exchange. */
  _fhPlated(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);             // short studs
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU + 0.5;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.94, Math.sin(a - 0.20) * r * 0.94);
      c.lineTo(Math.cos(a + 0.20) * r * 0.94, Math.sin(a + 0.20) * r * 0.94);
      c.lineTo(Math.cos(a) * r * 1.34,        Math.sin(a) * r * 1.34);
      c.closePath(); c.fill();
    }
    SHAPES._fhBall(c, D, p);
    for (let i = 0; i < 6; i++){                                   // the gores
      const a = (i / 6) * TAU;
      c.save();
      c.rotate(a);
      c.fillStyle = p.dark;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 1.06, -0.50, 0.02);
      c.closePath(); c.fill();
      c.fillStyle = p.core;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 0.94, -0.44, -0.04);
      c.closePath(); c.fill();
      c.fillStyle = p.glow;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 0.94, -0.44, -0.36);
      c.closePath(); c.fill();
      c.restore();
    }
    c.fillStyle = p.dark;                                          // the boss
    c.beginPath(); c.arc(0, 0, r*0.30, 0, TAU); c.fill();
    c.fillStyle = p.glow;
    c.beginPath(); c.arc(0, 0, r*0.17, 0, TAU); c.fill();
    c.restore();
  },
};

/* ------------------------------------------------------------------ SFX --- */
/* Everything synthesised — no sample files. Impacts are a noise transient over
   a pitched body; clanks are deliberately inharmonic so metal reads as metal. */
class Sfx {
  constructor(){ this.ctx = null; this.on = true; this.ok = true; }

  /* bus -> compressor -> makeup -> destination.
     One builder so the live context and the offline render are provably the
     same signal chain; if they can differ, eventually they will. */
  static buildChain(ctx, destination){
    const C = CONFIG.audio.comp;
    const bus = ctx.createGain();
    bus.gain.value = 0.42;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = C.threshold;
    comp.ratio.value     = C.ratio;
    comp.attack.value    = C.attack;
    comp.release.value   = C.release;
    comp.knee.value      = 6;
    const makeup = ctx.createGain();
    makeup.gain.value = Math.pow(10, C.makeup / 20);
    bus.connect(comp); comp.connect(makeup); makeup.connect(destination);
    return bus;
  }

  resume(){
    if (!this.ok) return;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.ok = false; return; }
        this.ctx = new AC();
        /* CINEMA (demo). The whole mix now lands on the director's send --
           a lowpass, a convolution hall and a duck -- instead of straight on
           the destination. With CINE off the send is flat and inaudible. */
        this.bus = Sfx.buildChain(this.ctx, CineAudio.build(this.ctx));
        this.noise = this._noiseBuffer();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch(e){ this.ok = false; }
  }

  _noiseBuffer(){
    const n = this.ctx.sampleRate * 0.6;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  /* `dest` lets the bed route its parts through its own trim instead of
     straight to the bus. Everything else calls these unchanged. */
  _burst(t, {freq=1200, q=1.4, gain=0.4, dur=0.14, type="bandpass"}, dest){
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const flt = this.ctx.createBiquadFilter(); flt.type = type;
    flt.frequency.setValueAtTime(freq, t); flt.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(dest || this.bus);
    src.start(t); src.stop(t + dur + 0.02);
    return src;
  }

  _tone(t, {freq=180, to=null, gain=0.3, dur=0.2, type="sine"}, dest){
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.bus);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

  /* ------------------------------------------------------------- bed --- */
  /* One implementation, two destinations: the live context schedules it from
     `ctx.currentTime`, and the offline render schedules it from 0 through the
     same code. Everything is pre-scheduled automation rather than per-frame
     updates, which is what lets the offline path reuse it untouched.
     Caveat: because it is pre-scheduled against real time, the live bed
     assumes 1x playback. The speed control is a dev tool, not a viewer
     feature, so the drift is acceptable and deliberate.
     `stop()` on the returned handle kills it when a new match starts. */
  /* ---------------------------------------------------------- the score ---
     Was a drone. Rick's verdict on hearing it in context: "the background
     noise is still odd and unnatural" — a sustained cluster with no harmonic
     motion reads as equipment hum, not atmosphere, no matter how carefully it
     is voiced. So this is actual music: a four-chord minor loop with a pad, a
     plucked arpeggio, a bass pulse and a drum, all pre-scheduled so the live
     context and the offline render run the identical code.

     It does legibility work too. Each seal steps the level, adds a voice and
     pushes the tempo, so the three acts are audible before they are read. */
  bed(t0, dur, sealTimes){
    if (!this.ok || !this.ctx) return null;
    try {
      const A = CONFIG.audio, ctx = this.ctx;
      const seals = (sealTimes || []).filter(t => t > t0 && t < t0 + dur);
      const end = t0 + dur;

      const out = ctx.createGain();
      out.gain.value = A.gain;
      out.connect(this.bus);

      /* A minor: i - VI - III - VII. Semitones from the tonic, voiced so the
         bass walks and the upper tones stay inside a narrow band — a chord
         that leaps an octave between changes draws attention to itself, and
         this has to sit under a fight. */
      const CHORDS = [
        { bass:  0, tones: [ 0,  7, 12, 15] },   // Am
        { bass: -4, tones: [-4,  3,  8, 12] },   // F
        { bass: -9, tones: [ 3,  7, 10, 15] },   // C
        { bass: -2, tones: [-2,  5, 10, 14] },   // G
      ];
      const hz  = st => A.root * Math.pow(2, st / 12);
      const lvl = i => 1 + i * A.step;
      const sealsBefore = t => seals.filter(s => s <= t).length;

      const stops = [];
      const voice = (t, freq, gain, dur2, type, attack) => {
        if (t >= end || gain <= 0.0004) return;
        const o = ctx.createOscillator(); o.type = type;
        o.frequency.setValueAtTime(freq, t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(gain, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur2);
        o.connect(g); g.connect(out);
        o.start(t); o.stop(Math.min(end + 0.4, t + dur2 + 0.05));
        stops.push(o);
      };

      /* One shared lowpass on the pad so it sits behind the impacts rather
         than competing with them in the same band. */
      const padLP = ctx.createBiquadFilter();
      padLP.type = "lowpass"; padLP.frequency.value = 900; padLP.Q.value = 0.5;
      padLP.connect(out);
      const pad = (t, freq, gain, dur2) => {
        if (t >= end) return;
        for (const det of [0.997, 1.003]){
          const o = ctx.createOscillator(); o.type = "triangle";
          o.frequency.setValueAtTime(freq * det, t);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(gain, t + 0.55);
          g.gain.setValueAtTime(gain, t + dur2 * 0.72);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur2);
          o.connect(g); g.connect(padLP);
          o.start(t); o.stop(Math.min(end + 0.4, t + dur2 + 0.05));
          stops.push(o);
        }
      };

      /* Walk the whole match bar by bar. The tempo is read fresh at the top of
         each bar so a seal speeds up the music from the next bar rather than
         glitching mid-phrase. */
      let t = t0 + 0.35, bar = 0, guard = 0;
      while (t < end - 0.5 && guard++ < 220){
        const i     = sealsBefore(t);
        const beat  = 60 / (A.bpm * (1 + A.bpmStep * i));
        const barLen = beat * 4;
        const ch    = CHORDS[bar % CHORDS.length];
        const L     = lvl(i);

        /* Three voices, not four. A whole match schedules its music in one
           pass so the offline render can reuse the live code untouched, which
           means every node in every bar is alive in the graph from the bell —
           it was 1695 of them. Node count is a running cost, so the pad drops
           its top voice and the arpeggio thins; the chord is unchanged to the
           ear because the dropped tone is doubled an octave down. */
        for (const st of ch.tones.slice(0, 3)) pad(t, hz(st + 12), 0.032 * L, barLen * 1.02);
        voice(t, hz(ch.bass), 0.075 * L, beat * 1.7, "sine", 0.02);
        voice(t + beat * 2, hz(ch.bass), 0.055 * L, beat * 1.4, "sine", 0.02);

        /* Plucked arpeggio: eighth notes climbing the chord. This is the layer
           that makes it read as music rather than as a held pad. */
        for (let e = 0; e < 8; e++){
          if (e % 2 === 1 && i < 2) continue;        // sparser until the hall closes
          if (e === 5) continue;
          const st2 = ch.tones[(e + bar) % ch.tones.length] + (e >= 4 ? 24 : 12);
          voice(t + e * beat * 0.5, hz(st2), 0.027 * L, beat * 0.85, "triangle", 0.006);
        }
        /* A counter-line, held back until the hall starts closing. */
        if (i >= 2){
          voice(t + beat * 1.5, hz(ch.tones[2] + 24), 0.024 * L, beat * 1.2, "sine", 0.05);
          voice(t + beat * 3.5, hz(ch.tones[1] + 24), 0.022 * L, beat * 1.2, "sine", 0.05);
        }

        /* Drum. Low thump on the downbeat, and a second one from the first
           seal, so the pulse literally doubles as the fight escalates. */
        const thump = (tt, g, skin) => {
          this._tone(tt, { freq: 78, to: 34, gain: g * L, dur: 0.30, type:"sine" }, out);
          /* the noise skin is three nodes; only the downbeat gets one */
          if (skin) this._burst(tt, { freq: 160, q: 0.8, gain: g * 0.5 * L,
                                      dur: 0.14, type:"lowpass" }, out);
        };
        thump(t, 0.10, true);
        if (i >= 1) thump(t + beat * 2, 0.070, false);
        if (i >= 2) thump(t + beat * 3, 0.045, false);

        t += barLen; bar++;
      }

      /* Air. OFF by default (A.air = 0), and this is the interesting failure in
         the whole bed: a bandpass at 420 Hz with Q 0.6 is barely a filter at
         all, so the "hall floor" was broadband noise sitting right in the
         speech band. It measured beautifully — noise is the cheapest LUFS there
         is — and Rick's verdict on hearing it was that the game sounded like it
         was playing over a box fan. Which is the audio version of the first
         law: a layer that improves the number and degrades the experience is
         not a feature. */
      if (A.air > 0){
        const air = ctx.createBufferSource();
        air.buffer = this.noise; air.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = A.airCut; lp.Q.value = 0.7;
        const ag = ctx.createGain(); ag.gain.value = A.air;
        air.connect(lp); lp.connect(ag); ag.connect(out);
        air.start(t0); air.stop(end + 0.1);
