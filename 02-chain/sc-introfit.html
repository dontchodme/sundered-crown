        stops.push(air);
      }

      return { stop(){ for (const n of stops){ try { n.stop(); } catch(e){} }
                       try { out.disconnect(); } catch(e){} } };
    } catch(e){ return null; }
  }

  play(kind, p = {}){
    if (!this.on || !this.ok || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      if (kind === "hit"){
        const w = clamp((p.dmg || 10) / 45, 0.12, 1);          // 0..1 weight
        this._burst(t, { freq: 2600 - 1500*w, q: 1.1, gain: 0.16 + 0.20*w, dur: 0.06 + 0.06*w });
        this._tone (t, { freq: 190 - 90*w, to: 46, gain: 0.22 + 0.26*w, dur: 0.11 + 0.13*w, type:"sine" });
        if (p.crit) this._tone(t, { freq: 1500, to: 520, gain: 0.16, dur: 0.16, type:"triangle" });
      }
      else if (kind === "clank"){
        /* Inharmonic partials — the ratios are deliberately not integers. */
        const base = 480 + 520 * (1 - clamp((p.mass || 3) / 6, 0, 1));
        [1, 2.41, 3.83, 5.17, 7.02].forEach((r, i) => {
          this._tone(t + i * 0.0015, {
            freq: base * r, gain: 0.15 / (i + 1.1), dur: 0.42 - i * 0.05, type: "triangle",
          });
        });
        this._burst(t, { freq: 4200, q: 0.7, gain: 0.28, dur: 0.05, type:"highpass" });
        this._tone (t, { freq: 150, to: 55, gain: 0.24, dur: 0.14, type:"sine" });
      }
      /* One ultimate sound for six ultimates was the audio version of the
         caption problem: the picture said six different things and the ears
         heard the same thing every time. */
      else if (kind === "ult"){
        const w = p.w;
        if (w === "dawnbringer"){                       // a chord and a bell
          [0, 7, 12, 16].forEach((st, i) =>
            this._tone(t + i * 0.03, { freq: 220 * Math.pow(2, st/12), gain: 0.13,
                                       dur: 1.5, type:"triangle" }));
          this._burst(t + 0.14, { freq: 5200, q: 0.9, gain: 0.20, dur: 0.5, type:"highpass" });
        } else if (w === "widowmaker"){                 // a wet slice
          this._burst(t, { freq: 3400, q: 1.6, gain: 0.34, dur: 0.20 });
          this._tone (t, { freq: 900, to: 240, gain: 0.20, dur: 0.28, type:"sawtooth" });
          this._tone (t + 0.10, { freq: 620, to: 180, gain: 0.14, dur: 0.34, type:"sawtooth" });
        } else if (w === "grudgebearer"){               // the forge lights, the spin winds
          this._tone (t, { freq: 46, to: 138, gain: 0.50, dur: 1.5, type:"sine" });
          this._tone (t + 0.10, { freq: 170, to: 660, gain: 0.15, dur: 1.4, type:"sawtooth" });
          this._burst(t, { freq: 240, q: 0.6, gain: 0.30, dur: 1.5, type:"lowpass" });
          this._burst(t + 0.55, { freq: 900, q: 1.2, gain: 0.10, dur: 0.9, type:"lowpass" });
        } else if (w === "grudgebearer-hit"){           // the implosion pays out
          this._tone (t, { freq: 320, to: 24, gain: 0.60, dur: 0.9, type:"sine" });
          this._burst(t, { freq: 260, q: 0.5, gain: 0.50, dur: 0.8, type:"lowpass" });
          this._burst(t + 0.05, { freq: 2400, q: 1.0, gain: 0.16, dur: 0.3, type:"highpass" });
        } else if (w === "grudgebearer-fizzle"){        // the draught dies
          this._tone (t, { freq: 130, to: 40, gain: 0.22, dur: 0.7, type:"sine" });
          this._burst(t, { freq: 420, q: 0.8, gain: 0.12, dur: 0.6, type:"lowpass" });
        } else if (w === "thornwake"){                  // creak and cinch
          this._burst(t, { freq: 700, q: 3.0, gain: 0.24, dur: 0.6 });
          this._tone (t, { freq: 150, to: 420, gain: 0.16, dur: 0.55, type:"triangle" });
          this._tone (t + 0.34, { freq: 300, to: 120, gain: 0.14, dur: 0.3, type:"square" });
        } else if (w === "gravemourn"){                 // a drop into the grave
          this._tone (t, { freq: 420, to: 44, gain: 0.30, dur: 1.1, type:"sawtooth" });
          this._tone (t + 0.05, { freq: 300, to: 38, gain: 0.18, dur: 1.0, type:"sine" });
          this._burst(t, { freq: 420, q: 0.6, gain: 0.16, dur: 0.9, type:"lowpass" });
        } else {                                        // rune-crack
          this._burst(t, { freq: 6000, q: 0.8, gain: 0.34, dur: 0.10, type:"highpass" });
          this._tone (t, { freq: 1800, to: 300, gain: 0.22, dur: 0.30, type:"square" });
          [1, 2.73, 4.41].forEach((r, i) =>
            this._tone(t + 0.16 + i * 0.02, { freq: 380 * r, gain: 0.10, dur: 0.5, type:"triangle" }));
        }
      }
      else if (kind === "seal"){
        [0, 0.09, 0.18].forEach((d, i) =>
          this._tone(t + d, { freq: 220 * Math.pow(1.5, i), gain: 0.14, dur: 0.9, type:"triangle" }));
      }
      else if (kind === "death"){
        this._tone (t, { freq: 120, to: 32, gain: 0.5, dur: 1.1, type:"sine" });
        this._burst(t, { freq: 700, q: 0.5, gain: 0.34, dur: 0.6, type:"lowpass" });
      }
      else if (kind === "loose"){
        /* Woody body, no top end. It sits UNDER the impacts rather than
           competing with them, so a shot landing still reads louder than
           a shot leaving. */
        this._burst(t, { freq: 380, q: 1.1, gain: 0.055, dur: 0.055, type:"bandpass" });
      }
      else if (kind === "spark"){
        /* frequent by design, so quiet by design: the collect chime climbs
           with the stack it just banked, the burn is a short sizzle */
        if (p && p.arm){
          this._tone (t, { freq: 1560, gain: 0.045, dur: 0.14, type:"triangle" });
        } else if (p && p.collect){
          this._tone (t, { freq: 1180 + (p.n || 0) * 110, gain: 0.05, dur: 0.20, type:"triangle" });
        } else {
          this._burst(t, { freq: 4200, q: 1.4, gain: 0.07, dur: 0.06, type:"highpass" });
          this._tone (t, { freq: 520, to: 180, gain: 0.05, dur: 0.10, type:"sine" });
        }
      }
      else if (kind === "wall"){
        this._burst(t, { freq: 3000, q: 2.0, gain: 0.045, dur: 0.035, type:"highpass" });
      }
    } catch(e){ /* audio must never break the sim */ }
  }
}
const SFX = new Sfx();

/* ----------------------------------------------------------------- FIGHTER */
class Fighter {
  constructor(weapon, side, rng){
    if (!weapon) throw new Error("Fighter requires a weapon definition");
    this.w    = weapon;
    this.aff  = AFFINITIES[weapon.aff];
    this.side = side;
    this.maxHp = CONFIG.combat.baseHP;
    this.hp    = this.maxHp;

    const ang = (side === 0 ? -Math.PI/4 : Math.PI*0.75)
              + (rng() - 0.5) * CONFIG.chaos.spawnSpread;
    this.vx = Math.cos(ang) * CONFIG.physics.cruise;
    this.vy = Math.sin(ang) * CONFIG.physics.cruise;
    this.speed = CONFIG.physics.cruise;

    this.theta      = rng() * TAU;
    this.spinDir    = side === 0 ? 1 : -1;
    this.swingPhase = rng() * TAU;
    this.headSpin   = 0;

    this.charge = 0;
    this.stun   = 0;          // weapon locked (hitstun, hex, freeze)
    this.stunDR = 0;          // diminishing returns accumulator
    this.status = {};
    this.hexClock = 0;
    this.hitCd = [];
    this.hits = 0; this.dealt = 0; this.crits = 0; this.ultsFired = 0; this.clanks = 0;
    this.flash = 0;
    this.mend  = 0;           // presentation only: the shell knitting back up
    this.shield    = 0;       // VIGIL: absorbed before health
    this.shieldMax = 0;       // high-water mark, so the shatter scales to
                              // what was banked rather than what is left
    this.shatterFx = 0;       // presentation only
    this.wardFade  = 0;       // presentation only: expired, did not break
    this.trail = [];
    this.tips  = weapon.blades.map(() => []);   // per-blade tip history
    /* RANGED. Seeded to the cadence rather than to 0 so the two relics in a
       mirror do not fire in lockstep on frame one, and seeded WITHOUT rng so
       adding a ranged relic cannot perturb the draw order of any match that
       does not contain one. side 0 fires immediately, side 1 half a beat
       later. */
    this.fireCd = weapon.shot ? weapon.shot.cadence * side * 0.5 : 0;
    this.shotsFired = 0;
    this.drawK  = 0;          // presentation only: 0..1, the string coming back
    this.ultDraw = null;      // {t, dur} while an aimed shot is being drawn
    this.ultForge = null;     // {t, minT, cap} while the Crucible is lit
    this.ultRadiant = null;   // {t, dur} while Daybreak burns
    this.launch = 0;          // seconds of raised speed ceiling after its strike
    this.spendFx = 0;         // presentation only: the ward, leaving forward
    this.spendA  = 0;         // the direction it left in
  }

  get alive(){ return this.hp > 0; }
  get desperate(){ return this.alive && this.hp / this.maxHp <= CONFIG.desperation.at; }
  stacks(key){ return this.status[key] ? this.status[key].stacks : 0; }

  apply(key, n){
    const def = STATUS[key];
    if (!def) return;
    const cur = this.status[key] || { stacks:0, t:0 };
    cur.stacks = Math.min(def.maxStacks, cur.stacks + n);
    cur.t = def.dur;
    this.status[key] = cur;
    if (key === "curse") this.maxHp = Math.max(60, this.maxHp - def.maxHpLoss * n);
  }

  /* Hitstun with diminishing returns, so a fast relic cannot lock a slow one
     out of the match entirely. Each application makes the next one shorter. */
  takeHitstun(dmg){
    const I = CONFIG.impact;
    const raw = Math.min(I.stunMax, I.stunBase + dmg * I.stunPerDmg);
    const dur = raw / (1 + I.stunDR * this.stunDR);
    this.stunDR += 1;
    this.stun = Math.max(this.stun, dur);
    return dur;
  }

  spinMul(actSpin){
    let m = actSpin * (1 + STATUS.entangle.spin * this.stacks("entangle"));
    if (this.desperate) m *= CONFIG.desperation.spin;
    return Math.max(0.15, m);
  }
  moveMul(){ return Math.max(0.45, 1 + STATUS.entangle.move * this.stacks("entangle")); }
  dmgTakenMul(){ return 1 + STATUS.sunder.taken * this.stacks("sunder"); }
  dmgMul(actDmg){ return actDmg * (this.desperate ? CONFIG.desperation.dmg : 1); }
}

/* ------------------------------------------------------------------- MATCH */
class Match {
  constructor(idA, idB, seed){
    if (idA === idB) throw new Error("A relic cannot fight itself");
    this.seed = seed >>> 0;
    this.rng  = makeRng(this.seed);
    const wa = WEAPON_BY_ID[idA], wb = WEAPON_BY_ID[idB];
    if (!wa || !wb) throw new Error("Unknown relic id");
    this.a = new Fighter(wa, 0, this.rng);
    this.b = new Fighter(wb, 1, this.rng);

    const A = CONFIG.arena;
    this.a.x = A.w * 0.28;  this.a.y = A.h * 0.22;
    this.b.x = A.w * 0.72;  this.b.y = A.h * 0.78;
    for (const f of [this.a, this.b]) this._initChain(f);
    this.shots = [];          // live projectiles, oldest first
    this.shotHits = 0;        // measurement only: how many landed

    this.t = 0;
    this.act = 0;
    this.inset = 0;
    this.over = false;
    this.winner = null; this.loser = null; this.reason = null;

    this.hitStop = 0;
    /* CINEMA (demo). Presentation only, in the same family as `events` and
       `tags`: a list of dramatic instants for the director to read. Nothing in
       the simulation reads it, and because a headless prescan runs the same
       code it produces the same list -- which is what lets the director see
       the whole fight before the first frame is drawn. */
    this.beats = [];
    this.finisher = 0;
    this.deathAge = 0;        // presentation only: drives the shatter
    this.ultFx    = null;     // presentation only: drives the ultimate set-piece
    this.killFlight = null;   // a slain ball still has a wall to meet
    this.wallCrack = null;    // presentation only: where it shattered
    this.sparks = [];         // Daybreak's drift: SIM objects, they burn and they feed
    this.clankCd = 0;
    this.clankCount = 0;
    this.clankStreak = 0;

    this.fx = []; this.rings = []; this.floats = []; this.tags = [];
    this.shake = 0; this.banner = null; this.events = [];
    /* Off by default so every headless sweep is unaffected. Presentation
       layers (the live shell, render.py) opt in. */
    this.introT = 0;
    this.taught = {};        // status keys already explained in the arena
    this.motes = Array.from({length: 46}, () => ({
      x: this.rng() * A.w, y: this.rng() * A.h,
      vx: (this.rng()-0.5) * 8, vy: -3 - this.rng() * 7,
      r: 0.7 + this.rng() * 1.9, a: 0.10 + this.rng() * 0.26,
    }));
  }

  _initChain(f){
    if (f.w.mode !== "chain") return;
    const C = CONFIG.chain;
    f.headAng    = f.theta;
    f.headAngVel = f.w.spin * f.spinDir;
    f.headR      = f.w.reach * (1 - C.hilt);
    f.pivX = f.x + Math.cos(f.theta) * f.w.reach * C.hilt;
    f.pivY = f.y + Math.sin(f.theta) * f.w.reach * C.hilt;
    f.headX = f.pivX + Math.cos(f.headAng) * f.headR;
    f.headY = f.pivY + Math.sin(f.headAng) * f.headR;
  }

  get actMods(){ return CONFIG.acts[this.act]; }

  /* ---------------------------------------------------------------- fx --- */
  spawnFx(x, y, color, n, spd, life, size, dirX, dirY){
    for (let i = 0; i < n; i++){
      let vx, vy;
      if (dirX !== undefined){
        /* Directional sparks: thrown along the blade's motion, with spread.
           Radial bursts read as "explosion"; these read as "struck". */
        const spread = (this.rng() - 0.5) * 1.5;
        const ca = Math.cos(spread), sa = Math.sin(spread);
        const v = spd * (0.35 + this.rng());
        vx = (dirX * ca - dirY * sa) * v;
        vy = (dirX * sa + dirY * ca) * v;
      } else {
        const a = this.rng() * TAU, v = spd * (0.35 + this.rng());
        vx = Math.cos(a) * v; vy = Math.sin(a) * v;
      }
      this.fx.push({ x, y, vx, vy, life, max:life, c:color, r:size*(0.5+this.rng()) });
    }
    if (this.fx.length > 900) this.fx.splice(0, this.fx.length - 900);
  }

  ring(x, y, color, r0, r1, life, width){
    this.rings.push({ x, y, c:color, r:r0, r1, life, max:life, w:width || 5 });
    if (this.rings.length > 40) this.rings.shift();
  }

  float(x, y, text, color, size){
    this.floats.push({ x, y, text, c:color, life:1.0, size: size || 34 });
    if (this.floats.length > 40) this.floats.shift();
  }

  /* A status announces itself where it happened.

     It used to announce itself in a 600px box pinned to the bottom of the hall,
     which is the health-bar mistake again: accurate, well drawn, and a long way
     from the only thing anyone was watching. The name now lands at the point of
     contact, and the first time a status ever appears in a match it brings its
     one line with it — held longer and set larger, because that single showing
     is the only teaching a viewer who skipped the intro card will ever get. */
  statusTag(x, y, key, first){
    const def = STATUS[key]; if (!def) return;
    const aff = Object.values(AFFINITIES).find(a => a.status === key);
    this.tags.push({ x, y, key, name: def.name, tip: first ? def.tip : "", first,
                     c: aff ? aff.core : "#EDE3D0",
                     g: aff ? aff.glow : "#FFF4D0",
                     life: first ? 2.5 : 0.9, max: first ? 2.5 : 0.9,
                     /* An ultimate that applies a status fires both at once,
                        and the panel is drawn last, so it sat on top of the
                        ultimate's name. When one is running, the panel goes
                        low instead of above the impact. */
                     low: !!this.ultFx,
                     /* Stagger repeats so two statuses landing in the same
                        hit stop do not print on top of each other. */
                     off: (this.tags.length % 3) * 26 });
    if (this.tags.length > 10) this.tags.shift();
  }

  note(text){ this.events.push({ t:this.t, text }); }

  /* CINEMA (demo). Write-only from the sim's point of view. */
  beat(o){
    o.t = this.t;
    this.beats.push(o);
    if (this.beats.length > 600) this.beats.shift();
  }

  /* -------------------------------------------------------------- step --- */
  step(dt){
    /* The card holds the match at t=0. Nothing in the sim advances, so the
       recorded duration and every statistic stay exactly what they would be
       without an intro. */
    if (this.introT > 0){
      /* Presentation clock only — simulate() never sets introT, so no sweep
         ever runs this branch. The clank is the cards meeting at the
         centreline; the bell stays on the cut. Both fire on clock CROSSINGS
         so a 4x-speed dt cannot fire either twice. */
      const el0 = CONFIG.intro.dur - this.introT;
      this.introT -= dt;
      if (el0 < CONFIG.intro.clash &&
          CONFIG.intro.dur - this.introT >= CONFIG.intro.clash)
        SFX.play("clank", { mass: Math.max(this.a.w.mass, this.b.w.mass) });
      if (this.introT <= 0) SFX.play("seal");   // the bell, on the reveal
      return;
    }
    if (this.over){ this.decay(dt); return; }

    /* Hit stop freezes the world. The clock still advances so match duration
       stays honest, and rings/shake keep animating so the freeze reads as an
       impact rather than a stall. */
    if (this.hitStop > 0){
      this.hitStop -= dt;
      this.t += dt;
      this.decayImpactOnly(dt);
      return;
    }

    this.t += dt;
    this.clankCd = Math.max(0, this.clankCd - dt);
    this.clankStreak = Math.max(0, this.clankStreak - CONFIG.clank.streakDecay * dt);

    for (let i = CONFIG.acts.length - 1; i > this.act; i--){
      if (this.t >= CONFIG.acts[i].t){
        this.act = i;
        this.banner = { text: CONFIG.acts[i].name, sub: CONFIG.acts[i].sub, life: 2.4, max: 2.4 };
        this.shake = Math.max(this.shake, 26);
        this.note(CONFIG.acts[i].name);
        SFX.play("seal");
        for (const f of [this.a, this.b]){
          this.spawnFx(f.x, f.y, f.aff.glow, 42, 340, 0.9, 5);
          this.ring(f.x, f.y, f.aff.core, 20, 260, 0.8, 6);
        }
        break;
      }
    }

    if (this.t > CONFIG.collapse.startT){
      this.inset = Math.min(CONFIG.collapse.maxInset,
                            this.inset + CONFIG.collapse.rate * dt);
    }

    for (const [self, foe] of [[this.a, this.b], [this.b, this.a]]){
      this.tickStatus(self, dt);
      this.move(self, foe, dt);
      this.tickWeapon(self, foe, dt);
      this.tickFire(self, foe, dt);
      this.tickCharge(self, foe, dt);
    }
    this.ballCollision();
    this.tickClank(dt);
    this.tickShots(dt);
    this.tickSparks(dt);
    for (const [self, foe] of [[this.a, this.b], [this.b, this.a]])
      this.tickHits(self, foe, dt);

    if (this.killFlight){
      this.killFlight.t += dt;
      /* Cannot fire — a launched ball meets a wall in well under a second —
         but a flight with no upper bound is a hung match waiting to be
         discovered by someone else. The bow's cap, same reasoning. */
      if (this.killFlight.t > 2.5) this.killFlight = null;
    }
    this.checkEnd();
    this.decay(dt);
  }

  /* Presentation-only clocks. They run on every path — normal, hit stop, and
     after the match is over — because the beats they drive (the ultimate
     set-piece, the draining health ghost) all begin with a freeze. If they
     only advanced on the normal path they would sit still for exactly the
     frames the viewer is staring hardest at. Nothing in the simulation reads
     any of them. */
  tickPresentation(dt){
    if (this.ultFx){
      this.ultFx.t += dt;
      if (this.ultFx.t > this.ultFx.life) this.ultFx = null;
    }
    if (this.wallCrack){
      this.wallCrack.t += dt;
      if (this.wallCrack.t > this.wallCrack.life) this.wallCrack = null;
    }
    /* Here and not in decay(), for the same reason the ultimate clock is here:
       a status tag is spawned by a hit, and every hit begins with a hit stop
       that runs decayImpactOnly. Tick it on the normal path only and the tag
       freezes for exactly the frames the viewer is staring hardest at. */
    for (let i = this.tags.length - 1; i >= 0; i--){
      this.tags[i].life -= dt;
      if (this.tags[i].life <= 0) this.tags.splice(i, 1);
    }
    for (const f of [this.a, this.b]){
      if (f.hpGhost == null) f.hpGhost = f.hp;
      f.ringFlash = Math.max(0, (f.ringFlash || 0) - dt * 2.6);
      /* Heals snap the ghost up so mending reads as instant; damage lets it
         lag, so the size of the bite that was just taken is visible as a
         draining tail rather than having to be inferred from a number. */
      if (f.hp >= f.hpGhost) f.hpGhost = f.hp;
      else f.hpGhost += (f.hp - f.hpGhost) * (1 - Math.exp(-5.5 * dt));
    }
  }

  decayImpactOnly(dt){
    this.tickPresentation(dt);
    this.shake = Math.max(0, this.shake - 90 * dt);
    this.finisher = Math.max(0, this.finisher - dt);
    for (let i = this.rings.length - 1; i >= 0; i--){
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
  }

  decay(dt){
    this.decayImpactOnly(dt);
    if (this.over) this.resultT = (this.resultT || 0) + dt;
    for (let i = this.fx.length - 1; i >= 0; i--){
      const p = this.fx[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94; p.vy += 130 * dt;
      p.life -= dt;
      if (p.life <= 0) this.fx.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--){
      const f = this.floats[i];
      f.y -= 52 * dt; f.life -= dt * 1.05;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
    const A = CONFIG.arena;
    for (const m of this.motes){
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y < -6){ m.y = A.h + 6; m.x = this.rng() * A.w; }
      if (m.x < -6) m.x = A.w + 6; else if (m.x > A.w + 6) m.x = -6;
    }
    if (this.banner){ this.banner.life -= dt; if (this.banner.life <= 0) this.banner = null; }
    this.tickPresentation(dt);
    if (this.over) this.deathAge += dt;   // the match clock is stopped by now
  }

  tickStatus(f, dt){
    for (const key of Object.keys(f.status)){
      const st = f.status[key], def = STATUS[key];
      /* The ward does not run down while it is being drawn. Everything
         else does -- a bow winding up an ultimate still bleeds, is still
         cursed, and is still entangled. */
      if (!(key === "ward" && f.ultDraw)) st.t -= dt;
      if (st.t <= 0){
        /* Expiring is not breaking. A ward that runs out fades quietly;
           only damage that empties the pool shatters it. Two outcomes get
           two pictures, which is why the clock and the pool are separate
           reads on screen (brightness and arc length). */
        if (key === "ward"){ f.shield = 0; f.shieldMax = 0; f.wardFade = 1; }
        delete f.status[key]; continue;
      }
      if (def.dps && key !== "blessing"){
        f.hp -= def.dps * st.stacks * dt * f.dmgTakenMul();
        if (this.rng() < dt * 8){
          const aff = Object.values(AFFINITIES).find(a => a.status === key);
          this.spawnFx(f.x, f.y, aff ? aff.glow : "#fff", 1, 60, 0.5, 3);
        }
      }
      if (key === "blessing"){
        f.hp = Math.min(f.maxHp, f.hp + def.hps * st.stacks * dt);
      }
    }
    const hx = f.stacks("hex");
    if (hx > 0){
      f.hexClock += dt * hx;
      if (f.hexClock >= STATUS.hex.stunEvery){
        f.hexClock = 0;
        f.stun = Math.max(f.stun, STATUS.hex.stunFor);
        this.spawnFx(f.x, f.y, AFFINITIES.runic.glow, 9, 190, 0.35, 3);
      }
    }
    f.stun   = Math.max(0, f.stun - dt);
    f.stunDR = Math.max(0, f.stunDR - CONFIG.impact.stunDRDecay * dt);
    f.flash  = Math.max(0, f.flash - dt * 4);
    f.mend   = Math.max(0, f.mend - dt * 2.4);
    f.shatterFx = Math.max(0, (f.shatterFx || 0) - dt * 2.2);
    f.wardFade  = Math.max(0, (f.wardFade  || 0) - dt * 1.9);
    f.spendFx   = Math.max(0, (f.spendFx   || 0) - dt * 1.7);
    f.hp = Math.min(f.hp, f.maxHp);
  }

  move(f, foe, dt){
    const P = CONFIG.physics, R = P.ballR;
    f.vy += P.gravity * Math.pow(f.w.mass / P.massRef, P.massWeight) * dt;
    f.x += f.vx * dt * f.moveMul();
    f.y += f.vy * dt * f.moveMul();

    const A = CONFIG.arena, n = this.inset;
    const loX = n + R, hiX = A.w - n - R, loY = n + R, hiY = A.h - n - R;
    let bounced = false;
    if (f.x < loX){ f.x = loX; f.vx = Math.abs(f.vx); bounced = true; }
    if (f.x > hiX){ f.x = hiX; f.vx = -Math.abs(f.vx); bounced = true; }
    if (f.y < loY){ f.y = loY; f.vy = Math.abs(f.vy); bounced = true; }
    /* The floor keeps a little of what lands on it — only the floor, because
       only the floor is being fallen onto. The relax term feeds the energy back
       over the next second, so a heavy landing reads as heavy without ever
       becoming a ball that stops. */
    if (f.y > hiY){ f.y = hiY; f.vy = -Math.abs(f.vy) * P.floorBounce; bounced = true; }

    if (bounced && this.killFlight && f === this[this.killFlight.tgt]){
      /* The wall gets it. Pinned where it hit, the flight is over, and
         checkEnd — which has been holding the match open — now ends it HERE,
         so the death fx, the kill flash and the shell shatter all happen
         against the wall instead of wherever the blow was struck. */
      this.killFlight = null;
      f.vx = 0; f.vy = 0;
      this.wallCrack = { x: f.x, y: f.y, col: f.aff.core, glow: f.aff.glow,
                         nx: f.x <= loX + 1 ? 1 : f.x >= hiX - 1 ? -1 : 0,
                         ny: f.y <= loY + 1 ? 1 : f.y >= hiY - 1 ? -1 : 0,
                         t: 0, life: 2.2 };
      this.shake = 54;
    }
    if (bounced){
      const a = Math.atan2(f.vy, f.vx) + (this.rng() - 0.5) * CONFIG.physics.bounceJitter;
      const sp = Math.hypot(f.vx, f.vy);
      f.vx = Math.cos(a) * sp; f.vy = Math.sin(a) * sp;
      this.spawnFx(f.x, f.y, f.aff.core, 3, 90, 0.3, 2);
      SFX.play("wall");
    }

    f.trail.push(f.x, f.y);
    if (f.trail.length > 36) f.trail.splice(0, f.trail.length - 36);

    /* Speed relaxes back toward a target instead of being pinned to it, so a
       ball that just took a warhammer to the face genuinely rockets away and
       spends a second or two coasting back down. Only the magnitude is
       touched — the direction out of a bounce is exactly the direction in.

       The target is where gravity becomes visible. A flat `cruise` forbids the
       one thing falling looks like; this is the speed a body of conserved
       energy carries at this height, referenced to mid-hall. See the note on
       CONFIG.physics.gravity. */
    const sp0 = Math.hypot(f.vx, f.vy);
    if (sp0 > 1e-6){
      const k = 1 - Math.exp(-P.relax * dt);
      const drop = clamp(hiY - f.y, 0, hiY - loY);
      const e = P.cruise * P.cruise
              + 2 * P.gravity * P.heightVary * ((hiY - loY) * 0.5 - drop);
      const target = Math.sqrt(Math.max(P.speedMin * P.speedMin, e));
      /* A Crucible launch is allowed over the ceiling; `launch` is the
         permission and its decay is the payment plan. Zero for every ball
         that was never struck by one, in which case vmax IS speedMax. */
      if (f.launch) f.launch = Math.max(0, f.launch - dt);
      const vmax = P.speedMax * (1 + (f.launch ? 1.15 * Math.min(1, f.launch / 0.9) : 0));
      const sp = clamp(sp0 + (target - sp0) * k, P.speedMin, vmax);
      const s = sp / sp0;
      f.vx *= s; f.vy *= s;
      f.speed = sp;                     // renderer reads this for the motion cue
    }
  }

  tickWeapon(f, foe, dt){
    const mods = this.actMods;
    /* Rick's aim mechanic: massive rotation until the facing is right.
       Nothing else changes -- the bow fires along f.theta the way it
       always does, it just gets there faster. Returns to normal the frame
       the shot leaves, because f.ultDraw is cleared there. */
    const spin = f.w.spin * f.spinMul(mods.spin)
              * (f.ultDraw || f.ultForge ? (f.w.ult.spinMul || 1) : 1);

    if (f.w.mode === "chain"){
      /* A chain is not an arm, but it is also not a free mass: a flail that is
         being swung is *always* going round its pivot. Modelling it as a
         position spring let the head drift inward and trail limply behind the
         ball, which looked broken. So the state is angular — the head has its
         own angle and angular velocity, driven toward the swing.

           follow  pulls headAngVel toward the driven rate  -> it always spins
           spring  pulls headAng toward theta               -> lag and overshoot
           extend  flies the head out under speed           -> reads as a chain

         Whip on impact is then just an impulse to headAngVel, and the head
         cannot fall inside its own arc. */
      const C = CONFIG.chain;
      const reach = f.w.reach * mods.reach;
      if (f.stun <= 0) f.theta += spin * dt * f.spinDir;
      const drive = f.stun > 0 ? 0 : spin * f.spinDir;

      f.headAngVel += ((drive - f.headAngVel) * C.follow
                       + angDiff(f.headAng, f.theta) * C.spring) * dt;
      /* The head has weight too. +y is down, so gravity pulls headAng toward
         PI/2 and the restoring term is cos(headAng) — a real pendulum about
         the tip of the haft, divided by the live chain length so a chain swung
         out short whips faster than one hanging at full extension. */
      f.headAngVel += (CONFIG.physics.gravity * C.sag / Math.max(1, f.headR))
                      * Math.cos(f.headAng) * dt;
      f.headAngVel *= Math.pow(C.damp, dt * 120);
      f.headAngVel = clamp(f.headAngVel, -C.maxAngVel, C.maxAngVel);
      f.headAng += f.headAngVel * dt;

      /* Centrifugal extension. Spinning fast throws it to full reach; stalled
         or stunned, it swings in on a slack chain. */
      const chainLen = reach * (1 - C.hilt);
      const swing  = Math.abs(f.headAngVel) / Math.max(0.5, Math.abs(spin));
      const target = chainLen * clamp(0.44 + 0.56 * swing, 0.38, 1);
      f.headR += (target - f.headR) * (1 - Math.exp(-C.extend * dt));
      f.headR = clamp(f.headR, chainLen * 0.30, chainLen);

      /* The pivot is the tip of the haft, and the haft turns with the weapon.
         Anchoring the chain at the relic's centre instead was why the head read
         as orbiting the ball rather than being swung on the end of a handle. */
      f.pivX = f.x + Math.cos(f.theta) * reach * C.hilt;
      f.pivY = f.y + Math.sin(f.theta) * reach * C.hilt;
      f.headX = f.pivX + Math.cos(f.headAng) * f.headR;
      f.headY = f.pivY + Math.sin(f.headAng) * f.headR;
      /* the head also tumbles, faster the harder it is being swung */
      f.headSpin += (f.headAngVel * 1.7 + drive * 0.5) * dt;
    }
    else if (f.stun > 0){ /* weapon locked */ }
    else if (f.w.mode === "swing"){
      const aim = Math.atan2(foe.y - f.y, foe.x - f.x);
      f.swingPhase += spin * dt * f.spinDir;
      f.theta = aim + Math.sin(f.swingPhase) * (f.w.arc || 1.2);
    } else {
      f.theta += spin * dt * f.spinDir;
    }

    /* tip history, for the swing-arc ribbons */
    const segs = this.bladeSegments(f);
    for (let i = 0; i < segs.length; i++){
      const tp = f.tips[i];
      tp.push(segs[i].bx, segs[i].by);
      if (tp.length > 26) tp.splice(0, tp.length - 26);
    }
  }

  /* Every weapon reduces to one or more thick segments, whatever its art. */
  bladeSegments(f){
    const mods = this.actMods;
    const R = CONFIG.physics.ballR;
    const reach = f.w.reach * mods.reach;
    if (f.w.mode === "chain"){
      const dx = f.headX - f.x, dy = f.headY - f.y;
      const d  = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      return [{
        ax: f.headX - ux * f.w.width * 0.30, ay: f.headY - uy * f.w.width * 0.30,
        bx: f.headX + ux * f.w.width * 0.30, by: f.headY + uy * f.w.width * 0.30,
        a: Math.atan2(dy, dx),
      }];
    }
    const out = [];
    for (const off of f.w.blades){
      const a = f.theta + off * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      out.push({
        ax: f.x + ca * (R - 4),         ay: f.y + sa * (R - 4),
        bx: f.x + ca * (R + reach),     by: f.y + sa * (R + reach),
        a,
      });
    }
    return out;
  }

  /* ----------------------------------------------------------- ranged --- */
  /* The cadence. No aim, no steering, no homing: the shot leaves along
     f.theta, which is the facing the viewer can see. Everything that makes
     ranged strong is positional luck rather than intent. */
  tickFire(f, foe, dt){
    if (this.killFlight && f.hp <= 0) return;   // dead balls loose nothing
    const S = f.w.shot;
    if (!S || !f.alive || this.over) return;
    /* Presentation: the string comes back over the last third of the cadence,
       so the shot has a wind-up the eye can catch. Nothing reads this. */
    f.drawK = clamp(1 - f.fireCd / (S.cadence * 0.34), 0, 1);
    /* A locked weapon cannot fire. This is what makes hex a real answer to a
       bow with no special case anywhere, and it is the same rule melee lives
       under -- tickWeapon stops turning and tickHits skips on f.stun. */
    if (f.stun > 0) return;

    /* An aimed shot in progress. The cadence stops -- the relic is committed,
       and the gap in the stream of bolts is itself part of the telegraph. The
       string comes back over the whole wind-up rather than over the last third
       of a cadence, so the draw reads as a much bigger version of the thing
       the viewer has already been watching it do five times a second. */
    if (f.ultDraw){
      const D = f.ultDraw, u = f.w.ult;
      D.t += dt;
      f.drawK = clamp(D.t / D.minT, 0, 1);

      /* The bearing that would land a hit RIGHT NOW, recomputed every frame
         because the target keeps moving. The bow is not turned toward it and
         never sees it -- this is only the question "would firing this instant
         connect", asked once a frame while the weapon spins past. */
      const v = u.speed, g = u.grav || 0;
      const d0 = Math.hypot(foe.x - f.x, foe.y - f.y);
      const tof = d0 / v;
      const tx = foe.x + foe.vx * tof, ty = foe.y + foe.vy * tof;
      const aim = ballisticAngle(tx - f.x, ty - f.y, v, g);

      /* CROSSING DETECTION, not a tolerance window. A tolerance would fire up
         to half a frame's rotation off-bearing -- at this spin that is 8
         degrees, which is wider than the target at any real range, and every
         shot would miss for a reason nobody could see. The signed angle from
         facing to bearing changes sign at the exact instant the bow sweeps
         through it, so that instant is what fires. The magnitude guard rejects
         the wrap-around at +/-pi, which is a sign change that is not a
         crossing. */
      const d = angDiff(f.theta, aim);
      const crossed = D.d !== undefined && Math.abs(d) < 0.9 && Math.abs(D.d) < 0.9
                      && (d === 0 || Math.sign(d) !== Math.sign(D.d));
      D.d = d;

      /* The cap exists so a pathological chase cannot stall the match. It has
         never been the thing that fires in measurement -- see the loose-delay
         histogram in shot_sweep -- but a wind-up with no upper bound is a
         timeout waiting to be discovered by someone else. */
      if (D.t >= D.minT && (crossed || D.t >= D.cap)){
        f.ultDraw = null;
        this.loose(f, foe, { a: aim, tx, ty, timedOut: !crossed });
      }
      return;
    }

    f.fireCd -= dt;
    if (f.fireCd > 0) return;
    f.fireCd += S.cadence;
    this.spawnShot(f);
  }

  /* Spawned at the blade tip, moving along the facing, with NO inheritance of
     the ball's own velocity. Inheritance is more physical and it breaks the
     one sentence the whole design rests on: you saw where it was pointing. */
  spawnShot(f, angle){
    const S = f.w.shot;
    if (this.shots.length >= CONFIG.shot.maxLive) this.shots.shift();
    const R = CONFIG.physics.ballR;
    const a = angle === undefined ? f.theta : angle;
    const ca = Math.cos(a), sa = Math.sin(a);
    const reach = f.w.reach * this.actMods.reach;
    this.shots.push({
      own: f === this.a ? "a" : "b",
      x: f.x + ca * (R + reach), y: f.y + sa * (R + reach),
      /* CINEMA (demo): where it was loosed from, and how fast the archer was
         moving at the time. Dead data as far as the sim is concerned -- nothing
         reads it but the director, which prices a long shot by how far the bolt
         actually travelled rather than by what it hit. */
      x0: f.x, y0: f.y, spd0: f.speed, t0: this.t,
      vx: ca * S.speed, vy: sa * S.speed,
      r: S.r, life: S.life, max: S.life, grav: S.grav || 0,
      dmgMul: S.dmgMul === undefined ? 1 : S.dmgMul,
      aff: f.aff, a,
    });
    f.shotsFired++;
    SFX.play("loose");
  }

  /* Release. NOTHING about where this shot goes is decided here -- the angle
     was committed three quarters of a second ago, in fireUlt, and `d.a` is
     that commitment arriving. There is no steering, no homing, no correction
     in flight, and no second look at where the target got to.

     That is the whole design. The lead was solved ONCE, over draw AND flight
     time, and never revised, so the residual error grows with distance and
     with how fast the target is moving -- a close stationary target is nearly
     a sure thing, a fast distant one is a real gamble. And because the banner
     is sitting on the committed point for the entire wind-up, a miss is not a
     dice roll the viewer has to take on trust: they watched the enemy leave
     the spot the word was naming. */
  loose(f, foe, d){
    const u = f.w.ult;
    const spent = this.spendWard ? this.spendWard(f) : 0;
    const cap = (STATUS.ward && STATUS.ward.cap) || 1;
    const v = u.speed, g = u.grav || 0;
    const a = d && d.a !== undefined
            ? d.a
            : ballisticAngle(foe.x - f.x, foe.y - f.y, v, g);   // no draw: aim flat
    if (spent > 0){ f.spendFx = 1; f.spendA = a; }       // the plates go with it

    /* THE NAME IS NOT PLACED HERE. It rides the arrow and blooms where the
       arrow RESOLVES -- see tickShots.

       v1 put it on the predicted landing point at the moment of release, which
       is the right coordinate and the wrong moment. Rick, watching it: "the
       reprisal isnt really showing at the point of contact very well. it feels
       like its just popping up in a random spot." He is right, and the cause
       is not the maths: at release there is NOTHING AT THAT POINT. Every other
       on-target ultimate in this game blooms on a ball -- Judgement on the
       quarry, Bramblesnare on the quarry -- so the word always has an object
       to belong to. This one bloomed on bare floor a second before the arrow
       arrived, and a word over empty floor reads as random no matter how
       correct the coordinate is.

       Naming it at the resolution fixes both halves at once: the word lands on
       an event rather than on a prediction, and a MISS becomes legible too --
       the arrow sails past, hits the wall, and the name arrives out there on
       nothing, which is exactly what a miss should look like. */

    const R = CONFIG.physics.ballR;
    const reach = f.w.reach * this.actMods.reach;
    const ca = Math.cos(a), sa = Math.sin(a);
    /* Priced as a multiplier rather than as a flat bonus so it flows through
       resolveHit exactly like every other hit: one damage number, sized by the
       existing rule, scaled by the act, jittered, and multiplied by sunder. A
       second float would have been a second thing to read. */
    const total = u.dmg + spent;
    this.shots.push({
      own: f === this.a ? "a" : "b",
      x: f.x + ca * (R + reach), y: f.y + sa * (R + reach),
      x0: f.x, y0: f.y, spd0: f.speed, t0: this.t,           // CINEMA (demo)
      vx: ca * v, vy: sa * v,
      r: u.r || 18, life: u.life || 3, max: u.life || 3, grav: g,
      dmgMul: total / Math.max(0.01, f.w.dmg),
      /* Knockback scales to the pool that was SPENT, so the shove only turns up
         when the bow earned it in contact. An empty ward fires a pop. */
      knock: (u.knock || 0) * clamp(spent / cap, 0, 1),
      plates: Math.round(clamp(spent / cap, 0, 1) * 5),   // the ward, in flight
      aff: f.aff, a, ult: true,
      /* The name travels with the shot and is spent where the shot is. */
      ultName: u.name, ultW: f.w.id,
    });
    this.shake = Math.min(38, this.shake + 14);
    SFX.play("ult", { w: f.w.id });
  }

  /* Advance, then resolve in the order the viewer would: parried, then landed,
     then spent on a wall. A shot that is both parried and on target this frame
     is PARRIED -- melee's defence wins ties, because the alternative is a
     blade that visibly met the arrow and did nothing. */
  tickShots(dt){
    if (!this.shots.length) return;
    const A = CONFIG.arena, n = this.inset, R = CONFIG.physics.ballR;
    const segsA = this.a.stun > 0 ? [] : this.bladeSegments(this.a);
    const segsB = this.b.stun > 0 ? [] : this.bladeSegments(this.b);

    for (let i = this.shots.length - 1; i >= 0; i--){
      const s = this.shots[i];
      s.vy += s.grav * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.life -= dt;

      const src = s.own === "a" ? this.a : this.b;
      const foe = s.own === "a" ? this.b : this.a;
      const segs = s.own === "a" ? segsB : segsA;
      let dead = false;

      /* --- the parry. This is the piece that makes ranged fair AND legible:
         a spinning weapon that meets a shot in flight bats it away, with the
         same flash and the same sound as a bind, because it is the same idea.
         It deliberately does NOT touch clankCount or clankStreak: the streak
         exists to stop two weapons locking each other out of the match, and
         an arrow cannot participate in that loop. */
      for (const q of segs){
        const d = segDist(q.ax, q.ay, q.bx, q.by, s.x, s.y).d;
        if (d < s.r + foe.w.width * 0.5 + CONFIG.shot.pad){
          this.spawnFx(s.x, s.y, "#FFF4D0", 9, 240, 0.34, 3.2);
          this.ring(s.x, s.y, foe.aff.glow, 3, 46, 0.22, 3);
          this.shake = Math.min(38, this.shake + 4);
          SFX.play("clank");
          dead = true; break;
        }
      }

      /* --- the hit. Routed through resolveHit so a shot is a hit in every
         sense the rest of the game already understands: crit, jitter, sunder
         multiplier, onHit status, the damage float sized by damage, the shell
         flash, hit stop, and self.hits++ for verify.py's six-hit floor.
         The synthetic segment points along the arrow, so sparks fly the way
         the shot was travelling. */
      if (!dead && foe.alive && src.alive
          && Math.hypot(s.x - foe.x, s.y - foe.y) < R + s.r){
        const bl = Math.hypot(s.vx, s.vy) || 1;
        const seg = { ax: s.x - s.vx/bl*10, ay: s.y - s.vy/bl*10,
                      bx: s.x + s.vx/bl*10, by: s.y + s.vy/bl*10, a: s.a };
        this.shotHits++;
        /* CINEMA (demo): resolveHit does not take the projectile, and the
           director needs to know the bolt's flight to price the shot. Handed
           over on the instance for the duration of the call and cleared
           immediately, so nothing can read a stale one. */
        this._cineShot = s;
        this.resolveHit(src, foe, s.x, s.y, seg, s.dmgMul);
        this._cineShot = null;
        /* Along the BOLT's travel, not away from the shooter. A shot that
           shoves you in the direction it was already going is the only
           version a viewer can predict from the picture. */
        if (s.knock){
          const kl = Math.hypot(s.vx, s.vy) || 1;
          foe.vx += (s.vx / kl) * s.knock; foe.vy += (s.vy / kl) * s.knock;
        }
        dead = true;
      }

      /* --- spent. No bounce: a ricocheting arrow is chaos the viewer cannot
         attribute to anything, and a miss ending visibly on the wall is what
         makes the miss cost something. */
      if (!dead && (s.life <= 0
          || s.x < n + s.r || s.x > A.w - n - s.r
          || s.y < n + s.r || s.y > A.h - n - s.r)){
        this.spawnFx(s.x, s.y, s.aff.core, 4, 110, 0.26, 2.2);
        dead = true;
      }

      /* An ultimate arrow names itself where it ends, whichever of the three
         ways it ended: on the enemy, on a blade that batted it out of the air,
         or on a wall it was never going to reach. One placement for all three,
         because all three are the same event -- the shot resolving -- and a
         viewer should be told what it was in every case, not only when it
         worked. */
      if (dead && s.ultName){
        const A = CONFIG.arena;
        this.banner = { text: s.ultName, life: 2.1, max: 2.1,
                        color: s.aff.core, glow: s.aff.glow, w: s.ultW,
                        bx: clamp(s.x, 90, A.w - 90),
                        by: clamp(s.y, 90, A.h - 90) };
      }
      if (dead) this.shots.splice(i, 1);
    }
  }

  /* ------------------------------------------------------------- clank --- */
  tickClank(dt){
    if (this.clankCd > 0 || !this.a.alive || !this.b.alive) return;
    const A = this.a, B = this.b;
    if (A.stun > 0 && B.stun > 0) return;
    const sa = this.bladeSegments(A), sb = this.bladeSegments(B);
    const C = CONFIG.clank;

    const R = CONFIG.physics.ballR;

    for (const p of sa){
      for (const q of sb){
        const r = segSegDist(p.ax,p.ay,p.bx,p.by, q.ax,q.ay,q.bx,q.by);
        const touch = (A.w.width + B.w.width) * 0.5 + C.pad;
        if (r.d >= touch) continue;
        /* Neither blade may have arrived here through the other relic. Tested
           from each ball's own centre because that is where the whole assembly
           hangs from -- for a chain it is the chain that would be passing
           through the body, not just the head. */
        if (rayBlocked(A.x, A.y, r.x, r.y, B.x, B.y, R)) continue;
        if (rayBlocked(B.x, B.y, r.x, r.y, A.x, A.y, R)) continue;
        /* `continue` rather than `return` on a refusal: a twinblade has two
           blades and one of them being buried must not mask the other one
           genuinely crossing. */
        this.resolveClank(A, B, r.x, r.y);
        return;
      }
    }
  }

  resolveClank(A, B, hx, hy){
    const C = CONFIG.clank;
    this.clankCount++;
    A.clanks++; B.clanks++;
    this.clankStreak = Math.min(C.maxStreak, this.clankStreak + 1);
    const st = this.clankStreak;
    this.clankCd = C.cd * (1 + C.cdGrowth * st);
    const knockMul = 1 + C.knockGrowth * st;
    const stunMul  = 1 / (1 + C.stunFalloff * st);

    /* Mass decides the exchange. The lighter relic is thrown further and
       staggered longer; the heavier one shrugs it off. */
    const mA = A.w.mass, mB = B.w.mass;
    const wA = Math.pow(mA, 1.7), wB = Math.pow(mB, 1.7), tot = wA + wB;
    const shareA = wB / tot;            // how much A suffers
    const shareB = wA / tot;

    /* Who keeps swinging. This used to reverse both relics unconditionally and
       then print "CLANK" over it, which is backwards: the game already knows
       who won the bind and had nothing on screen that said so.

       Rick: "shouldn't the physics just show this? if the loser stops swinging
       and gets flung off that should be pretty obvious." Right — so the winner
       now powers *through* the bind and keeps its swing, and only the loser's
       weapon is knocked backwards. Between two relics of similar mass neither
       side is decisive and both reverse, which is also true and also legible:
       that one reads as a deadlock, because it is one. */
    const decisive = Math.abs(shareA - shareB) > 0.16;
    const aWins = shareA < shareB;
    if (!decisive || !aWins) A.spinDir *= -1;
    if (!decisive ||  aWins) B.spinDir *= -1;
    A.stun = Math.max(A.stun, C.stun * shareA * 2 * stunMul);
    B.stun = Math.max(B.stun, C.stun * shareB * 2 * stunMul);

    /* Chain heads take a real impulse — they whip away from the strike. With
       the angular model that is a kick to angular velocity in whichever
       direction carries the head away from the point of contact, plus a
       momentary slackening so the chain visibly buckles before it flies out. */
    for (const [f, share] of [[A, shareA], [B, shareB]]){
      if (f.w.mode !== "chain") continue;
      const away = angDiff(Math.atan2(hy - (f.pivY ?? f.y), hx - (f.pivX ?? f.x)),
                           f.headAng);
      const dir  = away >= 0 ? 1 : -1;
      f.headAngVel = clamp(f.headAngVel + dir * 11 * share,
                           -CONFIG.chain.maxAngVel, CONFIG.chain.maxAngVel);
      f.headR *= 1 - 0.30 * share;
    }

    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    A.vx -= nx * C.knock * shareA * 2 * knockMul;
    A.vy -= ny * C.knock * shareA * 2 * knockMul;
    B.vx += nx * C.knock * shareB * 2 * knockMul;
    B.vy += ny * C.knock * shareB * 2 * knockMul;

    this.hitStop = Math.max(this.hitStop, C.stop);
    this.beat({ kind: "clank", x: hx, y: hy,                        // CINEMA
                streak: this.clankStreak, decisive: !!decisive,
                spd: Math.max(A.speed, B.speed),
                close: Math.hypot(A.vx - B.vx, A.vy - B.vy) });
    this.shake   = Math.max(this.shake, C.shake);
    /* The sparks are thrown along the loser's flight, not scattered evenly, so
       the spray itself points at who lost. No text. */
    const win = aWins ? A : B, lose = aWins ? B : A;
    const lx = lose === B ? nx : -nx, ly = lose === B ? ny : -ny;
    this.ring(hx, hy, "#FFF4D0", 6, 120, 0.42, 7);
    this.ring(hx, hy, win.aff.core, 4, decisive ? 104 : 78, 0.32, 5);
    this.spawnFx(hx, hy, "#FFF4D0", 30, 400, 0.55, 4, lx, ly);
    this.spawnFx(hx, hy, lose.aff.glow, 16, 320, 0.5, 3, lx, ly);
    this.spawnFx(hx, hy, win.aff.glow, 8, 200, 0.4, 3);
    SFX.play("clank", { mass: Math.max(mA, mB) });
    this.note(`clank — ${(mA > mB ? A : B).w.name} wins the bind`);
  }

  /* -------------------------------------------------------------- hits --- */
  tickHits(self, foe, dt){
    /* A dead ball on its kill flight lands no blows; a hammer that has not
       reached the Crucible's legibility floor lands none either, so the
       wind-up cannot be over before the viewer has seen it. The foe's own
       blows land throughout — a wind-up is a promise, not a ward. */
    if (this.killFlight && self.hp <= 0) return;
    if (self.ultForge && self.ultForge.t < self.ultForge.minT) return;
    if (!self.alive || !foe.alive) return;
    const R = CONFIG.physics.ballR;
    const segs = this.bladeSegments(self);
    for (let i = 0; i < segs.length; i++){
      self.hitCd[i] = Math.max(0, (self.hitCd[i] || 0) - dt);
      if (self.hitCd[i] > 0 || self.stun > 0) continue;
      const s = segs[i];
      const hit = segDist(s.ax, s.ay, s.bx, s.by, foe.x, foe.y);
      if (hit.d < R + self.w.width * 0.5){
        self.hitCd[i] = CONFIG.combat.hitCd;
        this.resolveHit(self, foe, hit.x, hit.y, s);
      }
    }
  }

  /* ------------------------------------------------------------ VIGIL --
     One gate for direct damage. The shield eats first and the OVERFLOW carries
     through to health, so a large hit is not wasted on a thin plate.

     Damage-over-time deliberately does NOT route through here. Bleed and smite
     go UNDER the ward. That is a design decision, not an oversight: it hands
     the two DoT schools a real answer to vigil, and it stops a 1.5/s trickle
     from shattering a plate with no attacker present to be flung. */
  hurt(foe, dmg, src){
    if (foe.shield > 0 && dmg > 0){
      const absorbed = Math.min(foe.shield, dmg);
      foe.shield -= absorbed;
      dmg -= absorbed;
      if (absorbed >= 1)
        this.float(foe.x, foe.y - 60, "-" + Math.round(absorbed),
                   AFFINITIES.vigil.glow, 22 + absorbed * 0.35);
      if (foe.shield <= 0) this.shatter(foe, src);
    }
    if (dmg > 0) foe.hp -= dmg;
  }

  /* The break beat. Burst scales with the pool that was BANKED, so a fat ward
     is a fat burst. Knockback scales with the WIELDER's own knockMul -- Rick's
     correction, and the reason this needs no per-relic special case: knockMul
     is a type property, so the vigil warhammer throws you across the hall and
     the vigil bow only pops. Balance the combo, not the school. */
  shatter(f, src){
    const W = STATUS.ward;
    const pool = f.shieldMax || 0;
    f.shield = 0; f.shieldMax = 0;
    delete f.status.ward;
    f.shatterFx = 1;
    const burst = Math.round(pool * W.shatter);
    if (src && src.alive && burst > 0){
      src.hp -= burst;
      src.flash = 1; src.ringFlash = 1;
      this.float(src.x, src.y - 40, burst, AFFINITIES.vigil.glow, 30 + burst * 0.7);
      const kx = src.x - f.x, ky = src.y - f.y, kl = Math.hypot(kx, ky) || 1;
      const power = W.knock * (f.w.knockMul || 1);
      src.vx += (kx / kl) * power; src.vy += (ky / kl) * power;
    }
    this.spawnFx(f.x, f.y, AFFINITIES.vigil.core, 40, 380, 0.8, 5);
    this.ring(f.x, f.y, AFFINITIES.vigil.glow, 8, 210, 0.5, 7);
    this.hitStop = Math.max(this.hitStop, 0.10);
    this.shake = Math.min(38, this.shake + 16);
    SFX.play("hit", { dmg: burst, crit: true });
  }

  /* SPEND. The ward's third ending, and the only one the relic chooses.
     Returns the pool it consumed so the caller can price the shot with it.

     This is NOT shatter() with a flag. shatter() bursts the pool at `src` and
     flings them, and it is reached from hurt() the instant the shield hits
     zero -- so draining through the damage path would make the bow damage
     ITSELF and throw itself across the hall with no attacker to be thrown
     from. Separate event, separate function, no shared branch to get wrong. */
  spendWard(f){
    const pool = f.shield;
    if (pool <= 0) return 0;
    f.shield = 0; f.shieldMax = 0;
    delete f.status.ward;
    f.spendFx = 1;                      // presentation: plates stream FORWARD
    return pool;
  }

  resolveHit(self, foe, hx, hy, seg, mul){
    const mods = this.actMods, C = CONFIG.chaos, I = CONFIG.impact;
    /* THE CRUCIBLE'S STRIKE. A melee connect while the forge is lit — and
       past its legibility floor — is the ultimate resolving, priced here so
       it obeys every rule an ordinary swing obeys: same single rng draw,
       same jitter, same hit-stop scale. `n` counts the stacks the blow lands
       into, INCLUDING the one its own onHit is about to add — the hammer's
       landing is itself a sunder, and the forge burns all of it. */
    const forge = (mul === undefined && self.ultForge &&
                   self.ultForge.t >= self.ultForge.minT && self.w.ult.critPer)
      ? { n: Math.min(STATUS.sunder.maxStacks,
                      foe.stacks("sunder") + ((self.w.onHit || {}).sunder || 0)) }
      : null;
    const crit = this.rng() < (forge
      ? Math.min(1, C.critChance + self.w.ult.critPer * forge.n)
      : C.critChance);
    const jitter = 1 + (this.rng() - 0.5) * C.dmgJitter;
    /* `mul` prices a projectile against a swing on the same relic without
       handing tune.py a second knob. Undefined everywhere else, so every
       existing call site is byte-identical in behaviour. */
    let dmg = self.w.dmg * (mul === undefined ? (forge ? self.w.ult.strikeMul : 1) : mul)
            * self.dmgMul(mods.dmg) * jitter * foe.dmgTakenMul();
    if (crit){ dmg *= forge ? C.critMul + self.w.ult.critMulPer * forge.n : C.critMul; self.crits++; }
    dmg = Math.round(dmg);

    this.hurt(foe, dmg, self);
    foe.flash = 1;
    foe.ringFlash = 1;
    self.hits++; self.dealt += dmg;

    const fatal = foe.hp <= 0;

    /* --- weight --- */
    let stop = Math.min(I.stopMax, I.stopBase + dmg * I.stopPerDmg);
    if (crit) stop *= I.critStopMul;
    if (fatal){ stop = I.killStop; this.finisher = 1.0; }
    this.hitStop = Math.max(this.hitStop, stop);
    /* CINEMA (demo). `hpAfter` rather than `dmg` alone, because the director
       scores the SHARE of what was left that this hit took -- 40 points off a
       full relic is a scratch, 40 off a relic sitting on 45 is the fight. */
    /* CINEMA (demo). The kinematics, not just the number. What makes a blow
       cinematic is how hard the two things were moving when they met and how
       far the blow came from -- damage is an outcome, speed is the picture. */
    const _cs = this._cineShot;
    this.beat({ kind: "hit", side: self === this.a ? 0 : 1, x: hx, y: hy,
                dmg, crit, fatal, hpAfter: Math.max(0, foe.hp),
                hpFrac: Math.max(0, foe.hp) / foe.maxHp, maxHp: foe.maxHp,
                selfHpFrac: self.hp / self.maxHp,
                spd: self.speed, foeSpd: foe.speed,
                /* Closing speed: the magnitude of the RELATIVE velocity. Two
                   relics flying at each other is the shot; two drifting the
                   same way at the same speed is not, however fast the number
                   on either one. */
                close: Math.hypot(self.vx - foe.vx, self.vy - foe.vy),
                ranged: !!_cs,
                range: _cs ? Math.hypot(hx - _cs.x0, hy - _cs.y0) : 0,
                /* Loose time and place, so the director can film the shot
                   BEING TAKEN and not just landing -- without both ends the
                   viewer cannot tell what caused the cinematic. */
                loosT: _cs ? (_cs.t0 || 0) : 0,
                lx: _cs ? _cs.x0 : 0, ly: _cs ? _cs.y0 : 0,
                shotSpd0: _cs ? (_cs.spd0 || 0) : 0 });
    if (!fatal) foe.takeHitstun(dmg);

    for (const [k, n] of Object.entries(self.w.onHit || {})){
      foe.apply(k, n);
      const first = !this.taught[k] && !!(STATUS[k] && STATUS[k].tip);
      if (first) this.taught[k] = true;
      this.statusTag(hx, hy, k, first);
    }
    /* VIGIL: the wielder banks a share of what it just dealt. `onHit` is
       hardcoded to the foe, so a self-directed buff needs its own channel.
       The tag prints at SELF rather than at the contact point, because the
       effect belongs on the thing it affects. */
    for (const [k, n] of Object.entries(self.w.onSelf || {})){
      if (k !== "ward"){ self.apply(k, n); continue; }
      const W = STATUS.ward;
      const before = self.shield;
      self.shield = Math.min(W.cap, self.shield + dmg * W.bank * n);
      self.shieldMax = Math.max(self.shieldMax, self.shield);
      self.apply("ward", 1);                       // (re)starts the clock
      const got = Math.round(self.shield - before);
      if (got >= 1){
        const first = !this.taught.ward && !!STATUS.ward.tip;
        if (first) this.taught.ward = true;
        this.statusTag(self.x, self.y, "ward", first);
        this.float(self.x, self.y - 44, "+" + got, AFFINITIES.vigil.glow, 22 + got * 0.5);
      }
    }

    /* Healing used to be entirely invisible — a relic quietly got better and
       nothing on screen said so. Now the shell knits and the number is stated. */
    if (self.w.lifesteal){
      const before = self.hp;
      self.hp = Math.min(self.maxHp, self.hp + dmg * self.w.lifesteal);
      const got = Math.round(self.hp - before);
      if (got >= 1){
        self.mend = 1;
        this.float(self.x, self.y - 42, "+" + got, "#8FE3A0", 26 + got * 0.7);
      }
    }

    const kx = foe.x - self.x, ky = foe.y - self.y, kl = Math.hypot(kx, ky) || 1;
    const power = CONFIG.combat.knock * (self.w.knockMul || 1) * (crit ? 1.5 : 1);
    foe.vx += (kx / kl) * power; foe.vy += (ky / kl) * power;

    if (forge){
      const u = self.w.ult, n = forge.n;
      /* CONSUMED — after dmgTakenMul was read, so the blow lands on a
         sundered shell and burns the sunder in the same act. */
      delete foe.status.sunder;
      /* Sent flying. The impulse is over the speed ceiling ON PURPOSE:
         `launch` raises the vmax clamp and the relax term spends the next
         second and a half paying it back, which — from inside the physics —
         is what several high speed bounces off the arena looks like. */
      foe.vx += (kx / kl) * (fatal ? u.launchFatal : u.launch);
      foe.vy += (ky / kl) * (fatal ? u.launchFatal : u.launch);
      foe.launch = Math.max(foe.launch || 0, 1.8);
      self.ultForge = null;
      /* Rick: "even more hit stop ... increase hit stop the more stacks its
         consuming." The generic weight above already priced the blow off its
         damage; this is ON TOP, and it scales with the CONSUME — six stacks
         freeze the hall for over half a second, a one-stack strike barely
         more than a heavy crit. The freeze is the size of the meal, which
         makes the stack count legible with no number on screen. fatal still
         takes killStop via the max. */
      this.hitStop = Math.max(this.hitStop, u.stopBase + u.stopPer * n);
      this.shake = 52;
      this.banner = { text: u.name, life: 2.1, max: 2.1, color: self.aff.core,
                      glow: self.aff.glow, w: self.w.id, bx: foe.x, by: foe.y };
      this.ultFx = { w: self.w.id, kind: "forge", phase: "strike",
                     src: self === this.a ? "a" : "b",
                     tgt: self === this.a ? "b" : "a",
                     x: hx, y: hy, tx: foe.x, ty: foe.y, hit: true, stacks: n,
                     radius: u.radius || 300, aff: self.aff, t: 0, life: 1.7 };
      SFX.play("ult", { w: "grudgebearer-hit" });
      this.note(`${self.w.name} — ${u.name} consumes ${n} Sunder`);
      if (fatal)
        /* The kill does not land here. The match holds its breath while the
           ball flies — checkEnd waits on killFlight, and move() clears it
           at the first wall, where the death actually happens. */
        this.killFlight = { tgt: foe === this.a ? "a" : "b", t: 0 };
    }

    /* DAYBREAK: a landed blow while the radiance burns throws sparks off
       the point of impact. Spawned HERE and only here, so no match without
       a radiant ultimate ever draws differently from the rng. */
    if (mul === undefined && self.ultRadiant && self.w.ult.sparks)
      for (let i = 0; i < self.w.ult.sparks; i++) this.spawnSpark(self, hx, hy);

    this.shake = Math.min(38, this.shake + (crit ? 24 : 10) * (self.w.knockMul || 1));

    /* sparks fly along the blade, not outward from the point */
    const bl = Math.hypot(seg.bx - seg.ax, seg.by - seg.ay) || 1;
    const tx = -(seg.by - seg.ay) / bl * self.spinDir;
    const ty =  (seg.bx - seg.ax) / bl * self.spinDir;
    this.spawnFx(hx, hy, self.aff.glow, crit ? 26 : 13, crit ? 350 : 220,
                 0.5, crit ? 5 : 3.5, tx, ty);
    this.ring(hx, hy, self.aff.core, 4, crit ? 96 : 58, crit ? 0.36 : 0.26, crit ? 6 : 4);
    /* Size tracks damage. A 70-point maul blow and an 8-point rune shard used
       to print the same number at the same size, which flattened the whole
       sense of stakes — the viewer had to read the digits to know which
       mattered. Now the weight of the hit is legible without reading at all. */
    const fsz = clamp(22 + dmg * 0.62, 22, 62) * (crit ? 1.3 : 1);
    this.float(hx, hy, dmg + (crit ? "!" : ""), crit ? "#FFF4D0" : self.aff.glow, fsz);
    SFX.play("hit", { dmg, crit });
    if (crit) this.note(`${self.w.name} crits for ${dmg}`);
  }

  /* ------------------------------------------------------ Daybreak sparks ---
     Simulation objects, not fx: they deal damage and they heal, so they live
     in the tick and are capped like shots. Drift is DETERMINISTIC — a phase
     rolled at spawn against the match clock, no per-frame rng — so a paused
     and resumed render replays identically. */
  spawnSpark(f, x, y){
    if (this.sparks.length >= 48) this.sparks.shift();
    const a = this.rng() * TAU;
    /* born FAST — they scatter clear of the scrum before settling into
       drift, or the foe standing at the impact eats the whole batch and the
       "drift around the arena" Rick asked for never exists. Measured: at
       spawn speed 60-180 the ball sat at 68-76% winrate on splash alone. */
    const sp = 240 + this.rng() * 150;
    this.sparks.push({ own: f === this.a ? "a" : "b", x, y,
                       vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
                       ph: this.rng() * TAU,
                       arm: f.w.ult.sparkGrace || 0.7, justArmed: 0,
                       life: f.w.ult.sparkLife || 8.0 });
  }

  tickSparks(dt){
    if (!this.sparks.length) return;
    const R = CONFIG.physics.ballR, A = CONFIG.arena;
    const lo = this.inset + 8, hiX = A.w - this.inset - 8, hiY = A.h - this.inset - 8;
    for (let i = this.sparks.length - 1; i >= 0; i--){
      const s = this.sparks[i];
      s.life -= dt;
      if (s.life <= 0){ this.sparks.splice(i, 1); continue; }
      /* THE GRACE. A spark is untouchable while it flies clear of the scrum
         — measured before this existed: 95% of sparks died within 0.4s of
         birth, mean life 0.21s, mean live count 0.1. Born INSIDE a melee
         hit, they were eaten before they could exist, and the whole ult
         read as nothing. The grace is what lets the field happen; when it
         ends the spark ARMS with a pop and becomes a thing in the hall. */
      if (s.arm > 0){
        s.arm -= dt;
        if (s.arm <= 0){
          s.justArmed = 0.3;
          this.ring(s.x, s.y, "#FFD98A", 2, 44, 0.28, 3);
          if (this.t - (this._sparkArmT || -1) > 0.1){
            this._sparkArmT = this.t;
            SFX.play("spark", { arm: true });
          }
        }
      }
      if (s.justArmed > 0) s.justArmed -= dt;
      /* the drift: damped, faintly buoyant, wandering on its own phase.
         Light damping while it flies, heavy right after arming — it halts
         into its post like a thing taking position. */
      s.vx += Math.cos(s.ph + this.t * 2.2) * 30 * dt;
      s.vy += (Math.sin(s.ph * 1.7 + this.t * 1.9) * 30 - 9) * dt;
      const damp = 1 - Math.min(1, (s.arm > 0 ? 0.4 : s.justArmed > 0 ? 2.6 : 0.35) * dt);
      s.vx *= damp; s.vy *= damp;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < lo){ s.x = lo; s.vx = Math.abs(s.vx); }
      if (s.x > hiX){ s.x = hiX; s.vx = -Math.abs(s.vx); }
      if (s.y < lo){ s.y = lo; s.vy = Math.abs(s.vy); }
      if (s.y > hiY){ s.y = hiY; s.vy = -Math.abs(s.vy); }

      /* first ball to touch an ARMED spark takes it — owner first,
         deterministically. A spark in grace cannot be taken by anyone. */
      if (s.arm > 0) continue;
      let taken = false;
      for (const key of ["a", "b"]){
        const f = this[key];
        if (!f.alive) continue;
        if (Math.hypot(f.x - s.x, f.y - s.y) > R + 10) continue;
        const owner = this[s.own];
        if (key === s.own){
          /* collected: the light banked as Blessing */
          f.apply("blessing", 1);
          const first = !this.taught.blessing && !!STATUS.blessing.tip;
          if (first) this.taught.blessing = true;
          this.statusTag(f.x, f.y, "blessing", first);
          f.mend = Math.max(f.mend || 0, 0.8);
          this.spawnFx(s.x, s.y, "#FFF6E2", 5, 120, 0.35, 3);
          SFX.play("spark", { collect: true, n: f.stacks("blessing") });
        } else {
          /* burned: the light spent as harm, and a shove — the cloud is a
             soft wall, and this is the wall pushing */
          const dmg = Math.round(this.actMods.dmg *
                                 (owner.w.ult.sparkDmg || 8) * f.dmgTakenMul());
          this.hurt(f, dmg, owner);
          owner.dealt += dmg;
          const dl = Math.hypot(f.x - s.x, f.y - s.y) || 1;
          const kn = owner.w.ult.sparkKnock || 260;
          f.vx += ((f.x - s.x) / dl) * kn; f.vy += ((f.y - s.y) / dl) * kn;
          f.flash = Math.max(f.flash, 0.5);
          this.float(s.x, s.y - 18, dmg, "#FFF6E2", 24);
          this.spawnFx(s.x, s.y, "#FFD98A", 8, 200, 0.4, 3.5);
          SFX.play("spark", { collect: false });
        }
        taken = true;
        break;
      }
      if (taken) this.sparks.splice(i, 1);
    }
  }

  ballCollision(){
    const a = this.a, b = this.b, R = CONFIG.physics.ballR;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    if (d >= R * 2 || d === 0) return;
    const nx = dx / d, ny = dy / d, overlap = R * 2 - d;
    a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2; b.y += ny * overlap / 2;
    const p = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    a.vx -= p * nx; a.vy -= p * ny;
    b.vx += p * nx; b.vy += p * ny;
    this.spawnFx((a.x+b.x)/2, (a.y+b.y)/2, "#FFF4D0", 6, 150, 0.3, 3);
  }

  /* --------------------------------------------------------- ultimates --- */
  tickCharge(f, foe, dt){
    if (!f.alive || this.over) return;
    if (f.ultRadiant){
      /* Daybreak burns down. Unlike the forge there is no return and no
         charge gate: the window IS the payoff, and the next ult is owed
         from the cast like any other. */
      f.ultRadiant.t += dt;
      if (f.ultRadiant.t >= f.ultRadiant.dur) f.ultRadiant = null;
    }
    if (f.ultForge){
      /* The Crucible is lit. The charge does not rebuild while it burns —
         the fifteen seconds are owed from the RESOLUTION, strike or fizzle,
         or a fizzle would quietly cost four seconds less than it says. */
      const F = f.ultForge, u = f.w.ult;
      F.t += dt;
      /* The wheel cannot be stopped. Hitstun and hex would stall the sweep
         past its own cap on seeds where the foe pounds the wielder — measured
         before this line existed: the strike simply never came. An ultimate
         made of rotation that a stun can hold still is a promise the screen
         breaks, so while the forge is lit the stun burns off. */
      f.stun = 0;
      /* The singularity forms. The pull starts as a lean and ends as a
         sentence: by pullRamp seconds it redirects a cruising ball in a
         fraction of a second — "inescapable" without ever touching the foe's
         position directly. It is every knock in the game, run backwards. */
      if (foe.alive){
        const ramp = Math.min(1, F.t / u.pullRamp);
        const dx = f.x - foe.x, dy = f.y - foe.y, dl = Math.hypot(dx, dy) || 1;
        /* Two terms, both on VELOCITY, never on position. The acceleration is
           the lean — every knock in the game, run backwards. On its own it
           slingshots: measured on seed 202, the foe oscillated 620->168->322
           for four full seconds and the sweep never crossed it. A black hole
           does not oscillate its accretion, it CAPTURES it — so the second
           term bends the foe's velocity toward the infall line at a rate
           that ramps with the same clock, preserving speed. The foe spirals
           in, ballCollision holds it at contact, and the wheel gets it. */
        const acc = u.pullBase + (u.pullMax - u.pullBase) * ramp * ramp;
        foe.vx += (dx / dl) * acc * dt; foe.vy += (dy / dl) * acc * dt;
        const bl = 1 - Math.exp(-ramp * u.pullBlend * dt);
        const sp = Math.hypot(foe.vx, foe.vy);
        foe.vx += ((dx / dl) * sp - foe.vx) * bl;
        foe.vy += ((dy / dl) * sp - foe.vy) * bl;
      }
      if (F.t >= u.cap){
        /* Nothing connected. The forge gutters out and the stacks are KEPT —
           a whiffed Crucible punishes the wielder, not the foe. */
        f.ultForge = null;
        this.ultFx = { w: f.w.id, kind: "forge", phase: "fizzle",
                       src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                       x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: false,
                       radius: u.radius || 300, aff: f.aff, t: 0, life: 0.9 };
        SFX.play("ult", { w: "grudgebearer-fizzle" });
        this.note(`${f.w.name} — the Crucible gutters out`);
      }
      return;
    }
    f.charge += dt;
    if (f.charge >= f.w.ult.charge){ f.charge = 0; this.fireUlt(f, foe); }
  }

  fireUlt(f, foe){
    const u = f.w.ult;
    f.ultsFired++;
    /* The subtitle is gone. Rick: "we shouldn't have to tell the user that
       they are happening or what they do with text." The set-piece in
       drawUltUnder/drawUltOver is now the explanation, which is the higher
       form of rule 1 — the mechanic and its explanation still ship together,
       the explanation just stopped being a caption. The name stays, because a
       name is characterisation, not instruction; and `ult.tip` stays on the
       data (and on the intro card), because that is teaching *before*. */
    /* `w` is what tells the renderer which arrival to play. A seal has no
       relic, so it keeps the plain treatment. */
    /* Anchored to the set-piece's own centre, not to the top of the hall.
       Three of the six bloom on the quarry (the pillar falls on them, the vines
       wrap them, the cage closes on them) and three bloom on the caster (the
       fang ring, the fissures, the grave). The name goes where the thing is. */
    /* Dawnbringer left this map with Judgement: the pillar fell on the
       quarry, but Daybreak ignites on the CASTER, so its name goes there. */
    const onTarget = { thornwake:1, spellbreaker:1 }[f.w.id];
    this.banner = { text: u.name, life: 2.1, max: 2.1, color: f.aff.core,
                    glow: f.aff.glow, w: f.w.id,
                    bx: onTarget ? foe.x : f.x, by: onTarget ? foe.y : f.y };
    this.note(`${f.w.name} — ${u.name}`);
    this.shake = 32;   // Mountainfall's 52 moved to the Crucible's strike
    this.hitStop = Math.max(this.hitStop, 0.08);
    this.beat({ kind: "ult", side: f === this.a ? 0 : 1, x: f.x, y: f.y,
                w: f.w.id, foeHpFrac: foe.hp / foe.maxHp });   // CINEMA (demo)
    SFX.play("ult", { w: f.w.id });

    const dist = Math.hypot(foe.x - f.x, foe.y - f.y);
    const inRange = u.radius ? dist <= u.radius : true;

    /* The set-piece. Presentation only: nothing in the simulation reads it,
       and it is advanced by the decay paths so it keeps playing through the
       hit stop the cast itself caused. */
    this.ultFx = {
      w: f.w.id, kind: u.kind, src: f === this.a ? "a" : "b",
      tgt: f === this.a ? "b" : "a",
      x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: inRange,
      radius: u.radius || 300, aff: f.aff, t: 0,
      life: { dawnbringer: 1.6, widowmaker: 1.3, grudgebearer: 1.7,
              thornwake: 2.4, gravemourn: 1.6, spellbreaker: 1.4,
              /* The four new greatswords. Rootfast is long because it is a
                 FREEZE and the art has to still be on screen while the hold
                 it is explaining is in force — Bramblesnare is 2.4 for the
                 same reason. The other three are strikes and end. */
              oathwound: 1.5, heartwood: 2.2, nightfell: 1.4,
              axiom: 1.5,
              /* The last six. Reprisal is the outlier and it is not a strike:
                 an aimedshot holds a DRAW until the bow's facing comes round,
                 so its art has to still be on screen when the arrow finally
                 leaves. The rest end. */
              ironhail: 1.3, lightkeeper: 1.5, farwarden: 2.6,
              aureole: 1.6, censer: 1.6,
              emberedge: 1.5 }[f.w.id] || 1.5,
    };

    /* An aimed shot does not resolve in this frame -- it starts a DRAW, and
       tickFire releases it. Everything below this point (the pull, the
       knock, the freeze, the heal, the damage) is skipped, because an
       ultimate that had already dealt its damage before the arrow left
       would make the arrow decorative. */
    if (u.kind === "aimedshot"){
      /* THE BOW DOES NOT AIM. IT SPINS FASTER UNTIL IT IS RIGHT.

         Rick: "the ball gains massive weapon rotation speed until the bow
         is pointed at the enemy and then fires. after firing the rotation
         speed returns to normal."

         This is the version that ships, and it replaces a worse one. The
         first build solved a launch angle inside fireUlt and then stood
         there for 0.75s -- the aiming was a number nobody could see, and
         the wind-up was a delay pretending to be a mechanic.

         Under this, the ultimate breaks NO RULE the basic shot lives
         under. The bow still discharges along f.theta. There is no
         steering, no snapping, no homing, and nothing is ever rotated to
         a target. All that changes is that the weapon spins several times
         faster and waits for its own facing to come round -- so the aim is
         a thing the viewer WATCHES HAPPEN rather than a thing the maths
         did offscreen. It is also self-announcing: a weapon spinning at
         three and a half times its own rate with the string at full draw
         cannot be mistaken for anything else in this game.

         `minT` is the only arbitrary number and it is a legibility floor,
         not a mechanic: without it the bow fires on whatever crossing
         happens first and the wind-up can be over in a tenth of a second.
         The string reaches full draw exactly as the bow becomes able to
         fire, so the two clocks say the same thing. */
      f.ultDraw = { t: 0, minT: u.draw || 0.55, cap: (u.draw || 0.55) + 1.1 };
      /* No banner yet. The name goes where the arrow LANDS, and nothing
         knows where that is until the bow comes round. Rick asked for the
         word on the landing point; loose() puts it there. */
      this.banner = null;
      return;
    }

    /* DAYBREAK RESOLVES NOTHING HERE EITHER — and unlike every ultimate
       before it, it never will: no damage, no heal, no status on the cast.
       The old Judgement was a 34-hp subsidy measured at +9 to +32pp in every
       matchup, paid for with the weakest blade in the class. This is that
       budget, moved onto the FIGHT: for `dur` seconds every landed hit
       sprays sparks, and what the sparks do depends on who touches them. */
    if (u.kind === "radiant"){
      f.ultRadiant = { t: 0, dur: u.dur || 5.0 };
      this.ultFx = { w: f.w.id, kind: "radiant",
                     src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: true,
                     radius: 300, aff: f.aff, t: 0, life: (u.dur || 5.0) + 0.3 };
      return;
    }

    /* THE CRUCIBLE DOES NOT RESOLVE HERE. It lights. The ball glows with the
       fires the hammer was forged in, the hammer becomes a wheel, and the
       foe is drawn in — the payoff is a MELEE CONNECT under the same rules
       every swing lives under: tickHits finds it, resolveHit prices it.
       Everything below this block is skipped for the same reason the aimed
       shot skips it: an ultimate that had already paid out before the
       hammer landed would make the hammer decorative. */
    if (u.kind === "forge"){
      f.ultForge = { t: 0, minT: u.minT || 1.0, cap: u.cap || 4.0 };
      this.ultFx = { w: f.w.id, kind: "forge", phase: "wind",
                     src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: true,
                     radius: u.radius || 300, aff: f.aff, t: 0,
                     life: (u.cap || 4.0) + 0.4 };
      /* No banner yet. The name goes on the strike, where the bow already
         put its own — you do not caption a promise. */
      this.banner = null;
      return;
    }

    /* Every bolt is a real projectile: clankable, travelling, missable.
       An ultimate that cheated the rules its own weapon lives under would
       teach the viewer that the rules are decorative. */
    if (u.kind === "volley" && f.w.shot){
      const N = u.shots || 12, span = u.spread || TAU;
      for (let i = 0; i < N; i++)
        this.spawnShot(f, f.theta + (i / N) * span - (span >= TAU ? 0 : span/2));
    }
    if (u.kind === "pull"){
      const dx = f.x - foe.x, dy = f.y - foe.y, dl = Math.hypot(dx,dy) || 1;
      foe.vx += (dx/dl) * 620; foe.vy += (dy/dl) * 620;
    }
    if (u.knock && inRange){
      const dx = foe.x - f.x, dy = foe.y - f.y, dl = Math.hypot(dx,dy) || 1;
      foe.vx += (dx/dl) * u.knock; foe.vy += (dy/dl) * u.knock;
    }
