<title>Super Weapon Ball: The Sundered Crown</title>
<style>
  :root{
    --bg:#0A0810; --panel:#14111E; --line:#2C2438;
    --ink:#EDE3D0; --dim:#8B7F94; --gold:#C9A227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #24192E 0%, #0A0810 55%),
      #0A0810;
    color:var(--ink); font-family:'Atkinson Hyperlegible Next',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:14px; padding:18px 12px 44px;
  }
  h1{
    font-size:19px; letter-spacing:.30em; text-transform:uppercase; font-weight:700;
    color:var(--gold); text-align:center; text-shadow:0 0 26px #C9A22755;
  }
  h1 small{
    display:block; letter-spacing:.20em; font-size:9px; color:var(--dim);
    margin-top:6px; font-weight:400; font-family:'Atkinson Hyperlegible Next',sans-serif;
  }
  #stage{
    width:min(430px,96vw); aspect-ratio:9/16; border-radius:6px; overflow:hidden;
    border:1px solid #3A2E22; background:#07050C;
    box-shadow:0 26px 80px -20px #000, 0 0 0 1px #C9A22722 inset, 0 0 60px -30px #C9A22766;
  }
  canvas{width:100%;height:100%;display:block}
  .panel{
    width:min(430px,96vw); background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:13px; display:flex; flex-direction:column; gap:10px;
  }
  .row{display:flex;gap:8px;align-items:center}
  .row > label{
    font-size:9px; letter-spacing:.20em; text-transform:uppercase; color:var(--dim);
    width:52px; flex:none; font-weight:700; font-family:'Atkinson Hyperlegible Next',sans-serif;
  }
  select{
    flex:1; background:#1D1828; color:var(--ink); border:1px solid var(--line);
    border-radius:4px; padding:9px 10px; font-size:13px; font-family:inherit;
  }
  .btns{display:flex;gap:8px}
  button{
    flex:1; background:#241D33; color:var(--ink); border:1px solid #3E3350; border-radius:4px;
    padding:11px 8px; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    font-family:'Atkinson Hyperlegible Next',sans-serif; cursor:pointer; transition:.15s;
  }
  button:hover{background:#31284a;border-color:#5b4a78}
  button.pri{
    background:linear-gradient(180deg,#C9A227,#8A6D12); border-color:#E8C65A; color:#1A1206;
  }
  button.pri:hover{filter:brightness(1.15)}
  button.off{opacity:.45}
  #log{
    width:min(430px,96vw); font-size:11px; color:var(--dim); line-height:1.7;
    font-family:'Atkinson Hyperlegible Mono',monospace; max-height:150px; overflow:auto;
    border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#100D18;
  }
  #log b{color:var(--gold);font-weight:700}
</style>
</head>
<body>

<h1>Super Weapon Ball<small>The Sundered Crown · one arena · no survivors</small></h1>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>

<div class="panel">
  <div class="row"><label>Champion</label><select id="selA"></select></div>
  <div class="row"><label>Rival</label><select id="selB"></select></div>
  <div class="btns">
    <button class="pri" id="btnFight">Fight</button>
    <button id="btnRandom">Random</button>
    <button id="btnSpeed">1&times;</button>
    <button id="btnMute">Sound</button>
    <button id="btnIntro">Intro card</button>
    <button id="btnScrunch">Scrunch</button>
  </div>
</div>
<div id="log"></div>

<script>
"use strict";
/* ============================================================================
   THE SUNDERED CROWN
   A spectator brawler. Two enchanted relics, one arena, no input.

   Layers, strictly separated:
     CONFIG / AFFINITIES / STATUS / WEAPONS   pure data — all tuning lives here
     SHAPES                                   procedural weapon art (local space)
     Sfx                                      procedural Web Audio, no samples
     Fighter / Match                          simulation; knows nothing of drawing
     Renderer                                 draws a Match; holds no game state
     Shell                                    UI wiring

   Randomness: every match draws a fresh seed, so outcomes are a true coin flip.
   The seed is recorded so any match can be replayed exactly.
   ========================================================================= */

/* ---------------------------------------------------------------- CONFIG -- */
const CONFIG = {
  /* 740 -> 800. The arena is width-bound on screen — its rendered height is
     just `h/w × frame width` — so the 150px the HUD gave back in v3 could not
     become more arena and pooled as margin instead. Taking the hall taller in
     *sim* units is the only way to spend it. Physics change: more floor means
     less contact per second, so it forces a retune. */
  arena:   { w: 520, h: 800 },
  /* No seek. An invisible steering force toward the opponent makes the balls
     look like they are breaking their own rules; the viewer cannot see it, so
     it reads as the physics lying. Contact is bought with visible things
     instead — a small arena and the collapsing walls.
     Speed is real: `relax` is how fast a ball coasts back to `cruise` after
     being launched, so a hard hit visibly throws it. Direction is never
     touched by the relaxation, so bounces stay predictable. */
  /* `gravity` and `heightVary` are a pair and should be read together.

     Before them the hall had no up and no down: walls reflected perfectly and
     speed relaxed to a flat `cruise`, so nothing could ever accelerate. Rick
     named it exactly — "they float around like the DVD screen saver."

     `gravity` alone does not fix that. It curves the paths, and then the relax
     term drags |v| straight back to cruise, so the arcs happen at constant
     speed and still read as floaty. `heightVary` is the half that sells it:
     the relax target becomes the speed a body of conserved energy carries at
     that height, so a fall speeds the ball up and a climb slows it down. Mean
     speed over a match is still cruise, so the pace survives.

     It also pays for the framing. Gravity on its own parks the fight on the
     floor — 83% of the time in the lower half at this strength — and this hall
     is 800 tall for a reason. The height coupling puts it back to 71%, because
     a slower ball high up spends longer up there. Both numbers measured; the
     sweep is in sundered-crown-gravity.md.

     `massWeight` is deliberately not physics. A real field is mass-independent;
     this one lets Grudgebearer's 5.0 fall harder than Spellbreaker's 1.0,
     because the roster already spends that spread on clanks and free
     characterisation is worth taking. `massRef` is the current roster mean —
     if the roster grows, re-derive it or every existing relic's fall rate
     shifts underneath you. */
  physics: { dt: 1/120, cruise: 405, ballR: 34, bounceJitter: 0.11,
             relax: 0.62, speedMin: 250, speedMax: 1300,
             gravity: 900, heightVary: 1.0, floorBounce: 0.97,
             massWeight: 0.5, massRef: 2.68 },

  /* Angular chain model. The head is always going round the pivot; the spring
     only adds lag on the way and whip on the way out. `extend` is how quickly
     it flies out under speed and droops when slow. */
  /* `hilt` is the rigid haft, as a fraction of total reach. The chain hangs
     from the *end of the haft*, not from the middle of the relic — which is
     what a flail actually is, and what makes the head sweep around the handle
     instead of orbiting the ball. Total reach is unchanged: hilt + chain.
     0.58 rather than a handsomer 0.36 because reach is measured from the ball
     *centre* and the ball radius is 34 of the 96 — a 0.36 haft ends barely
     outside the shell and is invisible. Only 62 units of reach are ever on
     screen, and the handle has to be a real share of that. */
  /* `sag` is gravity on the flail head — pendulum torque about the haft tip.
     It does not answer the open flail question, which is proportion and not
     motion, but a chain that hangs when slack and lags when swung is most of
     what reads as a flail. */
  /* 0.66 -> 0.46. Rick, after gravity landed: "the problem wasn't the flail it
     was the environment it existed in." Total reach is unchanged at 96 — this
     only moves the split between the rigid haft and the hanging chain, so the
     assembly is no bigger, it just finally reads as a chain rather than as a
     head bolted to a stick. Physics change even so: the hit segment comes from
     headX/headY, which the pivot moves. */
  chain: { follow: 5.2, spring: 26, damp: 0.9955, extend: 7.0, maxAngVel: 15,
           hilt: 0.46, sag: 1.1 },
  combat:  { hitCd: 0.45, knock: 165, baseHP: 300 },

  /* Projectiles. `pad` is the extra slack on the blade-vs-shot test, and
     it is deliberately larger than the clank pad of 3: a shot is small and
     fast, and a parry that only just fails reads as a bug rather than as a
     near miss. Erring toward "the blade got it" protects melee's defence,
     which is the whole reason projectiles are clankable.
     `maxLive` is a hard ceiling on objects in flight — a runaway cadence
     should degrade the picture, never the frame budget. */
  shot: { pad: 4, maxLive: 64 },
  chaos:   { critChance: 0.09, critMul: 2.1, dmgJitter: 0.30, spawnSpread: 1.1 },

  /* Hit stop: the whole sim freezes for a few frames on impact. This is the
     single biggest contributor to hits feeling like they have weight. */
  impact: {
    stopBase: 0.045, stopPerDmg: 0.0022, stopMax: 0.13, critStopMul: 1.7,
    stunBase: 0.10,  stunPerDmg: 0.0035, stunMax: 0.26,
    stunDR: 0.55,    stunDRDecay: 0.75,   // diminishing returns on repeat hitstun
    killStop: 0.55,                       // cinematic freeze on the killing blow
  },

  /* Clank: weapon meets weapon. Both rebound and reverse; the heavier relic
     wins the exchange and eats less of the stagger. */
  clank: {
    cd: 0.22, stop: 0.15, stun: 0.34, knock: 240, shake: 30, pad: 3,
    /* Fatigue: repeated binds push each other apart harder and re-arm slower,
       so two similar-mass relics cannot lock each other out of the match. */
    cdGrowth: 0.55, knockGrowth: 0.45, stunFalloff: 0.38,
    streakDecay: 0.45, maxStreak: 6,
  },

  /* The name of a seal tells a first-time viewer nothing, exactly the way the
     name of an ultimate tells them nothing. Both now ship with the line that
     says what just changed about the fight. */
  acts: [
    { t: 0,  name: null,           sub: null,                            dmg: 1.00, spin: 1.00, reach: 1.00 },
    { t: 15, name: "SECOND SEAL",  sub: "The hall closes · +35% damage",  dmg: 1.35, spin: 1.20, reach: 1.10 },
    { t: 35, name: "THIRD SEAL",   sub: "+85% damage · +42% swing speed", dmg: 1.85, spin: 1.42, reach: 1.20 },
  ],
  /* Starts on the Second Seal, not at an arbitrary clock time: the seal breaks
     and the hall begins to close. With seek gone this is what buys contact,
     and unlike a steering force the viewer can see it happening.

     Rate and inset were softened (8 -> 4.2, 170 -> 140) because the hall was
     shutting so fast that the last third of a match was two balls trapped in a
     corridor 2.6 ball-diameters wide. Matches get longer; that was the
     accepted trade. Physics change, so it forces a retune.

     Softening it cost contact, and the thinnest pairing (Grudgebearer vs
     Gravemourn) fell under the six-hit floor. Paid for by starting the
     collapse earlier rather than by making it faster again — which meant
     moving the Second Seal to t=15, because the walls must keep moving *when
     the seal breaks*. A wall that starts closing at an unexplained clock time
     is exactly the invisible correction this project deleted `seek` over. */
  collapse: { startT: 15, rate: 4.2, maxInset: 140 },
  desperation: { at: 0.25, dmg: 1.35, spin: 1.30 },
  timeout: 80,

  /* The intro card. This project lives or dies on whether a viewer understands
     what the two weapons DO in the first few seconds, and the mechanics are now
     far too rich to infer from watching. 4s total: the cards clash at
     `clash`, the tape reads in the hold, and the last `reveal` seconds lift
     the scrim off the hall instead of cutting.
     `introT` defaults to 0 on a Match, so simulate(), batch() and the tuner are
     never affected — only the presentation layers switch it on. */
  intro: { dur: 4.0, clash: 0.46, reveal: 0.50 },
  /* THE SCRUNCH. `k` 0.65 was chosen from a sheet at three levels: 0.75 leaves
     only 396px of panel and forces the stats to 0.61 scale (cramped), 0.55
     gives the panel everything but the relics get small. 0.65 is 558px of
     panel with the stats near full size and a hall that is still easy to
     follow. `bottom` is the last row clear of the platform's caption zone --
     the delivered frame maps game y to output y*0.7875 + 96, and TikTok's
     furniture starts around output 1530. */
  scrunch: { on: true, k: 0.7, ease: 0.42, intro: 3.0,
             resultDelay: 1.05, gap: 22, bottom: 1812 },

  /* The bed. Not music — a synthesised presence layer, and it exists for a
     measured reason: with impacts over literal silence the mix rendered at
     -33 LUFS integrated against a ~-14 platform target, and closing that gap
     with limiting would have flattened the very transients that make hit stop
     read as weight. A continuous floor raises the integrated level without
     touching the peaks.
     It also does legibility work: the drone steps up in level and pitch at
     each seal, so the three-act structure is audible as well as visible.
     `gain` is the one knob — everything else is relative to it. */
  audio: {
    gain: 1.60,         // master trim for the whole score; lands near -19.8 LUFS
    root: 55,           // A1, the tonic
    step: 0.26,         // level growth per seal
    bpm: 76,            // base tempo; each seal pushes it
    bpmStep: 0.13,      // tempo growth per seal
    air: 0.0,           // filtered-noise floor. 0 = off; see Sfx.bed for why
    airCut: 90,         // Hz, lowpass — keep it under ~110 or it reads as a fan

    /* Bus glue. The bed alone cannot reach platform loudness without drowning
       the fight — measured: at bed gain 2.2 the drone already peaks louder
       than the impacts. So the rest of the gap is closed here, deliberately
       and in a stated amount, rather than by cranking the drone.
       Moderate ratio, slow-ish attack so the initial transient of a hit gets
       through before the gain reduction arrives. */
    comp: { threshold: -26, ratio: 3.2, attack: 0.012, release: 0.28, makeup: 2.6 },
  },
};

/* ------------------------------------------------------------ AFFINITIES -- */
/* High fantasy schools of enchantment. `steel` is the metal of the weapon art,
   `core` the affinity accent, `glow` the emissive highlight. */
/* ---------------------------------------------------------------- HEALTH ---
   QUARTERS. The scale is four chunks of 75 HP with real gaps between them, on
   the shell and on the lifeline both, because a count is the most robust thing
   a viewer can be asked for at phone size: "two chunks left" needs no scale,
   no reference and no estimate, and it survives motion blur, a thumbnail and
   peripheral vision. It also turns a continuous trend into EVENTS -- three per
   relic per fight, each one a beat -- which is a retention instrument as much
   as a legibility one. The last boundary is 0.25, which is
   CONFIG.desperation.at: the third chunk breaking is the frame the simulation
   actually changes gear, so the countable thing and the real thing coincide.

   Indexed by the chunk the head is IN, 0 = last quarter. Stages step in VALUE
   and BEHAVIOUR, never in hue -- every hue in this game already means an
   affinity (gold is the ult charge, green verdant, purple umbral, rose vigil),
   so a health scale that changed colour would claim to say something it does
   not. A value ramp is legible in monochrome, at thumbnail scale and to a
   colour-blind viewer, which is three properties a hue ramp does not have.

   `puls` is rad/s of an alpha wobble, and it is zero for the three healthy
   chunks on purpose: a readout that is always moving has no way to say now. */
const HEALTH_CHUNKS = [
  { lo: "#C4300C", hi: "#FFA24A", puls: 6.5 },   // last quarter = desperation
  { lo: "#9E1410", hi: "#FF6A34", puls: 0   },
  { lo: "#7E1012", hi: "#E0341E", puls: 0   },
  { lo: "#6E0C10", hi: "#C8221A", puls: 0   },   // full
];
/* Below this the last chunk is a sliver and "one hit from dead" deserves its
   own read, so BRINK overrides the chunk colour and doubles the pulse rate.
   A behaviour overlay rather than a fifth chunk -- the count stays four. */
const BRINK = { at: 0.10, lo: "#FF9A5A", hi: "#FFF4D0", puls: 13.0 };

/* The lifeline. `mode` is "mirror" -- two heads meeting at a marked centre,
   each head's distance from its own end being that relic's ABSOLUTE life --
   or "ratio", a single divider whose position is the share of the remaining
   life each relic holds. Mirror is the default because ratio cannot tell
   300v300 from 6v6, and "how close is the end" is the retention question.
   `pct` prints the percentage; `num` prints raw HP and stays off, because
   whether the build should state the score in HP is still an open decision. */
/* The ult block. `tip` is the `ult.tip` reminder in the last five seconds --
   the only text this HUD carries, and it is the same single source the intro
   card teaches from, so the two can never drift. */
const ULTBAR = { tip: true };

/* WHERE THE BAND LIVES. "top" or "bottom", and it is a live flag rather than a
   build option so the two can be A/B'd in one artifact.

   The argument for the top is not aesthetic: a Short is played inside platform
   chrome that occupies the BOTTOM of the screen -- caption, channel handle,
   the like/comment/share column on the right, and the scrub bar. Anything put
   down there is competing for pixels the app will draw over. The top strip is
   the one part of a vertical video the platform mostly leaves alone. */
const BAND = { pos: "top" };
/* VERTICAL-VIDEO SAFE FRAMING. `foot` is design-space pixels reserved at the
   BOTTOM of the 1080x1920 frame, below the arena, for the platform to draw its
   own caption, handle and music bar over. TikTok and Shorts both occupy
   roughly the bottom 15-20%; 340 is 17.7%.

   IT SHIPS AT ZERO. 340 was an over-correction and Rick rejected it twice:
   "the last few videos have been poorly cropped ... missing a lot of the
   bottom of the frame", and then again after the reserve existed, "the video
   still has the bottom of the frame cut off. why can we not stretch this to
   the full length?"

   Measured, on the same frame:

     foot    hall      runs        ink rows    fills   side margin
        0    1056x1625  176..1801    9..1847     96%    12px
      120    1048x1612  176..1788    9..1834     95%    16px
      340     905x1392  176..1568    9..1614     84%    88px

   The reserve cost twelve points of frame and 76px a side to protect the
   bottom sixth from a caption -- and the caption claim was an INFERENCE from
   an earlier session, never something Rick said. He has now twice said the
   opposite. The encode fix that came with it was right and stands: the
   79% letterbox is gone and the delivery is scale=1080:1920.

   The knob stays, with its cost measured, because the next platform may want
   it. The value is 0.

   ZERO IS AN EXACT IDENTITY, not an approximation of one -- at foot 0 the
   available height is 1744, 1744/800 = 2.18 is looser than 1056/520 = 2.031,
   the WIDTH binds exactly as it always did, and all four layout numbers come
   out at their old values. That is the negative control frame_probe.py runs,
   and it is why this constant can be dialled to nothing without a second code
   path existing to be wrong. */
const FRAME = { foot: 0 };

const TUG = { on: true, mode: "mirror", pct: true, num: false, h: 56 };

/* ------------------------------------------------------------- ULT SIGILS ---
   RULE 9: one generic thing for N relics is a mistake this build has already
   made three times -- one ultimate burst, one ultimate sound, and nearly one
   banner animation. So this is a table keyed on the WEAPON ID, not on
   `ult.kind`: Eclipse, Exsanguinate, Bulwark and Consecration are all
   `kind:"nova"` and a viewer must never be shown the same picture for them.

   Each routine draws in UNIT SPACE -- the caller has already translated to the
   sigil centre and scaled so 1 = the sigil radius -- and is handed (t, cf, P):
   the presentation clock, the charge fraction 0..1, and the relic's palette.
   Charge is pure wall time (`f.charge += dt`, fires at `ult.charge`), so cf is
   a clock and every sigil uses it as one: the glyph ASSEMBLES as the ultimate
   approaches and is complete at the moment it goes off. That is the anticipation
   beat -- the viewer can see it coming, which is worth more to a fight than
   anything the glyph could say after the fact. */
const SG = {
  a(c, v){ c.globalAlpha = Math.max(0, Math.min(1, v)); },
  ring(c, x, y, r, col, w, al){ SG.a(c, al ?? 1); c.strokeStyle = col;
    c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); SG.a(c, 1); },
  arc(c, x, y, r, a0, a1, col, w, al){ SG.a(c, al ?? 1); c.strokeStyle = col;
    c.lineWidth = w; c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); SG.a(c, 1); },
  disc(c, x, y, r, col, al){ SG.a(c, al ?? 1); c.fillStyle = col;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); SG.a(c, 1); },
  poly(c, pts, col, al, close){ SG.a(c, al ?? 1); c.fillStyle = col;
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    if (close !== false) c.closePath(); c.fill(); SG.a(c, 1); },
  path(c, pts, col, w, al){ SG.a(c, al ?? 1); c.strokeStyle = col; c.lineWidth = w;
    c.lineJoin = "round"; c.lineCap = "round";
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke(); SG.a(c, 1); },
  /* a four-point shard, the shape the Daybreak sparks already use in the hall */
  shard(c, x, y, r, rot, col, al){
    SG.a(c, al ?? 1); c.fillStyle = col;
    c.save(); c.translate(x, y); c.rotate(rot);
    for (const k of [0, Math.PI / 2]){
      c.save(); c.rotate(k); c.beginPath();
      c.moveTo(0, -r); c.lineTo(r * 0.34, 0); c.lineTo(0, r); c.lineTo(-r * 0.34, 0);
      c.closePath(); c.fill(); c.restore();
    }
    c.restore(); SG.a(c, 1);
  },
  spokes(c, n, r0, r1, phase, col, w, al){
    SG.a(c, al ?? 1); c.strokeStyle = col; c.lineWidth = w; c.lineCap = "round";
    for (let i = 0; i < n; i++){
      const a = phase + i * TAU / n;
      c.beginPath();
      c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
    }
    SG.a(c, 1);
  },
};

const ULTSIG = {
  /* DAYBREAK -- the sun comes up. Rays turn, the disc rises with the charge,
     and four shards orbit because a spark field IS the mechanic. */
  dawnbringer(c, t, cf, P){
    const rise = 0.42 - cf * 0.46;
    SG.spokes(c, 12, 0.52, 0.96 + Math.sin(t * 2) * 0.04, t * 0.34, P.glow, 0.07, 0.34 + cf * 0.5);
    c.save(); c.beginPath(); c.rect(-1.1, -1.1, 2.2, 1.1 + rise); c.clip();
    SG.disc(c, 0, rise, 0.44, P.core, 0.55 + cf * 0.45);
    c.restore();
    SG.path(c, [[-0.86, rise], [0.86, rise]], P.glow, 0.075, 0.9);
    for (let i = 0; i < 4; i++){
      const a = t * 1.5 + i * TAU / 4;
      SG.shard(c, Math.cos(a) * 0.74, rise - 0.34 + Math.sin(a) * 0.26,
               0.1 * (0.35 + cf), t * 2 + i, P.glow, 0.35 + cf * 0.6);
    }
  },
  /* EXSANGUINATE -- a drop, and a ring drawn INTO it. The twinblade's two
     strokes cross behind. */
  widowmaker(c, t, cf, P){
    SG.path(c, [[-0.78, -0.78], [0.78, 0.78]], P.steel, 0.06, 0.3);
    SG.path(c, [[0.78, -0.78], [-0.78, 0.78]], P.steel, 0.06, 0.3);
    SG.ring(c, 0, 0, 0.92 - cf * 0.42, P.core, 0.06 + cf * 0.05, 0.35 + cf * 0.55);
    const s = 0.5 + cf * 0.22;
    SG.poly(c, [[0, -0.92 * s / 0.5 * 0.5], [0.44 * s / 0.5 * 0.5, 0.18],
                [0, 0.5 * s / 0.5 * 0.5], [-0.44 * s / 0.5 * 0.5, 0.18]],
            P.core, 0.55 + cf * 0.45);
    SG.disc(c, -0.1 * s, 0.06, 0.09 * s, P.glow, 0.5 + cf * 0.4);
  },
  /* CRUCIBLE -- the bowl, the heat, and four chevrons pointing IN, because
     the ultimate's first act is a pull. */
  grudgebearer(c, t, cf, P){
    SG.path(c, [[-0.6, -0.34], [-0.42, 0.5], [0.42, 0.5], [0.6, -0.34]], P.core, 0.1, 0.85);
    SG.path(c, [[-0.7, -0.34], [0.7, -0.34]], P.glow, 0.09, 0.9);
    for (let i = 0; i < 3; i++){
      const x = -0.32 + i * 0.32, w = Math.sin(t * 3 + i) * 0.09;
      SG.path(c, [[x, -0.44], [x + w, -0.62], [x - w, -0.8]], P.glow, 0.06, 0.3 + cf * 0.6);
    }
    for (let i = 0; i < 4; i++){
      const a = i * TAU / 4 + Math.PI / 4, d = 1.02 - cf * 0.34;
      c.save(); c.translate(Math.cos(a) * d, Math.sin(a) * d); c.rotate(a);
      SG.path(c, [[0.14, -0.16], [-0.06, 0], [0.14, 0.16]], P.glow, 0.07, 0.3 + cf * 0.6);
      c.restore();
    }
  },
  /* BRAMBLESNARE -- a thorn ring that CLOSES as the charge fills. */
  thornwake(c, t, cf, P){
    const r = 0.92 - cf * 0.3;
    SG.ring(c, 0, 0, r, P.core, 0.07, 0.85);
    for (let i = 0; i < 9; i++){
      const a = i * TAU / 9 + t * 0.22;
      const ix = Math.cos(a) * r, iy = Math.sin(a) * r;
      const l = 0.2 + cf * 0.12;
      SG.poly(c, [[ix, iy],
                  [ix - Math.cos(a - 0.34) * l, iy - Math.sin(a - 0.34) * l],
                  [ix - Math.cos(a + 0.16) * l * 0.5, iy - Math.sin(a + 0.16) * l * 0.5]],
              P.glow, 0.55 + cf * 0.4);
    }
    SG.disc(c, 0, 0, 0.1 + cf * 0.1, P.glow, 0.4 + cf * 0.5);
  },

  /* THE HARROWING -- twelve blades, held, then thrown. Added by
     lastlight_build.py's relic; the sigil table is keyed on weapon id and this
     builder EXITS if any relic lacks one, which is how the eighteenth relic
     announced itself here rather than shipping a blank ult block.

     The glyph is the cast frozen one instant before it happens: twelve little
     scythes on a ring, hafts pointing back at the centre they came from,
     sliding OUT and brightening as the charge fills, and the core emptying as
     they go. THE COUNT IS THE COUNT -- `u.scythes` is 12 and so is this, so a
     viewer who counts the glyph and then counts the spray gets the same
     number. Same discipline as Slagburst's cracks equalling its shards. */
  lastlight(c, t, cf, P){
    const N = 12;
    const d = 0.30 + cf * 0.56;                  // how far out they have got
    SG.ring(c, 0, 0, 0.96, P.core, 0.05, 0.14 + cf * 0.26);
    for (let i = 0; i < N; i++){
      const a = i * TAU / N + t * 0.18;
      c.save();
      c.translate(Math.cos(a) * d, Math.sin(a) * d);
      c.rotate(a);
      SG.path(c, [[-0.21, 0.02], [0.01, 0.0]], P.core, 0.045, 0.30 + cf * 0.55);
      SG.arc(c, 0.05, -0.055, 0.105, -1.15, 1.85, P.glow, 0.048, 0.42 + cf * 0.58);
      c.restore();
    }
    SG.disc(c, 0, 0, 0.17 - cf * 0.11, P.glow, 0.32 + cf * 0.4);
  },
  /* DIRGE -- a spiral wound inward, and the bell it is sung from. */
  gravemourn(c, t, cf, P){
    const pts = [];
    for (let i = 0; i <= 68; i++){
      const u = i / 68, a = t * 0.7 + u * TAU * 2.1, r = 0.96 * (1 - u * (0.55 + cf * 0.4));
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    SG.path(c, pts, P.core, 0.065, 0.4 + cf * 0.5);
    SG.path(c, [[-0.3, 0.34], [-0.22, -0.2], [0.22, -0.2], [0.3, 0.34]], P.glow, 0.08, 0.85);
    SG.disc(c, 0, 0.44, 0.09, P.glow, 0.6 + cf * 0.4);
  },
  /* IRONBLOOM -- a bud clamped shut that OPENS with the charge, shrapnel
     already loose around it. */
  slagheart(c, t, cf, P){
    for (let i = 0; i < 3; i++){
      const a = -Math.PI / 2 + i * TAU / 3;
      c.save(); c.rotate(a + cf * 0.5);
      SG.poly(c, [[0, 0.1], [0.34 + cf * 0.16, -0.3 - cf * 0.3], [0, -0.66 - cf * 0.3],
                  [-0.34 - cf * 0.16, -0.3 - cf * 0.3]], P.core, 0.7 + cf * 0.3);
      c.restore();
    }
    SG.disc(c, 0, 0, 0.17, P.glow, 0.6 + cf * 0.4);
    for (let i = 0; i < 6; i++){
      const a = t * 1.1 + i * TAU / 6, d = 0.8 + Math.sin(t * 2.4 + i) * 0.12;
      SG.disc(c, Math.cos(a) * d, Math.sin(a) * d, 0.055, P.glow, 0.25 + cf * 0.6);
    }
  },
  /* UNMAKING -- a rune that comes APART. The four quarters drift out as the
     charge fills, which is the mechanic stated backwards and on purpose. */
  spellbreaker(c, t, cf, P){
    const d = 0.06 + cf * 0.2;
    for (let i = 0; i < 4; i++){
      const a = i * TAU / 4 + Math.PI / 4;
      c.save(); c.translate(Math.cos(a) * d, Math.sin(a) * d); c.rotate(cf * 0.4 * (i % 2 ? 1 : -1));
      SG.poly(c, [[0.04, 0.04], [0.52, 0.04], [0.52, 0.52], [0.04, 0.52]], P.core, 0.8);
      c.restore();
    }
    SG.ring(c, 0, 0, 0.95, P.glow, 0.05, 0.25 + cf * 0.5);
    SG.path(c, [[-0.16, 0], [0.16, 0]], P.glow, 0.07, 0.4 + cf * 0.5);
  },
  /* QUARRELSTORM -- eight heads going out. The nova of arrows, counted. */
  ironhail(c, t, cf, P){
    for (let i = 0; i < 8; i++){
      const a = i * TAU / 8 + t * 0.3, d = 0.3 + cf * 0.56;
      c.save(); c.translate(Math.cos(a) * d, Math.sin(a) * d); c.rotate(a + Math.PI / 2);
      SG.poly(c, [[0, -0.24], [0.15, 0.1], [0, 0.02], [-0.15, 0.1]], P.core, 0.5 + cf * 0.5);
      c.restore();
    }
    SG.ring(c, 0, 0, 0.2, P.glow, 0.07, 0.6);
  },
  /* BULWARK -- the shield, and the shove that comes off it. */
  lightkeeper(c, t, cf, P){
    SG.ring(c, 0, 0, 0.55 + cf * 0.42, P.glow, 0.07, 0.2 + cf * 0.6);
    SG.poly(c, [[0, -0.72], [0.56, -0.42], [0.56, 0.2], [0, 0.76], [-0.56, 0.2], [-0.56, -0.42]],
            P.core, 0.85);
    SG.path(c, [[0, -0.5], [0, 0.5]], P.glow, 0.07, 0.5 + cf * 0.4);
    SG.path(c, [[-0.34, -0.1], [0.34, -0.1]], P.glow, 0.07, 0.5 + cf * 0.4);
  },
  /* REPRISAL -- a reticle that TIGHTENS, because the ult is one aimed shot
     paid for with the ward. */
  farwarden(c, t, cf, P){
    const r = 0.92 - cf * 0.36;
    SG.ring(c, 0, 0, r, P.core, 0.06, 0.85);
    SG.spokes(c, 4, r * 0.42, r * 1.24, t * 0.2, P.glow, 0.06, 0.4 + cf * 0.5);
    SG.disc(c, 0, 0, 0.09 + cf * 0.06, P.glow, 0.5 + cf * 0.5);
    c.save(); c.rotate(-Math.PI / 4);
    SG.path(c, [[-0.95, 0], [0.2 + cf * 0.6, 0]], P.steel, 0.05, 0.25 + cf * 0.6);
    c.restore();
  },
  /* BENEDICTION -- the halo, and the shaft through it. Heals, so the shaft
     grows DOWN into the frame rather than out of it. */
  aureole(c, t, cf, P){
    const g = c.createLinearGradient(0, -1, 0, 1);
    g.addColorStop(0, P.glow + "00"); g.addColorStop(0.5, P.glow);
    g.addColorStop(1, P.glow + "00");
    SG.a(c, 0.3 + cf * 0.55); c.fillStyle = g;
    c.fillRect(-0.17 - cf * 0.08, -1, 0.34 + cf * 0.16, 2); SG.a(c, 1);
    c.save(); c.scale(1, 0.36);
    SG.ring(c, 0, -1.5, 0.62, P.core, 0.16, 0.9);
    c.restore();
    for (let i = 0; i < 3; i++){
      const y = 0.9 - ((t * 0.5 + i / 3) % 1) * 1.7;
      SG.disc(c, 0, y, 0.06, P.glow, 0.5 * cf);
    }
  },
  /* CONSECRATION -- the censer swings, and the rings go out from where it is,
     not from the middle. */
  censer(c, t, cf, P){
    const sw = Math.sin(t * 1.7) * (0.16 + cf * 0.2);
    SG.path(c, [[0, -0.95], [Math.sin(sw) * 0.85, -0.95 + Math.cos(sw) * 0.72]], P.steel, 0.045, 0.7);
    const bx = Math.sin(sw) * 0.85, by = -0.95 + Math.cos(sw) * 0.72;
    SG.poly(c, [[bx - 0.26, by], [bx + 0.26, by], [bx + 0.17, by + 0.4], [bx - 0.17, by + 0.4]],
            P.core, 0.9);
    for (let i = 0; i < 3; i++){
      const u = (t * 0.6 + i / 3) % 1;
      SG.ring(c, bx, by + 0.2, 0.12 + u * 0.72, P.glow, 0.05, (1 - u) * (0.25 + cf * 0.6));
    }
  },
  /* SLAGBURST -- the shell splits, and NINE shards come off it, because nine
     is the measured ceiling the week-one note records as countable in frame. */
  emberedge(c, t, cf, P){
    SG.disc(c, 0, 0, 0.3, P.core, 0.9);
    SG.path(c, [[-0.2, -0.2], [0.05, 0], [-0.1, 0.22]], P.dark, 0.06, 0.9);
    for (let i = 0; i < 9; i++){
      const a = i * TAU / 9 + t * 0.24, d = 0.4 + cf * 0.5;
      SG.shard(c, Math.cos(a) * d, Math.sin(a) * d, 0.1, a, P.glow, 0.3 + cf * 0.65);
    }
  },
  /* BLOODPRICE -- a beam, and the toll paid under it. */
  oathwound(c, t, cf, P){
    const g = c.createLinearGradient(-1, 0, 1, 0);
    g.addColorStop(0, P.core + "00"); g.addColorStop(0.55, P.core); g.addColorStop(1, P.glow);
    SG.a(c, 0.35 + cf * 0.6); c.fillStyle = g;
    c.fillRect(-1, -0.16 - cf * 0.06, 2, 0.32 + cf * 0.12); SG.a(c, 1);
    SG.poly(c, [[0, 0.3], [0.24, 0.66], [0, 0.92], [-0.24, 0.66]], P.core, 0.55 + cf * 0.4);
    SG.disc(c, 0.86, 0, 0.11 + cf * 0.06, P.glow, 0.6 + cf * 0.4);
  },
  /* ROOTFAST -- roots going down and GRIPPING. Anchored, not thrown. */
  heartwood(c, t, cf, P){
    SG.path(c, [[0, -0.9], [0, 0.2]], P.core, 0.1, 0.9);
    for (const s of [-1, 1]) for (let i = 0; i < 2; i++){
      const y = 0.2 - i * 0.34, l = (0.34 + cf * 0.3) * (1 - i * 0.2);
      SG.path(c, [[0, y], [s * l * 0.6, y + 0.22], [s * l, y + 0.6 - i * 0.1]],
              P.core, 0.075, 0.55 + cf * 0.4);
    }
    for (let i = 0; i < 4; i++){
      const a = -Math.PI / 2 + (i - 1.5) * 0.44;
      SG.disc(c, Math.cos(a) * 0.55, -0.62 + Math.sin(a) * 0.16 + 0.16, 0.09,
              P.glow, 0.35 + cf * 0.5);
    }
  },
  /* ECLIPSE -- one disc slides over the other and the corona is what is left.
     Four relics share kind:"nova"; not one of them may share this picture. */
  nightfell(c, t, cf, P){
    SG.spokes(c, 16, 0.62, 0.62 + 0.3 * (0.3 + cf * 0.7), t * 0.2, P.glow, 0.045, 0.25 + cf * 0.55);
    SG.disc(c, 0, 0, 0.58, P.glow, 0.75);
    SG.disc(c, 0.5 - cf * 0.5, -0.14 + cf * 0.14, 0.58, "#07050C", 1);
    SG.ring(c, 0, 0, 0.58, P.core, 0.05, 0.4 + cf * 0.5);
  },
  /* COROLLARY -- a proof. The outer figure is given; the inner one is what
     follows from it, and it draws itself in as the charge fills. */
  axiom(c, t, cf, P){
    c.save(); c.rotate(t * 0.16);
    SG.path(c, [0, 1, 2, 0].map(i => [Math.cos(-Math.PI / 2 + i * TAU / 3) * 0.9,
                                      Math.sin(-Math.PI / 2 + i * TAU / 3) * 0.9]),
            P.core, 0.07, 0.85);
    SG.path(c, [0, 1, 2, 0].map(i => [Math.cos(Math.PI / 2 + i * TAU / 3) * 0.5 * cf,
                                      Math.sin(Math.PI / 2 + i * TAU / 3) * 0.5 * cf]),
            P.glow, 0.06, 0.3 + cf * 0.6);
    c.restore();
    SG.poly(c, [[-0.13, 0.68], [0.13, 0.68], [0.13, 0.94], [-0.13, 0.94]],
            P.glow, 0.3 + cf * 0.6);   // the tombstone: QED
  },
};

/* The single source of truth for "which status does this relic teach".
   The fight card and verify.py's legibility contract BOTH call this. They used
   to each have their own copy of the lookup, the card's copy only knew about
   `onHit`, and a relic shipped with a blank status line while every check
   stayed green. A check that does not call the same function the renderer
   calls is checking a different thing. */

  const k = Object.keys(w.onHit || {})[0] || Object.keys(w.onSelf || {})[0];
  return { key: k, def: STATUS[k], self: !(w.onHit && w.onHit[k]) };
}

/* The single source of truth for "does this relic shoot, and what does the
   viewer get told about it". Same rule as relicStatus(): the fight card and
   verify.py both call this one function, so they cannot drift apart. */
function relicShot(w){ return w.mode === "ranged" ? (w.shot || null) : null; }

/* Launch angle for a projectile of speed v under gravity g that passes
   through the offset (dx, dy). +y is DOWN in this hall, so the standard
   up-positive solution is mirrored on the way in and on the way out.
   Returns the LOW arc. If the point is out of range the discriminant goes
   negative and this returns a flat aim -- the shot then falls short, in
   full view, which is the honest picture. */
function ballisticAngle(dx, dy, v, g){
  if (!(g > 0)) return Math.atan2(dy, dx);
  const x = Math.abs(dx), yUp = -dy, v2 = v * v;
  if (x < 1e-3) return Math.atan2(dy, dx);
  const disc = v2 * v2 - g * (g * x * x + 2 * yUp * v2);
  if (disc < 0) return Math.atan2(dy, dx);
  const th = Math.atan((v2 - Math.sqrt(disc)) / (g * x));   // up-positive
  const a = -th;                                            // back to down-positive
  return dx < 0 ? Math.PI - a : a;
}

const WEAPON_BY_ID = Object.fromEntries(WEAPONS.map(w => [w.id, w]));

/* ------------------------------------------------------------------ MATH -- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
/* signed shortest angle from a to b */
const angDiff = (a,b) => { let d = (b - a) % TAU;
  if (d >  Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d; };

function makeRng(seed){                       // mulberry32
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Distance from point P to segment AB, plus the closest point. */
function segDist(ax, ay, bx, by, px, py){
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return { d: Math.hypot(px - cx, py - cy), x: cx, y: cy };
}

/* Closest distance between two segments (Ericson, Real-Time Collision Detection).
   This is what makes clanks possible: blade against blade, not blade against ball. */
/* Does the straight run from (ox,oy) to (px,py) enter the disc (cx,cy,r)
   strictly before it arrives? Closed-form ray/circle, no sampling.

   This is the whole of the clank fix. A weapon reaches a point by travelling
   to it, and a body in the way means it never got there. Before this, 39.8%
   of every clank in the game was two blades "meeting" at a point one of them
   could only occupy by being inside the other relic -- and because the
   renderer draws weapons over shells, the viewer watched a sword pass through
   a torso and strike sparks off nothing on the far side.

   It is a SUBTRACTION, which is why it costs nothing against §0: it does not
   add a rule to read, it deletes an event that never had a cause on screen. */
function rayBlocked(ox, oy, px, py, cx, cy, r){
  const dx = px - ox, dy = py - oy;
  const a  = dx*dx + dy*dy;
  if (a === 0) return false;
  const fx = ox - cx, fy = oy - cy;
  const b  = 2*(fx*dx + fy*dy);
  const cc = fx*fx + fy*fy - r*r;
  const disc = b*b - 4*a*cc;
  if (disc < 0) return false;                       // never touches the disc
  const t = (-b - Math.sqrt(disc)) / (2*a);         // near intersection
  return t > 1e-6 && t < 1 - 1e-6;                  // ...and it is in the way
}

function segSegDist(p1x,p1y,q1x,q1y, p2x,p2y,q2x,q2y){
  const d1x=q1x-p1x, d1y=q1y-p1y;
  const d2x=q2x-p2x, d2y=q2y-p2y;
  const rx=p1x-p2x,  ry=p1y-p2y;
  const a=d1x*d1x+d1y*d1y, e=d2x*d2x+d2y*d2y, f=d2x*rx+d2y*ry;
  const EPS=1e-9;
  let s=0, t=0;
  if (a<=EPS && e<=EPS){ s=t=0; }
  else if (a<=EPS){ s=0; t=clamp(f/e,0,1); }
  else {
    const c=d1x*rx+d1y*ry;
    if (e<=EPS){ t=0; s=clamp(-c/a,0,1); }
    else {
      const b=d1x*d2x+d1y*d2y;
      const denom=a*e-b*b;
      s = denom!==0 ? clamp((b*f-c*e)/denom,0,1) : 0;
      t = (b*s+f)/e;
      if (t<0){ t=0; s=clamp(-c/a,0,1); }
      else if (t>1){ t=1; s=clamp((b-c)/a,0,1); }
    }
  }
  const c1x=p1x+d1x*s, c1y=p1y+d1y*s;
  const c2x=p2x+d2x*t, c2y=p2y+d2y*t;
  return { d: Math.hypot(c1x-c2x, c1y-c2y), x:(c1x+c2x)/2, y:(c1y+c2y)/2 };
}

/* ------------------------------------------------------------------ ART --- */
/* Every shape draws in local space: the weapon runs along +X from x=0 (the
   hand) to x=L (the tip), centred on y=0. The silhouette is the tell — you
   should be able to name what a relic does from its outline alone. */
const SHAPES = {

  /* THE RUNIC GRAMMAR, EXTRACTED SO IT CAN TRAVEL.

     `_twinConjured` proved the idea on one shape: there is no solid blade at
     all, only hard crystalline shards hanging in a blade-shaped line with real
     daylight between them, light bleeding through the gaps, and a sigil turning
     backwards in the space where a hand would be. "Held by nothing" twice over.
     `silhouette_probe.py` scores that branch at IoU 0.347 against its own
     type-mates -- nearly as far apart as two different weapon TYPES.

     This is the same grammar with the profile handed in, so any shape can wear
     it. `prof(c)` traces the blade outline the type wants; everything else --
     the fracture, the drift, the beam, the sigil -- is the school.

     MERGED 2026-08-14. `_twinConjured` kept its own copy for three sessions
     because folding it in would have changed a shipped, approved silhouette
     and nothing here could see a render regression. `tools/twin_identity.py`
     is that check, and it went in first: 20 values of `_t` over the full 20*pi
     common period, at 62x30 and at 372x180, on all three callers.

     The merge is BIT-IDENTICAL -- 0 differing pixels of 14,551,080 compared.
     It only got there because the private copy differed in three real ways,
     and `o.dark`, `o.tipX` and `o.tipR` exist to carry them: the twinblade's
     silhouette fill is the literal `#040814` and not runic's `dark` `#08264F`,
     and its point sits at `L*1.04, W*0.085` where this hardcoded `L*1.02,
     W*0.075`. All three default to what this used to hardcode, so
     `_gsConjured` and `_whConjured` did not move either. Written as a plain
     re-parameterisation without them, the same merge moves 487,407 pixels at a
     max channel delta of 249 -- `twin_identity.py --naive` still prints that
     number, and it is the reason the note said to wait.

     Deterministic in SHAPES._t. No rng. bladeSegments derives the hit segment
     from f.theta, so none of this can move a hitbox. */
  _conjure(c, L, W, p, o){
    const t = SHAPES._t || 0;
    const N = o.n, gap = o.gap, bw = o.bw, prof = o.prof;
    /* The slice window is where the shards are CUT, which is not always the
       whole weapon. A blade runs from the gap to the point, but a hammer's ink
       is all out at the head, and slicing an empty stretch of haft would spend
       two of three shards on nothing. Defaults to the blade case. */
    const sf = o.sliceFrom === undefined ? gap : o.sliceFrom;
    const st = o.sliceTo   === undefined ? L   : o.sliceTo;
    const span = st - sf;

    /* A HAIRLINE DOWN THE AXIS, DRAWN FIRST AND KEPT THIN. The twinblade's v2
       had a fat beam here and the shards looked stuck ON it; the light is
       supposed to be what shows THROUGH the gaps, which means it has to be
       narrower than the blade, not wider. `o.beam` is a fraction of W and every
       caller keeps it under 0.06. */
    c.save();                                    // the light through the gaps
    c.globalCompositeOperation = "lighter";
    const beam = c.createLinearGradient(gap, 0, L, 0);
    beam.addColorStop(0,    p.core + "00");
    beam.addColorStop(0.30, p.core + "CC");
    beam.addColorStop(1,    p.glow);
    c.strokeStyle = beam; c.lineCap = "round";
    c.lineWidth = W * o.beam;
    c.beginPath(); c.moveTo(gap, 0); c.lineTo(L, 0); c.stroke();
    c.restore();

    /* ONE BLADE, CUT INTO PIECES -- and that is the whole grammar, not a
       detail of it. The twinblade's v2 drew five independent quads and they
       read as a chain of bricks on a string, because five separate objects in
       a row IS a chain no matter what shape each one is. Here `prof` is
       defined ONCE by the caller and each shard is a CLIP of it, so the
       assembly cannot help reading as one weapon that has been shattered and
       is being held in formation. Close the gaps in your head and you get the
       type's own outline back; that is the property that was missing, and it
       is why `prof` is a path and not a list of quads.

       Each shard drifts and cants on its own phase, so the fracture lines
       never sit still and the weapon breathes while the relic does not. */
    c.lineJoin = "miter"; c.lineCap = "butt";
    for (let i = 0; i < N; i++){
      const u0 = i / N, u1 = (i + (o.frac || 0.87)) / N;   // the daylight
      const x0 = sf + span * u0, x1 = sf + span * u1;
      const cx = (x0 + x1) / 2;
      const drift = Math.sin(t * 2.1 + i * 2.3) * W * o.drift;
      const cant  = Math.sin(t * 1.6 + i * 1.4) * o.cant;

      c.save();
      c.translate(cx, drift); c.rotate(cant); c.translate(-cx, -drift);
      c.beginPath();
      c.rect(x0, drift - bw * 2.2, x1 - x0, bw * 4.4);
      c.clip();

      /* p.dark, not a near-black literal -- see _sf_patch. The mask probe
         flattens every colour to one white and therefore cannot see a
         black bar; the colour matrix showed it immediately.
         `o.dark` is the one exception and it is a debt, not a feature:
         `_twinConjured` shipped with the literal `#040814` and the merge had
         to be bit-identical, so the literal came with it. It is invisible to
         `silhouette_probe.py` unless you pass `--footprint`. Retiring it means
         moving an approved silhouette, which is a decision for eyes. */
      prof(c); c.fillStyle = o.dark || p.dark; c.fill();     // silhouette
      const g = c.createLinearGradient(cx, -bw, cx, bw);     // lit from above
      g.addColorStop(0,    p.steel);
      g.addColorStop(0.52, p.core);
      g.addColorStop(1,    p.dark);
      prof(c); c.fillStyle = g; c.globalAlpha = 0.94; c.fill(); c.globalAlpha = 1;

      /* THE FRACTURE FACES CATCH THE LIGHT -- a bright rim on the two CUT
         edges, which is what says "this was broken" rather than "this was made
         in pieces". CLIPPED TO `prof`: without that they run the full height
         of the slice rect and the weapon turns into a venetian blind, which is
         precisely what the first attempt at this looked like. */
      c.save();                                              // the cut faces
      prof(c); c.clip();
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.055);
      c.beginPath();
      c.moveTo(x0, drift - bw * 2); c.lineTo(x0, drift + bw * 2);
      c.moveTo(x1, drift - bw * 2); c.lineTo(x1, drift + bw * 2);
      c.stroke();
      c.restore();

      prof(c);
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.045); c.stroke();
      c.restore();
    }

    /* The point is light, not steel: the weapon ends in the thing holding it
       together. `tipX`/`tipR` exist only so `_twinConjured` can keep the
       slightly further, slightly larger point it shipped with -- see the merge
       note at the top. */
    c.save();                                    // the point is light, not steel
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "#FFFFFF"; c.shadowColor = p.core; c.shadowBlur = 18;
    c.beginPath(); c.arc(L * (o.tipX || 1.02), 0, W * (o.tipR || 0.075), 0, TAU); c.fill();
    c.restore();

    /* THE SIGIL, where a hand would be, turning BACKWARDS against the weapon.
       A thing that refuses to turn with what it is carrying cannot be read as
       a grip. The school's whole argument, in one moving object. */
    c.save();                                    // the sigil, turning backwards
    c.translate(gap * 0.50, 0);
    c.rotate(-t * 2.4);
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.030);
    c.shadowColor = p.core; c.shadowBlur = 14;
    const rr = W * o.sigil;
    c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3;
      const x = Math.cos(a) * rr * 0.60, y = Math.sin(a) * rr * 0.60;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.stroke();
    c.lineWidth = Math.max(1, W * 0.020);
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3 + Math.PI / 3;
      c.beginPath();
      c.moveTo(Math.cos(a) * rr * 1.15, Math.sin(a) * rr * 1.15);
      c.lineTo(Math.cos(a) * rr * 1.55, Math.sin(a) * rr * 1.55);
      c.stroke();
    }
    c.restore();
  },

  /* A DETERMINISTIC HASH. There is no rng anywhere in SHAPES and there is not
     about to be: a fracture that reshuffled itself every frame would read as
     television snow rather than as glass. A weapon has to be broken the same
     way every time you look at it. Pure function of its arguments, no state --
     stable across frames, across page loads, and across the two builds
     `engine_ab.py` compares field for field. */
  _h(i, k){
    const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
    return s - Math.floor(s);
  },

  /* ---- convex-polygon primitives. Sutherland-Hodgman and two sums. ------- */
  _clipHP(poly, nx, ny, d){                    // keep n.x <= d
    const out = [];
    for (let i = 0; i < poly.length; i++){
      const A = poly[i], B = poly[(i + 1) % poly.length];
      const da = nx * A[0] + ny * A[1] - d;
      const db = nx * B[0] + ny * B[1] - d;
      if (da <= 0) out.push(A);
      if ((da < 0 && db > 0) || (da > 0 && db < 0)){
        const s = da / (da - db);
        out.push([A[0] + (B[0] - A[0]) * s, A[1] + (B[1] - A[1]) * s]);
      }
    }
    return out;
  },
  _area(poly){
    let a = 0;
    for (let i = 0; i < poly.length; i++){
      const A = poly[i], B = poly[(i + 1) % poly.length];
      a += A[0] * B[1] - B[0] * A[1];
    }
    return Math.abs(a) / 2;
  },
  _centroid(poly){
    let a = 0, x = 0, y = 0;
    for (let i = 0; i < poly.length; i++){
      const A = poly[i], B = poly[(i + 1) % poly.length];
      const w = A[0] * B[1] - B[0] * A[1];
      a += w; x += (A[0] + B[0]) * w; y += (A[1] + B[1]) * w;
    }
    if (Math.abs(a) < 1e-9) return [0, 0];
    return [x / (3 * a), y / (3 * a)];
  },
  /* Inradius of a strip of the same area and perimeter -- a cheap, monotone
     "is this piece a sliver" test. A true inradius needs an LP; this does not,
     and the splitter only has to REJECT slivers, not measure them. */
  _thick(poly){
    let per = 0;
    for (let i = 0; i < poly.length; i++){
      const A = poly[i], B = poly[(i + 1) % poly.length];
      per += Math.hypot(B[0] - A[0], B[1] - A[1]);
    }
    return per < 1e-6 ? 0 : 2 * SHAPES._area(poly) / per;
  },

  /* THE FRACTURE NETWORK, built once and cached.

     Depends only on the hashes and the geometry -- never on the clock -- so
     rebuilding it per frame would be pure waste, and the weapon is drawn twice
     a frame. Keyed on everything that can change its shape.

     Largest-cell-first is what keeps the pieces comparable in size without any
     size term in the objective: cutting the biggest piece each time is a greedy
     balance, and it is why the result reads as one plate that broke rather than
     as a coarse half and a shattered half. The angle is uniform over pi (a line
     has no direction), so cross-cuts, lengthwise splits and obliques all occur
     -- on a 9:1 blade the lengthwise ones are what finally produce pieces that
     are only the TOP half, which is the whole of Rick's note. */
  _fracture(L, W, o){
    const key = [L, W, o.bw, o.gap, o.cuts, o.inset, o.sliceFrom, o.sliceTo].join(":");
    /* A MAP, NOT ONE SLOT. A single cached entry looks sufficient -- the arena
       draws this weapon at one size -- and it is not: the cold open paints the
       fight card OVER the live match, so `_artShape` at `reach * 0.86` and the
       arena at `reach + 6` are both drawn every frame for the length of the
       card. One slot would miss on every single call and rebuild the whole
       partition twice a frame, which is the exact opposite of caching it.
       Bounded the same way `_glowCache` is, and for the same reason. */
    if (!SHAPES._fxc) SHAPES._fxc = new Map();
    const hit = SHAPES._fxc.get(key);
    if (hit) return hit;
    const bw = o.bw;
    const sf = o.sliceFrom === undefined ? o.gap : o.sliceFrom;
    const st = o.sliceTo   === undefined ? L     : o.sliceTo;
    /* The seed rectangle is deliberately LARGER than the blade. Its own edges
       must never appear as a fracture face, and after the inset pushes them in
       they still have to sit outside the profile. */
    const M = bw * 3;
    const rect = [[sf - M, -bw - M], [st + M, -bw - M], [st + M, bw + M], [sf - M, bw + M]];
    const cells = [{ poly: rect, planes: [] }];
    const edges = [];
    const minA = (st - sf) * bw * 2 / (o.cuts + 1) * 0.16;
    const minT = bw * 0.34;
    for (let k = 0; k < o.cuts; k++){
      let bi = 0, ba = -1;
      for (let i = 0; i < cells.length; i++){
        /* Area measured on the cell CLIPPED TO THE BLADE BOX, not on the raw
           polygon. Otherwise the corner cells -- which are mostly the seed
           rectangle's overhang and contain almost no weapon -- look enormous
           and eat every cut, and the blade itself comes out in two pieces. */
        const a = SHAPES._area(SHAPES._clipBox(cells[i].poly, sf, st, bw));
        if (a > ba){ ba = a; bi = i; }
      }
      const C = cells[bi];
      const box = SHAPES._clipBox(C.poly, sf, st, bw);
      const ctr = SHAPES._centroid(box.length ? box : C.poly);
      let cut = null;
      for (let a = 0; a < 8 && !cut; a++){
        const ang = SHAPES._h(k * 17 + a, 3) * Math.PI;
        const nx = Math.cos(ang), ny = Math.sin(ang);
        const px = ctr[0] + (SHAPES._h(k * 17 + a, 5) - 0.5) * o.wander * (st - sf) / (o.cuts + 1);
        const py = ctr[1] + (SHAPES._h(k * 17 + a, 7) - 0.5) * o.wander * bw;
        const d = nx * px + ny * py;
        const A = SHAPES._clipHP(C.poly, nx, ny, d);
        const B = SHAPES._clipHP(C.poly, -nx, -ny, -d);
        if (A.length < 3 || B.length < 3) continue;
        /* Both children have to be real pieces of WEAPON. A cut that shaves a
           sliver, or that only divides the overhang, is rejected and the next
           angle is tried -- eight tries, then the cell is left whole. */
        const ab = SHAPES._clipBox(A, sf, st, bw), bb = SHAPES._clipBox(B, sf, st, bw);
        if (SHAPES._area(ab) < minA || SHAPES._area(bb) < minA) continue;
        if (SHAPES._thick(ab) < minT || SHAPES._thick(bb) < minT) continue;
        cut = { nx, ny, d, A, B };
      }
      if (!cut) continue;
      const pl = C.planes;
      const ca = { poly: cut.A, planes: pl.concat([[ cut.nx,  cut.ny,  cut.d]]) };
      const cb = { poly: cut.B, planes: pl.concat([[-cut.nx, -cut.ny, -cut.d]]) };
      cells[bi] = ca; cells.push(cb);
      /* The shared edge, taken from the child rather than re-derived: it is the
         one edge of A whose two ends both lie on the cutting line. This is what
         the filaments span, so it has to be the real segment and not the whole
         infinite line. */
      let seg = null;
      for (let i = 0; i < cut.A.length && !seg; i++){
        const P = cut.A[i], Q = cut.A[(i + 1) % cut.A.length];
        const dp = Math.abs(cut.nx * P[0] + cut.ny * P[1] - cut.d);
        const dq = Math.abs(cut.nx * Q[0] + cut.ny * Q[1] - cut.d);
        if (dp < 1e-6 && dq < 1e-6) seg = [P, Q];
      }
      if (seg) edges.push({ a: bi, b: cells.length - 1, nx: cut.nx, ny: cut.ny,
                            p: seg[0], q: seg[1] });
    }
    /* The inset polygon, and this is the payoff for keeping the half-planes.
       Pushing every plane in by `inset` is the exact offset of a convex cell --
       no offsetting algorithm, no corner degeneracies -- and two neighbours
       share the plane between them, so the daylight is EXACTLY 2*inset wide
       between every pair, in every direction the cuts happened to run. */
    for (const cell of cells){
      let q = rect;
      for (const pl of cell.planes) q = SHAPES._clipHP(q, pl[0], pl[1], pl[2] - o.inset);
      cell.in = q;
      cell.c  = SHAPES._centroid(q.length ? q : cell.poly);
    }
    if (SHAPES._fxc.size > 24) SHAPES._fxc.clear();
    const out = { key, cells, edges, sf, st };
    SHAPES._fxc.set(key, out);
    return out;
  },
  _clipBox(poly, sf, st, bw){
    let q = SHAPES._clipHP(poly, -1, 0, -sf);
    q = SHAPES._clipHP(q, 1, 0, st);
    q = SHAPES._clipHP(q, 0, -1, bw);
    q = SHAPES._clipHP(q, 0, 1, bw);
    return q;
  },

  /* ===================================================== SHATTER ==========
     Rick, 2026-08-16: *"shards are still purely horizontal. wouldnt glass
     shards be cut in every direction?"*

     `_conjure` walks one axis and every piece spans the full height. This does
     not. See shatter_build.py for the partition; what follows is only how the
     pieces are lit and what holds them apart.

     Deterministic in SHAPES._t and the piece index. No rng. `bladeSegments`
     still derives the hit segment from f.theta, so none of this can move a
     hitbox. */
  _shatter(c, L, W, p, o){
    const t = SHAPES._t || 0;
    const prof = o.prof, bw = o.bw, gap = o.gap;
    const F = SHAPES._fracture(L, W, o);
    const cells = F.cells;

    /* THE MOTION BUDGET. The daylight is 2*inset wide everywhere, and the only
       thing that can close it is two neighbours moving differently. So the
       amplitudes are derived FROM the inset rather than chosen next to it --
       the same discipline the 1-D version needed, but simpler here because the
       gap is uniform and known instead of being the narrowest of six.

       In 2-D the drift is a 2-D vector, so the worst case is both axes aligning
       against the same edge: hence the sqrt(2). */
    const rad = Math.hypot(F.st - F.sf, bw * 2) * 0.5;
    const budget = 2 * o.inset * (1 - o.open);
    const rotMax = Math.min(o.cant, budget * 0.30 / rad);
    const drMax  = Math.max(0, budget * 0.70 - rotMax * rad) / (2 * 1.4143);

    /* The hairline down the axis, drawn FIRST and kept thin: the light is what
       shows THROUGH the breaks, so it has to be narrower than the blade. */
    c.save();
    c.globalCompositeOperation = "lighter";
    const beam = c.createLinearGradient(gap, 0, L, 0);
    beam.addColorStop(0,    p.core + "00");
    beam.addColorStop(0.30, p.core + "CC");
    beam.addColorStop(1,    p.glow);
    c.strokeStyle = beam; c.lineCap = "round";
    c.lineWidth = W * o.beam;
    c.beginPath(); c.moveTo(gap, 0); c.lineTo(L, 0); c.stroke();
    c.restore();

    const pose = [];
    for (let i = 0; i < cells.length; i++){
      /* Amplitude varied DOWNWARD only. The maxima are what close the daylight,
         so a piece swinging further than the budget would spend gap that has
         already been allocated -- invisibly, at one phase of a long period,
         which is the kind of defect that ships. Varying below 1 still breaks
         the lockstep, and lockstep was the complaint. */
      const av = 0.40 + SHAPES._h(i, 91) * 0.60;
      const cvv = 0.40 + SHAPES._h(i, 97) * 0.60;
      const ph = SHAPES._h(i, 41) * 6.283;
      pose.push({ dx: Math.sin(t * 2.1 + ph) * drMax * av,
                  dy: Math.cos(t * 1.7 + ph * 1.31) * drMax * av,
                  rot: Math.sin(t * 1.6 + ph * 0.77) * rotMax * cvv });
    }

    c.lineJoin = "miter"; c.lineCap = "butt";
    for (let i = 0; i < cells.length; i++){
      const cell = cells[i], q = cell.in;
      if (!q || q.length < 3) continue;
      const P = pose[i], cx = cell.c[0], cy = cell.c[1];
      c.save();
      c.translate(cx + P.dx, cy + P.dy); c.rotate(P.rot); c.translate(-cx, -cy);
      c.beginPath();
      c.moveTo(q[0][0], q[0][1]);
      for (let k = 1; k < q.length; k++) c.lineTo(q[k][0], q[k][1]);
      c.closePath();
      c.clip();

      prof(c); c.fillStyle = p.dark; c.fill();                // silhouette
      const g = c.createLinearGradient(cx, -bw, cx, bw);      // lit from above
      g.addColorStop(0,    p.steel);
      g.addColorStop(0.52, p.core);
      g.addColorStop(1,    p.dark);
      prof(c); c.fillStyle = g; c.globalAlpha = 0.94; c.fill(); c.globalAlpha = 1;

      /* TWO VALUE PLANES PER PIECE. One smooth gradient describes a rounded
         metal bevel; glass has FLATS, and a flat is a region of near-constant
         value ending in a hard line. One facet per piece, at its own angle,
         lighter one side and darker the other -- twice the contrast of
         lightening alone, for the same alpha. ONE, not a lattice: a viewer
         reads objects and cannot read a texture. */
      if (o.facet){
        c.save();
        prof(c); c.clip();
        const fl = (SHAPES._h(i, 131) - 0.5) * 1.60;
        const fy = cy + (SHAPES._h(i, 137) - 0.5) * 1.20 * bw;
        const ax = cx - bw * 4, bx = cx + bw * 4;
        const ay = fy + fl * (ax - cx), by = fy + fl * (bx - cx);
        const H = bw * 4;
        c.beginPath();
        c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(bx, cy - H); c.lineTo(ax, cy - H);
        c.closePath(); c.fillStyle = p.steel; c.globalAlpha = o.facet; c.fill();
        c.beginPath();
        c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(bx, cy + H); c.lineTo(ax, cy + H);
        c.closePath(); c.fillStyle = p.dark; c.globalAlpha = o.facet * 0.85; c.fill();
        c.globalAlpha = Math.min(1, o.facet * 1.9);
        c.strokeStyle = p.glow; c.lineWidth = Math.max(0.5, W * 0.014);
        c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
        c.globalAlpha = 1;
        c.restore();
      }

      /* THE FRACTURE FACES CATCH THE LIGHT. Here every edge of the cell IS a
         fracture -- the seed rectangle's own edges are outside the profile and
         never show -- so the whole polygon is the rim, and the blade's own
         outline is stroked separately afterwards. That separation is exact
         rather than heuristic, which the 1-D version could not manage: it had
         to name x0 and x1 as "the cut edges" by hand. */
      c.save();
      prof(c); c.clip();
      c.beginPath();
      c.moveTo(q[0][0], q[0][1]);
      for (let k = 1; k < q.length; k++) c.lineTo(q[k][0], q[k][1]);
      c.closePath();
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.055); c.stroke();
      /* A white core inside the rim. A break in a transparent solid is a lens:
         it gathers light along the edge and throws it back white, brighter than
         anything on the face. One extra stroke on the path already there. */
      if (o.facet){
        c.globalCompositeOperation = "lighter";
        c.strokeStyle = "#FFFFFF"; c.globalAlpha = 0.55;
        c.lineWidth = Math.max(0.5, W * 0.018); c.stroke();
        c.globalAlpha = 1;
      }
      c.restore();

      prof(c);                                                // the blade's own edge
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.045); c.stroke();
      c.restore();
    }

    /* --------------------------------------------------- HELD BY SOMETHING --
       `_conjure` always put real daylight between the pieces and left it EMPTY:
       the thesis is "held by nothing" and *nothing* got taken literally, so the
       honest read was pieces that happen to fly in formation. Formation with no
       cause is a coincidence.

       A filament across every break, spanning it PERPENDICULAR -- which is a
       thing only this version can do, because only here is there a break
       direction to be perpendicular to. Both ends grip the same cut line, so
       each filament joins two points that were the same point before the plate
       came apart. They run at t*5.3 against the drift's t*2.1: a fast binding
       on slow glass says the magic is working and the pieces are heavy. */
    if (o.bind){
      const rot = (P, px, py, cx, cy) => {
        const s = Math.sin(P.rot), k = Math.cos(P.rot);
        return [cx + (px - cx) * k - (py - cy) * s + P.dx,
                cy + (px - cx) * s + (py - cy) * k + P.dy];
      };
      c.save();
      /* CLIPPED TO THE BLADE, and this is not cosmetic. The seed rectangle is
         larger than the weapon, so some cuts divide pieces out in the overhang
         where there is no blade at all -- their shared edge is a real edge of a
         real cell and its filament was drawn faithfully in empty space, a
         scatter of little glowing commas around the weapon. The daylight is by
         definition INSIDE the profile, so clipping to it is exact rather than a
         patch: a filament that lands outside was never spanning anything. */
      prof(c); c.clip();
      c.globalCompositeOperation = "lighter";
      c.lineCap = "round";
      for (let e = 0; e < F.edges.length; e++){
        const E = F.edges[e], A = cells[E.a], B = cells[E.b];
        const PA = pose[E.a], PB = pose[E.b];
        for (let k = 0; k < o.bindN; k++){
          const u = (k + 0.5) / o.bindN + (SHAPES._h(e * 5 + k, 149) - 0.5) * 0.36;
          const uu = Math.min(0.92, Math.max(0.08, u));
          const mx = E.p[0] + (E.q[0] - E.p[0]) * uu;
          const my = E.p[1] + (E.q[1] - E.p[1]) * uu;
          /* Off the shared line by `inset` toward each side: that lands exactly
             on the two faces, because the inset is what pulled them apart. */
          const a0 = rot(PA, mx - E.nx * o.inset, my - E.ny * o.inset, A.c[0], A.c[1]);
          const b0 = rot(PB, mx + E.nx * o.inset, my + E.ny * o.inset, B.c[0], B.c[1]);
          const bow = Math.sin(t * 5.3 + e * 2.1 + k * 1.7) * o.inset * 0.55;
          const midx = (a0[0] + b0[0]) / 2 - E.ny * bow;
          const midy = (a0[1] + b0[1]) / 2 + E.nx * bow;
          const gr = c.createLinearGradient(a0[0], a0[1], b0[0], b0[1]);
          gr.addColorStop(0,   p.glow);
          gr.addColorStop(0.5, p.core + "99");
          gr.addColorStop(1,   p.glow);
          c.strokeStyle = gr;
          c.lineWidth = Math.max(0.5, W * 0.016);
          c.shadowColor = p.core; c.shadowBlur = 7;
          c.globalAlpha = o.bind * (0.55 + 0.45 * Math.sin(t * 5.3 + e * 2.1 + k * 1.7));
          c.beginPath();
          c.moveTo(a0[0], a0[1]); c.quadraticCurveTo(midx, midy, b0[0], b0[1]);
          c.stroke();
        }
      }
      c.restore();
    }

    /* The point is light, not steel: the weapon ends in the thing holding it
       together. */
    c.save();
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "#FFFFFF"; c.shadowColor = p.core; c.shadowBlur = 18;
    c.beginPath(); c.arc(L * 1.02, 0, W * 0.075, 0, TAU); c.fill();
    c.restore();

    /* THE SIGIL, where a hand would be, turning BACKWARDS against the weapon.
       A thing that refuses to turn with what it is carrying cannot be read as a
       grip. The school's whole argument, in one moving object. */
    c.save();
    c.translate(gap * 0.50, 0);
    c.rotate(-t * 2.4);
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.030);
    c.shadowColor = p.core; c.shadowBlur = 14;
    const rr = W * o.sigil;
    c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3;
      const x = Math.cos(a) * rr * 0.60, y = Math.sin(a) * rr * 0.60;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.stroke();
    c.lineWidth = Math.max(1, W * 0.020);
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3 + Math.PI / 3;
      c.beginPath();
      c.moveTo(Math.cos(a) * rr * 1.15, Math.sin(a) * rr * 1.15);
      c.lineTo(Math.cos(a) * rr * 1.55, Math.sin(a) * rr * 1.55);
      c.stroke();
    }
    c.restore();
  },

  /* RUNIC GREATSWORD. The grammar's first trip to another type, and the
     hostile case on purpose: the greatsword is the longest, most solid shape
     in the game and the matrix sheet's worst cell.

     What the school takes away is as important as what it adds. There is no
     grip, no wrapped leather, no crossguard and no pommel -- the crossguard in
     particular is the single largest horizontal element on the shipped
     greatsword, and deleting it is most of why the outline stops being the
     same outline. Six shards instead of the twinblade's five, because the
     blade is nearly twice as long and five would read as chunks. */
  _gsConjured(c, L, W, p){
    const gap = L * 0.20, bw = W * 0.34, span = L - gap;
    const prof = (cc) => {
      cc.beginPath();
      cc.moveTo(gap,               -bw * 0.52);
      cc.lineTo(gap + span * 0.10, -bw);
      cc.lineTo(L * 0.86,          -bw * 0.80);
      cc.lineTo(L * 1.01,           0);
      cc.lineTo(L * 0.86,           bw * 0.80);
      cc.lineTo(gap + span * 0.10,  bw);
      cc.lineTo(gap,                bw * 0.52);
      cc.closePath();
    };
    /* `frac` 0.74, not the twinblade's 0.87. MEASURED: at 0.87 the runic
       greatsword scored IoU 0.519 against its type-mates, against the runic
       twinblade's 0.403 on the same build -- the grammar had travelled but
       arrived weaker, because six narrow gaps in a blade nearly twice as long
       remove proportionally less of it. Wider daylight is the knob, and it is
       the school's own thesis turned up rather than a new idea. */
    /* v3, 2026-08-16 -- SHATTERED, not sliced. `_conjure` is untouched and
       still carries the twinblade and the warhammer; this shape alone moves to
       the 2-D partition. See shatter_build.py. */
    SHAPES._shatter(c, L, W, p, { cuts:9, gap, bw, prof,
                                  inset:1.900, wander:0.850,
                                  open:0.300, beam:0.050, cant:0.075,
                                  facet:0.160, bind:1.000,
                                  bindN:1, sigil:0.30 });
  },

  /* Darken a palette colour toward its own luminance. `k` scales value, `mix`
     pulls toward neutral grey (0 keeps the hue fully, 1 is achromatic).
     Memoised: it is called from inside per-frame draws, and this project has
     already paid once for allocating inside a draw. The cache is bounded by
     the palette, so it is at most a few dozen entries for the whole run. */
  /* A SHADOWED FACE, IN THE SCHOOL'S OWN COLOUR. `_shade` desaturates toward
     luminance, which is right for a highlight and wrong for a shadow: it sends
     all seven schools to the same grey (sanctified #808080, runic #6C727B).
     A turned-away face is lit by less of the same light, not by grey light, so
     blend toward the school's `dark`. `t` is picked per site to hold the
     luminance `_shade` produced. depth_build.py --tint. */
  _facet(steel, dark, t){
    const cache = SHAPES._facetCache || (SHAPES._facetCache = {});
    const id = steel + "|" + dark + "|" + t;
    const hit = cache[id];
    if (hit) return hit;
    const s = parseInt(steel.slice(1), 16), d = parseInt(dark.slice(1), 16);
    const mix = (sh) => Math.round((((s >> sh) & 255)
                 + ((((d >> sh) & 255)) - ((s >> sh) & 255)) * t));
    const r = mix(16), g = mix(8), b = mix(0);
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b)
                              .toString(16).slice(1));
  },

  /* WORLD LIGHT. `_lit` mirrors an interior facet about the blade axis when the
     weapon has turned over, so a shadowed face stays on the side away from the
     light instead of riding around with the object. Returns the strength: 1
     when the blade lies flat to the light, 0 when it swings edge-on, and the
     mirror happens exactly where the strength is 0. depth_build.py
     --worldlight. */
  _litN(c){
    const m = c.getTransform();
    return m.d / (Math.hypot(m.c, m.d) || 1);
  },
  _lit(c){
    const n = SHAPES._litN(c);
    if (n < 0) c.scale(1, -1);
    return Math.abs(n);
  },

  /* A NEAR-BLACK THE PALETTE OWNS. A literal near-black is invisible to every
     instrument in this project at once: no palette field moves it, and the
     silhouette mask flattens palette fields and thresholds greyscale at 40, so
     ink below 40 that is not a field cannot be seen either. It reads as a
     plausible number for a smaller object. depth_build.py --bowlit.

     Scale the school's own `dark` to the literal's luminance. The VALUE is what
     the near-black was for; the hue is what it was throwing away. */
  _ink(hex, lum){
    const cache = SHAPES._inkCache || (SHAPES._inkCache = {});
    const id = hex + "|" + lum;
    const hit = cache[id];
    if (hit) return hit;
    const n = parseInt(hex.slice(1), 16);
    const r0 = (n >> 16) & 255, g0 = (n >> 8) & 255, b0 = n & 255;
    const l0 = 0.2126 * r0 + 0.7152 * g0 + 0.0722 * b0;
    const k = l0 > 0.5 ? lum / l0 : 0;
    const q = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    const r = q(r0), g = q(g0), b = q(b0);
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b)
                              .toString(16).slice(1));
  },

  _shade(hex, k, mix){
    const cache = SHAPES._shadeCache || (SHAPES._shadeCache = {});
    const id = hex + k + "|" + mix;
    const hit = cache[id];
    if (hit) return hit;
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = Math.max(0, Math.min(255, Math.round((r + (lum - r) * mix) * k)));
    g = Math.max(0, Math.min(255, Math.round((g + (lum - g) * mix) * k)));
    b = Math.max(0, Math.min(255, Math.round((b + (lum - b) * mix) * k)));
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1));
  },

  /* THE MAKER'S MARK. §3.1 of the matrix doc found `SHAPES.warhammer` drawing
     what its own comment called the "dwarven chevron" on every school's hammer,
     because the shapes were written when type and school were the same thing.
     The fix §3.3 asks for is not "stop sharing shapes", it is *share the
     routine, bespoke one real detail inside it* — and the detail has to be
     STRUCTURAL. A recoloured chevron is still one chevron.

     Seven marks, one per school, each drawn from that school's own vocabulary
     so it is recognisable from the rest of the relic rather than learned here:

       dwarven     the chevron, unchanged — it was always right for dwarven
       sanctified  a sunburst: rays, the same language as Judgement's pillar
       bloodsworn  three tally cuts, the wound it counts
       verdant     a sprig, the only mark that grows out of the weapon
       umbral      tarnish: the mark is an ABSENCE, eating the face
       runic       the triangle-in-ring sigil from _twinConjured
       vigil       a riveted plate, the same plate the ward puts on the shell

     `sc` is the mark's half-size. Drawn at (x, y) in the shape's own space, so
     any shape can call it; it does not know what it is sitting on. */
  _makerMark(c, x, y, sc, W, p){
    const k = p.key;
    c.save();
    c.translate(x, y);
    const lw = Math.max(1, W * 0.05);
    c.lineWidth = lw; c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = p.core; c.fillStyle = p.core;

    if (k === "sanctified"){
      for (let i = 0; i < 8; i++){
        const a = i * TAU / 8;
        c.beginPath();
        c.moveTo(Math.cos(a) * sc * 0.34, Math.sin(a) * sc * 0.34);
        c.lineTo(Math.cos(a) * sc * (i % 2 ? 0.72 : 1.0),
                 Math.sin(a) * sc * (i % 2 ? 0.72 : 1.0));
        c.stroke();
      }
      c.beginPath(); c.arc(0, 0, sc * 0.22, 0, TAU); c.fill();

    } else if (k === "bloodsworn"){
      c.lineWidth = Math.max(1, W * 0.055);
      for (let i = -1; i <= 1; i++){
        c.beginPath();
        c.moveTo(i * sc * 0.42 - sc * 0.18, -sc * 0.85);
        c.lineTo(i * sc * 0.42 + sc * 0.18,  sc * 0.85);
        c.stroke();
      }

    } else if (k === "verdant"){
      c.lineWidth = Math.max(1, W * 0.045);
      c.beginPath();
      c.moveTo(0, sc * 0.95);
      c.quadraticCurveTo(sc * 0.10, 0, -sc * 0.10, -sc * 0.95);
      c.stroke();
      for (const sg of [-1, 1]){
        c.beginPath();
        c.moveTo(0, sg * sc * 0.30);
        c.quadraticCurveTo(sg * sc * 0.55, sg * sc * 0.30 - sc * 0.22,
                           sg * sc * 0.20, -sc * 0.10 + sg * sc * 0.30);
        c.stroke();
      }

    } else if (k === "umbral"){
      /* An absence: the mark is drawn by REMOVING the face under it, so the
         hammer looks eaten rather than stamped. destination-out is the only
         composite in here and it is scoped by the save/restore. */
      c.save();
      c.globalCompositeOperation = "destination-out";
      c.beginPath();
      for (let i = 0; i < 9; i++){
        const a = i * TAU / 9;
        const rr = sc * (0.55 + 0.42 * Math.abs(Math.sin(i * 2.7)));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
      c.restore();
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(0, 0, sc * 0.30, 0, TAU); c.fill();
      c.globalAlpha = 1;

    } else if (k === "runic"){
      c.lineWidth = Math.max(1, W * 0.038);
      c.beginPath(); c.arc(0, 0, sc * 0.92, 0, TAU); c.stroke();
      c.beginPath();
      for (let i = 0; i < 3; i++){
        const a = i * TAU / 3 - Math.PI / 2;
        const px = Math.cos(a) * sc * 0.60, py = Math.sin(a) * sc * 0.60;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.stroke();

    } else if (k === "vigil"){
      c.fillStyle = p.dark;
      c.fillRect(-sc * 0.80, -sc * 0.62, sc * 1.60, sc * 1.24);
      c.fillStyle = p.core;
      c.fillRect(-sc * 0.64, -sc * 0.46, sc * 1.28, sc * 0.92);
      c.fillStyle = p.glow;
      c.fillRect(-sc * 0.64, -sc * 0.46, sc * 1.28, sc * 0.24);
      c.fillStyle = p.dark;
      for (const sx of [-1, 1]) for (const sy of [-1, 1]){
        c.beginPath(); c.arc(sx * sc * 0.50, sy * sc * 0.30, sc * 0.12, 0, TAU); c.fill();
      }

    } else {
      /* DWARVEN, and the default for any school with no mark of its own. */
      c.beginPath();
      c.moveTo(-sc * 0.62, -sc); c.lineTo(sc * 0.62, 0); c.lineTo(-sc * 0.62, sc);
      c.stroke();
    }
    c.restore();
  },

  /* Long slender blade, wide crossguard, fuller groove. The crossguard is the
     tell: this is the only relic with a hilt built to catch another weapon. */
  /* A bow drawn side-on: the string faces BACKWARD along -x, the bolt points
     forward along +x, so the silhouette states the firing direction. That
     matters more here than on any other shape — the whole no-aim design
     rests on the viewer being able to see where the weapon is pointing.
     No school iconography, per the matrix contact-sheet finding.

     `k` is the DRAW, 0..1, and it is the reason this shape takes a fifth
     argument no other shape wants. The first contact sheet had the bolt
     permanently nocked, which meant the bow looked exactly the same the
     instant before a shot and the instant after one — the cadence, the one
     thing a viewer needs to be able to feel about a ranged weapon, was
     invisible. Now it nocks, draws, and looses: string forward and empty
     for most of the interval, bolt appearing and the string coming back
     over the last third, gone again on release. Presentation only.
     Undefined from the fight card, where a half-drawn bow is the pose that
     reads as a bow in use rather than a bow on a rack. */
  bow(c, L, W, p, k){
    const dk = k === undefined ? 0.55 : clamp(k, 0, 1);
    /* PROPORTION, FROM RICK'S REFERENCE. v1 was a slim bow held out on a
       long grip -- a thin thing poking sideways off the shell. The
       reference is a BROAD recurve sitting across the ball like a brim,
       limb span comparable to the ball's own diameter, and near-black.
       Three consequences and all of them are improvements:
         - wide reads as a bow at phone size; slim reads as a stick
         - DARK separates by VALUE on any school palette, which is the
