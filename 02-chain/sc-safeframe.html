       holds the match open while the loser flies into the wall. During those
       frames `over` is still false and `move()` is still running. Put the
       drop below the guard and the winner spends its entire victory flight
       burdened by blades nobody is going to detonate.

       harrow_probe.py [10] is what forced this up here; the first version sat
       under the guard and could not be reached by the case it claimed to
       handle. */
    if (f.ultHarrow && (!f.alive || !foe.alive || this.over)){
      f.ultHarrow = null;
      this.unstick(foe);
    }
    /* ABOVE THE GUARD, for the reason the Harrowing's fuse is above it: a
       fatal blow arms `killFlight` and `checkEnd` holds the match OPEN while
       the loser flies into the wall, and during those frames `over` is false
       and `move()` is still running. A caster that dies mid-reversal has to
       be handed back to its own physics before that flight begins, or it
       spends its death on rails.

       `!foe.alive` is deliberately NOT in this condition. The Harrowing needs
       it because its fuse detonates ON the foe; the reversal is a thing the
       caster does to the FLOOR, and a trail that stops being retraced the
       instant the foe drops would cut the ultimate off mid-picture on exactly
       the casts that won the fight. */
    if (f.ultTrace && (!f.alive || this.over)){
      const sp = Math.hypot(f.vx, f.vy) || 1;
      const k = (f.ultTrace.sp0 || CONFIG.physics.cruise) / sp;
      f.vx *= k; f.vy *= k;
      f.ultTrace = null;
    }
    /* ABOVE THE GUARD, for the reason the Harrowing's fuse is above it. A
       fatal blow arms `killFlight` and `checkEnd` deliberately holds the match
       OPEN while the loser flies into the wall; during those frames `over` is
       false and `move()` is still running. Put this below the guard and the
       winner spends its victory flight flanked by two copies of itself that
       nobody is going to dismiss. harrow_probe [10] forced this once already;
       twinshade_probe drives the same window here. */
    if (f.ultSplit && (!f.alive || !foe.alive || this.over)) this.endSplit(f, true);
    if (!f.alive || this.over) return;
    if (f.ultSplit){
      f.ultSplit.t += dt;
      /* Presentation only, read by drawShadeFire and nothing else.

         `lit` is the ARRIVAL and it is driven by the split hold, not by this
         clock — the fire has to ignite while the cell is dividing, and the
         hold is frozen time in which `ultSplit.t` does not advance. Ramping it
         here instead would leave the whole pause unlit and then snap the flame
         on the frame the hall started moving again.

         What this owns is the GUTTER: the last quarter, so the expiry has a
         warning rather than the copies simply vanishing. */
      const k = f.ultSplit.t / f.ultSplit.dur;
      f.ultSplit.k = (f.ultSplit.lit === undefined ? 1 : f.ultSplit.lit)
                   * Math.min(1, (1 - k) / 0.25 + 0.25);
      if (f.ultSplit.t >= f.ultSplit.dur) this.endSplit(f);
    }
    if (f.ultRadiant){
      /* Daybreak burns down. Unlike the forge there is no return and no
         charge gate: the window IS the payoff, and the next ult is owed
         from the cast like any other. */
      f.ultRadiant.t += dt;
      if (f.ultRadiant.t >= f.ultRadiant.dur) f.ultRadiant = null;
    }
    if (f.ultSlag){
      /* THE FUSE. Everything the split lit is now burning down on the foe,
         and the foe is still moving and still swinging — nothing here stuns
         it. The Crucible owns freeze; a second hold would make two of the
         sixteen the same relic.

         The wielder is NOT protected either. Die during these 0.55 seconds
         and the detonation never comes: `checkEnd` sets over, this drops the
         state, and the cast is spent. That is the price of a payoff that can
         never fizzle for want of stacks. */
      const S = f.ultSlag;
      S.t += dt;
      if (!foe.alive || !f.alive || this.over){ f.ultSlag = null; }
      else if (S.t >= S.fuse){
        f.ultSlag = null;
        this.detonate(f, foe, S.over);
      }
    }
    if (f.ultHarrow){
      /* THE FUSE. Everything that stuck is counting down TOGETHER — Rick
         chose one bloom over a rolling crackle, so there is exactly one clock
         and it lives on the CASTER, not on the blades. Per-blade fuses would
         have given the director no single peak to cut on, which is the one
         thing `cineScore` has never managed to film on an ultimate.

         The drop-on-death cases are handled at the top of this method, above
         the guard that would otherwise hide them. What is left here is the
         clock and the payoff.

         `life` (2.2) is under `fuse` (2.4) by construction, so nothing of
         this cast is still in the air when the clock runs out. Every blade
         has either stuck or expired, and there is no third case — which is
         what makes "all at once" a complete statement rather than a race. */
      const S = f.ultHarrow;
      S.t += dt;
      foe.burdenK = clamp(S.t / S.fuse, 0, 1);   // presentation: the tell
      if (S.t >= S.fuse){
        f.ultHarrow = null;
        this.harrow(f, foe);
      }
    }
    if (f.ultHeat){
      /* The head is lit and the window is burning. The charge does not
         rebuild while it burns — the seventeen seconds are owed from the
         RESOLUTION, bite or fizzle, or a whiff would quietly cost less than
         it says. Nothing else happens here: no pull, no spin-up, no stun
         immunity. The Crucible earns those because it promises contact;
         Ironbloom promises nothing and has to be aimed. */
      const H = f.ultHeat, u = f.w.ult;
      H.t += dt;
      if (H.t >= H.window){
        f.ultHeat = null;
        this.ultFx = { w: f.w.id, kind: "latch", phase: "fizzle",
                       src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                       x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: false,
                       radius: 300, aff: f.aff, t: 0, life: 1.8 };
        SFX.play("ult", { w: "slagheart-fizzle" });
        this.note(`${f.w.name} — the head cools`);
      }
      return;
    }
    if (f.ultForge){
      /* The Crucible is lit. The charge does not rebuild while it burns —
         the fifteen seconds are owed from the RESOLUTION, strike or fizzle,
         or a fizzle would quietly cost four seconds less than it says. */
      const F = f.ultForge, u = f.w.ult;
      F.t += dt;
      /* The wheel cannot be stopped. Hitstun and hex would stall the sweep
         past its own cap on seeds where the foe pounds the wielder — measured
         before this line existed: the strike simply never came. An ultimate
         made of rotation that a stun can hold still is a promise the screen
         breaks, so while the forge is lit the stun burns off. */
      f.stun = 0;
      /* The singularity forms. The pull starts as a lean and ends as a
         sentence: by pullRamp seconds it redirects a cruising ball in a
         fraction of a second — "inescapable" without ever touching the foe's
         position directly. It is every knock in the game, run backwards. */
      if (foe.alive){
        const ramp = Math.min(1, F.t / u.pullRamp);
        const dx = f.x - foe.x, dy = f.y - foe.y, dl = Math.hypot(dx, dy) || 1;
        /* Two terms, both on VELOCITY, never on position. The acceleration is
           the lean — every knock in the game, run backwards. On its own it
           slingshots: measured on seed 202, the foe oscillated 620->168->322
           for four full seconds and the sweep never crossed it. A black hole
           does not oscillate its accretion, it CAPTURES it — so the second
           term bends the foe's velocity toward the infall line at a rate
           that ramps with the same clock, preserving speed. The foe spirals
           in, ballCollision holds it at contact, and the wheel gets it. */
        const acc = u.pullBase + (u.pullMax - u.pullBase) * ramp * ramp;
        foe.vx += (dx / dl) * acc * dt; foe.vy += (dy / dl) * acc * dt;
        const bl = 1 - Math.exp(-ramp * u.pullBlend * dt);
        const sp = Math.hypot(foe.vx, foe.vy);
        foe.vx += ((dx / dl) * sp - foe.vx) * bl;
        foe.vy += ((dy / dl) * sp - foe.vy) * bl;
      }
      if (F.t >= u.cap){
        /* Nothing connected. The forge gutters out and the stacks are KEPT —
           a whiffed Crucible punishes the wielder, not the foe. */
        f.ultForge = null;
        this.ultFx = { w: f.w.id, kind: "forge", phase: "fizzle",
                       src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                       x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: false,
                       radius: u.radius || 300, aff: f.aff, t: 0, life: 0.9 };
        SFX.play("ult", { w: "grudgebearer-fizzle" });
        this.note(`${f.w.name} — the Crucible gutters out`);
      }
      return;
    }
    f.charge += dt;
    if (f.charge >= f.w.ult.charge){ f.charge = 0; this.fireUlt(f, foe); }
  }

  /* ================================================== THE SPIKE STORM ==
     Two phases on one state object.

     WIND-UP. The drive multiplier is applied in tickWeapon (the chain branch
     already had the hook for Reprisal and the Crucible); all this does is
     watch. Release when the head ACTUALLY reaches `at` of CONFIG.chain
     .maxAngVel -- not when a timer says it should have.

     WHAT BREAKS IT. Rick: "Hitstun shouldnt stop the windup. but true stuns
     from ults/abilities should." That distinction is not in `f.stun` -- every
     source writes the same field -- so it is drawn at the APPLICATION SITES
     instead of by reading a timer, and there are exactly three of them:

         hex          STATUS.hex.stunFor      Spellbreaker, Axiom
         ult freeze   u.freeze                Thornwake, Rootfast
         the Harrowing's burst  u.stunBase    Lastlight

     Five relics of twenty, and the counter is therefore NAMEABLE -- a viewer
     can learn who shuts this down, which a stun budget could never have
     offered. Ordinary hitstun and the clank stun are deliberately NOT in that
     list: they still zero the chain drive, so being beaten on DELAYS the
     wind-up, and enough of it runs out `windCap`. Delay is not cancellation.

     Marking the sites rather than adding a second timer is deliberate. A
     parallel `hardStun` clock would be a second source of truth about being
     stunned and the two would drift the first time somebody added a stun.

     `windCap` is not a design knob, it is a hang guard: a cast that can never
     reach the ceiling -- stun-locked, or a future value of spinMul below the
     threshold -- must end rather than sit there for the rest of the match.

     STORM. `acc` carries the fractional remainder so the rate is exact at any
     dt and does not drift with the timestep. The emission angle is `f.headAng`
     itself, which is why the sweep can never run backwards out of the spin:
     it IS the spin. A fixed screen direction would have been wrong in half of
     all matches (`spinDir` is +1 as fighter a and -1 as fighter b) and would
     have reversed mid-fight (`spinDir` flips on clank outcomes). */
  /* THE CONVERSE. Rick's words are quoted in full in the v39 design doc;
     the two sentences this method is are

       "the ball begins to leave behind small orbs ... a line draws the orbs
        together. then at the end of the ult the artifact quickly reverses
        through the line, retracing its path."

     Called deliberately AFTER the fighter loop and BEFORE `ballCollision`.
     `move()` has already integrated gravity and bounced this frame's walls by
     the time this runs, and the retrace OVERWRITES the position it produced.
     That is what makes it rails: an impulse would be a very strong shove that
     a warhammer could out-push, and a line that is sometimes not retraced is
     not a line. `ballCollision` still runs afterwards, so the reversing ball
     shoulders the foe out of its way and the foe can crowd the line -- both
     free, neither written.

     ALL STATE LIVES IN `f.ultTrace`, null on every other relic. */
  tickRetrace(dt){
    if (!this.a.ultTrace && !this.b.ultTrace) return;
    for (const [f, foe] of [[this.a, this.b], [this.b, this.a]]){
      const S = f.ultTrace;
      if (!S) continue;
      const u = f.w.ult;
      S.t += dt;
      /* THE PLASMA OUTLIVES THE RAILS. A wave born on the last sigil needs
         `bloomTravel` more seconds to finish crossing the floor, and the
         caster gets its steering back the instant the reversal ends. Those
         are two different moments, and conflating them either cuts the last
         wave off mid-flight or holds the ball hostage to its own art. */
      this._tickWaves(f, foe, dt);
      if (S.phase === "spent"){
        if (!S.waves.length) f.ultTrace = null;
        continue;
      }

      /* Every sigil still on the floor pulses on ITS OWN clock, in both
         phases. They are laid at different moments so they are deliberately
         out of phase with each other -- one clock for all of them would read
         as a single flashing object that happens to have several bodies. */
      for (const o of S.orbs){
        o.p -= dt;
        if (o.p <= 0){
          o.p += u.pulse;
          S.pulses++;
          this._traceBurst(f, foe, o, u.orbR, u.orbDmg, 0, false);
        }
      }

      if (S.phase === "lay"){
        /* DISTANCE, not time -- Rick's answer, and the failure modes are why.
           Time-gated, a ball pinned in a corner drops every sigil on top of
           itself and the line collapses to a dot with nothing to retrace.
           Distance-gated, that same ball lays almost nothing, which is a
           smaller ultimate rather than an incoherent one. The trail is a
           record of where the fight actually went. */
        S.since += Math.hypot(f.x - S.lx, f.y - S.ly);
        S.lx = f.x; S.ly = f.y;
        if (S.since >= u.gap && S.orbs.length < u.maxOrbs){
          S.since = 0;
          S.orbs.push({ x: f.x, y: f.y, p: u.pulse, born: S.t });
          S.laid++;
          this.ring(f.x, f.y, f.aff.glow, 3, 46, 0.30, 4);
          SFX.play("ult", { w: "foregone-orb", n: S.laid });
        }
        if (S.t >= u.lay){
          S.phase = "trace";
          S.i = S.orbs.length - 1;
          S.t = 0;
          /* THE RAIL CARRIES ITS OWN POSITION, and this is not bookkeeping.
             `move()` has already integrated `f.vx` into `f.x` by the time
             this method runs, and the reversal sets `f.vx` for the ART -- the
             trail, the blur and the weapon's lean all read velocity. Advance
             `f.x` from wherever move() left it and the two integrations ADD:
             measured at 2645 u/s against a `speed` of 1600, so the knob did
             not mean what it said and the reversal was 65% too fast. The rail
             is advanced instead and `f.x` is assigned from it, so move()'s
             contribution is overwritten rather than compounded, and
             `ballCollision` can still shove the ball for a frame without the
             displacement accumulating into the path. */
          S.px = f.x; S.py = f.y;
          /* THE NAME GOES HERE, on the payoff. */
          this.banner = { text: u.name, life: 2.1, max: 2.1, color: f.aff.core,
                          glow: f.aff.glow, w: f.w.id, bx: f.x, by: f.y };
          this.shake = Math.max(this.shake, 26);
          /* CINEMA. The cast beat fired four seconds ago on a promise; this
             is the beat the director should actually be cutting to. */
          this.beat({ kind: "ult", side: f === this.a ? 0 : 1, x: f.x, y: f.y,
                      w: f.w.id, foeHpFrac: foe.hp / foe.maxHp });
          SFX.play("ult", { w: "foregone-reverse" });
        }
        continue;
      }

      /* THE REVERSAL. Newest sigil to oldest, on rails, and NOTHING STOPS IT
         -- Rick's answer, and it is the rule the relic's name is. The trade
         an uninterruptible ultimate has to make is made in the TELEGRAPH: the
         sigils are on the floor and drawn together by the line for four
         seconds before the reversal begins, so what is coming is legible long
         before it arrives.

         The weapon is NOT stopped. The relic does not stop being a scythe
         because it is travelling -- Bloodmill's answer to the same question,
         "the caster keeps fighting throughout" -- so the reversal can connect
         on contact as well as on a bloom, under the rules every swing lives
         under. */
      let budget = u.speed * dt;
      if (S.px === undefined){ S.px = f.x; S.py = f.y; }
      /* Bounded. `speed * dt` is 13 units against a `gap` of 130, so one
         sigil a frame is already the ceiling; the guard exists so that a
         future gap smaller than a frame's travel cannot hang the match. */
      let guard = 0;
      while (budget > 0 && S.i >= 0 && guard++ < 8){
        const o = S.orbs[S.i];
        const dx = o.x - S.px, dy = o.y - S.py;
        const d = Math.hypot(dx, dy);
        if (d <= budget || d < 1e-6){
          S.px = o.x; S.py = o.y;
          budget -= d;
          S.blooms++;
          this._traceBurst(f, foe, o, u.bloomR, u.bloomDmg, u.bloomHex, true);
          S.orbs.splice(S.i, 1);      // spent: it has already fired
          S.i--;
        } else {
          S.px += dx / d * budget;
          S.py += dy / d * budget;
          /* Set for the ART and the facing, not for the motion -- the
             position above is the motion. The trail, the blur and the
             weapon's own lean all read velocity, and a ball crossing the hall
             at 1600 with `vx` left at its cruise would draw as if it were
             standing still. */
          f.vx = dx / d * u.speed;
          f.vy = dy / d * u.speed;
          budget = 0;
        }
      }
      /* The rail is authoritative. Assigned once, after the whole budget has
         been spent, so a frame that crosses several sigils lands where the
         last one left it rather than at the first. */
      f.x = S.px; f.y = S.py;
      if (S.i < 0){
        /* Control returns AT the oldest sigil, and at the speed the ball was
           carrying before the cast rather than at 1600. `move()`'s relax term
           takes 1/0.62 of a second to pay back an overspeed, so handing the
           ball back at retrace speed would fire it across the hall as a
           parting gift the design does not describe. */
        const sp = Math.hypot(f.vx, f.vy) || 1;
        const k = (S.sp0 || CONFIG.physics.cruise) / sp;
        f.vx *= k; f.vy *= k;
        /* SPENT, not gone. The rails are over and the ball is its own again;
           what is left is plasma still crossing the floor, and it still
           connects. `released` is the moment the reversal ENDED --
           `ultTrace` going null is a later event now, and foregone_probe
           measures against `released`. */
        S.released = true;
        S.phase = "spent";
        if (!S.waves.length) f.ultTrace = null;
      }
    }
  }

  /* ONE BURST, TWO SIZES. The small one is a sigil ticking over while it
     waits and carries NO status; the big one is the reversal arriving and is
     the only thing in this ultimate that applies hex.

     NOT routed through `resolveHit`, and `f.hits` is deliberately NOT
     incremented. v38 §7 found the published contact-rate table had been
     counting ultimates as contact and that a type-ordering finding drawn from
     it was wrong. A pulse is not a swing. Damage still goes through `hurt`,
     so a ward eats it exactly like anything else. */
  /* A WAVE IS SPAWNED HERE. IT IS NOT RESOLVED HERE.

     The first cut resolved on the frame the ring was born and then drew a
     ring expanding for half a second afterwards, which is a picture that
     lies about its own rule -- and Rick asking for the wave to be SLOWER
     makes the lie worse, not better: at `bloomTravel` 0.62 the damage would
     land two thirds of a second before the plasma arrived. So the wave
     travels and connects when it passes, which is also the thing worth
     taking from Plasma Field: a band with a POSITION, that you can be
     outside of.

     `_traceBurst` keeps its name because it is still the single site a bloom
     happens at, and foregone_probe wraps it to count them. */
  _traceBurst(f, foe, o, R, dmg, hexN, big){
    const u = f.w.ult, S = f.ultTrace;
    if (!S) return;
    S.waves.push({
      x: o.x, y: o.y, t: 0, big: !!big,
      /* BORN AS A RING, not as a dot. A wave whose radius is smaller than
         its own band cannot draw as a band -- the widest pass swallows the
         hole and it reads as a filled star. Starting at 0.8 band means the
         first frame is already a loop. */
      r0: (big ? (u.bloomBand || 26) : (u.orbBand || 15)) * 0.8, r1: R,
      dur: big ? (u.bloomTravel || 0.62) : (u.orbTravel || 0.70),
      band: big ? (u.bloomBand || 26) : (u.orbBand || 15),
      dmg, hexN, knock: big ? (u.bloomKnock || 210) : (u.orbKnock || 70),
      /* Deterministic per wave -- the crackle has to reproduce frame for
         frame or a re-render is a different video, so the seed is a counter
         out of the sim and never `Math.random()`. */
      seed: (S.waveN = (S.waveN || 0) + 1),
      hit: false,
    });
    if (S.waves.length > 26) S.waves.shift();
    if (big) this.spawnFx(o.x, o.y, f.aff.glow, 12, 200, 0.45, 4);
  }

  /* THE WAVES TRAVEL, AND THEY CONNECT WHEN THEY ARRIVE.

     Linear in radius, deliberately. `drawRings`' shared easing is
     `k*k*0.7 + k*0.3`, which ACCELERATES -- correct for a shockwave leaving
     an impact and wrong for a field being driven outward, which is what this
     is. A constant rate is also the only one a viewer can lead. */
  _tickWaves(f, foe, dt){
    const S = f.ultTrace;
    if (!S || !S.waves.length) return;
    /* THE FIELD HAS A VOICE OF ITS OWN. Every other sound this relic makes
       is fired by an EVENT -- a sigil laid, a wave connecting, the turn --
       so a cast that never touched anything was silent while filling the
       screen. This is the arc frying, on a clock, for as long as there is
       plasma on the floor. `waveN` varies the grain and is a sim counter,
       so a render reproduces. */
    S.arc = (S.arc || 0) - dt;
    if (S.arc <= 0){
      S.arc = f.w.ult.arcEvery || 0.13;
      SFX.play("ult", { w: "foregone-arc", n: S.waveN + S.waves.length });
    }
    for (let i = S.waves.length - 1; i >= 0; i--){
      const w = S.waves[i];
      w.t += dt;
      const k = w.t / w.dur;
      if (k >= 1){ S.waves.splice(i, 1); continue; }
      if (w.hit || !foe.alive) continue;
      const r = w.r0 + (w.r1 - w.r0) * k;
      const d = Math.hypot(foe.x - w.x, foe.y - w.y);
      /* Inside the band, OR still inside the leading edge on the first
         frames -- a foe standing on the sigil is enclosed by the wave before
         it has any radius to speak of, and must not be missed for it. */
      if (Math.abs(d - r) > w.band && !(d < r && w.t <= dt * 2)) continue;
      w.hit = true;
      this._traceHit(f, foe, w, d);
    }
  }

  /* ONE CONNECTION, TWO SIZES. The small wave is a sigil ticking over while
     it waits and carries NO status; the big one is the reversal arriving and
     is the only thing in this ultimate that applies hex.

     NOT routed through `resolveHit`, and `f.hits` is deliberately NOT
     incremented. v38 s7 found the published contact-rate table had been
     counting ultimates as contact and that a type-ordering finding drawn
     from it was wrong. A wave is not a swing. Damage still goes through
     `hurt`, so a ward eats it exactly like anything else. */
  _traceHit(f, foe, w, d){
    const n = Math.round(w.dmg * this.actMods.dmg * foe.dmgTakenMul());
    if (n > 0){
      this.hurt(foe, n, f);
      f.dealt += n;
      foe.flash = 1;
      this.float(foe.x, foe.y - 40, n, w.big ? "#FFF4D0" : f.aff.glow,
                 w.big ? 44 : 26);
    }
    /* THE WEIGHT. Rick: "they should cause knockback and feel like they have
       some weight to them." Outward from the WAVE'S OWN CENTRE -- the sigil,
       not the caster -- because the plasma is the thing pushing and it
       pushes away from where it came from. Priced against
       `CONFIG.combat.knock` (165): a bloom at 210 is heavier than an
       ordinary blow, a sigil's own wave at 70 is a shove.

       x knockMul like every other knock in the game, so this relic is not
       quietly exempted from the one rule knockback has. */
    const dl = d || 1;
    const kx = (foe.x - w.x) / dl, ky = (foe.y - w.y) / dl;
    const power = w.knock * (f.w.knockMul || 1);
    /* THE INWARD COMPONENT IS KILLED FIRST, and that is the difference
       between a knockback and a brake.

       Adding an outward impulse to a ball that is travelling INTO the wave
       just cancels momentum: measured over 566 connections, a bloom left the
       foe 121 units a second SLOWER and a sigil wave 45 slower. Rick, on the
       video: "where is the knockback happening on the rings? i see the green
       ball passing right through them with no knockback." He was right, and
       it was not that the knock never fired -- it was that a ball which
       merely slows does not read as a ball that was hit.

       So the radial velocity is zeroed when it points inward, and only then
       is the impulse applied. A body caught by an expanding front always
       leaves it going outward. This is not a bigger number, it is the
       right direction -- and it is what `resolveHit`'s knock gets for free,
       because a swing that connects has already carried the foe away. */
    const vr = foe.vx * kx + foe.vy * ky;
    if (vr < 0){ foe.vx -= vr * kx; foe.vy -= vr * ky; }
    foe.vx += kx * power; foe.vy += ky * power;
    if (w.hexN){
      foe.apply("hex", w.hexN);
      const first = !this.taught.hex && !!(STATUS.hex && STATUS.hex.tip);
      if (first) this.taught.hex = true;
      this.statusTag(foe.x, foe.y, "hex", first);
    }
    if (w.big){
      foe.ringFlash = 1;
      this.shake = Math.max(this.shake, 18);
      /* ON CONNECTION ONLY. Twelve unconditional freezes inside one second
         would be a third of a second of stopped hall -- and because `step()`
         returns above `tickRetrace` while `hitStop` runs, they would be
         stopping the very reversal that caused them. */
      this.hitStop = Math.max(this.hitStop, 0.035);
    }
    if (f.ultTrace) f.ultTrace.hits++;
    SFX.play("ult", { w: w.big ? "foregone-bloom" : "foregone-tick",
                      n: w.seed });
  }

  tickSpinStorm(dt){
    if (!this.a.ultSpin && !this.b.ultSpin) return;
    const MAXV = CONFIG.chain.maxAngVel;
    for (const [f, foe] of [[this.a, this.b], [this.b, this.a]]){
      const S = f.ultSpin;
      if (!S) continue;
      const u = f.w.ult;
      S.t += dt;
      S.peak = Math.max(S.peak, Math.abs(f.headAngVel));

      if (S.phase === "wind"){
        if (f.stun > 0) S.stun += dt;        // reported, not a break condition
        /* THE HANG GUARD, and it is also a real outcome. Hitstun zeroes the
           chain drive (that behaviour predates this relic), so a caster being
           beaten on winds up slowly -- and if it is beaten on hard enough the
           head never reaches the ceiling at all. That is a legitimate way to
           lose the cast and it is announced like any other. */
        if (S.t > u.windCap){ this.breakSpin(f, "it never gets up to speed"); continue; }
        if (Math.abs(f.headAngVel) >= MAXV * u.at){
          S.phase = "storm"; S.wind = S.t; S.t = 0;
          this.shake = Math.min(38, this.shake + 10);
          SFX.play("ult", { w: "redflail-release" });
        }
        continue;
      }

      /* STORM. */
      S.acc += u.rate * dt;
      while (S.acc >= 1){
        S.acc -= 1;
        this.spawnSpike(f);
        S.n++;
      }
      /* THE MILL'S RHYTHM. Forty spikes a second cannot each have a voice --
         that is a machine gun, not a mill. One wet beat every `chuff` seconds
         is what a turning thing sounds like, and `chuff` is deliberately not a
         multiple of 1/rate: phase-locked, the two would fuse into a single
         buzz instead of reading as a turning thing throwing a spraying one. */
      S.chuff -= dt;
      if (S.chuff <= 0){
        S.chuff += u.chuff || 0.23;
        SFX.play("ult", { w: "redflail-mill", n: S.n });
      }
      if (S.t >= u.dur) f.ultSpin = null;
    }
  }

  /* THE DRIVE, RAMPED. Reprisal's `spinMul` is a step change and that is right
     for a bow, whose telegraph is the BANNER sitting on a committed point. A
     flail's telegraph is the head itself, so the head has to be seen arriving.

     Measured before this existed: with the multiplier applied as a step, the
     wind-up ran a MEDIAN OF 0.21 SECONDS -- twenty-five frames -- because
     `CONFIG.chain.spring` is 26 against `follow` 5.2, and the spring drags the
     head onto a new drive almost at once. The release condition was fine; there
     was simply nothing to watch. `ramp` is the fix and it keeps the condition
     physical rather than replacing it with a timer: the head still fires when
     it ACTUALLY reaches the ceiling, it just now takes a while to get there.

     Read from `S.t` rather than accumulated on the state, so it cannot depend
     on whether tickWeapon runs before or after tickSpinStorm in a frame. */
  ultSpinMul(f){
    const S = f.ultSpin, u = f.w.ult;
    const full = u.spinMul || 1;
    /* THE STORM IS ITS OWN NUMBER. The wind-up must reach the ceiling or the
       ultimate never fires, so `spinMul` is load-bearing there; the storm has
       no such constraint and the arm speeding up through it is a side effect
       of the hook rather than a design. `stormMul` defaults to `spinMul`, so
       omitting it reproduces the behaviour this comment is describing. */
    if (!S) return full;
    if (S.phase === "storm") return u.stormMul === undefined ? full : u.stormMul;
    return 1 + (full - 1) * Math.min(1, S.t / (u.ramp || 1));
  }

  /* THE CAST IS LOST. Called from the three true-stun sites and from the
     wind-up's own cap. The bar is already spent -- `tickCharge` zeroed it
     before `fireUlt` ran -- so this relic gets nothing for it, which is the
     whole point of a counter.

     ANNOUNCED, never silent. The Harrowing shipped with an 11.5% dud rate that
     nobody could see, and the fix that mattered was not the rate. `reason` is
     carried into the note so the two ways to lose a cast do not read as one. */
  breakSpin(f, reason){
    if (!f.ultSpin) return;
    f.ultSpin = null;
    f.ultBroke = 0.9;                       // presentation only
    this.spawnFx(f.headX, f.headY, f.aff.core, 16, 210, 0.55, 3.2);
    SFX.play("ult", { w: "redflail-break" });
    this.note(`${f.w.name} — ${reason}`);
  }

  /* A spike leaves the HEAD, travelling along the head's own bearing -- flung
     off the end of the chain, which is the picture, and radial rather than
     tangential because that is the one Rick signed off on the schematic of.

     Deliberately NOT `spawnShot`: that function needs `f.w.shot`, and this
     relic has none. A `shot` block would also make `relicShot()` advertise on
     the fight card that this weapon shoots, and it does not -- its ultimate
     does. The card must not learn to lie for the sake of reusing a function.

     `dmgMul` prices the spike against the WEAPON's damage, the same conversion
     Ironbloom's pop uses (`s.pop / Math.max(0.01, src.w.dmg)`), so `spikeDmg`
     means what it says no matter what the tuner does to `dmg`. Everything else
     -- crit, jitter, the sunder multiplier, hemorrhage, hit stop, hitstun and
     `self.hits++` for verify.py's floor -- comes free from resolveHit, which
     is what the shot path already routes through. */
  spawnSpike(f){
    const u = f.w.ult;
    if (this.shots.length >= CONFIG.shot.maxLive) this.shots.shift();
    const a = f.headAng;
    const ca = Math.cos(a), sa = Math.sin(a);
    const off = (f.w.artW || 40) * 0.42;
    this.shots.push({
      own: f === this.a ? "a" : "b",
      x: f.headX + ca * off, y: f.headY + sa * off,
      x0: f.headX, y0: f.headY, spd0: f.speed, t0: this.t,
      vx: ca * u.spikeSpd, vy: sa * u.spikeSpd,
      r: u.spikeR, life: u.spikeLife, max: u.spikeLife, grav: 0,
      dmgMul: u.spikeDmg / Math.max(0.01, f.w.dmg),
      aff: f.aff, a, spike: true,
    });
  }

  fireUlt(f, foe){
    const u = f.w.ult;
    f.ultsFired++;
    /* The subtitle is gone. Rick: "we shouldn't have to tell the user that
       they are happening or what they do with text." The set-piece in
       drawUltUnder/drawUltOver is now the explanation, which is the higher
       form of rule 1 — the mechanic and its explanation still ship together,
       the explanation just stopped being a caption. The name stays, because a
       name is characterisation, not instruction; and `ult.tip` stays on the
       data (and on the intro card), because that is teaching *before*. */
    /* `w` is what tells the renderer which arrival to play. A seal has no
       relic, so it keeps the plain treatment. */
    /* Anchored to the set-piece's own centre, not to the top of the hall.
       Three of the six bloom on the quarry (the pillar falls on them, the vines
       wrap them, the cage closes on them) and three bloom on the caster (the
       fang ring, the fissures, the grave). The name goes where the thing is. */
    /* Dawnbringer left this map with Judgement: the pillar fell on the
       quarry, but Daybreak ignites on the CASTER, so its name goes there. */
    const onTarget = { thornwake:1, spellbreaker:1, emberedge:1 }[f.w.id];
    this.banner = { text: u.name, life: 2.1, max: 2.1, color: f.aff.core,
                    glow: f.aff.glow, w: f.w.id,
                    bx: onTarget ? foe.x : f.x, by: onTarget ? foe.y : f.y };
    this.note(`${f.w.name} — ${u.name}`);
    this.shake = 32;   // Mountainfall's 52 moved to the Crucible's strike
    this.hitStop = Math.max(this.hitStop, 0.08);
    this.beat({ kind: "ult", side: f === this.a ? 0 : 1, x: f.x, y: f.y,
                w: f.w.id, foeHpFrac: foe.hp / foe.maxHp });   // CINEMA (demo)
    SFX.play("ult", { w: f.w.id });

    const dist = Math.hypot(foe.x - f.x, foe.y - f.y);
    const inRange = u.radius ? dist <= u.radius : true;

    /* The set-piece. Presentation only: nothing in the simulation reads it,
       and it is advanced by the decay paths so it keeps playing through the
       hit stop the cast itself caused. */
    this.ultFx = {
      w: f.w.id, kind: u.kind, src: f === this.a ? "a" : "b",
      tgt: f === this.a ? "b" : "a",
      x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: inRange,
      radius: u.radius || 300, aff: f.aff, t: 0,
      life: { dawnbringer: 1.6, widowmaker: 1.3, grudgebearer: 1.7,
              thornwake: 2.4, gravemourn: 1.6, spellbreaker: 1.4,
              /* The four new greatswords. Rootfast is long because it is a
                 FREEZE and the art has to still be on screen while the hold
                 it is explaining is in force — Bramblesnare is 2.4 for the
                 same reason. The other three are strikes and end. */
              oathwound: 1.5, heartwood: 2.2, nightfell: 1.4,
              axiom: 1.5,
              /* The last six. Reprisal is the outlier and it is not a strike:
                 an aimedshot holds a DRAW until the bow's facing comes round,
                 so its art has to still be on screen when the arrow finally
                 leaves. The rest end. */
              ironhail: 1.3, lightkeeper: 1.5, farwarden: 2.6,
              aureole: 1.6, censer: 1.6,
              emberedge: 1.5, slagheart: 4.9 }[f.w.id] || 1.5,
    };

    /* An aimed shot does not resolve in this frame -- it starts a DRAW, and
       tickFire releases it. Everything below this point (the pull, the
       knock, the freeze, the heal, the damage) is skipped, because an
       ultimate that had already dealt its damage before the arrow left
       would make the arrow decorative. */
    if (u.kind === "aimedshot"){
      /* THE BOW DOES NOT AIM. IT SPINS FASTER UNTIL IT IS RIGHT.

         Rick: "the ball gains massive weapon rotation speed until the bow
         is pointed at the enemy and then fires. after firing the rotation
         speed returns to normal."

         This is the version that ships, and it replaces a worse one. The
         first build solved a launch angle inside fireUlt and then stood
         there for 0.75s -- the aiming was a number nobody could see, and
         the wind-up was a delay pretending to be a mechanic.

         Under this, the ultimate breaks NO RULE the basic shot lives
         under. The bow still discharges along f.theta. There is no
         steering, no snapping, no homing, and nothing is ever rotated to
         a target. All that changes is that the weapon spins several times
         faster and waits for its own facing to come round -- so the aim is
         a thing the viewer WATCHES HAPPEN rather than a thing the maths
         did offscreen. It is also self-announcing: a weapon spinning at
         three and a half times its own rate with the string at full draw
         cannot be mistaken for anything else in this game.

         `minT` is the only arbitrary number and it is a legibility floor,
         not a mechanic: without it the bow fires on whatever crossing
         happens first and the wind-up can be over in a tenth of a second.
         The string reaches full draw exactly as the bow becomes able to
         fire, so the two clocks say the same thing. */
      f.ultDraw = { t: 0, minT: u.draw || 0.55, cap: (u.draw || 0.55) + 1.1 };
      /* No banner yet. The name goes where the arrow LANDS, and nothing
         knows where that is until the bow comes round. Rick asked for the
         word on the landing point; loose() puts it there. */
      this.banner = null;
      return;
    }

    /* DAYBREAK RESOLVES NOTHING HERE EITHER — and unlike every ultimate
       before it, it never will: no damage, no heal, no status on the cast.
       The old Judgement was a 34-hp subsidy measured at +9 to +32pp in every
       matchup, paid for with the weakest blade in the class. This is that
       budget, moved onto the FIGHT: for `dur` seconds every landed hit
       sprays sparks, and what the sparks do depends on who touches them. */
    /* SLAGBURST RESOLVES NOTHING HERE. It splits, and then it waits.

       The split is the whole reason this ultimate works: measured over 1893
       casts, 26.3% of them find ZERO Sunder on the foe, so a detonation of
       "whatever is there" is a dud one time in four. The cast drives its own
       `split` stacks into the shell first, which makes 3 the floor and keeps
       9 the ceiling for a wielder who has been fighting. */
    /* THE HARROWING RESOLVES NOTHING HERE. It throws.

       Every piece of this ultimate is an object this engine already had. The
       blades are `shots` — clankable, bouncing, missable, drawn by the same
       loop. The burden is the fall term and moveMul. The fuse is Slagburst's.
       The sparks are DAYBREAK'S OWN: `spawnSpark` reads `sparkGrace` and
       `sparkLife` off `f.w.ult`, so what this leaves behind is the same field
       Dawnbringer leaves, and a fix to one is a fix to both. Nothing here is
       a second implementation of anything.

       The angles come off `f.theta` — the weapon's own facing — with
       deterministic jitter from `shellHash`, NOT from `this.rng()`. Same rule
       Ironbloom's splinters follow: a relic that is not in the match must not
       be able to perturb the draw order of one that is. */
    if (u.kind === "harrow"){
      const R = CONFIG.physics.ballR;
      const N = u.scythes || 12;
      for (let i = 0; i < N; i++){
        const a = f.theta + (i / N) * TAU + (shellHash(7717, i) - 0.5) * 0.28;
        const spd = u.speed * (0.86 + shellHash(7723, i) * 0.28);
        if (this.shots.length >= CONFIG.shot.maxLive) this.shots.shift();
        this.shots.push({
          own: f === this.a ? "a" : "b",
          /* Clear of the shell AND armed. The trap the splinters hit and
             wrote down: a projectile spawned inside `R + s.r` resolves on the
             frame it is born, which would turn the spray into a nova. */
          x: f.x + Math.cos(a) * (R + (u.r || 14) + 10),
          y: f.y + Math.sin(a) * (R + (u.r || 14) + 10),
          arm: u.arm || 0.10,
          x0: f.x, y0: f.y, spd0: f.speed, t0: this.t,        // CINEMA (demo)
          vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
          r: u.r || 14, life: u.life || 2.2, max: u.life || 2.2, grav: 0,
          /* The landing, priced as a multiplier so it flows through
             resolveHit exactly like every other hit on this relic — one
             damage number, sized by the existing rule. */
          dmgMul: (u.landDmg || 4.5) / Math.max(0.01, f.w.dmg),
          bounce: u.bounce === undefined ? 2 : u.bounce,
          sc: true, spin: (i % 2 ? 1 : -1) * (u.spinRate || 15),
          aff: f.aff, a,
        });
      }
      f.ultHarrow = { t: 0, fuse: u.fuse };
      this.ultFx.phase = "cast";
      this.ultFx.n = N;
      /* THE FX CLOCK RUNS AT ~2x SIM TIME on the normal path — every `life`
         in this engine is in half-seconds. The cast's tell has to still be on
         screen when the fuse blows, so 2x the fuse plus margin. */
      this.ultFx.life = u.fuse * 2 + 0.5;
      /* No banner. The name goes on the BLOOM, where the thing happens — the
         aimed shot, the Crucible and Ironbloom all place it the same way. You
         do not caption a promise. */
      this.banner = null;
      SFX.play("ult", { w: "lastlight-throw" });
      return;
    }

    /* THE THREEFOLD RESOLVES NOTHING HERE. It does not damage, it does not
       apply, it does not reach for the foe at all — it puts two more of this
       relic on the floor and turns on lifesteal for all three. Everything that
       follows is done by ordinary hits landed by ordinary fighters, which is
       why the ult has no `dmg` and no `apply` field to tune. */
    if (u.kind === "split"){
      const R = CONFIG.physics.ballR, A = CONFIG.arena, n = this.inset;
      const loX = n + R, hiX = A.w - n - R, loY = n + R, hiY = A.h - n - R;
      f.ultSplit = { t: 0, dur: u.dur, k: 0, lit: 0 };
      f.lifesteal = u.lifesteal;
      /* THE DAUGHTERS ARE BORN INSIDE THE PARENT AND WALK OUT OF IT.
         Rick: "like a cell replicating". So each one is created AT the
         caster's centre with no velocity, carrying an `emerge` record of where
         it is going, and the hold branch in step() lerps it there over a
         second of stopped hall. Nothing about the placement search changed —
         it just runs now to decide the DESTINATION rather than the spawn. */
      const head = Math.atan2(f.vy, f.vx);
      const born = [];
      for (let i = 0; i < u.shades; i++){
        const s = new Fighter(f.w, f.side, this.rng);
        s.shade  = { owner: f };
        s.noUlt  = true;
        s.lifesteal = u.lifesteal;
        s.maxHp  = s.hp = Math.round(CONFIG.combat.baseHP * u.hp);
        s.hpGhost = s.hp;
        s.born   = 0;
        /* PLACED CLEAR OF THE CASTER'S OWN SHELL, AND A CLAMP IS NOT ENOUGH
           TO DO IT. A body left inside `R * 2` resolves a collision on the
           frame the hall restarts and the split fires the pair out like a nova
           — the splinters' trap, one object class along.

           The first cut clamped the ideal position into the hall, which is
           correct only away from a wall: cast with the caster's back to one
           and the clamp drags the daughter straight back into the shell it
           came out of. Every forced cast in the harness happened at frame one
           in open floor and passed; the check only failed once it was shown
           NATURAL casts, which happen wherever the fight happens to be.

           So the angle is SEARCHED. Twelve candidates off the ideal,
           alternating either side so the pair still comes out abreast where
           there is room, and the first that fits the hall untouched wins.
           Deterministic — no rng, because a relic not in a match must not
           perturb the draw order of one that is. */
        const want = head + TAU * (i + 1) / (u.shades + 1);
        let a = want, px = 0, py = 0, placed = false;
        for (let t = 0; t < 12 && !placed; t++){
          const off = (t === 0) ? 0
                    : (TAU / 12) * Math.ceil(t / 2) * (t % 2 ? 1 : -1);
          a = want + off;
          px = f.x + Math.cos(a) * R * u.spread;
          py = f.y + Math.sin(a) * R * u.spread;
          placed = px >= loX && px <= hiX && py >= loY && py <= hiY;
        }
        s.x = f.x; s.y = f.y;
        s.vx = 0;  s.vy = 0;
        s.emerge = { x0: f.x, y0: f.y,
                     x1: placed ? px : clamp(px, loX, hiX),
                     y1: placed ? py : clamp(py, loY, hiY), a };
        /* Out of phase with the parent and with each other, or three balls
           spin as one object and the hall reads as a rendering error. */
        s.theta   = f.theta + TAU * (i + 1) / (u.shades + 1);
        s.spinDir = f.spinDir;
        this._initChain(s);
        this.shades.push(s);
        born.push(s);
      }
      this.splitHold = { src: f === this.a ? "a" : "b", t: 0,
                         dur: u.hold === undefined ? 1.0 : u.hold };
      this.ring(f.x, f.y, f.aff.core, 6, R * 4.4, 0.7, 8);
      this.shake = Math.max(this.shake, 22);
      /* NO SFX.play HERE. `fireUlt` already fired one above the kind
         dispatch with `w: f.w.id`, so the sound is keyed on the RELIC ID and
         a second call here would play two. See the SFX branch. */
      return;
    }
    if (u.kind === "detonate"){
      if (!inRange){
        /* Out of range: the nova's own rule, kept. Nothing splits, nothing
           lights, and the set-piece says so rather than playing a burst that
           did not happen. */
        this.ultFx.phase = "cold";
        this.ultFx.life = 0.55;
        return;
      }
      /* THE OVERFLOW, and why it lives on the fuse state and not on the foe.
         `apply` caps at maxStacks 6, so a foe already sitting on five banked
         stacks would silently lose two of the three the split drives in, and
         a wielder who had been fighting hardest would be punished for it.
         The remainder is carried on the state object the fuse already owns —
         which means a fuse that gets dropped (either fighter dies) takes its
         bookkeeping with it. A counter parked on the foe would survive the
         drop and inflate the NEXT Slagburst by a stale amount. */
      const before = foe.stacks("sunder");
      foe.apply("sunder", u.split);
      const over = before + u.split - foe.stacks("sunder");
      const firstTeach = !this.taught.sunder && !!(STATUS.sunder && STATUS.sunder.tip);
      if (firstTeach) this.taught.sunder = true;
      this.statusTag(foe.x, foe.y, "sunder", firstTeach);
      f.ultSlag = { t: 0, fuse: u.fuse, split: u.split, over };
      this.ultFx.phase = "fuse";
      /* THE FX CLOCK RUNS AT 2x SIM TIME. Measured, after the filmstrip
         showed a dead frame at 0.58s — no ring, no cracks, and the burst
         still to come. `ultFx.t` is advanced by BOTH decay paths, so a
         `life` of 0.9 is 0.45 seconds of match time, not 0.9. Every `life`
         number in this engine is in half-seconds and always has been; the
         1.3-2.6 table above reads as 0.65-1.3s on screen.

         So the tell needs (fuse + the cast's own hit-stop) x 2 = 1.26 to
         reach its own detonation, plus margin. Nothing else in this file
         needs converting: the burst's art constants were authored against
         the filmstrip, which means they were authored in fx units already. */
      this.ultFx.life = u.fuse * 2 + 0.45;
      /* The fuse draws the TRUE count, not the capped one, so the cracks the
         viewer counts during the tell equal the shards the burst throws. */
      this.ultFx.n = foe.stacks("sunder") + over;
      return;
    }

    if (u.kind === "radiant"){
      f.ultRadiant = { t: 0, dur: u.dur || 5.0 };
      this.ultFx = { w: f.w.id, kind: "radiant",
                     src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: true,
                     radius: 300, aff: f.aff, t: 0, life: (u.dur || 5.0) + 0.3 };
      return;
    }

    /* THE CRUCIBLE DOES NOT RESOLVE HERE. It lights. The ball glows with the
       fires the hammer was forged in, the hammer becomes a wheel, and the
       foe is drawn in — the payoff is a MELEE CONNECT under the same rules
       every swing lives under: tickHits finds it, resolveHit prices it.
       Everything below this block is skipped for the same reason the aimed
       shot skips it: an ultimate that had already paid out before the
       hammer landed would make the hammer decorative. */
    if (u.kind === "forge"){
      f.ultForge = { t: 0, minT: u.minT || 1.0, cap: u.cap || 4.0 };
      this.ultFx = { w: f.w.id, kind: "forge", phase: "wind",
                     src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: true,
                     radius: u.radius || 300, aff: f.aff, t: 0,
                     life: (u.cap || 4.0) + 0.4 };
      /* No banner yet. The name goes on the strike, where the bow already
         put its own — you do not caption a promise. */
      this.banner = null;
      return;
    }

    /* Every bolt is a real projectile: clankable, travelling, missable.
       An ultimate that cheated the rules its own weapon lives under would
       teach the viewer that the rules are decorative. */
    /* IRONBLOOM DOES NOT RESOLVE HERE. The head lights and a window opens.
       Everything below is skipped for the reason the aimed shot and the
       Crucible skip it: an ultimate that had already paid out before the
       head bit would make the bite decorative. No banner — the name goes on
       the blast. No pull, no assist, no legibility floor: this one you land
       yourself or you do not. */
    if (u.kind === "latch"){
      f.ultHeat = { t: 0, window: u.window || 4.5 };
      this.ultFx = { w: f.w.id, kind: "latch", phase: "lit",
                     src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: true,
                     radius: 300, aff: f.aff, t: 0,
                     /* NORMAL path: 2x. See FX_CLOCK in the builder. */
                     life: ((u.window || 4.5) + 0.4) * 2 };
      this.banner = null;
      return;
    }

    /* THE SPIKE STORM does not happen here. `fireUlt` STARTS it, and what it
       starts is a wind-up whose end is a physical state of the weapon rather
       than a clock -- Reprisal's precedent ("the bow fires when its facing
       comes round"), and the reason the telegraph is free: the head visibly
       spinning up IS the charge meter, the same virtue Ward's plate brightness
       has. No second HUD element exists or is needed. */
    /* THE CONVERSE RESOLVES NOTHING HERE. It starts a trail. Everything
       below this point is skipped for the reason the aimed shot, the
       Crucible and Ironbloom skip it: an ultimate that had already paid out
       before the reversal would make the reversal decorative -- and the
       reversal is the entire ultimate. */
    if (u.kind === "retrace"){
      f.ultTrace = { phase: "lay", t: 0, orbs: [], waves: [], i: -1, since: 0,
                     lx: f.x, ly: f.y, sp0: Math.hypot(f.vx, f.vy),
                     blooms: 0, pulses: 0, laid: 1, hits: 0, waveN: 0,
                     released: false };
      /* THE FIRST SIGIL IS WHERE THE CAST HAPPENED, and it is not a
         convenience. Orbs are laid by DISTANCE, so a caster killed, cornered
         or pinned before it travels `gap` would otherwise hold an ultimate
         made of nothing and a retrace with no destination -- the picture
         simply would not happen. It also makes the LAST thing the reversal
         reaches the place the ultimate was called from, which is the sentence
         the mechanic is. */
      f.ultTrace.orbs.push({ x: f.x, y: f.y, p: u.pulse, born: 0 });
      this.ultFx.phase = "lay";
      /* NORMAL path: the fx clock runs at 2x sim time. See the note on
         Slagburst's fuse -- every `life` in this engine is in half-seconds. */
      this.ultFx.life = (u.lay + 1.4) * 2;
      /* No banner. The name goes on the REVERSAL, where the thing happens --
         the Crucible, Ironbloom and the aimed shot all place it the same way.
         You do not caption a promise. */
      this.banner = null;
      return;
    }
    if (u.kind === "spinstorm"){
      f.ultSpin = { phase: "wind", t: 0, stun: 0, acc: 0, n: 0, peak: 0, chuff: 0 };
    }
    if (u.kind === "volley" && f.w.shot){
      const N = u.shots || 12, span = u.spread || TAU;
      for (let i = 0; i < N; i++)
        this.spawnShot(f, f.theta + (i / N) * span - (span >= TAU ? 0 : span/2));
    }
    if (u.kind === "pull"){
      const dx = f.x - foe.x, dy = f.y - foe.y, dl = Math.hypot(dx,dy) || 1;
      foe.vx += (dx/dl) * 620; foe.vy += (dy/dl) * 620;
    }
    if (u.knock && inRange){
      const dx = foe.x - f.x, dy = foe.y - f.y, dl = Math.hypot(dx,dy) || 1;
      foe.vx += (dx/dl) * u.knock; foe.vy += (dy/dl) * u.knock;
    }
    if (u.freeze && inRange){
      foe.stun = Math.max(foe.stun, u.freeze);
      this.breakSpin(foe, "rooted mid-wind-up");   // a TRUE stun
    }
    if (u.heal){
      const before = f.hp;
      f.hp = Math.min(f.maxHp, f.hp + u.heal);
      const got = Math.round(f.hp - before);
      if (got >= 1){
        f.mend = 1.6;
        this.float(f.x, f.y - 46, "+" + got, "#8FE3A0", 30 + got * 0.7);
      }
    }

    if (inRange && u.dmg){
      const dmg = Math.round(u.dmg * this.actMods.dmg * foe.dmgTakenMul());
      this.hurt(foe, dmg, f);
      foe.flash = 1;
      foe.ringFlash = 1;
      f.dealt += dmg;
      this.float(foe.x, foe.y - 40, dmg, "#FFF4D0", 46);
      this.spawnFx(foe.x, foe.y, f.aff.core, 34, 300, 0.7, 5);
      this.ring(foe.x, foe.y, f.aff.glow, 6, 130, 0.4, 5);
      for (const [k, n] of Object.entries(u.apply || {})){
        foe.apply(k, n);
        const first = !this.taught[k] && !!(STATUS[k] && STATUS[k].tip);
        if (first) this.taught[k] = true;
        this.statusTag(foe.x, foe.y, k, first);
      }
    }
  }

  /* IRONBLOOM DETONATES. Called only from the latch branch of step(), on the
     frame the hold runs out, with the world still frozen around it.

     The blast itself is deliberately modest — `u.dmg`, priced through hurt()
     so a ward eats it like anything else. The ultimate's real weight is the
     nine splinters it leaves in the hall, which is what makes it Slagheart's
     and not the Crucible's: one is a single enormous strike, this is twenty
     seconds of Sunder arriving from directions nobody chose. */
  blast(L){
    const src = this[L.src], foe = this[L.tgt], u = src.w.ult;
    this.latch = null;
    const R = CONFIG.physics.ballR;
    const bx = foe.x, by = foe.y;

    if (foe.alive){
      const dmg = Math.round(u.dmg * this.actMods.dmg * foe.dmgTakenMul());
      this.hurt(foe, dmg, src);
      foe.flash = 1; foe.ringFlash = 1;
      src.dealt += dmg; src.hits++;
      this.float(foe.x, foe.y - 40, dmg, "#FFF4D0", 46);
      const fatal = foe.hp <= 0;
      if (fatal) this.finisher = 1.0;
      /* Sent flying, over the speed ceiling on purpose — `launch` raises the
         vmax clamp and the relax term spends the next second and a half
         paying it back, which from inside the physics is what several fast
         bounces off the arena looks like. The direction is away from the
         head, because that is where the charge was. */
      const kx = foe.x - src.x, ky = foe.y - src.y, kl = Math.hypot(kx, ky) || 1;
      const p = fatal ? u.launchFatal : u.launch;
      foe.vx += (kx / kl) * p; foe.vy += (ky / kl) * p;
      foe.launch = Math.max(foe.launch || 0, 1.8);
      if (!fatal) foe.takeHitstun(dmg);
    }

    /* the splinters. Deterministic angles off shellHash — no rng draw, so a
       relic that is not in the match cannot be perturbed by one that is. */
    const N = u.shards || 9;
    for (let i = 0; i < N; i++){
      const a = (i / N) * TAU + (shellHash(6151, i) - 0.5) * 0.55;
      const spd = u.shardSpd * (0.78 + shellHash(6173, i) * 0.5);
      if (this.shots.length >= CONFIG.shot.maxLive) this.shots.shift();
      this.shots.push({
        /* Clear of the shell AND armed. The first build spawned these at
           R+6 — inside `R + s.r`, the hit radius — so all nine resolved on
           the foe on the frame they were born: ~50 damage and six Sunder in
           one instant, which is a burst and the exact opposite of the design.
           `arm` is the honest fix: a splinter has to leave the blast before
           it can bite, and what catches the foe afterwards is a RICOCHET. */
        own: L.src, x: bx + Math.cos(a) * (R + (u.shardR || 11) + 10),
        y: by + Math.sin(a) * (R + (u.shardR || 11) + 10),
        arm: u.shardArm || 0.12,
        x0: bx, y0: by, spd0: 0, t0: this.t,                    // CINEMA (demo)
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        r: u.shardR || 11, life: u.shardLife || 2.6, max: u.shardLife || 2.6,
        grav: 0, dmgMul: (u.shardDmg || 5.5) / Math.max(0.01, src.w.dmg),
        bounce: u.shardBounce || 3,
        shard: true, pop: u.pop || 7, popR: u.popR || 104,
        over: { onHit: { sunder: u.shardSunder || 1 } },
        aff: src.aff, a,
      });
    }

    this.shake = 54;
    this.hitStop = Math.max(this.hitStop, 0.16);
    this.spawnFx(bx, by, "#FFB347", 44, 520, 0.8, 6);
    this.spawnFx(bx, by, "#FFF4D0", 26, 700, 0.55, 4);
    this.ring(bx, by, "#FFF4D0", 8, 210, 0.5, 9);
    this.ring(bx, by, "#FF6A1A", 5, 150, 0.42, 6);
    this.banner = { text: u.name, life: 2.1, max: 2.1, color: src.aff.core,
                    glow: src.aff.glow, w: src.w.id, bx, by };
    this.ultFx = { w: src.w.id, kind: "latch", phase: "blast",
                   src: L.src, tgt: L.tgt, x: bx, y: by, tx: bx, ty: by,
                   hit: true, radius: 300, aff: src.aff, t: 0, life: 3.0 };
    this.beat({ kind: "ult", side: L.src === "a" ? 0 : 1, x: bx, y: by,
                w: src.w.id, foeHpFrac: Math.max(0, foe.hp) / foe.maxHp });
    SFX.play("ult", { w: "slagheart-blast" });
    this.note(`${src.w.name} — Ironbloom`);
  }

  /* ------------------------------------------------------------ SLAGBURST --
     The fuse reaches the powder. Called only from tickCharge, only with both
     fighters alive, and it is the ONLY place a detonate ult resolves. */
  detonate(f, foe, over){
    const u = f.w.ult;
    /* `banked` is what is on the shell right now — the split the cast drove
       in, plus anything the wielder landed during the fuse itself, which is
       a real and deliberate reward for keeping the pressure on while it
       burns. `over` is the part the status cap swallowed. The count runs
       UNCAPPED past the ceiling of six, because the bar capping is a display
       rule and this is an arithmetic one: a wielder who arrived with six
       banked stacks blew a nine-stack charge and the screen owes it nine
       shards. */
    const n = foe.stacks("sunder") + (over || 0);
    /* CONSUMED, then priced. Not the other way round. A detonation whose
       damage is also multiplied by dmgTakenMul's share of the stacks it just
       ate would pay itself twice, and at nine stacks the curve leaves the
       building. The stacks are FUEL here, not a debuff being cashed. */
    delete foe.status.sunder;
    const raw = u.dmgBase + u.dmgPer * n;
    const dmg = Math.round(raw * this.actMods.dmg * foe.dmgTakenMul());
    this.hurt(foe, dmg, f);
    foe.flash = 1;
    foe.ringFlash = 1;
    f.dealt += dmg;
    this.float(foe.x, foe.y - 40, dmg, "#FFD08A", 46 + n * 2);
    this.spawnFx(foe.x, foe.y, "#FFB863", 30 + n * 4, 300 + n * 26, 0.8, 5);
    this.ring(foe.x, foe.y, "#E8761A", 7, 150 + n * 16, 0.5, 5);
    /* The throw scales on the same n as everything else, so "that one was
       big" and "that one threw it into the wall" are the same sentence. */
    const dx = foe.x - f.x, dy = foe.y - f.y, dl = Math.hypot(dx, dy) || 1;
    const k = u.knockBase + u.knockPer * n;
    foe.vx += (dx / dl) * k; foe.vy += (dy / dl) * k;
    this.shake = Math.max(this.shake, 26 + n * 3.4);
    this.hitStop = Math.max(this.hitStop, 0.06 + n * 0.008);
    SFX.play("ult", { w: "emberedge-burst", n });
    /* The burst is its own set-piece, stamped where the shell actually was.
       ONE SHARD PER CONSUMED STACK — the count is the mechanic, on screen. */
    this.ultFx = { w: f.w.id, kind: "detonate", phase: "burst",
                   src: f === this.a ? "a" : "b", tgt: f === this.a ? "b" : "a",
                   x: foe.x, y: foe.y, tx: foe.x, ty: foe.y, hit: true,
                   radius: u.radius || 230, aff: f.aff, t: 0, n,
                   life: 1.45 };
    this.beat({ kind: "ult", side: f === this.a ? 0 : 1, x: foe.x, y: foe.y,
                w: f.w.id, foeHpFrac: foe.hp / foe.maxHp });
  }

  /* Every blade out of the shell, and every trace of what they weighed. One
     place, because the burden is four fields and a partial clear is a ball
     that stays slow for the rest of the match. */
  unstick(f){
    f.stuck = [];
    f.burden = 0; f.burdenMove = 0; f.burdenMass = 0; f.burdenK = 0;
  }

  /* ---------------------------------------------------------- THE HARROWING --
     The fuse reaches the blades. Called only from tickCharge, only with both
     fighters alive, and it is the ONLY place a harrow ult resolves.

     `n` is what actually stuck, and EVERYTHING here scales on it — damage,
     knock, the raised speed ceiling, the stun floor, the hit stop, the shake,
     and the number of sparks left behind. Rick's rule for this one was "lots
     of latches should have a big impact", and a burst that read the same at
     one blade as at six would make the entire spray decorative. */
  harrow(f, foe){
    const u = f.w.ult;
    const own = f === this.a ? "a" : "b";
    const n = foe.stuck.reduce((k, s) => k + (s.own === own ? 1 : 0), 0);
    const bx = foe.x, by = foe.y;
    this.unstick(foe);

    if (!n){
      /* THE DUD, AND IT IS VISIBLE. Nothing stuck, so nothing bursts, and the
         ultimate SAYS SO rather than playing a bloom that did not happen.
         Slagburst manufactured its own fuel to make this case impossible;
         this one cannot, because guaranteeing a latch would mean homing and
         there is no homing anywhere in this engine. So the dud is kept, made
         legible, and its RATE IS MEASURED — harrow_probe.py — instead of
         being assumed away. */
      this.ultFx = { w: f.w.id, kind: "harrow", phase: "cold",
                     src: own, tgt: own === "a" ? "b" : "a",
                     x: f.x, y: f.y, tx: foe.x, ty: foe.y, hit: false,
                     radius: 300, aff: f.aff, t: 0, n: 0, life: 1.1 };
      SFX.play("ult", { w: "lastlight-cold" });
      this.note(`${f.w.name} — nothing held`);
      return;
    }

    const raw = u.dmgBase + u.dmgPer * n;
    const dmg = Math.round(raw * this.actMods.dmg * foe.dmgTakenMul());
    this.hurt(foe, dmg, f);
    foe.flash = 1; foe.ringFlash = 1;
    f.dealt += dmg;
    const fatal = foe.hp <= 0;
    if (fatal) this.finisher = 1.0;
    this.float(bx, by - 40, dmg, "#FFF6E2", 46 + n * 3);

    /* THE IMPACT, four channels on the same n. The knock throws it; `launch`
       raises the speed ceiling so the throw can actually happen and the relax
       term pays it back over the next second and a half; the stun is a FLOOR
       under the ordinary diminishing-returns hitstun rather than a
       replacement for it (the DR exists so a fast relic cannot lock a slow
       one out of the match, and this must not become a way around it); and
       the hit stop is what makes the frame feel heavy. */
    const dx = bx - f.x, dy = by - f.y, dl = Math.hypot(dx, dy) || 1;
    const k = u.knockBase + u.knockPer * n;
    foe.vx += (dx / dl) * k; foe.vy += (dy / dl) * k;
    if (n >= 3) foe.launch = Math.max(foe.launch || 0, 1.4);
    if (!fatal){
      foe.takeHitstun(dmg);
      foe.stun = Math.max(foe.stun, u.stunBase + u.stunPer * n);
      /* The burst's stun is a TRUE stun and scales with how many blades
         were buried; the takeHitstun on the line above is NOT and is
         deliberately left alone. */
      this.breakSpin(foe, "the blades burst and the wind goes out of it");
    }
    this.hitStop = Math.max(this.hitStop, u.stopBase + u.stopPer * n);
    this.shake = Math.max(this.shake, 24 + n * 4.5);

    /* THE LIGHT LEFT BEHIND. Daybreak's sparks, spawned by Daybreak's own
       function: it reads sparkGrace and sparkLife off `f.w.ult`, so these arm
       with the same pop, drift on the same deterministic phase, heal the
       owner as Blessing and burn the foe for sparkDmg exactly as
       Dawnbringer's do. Rick asked for "the same sparks as dawnbringer" and
       this is that literally, not a copy of it. */
    for (let i = 0; i < (u.sparksPer || 2) * n; i++) this.spawnSpark(f, bx, by);

    this.spawnFx(bx, by, "#FFF6E2", 26 + n * 5, 420 + n * 30, 0.75, 5);
    this.ring(bx, by, "#FFFFFF", 8, 150 + n * 22, 0.5, 8);
    this.banner = { text: u.name, life: 2.1, max: 2.1, color: f.aff.core,
                    glow: f.aff.glow, w: f.w.id, bx, by };
    this.ultFx = { w: f.w.id, kind: "harrow", phase: "bloom",
                   src: own, tgt: own === "a" ? "b" : "a",
                   x: bx, y: by, tx: bx, ty: by, hit: true,
                   radius: u.radius || 300, aff: f.aff, t: 0, n, life: 1.7 };
    this.beat({ kind: "ult", side: f === this.a ? 0 : 1, x: bx, y: by,
                w: f.w.id, foeHpFrac: Math.max(0, foe.hp) / foe.maxHp });
    SFX.play("ult", { w: "lastlight-bloom", n });
    this.note(`${f.w.name} — ${u.name}, ${n} blade${n > 1 ? "s" : ""}`);
  }

  /* ------------------------------------------------------- THE SHADES --
     Everything below runs over `this.shades`, which is empty in every match
     that does not contain this relic. `checkEnd` is deliberately NOT touched:
     it reads `this.a` and `this.b` and nothing else, so a shade dying cannot
     end a match and no guard had to be written to stop it. That is the payoff
     for keeping copies out of `a`/`b` rather than making them fighters of
     record and then defending against it everywhere. */

  /* A shade fights the FOE. Never its sibling, never the ball that made it —
     Rick's exclusion, and the reason no N x N pairing exists in this build. */
  shadeFoe(s){ return s.shade.owner === this.a ? this.b : this.a; }

  /* THE HALL IS STOPPED AND THE CELL IS DIVIDING.
     Called only from the splitHold branch, so nothing here has to guard
     against the ordinary tick running at the same time. */
  tickSplitHold(dt){
    const S = this.splitHold, f = this[S.src];
    const k = Math.min(1, S.t / S.dur);
    if (S.rejoin){
      /* THE REVERSE. Rick: "something like a reverse of the cell split where
         any surviving clones rejoin the original".

         SHORTER than the split, and the reason is dramatic rather than
         technical: the division is the moment this relic becomes something and
         the reunion is the moment it stops being it. Two equal pauses would
         give the ending the same weight as the transformation, and the hall is
         already stopped twice per cast. `ult.rejoin` is the knob. */
      const e2 = k * k * (3 - 2 * k);
      for (const s of this.shades){
        const E = s.emerge;
        if (!E || s.shade.owner !== f) continue;
        s.x = E.x0 + (E.x1 - E.x0) * e2;
        s.y = E.y0 + (E.y1 - E.y0) * e2;
        s.born = 1 - k;
        s.theta += s.w.spin * 0.55 * dt * s.spinDir;
      }
      /* the fire goes out as they come home, so the last thing on screen is
         one ball with no flame on it */
      if (f.ultSplit) f.ultSplit.k = f.ultSplit.lit = Math.pow(1 - k, 1.1);
      this.shake = Math.max(this.shake, 4 + 22 * Math.pow(k, 2.6));
      return;
    }
    /* smoothstep, then a small overshoot on the last fifth: a cell does not
       glide apart, it strains and then lets go */
    const e = k * k * (3 - 2 * k);
    const pop = k > 0.80 ? Math.sin((k - 0.80) / 0.20 * Math.PI) * 0.06 : 0;
    for (const s of this.shades){
      const E = s.emerge;
      if (!E || s.shade.owner !== f) continue;
      s.x = E.x0 + (E.x1 - E.x0) * (e + pop);
      s.y = E.y0 + (E.y1 - E.y0) * (e + pop);
      s.born = k;
      /* the daughters turn while they separate, so the pair is visibly two
         objects and not one shape being stretched */
      s.theta += s.w.spin * 0.55 * dt * s.spinDir;
    }
    /* THE FIRE IGNITES ON THE DIVISION, not after it. `ultSplit.t` does not
       advance in frozen time, so if the arrival ramp lived on that clock the
       whole pause would be unlit and the flame would snap on the frame the
       hall restarted. */
    if (f.ultSplit) f.ultSplit.k = f.ultSplit.lit = Math.pow(k, 1.3);
    /* a tremor that builds and then breaks, so the ear and the screen agree
       about where the separation is */
    this.shake = Math.max(this.shake,
                          k < 0.82 ? 6 + 26 * Math.pow(k, 2.4) : 34 * (1 - (k - 0.82) / 0.18));
  }

  releaseSplit(){
    const S = this.splitHold, f = this[S.src];
    this.splitHold = null;
    if (S.rejoin){ this.dropSplit(f, true); return; }
    if (f && f.ultSplit) f.ultSplit.lit = 1;
    const R = CONFIG.physics.ballR;
    for (const s of this.shades){
      const E = s.emerge;
      if (!E) continue;
      s.x = E.x1; s.y = E.y1;
      s.vx = Math.cos(E.a) * CONFIG.physics.cruise;
      s.vy = Math.sin(E.a) * CONFIG.physics.cruise;
      s.born = 1;
      s.emerge = null;
      this.ring(s.x, s.y, s.aff.glow, 4, R * 3.0, 0.5, 6);
      this.spawnFx(s.x, s.y, s.aff.core, 20, 260, 0.55, 4);
    }
    if (f) this.ring(f.x, f.y, f.aff.core, 6, R * 4.4, 0.6, 8);
    this.shake = Math.max(this.shake, 30);
  }

  /* THE DRAIN. Rick: "im picturing the balls as sucking the lifeforce from
     their enemy. lets show something being pysically taken and streamed back".

     Presentation only and it never touches the simulation — but it is a LIST
     of motes rather than a flag, because "taken" needs travel: a glow on the
     healer says it got better, a stream from the foe says where it came from.

     Each mote leaves in the FOE'S OWN affinity colour and arrives in the heal
     green, crossfading on the way. That is the whole idea in one property:
     their life, becoming somebody else's.

     `tgt` holds the FIGHTER and not a point, so the stream follows a ball that
     is still moving. Deterministic: every stagger, bow and radius is a
     function of the mote's index, never rng — a presentation object must not
     perturb the draw order of a match. */
  drain(from, to, amount, wasted){
    /* ARCHING LIGHT TRAILS THAT SWIRL AND TRICKLE BACK. Rick, on two previous
       cuts of this: *"I was more picturing arching light trails that swirl and
       trickle back to twinshade. lit up with glow effects and arc then trickle
       off and fade as they trickle back."*

       Both earlier versions were the wrong IDIOM, not the wrong size. v1 was
       small dots on a bowed path; v2 made them fewer and bigger on the theory
       that a thing being taken is a chunk. Neither is a trail — a dot with a
       stub behind it is a projectile, and a projectile is a thing being
       thrown, which is the opposite of what this is.

       A strand is a PATH now, drawn along its own recent history, swirling
       about the axis between the two balls. Three things follow from the word
       "trickle" and each of them reverses a decision from v2:

         MANY and THIN, not few and fat — a trickle is a lot of small flow
         LONG-LIVED and WIDELY STAGGERED — 22 strands leaving over 1.1s and
           living 0.9s each is one heal trickling for over two seconds, which
           is longer than the gap to the next heal
         GLOWING — three additive passes per strand, wide and dim to narrow
           and white. That is what "lit up with glow effects" costs. */
    const n = wasted ? 7
            : Math.max(11, Math.min(22, Math.round(9 + amount * 1.2)));
    /* `ribbon` scales the strand thickness and nothing else — not the count,
       not the length, not the swirl. Read off the HEALER's own ult data, which
       a shade shares with the ball that made it. */
    const rw = (to.w.ult && to.w.ult.ribbon) || 1;
    const ak = (to.w.ult && to.w.ult.arc) || 1;
    for (let i = 0; i < n; i++){
      this.drains.push({
        x0: from.x, y0: from.y, tgt: to, t: 0,
        delay: i * 0.052,
        life: 0.80 + (i % 5) * 0.075,
        /* how far round the axis it turns over the whole flight, and which
           way. Alternating hands make the bundle read as a braid rather than
           as one corkscrew. */
        swirl: ((i % 2) ? 1 : -1) * (2.2 + 2.3 * (((i * 3) % 4) / 3)),
        phase: i * 2.3999632,                       // golden angle, fixed
        /* orbit radius as a fraction of the gap. Opens early, closes into the
           shell — the swirl has to TIGHTEN as it arrives or it reads as
           circling rather than as being drawn in. */
        amp: (0.13 + 0.21 * (((i * 5) % 4) / 3)) * ak,
        w: (3.2 + 1.9 * ((i % 3) / 2)) * rw,
        c0: from.aff.core,
        /* how far along it survives. A wasted strand never arrives. */
        cut: wasted ? 0.45 + ((i % 3) * 0.06) : 1,
      });
    }
    from.drained = 1;
    this.ring(from.x, from.y, wasted ? "#B8C9BC" : "#8FE3A0",
              CONFIG.physics.ballR * 1.15, CONFIG.physics.ballR * 0.35,
              0.34, wasted ? 2 : 4);
    if (this.drains.length > 420)
      this.drains.splice(0, this.drains.length - 420);
  }

  tickShades(dt){
    for (let i = this.shades.length - 1; i >= 0; i--){
      const s = this.shades[i];
      if (!s.alive){ this.killShade(i); continue; }
      const foe = this.shadeFoe(s);
      s.born = Math.min(1, s.born + dt / (s.shade.owner.w.ult.arrive || 0.28));
      this.tickStatus(s, dt);
      this.move(s, foe, dt);
      this.tickWeapon(s, foe, dt);
    }
  }

  /* BOTH DIRECTIONS, and the second one is the half the engine would never
     have offered: the real pair's hit loop is `[[a,b],[b,a]]`, so without this
     the foe could not touch a shade and "the copies can be killed" would be a
     sentence with no code under it.

     `cool` is false on the foe's pass because the foe's per-blade cooldown was
     already ticked by the real loop this frame. Tick it again per shade and a
     foe facing two copies swings three times as often — which is a buff to the
     thing this ultimate is supposed to be attacking.

     Hits are RESOLVED on the shade and CREDITED to the caster. `resolveHit`
     increments `self.hits`, and verify.py's contact floor reads
     `r.hits.a + r.hits.b` — leave the count on the shade and a third of this
     relic's contact silently does not exist to the one check that would catch
     a relic that ends fights without landing blows. */
  tickShadeHits(dt){
    for (const s of this.shades){
      if (!s.alive) continue;
      const foe = this.shadeFoe(s), own = s.shade.owner;
      const h0 = s.hits, d0 = s.dealt, c0 = s.crits;
      this.tickHits(s, foe, dt);
      own.hits  += s.hits  - h0;
      own.dealt += s.dealt - d0;
      own.crits += s.crits - c0;
      if (s.alive) this.tickHits(foe, s, dt, false);
    }
  }

  /* ONE BEAT — the interview answer, and the reunion does not change it.
     Every survivor still goes on a single frame; what changed is WHICH frame,
     because they now walk home first. `hard` is the path for the cases where
     there is nothing to walk home to — a dead caster, a dead foe, a finished
     match — and it drops them where they stand. */
  endSplit(f, hard){
    if (!f.ultSplit) return;
    const mine = this.shades.filter(s => s.shade.owner === f);
    if (hard || !mine.length || this.over || this.splitHold){
      this.dropSplit(f, false);
      return;
    }
    for (const s of mine)
      s.emerge = { x0: s.x, y0: s.y, x1: f.x, y1: f.y, a: 0, rejoin: true };
    this.splitHold = { src: f === this.a ? "a" : "b", t: 0, rejoin: true,
                       dur: f.w.ult.rejoin === undefined ? 0.55 : f.w.ult.rejoin };
    SFX.play("ult", { w: "twinshade-rejoin" });
  }

  /* The removal itself. `merged` is the reunion: the burst is on the PARENT
     and not on wherever each copy happened to be, because what the viewer has
     just watched is three things becoming one, and three separate puffs would
     say the opposite. */
  dropSplit(f, merged){
    if (!f) return;
    f.ultSplit = null;
    f.lifesteal = 0;
    const R = CONFIG.physics.ballR;
    for (let i = this.shades.length - 1; i >= 0; i--){
      const s = this.shades[i];
      if (s.shade.owner !== f) continue;
      if (!merged){
        this.spawnFx(s.x, s.y, s.aff.core, 26, 300, 0.7, 5);
        this.ring(s.x, s.y, s.aff.glow, 6, R * 2.6, 0.5, 5);
      }
      s.emerge = null;
      this.shades.splice(i, 1);
    }
    if (merged){
      this.spawnFx(f.x, f.y, f.aff.core, 46, 330, 0.8, 5);
      /* an INWARD ring — r0 > r1, so it closes on the ball instead of
         expanding off it. Every other ring in this game opens. */
      this.ring(f.x, f.y, f.aff.core, R * 1.5, R * 0.2, 0.38, 4);
      this.shake = Math.max(this.shake, 20);
    }
  }

  /* A KILLED SHADE IS JUST GONE. Rick's call, and it is the answer that keeps
     the foe's incentive simple: kill the copies or eat three attackers. It
     pays the foe nothing and returns the caster nothing.

     It still bursts, because a ball that dies in this game shatters and a copy
     that merely blinked out would read as the ultimate having expired early. */
  killShade(i){
    const s = this.shades[i];
    this.spawnFx(s.x, s.y, s.aff.core, 54, 430, 1.0, 6);
    this.ring(s.x, s.y, s.aff.glow, 6, CONFIG.physics.ballR * 4, 0.7, 7);
    this.shake = Math.max(this.shake, 22);
    this.shades.splice(i, 1);
  }

  checkEnd(){
    if (this.killFlight) return;   // the slain ball has a wall to meet first
    const a = this.a, b = this.b;
    if (a.hp <= 0 || b.hp <= 0){
      this.over = true;
      const aDead = a.hp <= 0, bDead = b.hp <= 0;
      this.winner = aDead && bDead ? (a.hp >= b.hp ? a : b) : (aDead ? b : a);
      this.loser  = this.winner === a ? b : a;
      this.loser.hp = Math.max(0, this.loser.hp);
      /* What was still in the glass when it failed. hp is clamped to zero
         on this very line, so it cannot be read back afterwards, and the
         ghost is the only record of what the killing blow took. Drives the
         size of the spill in drawShatter, and nothing else. Presentation. */
      this.loser.deathHp = Math.max(0, this.loser.hpGhost == null
                                        ? this.loser.hp : this.loser.hpGhost);
      this.reason = "slain";
      this.shake = 46;
