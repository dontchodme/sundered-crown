     arena, and a cinema cut lets the arena clip bleed 70 px up over the band;
     that is the v26 HUD spill, and anything that has to survive a cut belongs
     after drawArenaFrame rather than inside drawBar. The letterbox is clipped
     to the arena rect and cannot reach it either. */
  drawTug(m){
    if (!TUG.on || this._introScene) return;
    const c = this.ctx;
    const base = CONFIG.combat.baseHP;
    const x0 = this.pad + 8, x1 = this.W - this.pad - 8, w = x1 - x0;
    const h = TUG.h;
    const y = BAND.pos === "bottom" ? this.arenaTop + this.ah + 12
                                  : this.arenaTop - h - 8;
    const mid = (x0 + x1) / 2;
    const tier = 26, cy0 = y + tier + 3, ch = h - tier - 10;
    const frac = (o) => clamp(Math.max(0, o) / base, 0, 1);
    const NCH = 4;

    c.save();
    /* A plate across the whole band. Two jobs: it seats the panel against the
       hall, and it is the one thing in the frame a cinema cut's 70 px arena
       bleed must not be allowed to paint over. */
    c.fillStyle = "#07050C";
    c.fillRect(0, y - 8, this.W, h + 14);
    c.fillStyle = "#0B0812";
    this.roundRect(x0, y, w, h, 8); c.fill();
    c.strokeStyle = "#221B30"; c.lineWidth = 2;
    this.roundRect(x0, y, w, h, 8); c.stroke();

    if (TUG.mode === "ratio"){
      /* One divider. Kept because it is the purest answer to the single
         question, and one flag away if the mirror reads as two bars. */
      const fa = frac(m.a.hp), fb = frac(m.b.hp), tot = fa + fb;
      const sp = tot > 1e-6 ? x0 + w * (fa / tot) : mid;
      c.save();
      c.beginPath(); this.roundRect(x0, y, w, h, 8); c.clip();
      c.fillStyle = m.a.aff.core; c.fillRect(x0, y, sp - x0, h);
      c.fillStyle = m.b.aff.core; c.fillRect(sp, y, x1 - sp, h);
      c.restore();
      c.strokeStyle = "#FFF4D0"; c.lineWidth = 5;
      c.beginPath(); c.moveTo(sp, y - 9); c.lineTo(sp, y + h + 9); c.stroke();
      c.restore();
      return;
    }

    const GAPX = 5, half = w / 2 - 7;
    const cw = (half - GAPX * (NCH - 1)) / NCH;
    for (const [f, sign, ex] of [[m.a, 1, x0 + 3], [m.b, -1, x1 - 3]]){
      const fr = frac(f.hp), gh = frac(f.hpGhost ?? f.hp);
      const brink = fr > 0 && fr <= BRINK.at;
      const SS = brink ? BRINK : HEALTH_CHUNKS[Math.min(NCH - 1, Math.floor(fr * NCH))];
      const al = SS.puls ? 0.74 + 0.26 * Math.sin(m.t * SS.puls) : 1;

      for (let i = 0; i < NCH; i++){
        const cx0 = ex + sign * (i * (cw + GAPX));
        const fill = clamp(fr * NCH - i, 0, 1);
        const gfil = clamp(gh * NCH - i, 0, 1);
        const L = Math.min(cx0, cx0 + sign * cw);
        /* the empty slot: this is what makes it a COUNT and not an estimate */
        c.fillStyle = "#1B1428";
        c.fillRect(L, cy0, cw, ch);
        c.strokeStyle = "#33294A"; c.lineWidth = 1.4;
        c.strokeRect(L + 0.7, cy0 + 0.7, cw - 1.4, ch - 1.4);
        /* the drain tail, the same instrument as on the shell */
        if (gfil > fill + 0.002){
          c.fillStyle = "#FFE9C0"; c.globalAlpha = 0.85;
          const a = cx0 + sign * cw * fill, b = cx0 + sign * cw * gfil;
          c.fillRect(Math.min(a, b), cy0, Math.abs(b - a), ch);
          c.globalAlpha = 1;
        }
        if (fill <= 0.001) continue;
        /* Affinity colour, because the first job of this half is to say WHICH
           RELIC. The stage rides as VALUE, never hue -- as on the shell. */
        c.globalAlpha = al;
        const gx = c.createLinearGradient(cx0, cy0, cx0 + sign * cw, cy0 + ch);
        gx.addColorStop(0, f.aff.dark);
        gx.addColorStop(1, (brink || SS.puls) ? SS.hi : f.aff.core);
        c.fillStyle = gx;
        c.fillRect(Math.min(cx0, cx0 + sign * cw * fill), cy0, cw * fill, ch);
        c.globalAlpha = 1;
      }

      /* the head */
      if (fr > 0.001){
        const whole = Math.floor(Math.min(fr * NCH, NCH - 1e-6));
        const head = ex + sign * (whole * (cw + GAPX) + cw * (fr * NCH - whole));
        c.save();
        c.shadowColor = SS.puls ? SS.hi : f.aff.core; c.shadowBlur = 14;
        c.fillStyle = "#FFF4D0";
        c.fillRect(head - 2.5, cy0 - 4, 5, ch + 8);
        c.restore();
      }

      /* name at the outer edge, percentage at the inner one */
      c.save();
      c.textBaseline = "alphabetic";
      c.textAlign = sign > 0 ? "left" : "right";
      c.font = "700 27px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = "#07050C"; c.strokeStyle = "#07050C";
      c.lineWidth = 5; c.lineJoin = "round";
      c.strokeText(f.w.name.toUpperCase(), ex + sign * 8, y + 21);
      c.fillStyle = f.aff.core;
      c.fillText(f.w.name.toUpperCase(), ex + sign * 8, y + 21);
      if (TUG.pct || TUG.num){
        const txt = TUG.pct ? Math.round(fr * 100) + "%"
                            : String(Math.max(0, Math.round(f.hp)));
        c.textAlign = sign > 0 ? "right" : "left";
        c.font = "800 30px 'Atkinson Hyperlegible Next',sans-serif";
        c.strokeText(txt, mid - sign * 14, y + 22);
        c.fillStyle = (brink || SS.puls) ? SS.hi : "#EDE3D0";
        c.fillText(txt, mid - sign * 14, y + 22);
      }
      c.restore();
    }
    /* the axis the two halves are compared about */
    c.strokeStyle = "#6E6378"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(mid, y + 4); c.lineTo(mid, y + h - 4); c.stroke();
    c.restore();
  }

  drawClock(m){
    const c = this.ctx;
    c.save();
    c.textAlign = "center";
    c.fillStyle = "#FFF4D02E";
    c.font = "700 48px 'Atkinson Hyperlegible Mono',monospace";
    c.fillText(m.t.toFixed(1), this.W/2, this.arenaTop + 66);
    if (m.act > 0){
      c.fillStyle = m.act === 1 ? "#C9A22766" : "#E0433F88";
      c.font = "700 20px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillText(CONFIG.acts[m.act].name, this.W/2, this.arenaTop + 96);
    }
    if (m.clankCount > 0){
      c.fillStyle = "#FFF4D024";
      c.font = "700 18px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillText(m.clankCount + " CLANK" + (m.clankCount === 1 ? "" : "S"),
                 this.W/2, this.arenaTop + this.ah - 26);
    }
    c.restore();
  }

  /* Seals only. A seal is a clock event with no place in the hall, so it keeps
     the band near the top. The ultimate's name is drawn inside the arena
     transform instead — see drawUltName. */
  drawBanner(m){
    if (m.banner && !m.banner.w) this._bannerPlain(m.banner, this.arenaTop + this.ah * 0.135);
  }

  /* Letters laid out by hand so each one can be moved independently. The names
     are at most thirteen characters, so this is thirteen fillTexts — cheaper
     than the shadow it is drawn with. `fn` returns per-letter offsets. */
  _letters(c, text, cx, cy, size, track, fn){
    c.font = `700 ${size}px 'Atkinson Hyperlegible Next',sans-serif`;
    const ws = [];
    let total = -track;
    for (const ch of text){ const w = c.measureText(ch).width; ws.push(w); total += w + track; }
    let x = cx - total / 2;
    for (let i = 0; i < text.length; i++){
      const o = fn ? fn(i, text.length) : null;
      const lx = x + ws[i] / 2;
      c.save();
      if (o){
        c.translate(lx + (o.dx || 0), cy + (o.dy || 0));
        if (o.rot) c.rotate(o.rot);
        if (o.s) c.scale(o.s, o.s);
        c.translate(-lx, -cy);
        if (o.a != null) c.globalAlpha *= clamp(o.a, 0, 1);
      }
      if (c.lineWidth > 0) c.strokeText(text[i], lx, cy);
      c.fillText(text[i], lx, cy);
      c.restore();
      x += ws[i] + track;
    }
  }

  /* A seal is a clock event, not a relic. It keeps the plain treatment. */
  _bannerPlain(b, y){
    const c = this.ctx;
    c.save();
    c.globalAlpha = clamp(b.life / 0.6, 0, 1);
    c.textAlign = "center";
    c.font = "700 46px 'Atkinson Hyperlegible Next',sans-serif";
    c.lineWidth = 10; c.strokeStyle = "#000000CC";
    c.strokeText(b.text, this.W/2, y);
    c.fillStyle = b.color || "#C9A227";
    c.shadowColor = b.color || "#C9A227"; c.shadowBlur = 30;
    c.fillText(b.text, this.W/2, y);
    if (b.sub){
      c.shadowBlur = 0;
      c.font = "700 27px 'Atkinson Hyperlegible Next',sans-serif";
      c.lineWidth = 8;
      c.strokeText(b.sub, this.W/2, y + 40);
      c.fillStyle = "#EDE3D0";
      c.fillText(b.sub, this.W/2, y + 40);
    }
    c.restore();
  }

  /* The ultimate's name, at its own set-piece.

     v5 moved this out of the middle of the hall because a 60px caption sat
     directly on top of the ultimate it had stopped needing to explain. Rick
     asked for it back at the point of contact, and the reason it left is still
     real — so it comes back under three conditions that the v5 version did not
     have:

       1. It is drawn BENEATH drawUltOver. The light, the blades, the vines and
          the bolts all paint over it, so as the set-piece blooms it eclipses
          its own name. The name announces; the doing takes over. It can never
          occlude the effect, because the effect is always on top of it.
       2. It sits above the anchor, clear of the densest part of the bloom, and
          is clamped inside the hall.
       3. The huge phase still lands during the wind-up, before there is
          anything to cover.

     Everything here is in ARENA units; every design pixel is multiplied by k. */
  /* Daybreak's drift. Each spark is a MODEL, not a dot — Rick: "i cant see
     the sparks. they need their own models/animation." A four-point sun
     shard: two crossed rhombi turning on the spark's own phase, a white
     core, two flame licks cycling upward, a birth streak while it is still
     flying fast, and a gutter at the end of its life. 48 at most; every
     stroke is small and nothing blurs. */
  _sparkStar(c, r, squash){
    c.beginPath();
    c.moveTo(0, -r);
    c.quadraticCurveTo(r * squash, -r * squash, r, 0);
    c.quadraticCurveTo(r * squash, r * squash, 0, r);
    c.quadraticCurveTo(-r * squash, r * squash, -r, 0);
    c.quadraticCurveTo(-r * squash, -r * squash, 0, -r);
    c.closePath();
  }

  /* THE WHOLE SCYTHE, NOT THE HEAD. First cut drew the crescent alone and
     Rick called it immediately: "the mini scythes only show the head spinning,
     not the whole scythe." A crescent tumbling by itself is a boomerang — the
     L is what says scythe, exactly as `_scConjured`'s docstring worked out for
     the runic cell (the snath is ~60% of a scythe's footprint, and a long pole
     with a hook at the far end IS the type; delete it and what is left is a
     different weapon). That finding was about a silhouette on a contact sheet
     and it transfers here unchanged.

     PROPORTIONS ARE CARICATURED ON ONE AXIS ONLY. The pole and its bow are
     `_scBase`'s exactly — same quadratic, same control point, same collar.
     What is exaggerated is the blade's DEPTH: the real relic runs W/L 0.106,
     which puts a long shallow hook on a long pole and reads as a stick at
     forty pixels. Here W/L is 0.31, so the hook is deep enough to survive
     being thrown across the hall. Nothing else is changed, so the object in
     the air is recognisably the object in the wielder's hand.

     THE PIVOT IS THE OBJECT'S OWN CENTRE, not its grip. A scythe rotating
     about the butt of its handle orbits; one rotating about its middle
     tumbles, which is what a thrown blade does. The translate below is the
     centre of the bounding extent — x runs 0..1.02L, y runs -1.32W..0.30W.

     One shape, three call sites — in flight, buried in a shell, and thrown
     out of the bloom — so all three read as the same object. */
  _miniScythe(c, r){
    const L = 2.40 * r, W = 0.75 * r;
    c.save();
    c.translate(-1.224 * r, 0.383 * r);

    c.lineCap = "round";
    c.lineWidth = Math.max(1, r * 0.17);                    // the snath
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(L * 0.44, W * 0.30, L * 0.70, W * 0.16);
    c.stroke();

    c.beginPath();                                          // the collar
    c.arc(L * 0.70, W * 0.14, W * 0.17, 0, TAU);
    c.fill();

    c.beginPath();                                          // the crescent
    c.moveTo(L * 0.70, W * 0.20);
    c.bezierCurveTo(L * 1.02, -W * 0.20, L * 0.98, -W * 0.95, L * 0.56, -W * 1.32);
    c.bezierCurveTo(L * 0.88, -W * 0.72, L * 0.86, -W * 0.10, L * 0.66, W * 0.30);
    c.closePath();
    c.fill();

    /* the honed edge, one stroke, on the concave side only — the same
       asymmetry `_scBase` uses to stop the crescent reading as a sticker */
    c.lineWidth = Math.max(1, r * 0.12);
    c.beginPath();
    c.moveTo(L * 0.70, W * 0.20);
    c.bezierCurveTo(L * 1.02, -W * 0.20, L * 0.98, -W * 0.95, L * 0.56, -W * 1.32);
    c.stroke();
    c.restore();
  }

  /* THE BLADES IN THE SHELL. Drawn over both fighters and under the sparks,
     because they are on the OUTSIDE of the ball and the light coming off them
     belongs on top of everything the ball is doing.

     THEY DO NOT TURN. A stuck blade that kept spinning would read as still
     flying, and the entire point of the latch is that it stopped. What moves
     instead is the heat: `burdenK` is the caster's fuse as 0..1, cubed, so
     almost all of the tell lands in the last third — a linear ramp reads as
     "bright" for two seconds and as no warning at all in the half second that
     matters. The shiver is on the match clock, not on rng, so a paused and
     resumed render replays identically. */
  drawStuck(m){
    const c = this.ctx, R = CONFIG.physics.ballR;
    for (const f of [m.b, m.a]){
      if (!f.stuck || !f.stuck.length) continue;
      const heat = Math.pow(clamp(f.burdenK || 0, 0, 1), 3);
      c.save();
      c.lineCap = "round"; c.lineJoin = "round";
      for (let i = 0; i < f.stuck.length; i++){
        const s = f.stuck[i];
        const jit = Math.sin(m.t * 46 + i * 2.1) * heat * 0.028;
        const a = s.ang + jit;
        /* PLANTED ON THE SHELL EDGE, NOT INSIDE IT. The first cut seated
           them at `R - 0.34r`, which is inside a 34px ball: the blades were
           behind the shell's own light and the contact sheet showed nothing
           at all until the fuse was nearly out. They straddle the rim now —
           buried to the horns, blade standing off it. */
        const px = f.x + Math.cos(a) * (R + s.r * 0.62);
        const py = f.y + Math.sin(a) * (R + s.r * 0.62);
        c.globalCompositeOperation = "lighter";
        const gr = s.r * (1.1 + heat * 2.6);
        const g = c.createRadialGradient(px, py, 1, px, py, gr);
        g.addColorStop(0, "#FFFFFF");
        g.addColorStop(0.42, "#FFF6E2" + (heat > 0.55 ? "AA" : "44"));
        g.addColorStop(1, "#FFF6E200");
        c.globalAlpha = 0.34 + 0.66 * heat; c.fillStyle = g;
        c.beginPath(); c.arc(px, py, gr, 0, TAU); c.fill();
        c.globalCompositeOperation = "source-over";
        c.globalAlpha = 1;
        c.save();
        c.translate(px, py);
        /* BLADE IN, HAFT OUT. The shape's hook is at local +x and its grip at
           local -x, so turning it a half circle past the arrival angle drives
           the crescent into the shell and leaves the snath standing off it —
           which is what a thrown scythe that stuck in something looks like,
           and it is also the half of the object that reads at a glance. */
        c.rotate(a + Math.PI);
        c.fillStyle = "#FFFFFF";
        c.strokeStyle = "#FFF6E2";
        this._miniScythe(c, s.r * 1.05);
        c.restore();
      }
      c.restore();
    }
  }

  /* THE COPIES. `drawFighter` is already per-fighter and already handles
     everything a shade has, so this is a transform and a call rather than a
     second renderer — a copy that drew through its own path would drift away
     from the thing it is a copy of on the first art revision.

     The arrival is a SCALE, not a fade. `drawFighter` sets `globalAlpha` inside
     its own save/restore blocks for the trail and the swing ribbons, so an
     alpha set out here is overwritten before it reaches the shell; and scaling
     up out of the caster reads as "stepping out of" in a way a cross-fade does
     not. 0.55 -> 1.0 over `ult.arrive`. */
  drawShades(m){
    if (!m.shades.length) return;
    const c = this.ctx;
    for (const s of m.shades){
      if (!s.alive) continue;
      /* An emerging daughter starts almost at nothing, because it is coming
         OUT of the parent; one merely fading in from 55% reads as a ball that
         was always there. A copy in ordinary flight uses the gentler floor. */
      const b = s.born === undefined ? 1 : s.born;
      const k = s.emerge ? (0.10 + 0.90 * b) : (0.55 + 0.45 * b);
      c.save();
      c.translate(s.x, s.y); c.scale(k, k); c.translate(-s.x, -s.y);
      this.drawFighter(m, s);
      c.restore();
    }
  }

  /* THE CELL DIVIDING. Rick: "lets have the fight pause for a second while
     the duplicates split off the original like a cell replicating".

     The daughters are ordinary Fighters walking out of the parent, drawn by
     `drawShades` like any other copy — so what THIS draws is the only part
     that is not a ball: the MEMBRANE still joining them, and the strain on the
     parent. Without the neck the pause is two balls sliding out from behind a
     third; with it, it is one thing coming apart, which is the note. */
  drawSplitHold(m){
    const S = m.splitHold;
    if (!S) return;
    const f = m[S.src];
    if (!f || !f.alive) return;
    const c = this.ctx, R = CONFIG.physics.ballR;
    const k = Math.min(1, S.t / S.dur);
    /* on the reunion the neck runs the other way: thin when they are far and
       thickening as they arrive, so the merge reads as absorption */
    const pinch = S.rejoin ? Math.pow(k, 1.4) : Math.pow(1 - k, 1.5);
    c.save();
    c.globalCompositeOperation = "lighter";
    for (const s of m.shades){
      if (!s.emerge || s.shade.owner !== f) continue;
      const dx = s.x - f.x, dy = s.y - f.y;
      const L = Math.hypot(dx, dy);
      /* A NECK, NOT A SHEET. Drawn only while the daughter is still close
         enough for the two shells to be plausibly one body — beyond that a
         filled band between two distant balls is a triangular wing, which is
         what the first cut of the reunion looked like. */
      if (L < 2 || L > R * 3.4) continue;
      const nx = -dy / L, ny = dx / L;
      const w = R * 0.95 * pinch;
      if (w < 0.5) continue;
      const mxp = f.x + dx * 0.5, myp = f.y + dy * 0.5;
      const edge = (sgn) => {
        c.beginPath();
        c.moveTo(f.x + nx * R * 0.78 * sgn, f.y + ny * R * 0.78 * sgn);
        c.quadraticCurveTo(mxp + nx * w * sgn, myp + ny * w * sgn,
                           s.x + nx * R * 0.62 * sgn, s.y + ny * R * 0.62 * sgn);
      };
      const fade = 1 - Math.min(1, L / (R * 3.4));
      c.globalAlpha = 0.42 * (0.35 + 0.65 * fade);
      c.fillStyle = f.aff.core;
      c.beginPath();
      c.moveTo(f.x + nx * R * 0.78, f.y + ny * R * 0.78);
      c.quadraticCurveTo(mxp + nx * w, myp + ny * w,
                         s.x + nx * R * 0.62, s.y + ny * R * 0.62);
      c.lineTo(s.x - nx * R * 0.62, s.y - ny * R * 0.62);
      c.quadraticCurveTo(mxp - nx * w, myp - ny * w,
                         f.x - nx * R * 0.78, f.y - ny * R * 0.78);
      c.closePath(); c.fill();
      /* the surface of it. A filled band with no edge is a smear; the two
         bright rims are what make it a membrane under tension. */
      c.globalAlpha = 0.70 * (0.30 + 0.70 * fade);
      c.strokeStyle = f.aff.glow;
      c.lineWidth = 1.5 + 2.2 * pinch;
      edge(1); c.stroke();
      edge(-1); c.stroke();
    }
    /* the parent strains and then relaxes. On the reunion it swells as the
       daughters land in it instead. */
    const swell = S.rejoin
      ? 0.26 * Math.pow(k, 2.2)
      : Math.sin(Math.min(1, k / 0.72) * Math.PI) * 0.26;
    if (swell > 0.005){
      c.globalAlpha = 0.30;
      c.fillStyle = f.aff.core;
      c.beginPath(); c.arc(f.x, f.y, R * (1 + swell), 0, TAU); c.fill();
    }
    c.restore();
  }

  /* THE DRAIN. Rick: "im picturing the balls as sucking the lifeforce from
     their enemy. lets show something being pysically taken and streamed back."

     The green +N was already there and it is not enough — a number over the
     healer says it got better, it does not say where from. TRAVEL is the whole
     content of the note, so each mote is drawn on a bowed path from the foe to
     the thing that tore it off, and it CHANGES COLOUR on the way: it leaves in
     the foe's own affinity and arrives in the heal green. Two overlaid draws
     under `lighter` crossfade cleanly and cost no colour arithmetic.

     Drawn OVER both fighters, because the last thing that happens is the mote
     going into a shell and it has to be seen to arrive. */
  drawDrains(m){
    const c = this.ctx, R = CONFIG.physics.ballR;
    /* THE WOUND. The thing being fed on looks fed on — a rim and a set of
       wisps sitting just OUTSIDE the shell.

       The first cut filled the shell with green under `lighter` at half alpha,
       and `lighter` cannot darken anything: on a bright foe it summed to a
       white disc, which reads as a ball exploding rather than one being drained.
       Nothing that is losing should get brighter. */
    for (const src of [m.a, m.b]){
      const lvl = src.drained || 0;
      if (lvl <= 0.02 || !src.alive) continue;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.28 * lvl;
      c.strokeStyle = "#8FE3A0";
      c.lineWidth = 1.4 + 2.2 * lvl;
      c.beginPath(); c.arc(src.x, src.y, R * 1.06, 0, TAU); c.stroke();
      for (let i = 0; i < 7; i++){
        const ph = i * 2.3999632;
        const a2 = m.t * 0.9 + ph;
        const rise = 0.5 + 0.5 * Math.sin(m.t * 5.5 + ph * 2.3);
        const r0 = R * 1.02, r1 = R * (1.10 + 0.34 * rise * lvl);
        c.globalAlpha = 0.30 * lvl * rise;
        c.strokeStyle = "#CFFFDC";
        c.lineWidth = 1.0 + 1.6 * rise;
        c.beginPath();
        c.moveTo(src.x + Math.cos(a2) * r0, src.y + Math.sin(a2) * r0);
        c.lineTo(src.x + Math.cos(a2 + 0.16) * r1, src.y + Math.sin(a2 + 0.16) * r1);
        c.stroke();
      }
      c.restore();
    }

    if (!m.drains.length) return;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    c.lineJoin = "round";
    const SEG = 13, TAIL = 0.40;
    for (const d of m.drains){
      const u = (d.t - d.delay) / d.life;
      if (u <= 0 || u > 1) continue;
      const T = d.tgt;
      const dx = T.x - d.x0, dy = T.y - d.y0;
      const L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;
      /* a wasted strand thins out and vanishes short of the ball rather than
         being switched off */
      let a = 1;
      if (d.cut < 1){
        a = 1 - Math.max(0, (u - (d.cut - 0.22)) / 0.22);
        if (a <= 0) continue;
      }
      /* THE STRAND'S POSITION AT PARAMETER q — eased advance along the axis
         plus a swirl about it. `lag` displaces along the axis on the far half
         of each turn, which is what makes a 2D sine read as going AROUND
         something rather than waving side to side. */
      const P = (q) => {
        const e = q * q * (3 - 2 * q);
        const rad = d.amp * L * Math.sin(Math.PI * Math.min(1, q * 1.06))
                  * (1 - q * 0.45);
        const ang = d.phase + d.swirl * q;
        const off = Math.cos(ang) * rad;
        const e2 = Math.max(0, Math.min(1, e + Math.sin(ang) * rad * 0.30 / L));
        return [d.x0 + dx * e2 + nx * off, d.y0 + dy * e2 + ny * off];
      };
      const pts = [];
      for (let i = 0; i <= SEG; i++){
        const q = u - TAIL * (1 - i / SEG);
        if (q < 0) continue;
        pts.push(P(q));
      }
      if (pts.length < 2) continue;
      /* IT FADES AS IT ARRIVES, AND THAT IS THE WHOLE BACK HALF OF THE NOTE:
         "arc then trickle off and fade as they trickle back to twinshade."

         The first cut of the trail did the opposite — brightest and widest at
         the head, because that is how a projectile is drawn and a projectile
         was still the model. A thing being absorbed gets DIMMER as it lands.
         So the strand peaks in the middle of its arc and thins out over the
         second half, and by the time it reaches the shell there is almost
         nothing left of it to stop. */
      const fade = d.cut >= 1
        ? (u > 0.42 ? Math.max(0, 1 - 0.80 * Math.pow((u - 0.42) / 0.58, 1.30)) : 1)
        : 1;
      /* THREE PASSES = the glow. Wide and dim in the foe's own colour, the
         body in heal green, a white core. Per SEGMENT rather than as one
         polyline, so the strand tapers from nothing at the tail to full at the
         head — a constant-width trail is a tube, and a tube does not trickle. */
      /* Alphas and widths are both up hard on the first cut of this, and the
         reason is `lighter` plus the taper compounding: at 0.11 / 0.26 / 0.55
         under a k-SQUARED ramp, five sixths of every strand was below the
         threshold at which anything is visible against a lit hall, and what
         survived was a faint hook near the head. The taper is k^1.2 now, so
         the trail reads along its whole length instead of only where it is
         thickest. */
      /* THE THREE PASSES ARE NOW SPATIAL, NOT STACKED, and that fixes both
         remaining faults at once.

         COLOUR. The wide pass is the FOE'S OWN colour, and against a pale foe
         like Lightkeeper that is near-white — laid over the whole strand it
         summed with the white core and the hall got silver ropes, with the
         green that actually says "life" buried underneath. So the foe's colour
         is drawn on the TAIL ONLY, where the strand just left them; the green
         owns the body; white is a highlight on the leading edge alone. Which
         is the same idea the crossfade was reaching for, expressed along the
         strand instead of over time — and it survives arriving at a ball of
         any colour, which a timed crossfade did not.

         BEADING. Drawing each segment as its own stroke put a round cap at
         every joint, and under `lighter` twenty-six overlapping caps per
         strand read as a dotted line. Each run is ONE path now, and the taper
         comes from three overlapping runs of decreasing length and increasing
         width — the same trick the flame tongues use. Nine strokes a strand
         instead of thirty-nine, and no joints to pile up. */
      const run = (from, wid, al, col) => {
        if (pts.length - from < 2 || al <= 0.004) return;
        c.globalAlpha = al;
        c.strokeStyle = col;
        c.lineWidth = Math.max(0.4, wid);
        c.beginPath();
        c.moveTo(pts[from][0], pts[from][1]);
        for (let i = from + 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
        c.stroke();
      };
      const tailRun = (to, wid, al, col) => {
        if (to < 2 || al <= 0.004) return;
        c.globalAlpha = al;
        c.strokeStyle = col;
        c.lineWidth = Math.max(0.4, wid);
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i <= to; i++) c.lineTo(pts[i][0], pts[i][1]);
        c.stroke();
      };
      const N2 = pts.length - 1;
      const base = d.w * (1 - 0.42 * u), A2 = a * fade;
      /* where it came from — the tail, in the foe's own colour */
      tailRun(Math.floor(N2 * 0.60), base * 5.2, 0.085 * A2, d.c0);
      tailRun(Math.floor(N2 * 0.40), base * 2.6, 0.135 * A2, d.c0);
      /* what it is — the body, in heal green, three runs deep */
      run(0,                        base * 4.4, 0.16 * A2, "#8FE3A0");
      run(Math.floor(N2 * 0.35),    base * 2.4, 0.44 * A2, "#8FE3A0");
      run(Math.floor(N2 * 0.62),    base * 1.5, 0.62 * A2, "#B6F5C6");
      /* the leading edge only */
      run(Math.floor(N2 * 0.80),    base * 0.75, 0.55 * A2, "#EAFFF0");
      const h = pts[pts.length - 1];
      /* A SMALL head, not a ball on a string. The first cut put a white disc
         1.3x the strand width at the tip with a 2.9x halo round it, and
         twenty-two of those is a handful of glowing marbles being thrown —
         which is the projectile reading again, and the exact opposite of a
         trickle. */
      c.globalAlpha = 0.55 * a * fade;
      c.fillStyle = "#DFFFE9";
      c.beginPath(); c.arc(h[0], h[1], d.w * 0.52, 0, TAU); c.fill();
      c.globalAlpha = 0.20 * a * fade;
      c.fillStyle = "#8FE3A0";
      c.beginPath(); c.arc(h[0], h[1], d.w * 1.35, 0, TAU); c.fill();
      /* IT LANDS. The strand is deliberately at its dimmest by the time it
         reaches the shell — "fade as they trickle back" — and a thing that
         only fades never visibly ARRIVES. So the last twelfth of the flight
         puts a small absorption flare on the ball itself: the fade says it is
         being taken in, this says it got there. */
      if (u > 0.88 && d.cut >= 1){
        const q = (u - 0.88) / 0.12;
        c.globalAlpha = 0.50 * (1 - q) * a;
        c.fillStyle = "#B6F5C6";
        c.beginPath();
        c.arc(T.x, T.y, R * (0.55 + 0.55 * q), 0, TAU);
        c.fill();
      }
    }
    c.restore();
  }

  /* THE PURPLE FIRE. Rick: "it glows with purple fire (take going super sayan
     from dragonball as inspiration for this animation)".

     Two decisions are what make that reference read rather than a generic halo.

     THE FLAME GOES UP, always, whichever way the ball is travelling. A corona
     that trails the motion is a comet, and a comet is a fast object; this has
     to be a transformed one. Standing fire on a moving ball is exactly the
     Dragon Ball cue.

     IT IS LICKED, NOT SMOOTH. Eleven tongues on their own phases and their own
     lengths, so the silhouette changes every frame. A steady ring around a ball
     is an aura and reads as a status; a flickering upward tongue reads as a
     character doing something.

     ON THE CASTER ONLY — Rick's call, and also the one thing on screen that
     says which of three identical purple balls carries the health bar. v37 §8.2
     makes this the v28 same-affinity smudge at its worst and this is the answer
     to it.

     EVERY PHASE IS A FUNCTION OF `m.t` AND A FIXED PER-TONGUE OFFSET. Never
     Math.random(): the shake offset in draw() is the last place this project
     feeds it into a frame and it is a standing open decision because it blocks
     any frame-exact regression test. Nothing new should add to that debt. */
  drawShadeFire(m){
    const c = this.ctx, R = CONFIG.physics.ballR;
    for (const f of [m.a, m.b]){
      const S = f.ultSplit;
      if (!S || !f.alive) continue;
      const k = S.k === undefined ? 1 : S.k;
      if (k <= 0.001) continue;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.lineCap = "round";

      /* THE ENVELOPE. Second revision, and the correction is the same one
         the mini-scythes needed: the first cut drew tongues only across the
         TOP of the shell and leaned them all toward vertical, which is a
         searchlight standing next to a ball, not a ball that is on fire.

         Fire wraps the thing it is burning. So a tongue leaves EVERY point of
         the rim, and its LENGTH is a function of how far up the rim it starts
         — long licks off the crown, stubs off the underside. That envelope is
         the Dragon Ball silhouette: tight to the body, tallest above it. */
      /* THE ENVELOPE. Third revision, and each correction is recorded because
         each one was a different way of not being fire.

         (1) Tongues only across the TOP, all leaning to one point: a party hat.
         (2) Tongues all round but drawn as STROKES with round caps: noodles.
             A flame lick is wide where it leaves the surface and comes to a
             POINT — the taper is most of what makes it read, and no stroke has
             one. They are filled tapered paths now.
         (3) Every tongue the same length: a crown. Each carries a fixed
             per-tongue length factor as well as its own oscillator, so the
             silhouette is ragged at any instant AND changes shape over time.

         Fire wraps the thing it is burning, so a tongue leaves EVERY point of
         the rim and its length is a function of how far up the rim it starts —
         long licks off the crown, stubs off the underside. That envelope is the
         Dragon Ball silhouette: tight to the body, tallest above it. */
      const N = 24, H = R * (0.95 + 1.65 * k);
      for (let i = 0; i < N; i++){
        const ph = i * 2.3999632;                       // golden angle, fixed
        /* independent rates, one per tongue: a shared rate makes the whole
           envelope pulse as one object, which reads as a balloon inflating */
        const fl   = 0.5 + 0.5 * Math.sin(m.t * (8.5 + (i % 5)) + ph * 3.1);
        const wob  = Math.sin(m.t * (4.1 + (i % 3) * 1.7) + ph);
        const vary = 0.50 + 0.50 * (((i * 5) % 7) / 6);   // fixed, per tongue
        /* the base angles are jittered off even spacing, because sixteen
           evenly-spaced anything reads as a mechanism */
        const base = (i / N) * TAU + Math.sin(ph) * 0.09;
        const up   = 0.5 - 0.5 * Math.sin(base);   // 1 at the crown (+y is down)
        const len  = H * (0.18 + 0.82 * up) * vary * (0.45 + 0.55 * fl);
        const bx = f.x + Math.cos(base) * R * 0.94;
        const by = f.y + Math.sin(base) * R * 0.94;
        /* it rises, and drifts along its own outward normal — a tongue that
           only rises is a stripe, and sixteen stripes are a barcode */
        const tx = bx + Math.cos(base) * len * 0.26 + wob * R * 0.24;
        const ty = by - len;
        const mx = bx + Math.cos(base) * len * 0.34 + wob * R * 0.30;
        const my = by - len * 0.52;
        /* the base is spread along the TANGENT at its own footing, so the
           tongue sits on the shell instead of poking out of it */
        const w  = R * (0.27 + 0.17 * fl) * (0.35 + 0.65 * up);
        const nx = -Math.sin(base), ny = Math.cos(base);
        /* `lk` shortens the tongue as well as narrowing it, which is what
           lets the three passes STACK INTO A GRADIENT instead of averaging to
           white. Under `lighter` a white core laid the full length of a red
           one does not read as a hot heart, it reads as a pale tongue — which
           is exactly what the first pass at Rick's note produced. */
        const tongue = (wk, lk) => {
          const ex = bx + (tx - bx) * lk, ey = by + (ty - by) * lk;
          const cx2 = bx + (mx - bx) * lk, cy2 = by + (my - by) * lk;
          c.beginPath();
          c.moveTo(bx + nx * w * wk, by + ny * w * wk);
          c.quadraticCurveTo(cx2 + nx * w * wk * 0.45, cy2 + ny * w * wk * 0.45,
                             ex, ey);
          c.quadraticCurveTo(cx2 - nx * w * wk * 0.45, cy2 - ny * w * wk * 0.45,
                             bx - nx * w * wk, by - ny * w * wk);
          c.closePath(); c.fill();
        };
        /* TWO PASSES, AND THE SECOND IS WHY THIS IS VISIBLE AT ALL. Umbral is
           core #A45CF0 / glow #DDB8FF and the shell it burns on is the same
           purple; purple on purple under `lighter` is a slightly brighter
           purple ball and no fire. The contrast has to be in VALUE, not hue —
           a wide pass in the school's own colour carries the identity, a
           narrow near-WHITE one inside it carries the heat, and the heart is
           brightest where the licks are longest. That is how fire is lit. */
        /* THREE PASSES, AND THE MIDDLE ONE IS RICK'S NOTE.
           v1 was purple-on-purple under `lighter`, which is a slightly
           brighter purple ball and no fire; the near-white heart fixed the
           VALUE but left it monochrome. Rick: "mix some red into the colors to
           make it really pop." Red is the one hue that is not already on this
           ball, on the vessel, or in the umbral palette — so it is the only
           thing that can separate flame from shell by HUE as well as value.

           Outside in: the school's purple carries the identity, a hot red
           carries the heat, a near-white heart carries the temperature. Real
           flame is layered the same way and in the same order. */
        /* THREE PASSES, LAYERED THE WAY A FLAME IS: white at the base, red
           through the body, the school's purple carrying the tips.

           v1 was purple-on-purple under `lighter` — a slightly brighter purple
           ball and no fire. v2 added a near-white heart, which fixed the VALUE
           and left it monochrome; Rick: "mix some red into the colors to make
           it really pop." v3 put red in and ran it the FULL LENGTH under a
           full-length white core, and `lighter` averaged the two back to pale
           pink. Red is the one hue that is not already on this ball, on the
           vessel or in the umbral palette, so it is the only thing that can
           separate flame from shell by hue as well as by value — and it only
           does that if nothing brighter is laid over the whole of it.

           So each pass is SHORTER than the one under it. The stack is a
           gradient up the tongue rather than three coincident shapes. */
        c.globalAlpha = (0.17 + 0.20 * fl) * k;
        c.fillStyle = f.aff.core;
        tongue(1.00, 1.00);
        c.globalAlpha = (0.26 + 0.34 * fl) * k * (0.40 + 0.60 * up);
        c.fillStyle = "#FF2E4D";
        tongue(0.82, 0.70);
        c.globalAlpha = (0.20 + 0.26 * fl) * k * (0.30 + 0.70 * up);
        c.fillStyle = "#FFB07A";
        tongue(0.52, 0.38);
        c.globalAlpha = (0.16 + 0.24 * fl) * k * (0.30 + 0.70 * up);
        c.fillStyle = "#FFF2E4";
        tongue(0.30, 0.17);
      }

      /* The seat. A DONUT and not a disc — transparent at the centre — so it
         lights the rim the fire comes off without washing the shell it is
         standing on. Lastlight's contact sheet made the same correction on the
         mini-scythes: "the glow was bigger than the blade... the blade is the
         object; the glow only says it is made of light." */
      const g = c.createRadialGradient(f.x, f.y, R * 0.55, f.x, f.y, R * 1.35);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(0.60, f.aff.core);
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.globalAlpha = 0.34 * k;
      c.fillStyle = g;
      c.beginPath(); c.arc(f.x, f.y, R * 1.45, 0, TAU); c.fill();
      c.restore();
    }
  }

  drawSparks(m){
    if (!m.sparks || !m.sparks.length) return;
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = "lighter";
    for (const s of m.sparks){
      const flying = s.arm > 0;
      const dying = clamp(s.life / 0.7, 0, 1);
      const pop = s.justArmed > 0 ? 1 + 1.4 * (s.justArmed / 0.3) : 1;
      const pulse = 0.82 + 0.18 * Math.sin(m.t * 10 + s.ph * 3);
      const R = (11 + 4 * Math.sin(s.ph)) * (0.5 + 0.5 * dying) * pop
              * (flying ? 0.45 : 1);
      const a = dying;
      /* in grace it IS its own motion: a comet leaving the blow */
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > 90){
        const k2 = Math.min(1, sp / 300);
        c.globalAlpha = a * 0.7 * k2;
        c.strokeStyle = "#FFD98A"; c.lineWidth = 4.2;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(s.x - (s.vx / sp) * 34 * k2, s.y - (s.vy / sp) * 34 * k2);
        c.lineTo(s.x, s.y);
        c.stroke();
      }
      /* halo */
      const g = c.createRadialGradient(s.x, s.y, 1, s.x, s.y, R * 2.4);
      g.addColorStop(0, "#FFF6E2AA"); g.addColorStop(1, "#FFD98A00");
      c.globalAlpha = a * 0.8 * pulse;
      c.fillStyle = g;
      c.beginPath(); c.arc(s.x, s.y, R * 2.4, 0, TAU); c.fill();
      /* the shard: two crossed rhombi, turning */
      c.save();
      c.translate(s.x, s.y);
      c.rotate(s.ph + m.t * (0.9 + 0.4 * Math.sin(s.ph * 2)));
      c.globalAlpha = a * pulse;
      c.fillStyle = "#FFF6E2";
      this._sparkStar(c, R, 0.22); c.fill();
      c.rotate(Math.PI / 4);
      c.globalAlpha = a * pulse * 0.7;
      c.fillStyle = "#FFD98A";
      this._sparkStar(c, R * 0.62, 0.26); c.fill();
      c.restore();
      /* flame licks: two small tongues, cycling upward off the shard */
      for (let i = 0; i < 2; i++){
        const lp = (m.t * (1.3 + 0.3 * i) + s.ph * (1 + i)) % 1;
        const lx = s.x + Math.sin(s.ph * 4 + i * 2.6) * R * 0.5;
        c.globalAlpha = a * (1 - lp) * 0.7;
        c.strokeStyle = i ? "#FFD98A" : "#FFFFFF";
        c.lineWidth = 2.2 - i * 0.8;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(lx, s.y - R * 0.4 - lp * 3);
        c.quadraticCurveTo(lx + Math.sin(lp * 9 + s.ph) * 3.5, s.y - R - lp * 9,
                           lx + Math.sin(lp * 7 + s.ph) * 2, s.y - R * 0.7 - lp * 16);
        c.stroke();
      }
      /* the core */
      c.globalAlpha = a;
      c.fillStyle = "#FFFFFF";
      c.beginPath(); c.arc(s.x, s.y, Math.max(1.6, R * 0.28), 0, TAU); c.fill();
    }
    c.restore();
  }

  drawUltName(m){
    const b = m.banner;
    if (!b || !b.w) return;
    const c = this.ctx, k = 1 / this.scale, A = CONFIG.arena;
    const max = b.max || 2.1;
    const age = max - b.life;
    const ease = t => 1 - Math.pow(1 - t, 3);
    const inK  = clamp(age / 0.14, 0, 1);
    const setK = clamp((age - 0.38) / 0.24, 0, 1);
    const out  = clamp((0.44 - b.life) / 0.44, 0, 1);
    const col  = b.color || "#C9A227";
    const glow = b.glow || col;
    const H = shellHash;

    c.save();
    c.textAlign = "center";
    c.font = `700 ${46 * k}px 'Atkinson Hyperlegible Next',sans-serif`;
    const w46 = c.measureText(b.text).width;              // arena units
    let scale = lerp(lerp(2.5, 1.95, ease(inK)), 1.0, ease(setK));
    scale = Math.min(scale, (A.w - 26) / Math.max(1, w46));
    const size = 46 * scale * k;
    const track = (scale - 1) * 5 * k;

    /* The clamp has to know how far the ARRIVAL throws the letters, or the
       word clips against the wall for the first tenth of a second — which is
       exactly the tenth of a second it is largest and most looked at. */
    const N = b.text.length, spreadK = 1 - ease(inK);
    const spread = { widowmaker: 52, thornwake: 64, gravemourn: 30,
                     ironhail: 46, farwarden: 118 }[b.w];
    const extra = spread ? (N - 1) / 2 * spread * k * spreadK
                : b.w === "spellbreaker" ? 65 * k * spreadK : 0;
    const half = w46 * scale * 0.5 + extra;
    /* BELOW the anchor. The damage number spawns at the quarry and rises, so
       anything else that rises collides with it — the status tags learned this
       one change ago, and lifting the name clear upward just turned it back
       into a caption floating above the fight. Numbers go up, words go down.
       That is now the rule for everything that lands at a point of contact. */
    let cx = clamp(b.bx, half + 10, A.w - half - 10);
    let cy = clamp(b.by + 78, size * 0.9, A.h - size * 0.6);
    const y = cy;

    c.globalAlpha = clamp(age / 0.04, 0, 1) * clamp(b.life / 0.4, 0, 1);
    c.lineWidth = 10 * Math.min(1.7, scale) * k;
    c.strokeStyle = "#000000E0";
    c.fillStyle = col;
    c.shadowColor = glow; c.shadowBlur = 30;

    let fn = null;

    if (b.w === "dawnbringer"){
      fn = (i) => ({ dy: -(1 - ease(clamp((age - i * 0.012) / 0.13, 0, 1))) * 230 * k });
      if (age > 0.09 && age < 0.55){
        const k2 = (age - 0.09) / 0.46;
        c.save();
        c.globalCompositeOperation = "lighter";
        c.shadowBlur = 0;
        c.globalAlpha = (1 - k2) * 0.5;
        c.fillStyle = "#FFE7A8";
        c.fillRect(cx - A.w * 0.5 * k2, y + 12 * k, A.w * k2, (3 + 9 * (1 - k2)) * k);
        c.restore();
      }
    }
    else if (b.w === "widowmaker"){
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - ease(inK)) * 52 * k });
      if (out > 0){
        c.save();
        c.shadowBlur = 0; c.globalAlpha = out * 0.85;
        c.strokeStyle = "#8E1226"; c.lineWidth = 3 * k; c.lineCap = "round";
        for (let i = 0; i < 9; i++){
          const dx = (H(31, i) - 0.5) * w46 * scale;
          c.beginPath();
          c.moveTo(cx + dx, y + 8 * k);
          c.lineTo(cx + dx, y + (8 + out * out * (26 + H(37, i) * 50)) * k);
          c.stroke();
        }
        c.restore();
      }
    }
    else if (b.w === "grudgebearer"){
      const shake = age > 0.10 ? Math.exp(-(age - 0.10) * 13) : 0;
      cx += Math.sin(age * 92) * 9 * k * shake;
      cy += Math.cos(age * 78) * 7 * k * shake;
      fn = (i) => ({ dy: -(1 - ease(clamp(age / 0.10, 0, 1))) * 170 * k,
                     rot: (H(17, i) - 0.5) * 0.10 * shake });
      if (age > 0.10 && age < 0.70){
        const k2 = (age - 0.10) / 0.6;
        c.save();
        c.shadowBlur = 0; c.globalAlpha = (1 - k2) * 0.45;
        c.fillStyle = "#C89A66";
        for (let i = 0; i < 14; i++){
          const dx = (H(43, i) - 0.5) * w46 * scale * (1 + k2 * 1.5);
          c.beginPath();
          c.arc(cx + dx, y + (12 - k2 * (10 + H(47, i) * 26)) * k,
                (2 + H(53, i) * 7 * (1 - k2 * 0.5)) * k, 0, TAU);
          c.fill();
        }
        c.restore();
      }
    }
    else if (b.w === "thornwake"){
      const cinch = ease(clamp(age / 0.34, 0, 1));
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - cinch) * 64 * k });
      c.save();
      c.shadowBlur = 0;
      c.globalAlpha = clamp(b.life / 0.4, 0, 1)
                    * (1 - clamp((age - 0.34) / 0.24, 0, 1)) * 0.95;
      c.strokeStyle = "#4FD06B"; c.lineWidth = 4.4 * k; c.lineCap = "round";
      const hw = half + 26 * k + (1 - cinch) * 190 * k;
      for (const sgn of [-1, 1]){
        const bx = cx + sgn * hw;
        c.beginPath();
        c.moveTo(bx + sgn * 16 * k, y - size * 0.70);
        c.quadraticCurveTo(bx - sgn * 20 * k, y - size * 0.20, bx + sgn * 4 * k, y + size * 0.26);
        c.quadraticCurveTo(bx + sgn * 16 * k, y + size * 0.42, bx - sgn * 6 * k, y + size * 0.46);
        c.stroke();
        c.fillStyle = "#BCF7C7";
        c.beginPath(); c.arc(bx - sgn * 3 * k, y - size * 0.16, 3.4 * k, 0, TAU); c.fill();
      }
      c.restore();
    }
    else if (b.w === "gravemourn"){
      const pull = ease(setK);
      cy += pull * 22 * k;
      c.shadowBlur = 46;
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - ease(inK)) * 30 * k * (1 - pull * 0.4),
                        dy: pull * (6 + H(59, i) * 12) * k,
                        rot: (H(61, i) - 0.5) * 0.16 * pull });
      c.save();
      c.globalCompositeOperation = "lighter";
      c.shadowBlur = 0;
      for (let i = 0; i < 16; i++){
        const ph = (age * 1.5 + H(67, i)) % 1;
        c.globalAlpha = (1 - ph) * 0.85 * clamp(b.life / 0.4, 0, 1);
        c.fillStyle = ph < 0.4 ? "#F0E2FF" : "#C99BFF";
        c.fillRect(cx + (H(71, i) - 0.5) * w46 * scale, y + (10 + ph * 70) * k,
                   2.6 * k, 13 * k);
      }
      c.restore();
    }
    else if (b.w === "farwarden"){
      /* One bearing for every letter, staggered, so the word arrives as a
         formation rather than as a scatter. `a` is fixed: this is a single
         shot landing, and a single shot comes from one place. */
      const av = 2.62;
      fn = (i) => {
        const s = 1 - ease(clamp((age - i * 0.018) / 0.20, 0, 1));
        return { dx: Math.cos(av) * s * 480 * k,
                 dy: Math.sin(av) * s * 330 * k,
                 rot: s * 0.22, a: 1 - s * 0.25 };
      };
      /* The plates, arriving behind the word and settling. Five, countable,
         same as the ward on the shell and same as the corona on the shaft --
         the third and last place a viewer meets that object, so it has to be
         the same object. */
      if (age < 0.62){
        const s = 1 - ease(clamp(age / 0.62, 0, 1));
        c.save();
        c.shadowBlur = 0;
        c.globalAlpha = (1 - ease(clamp(age / 0.62, 0, 1))) * 0.9
                      * clamp(b.life / 0.4, 0, 1);
        for (let i = 0; i < 5; i++){
          const off = (i - 2) * 34 * k;
          const px = cx + off + Math.cos(av) * s * 300 * k;
          const py = y - size * 0.30 + Math.sin(av) * s * 210 * k;
          c.save();
          c.translate(px, py);
          c.rotate(av + Math.PI + s * 0.5);
          c.fillStyle = "#1A0512";
          c.fillRect(-26 * k, -7 * k, 52 * k, 14 * k);
          c.fillStyle = col;
          c.fillRect(-22 * k, -4.2 * k, 44 * k, 8.4 * k);
          c.restore();
        }
        c.restore();
      }
    }
    else if (b.w === "ironhail"){
      /* Each letter on its own bearing, converging. `i * TAU / N` reads as
         a circle even when the letters land in a line, because the eye
         reconstructs the fan from the streaks. */
      fn = (i, N) => {
        const s = 1 - ease(clamp((age - i * 0.008) / 0.17, 0, 1));
        const a = (i / N) * TAU + 0.55;
        return { dx: Math.cos(a) * s * 300 * k,
                 dy: Math.sin(a) * s * 210 * k,
                 rot: s * (H(89, i) - 0.5) * 1.5 };
      };
      if (age < 0.30){
        const s = 1 - ease(age / 0.30);
        c.save();
        c.globalCompositeOperation = "lighter";
        c.shadowBlur = 0;
        c.globalAlpha = s * 0.75;
        c.strokeStyle = glow; c.lineCap = "round";
        const N2 = b.text.length;
        for (let i = 0; i < N2; i++){
          const a = (i / N2) * TAU + 0.55;
          const lx = cx + Math.cos(a) * s * 300 * k;
          const ly = y  + Math.sin(a) * s * 210 * k;
          c.lineWidth = (1.5 + 3.5 * s) * k;
          c.beginPath();
          c.moveTo(lx + Math.cos(a) * 70 * k, ly + Math.sin(a) * 50 * k);
          c.lineTo(lx, ly);
          c.stroke();
        }
        c.restore();
      }
    }
    else if (b.w === "spellbreaker"){
      fn = (i) => {
        const a = 1 - ease(inK), o = out * out;
        return { dx: (H(73, i) - 0.5) * (a * 130 + o * 190) * k,
                 dy: (H(79, i) - 0.5) * (a * 90 + o * 150) * k,
                 rot: (H(83, i) - 0.5) * (a * 1.1 + o * 1.5),
                 a: 1 - o * 0.85 };
      };
    }

    this._letters(c, b.text, cx, cy, size, track, fn);

    if (age < 0.42){
      const k2 = age / 0.42;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.shadowBlur = 0;
      c.globalAlpha = (1 - k2) * 0.4;
      c.strokeStyle = glow; c.lineWidth = (3 + 9 * (1 - k2)) * k;
      c.beginPath();
      c.ellipse(cx, y - size * 0.28, (60 * k) + k2 * A.w * 0.7,
                (26 * k) + k2 * A.h * 0.10, 0, 0, TAU);
      c.stroke();
      c.restore();
    }
    c.restore();
  }

  /* ------------------------------------------------------------- intro --- */
  /* The fight card, v2: the clash. See introcard_build.py for the full
     rationale. Shape of the 4 seconds:

       0.00-0.46  the cards fly in from top and bottom and MEET at centre
       0.46       clank: sparks out of the seam, ring, shake, the clank sound
       0.46-0.74  they rebound to rest; the tape bars grow out of the impact
       0.74-3.50  the hold: everything readable, everything a real number
       3.50-4.00  the reveal: cards leave the way they came, the scrim lifts,
                  the bell lands on the hall — already lit, already drawn —
                  and the first sim step happens on the same picture

     Everything below is a pure function of introT (through shellHash for
     scatter) — no RNG, no state, nothing the simulation can see. The scene
     behind the scrim is the real renderer drawing the real match at t=0, via
     the _introScene reentry guard in draw(). */
  drawIntro(m){
    const c = this.ctx, I = CONFIG.intro;
    const e = clamp(I.dur - m.introT, 0, I.dur);        // elapsed card time
    const p = e / I.dur;                                 // 0 -> 1 overall
    const imp = e - I.clash;                             // time since impact
    const r = clamp((e - (I.dur - I.reveal)) / I.reveal, 0, 1);
    const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
    const fade = 1 - eo(r);

    /* the hall itself, held at t=0, under a scrim that the reveal lifts */
    this._introScene = true;
    this.draw(m);
    this._introScene = false;
    c.setTransform(this.k, 0, 0, this.k, 0, 0);
    c.save();
    c.globalAlpha = 0.80 * fade;
    c.fillStyle = "#05040A";
    c.fillRect(0, 0, this.W, this.H);
    c.restore();

    /* the broadcast package returns with the reveal — by the bell it is at
       full strength, so the cut frame is byte-identical to a fight frame */
    if (r > 0){
      c.save();
      c.globalAlpha = eo(r);
      this.drawHud(m);
      this.drawFooter(m);
      c.restore();
    }

    c.save();
    /* the impact shakes the whole card layer, and the shake dies out */
    const sh = imp > 0 ? 30 * Math.exp(-imp * 8) : 0;
    if (sh > 0.3)
      c.translate(Math.sin(imp * 91) * sh, Math.cos(imp * 77) * sh * 0.6);

    c.save();
    c.globalAlpha = fade;
    c.textAlign = "center";
    c.font = "700 28px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = "#6B5C48";
    c.fillText("SUPER WEAPON BALL: THE SUNDERED CROWN", this.W/2, 62);
    c.restore();

    /* The cards. Approach accelerates INTO the hit (ease-in), the rebound
       eases out of it, and the tape appears in the gap they leave behind —
       drawn first, so the parting cards physically uncover it. */
    const CH = IC.ch, restA = IC.margin, restB = this.H - CH - IC.margin;
    const meetA = this.H/2 - CH + 8, meetB = this.H/2 - 8;
    let yA, yB;
    if (imp <= 0){
      const k0 = clamp(e / I.clash, 0, 1), kIn = k0 * k0;
      yA = lerp(-CH - 90, meetA, kIn);
      yB = lerp(this.H + 90, meetB, kIn);
    } else {
      const k1 = eo(imp / 0.28);
      yA = lerp(meetA, restA, k1);
      yB = lerp(meetB, restB, k1);
    }
    if (r > 0){
      const k2 = Math.pow(r, 3);
      yA = lerp(restA, -CH - 90, k2);
      yB = lerp(restB, this.H + 90, k2);
    }

    if (imp > 0 && r < 1) this._introTape(m, restA + CH, restB, imp, fade);
    this._introCard(m.a, yA, CH, imp, fade);
    this._introCard(m.b, yB, CH, imp, fade);
    if (imp > 0) this._introFx(m, imp, fade);

    /* the countdown, so the cut never feels arbitrary. The seed line is
       gone (Rick: delete) — the seed still lives in the footer and on the
       result card for anyone replaying a fight. */
    c.save();
    c.globalAlpha = fade;
    const bw = 420, bx = (this.W - bw)/2, by = this.H - 74;
    c.fillStyle = "#191424"; this.roundRect(bx, by, bw, 7, 4); c.fill();
    c.fillStyle = "#C9A227"; this.roundRect(bx, by, bw * p, 7, 4); c.fill();
    c.restore();
    c.restore();
  }

  /* One fighter's card, v3 (2026-08-15): identity, silhouette, and its facts
     laid out to FILL the card instead of pooling at its foot.  See
     introfit_build.py for the full rationale; the short version is that the
     phone draws this at ~0.36x, so v2's 25px tip was a 9pt glyph and its two
     longest ult tips were shrink-to-fit 19px — 7pt — on the most important
     line of the card.

     Facts are descriptors from `_introFacts` and positions from
     `_introLayout`; this function only draws them, which is what lets
     introfit_probe.py check every relic's layout without a screenshot.
     All values still read live from WEAPONS/STATUS/CONFIG at draw time, and
     relicStatus/relicShot remain the single source verify.py's legibility
     contract calls. */
  _introCard(f, y0, CH, imp, fade){
    if (y0 < -CH - 20 || y0 > this.H + 20) return;
    const c = this.ctx, pal = f.aff, x = 40, w = this.W - 80;
    c.save();
    c.globalAlpha = fade;
    c.fillStyle = "#0C0914F4";
    this.roundRect(x, y0, w, CH, 12); c.fill();
    c.strokeStyle = pal.core + "55"; c.lineWidth = 2;
    this.roundRect(x, y0, w, CH, 12); c.stroke();
    c.fillStyle = pal.core;
    this.roundRect(x, y0, 9, CH, 5); c.fill();

    c.textAlign = "left";
    c.font = "700 64px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = "#EDE3D0";
    c.fillText(f.w.name.toUpperCase(), IC.tx, y0 + 88);
    c.font = "700 25px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = pal.core;
    c.fillText(f.aff.name.toUpperCase(), IC.tx + 2, y0 + 128);

    /* the weapon, fitted to the header band's art box.  v2 drew every
       silhouette at a single scale:2.2, which made the greatswords overrun
       the band and the twinblades a speck.  The box is fixed, the scale is
       whatever makes THIS weapon fill it (_artBox measures the shape rather
       than trusting its `reach`), so the art can no longer leave the card. */
    /* v4: the art turns, at the relic's OWN `spin`. The card then shows the
       stat it prints two lines below -- a fast weapon visibly turns faster --
       which a fixed pose cannot do.

       The MOTION is bounded rather than the scale. A first version fitted the
       art to its circumscribed radius so any angle was safe, and it cost 48%
       of the size on the long relics -- because a 112-unit weapon turned
       toward vertical cannot fit a 148-tall band at all. But the same
       arithmetic shows v3 ALREADY extends past artH at its own -0.38 pose, so
       the band is a layout hint and not a clip, and fitting to it was
       inventing a constraint the shipped card does not honour. The scale is
       therefore v3's, unchanged, and the ANGLE is what is kept small:

         entry   REST - 0.52 rad, easing in, arrested exactly on REST at the
                 clash -- the impact stops it, the way it stops the cards
         hold    a +-0.15 rad sway at the relic's own rate, so a fast relic
                 visibly breathes faster than a slow one and the card is alive
                 while it is being read

       Bounded sway also beats a monotone drift geometrically: a free-running
       idle at spin 3.4 would travel 2.09 rad across the hold and put the art
       somewhere its scale was never fitted for. */
    const box = this._artBox(f.w);
    const as = Math.min(IC.artMaxS, IC.artW / box.w, IC.artH / box.h);
    const REST = -0.38, rate = f.w.spin || 1.2;
    const SWEEP = 1.30, SWAY = 0.45, SWAYRATE = 0.22;
    const TRAVEL = 0.60;
    /* imp < 0 is the approach: the angle runs BACK from rest at `rate*3.2` so
       it arrives on REST at imp = 0 by construction, not by tuning. After the
       impact it holds still for 0.30s -- the clash has to read as a stop --
       then drifts. */
    const ang = imp <= 0
      ? REST - SWEEP * Math.pow(clamp(-imp / CONFIG.intro.clash, 0, 1), 0.65)
      : REST + SWAY * Math.sin(Math.max(0, imp - 0.30) * rate * SWAYRATE);
    c.save();
    c.translate(IC.artCX - as * (box.x + box.w / 2),
                y0 + IC.artCY - as * (box.y + box.h / 2));
    c.scale(as, as);
    c.rotate(ang);
    c.shadowColor = pal.core; c.shadowBlur = 26;
    this._artShape(c, f.w, pal);
    c.restore();

    /* the rule that closes the header and opens the facts */
    c.globalAlpha = fade * 0.5;
    c.fillStyle = "#6E6378";
    c.fillRect(IC.px, y0 + IC.ruleY, IC.pw, 1);
    c.globalAlpha = fade;

    const facts = this._introFacts(f);
    this._introLayout(facts, y0 + IC.top, y0 + CH - IC.bot);

    facts.forEach((r, i) => {
      /* cascade: each fact lands a beat after the last, after the impact */
      const a = clamp((imp - 0.20 - i * 0.09) / 0.22, 0, 1);
      if (a <= 0) return;
      const py = r.y + (1 - a) * 12;
      c.save();
      c.globalAlpha = fade * a;

      if (r.kind === "strip"){
        c.font = "800 25px 'Atkinson Hyperlegible Next',sans-serif";
        c.fillStyle = r.col;
        c.fillText(r.name, IC.tx, py + 34);
        const tw = c.measureText(r.name).width + 16;
        c.font = "500 " + r.wrap.size + "px 'Atkinson Hyperlegible Next',sans-serif";
        c.fillStyle = "#9C9384";
        c.fillText(r.wrap.lines[0], IC.tx + tw, py + 34);
        c.restore();
        return;
      }

      /* the ground: a tint of the fact's own colour, so the status reads as
         the fighter's and the ultimate reads as gold before a word is read */
      c.globalAlpha = fade * a * r.tintA;
      c.fillStyle = r.tint;
      this.roundRect(IC.px, py, IC.pw, r.h, 10); c.fill();
      c.globalAlpha = fade * a;
      if (r.edge){
        c.strokeStyle = r.edge; c.lineWidth = 1.5;
        this.roundRect(IC.px, py, IC.pw, r.h, 10); c.stroke();
      }
      c.fillStyle = r.rail;
      this.roundRect(IC.px, py + 9, 5, r.h - 18, 2.5); c.fill();

      const t0 = py + (r.h - r.contentH) / 2;
      c.font = "700 20px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = r.tagCol;
      c.fillText(r.tag, IC.tx, t0 + 30);
      const tw = c.measureText(r.tag).width + 16;
      c.font = "800 36px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = r.col;
      c.fillText(r.name, IC.tx + tw, t0 + 30);
      if (r.chip){
        c.textAlign = "right";
        c.font = "700 22px 'Atkinson Hyperlegible Next',sans-serif";
        c.fillStyle = "#8A7F70";
        c.fillText(r.chip, IC.txr, t0 + 28);
        c.textAlign = "left";
      }
      c.font = "500 " + r.wrap.size + "px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = r.ink;
      for (let j = 0; j < r.wrap.lines.length; j++)
        c.fillText(r.wrap.lines[j], IC.tx, t0 + 70 + j * 38);
      c.restore();
    });
    c.restore();
  }

  /* The silhouette, drawn identically for the card and for the measurement
     below — one function, so a bbox can never disagree with what is drawn. */
  _artShape(c, w, pal){
    if (w.shape === "flail"){
      /* the same bowed chain it has in the arena, so the card shows the
         viewer the thing they are about to watch */
      const L = w.reach * 0.50;
      c.strokeStyle = "#6B6270"; c.lineWidth = w.width * 0.20; c.lineCap = "round";
      c.beginPath(); c.moveTo(-26, 0); c.quadraticCurveTo(L*0.5, 17, L, 0); c.stroke();
      c.fillStyle = "#9A93A4";
      for (let i = 1; i <= 8; i++){
        const t = i / 9, u = 1 - t;
        c.beginPath();
        c.arc(u*u*-26 + 2*u*t*(L*0.5) + t*t*L, 2*u*t*17, w.width * 0.13, 0, TAU);
        c.fill();
      }
      c.translate(L, 0);
      SHAPES.flailHead(c, w.artW, pal, 0.5);
    } else {
      const fn = SHAPES[w.shape];
      if (fn) fn(c, w.reach * 0.86, w.artW, pal);
    }
  }

  /* A shape's true extent, in the card's rotated frame, measured once per
     weapon and cached.  The shapes are drawing code, not geometry — reach
     and artW predict a greatsword's box and lie about a bow's — so the only
     honest way to fit one to a box is to rasterise it and look.  One 200px
     offscreen pass per weapon per page (~0.5ms), never during the fight. */
  _artBox(w){
    let b = ART_BOX.get(w.id);
    if (b) return b;
    /* Scanned every 2nd pixel and then padded by the step, so the box can
       only ever be too GENEROUS — an under-report would let art out of the
       card, which is the bug this whole function exists to prevent.  If the
       ink reaches the scratch canvas edge the shape outgrew the scratch and
       the box would be a lie, so the canvas doubles and it measures again
       rather than returning a clipped answer. */
    const STEP = 2;
    for (let N = 200; N <= 800; N *= 2){
      const OX = N * 0.26, OY = N * 0.59;   // room for the -0.38 rotation
      const cv = document.createElement("canvas");
      cv.width = N; cv.height = N;
      const c = cv.getContext("2d");
      c.translate(OX, OY); c.rotate(-0.38);
      this._artShape(c, w, AFFINITIES[w.aff] || w.aff);
      const d = c.getImageData(0, 0, N, N).data;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (let y = 0; y < N; y += STEP)
        for (let x = 0; x < N; x += STEP)
          if (d[(y * N + x) * 4 + 3] > 12){
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
      if (x1 < x0){ b = { x: -1, y: -1, w: 2, h: 2 }; break; }
      x0 -= STEP; y0 -= STEP; x1 += STEP; y1 += STEP;
      if (x0 > 0 && y0 > 0 && x1 < N - 1 && y1 < N - 1){
        b = { x: x0 - OX, y: y0 - OY, w: x1 - x0, h: y1 - y0 };
        break;
      }
    }
    if (!b) b = { x: -1, y: -1, w: 2, h: 2 };
    ART_BOX.set(w.id, b);
    return b;
  }

  /* The facts, as data.  Rick 08-14: no SHOOTS line (the silhouette and the
     ANY reach already say it); swing relics say they TRACK; the ultimate
     reads ULTIMATE > name > what it does with numbers > cooldown.  v3 moves
     the cooldown off the sentence and onto its own chip, and drops
     TRUESTRIKE to a strip — it is a class property, not a headline. */
  _introFacts(f){
    const pal = f.aff, out = [];
    const tipw = IC.txr - IC.tx;
    if (f.w.mode === "swing")
      out.push({ kind: "strip", name: "TRUESTRIKE",
                 tip: "Swords track their target instead of rotating",
                 col: pal.glow, gapBefore: 0, h: 52 });
    const rs = relicStatus(f.w);
    if (rs.def){
      /* ON HIT for self-statuses too — ward is banked by landing hits.  The
         +n is suppressed when the status cannot stack (ward maxStacks:1 —
         its onSelf value is a banking-rate multiplier, not a stack count). */
      const n = (f.w.onHit && f.w.onHit[rs.key]) ||
                (f.w.onSelf && f.w.onSelf[rs.key]) || 1;
      const cnt = rs.def.maxStacks > 1 ? "+" + n + " " : "";
      out.push({ kind: "panel", tag: "ON HIT",
                 name: (rs.self ? "GAIN " : "") + cnt + rs.def.name.toUpperCase(),
                 tip: rs.def.tip, col: pal.core, tagCol: "#7E7263",
                 ink: "#C6BBA6", rail: pal.core, tint: pal.core, tintA: 0.10,
                 edge: null, chip: null, gapBefore: 14 });
    }
    out.push({ kind: "panel", tag: "ULTIMATE",
               name: f.w.ult.name.toUpperCase(), tip: f.w.ult.tip || "",
               col: "#FFF4D0", tagCol: "#9C8654", ink: "#CFC2A4",
               rail: "#C9A227", tint: "#C9A227", tintA: 0.075,
               edge: "#C9A22740", chip: f.w.ult.charge + "s COOLDOWN",
               gapBefore: 28 });
    for (const r of out){
      r.wrap = this._introWrap(r.tip, r.kind === "strip"
                               ? tipw - 190 : tipw, r.kind === "strip" ? 26 : 30,
                               r.kind === "strip" ? 1 : 2);
      if (r.kind !== "strip"){
        r.contentH = 30 + 8 + 38 * r.wrap.lines.length;
        r.h = r.contentH + 28;
      }
    }
    return out;
  }

  /* Spend the card's spare height on the facts.  Panels stretch first, up to
     IC.stretch each so a two-fact card does not become two slabs, and the
     remainder widens the gaps.  Returns false if the facts do not fit at all
     — introfit_probe.py asserts that never happens on any relic, which is
     the check v2 had no way to write because its layout was inline. */
  _introLayout(facts, top, bot){
    let nat = 0;
    for (let i = 0; i < facts.length; i++)
      nat += facts[i].h + (i ? facts[i].gapBefore : 0);
    let slack = (bot - top) - nat;
    const natSlack = slack;            // headroom BEFORE stretching: the
    const pans = facts.filter(r => r.kind === "panel");   // one that can go
                                                          // negative
    if (slack > 0 && pans.length){
      const per = Math.min(IC.stretch, slack / pans.length);
      for (const r of pans) r.h += per;
      slack -= per * pans.length;
    }
    const nGap = facts.length - 1;
    const extra = slack > 0 && nGap > 0 ? slack / nGap : 0;
    const squash = slack < 0 ? Math.max(0, 1 + slack /
      Math.max(1, facts.slice(1).reduce((s, r) => s + r.gapBefore, 0))) : 1;
    let y = top;
    for (let i = 0; i < facts.length; i++){
      if (i) y += facts[i].gapBefore * squash + extra;
      facts[i].y = y;
      y += facts[i].h;
    }
    return { fits: y <= bot + 0.5, bottom: y, slack: bot - y, natSlack };
  }

  /* Word-wrap for the card's tips.  v2 shrank the face until the string fit
     one line, which made the longest and most important lines the smallest
     type on the card.  This keeps the face and spends a second line; the
     shrink survives only for a string no break can fit, with a 20px floor. */
  _introWrap(text, maxW, size, maxLines){
    const c = this.ctx;
    const words = String(text || "").split(" ");
    for (;;){
      c.font = "500 " + size + "px 'Atkinson Hyperlegible Next',sans-serif";
      const lines = [];
      let cur = "";
      for (const wd of words){
        const t = cur ? cur + " " + wd : wd;
        if (!cur || c.measureText(t).width <= maxW) cur = t;
        else { lines.push(cur); cur = wd; }
      }
      lines.push(cur);
      const over = lines.some(l => c.measureText(l).width > maxW);
      if ((!over && lines.length <= maxLines) || size <= 20)
        return { lines, size, over };
      size -= 1;
    }
  }

  /* The tale of the tape. Pairwise, not roster-normalised: each row scales
     to the larger of the two values, so "who has the edge and by how much"
     is one glance, in real units. The winning side is lit in its school
     colour; a tie lights both. RANGED prints "ANY" with a full bar — the
     bow's reach:54 is the shortest number in the game on the relic that
     hits from anywhere, and the old card already learned that lesson. */
  _introTape(m, topY, botY, imp, fade){
    const c = this.ctx, W2 = this.W / 2;
    const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
    const A = m.a.w, B = m.b.w;
    const rangedA = !!relicShot(A), rangedB = !!relicShot(B);
    const fmt = (v, d) => d ? (Math.round(v * 10) / 10).toFixed(d)
                            : String(Math.round(v));
    const rows = [
      ["DAMAGE / HIT", A.dmg, B.dmg, 0, null, null],
      ["REACH", rangedA ? Infinity : A.reach, rangedB ? Infinity : B.reach, 0,
       rangedA ? "ANY" : null, rangedB ? "ANY" : null],
      ["SWING SPEED", A.spin, B.spin, 1, null, null],
      ["WEIGHT", A.mass, B.mass, 1, null, null],
    ];

    c.save();
    /* VS, stamped on the impact */
    const vA = clamp(imp / 0.05, 0, 1);
    if (vA > 0){
      c.save();
      c.globalAlpha = fade * vA;
      c.textAlign = "center";
      c.translate(W2, topY + 64);
      const vs = lerp(2.3, 1, eo(imp / 0.14));
      c.scale(vs, vs);
      c.font = "800 80px 'Atkinson Hyperlegible Next',sans-serif";
      c.lineWidth = 9; c.strokeStyle = "#000000CC";
      c.strokeText("VS", 0, 28);
      c.fillStyle = "#C9A227";
      c.shadowColor = "#C9A227"; c.shadowBlur = 30;
      c.fillText("VS", 0, 28);
      c.restore();
    }

    let yy = topY + 180;
    for (let i = 0; i < rows.length; i++){
      const [label, va, vb, dec, ta, tb] = rows[i];
      const bk = eo((imp - 0.08 - i * 0.07) / 0.30);
      if (bk <= 0){ yy += 84; continue; }
      const fa = va === Infinity ? 1e9 : va, fb = vb === Infinity ? 1e9 : vb;
      const mx = Math.max(va === Infinity ? 0 : va, vb === Infinity ? 0 : vb) || 1;
      const sides = [
        [m.a, va === Infinity ? 1 : va / mx, fa >= fb, ta || fmt(va, dec), -1],
        [m.b, vb === Infinity ? 1 : vb / mx, fb >= fa, tb || fmt(vb, dec),  1],
      ];
      c.save();
      c.globalAlpha = fade * bk;
      c.textAlign = "center";
      c.font = "700 27px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = "#9C8F7E";
      c.fillText(label, W2, yy + 8);
      for (const [f, frac, lit, s, dir] of sides){
        /* 280-long bars and numbers pulled in to ±430: the widest value
           ("104" at 46px, "ANY" at 34px) now keeps a ≥30px margin to the
           frame edge on both sides — the first edge-pairs sheet clipped */
        const x0 = W2 + dir * 122;
        const L = Math.max(6, 280 * clamp(frac, 0, 1) * bk);
        c.globalAlpha = fade * bk * 0.55;
        c.fillStyle = "#221C30";
        this.roundRect(dir < 0 ? x0 - 280 : x0, yy - 15, 280, 13, 6); c.fill();
        c.globalAlpha = fade * bk;
        c.fillStyle = lit ? f.aff.core : "#4A4356";
        this.roundRect(dir < 0 ? x0 - L : x0, yy - 15, L, 13, 6); c.fill();
        /* the numbers count up with the bars, so the impact literally knocks
           the values out of the fighters */
        c.textAlign = dir < 0 ? "right" : "left";
        /* "ANY" is wider than any numeral and was clipping the frame edge —
           words get a smaller face than numbers */
        const isNum = /^[0-9.]+$/.test(s);
        c.font = isNum ? "800 46px 'Atkinson Hyperlegible Next',sans-serif"
                       : "800 34px 'Atkinson Hyperlegible Next',sans-serif";
        c.fillStyle = lit ? "#EDE3D0" : "#6E6378";
        const shown = isNum ? fmt(parseFloat(s) * (0.4 + 0.6 * bk), dec) : s;
        c.fillText(shown, W2 + dir * 430, yy + (isNum ? 2 : 0));
      }
      c.restore();
      yy += 84;
    }

    const hpA = eo((imp - 0.5) / 0.3);
    if (hpA > 0){
      c.globalAlpha = fade * hpA;
      c.textAlign = "center";
      c.font = "600 26px 'Atkinson Hyperlegible Next',sans-serif";
      c.fillStyle = "#7E7263";
      c.fillText(CONFIG.combat.baseHP + " HP EACH", W2, yy + 4);
    }
    c.restore();
  }

  /* The impact itself: sparks thrown SIDEWAYS out of the seam (the cards
     collided vertically, so the metal leaves horizontally — the same rule
     the clank sparks follow), a ring, and a flash along the seam. Pure
     function of imp through shellHash; nothing here can touch the sim. */
  _introFx(m, imp, fade){
    if (imp > 0.95) return;
    const c = this.ctx, cx = this.W / 2, cy = this.H / 2;
    const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
    const H = shellHash;
    c.save();
    c.globalCompositeOperation = "lighter";
    c.lineCap = "round";
    const cols = ["#FFF4D0", m.a.aff.glow, m.b.aff.glow];
    for (let i = 0; i < 30; i++){
      const t2 = clamp((imp - H(7311, i) * 0.05) / 0.55, 0, 1);
      if (t2 <= 0 || t2 >= 1) continue;
      const base = i % 2 ? 0 : Math.PI;
      const ang = base + (H(7313, i) - 0.5) * 0.9;
      const spd = 620 * (0.35 + H(7317, i));
      const d = spd * 0.55 * (1 - Math.pow(1 - t2, 2.4));
      const px = cx + Math.cos(ang) * d;
      const py = cy + Math.sin(ang) * d + 40 * t2 * t2;
      c.globalAlpha = fade * (1 - t2) * 0.9;
      c.strokeStyle = cols[i % 3];
      c.lineWidth = 4.5 * (1 - t2 * 0.6);
      c.beginPath();
      c.moveTo(px, py);
      c.lineTo(px - Math.cos(ang) * 30 * (1 - t2), py - Math.sin(ang) * 30 * (1 - t2));
      c.stroke();
    }
    const t3 = clamp(imp / 0.42, 0, 1);
    if (t3 < 1){
      c.globalAlpha = fade * (1 - t3) * 0.75;
      c.strokeStyle = "#FFF4D0"; c.lineWidth = 7 * (1 - t3 * 0.7);
      c.beginPath(); c.arc(cx, cy, 24 + eo(t3) * 430, 0, TAU); c.stroke();
      c.globalAlpha = fade * (1 - t3) * 0.45;
      c.strokeStyle = "#C9A227"; c.lineWidth = 4;
      c.beginPath(); c.arc(cx, cy, 12 + eo(t3 * 0.8) * 300, 0, TAU); c.stroke();
    }
    const t4 = clamp(imp / 0.16, 0, 1);
    if (t4 < 1){
      const g = c.createLinearGradient(0, cy - 60, 0, cy + 60);
      g.addColorStop(0, "#FFF4D000"); g.addColorStop(0.5, "#FFF4D0");
      g.addColorStop(1, "#FFF4D000");
      c.globalAlpha = fade * (1 - t4) * 0.8;
      c.fillStyle = g;
      c.fillRect(0, cy - 60, this.W, 120);
    }
    c.restore();
  }

  /* One line, not two. The taller hall took the space the second line used to
     sit in, and the seed is a debugging courtesy rather than something the
     viewer needs a line of its own for. */
  /* How far the hall is scaled right now. 1 = untouched. */
  scrunchK(m){
    const S = CONFIG.scrunch;
    if (!S.on || !m || !(m.scrunchT > 0)) return 1;
    const hold = m.scrunchMode === "result" ? 999 : S.intro;
    const total = S.ease * 2 + hold;
    const e = total - m.scrunchT;
    const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
    if (e < S.ease)        return lerp(1, S.k, eo(e / S.ease));
    if (e < S.ease + hold) return S.k;
    return lerp(S.k, 1, eo((e - S.ease - hold) / S.ease));
  }

  /* The panel. Laid out FOR this strip rather than borrowed from the middle of
     a full-screen card -- `_introTape` is 546px tall and centred for a 1920
     frame, and reusing it meant scaling it to 0.9 and hoping. Every position
     below is derived from the box it is actually given, so the panel adapts if
     `k` moves instead of being re-tuned by hand. */
  drawScrunchPanel(m, k){
    const S = CONFIG.scrunch, c = this.ctx;
    const y = this.arenaTop + this.ah * k + S.gap;
    /* AND THE PANEL LIVES IN THE SAME SAFE BOX THE HALL DOES.

       `CONFIG.scrunch.bottom` is a hardcoded 1812 in design space, from when
       1812 was simply "near the bottom of the frame". Reserving a strip made
       it two bugs at once, and Rick found both:

         the panel now runs to 1812, which is 232px BELOW the safe line -- so
         the ULTIMATE row, the one thing the panel exists to show, sits under
         the caption. "it also looks like the bottom of the video is still
         cut off."

         and `_panelFacts` pins ON HIT to the panel's top and ULTIMATE to its
         BOTTOM, so the space between them is `h` minus two fixed blocks. A
         shorter hall made `y` smaller, `h` bigger, and the gap grew by 244px.
         "something has gone really wrong with the scrunch. it has a huge gap
         in the middle."

       One clamp fixes both, and `Math.min` keeps the identity exact: at
       FRAME.foot 0 the safe line is 1908 and 1812 still wins, so nothing
       moves. frame_probe asserts that on a SCRUNCHED frame now -- the first
       version only ever rendered an ordinary one, which is why this shipped. */
    const h = Math.min(S.bottom, this.H - FRAME.foot - 12) - y,
          x = 24, w = this.W - 48;
    if (h < 60) return;
    /* the panel arrives as the hall retreats, on the same curve */
    const a = clamp((1 - k) / (1 - S.k), 0, 1);
    c.save();
    c.globalAlpha = a;
    c.fillStyle = "#0C0914";
    this.roundRect(x, y, w, h, 14); c.fill();
    c.strokeStyle = "#C9A22755"; c.lineWidth = 2;
    this.roundRect(x, y, w, h, 14); c.stroke();
    if (m.scrunchMode === "result") this._panelResult(m, x, y, w, h);
    else                            this._panelFacts(m, x, y, w, h);
    c.restore();
  }

  /* WHAT THE STATUSES AND ULTS DO -- not a stat comparison.

     Rick: *"i dont think stats are what the scrunch should show. it should
     show what the status effects and ults do"*. He is right and the tape is
     out. Damage/hit and weight are inert trivia a viewer cannot act on; SUNDER
     and HEMORRHAGE and QUARRELSTORM are the things that are about to happen on
     screen, and the panel is a legend for them. When "+2 HEMORRHAGE" flashes
     over a relic ten seconds later, this is what makes the red numbers mean
     something.

     Every string comes from `_introFacts` and `STATUS[].tip`, which the intro
     card already uses -- so the panel and the card cannot drift, and the
     ">=40 char" tip discipline verify.py enforces still governs the copy. */
  /* SELF-CONTAINED fact composition and wrapping.

     Earlier cuts called `_introFacts` / `_introWrap` so the panel and the intro
     card could not drift. That is the right instinct and the wrong dependency:
     those helpers were extracted late in the chain, and `01-live` composes the
     same facts INLINE inside `_introCard`. A patch that only applies to builds
     newer than the extraction is not a patch for the live session.

     So the panel composes its own, from the same single source of truth the
     card reads -- `STATUS[].tip`, `relicStatus()`, `w.ult.tip` and
     `w.ult.charge`. The STRINGS cannot drift because there is only one copy of
     them; only the composition is duplicated, and the panel is its own surface
     with its own layout anyway. The cooldown goes on a chip rather than being
     concatenated into the tip, which is where the newer card puts it too. */
  _scrunchWrap(text, maxW, size, maxLines){
    const c = this.ctx;
    const words = String(text || "").split(" ");
    for (;;){
