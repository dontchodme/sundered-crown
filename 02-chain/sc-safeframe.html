      c.font = "500 " + size + "px ui-sans-serif,system-ui,sans-serif";
      const lines = []; let cur = "";
      for (const wd of words){
        const t = cur ? cur + " " + wd : wd;
        if (!cur || c.measureText(t).width <= maxW) cur = t;
        else { lines.push(cur); cur = wd; }
      }
      lines.push(cur);
      const over = lines.some(l => c.measureText(l).width > maxW);
      if ((!over && lines.length <= maxLines) || size <= 15) return { lines, size };
      size -= 1;
    }
  }

  _scrunchFacts(f){
    const pal = f.aff, out = [];
    if (f.w.mode === "swing")
      out.push({ kind: "strip", name: "TRUESTRIKE",
                 tip: "Swords track their target instead of rotating",
                 col: pal.glow });
    const rs = relicStatus(f.w);
    if (rs && rs.def){
      /* ON HIT for self-statuses too -- ward is banked by landing hits. The
         +n is suppressed when the status cannot stack. */
      const n = (f.w.onHit && f.w.onHit[rs.key]) ||
                (f.w.onSelf && f.w.onSelf[rs.key]) || 1;
      const cnt = rs.def.maxStacks > 1 ? "+" + n + " " : "";
      out.push({ kind: "panel", tag: "ON HIT",
                 name: (rs.self ? "GAIN " : "") + cnt + rs.def.name.toUpperCase(),
                 tip: rs.def.tip, col: pal.core, tagCol: "#7E7263",
                 ink: "#C6BBA6", rail: pal.core });
    }
    out.push({ kind: "panel", tag: "ULTIMATE",
               name: f.w.ult.name.toUpperCase(), tip: f.w.ult.tip || "",
               col: "#FFF4D0", tagCol: "#9C8654", ink: "#CFC2A4",
               rail: "#C9A227", chip: f.w.ult.charge + "s COOLDOWN" });
    return out;
  }

  _panelFacts(m, x, y, w, h){
    const c = this.ctx;
    const pad = 22, nameH = 74, gut = 26;
    const colW = (w - pad * 2 - gut) / 2;
    const cols = [
      { f: m.a, x: x + pad,                    align: "left" },
      { f: m.b, x: x + pad + colW + gut,       align: "left" },
    ];

    /* names, outboard, each beside its own colour rail -- the two columns are
       identified by colour and position and nothing else would say which is
       which */
    [[m.a, x + pad, 1], [m.b, x + w - pad, -1]].forEach(([f, tx, dir]) => {
      c.fillStyle = f.aff.core;
      this.roundRect(dir > 0 ? tx : tx - 9, y + pad + 2, 9, 52, 5); c.fill();
      c.textAlign = dir > 0 ? "left" : "right";
      c.font = "700 38px ui-serif,Georgia,serif";
      c.fillStyle = "#EDE3D0";
      c.fillText(f.w.name.toUpperCase(), tx + dir * 20, y + pad + 36);
      c.font = "700 19px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = f.aff.core;
      c.fillText(f.aff.name.toUpperCase(), tx + dir * 22, y + pad + 60);
    });
    c.strokeStyle = "#C9A22733"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + pad, y + pad + nameH);
    c.lineTo(x + w - pad, y + pad + nameH); c.stroke();
    /* the column divider, so two independent lists do not read as one */
    c.strokeStyle = "#C9A22722";
    c.beginPath(); c.moveTo(x + pad + colW + gut / 2, y + pad + nameH + 10);
    c.lineTo(x + pad + colW + gut / 2, y + h - pad); c.stroke();

    const facts = cols.map(cc => this._scrunchFacts(cc.f));
    /* a class trait (TRUESTRIKE) is one line and only some relics have one.
       Reserve the same height in BOTH columns so the ON HIT blocks start level
       -- a comparison whose two halves are offset stops being a comparison. */
    const hasStrip = facts.some(fs => fs.some(r => r.kind === "strip"));
    const stripH = hasStrip ? 40 : 0;
    const top = y + pad + nameH + 16;

    const block = (r, cx, by, wid, bottom) => {
      const wrap = this._scrunchWrap(r.tip, wid - 14, 21, 3);
      const bodyH = 20 + 30 + wrap.lines.length * (wrap.size + 6);
      const yy = bottom ? by - bodyH : by;
      c.fillStyle = r.rail || "#C9A227";
      this.roundRect(cx, yy + 2, 5, bodyH - 8, 3); c.fill();
      c.textAlign = "left";
      c.font = "700 16px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = r.tagCol || "#7E7263";
      c.fillText(r.tag || "", cx + 16, yy + 16);
      if (r.chip){
        c.textAlign = "right";
        c.fillStyle = "#7E7263";
        c.fillText(r.chip, cx + wid - 6, yy + 16);
        c.textAlign = "left";
      }
      c.font = "700 27px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = r.col || "#EDE3D0";
      c.fillText(r.name, cx + 16, yy + 46);
      c.font = "500 " + wrap.size + "px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = r.ink || "#C6BBA6";
      wrap.lines.forEach((ln, i) =>
        c.fillText(ln, cx + 16, yy + 46 + 26 + i * (wrap.size + 6)));
      return bodyH;
    };

    cols.forEach((cc, i) => {
      const fs = facts[i];
      const strip = fs.find(r => r.kind === "strip");
      if (strip){
        c.textAlign = "left";
        c.font = "700 17px ui-sans-serif,system-ui,sans-serif";
        c.fillStyle = strip.col;
        c.fillText(strip.name, cc.x, top + 14);
        const wr = this._scrunchWrap(strip.tip, colW, 19, 1);
        c.font = "500 " + wr.size + "px ui-sans-serif,system-ui,sans-serif";
        c.fillStyle = "#8B8071";
        c.fillText(wr.lines[0], cc.x, top + 34);
      }
      const onHit = fs.find(r => r.tag === "ON HIT");
      if (onHit) block(onHit, cc.x, top + stripH, colW, false);
      const ult = fs.find(r => r.tag === "ULTIMATE");
      if (ult) block(ult, cc.x, y + h - pad, colW, true);
    });
  }

  /* The verdict, in the same strip. The point of putting it here instead of
     over the hall is that the loser is coming apart at exactly this moment and
     the full-screen card used to bury that behind a scrim. */
  _panelResult(m, x, y, w, h){
    const c = this.ctx, W2 = x + w / 2;
    const wn = m.winner, ls = m.loser;
    if (!wn){ return; }
    c.textAlign = "center";
    c.font = "700 22px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#6E6378";
    c.fillText(m.reason === "timeout" ? "THE SEALS HOLD" : "THE CROWN PASSES TO", W2, y + 40);

    c.font = "700 58px ui-serif,Georgia,serif";
    c.fillStyle = wn.aff.core;
    c.shadowColor = wn.aff.core; c.shadowBlur = 40;
    c.fillText(wn.w.name.toUpperCase(), W2, y + 104);
    c.shadowBlur = 0;

    /* THE NUMBER THE VIDEO NEVER STATED. Every week-1 note is written around
       it -- 2 HP of 300, won on 12 HP, Ironhail on 8 HP -- and it has never
       been on screen at a size anyone reads on a phone. */
    const hp = Math.ceil(wn.hp);
    c.font = "800 92px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#EDE3D0";
    c.fillText(hp + " HP", W2, y + h - 92);
    c.font = "700 22px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#7E7263";
    c.fillText("OF " + CONFIG.combat.baseHP + " REMAINING", W2, y + h - 58);

    c.font = "400 21px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#5E5568";
    c.fillText(`over ${ls.w.name}  ·  ${m.t.toFixed(1)}s  ·  ${m.clankCount} clanks`,
               W2, y + h - 20);
  }

  drawFooter(m){
    /* The panel is the framing while the hall is scrunched, and the footer
       would otherwise sit just above it -- visible through the panel while it
       is still fading in. Suppressed for the whole scrunch rather than only
       where it overlaps, so it never half-appears. */
    if (CONFIG.scrunch.on && this.scrunchK(m) < 0.999) return;
    return this._drawFooterReal(m);
  }

  _drawFooterReal(m){
    const c = this.ctx;
    const y = BAND.pos === "bottom" ? this.H - 18
                                    : this.arenaTop + this.ah + 46;
    c.save();
    c.textAlign = "center";
    c.font = "700 22px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = "#5E5140";
    const title = "SUPER WEAPON BALL: THE SUNDERED CROWN";
    const tw = c.measureText(title).width;
    c.fillText(title, this.W/2 - 62, y);
    c.font = "400 16px 'Atkinson Hyperlegible Mono',monospace";
    c.fillStyle = "#3A3229";
    c.textAlign = "left";
    c.fillText("·  seed " + m.seed, this.W/2 - 62 + tw/2 + 22, y);
    c.restore();
  }

  drawResult(m){
    /* The scrunch panel carries the verdict now. Both at once would put
       a 60% scrim over the shatter, which is the exact defect the note
       below was written about. */
    if (CONFIG.scrunch.on && m.scrunchMode === "result") return;
    const c = this.ctx, w = m.winner, l = m.loser;
    /* Fade and settle instead of a hard cut. The kill already has a 550ms
       freeze and a white flash; slamming a card on top of that reads as a
       glitch rather than a verdict. `resultT` is counted up in decay(). */
    /* Held back until the shell has finished coming apart. The card used to
       start fading in on the same frame as the killing blow, so its scrim sat
       over the shatter and the most legible moment in the match — the loser
       visibly breaking — played out behind 60% black. Kill, then shatter, then
       verdict, in that order and each one on its own. */
    const HOLD = 1.05;
    const k = clamp(((m.resultT || 0) - HOLD) / 0.45, 0, 1);
    if (k <= 0) return;
    const ease = 1 - Math.pow(1 - k, 3);
    c.save();
    c.globalAlpha = ease;
    c.fillStyle = "#05040899"; c.fillRect(0, 0, this.W, this.H);
    const cardY = this.H * 0.32 + (1 - ease) * 26, cardH = this.H * 0.215;
    c.fillStyle = "#0E0A16F7";
    this.roundRect(46, cardY, this.W - 92, cardH, 6); c.fill();
    c.strokeStyle = "#C9A22799"; c.lineWidth = 3;
    this.roundRect(46, cardY, this.W - 92, cardH, 6); c.stroke();
    c.strokeStyle = "#C9A22744"; c.lineWidth = 1;
    this.roundRect(56, cardY + 10, this.W - 112, cardH - 20, 4); c.stroke();

    c.textAlign = "center";
    c.font = "700 26px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = "#6E6378";
    c.fillText(m.reason === "timeout" ? "THE SEALS HOLD" : "THE CROWN PASSES TO",
               this.W/2, cardY + 74);

    c.font = "700 78px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = w.aff.core;
    c.shadowColor = w.aff.core; c.shadowBlur = 46;
    c.fillText(w.w.name.toUpperCase(), this.W/2, cardY + 172);
    c.shadowBlur = 0;

    c.font = "700 42px 'Atkinson Hyperlegible Mono',monospace";
    c.fillStyle = "#EDE3D0";
    c.fillText(Math.ceil(w.hp) + " HP", this.W/2, cardY + 244);

    c.font = "400 23px 'Atkinson Hyperlegible Next',sans-serif";
    c.fillStyle = "#5E5568";
    c.fillText(`over ${l.w.name}  ·  ${m.t.toFixed(1)}s  ·  ${m.clankCount} clanks`,
               this.W/2, cardY + 300);
    c.fillText(`${w.hits} hits  ·  ${w.crits} crits  ·  seed ${m.seed}`,
               this.W/2, cardY + 338);
    c.restore();
  }

  roundRect(x, y, w, h, r){
    const c = this.ctx;
    r = Math.min(r, h/2, w/2);
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
}

/* -------------------------------------------------------- HEADLESS RUNNER */
function simulate(idA, idB, seed){
  const m = new Match(idA, idB, seed);
  m.slLive = false;          // headless: see the note on Match.slLive
  const dt = CONFIG.physics.dt;
  let guard = 0;
  while (!m.over && guard++ < 200000) m.step(dt);
  return m.summary();
}

function batch(idA, idB, n){
  const out = { a:0, b:0, dur:[], hp:[], clanks:[], hits:[] };
  for (let i = 0; i < n; i++){
    const r = simulate(idA, idB, (Math.random()*4294967296) >>> 0);
    if (r.winner === WEAPON_BY_ID[idA].name) out.a++; else out.b++;
    out.dur.push(r.duration); out.hp.push(r.hp);
    out.clanks.push(r.clanks); out.hits.push(r.hits.a + r.hits.b);
  }
  const avg = arr => arr.reduce((s,v)=>s+v,0)/arr.length;
  return { a:out.a, b:out.b,
           avgDur:+avg(out.dur).toFixed(1),
           minDur:+Math.min(...out.dur).toFixed(1),
           maxDur:+Math.max(...out.dur).toFixed(1),
           avgHp:+avg(out.hp).toFixed(0),
           avgClanks:+avg(out.clanks).toFixed(1),
           avgHits:+avg(out.hits).toFixed(1) };
}

/* ==========================================================================
   CINEMA — an experimental director.  DEMO BUILD, not shipped.
   ==========================================================================

   The brief: make the big moments feel big. Massive hit stop, a slow-motion
   push into the point of contact, and the score dragging under it.

   THE ONE LAW: this file may not change who wins.

   It is kept by construction, not by discipline. The director owns exactly
   three things and none of them are the simulation:

     1. TIME SCALE — how much WALL time the frame loop feeds to the fixed-step
        accumulator. `acc += raw * speed * CINE.timeScale`, and the sim still
        consumes it in identical CONFIG.physics.dt slices. Feeding less wall
        time changes how FAST the same sequence of steps is played, never what
        the steps are. timeScale 0 is a freeze; 0.12 is slow motion; the match
        that comes out the other end is byte-identical to the one that would
        have come out at 1.0. This is why the cinematic freeze is NOT
        m.hitStop: hit stop lives INSIDE the sim, and m.t advances through it,
        so lengthening it really would change the fight.
     2. A CAMERA — zoom and focus, applied in the renderer's existing punch
        slot.
     3. AN AUDIO SEND — a lowpass, a convolution reverb and a duck, spliced
        between the SFX bus and the destination.

   Nothing in Match reads CINE. The only additions to the sim are `beat()`
   calls, which push to a presentation array in the same way `note()` and
   `statusTag()` already do.

   ------------------------------------------------------------------ prescan

   The director does not react. It runs the whole match headless first — the
   sim is deterministic and steppable, so `new Match(a, b, seed)` stepped to
   `over` gives the exact beat list the live match will produce — scores every
   beat, and picks a CUT LIST before the first frame is drawn.

   That buys three things reaction cannot:

     * ANTICIPATION. It can start the push half a second BEFORE the killing
       blow, because it knows the blow is coming. A reactive director can only
       ever arrive late. (A reactive one was built for comparison and has been
       deleted: it lost on every axis and there is no reason to carry it.)
     * PACING. When two qualifying moments fall inside minGap, the STRONGER
       one survives -- a reactive director must take whichever it saw first.

   What prescan is NOT used for is ranking. Nothing is chosen for being the
   biggest thing in this particular match; everything is chosen for clearing an
   absolute bar. Seeing the whole fight in advance does not let the director
   pick a winner out of a weak field.
*/

const CINE = {
  on: true,
  tape: true,             // true -> the score itself slows down (see CineAudio)
  intensity: 1.0,
  /* How far past the strict "never show past the wall" bound the camera may
     lean, as a fraction of it. The strict bound is (1 - 1/z) of half the
     frame, which at 1.34x is 72 of 260 sim units -- so without this, `bias`
     is a no-op for any contact more than 72 units off centre and the only
     lever on framing is zoom. drawArena bleeds its floor by the same margin
     so leaning past the wall shows more hall, not a seam. */
  overscan: 0.55,
  /* HANDHELD. A camera that eases along a perfect exponential to a perfect
     stop is a tween, and a tween reads as a crop of the picture rather than as
     someone standing in the hall. This is a low-amplitude two-frequency drift
     -- deliberately not random, so it is identical every replay and cannot
     make a recorded clip differ from the live match. It is suppressed during
     the freeze: hit stop has to be dead still, that is the whole point of it. */
  handheld: 7.0,
  interp: true,           // render between fixed steps -- see below
  /* RARITY IS A BAR, NOT A BUDGET. A moment qualifies on its own merits or
     not at all: zero cuts in a match is a correct answer. The bar is set from
     measurement, and deliberately HIGH -- a set-piece is meant to be a rare,
     special occurrence, not punctuation. Swept over 120 matches under the
     kinetic model (cinema_rate_probe.py):

         bar 1.90:  none 41%   one 37%   two 16%   3+ 7%    mean 0.90
                    18% of killing blows earn a set-piece; half of all cuts
                    are volleys.

     The kill has no exemption, and there is no per-match quota in either
     direction. */
  floor: 1.90,
  minGap: 2.6,            // seconds of match time between cuts, pacing only
  /* Volley grouping: consecutive hits no more than volleyGap apart, at least
     volleyMin of them, both relics landing. CONFIG.combat.hitCd is 0.45, so a
     gap under that could never group anything. */
  volleyGap: 0.95,
  volleyMin: 3,
  /* BINDS DO NOT QUALIFY. Weapon-on-weapon is the most violent thing on the
     field kinematically -- the highest closing speeds in the game are binds --
     so under a speed-driven model they swamped everything: 35% of all cuts at
     the 1.50 bar, five of the seven in a single measured match. But a bind is
     none of the three things this director exists to catch, and nothing
     HAPPENS as a result of one: filming it like a killing blow promises a
     payoff that never arrives.

     Raising the bar until binds starved worked (their ceiling is ~1.77, so
     1.80 excludes them) but took the good cuts with it -- 46% of fights got
     nothing at all. Excluding the CATEGORY is the honest version of the same
     decision, and it is one flag to put back.

     They are still scored, so `cinema_probe.py` can still see them. */
  bindsQualify: false,
  /* THE CROWD EXCEPTION — how many contacts make an EXCHANGE when there are
     more than two bodies on the floor.

     `volleyMin` is 3 because outside a summon that is what a traded run looks
     like: measured, 21 of 37 volleys in ordinary play are exactly 3 and 34 of
     37 are 3 or 4. Inside a Triplicate window the median run is 5 and they
     reach 15 — three blows there is a lull, and filming it promises an
     exchange the viewer is not seeing.

     A SCORE BAR WAS TRIED FIRST AND MEASURED NOTHING: crowded beats score
     identically to ordinary ones (mean 0.45 vs 0.48, qualifying 2.2% vs 2.2%)
     and are merely 2.7x more frequent. A population that differs only in rate
     cannot be thinned by a level.

     SWEPT, 50 matches, on the number the exception can actually move — the
     kill is exempt by design and 18 of the in-window cuts are kills, because
     this ultimate is often what finishes the fight:

         crowdVolleyMin   3(off)    6      7      8      9
         preference        3.07x  2.43x  2.01x  1.69x  1.59x

     8 taken. The in-window median run is 5, so 8 is genuinely "big for a
     Triplicate" rather than a tax on all of them; 9 buys 0.10x for a
     noticeably quieter window, which is the wrong trade against "it can still
     trigger during a big exchange".

     1.69x is not 1.00x and should not be: the ultimate does put more real
     spectacle on the floor. What it no longer does is out-bid the rest of the
     fight three to one.

     Set equal to volleyMin to disable. */
  crowdVolleyMin: 8,

  /* A CROWDED beat must clear this multiple of the crowd's own MEDIAN
     score. 0 disables. See cinePlan for why this exists here and did not
     work for Triplicate. SWEPT in v38 -- the target is not 1.00x: v37 settled
     Triplicate at 1.69x on the argument that "the ultimate does put more real
     spectacle on the floor. What it no longer does is out-bid the rest of the
     fight three to one." */
  crowdScoreMul: 10,
  debug: true,

  /* live state, all presentation */
  timeScale: 1,
  zoom: 1,
  fx: 0, fy: 0,           // where the camera IS, in sim coords
  tfx: 0, tfy: 0,         // where it is going. Never assigned to fx directly.
  hh: 0, hx: 0, hy: 0,    // handheld phase and its current offset
  bars: 0,                // letterbox, 0..1
  flash: 0, streak: 0, wash: 0,
  /* A WALL-CLOCK envelope for impact-frame elements. Most presentation state
     should stretch with the slow motion -- that is what slow motion IS -- but
     a full-frame opaque flash must not. m.finisher decays with the sim, so at
     0.10x the engine's ~1s kill flash became ~10s of held white and the
     picture sat beige through the most important moment in the match. This is
     the ceiling the renderer clamps it against while a cut is running. */
  wallFlash: 0,
  cut: null, phase: "idle", pt: 0,
  tracer: null,           // the ranged flight, for the overlay
  cx: 0, cy: 0,           // the ACTION point, for the renderer's visibility clamp
  /* THE SUBJECT: where the action actually is, in sim coords, plus its radius.
     The visibility clamp used to guarantee the camera's AIM stayed on screen,
     but the aim is only biased TOWARD the contact -- the contact itself sits
     past it, nearer the wall -- and a point has no size, while at a 2.2x whip
     a relic is ~155px on a 1080-wide frame against what was a 108px margin.
     So the action clipped at the bottom even with the aim safely framed. The
     renderer clamps THIS, with a radius, instead. */
  sx: null, sy: null,
  subR: 64,               // relic (34) + weapon/impact pad, sim units
  /* What the director is ASKING the send for, mirrored here so an offline
     render can reproduce the same automation instead of guessing it. */
  send: { wet: 0, lp: 20000, dry: 1 },
  plan: [], fired: 0, lastCutT: -99, force: 0,
  log: [],
};

/* --------------------------------------------------------------- scoring ---
   WHAT MAKES A BLOW WORTH FILMING IS KINEMATIC, NOT ARITHMETIC.

   The first model scored damage: bite, crits, how close the victim was to
   dying. It worked, and it picked moments that were dramatic on the HUD rather
   than on screen -- a big number landing on two relics drifting gently past
   each other. Damage is an outcome. Speed is the picture.

   Three things now carry the score:

     1. PACE. How fast the two things were moving when they met -- and
        specifically the CLOSING speed, the magnitude of their relative
        velocity. Two relics flying at each other is the shot. Two drifting the
        same way at the same speed is not, however large the number on either
        one. Cruise is 405 and the clamp is 1300, so there is a real range here
        and hit/clank impulses genuinely fling a ball up it.
     2. THE VOLLEY. Not one blow but a run of them, traded back and forth
        inside a second or so. Scored as a UNIT and filmed as a unit -- see
        cineVolleys.
     3. REACH. A bolt that crossed most of the hall to arrive. Priced by how
        far it actually FLEW, from the loose to the contact, not by where it
        landed; and worth more when the archer or the target was moving.

   Damage stays in the model at a much reduced weight, so the director does not
   celebrate a spectacular whiff. */

/* CALIBRATED AGAINST THE FIGHT, NOT AGAINST THE CONFIG. The first pass
   normalised speed between cruise (405) and the clamp (1300), which put the
   MEDIAN hit at 0.37 and made every ordinary blow score -- because relics do
   not spend the match at cruise, they spend it flung. Measured over 1,359 hits
   in 60 matches:

       speed at contact   median  759   p90 1012   max 1297
       closing speed      median  911   p90 1496   max 2141
       bolt flight        median  163   p90  297   max  557   (hall diagonal 954)

   So these read 0 at the median and 1 near the observed maximum: "fast" now
   means fast FOR THIS GAME. The bolt numbers also killed the first reach term
   outright -- it wanted 30% of the hall diagonal, which is 286px, and only the
   top tenth of shots ever get there at all. */
const fastness = v => clamp((v - 760) / 540, 0, 1);
const closing  = v => clamp((v - 900) / 1200, 0, 1);
/* Knee moved 220->180 and the span 280->260 after measurement: at the old
   curve a 350px bolt -- the top tenth of all shots -- contributed 0.65 and a
   long shot cleared the bar only when it ALSO happened to be a fast one. Eleven
   ranged hits in ninety matches scored over the bar and exactly one was ever
   picked. The brief asks for the long shot to be an event in its own right. */
const reachy   = d => clamp((d - 180) / 260, 0, 1);

function cineScore(bs, i){
  const b = bs[i];
  let s = 0; const why = [];

  if (b.kind === "hit"){
    /* --- 1. pace --- */
    const pace = fastness(Math.max(b.spd || 0, b.foeSpd || 0));
    const rel  = closing(b.close || 0);
    s += pace * 0.95 + rel * 1.15;
    if (rel > 0.45) why.push("closing at " + Math.round(b.close));
    else if (pace > 0.45) why.push("at " + Math.round(Math.max(b.spd, b.foeSpd)));

    /* --- 3. reach --- */
    if (b.ranged && b.range > 0){
      const far = reachy(b.range);
      /* "on OR from a ball moving fast" -- either end counts, and a long shot
         with neither end moving is a good shot rather than a great one. */
      s += far * 1.45 * (0.62 + 0.70 * Math.max(pace, fastness(b.shotSpd0 || 0)));
      if (far > 0.25) why.push(Math.round(b.range) + "px of flight");
    }

    /* --- damage, much reduced --- */
    const bite = b.dmg / Math.max(1, b.hpAfter + b.dmg);
    s += bite * 0.42;
    if (b.crit) s += 0.10;
    /* Stakes still colour it, but they no longer carry it. */
    s *= 1 + (1 - b.hpFrac) * 0.40;
    if (b.hpFrac > 0 && b.hpFrac < 0.12) why.push("on the brink");

  } else if (b.kind === "ult"){
    s = 0.60 + (1 - b.foeHpFrac) * 0.30;
    why.push("ultimate");

  } else if (b.kind === "clank"){
    /* A bind is pure kinematics -- there is no damage in it at all -- so it
       benefits most from the new model and was nearly unpickable under the
       old one. */
    /* Damped after measurement: at 0.18 + 1.55x closing, binds took 55% of
       every set-piece in the game. A bind IS the most violent thing on the
       field kinematically, but nothing happens as a result of it -- filming
       one like a killing blow promises a payoff that never arrives. */
    s = 0.08 + closing(b.close || 0) * 1.30 + Math.min(0.22, b.streak * 0.05)
        + (b.decisive ? 0.12 : 0);
    why.push("bind");
    if (closing(b.close || 0) > 0.45) why.push("closing at " + Math.round(b.close));
  }

  if (b.fatal){
    const blow = b.dmg / Math.max(1, b.maxHp || 300);
    const rel = closing(b.close || 0), pace = fastness(Math.max(b.spd || 0, b.foeSpd || 0));
    s = 0.50 + blow * 0.85 + (1 - b.selfHpFrac) * 0.55 + rel * 0.85 + pace * 0.45
        + (b.crit ? 0.15 : 0);
    why.length = 0;
    why.push("the killing blow");
    if (blow >= 0.20) why.push("for " + b.dmg);
    if (rel > 0.40) why.push("closing at " + Math.round(b.close));
    if (b.ranged) why.push("at " + Math.round(b.range) + "px");
    if (b.selfHpFrac < 0.28) why.push("won on " + Math.round(b.selfHpFrac * 100) + "%");
  }
  return { score: s, why };
}

/* ---------------------------------------------------------- the volley ---
   A run of blows traded back and forth. This is a different SHAPE of moment
   from a single hit and it has to be filmed as one: the director slows into
   the first, whips each contact, RUNS BETWEEN THEM at a faster rate so the
   exchange has rhythm rather than becoming one long wallow, and releases after
   the last. Filming three hits as three separate cuts would either fire three
   times in two seconds or, under the minimum-gap rule, throw two of them away.

   Grouping: consecutive hits no more than `gap` apart, at least `min` of them,
   and both relics must land -- a one-sided flurry is a beating, not an
   exchange, and it already scores through pace if it deserves to. */
function cineVolleys(scored, gap, min, crowdMin){
  const out = [];
  let run = [];
  const flush = () => {
    /* A run that happened with extra bodies on the floor has to be LONGER to
       count as an exchange. Judged on the run, not on the match: a fight that
       contains a summon is ordinary either side of the window and is scored
       that way. */
    const need = (crowdMin && run.some(b => b.crowd)) ? crowdMin : min;
    if (run.length >= need){
      const sides = new Set(run.map(b => b.side));
      if (sides.size === 2){
        const best = Math.max.apply(null, run.map(b => b.score));
        const dmg = run.reduce((a, b) => a + b.dmg, 0);
        /* The unit is worth more than its best member, and each extra blow
           adds -- but with diminishing returns, so a long scrappy run cannot
           out-bid a short violent one. */
        const v = best + 0.30 * Math.sqrt(run.length - 2) + 0.30;
        out.push({
          kind: "volley", t: run[0].t, x: run[0].x, y: run[0].y,
          crowd: run.some(b => b.crowd),
          /* v38: and HOW crowded. Without this a volley inside a storm
             reaches the filter with `crowd === true`, the bar is computed
             as median x 1 instead of median x the strength that ult asked for, and the
             exception silently does nothing for exactly the beats it was
             built for. */
          crowdMul: run.reduce((a, b) => Math.max(a, b.crowdMul || 0), 0),
          score: v, n: run.length,
          why: [run.length + " blows traded", "for " + dmg],
          fatal: run.some(b => b.fatal),
          beats: run.map(b => ({ t: b.t, x: b.x, y: b.y, fatal: !!b.fatal })),
          span: run[run.length - 1].t - run[0].t,
        });
      }
    }
    run = [];
  };
  for (const b of scored){
    if (b.kind !== "hit"){ continue; }
    if (run.length && b.t - run[run.length - 1].t > gap) flush();
    run.push(b);
  }
  flush();
  return out;
}

/* Tier from score. 3 is the full set-piece with anticipation and letterbox,
   2 is a push, 1 is a heavy freeze and nothing else. */
/* There is no tier 1. It fired on a 0.05s lead, which at 0.42x is about a
   tenth of a second of screen time -- too short to read as anything except a
   hitch. A moment either gets the treatment or it does not. */
function cineTier(b){
  if (b.fatal) return 3;                 // and then TIER_KILL, which is larger
  /* Boundary moved 1.30 -> 2.05 when the model went kinematic. The bar itself
     is 1.50, so at 1.30 every qualifying moment was a T3 and the two tiers had
     silently collapsed into one treatment. */
  return b.score >= 2.05 ? 3 : 2;
}

/* ------------------------------------------------------------- the beat ---
   THREE MOVEMENTS, in this order, and the order is the whole thing:

     1. THE DROP. Time falls away BEFORE the blow lands. The tension is in the
        approach -- you are watching it come and you cannot do anything about
        it. The camera stays wide here, because the point of this movement is
        that you can SEE, and a lens already buried in the contact point has
        nothing left to say when the contact happens. The mix goes underwater
        and the score tape-slows with it.
     2. THE WHIP. At contact: a hard freeze of five or six frames while the
        lens snaps in, plus the boom. Fast -- a tenth of a second, not a drift.
        The peak can be much higher than a sustained push could ever be,
        because nobody has to live in it: it is a strike, and it relaxes out of
        it immediately.
     3. THE RELEASE. Zoom eases back, time overshoots past 1.0, the mix opens.
        Coming back HARD is what makes the hold mean anything.

   An earlier build had this inverted -- freeze first, then a slow drift in --
   which put the slow motion AFTER the moment it was supposed to be building
   toward, and made the zoom a sustained crop instead of a strike.

   `lead` is in SIM seconds, not wall seconds -- so the SCREEN duration of the
   drop is roughly lead/dropTo, and the match only ever loses `lead`. Measured
   the first time round: at lead 0.10 / ramp 0.16 the ramp itself consumed most
   of the lead and the drop lasted 0.6s, which is a stumble rather than a held
   breath. 0.22 sim seconds at 0.10x is about 1.8s of screen time for a fifth
   of a second of fight. */
const TIER = {
  2: { lead: 0.055, dropFrom: 0.30, dropTo: 0.16, ramp: 0.05, freeze: 0.065,
       whip: 0.09, peak: 1.62, settle: 0.20, rest: 1.14, hold: 0.22,
       slow: 0.34, out: 0.28, gapRate: 1.35, gapLead: 0.045, bias: 0.72, bars: 0.18, wash: 0.30 },
  3: { lead: 0.080, dropFrom: 0.20, dropTo: 0.10, ramp: 0.055, freeze: 0.080,
       whip: 0.10, peak: 1.92, settle: 0.24, rest: 1.22, hold: 0.34,
       slow: 0.28, out: 0.34, gapRate: 1.28, gapLead: 0.050, bias: 0.84, bars: 0.30, wash: 0.42 },
};
const TIER_KILL = { lead: 0.100, dropFrom: 0.15, dropTo: 0.07, ramp: 0.06,
                    freeze: 0.095, whip: 0.11, peak: 2.20, settle: 0.28,
                    rest: 1.28, hold: 0.45, slow: 0.22, out: 0.42, gapRate: 1.22, gapLead: 0.055,
                    bias: 0.90, bars: 0.40, wash: 0.55 };

/* -------------------------------------------------------------- the plan ---
   Run the match headless, score every beat, choose the shots. Sound is muted
   for the duration because the sim calls SFX.play directly and a prescan would
   otherwise fire forty-odd seconds of a fight in one blocking loop. */
function cinePlan(idA, idB, seed){
  const wasOn = SFX.on;
  SFX.on = false;
  let m, guard = 0;
  try {
    m = new Match(idA, idB, seed);
    const dt = CONFIG.physics.dt;
    while (!m.over && guard++ < 200000) m.step(dt);
  } catch (e){ SFX.on = wasOn; return { cuts: [], scored: [], err: String(e) }; }
  SFX.on = wasOn;

  const bs = m.beats;
  const scored = bs.map((b, i) => {
    const r = cineScore(bs, i);
    return Object.assign({}, b, { score: r.score, why: r.why, idx: i });
  });

  /* Volleys compete with single moments on the same bar. A volley that wins
     SWALLOWS its members: they cannot also be picked individually, or the
     exchange would be filmed twice. Everything is considered in descending
     order of score, so when two qualifying moments fall too close together the
     stronger survives -- pacing should never cost you the better moment just
     because it came second. */
  /* THE CROWD FLOOR -- and it is the tool v37 TRIED AND CORRECTLY ABANDONED.

     Rick: "directior will probably always see this ult as a big exchange and
     we need to tell it to only highlight big exchanges relitive to how many
     hits this ult usually produces."

     v37 built exactly this for Triplicate and it measured NOTHING, twice,
     because a Triplicate's beats score IDENTICALLY to ordinary ones and are
     merely 2.7x more frequent -- "no level can thin a population that differs
     only in rate". A spike storm is the other case, and the difference is the
     whole reason this line exists rather than a second copy of `crowdVolleyMin`:

         crowded    mean 0.68  med 0.50  p95 2.07  | >= floor 6.29%  2.57 beats/s
         ordinary   mean 0.53  med 0.46  p95 1.29  | >= floor 0.65%  0.80 beats/s

     The storm's beats DO score higher and nearly TEN TIMES as many of them
     clear the bar, so a percentile taken against the storm's own distribution
     is the right instrument here and was the wrong one there. It is also why
     `crowdVolleyMin` plateaued at 11.90x no matter how high it went: 12 of the
     23 non-kill in-window cuts are single hits, and a grouping rule cannot
     touch a single hit.

     The kill is exempt, as it is from `crowdVolleyMin`, and for the same
     reason -- a finish is a cut whatever else was happening. */
  /* A MEDIAN AND A MULTIPLIER, not a percentile, and the reason is sample
     size. A storm contributes about FOURTEEN crowded beats to a match, so a
     p90 is the twelfth of fourteen and moves in whole-sample steps -- swept
     as a percentile it went 13.37x -> 12.08x and stopped. A median is stable
     at n=14 and `mul` is a smooth knob on top of it. It is also the more
     faithful reading of the ask: "relative to how many hits this ult usually
     produces" is a statement about the CENTRE of the storm's distribution,
     not about its tail. */
  const cSc = scored.filter(b => b.crowd).map(b => b.score).sort((x, y) => x - y);
  const cMed = cSc.length ? cSc[cSc.length >> 1] : 0;
  const crowdOK = cSc.length >= 6;
  const volleys = cineVolleys(scored, CINE.volleyGap, CINE.volleyMin,
                              CINE.crowdVolleyMin);
  const kill = scored.find(b => b.fatal);
  const pool = scored.concat(volleys)
                     .filter(b => CINE.bindsQualify || b.kind !== "clank")
                     /* THREE QUALIFYING PATHS, not one summed score. The
                        brief names three kinds of moment -- pace, an exchange,
                        and an exceptional shot -- and they are not
                        commensurable. A bolt that crossed two thirds of the
                        hall is an event whatever else was happening; making it
                        out-bid a head-on collision on one scale meant it
                        qualified in 3 matches out of 70, which is not a
                        category, it is an accident. So a long shot clears at a
                        lower bar of its own, and still has to be genuinely
                        long: 320px is the top ~15% of all flights. */
                     .filter(x => {
                       /* a crowded beat clears the crowd's own bar; everything
                          else, and every kill, clears the global floor. */
                       /* the bar is the beat's OWN strength times the
                          crowd's median, so two ultimates that crowd the
                          floor differently are judged differently. */
                       const f = (x.crowdMul && !x.fatal && crowdOK)
                               ? Math.max(CINE.floor, cMed * x.crowdMul)
                               : CINE.floor;
                       return x.score >= f
                           || (x.ranged && x.range >= 320 && x.score >= f * 0.62);
                     })
                     .sort((x, y) => y.score - x.score);
  const cuts = [];
  const covered = (b) => cuts.some(c => {
    const cs = c.t, ce = c.t + (c.span || 0);
    return b.t > cs - CINE.minGap && b.t < ce + CINE.minGap;
  });
  for (const b of pool){
    const bs = b.t, be = b.t + (b.span || 0);
    if (covered(b)) continue;
    if (cuts.some(c => bs < c.t + (c.span || 0) + CINE.minGap
                    && be > c.t - CINE.minGap)) continue;
    /* Do not step on the finish -- but only if the finish itself qualified. */
    if (kill && kill.score >= CINE.floor && !b.fatal && kill.t - be < 2.0
        && kill.t > be) continue;
    cuts.push(b);
  }
  /* AUDIT: a fatal (or merely large) hit inside a qualifying volley could
     also qualify on its own, producing two cuts for one moment -- and the
     standalone one would fire late, after the volley had already played it.
     The volley IS that moment; it swallows its members. */
  for (let i = cuts.length - 1; i >= 0; i--){
    const c = cuts[i];
    if (c.kind === "volley") continue;
    if (cuts.some(v => v.kind === "volley"
                    && c.t >= v.t - 0.01 && c.t <= v.t + v.span + 0.01))
      cuts.splice(i, 1);
  }
  cuts.sort((x, y) => x.t - y.t);
  /* Every cut is a LIST of contacts. A single moment is a volley of one, which
     is what lets the phase machine have exactly one shape. */
  for (const c of cuts)
    if (!c.beats) c.beats = [{ t: c.t, x: c.x, y: c.y, fatal: !!c.fatal }];
  /* A ranged cut carries both ends of the flight: the film has to show the
     shot being TAKEN and the shot LANDING, or the viewer cannot tell what
     caused the cinematic. Capped at 0.45 sim seconds back from the contact so
     a lobbed full-hall bolt cannot buy itself three seconds of approach. */
  for (const c of cuts)
    if (c.ranged && c.loosT > 0)
      c.loose = { t: Math.max(c.loosT, c.t - 0.45), x: c.lx, y: c.ly };
  for (const c of cuts) c.tier = cineTier(c);
  return { cuts, scored, dur: m.t, err: null };
}

/* ---------------------------------------------------------------- camera ---
   The zoom is applied in the renderer's existing punch slot, about the point
   of contact rather than about the middle of the hall. The focus is clamped so
   a 2.15x push cannot pull the wall of the arena inside the frame. */
function cineCamera(){
  const s = CINE;
  if (!s.cut || s.zoom <= 1.0001) return null;
  return { z: s.zoom, x: s.fx, y: s.fy };
}

/* ------------------------------------------------------------------ audio ---
   Two independent things, and only one of them is the reverb Rick asked for.

   THE SEND. A lowpass and a convolution hall spliced between the SFX bus and
   the destination. On a cut the top comes off everything, the dry drops, and
   the tail blooms — the world goes underwater and the impact rings out in it.
   The 70ms gate of near-silence immediately after the freeze does more for
   "punchy" than the reverb does; the tail is what you notice, the hole in
   front of it is what makes it land.

   THE TAPE. The score is a four-chord bed pre-scheduled against real time, so
   it cannot be slowed by slowing the sim — during a set-piece the picture
   would drag while the music walked on unbothered, which is the single most
   common way this effect gets built wrong. Fix: render the bed ONCE through
   an OfflineAudioContext using SFX's own bed() unmodified, play the result as
   a single buffer source, and ramp its playbackRate with the director. The
   music then slows and DROPS IN PITCH with the picture, which is the sound
   everyone actually means when they say "slow motion". */
const CineAudio = {
  ready: false, node: null, bedSrc: null, bedGain: null, buf: null, rate: 1,

  build(ctx){
    const input = ctx.createGain();
    const lp    = ctx.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.value = 20000; lp.Q.value = 0.7;
    const dry   = ctx.createGain(); dry.gain.value = 1;
    const conv  = ctx.createConvolver(); conv.buffer = CineAudio.hall(ctx, 2.6, 2.4);
    const wet   = ctx.createGain(); wet.gain.value = 0;
    const out   = ctx.createGain(); out.gain.value = 1;
    input.connect(lp); lp.connect(dry); dry.connect(out);
    lp.connect(conv); conv.connect(wet); wet.connect(out);
    out.connect(ctx.destination);
    CineAudio.node = { ctx, input, lp, dry, wet, out, conv };
    CineAudio.ready = true;
    return input;
  },

  /* A stone hall: a sparse cluster of early reflections in front of an
     exponentially decaying noise tail, decorrelated across the two channels so
     it opens up rather than collapsing to the middle. */
  hall(ctx, dur, decay){
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++){
        const t = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
      for (let k = 0; k < 9; k++){
        const i = Math.floor((0.012 + k * 0.021 + Math.random() * 0.01) * ctx.sampleRate);
        if (i < n) d[i] += (Math.random() * 2 - 1) * 0.55 * Math.pow(0.72, k);
      }
    }
    return buf;
  },

  set(wet, cutoff, dry, tc){
    CINE.send = { wet, lp: cutoff, dry };
    if (!CineAudio.ready) return;
    const N = CineAudio.node, t = N.ctx.currentTime, k = tc || 0.05;
    N.wet.gain.setTargetAtTime(wet, t, k);
    N.lp.frequency.setTargetAtTime(cutoff, t, k);
    N.dry.gain.setTargetAtTime(dry, t, k);
  },

  /* THE BOOM. Three layers, because one is a beep and two is a thud:

       SUB     a sine falling a full octave, 68 -> 30Hz. The body.
       CRACK   a short filtered noise transient. The leading edge -- without it
               the sub arrives late to its own impact, since a 40Hz cycle is
               25ms long and the ear places the hit by the transient.
       TAIL    a low band sent hot into the hall so the reverb carries it.

     And a GATE: the send is choked to near nothing for ~70ms in front of all
     of it, which is what actually makes a hit sound loud. Silence in front of
     a sound is worth more than level on it. */
  boom(amt){
    if (!CineAudio.ready) return;
    const N = CineAudio.node, ctx = N.ctx, t = ctx.currentTime;

    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(68, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.75);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.72 * amt, t + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.30);
    o.connect(g); g.connect(N.input);
    o.start(t); o.stop(t + 1.35);

    const s = ctx.createBufferSource(); s.buffer = SFX.noise;
    const f = ctx.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(900, t + 0.12);
    f.Q.value = 0.5;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.46 * amt, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    s.connect(f); f.connect(g2); g2.connect(N.input);
    s.start(t); s.stop(t + 0.26);

    const s2 = ctx.createBufferSource(); s2.buffer = SFX.noise;
    const f2 = ctx.createBiquadFilter(); f2.type = "lowpass";
    f2.frequency.setValueAtTime(240, t); f2.Q.value = 1.1;
    const g3 = ctx.createGain();
    g3.gain.setValueAtTime(0.34 * amt, t);
    g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.60);
    s2.connect(f2); f2.connect(g3); g3.connect(N.input);
    s2.start(t); s2.stop(t + 0.64);
  },

  /* THE LOOSE, heard. An airy band that rises across the flight so the ear
     tracks the bolt with the eye. Duration is the SCREEN length of the flight. */
  whoosh(dur, amt){
    if (!CineAudio.ready) return;
    const N = CineAudio.node, ctx = N.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = SFX.noise; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.6;
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(4200, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20 * amt, t + dur * 0.85);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.06);
    s.connect(f); f.connect(g); g.connect(N.input);
    s.start(t); s.stop(t + dur + 0.10);
  },

  /* The rising swell that runs INTO the impact. Only the prescan director can
     schedule this, because it has to start before the thing it announces. */
  swell(dur, amt){
    if (!CineAudio.ready) return;
    const N = CineAudio.node, ctx = N.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = SFX.noise; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3.2;
    f.frequency.setValueAtTime(220, t);
    f.frequency.exponentialRampToValueAtTime(3400, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22 * amt, t + dur * 0.94);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
    s.connect(f); f.connect(g); g.connect(N.input);
    s.start(t); s.stop(t + dur + 0.08);
  },

  /* ---- the tape ---- */
  async renderBed(dur, sealTimes){
    if (!SFX.ok || !SFX.ctx) return null;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    const sr = 44100;
    const off = new OAC(2, Math.ceil(sr * dur), sr);
    const rc = SFX.ctx, rb = SFX.bus, rn = SFX.noise;
    try {
      SFX.ctx = off;
      SFX.bus = off.createGain(); SFX.bus.gain.value = 1;
      SFX.bus.connect(off.destination);
      SFX.noise = SFX._noiseBuffer();
      SFX.bed(0, dur, (sealTimes || []).slice());
      const buf = await off.startRendering();
      return buf;
    } catch (e){ return null; }
    finally { SFX.ctx = rc; SFX.bus = rb; SFX.noise = rn; }
  },

  startBed(buf){
    CineAudio.stopBed();
    if (!buf || !CineAudio.ready) return null;
    const N = CineAudio.node, ctx = N.ctx;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const g = ctx.createGain(); g.gain.value = 1;
    s.connect(g); g.connect(N.input);
    s.start(ctx.currentTime);
    CineAudio.bedSrc = s; CineAudio.bedGain = g; CineAudio.rate = 1;
    return { stop(){ CineAudio.stopBed(); } };
  },

  stopBed(){
    if (CineAudio.bedSrc){ try { CineAudio.bedSrc.stop(); } catch(e){} }
    CineAudio.bedSrc = null; CineAudio.bedGain = null;
  },

  /* The picture and the score are ramped by the same number. */
  setRate(r){
    if (!CineAudio.bedSrc) return;
    const ctx = CineAudio.node.ctx;
    const v = Math.max(0.06, Math.min(1, r));
    if (Math.abs(v - CineAudio.rate) < 0.004) return;
    CineAudio.rate = v;
    CineAudio.bedSrc.playbackRate.setTargetAtTime(v, ctx.currentTime, 0.06);
  },
};


/* ------------------------------------------------------- interpolation ---
   THE SLOW MOTION WAS GENUINELY CHOPPY, and it was arithmetic rather than
   feel. The sim runs on a fixed CONFIG.physics.dt of 1/120. At a 0.07x drop,
   a 60fps frame feeds the accumulator 0.0012s, so a step lands only every 7.1
   rendered frames:

       timeScale 1.00   step every  0.5 frames   content at 120 Hz
       timeScale 0.25   step every  2.0 frames   content at  30 Hz
       timeScale 0.10   step every  5.0 frames   content at  12 Hz
       timeScale 0.07   step every  7.1 frames   content at 8.4 Hz

   Nothing is being dropped -- nothing new is being PRODUCED. The display runs
   at 60 and the world updates at 8. Below about 0.25x this is unavoidable for
   any fixed-timestep sim, and 0.25x is far too fast for the effect, so the
   rate cannot be the answer.

   The answer is the standard one: keep the fixed step, and render BETWEEN
   steps. Snapshot the visual state before a step batch, then draw
   lerp(previous, current, acc/dt). Motion becomes continuous at whatever rate
   the display runs at, while the simulation still consumes identical dt slices
   in an identical order -- so this changes what is DRAWN, never what happens.

   Mechanically: values are overwritten, the frame is drawn, and the exact
   saved values are written back. Same numbers in, same numbers out, no drift,
   and the sim never observes an interpolated value because it is restored
   before the next step. Objects are keyed by REFERENCE, which works because
   particles, rings and projectiles are mutated in place and are only ever
   added or removed by a step -- so between steps the set is stable.

   Angles get shortest-path interpolation, or a weapon crossing pi would spin
   the wrong way round for one frame. */
const LERP_FIELDS = {
  /* Deliberately a whitelist. `hp`, `charge`, `stun` and friends are state,
     not position: interpolating them would show fractional health for a few
     frames and buys nothing, since the eye is tracking geometry. */
  fighter: ["x", "y", "pivX", "pivY", "headX", "headY", "headR", "hpGhost",
            "flash", "ringFlash", "mend"],
  fighterAng: ["theta", "headAng", "swingPhase", "headSpin"],
  part: ["x", "y", "life"],
  ring: ["x", "y", "r", "life"],
  float: ["x", "y", "life"],
  shot: ["x", "y"],
  shotAng: ["a"],
};

CINE.snapObj = function(o, keys, angKeys, into){
  const rec = {};
  for (const k of keys) if (typeof o[k] === "number") rec[k] = o[k];
  if (angKeys) for (const k of angKeys) if (typeof o[k] === "number") rec[k] = o[k];
  into.set(o, rec);
};

CINE.snap = function(m){
  const S = this._snap = new Map();
  for (const f of [m.a, m.b])
    this.snapObj(f, LERP_FIELDS.fighter, LERP_FIELDS.fighterAng, S);
  /* Shades interpolate on the same fields as any other fighter. Left out they
     would strobe against a smoothly-moving hall — the one artefact a viewer
     reads as "the game is broken" rather than as a style. */
  for (const s of m.shades)
    this.snapObj(s, LERP_FIELDS.fighter, LERP_FIELDS.fighterAng, S);
  for (const p of m.fx)     this.snapObj(p, LERP_FIELDS.part,  null, S);
  for (const r of m.rings)  this.snapObj(r, LERP_FIELDS.ring,  null, S);
  for (const f of m.floats) this.snapObj(f, LERP_FIELDS.float, null, S);
  for (const s of m.shots)  this.snapObj(s, LERP_FIELDS.shot, LERP_FIELDS.shotAng, S);
  this._snapOk = true;
};

const ANG = new Set(["theta", "headAng", "swingPhase", "headSpin", "a"]);
const lerpAng = (p, c, u) => {
  let d = (c - p) % TAU;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  return p + d * u;
};

/* Overwrite -> draw -> restore. The restore writes back the EXACT saved
   numbers, so this is not an approximation of the state, it is the state. */
CINE.drawLerped = function(renderer, m, alpha){
  if (!this._snapOk || alpha <= 0 || alpha >= 1){ renderer.draw(m); return; }
  const S = this._snap, saved = [];
  const apply = (o) => {
    const rec = S.get(o); if (!rec) return;
    for (const k in rec){
      const c = o[k]; if (typeof c !== "number") continue;
      saved.push([o, k, c]);
      o[k] = ANG.has(k) ? lerpAng(rec[k], c, alpha) : rec[k] + (c - rec[k]) * alpha;
    }
  };
  for (const f of [m.a, m.b]) apply(f);
  for (const s of m.shades) apply(s);
  for (const p of m.fx) apply(p);
  for (const r of m.rings) apply(r);
  for (const f of m.floats) apply(f);
  for (const s of m.shots) apply(s);
  try { renderer.draw(m); }
  finally { for (let i = saved.length - 1; i >= 0; i--) saved[i][0][saved[i][1]] = saved[i][2]; }
};

/* ONE loop body, used by the live page and by the offline clip renderer, so
   the two cannot drift apart. Returns the interpolation alpha for the draw. */
CINE.acc = 0;
CINE.pump = function(raw, m, speed){
  const dt = CONFIG.physics.dt;
  const fed = this.on ? this.update(raw, m) : raw;
  this.acc += fed * (speed === undefined ? 1 : speed);
  const interp = this.on && this.interp && !!this.cut;
  let steps = 0;
  if (this.acc >= dt){
    if (interp) this.snap(m); else this._snapOk = false;
    while (this.acc >= dt && steps < 40){ m.step(dt); this.acc -= dt; steps++; }
  }
  if (this.on && this.timeScale < 0.02 && !m.over && m.introT <= 0)
    m.decayImpactOnly(raw * 0.85);
  return interp ? clamp(this.acc / dt, 0, 1) : 0;
};

/* ------------------------------------------------------------- the director */
const smooth = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);

CINE.reset = function(){
  this.acc = 0;
  this.timeScale = 1; this.zoom = 1; this.bars = 0; this.flash = 0;
  this.streak = 0; this.wash = 0; this.wallFlash = 0;
  this.cut = null; this.phase = "idle"; this.tracer = null;
  this.sx = this.sy = null;
  const A = CONFIG.arena;
  this.fx = this.tfx = A.w / 2; this.fy = this.tfy = A.h / 2;
  this.hh = 0; this.hx = 0; this.hy = 0;
  this.pt = 0; this.fired = 0; this.lastCutT = -99;
  this.log = []; this.force = 0;
  CineAudio.set(0, 20000, 1, 0.02);
  CineAudio.setRate(1);
};

/* The camera leans toward a point rather than centring it: travel only `bias`
   of the way from the middle of the hall, so the arena stays in shot. */
CINE.aim = function(x, y, bias){
  const A = CONFIG.arena;
  /* The camera leans only `bias` of the way to the point -- but the point
     itself is what must stay on screen, so it is published unbiased. The
     first bottom-wall fix clamped the eased FOCUS into the frame, and the
     focus is by construction closer to centre than the action by a factor of
     1/bias: at bias 0.62 the contact sat 1.6x farther out than the thing
     being kept visible, and everything at the bottom wall was still cut off.
     Clamp the thing the viewer is watching, not the camera's own state. */
  this.cx = x; this.cy = y;
  this.tfx = A.w / 2 + (x - A.w / 2) * bias;
  this.tfy = A.h / 2 + (y - A.h / 2) * bias;
};

CINE.begin = function(cut, m){
  const P = cut.fatal ? TIER_KILL : TIER[cut.tier || cineTier(cut)];
  this.cut = Object.assign({}, cut, { P });
  /* AUDIT: the panel's Force button hands begin() a raw beat, which has no
     beats array, and the drop phase reads cut.beats[0].t -- a TypeError the
     moment anyone pressed F. Plan-built cuts always have one; synthesize it
     here so begin() cannot be handed a cut it cannot play. */
  if (!this.cut.beats)
    this.cut.beats = [{ t: cut.t, x: cut.x, y: cut.y, fatal: !!cut.fatal }];
  this.phase = "drop";
  this.pt = 0;
  this.bi = 0;                       // which contact in the cut we are on
  /* Start wide and start from the neutral frame. The drop is the movement
     where the viewer needs to SEE. */
  const A = CONFIG.arena;
  if (this.zoom <= 1.0001){ this.fx = A.w / 2; this.fy = A.h / 2; }
  if (cut.loose) this.aim(cut.loose.x, cut.loose.y, P.bias * 0.8);
  else this.aim((m.a.x + m.b.x) / 2, (m.a.y + m.b.y) / 2, P.bias * 0.35);
  this.lastCutT = m.t;
  this.fired++;
  this.log.push({ t: +m.t.toFixed(2), tier: cut.fatal ? "KILL" : "T" + (cut.tier || cineTier(cut)),
                  score: +cut.score.toFixed(2), why: (cut.why || []).join(", ") });
  /* The world going quiet and muffled is the first thing the viewer notices,
     and it has to start with the drop rather than with the blow. */
  CineAudio.set(0.22 * this.intensity, 300, 0.34, 0.05);
  if (cut.loose)
    /* The loose has to be HEARD as well as seen: an airy whoosh the length of
       the flight, rising with it. */
    CineAudio.whoosh(clamp((cut.t - cut.loose.t) / 0.35, 0.35, 1.4), this.intensity);
  else
    CineAudio.swell(Math.min(1.6, P.lead / Math.max(0.05, P.dropTo)), this.intensity);
};

/* Called once per rendered frame with REAL elapsed seconds. Returns the wall
   time the frame loop should hand to the accumulator. */
CINE.update = function(raw, m){
  if (!this.on || !m){
    this.timeScale = 1; this.zoom = 1; this.bars = 0; this.wash = 0;
    this.flash = Math.max(0, this.flash - raw * 4);
    return raw;
  }

  /* --- trigger --- */
  if (!this.cut && m.introT <= 0){
    for (const c of this.plan){
      if (c._done) continue;
      /* AUDIT: a cut whose moment passed while another cut was playing must
         be abandoned, not fired late -- a late fire whips the lens onto a
         position where nothing is happening any more. */
      if (m.t > c.t + 0.05){ c._done = true; continue; }
      const P = c.fatal ? TIER_KILL : TIER[c.tier];
      const at = c.loose ? c.loose.t : c.t - P.lead;
      if (m.t >= at){ c._done = true; this.begin(c, m); break; }
    }
    if (!this.cut && this.force > 0 && m.beats.length){
      this.force = 0;
      const b = Object.assign({}, m.beats[m.beats.length - 1],
                              { score: 1.2, why: ["forced by hand"], tier: 3 });
      this.begin(b, m);
    }
  }

  /* --- run the cut --- */
  let ts = 1, z = 1, bars = 0, wash = 0, ease = 5.0;
  if (this.cut){
    const P = this.cut.P;
    this.pt += raw;

    /* 1. THE DROP --------------------------------------------------------
       Time falls away over `ramp` wall seconds and then holds. The camera
       barely moves: it drifts a little toward the pair and stays wide. Ends
       when the blow actually lands, which is a SIM-time condition, so the
       screen duration of this movement is lead/dropTo. */
    if (this.phase === "drop"){
      const u = smooth(Math.min(1, this.pt / P.ramp));
      const L = this.cut.loose;
      /* Time keeps FALLING through the approach rather than parking at a
         constant. A flat rate reads as "the video is in slow motion"; a rate
         still decreasing as the blow arrives reads as time itself giving way,
         which is the thing being imitated. */
      const lead = L ? Math.max(0.05, this.cut.t - L.t) : P.lead;
      const prog = clamp(1 - (this.cut.t - m.t) / lead, 0, 1);
      /* A ranged drop cannot sit at 0.07x -- a 0.4s flight would take six
         seconds of screen. The flight runs at whatever rate spends about 1.2s
         of screen on it, decelerating into the contact. */
      const dTo = L ? clamp(lead / 1.2, 0.12, 0.5) : P.dropTo;
      const dFrom = L ? Math.min(0.6, dTo * 2.2) : P.dropFrom;
      const target = dFrom + (dTo - dFrom) * prog;
      ts = 1 + (target - 1) * u;
      z = 1 + 0.06 * u;
      bars = u * P.bars * 0.55; wash = u * P.wash * 0.45;
      if (L){
        /* TRACK THE BOLT. The camera pans from the archer to the target along
           the flight, and the tracer overlay marks the loose and rides the
           bolt, so the cause of the cinematic is on screen the whole way. */
        const bx = L.x + (this.cut.x - L.x) * prog;
        const by = L.y + (this.cut.y - L.y) * prog;
        this.aim(bx, by, P.bias * 0.9);
        this.sx = bx; this.sy = by;
        this.tracer = { lx: L.x, ly: L.y, cx: this.cut.x, cy: this.cut.y,
                        prog, age: this.pt };
        ease = 4.2;
      } else {
        this.aim((m.a.x + m.b.x) / 2, (m.a.y + m.b.y) / 2, P.bias * 0.35);
        ease = 2.6;
      }
      /* The 2.5s cap is a guard, not a design: if a beat ever failed to land
         when the plan said it would, the fight would otherwise crawl forever. */
      if (m.t >= this.cut.beats[0].t || this.pt > 2.5){ this.phase = "whip"; this.pt = 0; }

    /* 2. THE WHIP --------------------------------------------------------
       Frozen, and the lens snaps. `1 - (1-u)^3` rather than smoothstep: this
       has to leave fast and arrive gently, which is what a whip is. */
    } else if (this.phase === "whip"){
      if (this.pt <= raw * 1.5){
        this.flash = this.cut.fatal ? 1.0 : 0.78;
        this.wallFlash = 1;
        this.streak = 1;
        CineAudio.boom(this.intensity * (this.cut.fatal ? 1.2 : 0.9));
        CineAudio.set(0.30 * this.intensity, 620, 0.55, 0.010);
      }
      const B = this.cut.beats[this.bi];
      if (B){ this.aim(B.x, B.y, P.bias); this.sx = B.x; this.sy = B.y; }
      if (this.tracer) this.tracer.prog = 1;   // pin the comet on the landing
      ts = 0;
      const u = Math.min(1, this.pt / P.whip), e = 1 - Math.pow(1 - u, 3);
      /* Later contacts in a volley whip slightly less far, so the sequence
         escalates in RHYTHM rather than in magnification -- five identical
         2.2x punches in a row is a strobe, not an exchange. */
      const decay = 1 - Math.min(0.34, this.bi * 0.13);
      z = 1.06 + (P.peak - 1.06) * e * decay;
      bars = Math.max(P.bars * 0.55, P.bars * (0.7 + 0.3 * u)); wash = P.wash;
      ease = 11.0;                       // the camera snaps to the contact too
      /* Middle blows hold for 65% of the whip; only the LAST contact of a
         volley gets the full freeze. The sequence needs a finish, not five
         finishes. */
      const last = this.bi >= this.cut.beats.length - 1;
      const wdur = Math.max(P.whip, P.freeze) * (last ? 1 : 0.65);
      if (this.pt >= wdur){
        this.pt = 0;
        if (this.bi < this.cut.beats.length - 1){
          this.bi++;
          this.phase = "gap";
          CineAudio.set(0.34 * this.intensity, 1400, 0.70, 0.09);
        } else {
          this.phase = "settle";
          CineAudio.set(0.44 * this.intensity, 1900, 0.78, 0.12);   // the bloom
        }
      }

    /* BETWEEN CONTACTS -- and this means FASTER THAN REALTIME. The first
       version ran the gaps at 0.5-0.6x, which meant a volley was slower
       between blows than the fight it was interrupting: a four-gap exchange
       cost three extra seconds and, in Rick's words, hurt the flow of battle.
       gapRate is now 1.2-1.35: the exchange RUSHES between contacts and slams
       to a drop only in the last gapLead before each one. Whip - rush - catch
       - whip. A volley at these rates costs roughly nothing net, because the
       overcranked gaps pay back what the whips spend. */
    } else if (this.phase === "gap"){
      const B = this.cut.beats[this.bi];
      const rem = B.t - m.t;
      const near = rem <= P.gapLead;
      ts = near ? P.dropTo : P.gapRate;
      const u = smooth(Math.min(1, this.pt / 0.18));
      z = (this.zoom || P.rest) + ((near ? P.rest * 1.04 : P.rest) - (this.zoom || P.rest)) * u;
      bars = P.bars; wash = P.wash * (near ? 1 : 0.75);
      this.aim(B.x, B.y, P.bias * (near ? 0.85 : 0.55));
      ease = near ? 5.0 : 2.4;
      if (m.t >= B.t || this.pt > 2.5){ this.phase = "whip"; this.pt = 0; }

    /* Out of the peak immediately. Nobody has to live at 1.78x -- it is a
       strike, and the strike is over. */
    } else if (this.phase === "settle"){
      const u = smooth(this.pt / P.settle);
      ts = P.slow;
      z = P.peak + (P.rest - P.peak) * u;
      bars = P.bars; wash = P.wash;
      if (this.cut.x != null){ this.aim(this.cut.x, this.cut.y, P.bias);
        this.sx = this.cut.x; this.sy = this.cut.y; }
      ease = 3.2;
      if (this.pt >= P.settle){ this.phase = "hold"; this.pt = 0; }

    } else if (this.phase === "hold"){
      ts = P.slow;
      z = P.rest;
      bars = P.bars; wash = P.wash;
      if (this.cut.x != null){ this.aim(this.cut.x, this.cut.y, P.bias);
        this.sx = this.cut.x; this.sy = this.cut.y; }
      ease = 2.0;
      if (this.pt >= P.hold * (this._holdMul || 1)){ this.phase = "out"; this.pt = 0; }

    /* 3. THE RELEASE ------------------------------------------------------ */
    } else if (this.phase === "out"){
      const u = smooth(this.pt / P.out);
      /* Past 1.0 on the way out, so the fight does not ease back in -- it
         comes back HARD. The release is what makes the hold mean anything. */
      ts = P.slow + (1.10 - P.slow) * u;
      z = P.rest + (1 - P.rest) * u;
      bars = P.bars * (1 - u); wash = P.wash * (1 - u);
      const A = CONFIG.arena;
      this.tfx = A.w / 2; this.tfy = A.h / 2;
      ease = 3.4;
      if (this.pt >= P.out){
        this.cut = null; this.phase = "idle"; ts = 1; z = 1; bars = 0; wash = 0;
        this.tracer = null; this.sx = this.sy = null;
        CineAudio.set(0, 20000, 1, 0.10);
      }
    }
  }

  /* The ONE place the camera moves, on every phase and every frame, with a
     time constant. Exponential rather than linear so it settles without ever
     arriving abruptly -- and frame-rate independent, which `x += d * 0.2`
     is not. */
  {
    const k = 1 - Math.exp(-ease * raw);
    this.fx += (this.tfx - this.fx) * k;
    this.fy += (this.tfy - this.fy) * k;
    this.hh += raw;
    const live = this.cut && this.phase !== "whip" ? this.handheld : 0;
    this.hx = Math.sin(this.hh * 2.30) * 0.62 + Math.sin(this.hh * 3.71 + 1.1) * 0.38;
    this.hy = Math.sin(this.hh * 1.93 + 0.6) * 0.58 + Math.sin(this.hh * 4.17) * 0.42;
    this.hx *= live; this.hy *= live;
  }

  this.timeScale = ts * this.intensity + (1 - this.intensity);
  this.zoom  = 1 + (z - 1) * this.intensity;
  this.bars  = bars * this.intensity;
  this.wash  = wash * this.intensity;
  this.wallFlash = Math.max(0, this.wallFlash - raw * 1.15);
  this.flash = Math.max(0, this.flash - raw * 7.0);   // 3-4 frames, not a third of a second
  this.streak = Math.max(0, this.streak - raw * 2.6);
  if (this.tape) CineAudio.setRate(this.timeScale * (this.cut ? 1 : 1));

  return raw * this.timeScale;
};

CINE._snap = new Map(); CINE._snapOk = false;
window.CINE = CINE; window.CineAudio = CineAudio;
window.cinePlan = cinePlan; window.cineScore = cineScore;


/* ------------------------------------------------------------------ SHELL */
const cv = document.getElementById("cv");
const renderer = new Renderer(cv);
const selA = document.getElementById("selA");
const selB = document.getElementById("selB");
const logEl = document.getElementById("log");

for (const w of WEAPONS){
  for (const sel of [selA, selB]){
    const o = document.createElement("option");
    o.value = w.id; o.textContent = `${w.name} — ${AFFINITIES[w.aff].name}`;
    sel.appendChild(o);
  }
}
selA.value = "dawnbringer";
selB.value = "grudgebearer";

let match = null, speed = 1, last = performance.now(), acc = 0, loggedCount = 0;
/* The card is on by default because a first-time viewer needs it, and off by
   one click because someone watching their tenth fight does not. */
let introOn = true;
let bedHandle = null;

function newMatch(idA, idB, seedIn){
  if (idA === idB){
    const alts = WEAPONS.filter(w => w.id !== idA);
    idB = alts[Math.floor(Math.random()*alts.length)].id;
    selB.value = idB;
  }
  /* CINEMA (demo): an explicit seed, so the SAME fight can be replayed with
     the director off. That A/B is the whole argument -- if the two runs do not
     end identically, the feature is wrong. */
  const seed = seedIn !== undefined ? (seedIn >>> 0)
                                    : (Math.random() * 4294967296) >>> 0;
  window.__lastSeed = seed;
  match = new Match(idA, idB, seed);
  match.introT = introOn ? CONFIG.intro.dur : 0;
  /* the live page gets the scrunch too, so this build can be WATCHED
     rather than only rendered */
  match.scrunchAuto = CONFIG.scrunch.on;
  window.__match = match;

  /* Restart the bed with the match. Seal times are offset by the card, since
     the match clock is held at zero while it is up. */
  if (bedHandle){ bedHandle.stop(); bedHandle = null; }
  CineAudio.stopBed();
  if (SFX.ctx){
    const dur = CONFIG.timeout + CONFIG.intro.dur + 6;
    const seals = CONFIG.acts.slice(1).map(a => match.introT + a.t);
    if (CINE.on && CINE.tape){
      /* CINEMA (demo). The score is pre-scheduled automation against real
         time, so slowing the sim cannot slow it -- during a set-piece the
         picture would drag while the music walked on, which is the commonest
         way this effect gets built wrong. So render the bed ONCE through an
         OfflineAudioContext using SFX.bed() unmodified, then play the result
         as one buffer whose playbackRate the director can ramp. The music now
         slows AND DROPS IN PITCH with the picture. */
      CineAudio.renderBed(dur, seals).then(buf => {
        if (buf && match && match.t < 1.0) bedHandle = CineAudio.startBed(buf);
        else if (!buf && SFX.ctx){
          const t0 = SFX.ctx.currentTime;
          bedHandle = SFX.bed(t0, dur, seals.map(t => t0 + t));
        }
      });
    } else {
      const t0 = SFX.ctx.currentTime;
      bedHandle = SFX.bed(t0, dur, seals.map(t => t0 + t));
    }
  }

  /* CINEMA (demo): watch the whole fight, then choose the shots. */
  CINE.reset();
  if (CINE.on){
    const p = cinePlan(idA, idB, seed);
    CINE.plan = p.cuts; CINE.scored = p.scored; CINE.planErr = p.err;
  } else { CINE.plan = []; CINE.scored = []; }
  if (window.__cinePanel) window.__cinePanel.refresh();

  loggedCount = 0;
  logEl.innerHTML = `<b>${WEAPON_BY_ID[idA].name}</b> vs <b>${WEAPON_BY_ID[idB].name}</b> · seed ${seed}<br>`;
}

function pumpLog(){
  if (!match) return;
  while (loggedCount < match.events.length){
    const e = match.events[loggedCount++];
    logEl.innerHTML += `${e.t.toFixed(1).padStart(5)}s  ${e.text}<br>`;
    logEl.scrollTop = logEl.scrollHeight;
  }
}

/* Keep the backing store matched to the pixels on screen. Off the moment the
   capture pipeline pins a resolution, so a headless viewport cannot shrink the
   frame the video is being rendered from. */
let autoFit = true;
function fitCanvas(){
  if (!autoFit) return;
  const r = cv.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) renderer.resize(r.width, r.height);
}
if (typeof ResizeObserver === "function") new ResizeObserver(fitCanvas).observe(cv);
else addEventListener("resize", fitCanvas);
fitCanvas();

function frame(now){
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (match){
    /* __frozen holds the sim still while still drawing — used by the capture
       tooling to photograph a single instant such as mid-clank. */
    /* CINEMA (demo). One loop body, in CINE.pump, shared with the offline
       clip renderer so the two cannot drift apart. It hands the accumulator
       WALL time scaled by the director; the sim still consumes it in identical
       CONFIG.physics.dt slices, so the sequence of steps -- and therefore the
       winner, the duration in match time, and every statistic -- is what it
       would have been at 1.0. Slowing the picture cannot slow the fight.

       `alpha` is how far the display clock sits between the last fixed step
       and the next one. At a 0.07x drop a step lands only every 7th rendered
       frame, so without this the world updates at 8 Hz behind a 60 Hz display
       and the slow motion visibly stutters. */
    const alpha = (typeof CINE !== "undefined")
      ? (window.__frozen ? 0 : CINE.pump(raw, match, speed))
      : (() => { if (window.__frozen) return 0;
                 acc += raw * speed; const dt = CONFIG.physics.dt; let n = 0;
                 while (acc >= dt && n < 40){ match.step(dt); acc -= dt; n++; }
                 return 0; })();
    if (typeof CINE !== "undefined" && alpha > 0) CINE.drawLerped(renderer, match, alpha);
    else renderer.draw(match);
    pumpLog();
  }
  requestAnimationFrame(frame);
}

document.getElementById("btnFight").onclick = () => { SFX.resume(); newMatch(selA.value, selB.value); };
document.getElementById("btnRandom").onclick = () => {
  SFX.resume();
  const pick = () => WEAPONS[Math.floor(Math.random()*WEAPONS.length)].id;
  let x = pick(), y = pick();
  while (y === x) y = pick();
  selA.value = x; selB.value = y;
  newMatch(x, y);
};
const speeds = [1, 2, 4, 0.30];
let si = 0;
document.getElementById("btnSpeed").onclick = (e) => {
  si = (si + 1) % speeds.length; speed = speeds[si];
  e.target.textContent = speed + "×";
};
const btnIntro = document.getElementById("btnIntro");
btnIntro.onclick = () => {
  introOn = !introOn;
  btnIntro.textContent = introOn ? "Intro card" : "No intro";
  btnIntro.classList.toggle("off", !introOn);
  if (match && match.t === 0) match.introT = introOn ? CONFIG.intro.dur : 0;
};

const btnScrunch = document.getElementById("btnScrunch");
if (btnScrunch){
  btnScrunch.onclick = () => {
    CONFIG.scrunch.on = !CONFIG.scrunch.on;
    btnScrunch.textContent = CONFIG.scrunch.on ? "Scrunch" : "No scrunch";
    btnScrunch.classList.toggle("off", !CONFIG.scrunch.on);
    if (match) match.scrunchAuto = CONFIG.scrunch.on;
  };
}

const btnMute = document.getElementById("btnMute");
btnMute.onclick = () => {
  SFX.resume(); SFX.on = !SFX.on;
  btnMute.textContent = SFX.on ? "Sound" : "Muted";
  btnMute.classList.toggle("off", !SFX.on);
};

function __inject(m){ match = m; window.__match = m; m.scrunchAuto = CONFIG.scrunch.on; loggedCount = match.events.length; }


/* The capture path must never photograph a fallback face. `document.fonts`
   resolves once both variable fonts are parsed; until then __fontsReady is
   false and scpage.game() holds. The live page just redraws on the next rAF. */
window.__fontsReady = false;
(function(){
  const want = ["700 33px 'Atkinson Hyperlegible Next'",
                "800 30px 'Atkinson Hyperlegible Next'",
                "500 18px 'Atkinson Hyperlegible Next'",
                "800 40px 'Atkinson Hyperlegible Mono'"];
  const done = () => { window.__fontsReady = true; };
  if (!document.fonts){ done(); return; }
  Promise.all(want.map(f => document.fonts.load(f)))
    .then(() => document.fonts.ready).then(done).catch(done);
})();
window.AC = { litWeapon, CONFIG, AFFINITIES, STATUS, WEAPONS, SHAPES, relicShot, relicStatus, Match, simulate, batch,
              newMatch, __inject, SFX, renderer, IC,
              /* Pin the backing store and stop the live page fitting it to the
                 window. Every capture path — render.py, verify.py — calls this
                 first, so the video's resolution is stated rather than
                 inherited from whatever viewport a harness happened to open. */
              setResolution(w, h){
                autoFit = false;
                cv.width = w; cv.height = h;
                renderer.k = w / 1080;
                return { w: cv.width, h: cv.height, k: renderer.k };
              },
              /* Synchronous draw for the capture pipeline. Stepping and drawing
                 in lockstep keeps a headless render deterministic instead of
                 racing requestAnimationFrame. */
              __draw(m){ renderer.draw(m || match); },
              get match(){ return match; } };

newMatch(selA.value, selB.value);
requestAnimationFrame(frame);

/* ==========================================================================
   CINEMA — the demo panel.  Not shipped; this exists so the feature can be
   ARGUED ABOUT rather than described. Everything that matters is A/B-able in
   two clicks, including the claim that the director cannot change the fight.
   ========================================================================== */
(() => {
  const box = document.createElement("div");
  box.id = "cinePanel";
  box.innerHTML = `
<style>
#cinePanel{position:fixed;top:10px;right:10px;z-index:99;width:290px;
  font:12px/1.45 'Atkinson Hyperlegible Next',sans-serif;color:#E8D5A8;
  background:#0B0910F2;border:1px solid #C9A22766;border-radius:10px;
  padding:11px 12px;box-shadow:0 8px 34px #000A}
#cinePanel h4{margin:0 0 8px;font:600 12px 'Atkinson Hyperlegible Next',sans-serif;color:#C9A227;
  letter-spacing:.10em;text-transform:uppercase}
#cinePanel .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#cinePanel button{flex:1 1 auto;font:600 11px 'Atkinson Hyperlegible Next',sans-serif;background:#1B1626;
  color:#E8D5A8;border:1px solid #C9A22744;border-radius:6px;padding:6px 8px;
  cursor:pointer}
#cinePanel button.on{background:#C9A227;color:#140F1C;border-color:#C9A227}
#cinePanel button:hover{border-color:#C9A227}
#cinePanel .big{width:100%;flex-basis:100%}
#cinePanel label{display:block;color:#8A7F9A;font-size:10.5px;margin-top:8px;
  letter-spacing:.05em;text-transform:uppercase}
#cinePanel input[type=range]{width:100%;accent-color:#C9A227}
#cinePanel .cuts{margin-top:8px;border-top:1px solid #C9A22733;padding-top:7px;
  max-height:190px;overflow:auto;font:11px 'Atkinson Hyperlegible Mono',monospace}
#cinePanel .cut{display:flex;gap:6px;padding:2.5px 0;color:#B9AECA}
#cinePanel .cut b{color:#FFF4D0;min-width:44px}
#cinePanel .t3{color:#FFD98A} #cinePanel .kill{color:#E0433F}
#cinePanel .hint{color:#6E6480;font-size:10px;margin-top:7px;line-height:1.4}
#cinePanel .live{font:11px 'Atkinson Hyperlegible Mono',monospace;color:#7FE0A0;margin-top:6px}
#cinePanel.min .body{display:none}
</style>
<h4>Cinema · demo <span style="float:right;cursor:pointer" id="cnMin">–</span></h4>
<div class="body">
  <div class="row">
    <button id="cnOn" class="on">Director ON</button>
  </div>
  <div class="row">
    <button id="cnTape" class="on">Tape-slow score</button>
  </div>
  <label>Intensity <span id="cnIv">100%</span></label>
  <input type="range" id="cnInt" min="0" max="150" value="100">
  <label>Bar to qualify <span id="cnCv">1.90</span> <span style="color:#5C5470">(zero cuts is a valid answer)</span></label>
  <input type="range" id="cnCuts" min="100" max="300" value="190">
  <div class="row">
    <button id="cnForce" class="big">Force a set-piece now &nbsp;(F)</button>
  </div>
  <div class="row">
    <button id="cnAB" class="big">Replay this seed, director OFF</button>
  </div>
  <div class="live" id="cnLive">—</div>
  <div class="cuts" id="cnCutList"></div>
  <div class="hint">C director · F force · V A/B replay.<br>
    The A/B replays the same seed. Same winner, same duration in match
    time — that is the claim.</div>
</div>`;
  document.body.appendChild(box);

  const $ = id => document.getElementById(id);
  const set = (el, v) => el.classList.toggle("on", !!v);

  $("cnMin").onclick = () => box.classList.toggle("min");

  $("cnOn").onclick = () => {
    CINE.on = !CINE.on;
    $("cnOn").textContent = CINE.on ? "Director ON" : "Director OFF";
    set($("cnOn"), CINE.on);
    if (!CINE.on) CINE.reset();
    panel.refresh();
  };
  $("cnTape").onclick = () => {
    CINE.tape = !CINE.tape;
    set($("cnTape"), CINE.tape);
    newMatch(selA.value, selB.value, window.__lastSeed);
  };
  $("cnInt").oninput = e => {
    CINE.intensity = e.target.value / 100;
    $("cnIv").textContent = e.target.value + "%";
  };
  $("cnCuts").oninput = e => {
    CINE.floor = e.target.value / 100;
    $("cnCv").textContent = CINE.floor.toFixed(2);
    if (match){
      const p = cinePlan(selA.value, selB.value, window.__lastSeed);
      CINE.plan = p.cuts.filter(c => c.t > match.t);
      panel.refresh();
    }
  };
  $("cnForce").onclick = () => { CINE.force = 1; };
  $("cnAB").onclick = () => {
    const seed = window.__lastSeed;
    const was = CINE.on;
    CINE.on = !was;
    $("cnOn").textContent = CINE.on ? "Director ON" : "Director OFF";
    set($("cnOn"), CINE.on);
    newMatch(selA.value, selB.value, seed);
  };

  addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "c" || e.key === "C") $("cnOn").click();
    if (e.key === "f" || e.key === "F") $("cnForce").click();
    if (e.key === "v" || e.key === "V") $("cnAB").click();
  });

  const panel = {
    refresh(){
      const el = $("cnCutList");
      if (!CINE.on){ el.innerHTML = '<div class="cut">director off</div>'; return; }
      if (CINE.planErr){ el.innerHTML = '<div class="cut">prescan failed: ' +
        CINE.planErr + '</div>'; return; }
      const rows = (CINE.plan || []).map(c => {
        const cls = c.fatal ? "kill" : c.tier === 3 ? "t3" : "";
        const tag = c.fatal ? "KILL" : "T" + c.tier;
        return `<div class="cut ${cls}"><b>${c.t.toFixed(1)}s</b>` +
               `<span>${tag} ${c.score.toFixed(2)} — ${(c.why||[]).join(", ")}</span></div>`;
      }).join("");
      el.innerHTML = `<div class="cut" style="color:#C9A227">THE CUT LIST — ` +
        `chosen before frame 1</div>` + (rows || '<div class="cut">no cuts</div>');
    }
  };
  window.__cinePanel = panel;

  setInterval(() => {
    if (!match) return;
    const s = CINE.on
      ? `t ${match.t.toFixed(1)}s · time ×${CINE.timeScale.toFixed(2)}` +
        ` · zoom ×${CINE.zoom.toFixed(2)} · ${CINE.phase}`
      : `t ${match.t.toFixed(1)}s · director off`;
    $("cnLive").textContent = s;
  }, 80);

  panel.refresh();
})();

</script>
</body>
</html>
