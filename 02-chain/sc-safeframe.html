    c.fillStyle = g; c.fill();

    /* SMALL. v1 ran these to W*0.46 and turned the crescent inside out -- the
       thorn stopped reading as a blade at all. A grammar has to survive its
       type; see resume-here-v13 §4.2 on the band. */
    c.fillStyle = p.core;                                       // inner serration
    for (let i = 1; i <= 6; i++){
      const q = SHAPES._scOuter(L, W, i / 7);
      c.beginPath();
      c.moveTo(q.x - q.nx * W*0.04, q.y - q.ny * W*0.04);
      c.lineTo(q.x - q.nx * W*0.19 + Math.cos(q.a) * W*0.11,
               q.y - q.ny * W*0.19 + Math.sin(q.a) * W*0.11);
      c.lineTo(q.x - q.nx * W*0.05 + Math.cos(q.a) * W*0.13,
               q.y - q.ny * W*0.05 + Math.sin(q.a) * W*0.13);
      c.closePath(); c.fill();
    }
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.05);
    c.beginPath();
    c.moveTo(L*0.70, W*0.20);
    c.bezierCurveTo(L*1.02, -W*0.20, L*0.98, -W*0.95, L*0.56, -W*1.32);
    c.stroke();
  },

  /* ---------------------------------------------------------- BLOODSWORN --
     BARBED BACKWARD. On a hammer "backward" was the return stroke. On a scythe
     it is unambiguous: the blade cuts on the INSIDE of the curve, so the barbs
     go on the OUTSIDE, where they drag on the way out.

     THE CELL'S FLAIR: the barbs get longer toward the tip, so the far end of
     the sweep is the part that catches -- which is also the part travelling
     fastest. */
  _scBarbed(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    c.lineJoin = "miter";
    c.fillStyle = SHAPES._shade(p.steel, 0.74, 0.32);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.55);
    c.lineWidth = Math.max(1, W*0.03);
    for (let i = 1; i <= 5; i++){
      const u = i / 6;
      const q = SHAPES._scOuter(L, W, u);
      const len = W * (0.19 + 0.30 * u);           // v1 ran to 0.56 and merged
      c.beginPath();
      c.moveTo(q.x, q.y);
      c.lineTo(q.x + q.nx * len - Math.cos(q.a) * len * 0.85,
               q.y + q.ny * len - Math.sin(q.a) * len * 0.85);
      c.lineTo(q.x + Math.cos(q.a) * W * 0.16, q.y + Math.sin(q.a) * W * 0.16);
      c.closePath(); c.fill(); c.stroke();
    }
    const tip = SHAPES._scOuter(L, W, 1.0);                     // and a tip hook
    c.beginPath();
    c.moveTo(tip.x, tip.y);
    c.lineTo(tip.x + W*0.10, tip.y - W*0.52);
    c.lineTo(tip.x + W*0.34, tip.y - W*0.10);
    c.closePath(); c.fill(); c.stroke();
  },

  /* ------------------------------------------------------------- UMBRAL --
     EATEN. THE CELL'S FLAIR: the bites are taken out of the CUTTING edge, so
     the blade has gaps exactly where it is supposed to work, and the snath is
     bitten through just below the collar -- the one joint the whole weapon
     hangs from. */
  _scEaten(c, L, W, p){
    c.save();
    SHAPES._scBase(c, L, W, p);
    c.globalCompositeOperation = "destination-out";
    /* shared path — see _whEaten: destination-out removes the glow too, so an
       un-rimmed bite is a hard black hole in the picture. */
    const bitePath = (bx, by, r, seed) => {
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a = i * TAU / 10;
        const rr = r * (0.60 + 0.48 * Math.abs(Math.sin(i * 1.9 + seed)));
        const px = bx + Math.cos(a) * rr, py = by + Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
    };
    const bite = (bx, by, r, seed) => { bitePath(bx, by, r, seed); c.fill(); };
    const RIMS = [];
    /* SMALL, and off the EDGE rather than through the middle. v1 used
       0.30/0.24 centred at W*0.16 inboard and left a sliver, which reads
       as broken rather than eaten. */
    for (const [u, r, s] of [[0.32, 0.17, 0.4], [0.66, 0.14, 2.1]]){
      const q = SHAPES._scOuter(L, W, u);
      RIMS.push([q.x + q.nx * W*0.02, q.y + q.ny * W*0.02, W*r, s]);
    }
    RIMS.push([L*0.685, W*0.155, W*0.13, 1.3]);                 // the joint
    for (const b of RIMS) bite(b[0], b[1], b[2], b[3]);
    c.restore();

    c.save();
    /* THE RIM CARRIES A SHADOW. `destination-out` removes the glow along
       with the metal, and the glow is 90%+ of the lit picture, so an
       un-lit rim still reads as a hard black hole. Giving the rim its own
       shadowBlur puts light back around the absence. */
    c.shadowColor = p.core; c.shadowBlur = 12;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.040);
    for (const b of RIMS){ bitePath(b[0], b[1], b[2], b[3]); c.stroke(); }
    c.restore();

    c.save();                                                    // what leaks out
    c.globalAlpha = 0.5; c.fillStyle = p.core;
    for (const u of [0.30, 0.62]){
      const q = SHAPES._scOuter(L, W, u);
      c.beginPath();
      c.moveTo(q.x, q.y);
      c.quadraticCurveTo(q.x - q.nx * W*0.9, q.y - q.ny * W*0.9,
                         q.x - q.nx * W*0.5 - Math.cos(q.a) * W*0.5,
                         q.y - q.ny * W*0.5 - Math.sin(q.a) * W*0.5);
      c.quadraticCurveTo(q.x - q.nx * W*0.3, q.y - q.ny * W*0.3, q.x, q.y);
      c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
    c.restore();
  },

  /* ---------------------------------------------------------- SANCTIFIED --
     RADIANT AND PIERCED. THE CELL'S FLAIR: the halo does not sit behind the
     blade the way it does behind a hammer head -- it follows the crescent, a
     second arc standing off the back, so the weapon reads as a sweep of light
     with a blade inside it. The piercings run along the blade's spine. */
  _scRadiant(c, L, W, p){
    c.save();                                                    // the outer arc
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.085);
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(L*0.78, W*0.34);
    c.bezierCurveTo(L*1.26, -W*0.22, L*1.20, -W*1.20, L*0.52, -W*1.66);
    c.stroke();
    c.lineWidth = Math.max(1, W*0.045);                          // and its rays
    for (let i = 1; i <= 4; i++){
      const q = SHAPES._scOuter(L, W, i / 5);
      c.beginPath();
      c.moveTo(q.x + q.nx * W*0.10, q.y + q.ny * W*0.10);
      c.lineTo(q.x + q.nx * W*0.40, q.y + q.ny * W*0.40);
      c.stroke();
    }
    c.restore();

    SHAPES._scBase(c, L, W, p);

    c.save();                                                    // pierced spine
    c.globalCompositeOperation = "destination-out";
    for (let i = 1; i <= 4; i++){
      const q = SHAPES._scOuter(L, W, i / 5);
      c.beginPath();
      c.arc(q.x - q.nx * W*0.30 + Math.cos(q.a) * W*0.02,
            q.y - q.ny * W*0.30 + Math.sin(q.a) * W*0.02,
            W * 0.115, 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- DWARVEN --
     BUILT. THE CELL'S FLAIR: a scythe's weak point is the tang, where a long
     blade meets a long pole at an angle, so dwarven puts the whole apparatus
     there -- a bolted socket, a diagonal strut back to the snath, and a
     reinforcing spine strap bolted along the crescent's back. It looks like it
     was engineered by someone who did not trust the joint. */
  _scBuilt(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);
    c.lineJoin = "round";

    c.strokeStyle = iron; c.lineWidth = W*0.13;                  // spine strap
    c.beginPath();
    const s0 = SHAPES._scOuter(L, W, 0.06);
    c.moveTo(s0.x + s0.nx * W*0.04, s0.y + s0.ny * W*0.04);
    for (let i = 1; i <= 8; i++){
      const q = SHAPES._scOuter(L, W, 0.06 + 0.88 * i / 8);
      c.lineTo(q.x + q.nx * W*0.04, q.y + q.ny * W*0.04);
    }
    c.stroke();
    c.fillStyle = dark;
    for (let i = 0; i <= 3; i++){
      const q = SHAPES._scOuter(L, W, 0.10 + 0.26 * i);
      c.beginPath(); c.arc(q.x + q.nx * W*0.04, q.y + q.ny * W*0.04,
                           W*0.055, 0, TAU); c.fill();
    }

    c.strokeStyle = iron; c.lineWidth = W*0.10;                  // the strut
    c.beginPath();
    c.moveTo(L*0.40, W*0.28); c.lineTo(L*0.70, -W*0.22);
    c.stroke();

    c.fillStyle = iron; c.strokeStyle = dark;                    // bolted socket
    c.lineWidth = Math.max(1, W*0.03);
    c.beginPath();
    c.moveTo(L*0.62, W*0.40); c.lineTo(L*0.80, W*0.30);
    c.lineTo(L*0.78, -W*0.16); c.lineTo(L*0.60, -W*0.06);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = dark;
    for (const [bx, by] of [[0.655, 0.28], [0.745, 0.24],
                            [0.655, -0.02], [0.745, -0.06]]){
      c.beginPath(); c.arc(L*bx, W*by, W*0.05, 0, TAU); c.fill();
    }
  },

  /* --------------------------------------------------------------- VIGIL --
     PLATED. THE CELL'S FLAIR: five plates riding the OUTER edge, so the back
     of the blade is armoured and the cutting edge is bare -- the same argument
     the ward makes, that the thing which protects is the thing you present.
     Countable, because five plates read as five things. */
  _scPlated(c, L, W, p){
    SHAPES._scBase(c, L, W, p);
    for (let i = 0; i < 5; i++){
      const q = SHAPES._scOuter(L, W, 0.10 + 0.20 * i);
      c.save();
      c.translate(q.x + q.nx * W*0.10, q.y + q.ny * W*0.10);
      c.rotate(q.a);
      c.fillStyle = p.dark;   c.fillRect(-W*0.28, -W*0.30, W*0.56, W*0.46);
      c.fillStyle = p.core;   c.fillRect(-W*0.22, -W*0.24, W*0.44, W*0.34);
      c.fillStyle = p.glow;   c.fillRect(-W*0.22, -W*0.24, W*0.44, W*0.09);
      c.fillStyle = p.dark;
      c.beginPath(); c.arc(0, -W*0.06, W*0.05, 0, TAU); c.fill();
      c.restore();
    }
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);   // snath banding
    for (const gx of [0.16, 0.30, 0.44]){
      const gy = W * (0.30 * (gx / 0.70) * (1.4 - gx));
      c.beginPath();
      c.moveTo(L*gx, gy - W*0.13); c.lineTo(L*gx, gy + W*0.13); c.stroke();
    }
  },

  /* No hilt and a gap where the hand should be — it is held by nothing.
     Twin shards, so the pair reads as a spinning cross. */
  runeblade(c, L, W, p){
    const bh = W * 0.30;
    c.save();
    c.globalAlpha = 0.55;                                       // binding glyph
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);
    c.beginPath(); c.arc(L*0.13, 0, W*0.20, 0, TAU); c.stroke();
    c.beginPath(); c.arc(L*0.13, 0, W*0.32, 0.4, 2.2); c.stroke();
    c.beginPath(); c.arc(L*0.13, 0, W*0.32, 3.5, 5.3); c.stroke();
    c.restore();

    c.beginPath();                                              // crystal shard
    c.moveTo(L*0.28, 0);
    c.lineTo(L*0.42, -bh);
    c.lineTo(L*0.88, -bh*0.68);
    c.lineTo(L, 0);
    c.lineTo(L*0.88,  bh*0.68);
    c.lineTo(L*0.42,  bh);
    c.closePath();
    const g = c.createLinearGradient(L*0.28, -bh, L, bh);
    g.addColorStop(0, p.glow); g.addColorStop(0.5, p.steel); g.addColorStop(1, p.core);
    c.fillStyle = g; c.globalAlpha = 0.92; c.fill(); c.globalAlpha = 1;
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.06); c.stroke();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.05);  // glyph ticks
    for (const gx of [0.50, 0.63, 0.76]){
      c.beginPath(); c.moveTo(L*gx, -bh*0.44); c.lineTo(L*gx, bh*0.44); c.stroke();
    }
  },

  /* The flail's head, drawn at its simulated position. Long spikes so the
     silhouette says "this arrives late and hurts". */
  /* ============================================================ FLAILHEAD ==
     The only shape with no `aff` argument -- it is called `(c, D, p, spin)` --
     so the grammar dispatches on `p.key` alone. It is also the shape the matrix
     doc calls "genuinely school-neutral", which turned out to mean nobody had
     tried: it scored IoU 1.000, the flattest cell in the game. */
  flailHead(c, D, p, spin){
    const key = p.key;
    if (key === "runic")      return SHAPES._fhConjured(c, D, p, spin);
    if (key === "verdant")    return SHAPES._fhGrown(c, D, p, spin);
    if (key === "bloodsworn") return SHAPES._fhBarbed(c, D, p, spin);
    if (key === "umbral")     return SHAPES._fhEaten(c, D, p, spin);
    if (key === "sanctified") return SHAPES._fhRadiant(c, D, p, spin);
    if (key === "dwarven")    return SHAPES._fhBuilt(c, D, p, spin);
    if (key === "vigil")      return SHAPES._fhPlated(c, D, p, spin);
    return SHAPES._fhBase(c, D, p, spin);
  },

  /* the ball, without its spikes -- every grammar wants a different set */
  _fhBall(c, D, p){
    const r = D * 0.34;
    const g = c.createRadialGradient(-r*0.35, -r*0.35, r*0.08, 0, 0, r);
    g.addColorStop(0, p.steel);
    g.addColorStop(0.6, SHAPES._shade(p.steel, 0.38, 0.42));
    g.addColorStop(1, p.dark);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.028);
    c.beginPath(); c.arc(0, 0, r*0.52, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, r*0.52, 1.1, 2.4);
    c.lineWidth = Math.max(1, D*0.05); c.stroke();
  },

  _fhBase(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);           // spikes
    for (let i = 0; i < 8; i++){
      const a = (i / 8) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.92, Math.sin(a - 0.20) * r * 0.92);
      c.lineTo(Math.cos(a + 0.20) * r * 0.92, Math.sin(a + 0.20) * r * 0.92);
      c.lineTo(Math.cos(a) * r * 1.95,        Math.sin(a) * r * 1.95);
      c.closePath(); c.fill();
    }
    c.fillStyle = p.core;
    for (let i = 0; i < 8; i++){                                // glowing tips
      const a = (i / 8) * TAU;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.80, Math.sin(a) * r * 1.80, r * 0.16, 0, TAU);
      c.fill();
    }
    const g = c.createRadialGradient(-r*0.35, -r*0.35, r*0.08, 0, 0, r);
    g.addColorStop(0, p.steel);
    g.addColorStop(0.6, SHAPES._shade(p.steel, 0.38, 0.42));
    g.addColorStop(1, p.dark);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.028);
    c.beginPath(); c.arc(0, 0, r*0.52, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, r*0.52, 1.1, 2.4); c.lineWidth = Math.max(1, D*0.05); c.stroke();
    c.restore();
  },

  /* --------------------------------------------------------------- RUNIC --
     IN PIECES. THE CELL'S FLAIR: a ball has no length to break along, so it
     breaks the only way a sphere can -- into a shell that has come APART, five
     curved plates orbiting the gap where the mass should be. The spikes are
     gone; what is left is the light that was inside it. */
  _fhConjured(c, D, p, spin){
    const r = D * 0.34, t = SHAPES._t || 0;
    c.save();
    c.rotate(spin);
    c.save();
    c.globalCompositeOperation = "lighter";
    c.fillStyle = p.glow; c.shadowColor = p.core; c.shadowBlur = 20;
    c.beginPath(); c.arc(0, 0, r*0.34, 0, TAU); c.fill();
    c.restore();
    for (let i = 0; i < 5; i++){
      const a = (i / 5) * TAU;
      const out = r * (1.02 + 0.20 * Math.sin(t * 2.0 + i * 1.7));
      const cant = Math.sin(t * 1.5 + i * 2.1) * 0.22;
      c.save();
      c.rotate(a + cant);
      c.translate(out, 0);
      c.fillStyle = p.dark;
      c.beginPath();
      c.moveTo(-r*0.30, -r*0.62); c.lineTo(r*0.34, -r*0.40);
      c.lineTo(r*0.34,  r*0.40);  c.lineTo(-r*0.30,  r*0.62);
      c.closePath(); c.fill();
      const g = c.createLinearGradient(-r*0.30, 0, r*0.34, 0);
      g.addColorStop(0, p.core); g.addColorStop(1, p.steel);
      c.fillStyle = g; c.globalAlpha = 0.94;
      c.beginPath();
      c.moveTo(-r*0.24, -r*0.54); c.lineTo(r*0.28, -r*0.34);
      c.lineTo(r*0.28,  r*0.34);  c.lineTo(-r*0.24,  r*0.54);
      c.closePath(); c.fill(); c.globalAlpha = 1;
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, D*0.022); c.stroke();
      c.restore();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- VERDANT --
     GROWN. THE CELL'S FLAIR: a spiked ball on a chain is a BURR -- the seed
     head that evolved precisely to be spiky and to catch on things. So the
     grammar barely has to reach: the spikes become hooked bristles of uneven
     length, and the ball becomes a seed case with a split down it. */
  _fhGrown(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.strokeStyle = SHAPES._shade(p.steel, 0.66, 0.30);
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < 11; i++){
      const a = (i / 11) * TAU;
      const len = r * (1.55 + 0.55 * Math.abs(Math.sin(i * 2.3)));
      c.lineWidth = Math.max(1, D * 0.030);
      c.beginPath();
      c.moveTo(Math.cos(a) * r * 0.80, Math.sin(a) * r * 0.80);
      c.quadraticCurveTo(Math.cos(a) * len, Math.sin(a) * len,
                         Math.cos(a + 0.30) * len * 0.94,
                         Math.sin(a + 0.30) * len * 0.94);
      c.stroke();
    }
    SHAPES._fhBall(c, D, p);
    c.strokeStyle = SHAPES._shade(p.dark, 1.1, 0.10);            // the split
    c.lineWidth = Math.max(1, D*0.035);
    c.beginPath();
    c.moveTo(-r*0.80, -r*0.30);
    c.quadraticCurveTo(0, r*0.10, r*0.80, -r*0.24);
    c.stroke();
    c.fillStyle = p.glow;                                        // seeds in the split
    for (const sx of [-0.42, 0, 0.42]){
      c.beginPath(); c.arc(r*sx, r*(0.02 - 0.10*Math.abs(sx)), r*0.10, 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ---------------------------------------------------------- BLOODSWORN --
     BARBED BACKWARD. THE CELL'S FLAIR: on a ball that spins there is no
     "backward" until you pick one -- so every spike hooks the SAME way round,
     which turns the whole head into a ratchet and states the direction of
     rotation in the silhouette. Nothing else in the game says which way a
     weapon is turning while it is turning. */
  /* A NEEDLE: two concave edges meeting at a TRUE VERTEX, plus the light on
     the leading edge drawn as a second needle SHARING that vertex.

     Never a stroke. A stroke has a cap and a cap is a blunt end at any width --
     v37 section 8.3 learned this on the flame tongues ("drawn as strokes with
     round caps: noodles ... the taper is most of what makes it read") and it is
     the same lesson here. An outline stroked round the whole thing would round
     off the point exactly the way the red dot used to.

     Callers hand in their own three points. A barb's tip is cut from the barb's
     own Bezier; a thrown spike is not. What these share is the LOOK, which is
     all they have in common, so that is all that is factored. */
  _needle(c, B1, AP, B2, conc, core, glow, ga, gw){
    const lp = (u, v, t) => [u[0] + (v[0] - u[0]) * t, u[1] + (v[1] - u[1]) * t];
    const k1 = lp(lp(B1, AP, 0.5), B2, conc);
    const k2 = lp(lp(AP, B2, 0.5), B1, conc);
    c.fillStyle = core;
    c.beginPath();
    c.moveTo(B1[0], B1[1]);
    c.quadraticCurveTo(k1[0], k1[1], AP[0], AP[1]);
    c.quadraticCurveTo(k2[0], k2[1], B2[0], B2[1]);
    c.closePath(); c.fill();
    if (!(ga > 0)) return;
    const G2 = lp(B1, B2, gw);
    const g1 = lp(lp(B1, AP, 0.5), G2, conc);
    const g2 = lp(lp(AP, G2, 0.5), B1, conc);
    c.globalAlpha = ga; c.fillStyle = glow;
    c.beginPath();
    c.moveTo(B1[0], B1[1]);
    c.quadraticCurveTo(g1[0], g1[1], AP[0], AP[1]);
    c.quadraticCurveTo(g2[0], g2[1], G2[0], G2[1]);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
  },

  _fhBarbed(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.52);
    c.lineWidth = Math.max(1, D*0.018);
    for (let i = 0; i < 7; i++){
      const a = (i / 7) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.22) * r * 0.92, Math.sin(a - 0.22) * r * 0.92);
      c.quadraticCurveTo(Math.cos(a + 0.34) * r * 1.70,
                         Math.sin(a + 0.34) * r * 1.70,
                         Math.cos(a + 0.86) * r * 1.94,
                         Math.sin(a + 0.86) * r * 1.94);
      c.quadraticCurveTo(Math.cos(a + 0.34) * r * 1.24,
                         Math.sin(a + 0.34) * r * 1.24,
                         Math.cos(a + 0.24) * r * 0.92,
                         Math.sin(a + 0.24) * r * 0.92);
      c.closePath(); c.fill(); c.stroke();
    }
    SHAPES._fhBall(c, D, p);
    /* THE TIPS, HONED. They were filled circles of radius 0.13r centred 0.08r
       INSIDE the barb's own vertex -- spanning 1.73r to 1.99r against a barb
       that terminates at 1.94r -- so the dot was capping a point that already
       existed. The point now CONTINUES the barb's own tangent at that vertex,
       `P1 - C1` for a quadratic, which is 1.07 rad off radial because these
       barbs hook hard. A point drawn radially would read as a spike glued onto
       a hook rather than as a hook that has been sharpened.
       Rick: "red razor sharp points ... fits the bloody theme better imo",
       then "lets shorten those spikes a bit" -- laddered at 1:1 and taken
       at 0.3r. */
    for (let i = 0; i < 7; i++){
      const a = (i / 7) * TAU;
      const d = (ang, k) => [Math.cos(ang) * r * k, Math.sin(ang) * r * k];
      const q = (A, C, B, t) => { const u = 1 - t;
        return [u*u*A[0] + 2*u*t*C[0] + t*t*B[0],
                u*u*A[1] + 2*u*t*C[1] + t*t*B[1]]; };
      /* the barb's own control net, restated. if these ever drift from the
         loop above, the point detaches from the barb -- which is the one way
         this can fail while still drawing something plausible. */
      const P0 = d(a - 0.22, 0.92), C1 = d(a + 0.34, 1.70),
            P1 = d(a + 0.86, 1.94), C2 = d(a + 0.34, 1.24),
            P2 = d(a + 0.24, 0.92);
      const B1 = q(P0, C1, P1, 0.72), B2 = q(P1, C2, P2, 0.3);
      const tx = P1[0] - C1[0], ty = P1[1] - C1[1];
      const tl = Math.hypot(tx, ty) || 1;
      const AP = [P1[0] + tx / tl * r * 0.3, P1[1] + ty / tl * r * 0.3];
      SHAPES._needle(c, B1, AP, B2, 0.18, p.core, p.glow, 0.85, 0.34);
    }
    c.restore();
  },

  /* ------------------------------------------------------------- UMBRAL --
     EATEN. THE CELL'S FLAIR: half the spikes are simply MISSING, and the ball
     has a crescent bitten out of one side, so the head is visibly lighter on
     one side than the other -- an unbalanced flail, which is the most
     unsettling thing this particular weapon could be. */
  _fhEaten(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.save();
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    for (const i of [0, 1, 3, 6]){                               // four of eight
      const a = (i / 8) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.92, Math.sin(a - 0.20) * r * 0.92);
      c.lineTo(Math.cos(a + 0.20) * r * 0.92, Math.sin(a + 0.20) * r * 0.92);
      c.lineTo(Math.cos(a) * r * 1.95,        Math.sin(a) * r * 1.95);
      c.closePath(); c.fill();
    }
    c.fillStyle = p.core;
    for (const i of [0, 1, 3, 6]){
      const a = (i / 8) * TAU;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.80, Math.sin(a) * r * 1.80, r * 0.16, 0, TAU);
      c.fill();
    }
    SHAPES._fhBall(c, D, p);
    c.globalCompositeOperation = "destination-out";              // the bite
    c.beginPath();
    for (let i = 0; i < 12; i++){
      const a = -0.9 + i * (2.2 / 11);
      const rr = r * (1.02 + 0.26 * Math.abs(Math.sin(i * 1.7)));
      const px = r * 0.92 + Math.cos(a) * rr * 0.66;
      const py = -r * 0.70 + Math.sin(a) * rr * 0.66;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
    c.restore();

    c.globalAlpha = 0.5; c.fillStyle = p.core;                   // the leak
    c.beginPath();
    c.moveTo(r*0.50, -r*0.56);
    c.quadraticCurveTo(r*1.50, -r*1.30, r*1.90, -r*0.42);
    c.quadraticCurveTo(r*1.20, -r*0.62, r*0.72, -r*0.10);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
    c.restore();
  },

  /* ---------------------------------------------------------- SANCTIFIED --
     RADIANT AND PIERCED. THE CELL'S FLAIR: a spiked ball with holes in it and
     light coming out is a CENSER, which is both the correct liturgical object
     and the only version of this weapon that has ever been swung in a church.
     The halo is a ring around the equator rather than behind the head, because
     a sphere has no behind. */
  _fhRadiant(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, D*0.030);  // the ring
    c.beginPath(); c.ellipse(0, 0, r*2.05, r*0.62, 0, 0, TAU); c.stroke();

    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);            // finials
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.16) * r * 0.94, Math.sin(a - 0.16) * r * 0.94);
      c.lineTo(Math.cos(a + 0.16) * r * 0.94, Math.sin(a + 0.16) * r * 0.94);
      c.lineTo(Math.cos(a) * r * 1.52,        Math.sin(a) * r * 1.52);
      c.closePath(); c.fill();
      c.fillStyle = p.glow;
      c.beginPath();
      c.arc(Math.cos(a) * r * 1.66, Math.sin(a) * r * 1.66, r * 0.16, 0, TAU);
      c.fill();
      c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);
    }
    SHAPES._fhBall(c, D, p);
    c.save();                                                     // pierced
    c.globalCompositeOperation = "destination-out";
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU + 0.5;
      c.beginPath();
      c.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.19, 0, TAU);
      c.fill();
    }
    c.restore();
    c.save();                                                     // light inside
    c.globalCompositeOperation = "lighter";
    c.fillStyle = p.glow; c.globalAlpha = 0.55;
    c.beginPath(); c.arc(0, 0, r*0.34, 0, TAU); c.fill();
    c.restore();
    c.restore();
  },

  /* ------------------------------------------------------------- DWARVEN --
     BUILT. THE CELL'S FLAIR: the head is two hemispheres BOLTED TOGETHER along
     a visible equatorial band, and the spikes are separate square studs screwed
     into it rather than forged out of it -- so the silhouette is stepped where
     every other flail's is smooth. */
  _fhBuilt(c, D, p, spin){
    const r = D * 0.34;
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);
    c.save();
    c.rotate(spin);
    c.fillStyle = iron; c.strokeStyle = dark;
    c.lineWidth = Math.max(1, D*0.018);
    for (let i = 0; i < 8; i++){                                  // studs
      const a = (i / 8) * TAU;
      c.save();
      c.translate(Math.cos(a) * r * 1.32, Math.sin(a) * r * 1.32);
      c.rotate(a);
      c.fillRect(-r*0.46, -r*0.30, r*0.92, r*0.60);
      c.strokeRect(-r*0.46, -r*0.30, r*0.92, r*0.60);
      c.fillStyle = dark;
      c.fillRect(r*0.20, -r*0.30, r*0.26, r*0.60);
      c.fillStyle = iron;
      c.restore();
    }
    SHAPES._fhBall(c, D, p);
    c.fillStyle = iron; c.strokeStyle = dark;                     // equator band
    c.fillRect(-r*1.02, -r*0.20, r*2.04, r*0.40);
    c.strokeRect(-r*1.02, -r*0.20, r*2.04, r*0.40);
    c.fillStyle = dark;
    for (const bx of [-0.66, -0.22, 0.22, 0.66]){
      c.beginPath(); c.arc(r*bx, 0, r*0.10, 0, TAU); c.fill();
    }
    c.restore();
  },

  /* --------------------------------------------------------------- VIGIL --
     PLATED. THE CELL'S FLAIR: six plates laid over the sphere like the gores
     of a helmet, each stepping proud of the last, so the ball reads as
     ARMOURED rather than spiked -- and the spikes shorten to studs, because a
     vigil weapon's argument is that it survives the exchange, not that it wins
     the exchange. */
  _fhPlated(c, D, p, spin){
    const r = D * 0.34;
    c.save();
    c.rotate(spin);
    c.fillStyle = SHAPES._shade(p.steel, 0.58, 0.42);             // short studs
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU + 0.5;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.20) * r * 0.94, Math.sin(a - 0.20) * r * 0.94);
      c.lineTo(Math.cos(a + 0.20) * r * 0.94, Math.sin(a + 0.20) * r * 0.94);
      c.lineTo(Math.cos(a) * r * 1.34,        Math.sin(a) * r * 1.34);
      c.closePath(); c.fill();
    }
    SHAPES._fhBall(c, D, p);
    for (let i = 0; i < 6; i++){                                   // the gores
      const a = (i / 6) * TAU;
      c.save();
      c.rotate(a);
      c.fillStyle = p.dark;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 1.06, -0.50, 0.02);
      c.closePath(); c.fill();
      c.fillStyle = p.core;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 0.94, -0.44, -0.04);
      c.closePath(); c.fill();
      c.fillStyle = p.glow;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, r * 0.94, -0.44, -0.36);
      c.closePath(); c.fill();
      c.restore();
    }
    c.fillStyle = p.dark;                                          // the boss
    c.beginPath(); c.arc(0, 0, r*0.30, 0, TAU); c.fill();
    c.fillStyle = p.glow;
    c.beginPath(); c.arc(0, 0, r*0.17, 0, TAU); c.fill();
    c.restore();
  },
};

/* ------------------------------------------------------------------ SFX --- */
/* Everything synthesised — no sample files. Impacts are a noise transient over
   a pitched body; clanks are deliberately inharmonic so metal reads as metal. */
class Sfx {
  constructor(){ this.ctx = null; this.on = true; this.ok = true; }

  /* bus -> compressor -> makeup -> destination.
     One builder so the live context and the offline render are provably the
     same signal chain; if they can differ, eventually they will. */
  static buildChain(ctx, destination){
    const C = CONFIG.audio.comp;
    const bus = ctx.createGain();
    bus.gain.value = 0.42;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = C.threshold;
    comp.ratio.value     = C.ratio;
    comp.attack.value    = C.attack;
    comp.release.value   = C.release;
    comp.knee.value      = 6;
    const makeup = ctx.createGain();
    makeup.gain.value = Math.pow(10, C.makeup / 20);
    bus.connect(comp); comp.connect(makeup); makeup.connect(destination);
    return bus;
  }

  resume(){
    if (!this.ok) return;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.ok = false; return; }
        this.ctx = new AC();
        /* CINEMA (demo). The whole mix now lands on the director's send --
           a lowpass, a convolution hall and a duck -- instead of straight on
           the destination. With CINE off the send is flat and inaudible. */
        this.bus = Sfx.buildChain(this.ctx, CineAudio.build(this.ctx));
        this.noise = this._noiseBuffer();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch(e){ this.ok = false; }
  }

  _noiseBuffer(){
    const n = this.ctx.sampleRate * 0.6;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  /* `dest` lets the bed route its parts through its own trim instead of
     straight to the bus. Everything else calls these unchanged. */
  _burst(t, {freq=1200, q=1.4, gain=0.4, dur=0.14, type="bandpass"}, dest){
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const flt = this.ctx.createBiquadFilter(); flt.type = type;
    flt.frequency.setValueAtTime(freq, t); flt.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(dest || this.bus);
    src.start(t); src.stop(t + dur + 0.02);
    return src;
  }

  _tone(t, {freq=180, to=null, gain=0.3, dur=0.2, type="sine"}, dest){
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.bus);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

  /* ------------------------------------------------------------- bed --- */
  /* One implementation, two destinations: the live context schedules it from
     `ctx.currentTime`, and the offline render schedules it from 0 through the
     same code. Everything is pre-scheduled automation rather than per-frame
     updates, which is what lets the offline path reuse it untouched.
     Caveat: because it is pre-scheduled against real time, the live bed
     assumes 1x playback. The speed control is a dev tool, not a viewer
     feature, so the drift is acceptable and deliberate.
     `stop()` on the returned handle kills it when a new match starts. */
  /* ---------------------------------------------------------- the score ---
     Was a drone. Rick's verdict on hearing it in context: "the background
     noise is still odd and unnatural" — a sustained cluster with no harmonic
     motion reads as equipment hum, not atmosphere, no matter how carefully it
     is voiced. So this is actual music: a four-chord minor loop with a pad, a
     plucked arpeggio, a bass pulse and a drum, all pre-scheduled so the live
     context and the offline render run the identical code.

     It does legibility work too. Each seal steps the level, adds a voice and
     pushes the tempo, so the three acts are audible before they are read. */
  bed(t0, dur, sealTimes){
    if (!this.ok || !this.ctx) return null;
    try {
      const A = CONFIG.audio, ctx = this.ctx;
      const seals = (sealTimes || []).filter(t => t > t0 && t < t0 + dur);
      const end = t0 + dur;

      const out = ctx.createGain();
      out.gain.value = A.gain;
      out.connect(this.bus);

      /* A minor: i - VI - III - VII. Semitones from the tonic, voiced so the
         bass walks and the upper tones stay inside a narrow band — a chord
         that leaps an octave between changes draws attention to itself, and
         this has to sit under a fight. */
      const CHORDS = [
        { bass:  0, tones: [ 0,  7, 12, 15] },   // Am
        { bass: -4, tones: [-4,  3,  8, 12] },   // F
        { bass: -9, tones: [ 3,  7, 10, 15] },   // C
        { bass: -2, tones: [-2,  5, 10, 14] },   // G
      ];
      const hz  = st => A.root * Math.pow(2, st / 12);
      const lvl = i => 1 + i * A.step;
      const sealsBefore = t => seals.filter(s => s <= t).length;

      const stops = [];
      const voice = (t, freq, gain, dur2, type, attack) => {
        if (t >= end || gain <= 0.0004) return;
        const o = ctx.createOscillator(); o.type = type;
        o.frequency.setValueAtTime(freq, t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(gain, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur2);
        o.connect(g); g.connect(out);
        o.start(t); o.stop(Math.min(end + 0.4, t + dur2 + 0.05));
        stops.push(o);
      };

      /* One shared lowpass on the pad so it sits behind the impacts rather
         than competing with them in the same band. */
      const padLP = ctx.createBiquadFilter();
      padLP.type = "lowpass"; padLP.frequency.value = 900; padLP.Q.value = 0.5;
      padLP.connect(out);
      const pad = (t, freq, gain, dur2) => {
        if (t >= end) return;
        for (const det of [0.997, 1.003]){
          const o = ctx.createOscillator(); o.type = "triangle";
          o.frequency.setValueAtTime(freq * det, t);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(gain, t + 0.55);
          g.gain.setValueAtTime(gain, t + dur2 * 0.72);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur2);
          o.connect(g); g.connect(padLP);
          o.start(t); o.stop(Math.min(end + 0.4, t + dur2 + 0.05));
          stops.push(o);
        }
      };

      /* Walk the whole match bar by bar. The tempo is read fresh at the top of
         each bar so a seal speeds up the music from the next bar rather than
         glitching mid-phrase. */
      let t = t0 + 0.35, bar = 0, guard = 0;
      while (t < end - 0.5 && guard++ < 220){
        const i     = sealsBefore(t);
        const beat  = 60 / (A.bpm * (1 + A.bpmStep * i));
        const barLen = beat * 4;
        const ch    = CHORDS[bar % CHORDS.length];
        const L     = lvl(i);

        /* Three voices, not four. A whole match schedules its music in one
           pass so the offline render can reuse the live code untouched, which
           means every node in every bar is alive in the graph from the bell —
           it was 1695 of them. Node count is a running cost, so the pad drops
           its top voice and the arpeggio thins; the chord is unchanged to the
           ear because the dropped tone is doubled an octave down. */
        for (const st of ch.tones.slice(0, 3)) pad(t, hz(st + 12), 0.032 * L, barLen * 1.02);
        voice(t, hz(ch.bass), 0.075 * L, beat * 1.7, "sine", 0.02);
        voice(t + beat * 2, hz(ch.bass), 0.055 * L, beat * 1.4, "sine", 0.02);

        /* Plucked arpeggio: eighth notes climbing the chord. This is the layer
           that makes it read as music rather than as a held pad. */
        for (let e = 0; e < 8; e++){
          if (e % 2 === 1 && i < 2) continue;        // sparser until the hall closes
          if (e === 5) continue;
          const st2 = ch.tones[(e + bar) % ch.tones.length] + (e >= 4 ? 24 : 12);
          voice(t + e * beat * 0.5, hz(st2), 0.027 * L, beat * 0.85, "triangle", 0.006);
        }
        /* A counter-line, held back until the hall starts closing. */
        if (i >= 2){
          voice(t + beat * 1.5, hz(ch.tones[2] + 24), 0.024 * L, beat * 1.2, "sine", 0.05);
          voice(t + beat * 3.5, hz(ch.tones[1] + 24), 0.022 * L, beat * 1.2, "sine", 0.05);
        }

        /* Drum. Low thump on the downbeat, and a second one from the first
           seal, so the pulse literally doubles as the fight escalates. */
        const thump = (tt, g, skin) => {
          this._tone(tt, { freq: 78, to: 34, gain: g * L, dur: 0.30, type:"sine" }, out);
          /* the noise skin is three nodes; only the downbeat gets one */
          if (skin) this._burst(tt, { freq: 160, q: 0.8, gain: g * 0.5 * L,
                                      dur: 0.14, type:"lowpass" }, out);
        };
        thump(t, 0.10, true);
        if (i >= 1) thump(t + beat * 2, 0.070, false);
        if (i >= 2) thump(t + beat * 3, 0.045, false);

        t += barLen; bar++;
      }

      /* Air. OFF by default (A.air = 0), and this is the interesting failure in
         the whole bed: a bandpass at 420 Hz with Q 0.6 is barely a filter at
         all, so the "hall floor" was broadband noise sitting right in the
         speech band. It measured beautifully — noise is the cheapest LUFS there
         is — and Rick's verdict on hearing it was that the game sounded like it
         was playing over a box fan. Which is the audio version of the first
         law: a layer that improves the number and degrades the experience is
         not a feature. */
      if (A.air > 0){
        const air = ctx.createBufferSource();
        air.buffer = this.noise; air.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = A.airCut; lp.Q.value = 0.7;
        const ag = ctx.createGain(); ag.gain.value = A.air;
        air.connect(lp); lp.connect(ag); ag.connect(out);
        air.start(t0); air.stop(end + 0.1);
        stops.push(air);
      }

      return { stop(){ for (const n of stops){ try { n.stop(); } catch(e){} }
                       try { out.disconnect(); } catch(e){} } };
    } catch(e){ return null; }
  }

  play(kind, p = {}){
    if (!this.on || !this.ok || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      if (kind === "hit"){
        const w = clamp((p.dmg || 10) / 45, 0.12, 1);          // 0..1 weight
        this._burst(t, { freq: 2600 - 1500*w, q: 1.1, gain: 0.16 + 0.20*w, dur: 0.06 + 0.06*w });
        this._tone (t, { freq: 190 - 90*w, to: 46, gain: 0.22 + 0.26*w, dur: 0.11 + 0.13*w, type:"sine" });
        if (p.crit) this._tone(t, { freq: 1500, to: 520, gain: 0.16, dur: 0.16, type:"triangle" });
      }
      else if (kind === "clank"){
        /* Inharmonic partials — the ratios are deliberately not integers. */
        const base = 480 + 520 * (1 - clamp((p.mass || 3) / 6, 0, 1));
        [1, 2.41, 3.83, 5.17, 7.02].forEach((r, i) => {
          this._tone(t + i * 0.0015, {
            freq: base * r, gain: 0.15 / (i + 1.1), dur: 0.42 - i * 0.05, type: "triangle",
          });
        });
        this._burst(t, { freq: 4200, q: 0.7, gain: 0.28, dur: 0.05, type:"highpass" });
        this._tone (t, { freq: 150, to: 55, gain: 0.24, dur: 0.14, type:"sine" });
      }
      /* One ultimate sound for six ultimates was the audio version of the
         caption problem: the picture said six different things and the ears
         heard the same thing every time. */
      else if (kind === "ult"){
        const w = p.w;
        if (w === "dawnbringer"){                       // a chord and a bell
          [0, 7, 12, 16].forEach((st, i) =>
            this._tone(t + i * 0.03, { freq: 220 * Math.pow(2, st/12), gain: 0.13,
                                       dur: 1.5, type:"triangle" }));
          this._burst(t + 0.14, { freq: 5200, q: 0.9, gain: 0.20, dur: 0.5, type:"highpass" });
        } else if (w === "widowmaker"){                 // a wet slice
          this._burst(t, { freq: 3400, q: 1.6, gain: 0.34, dur: 0.20 });
          this._tone (t, { freq: 900, to: 240, gain: 0.20, dur: 0.28, type:"sawtooth" });
          this._tone (t + 0.10, { freq: 620, to: 180, gain: 0.14, dur: 0.34, type:"sawtooth" });
        } else if (w === "grudgebearer"){               // the forge lights, the spin winds
          this._tone (t, { freq: 46, to: 138, gain: 0.50, dur: 1.5, type:"sine" });
          this._tone (t + 0.10, { freq: 170, to: 660, gain: 0.15, dur: 1.4, type:"sawtooth" });
          this._burst(t, { freq: 240, q: 0.6, gain: 0.30, dur: 1.5, type:"lowpass" });
          this._burst(t + 0.55, { freq: 900, q: 1.2, gain: 0.10, dur: 0.9, type:"lowpass" });
        } else if (w === "grudgebearer-hit"){           // the implosion pays out
          this._tone (t, { freq: 320, to: 24, gain: 0.60, dur: 0.9, type:"sine" });
          this._burst(t, { freq: 260, q: 0.5, gain: 0.50, dur: 0.8, type:"lowpass" });
          this._burst(t + 0.05, { freq: 2400, q: 1.0, gain: 0.16, dur: 0.3, type:"highpass" });
        } else if (w === "grudgebearer-fizzle"){        // the draught dies
          this._tone (t, { freq: 130, to: 40, gain: 0.22, dur: 0.7, type:"sine" });
          this._burst(t, { freq: 420, q: 0.8, gain: 0.12, dur: 0.6, type:"lowpass" });
        } else if (w === "slagheart"){                  // the head takes heat
          this._tone (t, { freq: 60, to: 190, gain: 0.42, dur: 1.3, type:"sine" });
          this._burst(t, { freq: 300, q: 0.6, gain: 0.26, dur: 1.4, type:"lowpass" });
          this._burst(t + 0.30, { freq: 5000, q: 0.9, gain: 0.09, dur: 0.9, type:"highpass" });
        } else if (w === "slagheart-latch"){             // the bite, and the whine
          this._burst(t, { freq: 1400, q: 2.2, gain: 0.40, dur: 0.16 });
          this._tone (t, { freq: 150, to: 62, gain: 0.44, dur: 0.30, type:"square" });
          this._tone (t + 0.06, { freq: 240, to: 1500, gain: 0.16, dur: 0.74, type:"sawtooth" });
          this._burst(t + 0.10, { freq: 2600, q: 1.4, gain: 0.10, dur: 0.70, type:"highpass" });
        } else if (w === "slagheart-blast"){             // it lets go
          this._tone (t, { freq: 260, to: 26, gain: 0.62, dur: 1.0, type:"sine" });
          this._burst(t, { freq: 200, q: 0.4, gain: 0.55, dur: 0.9, type:"lowpass" });
          this._burst(t + 0.02, { freq: 3800, q: 0.7, gain: 0.30, dur: 0.5, type:"highpass" });
          this._burst(t + 0.22, { freq: 6200, q: 1.1, gain: 0.12, dur: 0.8, type:"highpass" });
        } else if (w === "slagheart-fizzle"){            // it cools, unfired
          this._tone (t, { freq: 170, to: 52, gain: 0.20, dur: 0.7, type:"sine" });
          this._burst(t, { freq: 3000, q: 0.7, gain: 0.13, dur: 0.8, type:"highpass" });
        } else if (w === "emberedge"){                  // the shell splits open
          /* Dry, high, and SHORT — this is a tell, not an event. It has to
             leave room for the burst 0.55s later or the ear hears one long
             noise instead of a fuse and a bang. */
          this._burst(t, { freq: 2600, q: 1.8, gain: 0.20, dur: 0.10, type:"highpass" });
          this._tone (t, { freq: 90, to: 260, gain: 0.16, dur: 0.52, type:"sawtooth" });
          this._burst(t + 0.14, { freq: 1500, q: 2.4, gain: 0.09, dur: 0.34, type:"bandpass" });
        } else if (w === "emberedge-burst"){            // and it goes
          /* Scaled by stack count like everything else in this ultimate: a
             three-stack burst is a crack, a nine-stack burst is a shell going
             off. `n` arrives on the play options. */
          const n = Math.max(3, Math.min(9, p.n || 3)), g = 0.30 + n * 0.035;
          this._tone (t, { freq: 220 + n * 14, to: 30, gain: g, dur: 0.55 + n * 0.03, type:"sine" });
          this._burst(t, { freq: 300, q: 0.5, gain: g * 0.9, dur: 0.45, type:"lowpass" });
          this._burst(t + 0.02, { freq: 5200, q: 0.7, gain: 0.12 + n * 0.016, dur: 0.22, type:"highpass" });
          this._tone (t + 0.06, { freq: 620, to: 140, gain: 0.12, dur: 0.30, type:"sawtooth" });
        } else if (w === "lastlight-throw"){            // twelve blades leave
          /* Bright, short, and PLURAL — three staggered slices rather than one
             swell, because what the eye is about to see is a count. */
          this._burst(t,        { freq: 3400, q: 1.6, gain: 0.20, dur: 0.16, type:"highpass" });
          this._burst(t + 0.05, { freq: 4200, q: 1.6, gain: 0.15, dur: 0.14, type:"highpass" });
          this._burst(t + 0.10, { freq: 5000, q: 1.6, gain: 0.11, dur: 0.12, type:"highpass" });
          this._tone (t,        { freq: 300, to: 900, gain: 0.13, dur: 0.34, type:"triangle" });
        } else if (w === "lastlight-stick"){            // one buries itself
          /* Rises with the count, so the ear hears the fuse getting heavier
             without anything on screen having to say so. Deliberately quiet:
             this can fire six times in two seconds. */
          const n = Math.max(1, Math.min(6, p.n || 1));
          this._burst(t, { freq: 1800 + n * 260, q: 4.0, gain: 0.09, dur: 0.13, type:"bandpass" });
          this._tone (t, { freq: 520 + n * 70, to: 180, gain: 0.07, dur: 0.18, type:"sine" });
        } else if (w === "lastlight-bloom"){            // and they all go
          /* Scaled on the same n as every other channel of the burst: one
             blade is a chime, six is the roof coming off. */
          const n = Math.max(1, Math.min(8, p.n || 1)), g = 0.22 + n * 0.055;
          this._tone (t,        { freq: 180 + n * 20, to: 34, gain: g, dur: 0.55 + n * 0.04, type:"sine" });
          this._burst(t,        { freq: 260, q: 0.5, gain: g * 0.8, dur: 0.42, type:"lowpass" });
          this._burst(t + 0.01, { freq: 6200, q: 0.8, gain: 0.10 + n * 0.022, dur: 0.30, type:"highpass" });
          this._tone (t + 0.04, { freq: 1400, to: 620, gain: 0.10 + n * 0.012, dur: 0.42, type:"triangle" });
        } else if (w === "lastlight-cold"){             // nothing held
          this._tone (t, { freq: 420, to: 90, gain: 0.15, dur: 0.6, type:"sine" });
          this._burst(t, { freq: 2400, q: 0.8, gain: 0.07, dur: 0.5, type:"highpass" });
        } else if (w === "thornwake"){                  // creak and cinch
          this._burst(t, { freq: 700, q: 3.0, gain: 0.24, dur: 0.6 });
          this._tone (t, { freq: 150, to: 420, gain: 0.16, dur: 0.55, type:"triangle" });
          this._tone (t + 0.34, { freq: 300, to: 120, gain: 0.14, dur: 0.3, type:"square" });
        } else if (w === "twinshade"){                  // one becomes three
          /* THE ONLY ULTIMATE IN THE GAME WITH A WHOLE SECOND OF FROZEN HALL
             TO FILL, so it is the only one that can afford a sound in three
             movements — and it is built to the picture rather than under it:

               swell   0.00-0.45   the shell straining, pitch climbing
               pinch   0.44-0.62   the neck closing. Wet, and it FALLS, because
                                   a rising pinch reads as something opening
               chord   0.62-1.30   one voice arriving as three

             The chord is the whole ultimate stated in the one thing the ear
             does better than the eye. Three triangles a few cents apart beat
             against each other, which is what makes them read as COPIES rather
             than as a chord — an interval would be harmony, a detune is
             duplication. */
          this._tone (t,        { freq: 58,  to: 156, gain: 0.34, dur: 0.60, type:"sine" });
          this._burst(t,        { freq: 360, q: 0.7,  gain: 0.20, dur: 0.58, type:"lowpass" });
          this._burst(t + 0.44, { freq: 1900, q: 3.4, gain: 0.22, dur: 0.16, type:"bandpass" });
          this._tone (t + 0.46, { freq: 900, to: 210, gain: 0.15, dur: 0.20, type:"triangle" });
          [0, 0.028, 0.056].forEach((d, i) => {
            const det = 1 + i * 0.0075;
            this._tone(t + 0.62 + d, { freq: 196 * det, to: 392 * det,
                                       gain: 0.17, dur: 0.68, type:"triangle" });
          });
          this._burst(t + 0.62, { freq: 5200, q: 0.9, gain: 0.13, dur: 0.30, type:"highpass" });
        } else if (w === "twinshade-rejoin"){           // and three become one
          /* The reverse, and audibly so: the chord arrives FIRST and collapses
             into a single voice, the pitch falls where the split's rose, and
             there is no pinch because nothing is being torn — the last event
             is a soft landing rather than a snap. */
          [0, 0.024, 0.048].forEach((d, i) => {
            const det = 1 + i * 0.0075;
            this._tone(t + d, { freq: 330 * det, to: 196, gain: 0.13, dur: 0.42, type:"triangle" });
          });
          this._tone (t + 0.30, { freq: 150, to: 66, gain: 0.26, dur: 0.44, type:"sine" });
          this._burst(t + 0.30, { freq: 520, q: 0.6, gain: 0.16, dur: 0.40, type:"lowpass" });
          this._burst(t + 0.34, { freq: 3200, q: 1.1, gain: 0.07, dur: 0.22, type:"highpass" });
        } else if (w === "redflail"){                   // the mill takes hold
          /* BLOODMILL, in four voices. Rick: "something guttural and bloody".

             Guttural is not simply LOW -- a low sine is a heartbeat. What makes
             a sound guttural is BEATING: two detuned sawtooths a few hertz
             apart, whose difference frequency the ear hears as a growl rather
             than as two notes. The detune here is PROPORTIONAL, so the beat
             rate climbs with the pitch and the growl tightens into a whine as
             the head comes up to speed. That is the wind-up stated in the one
             dimension the ear reads better than the eye.

             Three stages rather than one long ramp, because `_tone`'s gain only
             ever DECAYS -- a swell has to be built out of overlapping events
             that each start louder than the last. Timed to `ult.ramp` (0.9s) so
             the sound and the picture arrive together rather than merely
             overlapping. */
          [[0.00, 46, 0.16], [0.30, 68, 0.22], [0.60, 96, 0.28]].forEach(
            ([d, f0, g0]) => {
              this._tone(t + d, { freq: f0,         to: f0 * 1.55, gain: g0,
                                  dur: 0.42, type:"sawtooth" });
              this._tone(t + d, { freq: f0 * 1.045, to: f0 * 1.62, gain: g0 * 0.85,
                                  dur: 0.42, type:"sawtooth" });
            });
          /* the wet under it. Noise through a low filter is breath and slop,
             and it is what stops the growl reading as an engine. */
          this._burst(t,        { freq: 260, q: 0.5, gain: 0.15, dur: 0.55, type:"lowpass" });
          this._burst(t + 0.48, { freq: 380, q: 0.6, gain: 0.17, dur: 0.50, type:"lowpass" });

        } else if (w === "redflail-release"){           // and it lets go
          /* The barbs tearing loose: a short wet snap high, a body under it,
             and no ring-out. This is the moment the sound stops climbing, and
             anything sustained here would blur into the mill that follows. */
          this._burst(t,        { freq: 1500, q: 2.2, gain: 0.26, dur: 0.11, type:"bandpass" });
          this._tone (t,        { freq: 150,  to: 42, gain: 0.30, dur: 0.26, type:"sawtooth" });
          this._burst(t + 0.03, { freq: 5200, q: 0.9, gain: 0.13, dur: 0.20, type:"highpass" });

        } else if (w === "redflail-mill"){              // it keeps turning
          /* Roughly four a second for five seconds, so it has to be QUIET and
             it must not be identical each time -- a repeated identical grain
             reads as a loop artefact inside about three repeats. `p.n` is the
             spike count, a real number out of the sim rather than a random one,
             so the variation is deterministic and a render is reproducible.
             `Math.random()` in a frame is a standing open decision in this
             project precisely because it blocks that.

             GAINS SET FROM THE RENDER, not from taste. At 0.085/0.075 the first
             cut normalised to the wind-up's peak and the mill was inaudible
             underneath it -- twenty-two events that may as well not have been
             written. 0.135/0.105 puts the rhythm where it can be heard without
             out-shouting the release it follows. */
          const k = (p.n || 0) % 5;
          this._burst(t, { freq: 300 + k * 46, q: 0.7, gain: 0.135,
                           dur: 0.11, type:"lowpass" });
          this._tone (t, { freq: 86 + k * 5,  to: 62, gain: 0.105,
                           dur: 0.12, type:"sawtooth" });

        } else if (w === "redflail-break"){             // the wind goes out
          /* The wind-up run backwards, and audibly so: the pitch FALLS where it
             rose, the beating slows instead of tightening, and it ends wet and
             short. A cast that died must not sound like a cast that landed
             quietly -- it should sound like something stopping. */
          this._tone (t,        { freq: 140, to: 38, gain: 0.26, dur: 0.40, type:"sawtooth" });
          this._tone (t,        { freq: 134, to: 36, gain: 0.20, dur: 0.40, type:"sawtooth" });
          this._burst(t,        { freq: 420, q: 0.5, gain: 0.16, dur: 0.36, type:"lowpass" });
          this._burst(t + 0.16, { freq: 180, q: 0.4, gain: 0.10, dur: 0.24, type:"lowpass" });

        } else if (w === "foregone"){                   // the coil charges
          /* THE CONVERSE, IN SIX VOICES, AND THE INSTRUMENT IS A TESLA COIL.

             Rick, on the first cut: "i cant tell if im hearing balls
             bouncing or lightning. im thinking long zapping sounds like a
             tesla coil." He is right and the diagnosis is DURATION. Those
             sounds were 18 to 140 milliseconds -- at that length anything is
             a click, and the hall is already full of clicks, so they read as
             the thing the ear already had a name for.

             A coil does not click. Its voice is the SPARK-GAP BREAK RATE: a
             harsh sustained buzz around 130 Hz with enormous harmonic
             content, which is a SAWTOOTH, plus the tear of the arc itself,
             which is sustained bandpass noise. Both have to last long enough
             to be heard as a tone rather than as an event -- 0.2s is the
             floor, and the long ones here run to half a second.

             `_tone`'s gain only ever DECAYS, so a SUSTAIN has to be built the
             way the spike storm builds a swell: overlapping events, each
             refreshing the envelope before the last has died. Three stages
             is what holds half a second flat.

             Deliberately NOT Bloodmill's instrument. That was two sawtooths
             a few hertz apart so the ear hears the BEAT as a growl; these are
             a fifth apart so they read as one harsh voice with no throb. */
          [[0.00, 116, 0.10], [0.16, 152, 0.13], [0.32, 208, 0.16]].forEach(
            ([d, f0, g0]) => {
              this._tone(t + d, { freq: f0, to: f0 * 1.5, gain: g0,
                                  dur: 0.24, type:"sawtooth" });
              this._tone(t + d, { freq: f0 * 1.5, to: f0 * 2.25, gain: g0 * 0.5,
                                  dur: 0.24, type:"sawtooth" });
            });
          [[0.00, 1500], [0.16, 2600], [0.32, 4200]].forEach(
            ([d, fq]) => this._burst(t + d, { freq: fq, q: 2.4, gain: 0.075,
                                              dur: 0.24, type:"bandpass" }));

        } else if (w === "foregone-orb"){               // one more is laid
          /* The trail COUNTS ITSELF -- `p.n` is the real sigil index, so the
             pitch climbs a step per orb and the ear hears the line getting
             longer without looking at it. Deterministic, so a render
             reproduces. SAWTOOTH now, not a triangle: the triangle was a
             xylophone, and a xylophone in a hall of bouncing balls is one
             more bounce. */
          const j = Math.min(11, (p.n || 1) - 1);
          const f0 = 150 * Math.pow(1.0595, j * 2);
          this._tone (t, { freq: f0, to: f0 * 0.86, gain: 0.060,
                           dur: 0.17, type:"sawtooth" });
          this._burst(t, { freq: 2600 + j * 180, q: 3.0, gain: 0.038,
                           dur: 0.15, type:"bandpass" });

        } else if (w === "foregone-arc"){               // the coil, running
          /* THE BED, AND IT IS THE SOUND OF THE WHOLE ULTIMATE.

             Fired on a 0.13s clock for as long as there is plasma on the
             floor, and every event is 0.20s long -- so they OVERLAP, and
             what the ear gets is not eight events a second, it is one
             continuous rasp that starts when the ultimate does and stops
             when the last wave dies. That overlap is the entire trick: the
             clock is faster than the decay.

             It has to be quiet, because it is running the whole time. The
             mill's lesson was that a rhythm nobody can hear may as well not
             exist; the opposite lesson is here, and it is that a bed loud
             enough to notice is a bed you cannot stop noticing. */
          const a = (p.n || 0) % 7;
          this._tone (t, { freq: 128 + a * 7, to: 116 + a * 5, gain: 0.042,
                           dur: 0.20, type:"sawtooth" });
          this._tone (t, { freq: 192 + a * 11, to: 174, gain: 0.024,
                           dur: 0.20, type:"sawtooth" });
          this._burst(t, { freq: 2900 + a * 360, q: 3.0, gain: 0.034,
                           dur: 0.20, type:"bandpass" });

        } else if (w === "foregone-tick"){              // a small wave lands
          /* A short zap, not a tick. Same instrument as the big one at a
             fifth of the length -- these fire a few times a second at their
             busiest and must not out-shout the bloom. */
          const k = (p.n || 0) % 5;
          this._burst(t,        { freq: 5200, q: 0.8, gain: 0.070, dur: 0.025, type:"highpass" });
          this._tone (t,        { freq: 158 + k * 11, to: 92, gain: 0.080,
                                  dur: 0.18, type:"sawtooth" });
          this._burst(t + 0.02, { freq: 2600 + k * 260, q: 2.6, gain: 0.055,
                                  dur: 0.16, type:"bandpass" });

        } else if (w === "foregone-reverse"){           // and it turns back
          /* THE ONE SOUND THAT HAS TO STATE THE MECHANIC. Everything in the
             laying phase RISES -- the charge, and twelve orbs stepping up a
             tone at a time. This falls, through the same interval, and it is
             the longest event this relic has: 0.6s of tearing arc, built in
             four overlapping stages so the envelope never sags.

             The sound of the ultimate is the sound of that climb played
             backwards, which is what the ultimate is. */
          this._burst(t, { freq: 7000, q: 0.7, gain: 0.20, dur: 0.045, type:"highpass" });
          [[0.00, 420, 0.20], [0.15, 300, 0.18], [0.30, 208, 0.16], [0.45, 146, 0.13]]
            .forEach(([d, f0, g0]) => {
              this._tone(t + d, { freq: f0, to: f0 * 0.62, gain: g0,
                                  dur: 0.26, type:"sawtooth" });
              this._tone(t + d, { freq: f0 * 1.5, to: f0 * 0.93, gain: g0 * 0.45,
                                  dur: 0.26, type:"sawtooth" });
            });
          [[0.02, 4600], [0.17, 3000], [0.32, 1900], [0.47, 1100]].forEach(
            ([d, fq]) => this._burst(t + d, { freq: fq, q: 2.0, gain: 0.10,
                                              dur: 0.24, type:"bandpass" }));

        } else if (w === "foregone-bloom"){             // a big wave lands
          /* THE LONG ZAP. Only a CONNECTING wave makes this -- measured, a
             cast lands one or two of its twelve blooms -- so unlike the mill
             this can afford to be half a second long and to be the loudest
             thing the relic does.

             Four parts and they are what an arc strike is made of: the
             STRIKE (broadband, 35ms, no ring-out), the BUZZ (a sawtooth pair
             a fifth apart, refreshed three times so it holds), the TEAR
             (sustained bandpass walking down the spectrum), and the BODY --
             a low sine under all of it, which is the weight the knockback
             gives the eye, stated in the dimension the ear reads faster. */
          const k = (p.n || 0) % 5;
          this._burst(t, { freq: 6500, q: 0.7, gain: 0.17, dur: 0.035, type:"highpass" });
          [[0.00, 172, 0.17], [0.13, 150, 0.14], [0.26, 128, 0.10]].forEach(
            ([d, f0, g0]) => {
              this._tone(t + d, { freq: f0 + k * 6, to: (f0 + k * 6) * 0.72,
                                  gain: g0, dur: 0.24, type:"sawtooth" });
              this._tone(t + d, { freq: (f0 + k * 6) * 1.5, to: (f0 + k * 6) * 1.08,
                                  gain: g0 * 0.45, dur: 0.24, type:"sawtooth" });
            });
          [[0.00, 3400], [0.14, 2400], [0.28, 1500]].forEach(
            ([d, fq]) => this._burst(t + d, { freq: fq + k * 180, q: 2.2,
                                              gain: 0.10, dur: 0.24, type:"bandpass" }));
          this._tone(t, { freq: 92, to: 44, gain: 0.13, dur: 0.30, type:"sine" });

        } else if (w === "gravemourn"){                 // a drop into the grave
          this._tone (t, { freq: 420, to: 44, gain: 0.30, dur: 1.1, type:"sawtooth" });
          this._tone (t + 0.05, { freq: 300, to: 38, gain: 0.18, dur: 1.0, type:"sine" });
          this._burst(t, { freq: 420, q: 0.6, gain: 0.16, dur: 0.9, type:"lowpass" });
        } else {                                        // rune-crack
          this._burst(t, { freq: 6000, q: 0.8, gain: 0.34, dur: 0.10, type:"highpass" });
          this._tone (t, { freq: 1800, to: 300, gain: 0.22, dur: 0.30, type:"square" });
          [1, 2.73, 4.41].forEach((r, i) =>
            this._tone(t + 0.16 + i * 0.02, { freq: 380 * r, gain: 0.10, dur: 0.5, type:"triangle" }));

      }
      else if (kind === "seal"){
        [0, 0.09, 0.18].forEach((d, i) =>
          this._tone(t + d, { freq: 220 * Math.pow(1.5, i), gain: 0.14, dur: 0.9, type:"triangle" }));
      }
      else if (kind === "death"){
        this._tone (t, { freq: 120, to: 32, gain: 0.5, dur: 1.1, type:"sine" });
        this._burst(t, { freq: 700, q: 0.5, gain: 0.34, dur: 0.6, type:"lowpass" });
      }
      else if (kind === "loose"){
        /* Woody body, no top end. It sits UNDER the impacts rather than
           competing with them, so a shot landing still reads louder than
           a shot leaving. */
        this._burst(t, { freq: 380, q: 1.1, gain: 0.055, dur: 0.055, type:"bandpass" });
      }
      else if (kind === "spark"){
        /* frequent by design, so quiet by design: the collect chime climbs
           with the stack it just banked, the burn is a short sizzle */
        if (p && p.arm){
          this._tone (t, { freq: 1560, gain: 0.045, dur: 0.14, type:"triangle" });
        } else if (p && p.collect){
          this._tone (t, { freq: 1180 + (p.n || 0) * 110, gain: 0.05, dur: 0.20, type:"triangle" });
        } else {
          this._burst(t, { freq: 4200, q: 1.4, gain: 0.07, dur: 0.06, type:"highpass" });
          this._tone (t, { freq: 520, to: 180, gain: 0.05, dur: 0.10, type:"sine" });
        }
      }
      else if (kind === "wall"){
        this._burst(t, { freq: 3000, q: 2.0, gain: 0.045, dur: 0.035, type:"highpass" });
      }

}

/* ----------------------------------------------------------------- FIGHTER */
class Fighter {
  constructor(weapon, side, rng){
    if (!weapon) throw new Error("Fighter requires a weapon definition");
    this.w    = weapon;
    this.aff  = AFFINITIES[weapon.aff];
    this.side = side;
    this.maxHp = CONFIG.combat.baseHP;
    this.hp    = this.maxHp;

    const ang = (side === 0 ? -Math.PI/4 : Math.PI*0.75)
              + (rng() - 0.5) * CONFIG.chaos.spawnSpread;
    this.vx = Math.cos(ang) * CONFIG.physics.cruise;
    this.vy = Math.sin(ang) * CONFIG.physics.cruise;
    this.speed = CONFIG.physics.cruise;

    this.theta      = rng() * TAU;
    this.spinDir    = side === 0 ? 1 : -1;
    this.swingPhase = rng() * TAU;
    this.headSpin   = 0;

    this.charge = 0;
    this.stun   = 0;          // weapon locked (hitstun, hex, freeze)
    this.stunDR = 0;          // diminishing returns accumulator
    this.status = {};
    this.hexClock = 0;
    this.hitCd = [];
    this.hits = 0; this.dealt = 0; this.crits = 0; this.ultsFired = 0; this.clanks = 0;
    this.flash = 0;
    this.mend  = 0;           // presentation only: the shell knitting back up
    this.shield    = 0;       // VIGIL: absorbed before health
    this.shieldMax = 0;       // high-water mark, so the shatter scales to
                              // what was banked rather than what is left
    this.shatterFx = 0;       // presentation only
    this.wardFade  = 0;       // presentation only: expired, did not break
    /* THE LIQUID'S STATE. Ten numbers, plus the bookkeeping the integrator
       needs, and NOTHING in the simulation reads any of them -- move,
       tickClank, damage and checkEnd never touch a field on this block.
       engine_ab.py over all eighteen relics is what proves that rather than
       this comment.

       Declared here rather than lazily on first tick because it is 40% of the
       whole simulation's runtime. Adding them on the fly changed every
       Fighter's hidden class AFTER move() and tickClank() had specialised on
       the original shape; a 612-match sweep went 17.7s to 24.8s and stubbing
       the integrator recovered all of it. A headless sweep draws nothing and
       should not pay for a picture. */
    this.slTilt  = 0; this.slTiltV  = 0;   // surface pivot, radians
    this.slHeave = 0; this.slHeaveV = 0;   // level offset, radius units
    this.slA2    = 0; this.slA2V    = 0;   // symmetric ripple
    this.slA3    = 0; this.slA3V    = 0;   // second ripple
    this.slVx = this.vx; this.slVy = this.vy;   // last tick's velocity
    this.slPx = 0; this.slPy = 0;               // last tick's position
    this.slJolt = 0;      // 0..1, decaying: drives the film and the spray
    this.slDrip = 0;      // leak phase accumulator; no rng anywhere near it
    this.slM = null;      // this school's spring constants, resolved once
    this.trail = [];
    this.tips  = weapon.blades.map(() => []);   // per-blade tip history
    /* RANGED. Seeded to the cadence rather than to 0 so the two relics in a
       mirror do not fire in lockstep on frame one, and seeded WITHOUT rng so
       adding a ranged relic cannot perturb the draw order of any match that
       does not contain one. side 0 fires immediately, side 1 half a beat
       later. */
    this.fireCd = weapon.shot ? weapon.shot.cadence * side * 0.5 : 0;
    this.shotsFired = 0;
    this.drawK  = 0;          // presentation only: 0..1, the string coming back
    this.ultDraw = null;      // {t, dur} while an aimed shot is being drawn
    this.ultForge = null;     // {t, minT, cap} while the Crucible is lit
    this.ultHeat = null;      // {t, window} while Ironbloom's head is lit
    this.ultRadiant = null;   // {t, dur} while Daybreak burns
    this.ultSlag = null;      // {t, fuse, split} while a Slagburst fuse burns
    this.ultHarrow = null;    // {t, fuse} while the Harrowing's blades count down
    /* THE THREEFOLD. `ultSplit` is on the CASTER and nowhere else; the shades
       themselves carry `shade` and never carry this. */
    this.ultSplit = null;
    /* {phase,t,stun,acc,n,peak} while the head winds up and then sprays.
       null on every other relic, which is the whole zero-burden argument. */
    this.ultSpin = null;     // {t, dur} while the shades walk
    /* {phase,t,orbs,i,since,lx,ly,sp0} while the Converse lays its trail and
       then reverses through it. null on every other relic, which is the whole
       zero-burden argument -- and unlike the spike storm there is no second
       edit anywhere in the tick, so the guard in tickRetrace is the only
       cost this relic imposes on a match it is not in. */
    this.ultTrace = null;
    /* A TIMED share of damage returned as hp. `resolveHit` already implements
       lifesteal and already draws it (the shell knits, a green +N floats) —
       it just reads it off the WEAPON, and a weapon object is shared by every
       match in a sweep, so a timed state cannot live there. The read is
       `self.lifesteal || self.w.lifesteal`, which at 0 and undefined is
       exactly the expression that was there before. */
    this.lifesteal = 0;
    /* Set on a COPY and on nothing else: {owner}. A shade is never a fighter
       of record — never this.a, never this.b, never in `summary()`, never on
       the HUD, never a killFlight target. Reading `f.shade` is how every
       branch in this build asks "is this a real relic or a copy of one". */
    this.shade = null;
    /* Rick's call, and the only one of the four that is load-bearing for
       termination rather than for feel: a copy that "fights the same as the
       original" would charge and cast, and two copies each making two more is
       exponential. Shades are never passed to tickCharge at all, so this is
       belt AND braces — twinshade_probe asserts a shade's charge stays 0. */
    this.noUlt = false;
    this.born = 1;            // presentation only: 0..1 fade-in on a new shade
    /* HOW RECENTLY THIS BALL WAS FED ON. Presentation only, 0..1, set to 1 by
       `drain()` and decayed in tickPresentation. It exists because the motes
       alone are not enough: MEASURED, only 35% of a running ultimate's frames
       had one on screen even after the bursts were lengthened, because hits are
       sparse — three balls at 0.27 hits/s land one about every 1.2 seconds and
       a burst is gone in under one. This decays over ~1.6s, so it bridges the
       gaps between bursts and the tether it drives is lit for most of the
       window without ever being lit when nothing has happened. */
    this.drained = 0;
    /* THE BURDEN — what is stuck in THIS ball and what it costs. Zero on every
       fighter in every match that does not contain Lastlight, and BOTH sites
       that read it are exact identities at zero: `(1+e) - 0*0` in moveMul and
       `mass + 0*0` in move(). That is the whole argument that an eighteenth
       relic did not re-tune the other seventeen, and engine_ab.py is what
       proves it rather than this comment. */
    this.stuck = [];          // [{ang, own, tilt, r}] blades buried in the shell
    this.burden = 0;          // how many
    this.burdenMove = 0;      // move penalty per blade, copied from the caster
    this.burdenMass = 0;      // added FALL mass per blade. Never clank mass.
    this.burdenK = 0;         // presentation only: the caster's fuse, 0..1
    this.launch = 0;          // seconds of raised speed ceiling after its strike
    this.spendFx = 0;         // presentation only: the ward, leaving forward
    this.spendA  = 0;         // the direction it left in
  }

  get alive(){ return this.hp > 0; }
  get desperate(){ return this.alive && this.hp / this.maxHp <= CONFIG.desperation.at; }
  stacks(key){ return this.status[key] ? this.status[key].stacks : 0; }

  apply(key, n){
    const def = STATUS[key];
    if (!def) return;
    const cur = this.status[key] || { stacks:0, t:0 };
    cur.stacks = Math.min(def.maxStacks, cur.stacks + n);
    cur.t = def.dur;
    this.status[key] = cur;
    if (key === "curse") this.maxHp = Math.max(60, this.maxHp - def.maxHpLoss * n);
  }

  /* Hitstun with diminishing returns, so a fast relic cannot lock a slow one
     out of the match entirely. Each application makes the next one shorter. */
  takeHitstun(dmg){
    const I = CONFIG.impact;
    const raw = Math.min(I.stunMax, I.stunBase + dmg * I.stunPerDmg);
    const dur = raw / (1 + I.stunDR * this.stunDR);
    this.stunDR += 1;
    this.stun = Math.max(this.stun, dur);
    return dur;
  }

  spinMul(actSpin){
    let m = actSpin * (1 + STATUS.entangle.spin * this.stacks("entangle"));
    if (this.desperate) m *= CONFIG.desperation.spin;
    return Math.max(0.15, m);
  }
  /* THE BURDEN IS SUBTRACTED HERE RATHER THAN ROUTED THROUGH A STATUS.
     "Weighing it down and impeding its movement" is Entangle's effect, and
     Entangle belongs to VERDANT — a relic that wants a status its school does
     not have is either in the wrong school or the taxonomy is wrong
     (roster-expansion §5.8). Lastlight is sanctified, so what it does is nail
     four inches of blade into you, and that is mass and drag, not a spell.

     Strictly better than a status would have been, for three reasons that are
     not aesthetic: it is COUNTABLE on screen (the blades are drawn where they
     went in), it stacks past any maxStacks, and nothing that clears statuses
     can clear it. Same 0.45 floor as before, so the two cannot combine into a
     ball that has stopped. */
  moveMul(){
    return Math.max(0.45, 1 + STATUS.entangle.move * this.stacks("entangle")
                            - this.burden * this.burdenMove);
  }
  dmgTakenMul(){ return 1 + STATUS.sunder.taken * this.stacks("sunder"); }
  dmgMul(actDmg){ return actDmg * (this.desperate ? CONFIG.desperation.dmg : 1); }
}

/* ------------------------------------------------------------------- MATCH */
class Match {
  constructor(idA, idB, seed){
    if (idA === idB) throw new Error("A relic cannot fight itself");
    this.seed = seed >>> 0;
    this.rng  = makeRng(this.seed);
    const wa = WEAPON_BY_ID[idA], wb = WEAPON_BY_ID[idB];
    if (!wa || !wb) throw new Error("Unknown relic id");
    this.a = new Fighter(wa, 0, this.rng);
    this.b = new Fighter(wb, 1, this.rng);

    const A = CONFIG.arena;
    this.a.x = A.w * 0.28;  this.a.y = A.h * 0.22;
    this.b.x = A.w * 0.72;  this.b.y = A.h * 0.78;
    for (const f of [this.a, this.b]) this._initChain(f);

    /* THE SHADES — live copies, and THE WHOLE BIT-IDENTITY ARGUMENT.

       Empty in every match that does not contain this relic, and empty in one
       that does until the ultimate fires. Every loop this build adds runs over
       this list, so in all of those matches every added loop runs zero times.
       That is why nineteen relics do not re-tune the other eighteen.

       engine_ab.py is what proves it. This comment is not. */
    this.shades = [];
    /* THE SPLIT HOLD — the hall stopped while one ball becomes three. Same
       machinery as Ironbloom's latch: a branch in step() takes over entirely,
       nothing in the simulation advances, and `this.t` runs with it so match
       duration stays honest. Null in every match that does not contain this
       relic. */
    this.splitHold = null;
    /* THE DRAIN — presentation only, and the reason it is a LIST of motes
       rather than a flag on the fighter is that lifesteal has to look like
       something being TAKEN. Each mote is a piece of the foe's own life in the
       foe's own colour, travelling to whoever tore it off. Empty in every
       match without this relic; `tickPresentation` and `drawDrains` both cost
       one length check when it is. */
    this.drains = [];
    this.latch = null;        // {src,tgt,t,dur} while Ironbloom holds
    this.shotHits = 0;        // measurement only: how many landed

    this.hitStop = 0;
    /* CINEMA (demo). Presentation only, in the same family as `events` and
       `tags`: a list of dramatic instants for the director to read. Nothing in
       the simulation reads it, and because a headless prescan runs the same
       code it produces the same list -- which is what lets the director see
       the whole fight before the first frame is drawn. */
    this.beats = [];
    this.finisher = 0;
    /* A HEADLESS SWEEP DOES NOT INTEGRATE A PICTURE.

       `simulate()` builds a Match, steps it to the end and reads `summary()`.
       It never draws, and verify.py and tune.py call it thousands of times.
       Measured on a 612-match sweep: with the liquid integrating, 17.5s ->
       24.9s, and stubbing the integrator recovered every bit of it. 215 ns a
       call in isolation does not explain 6.4 s across the sweep -- the cost
       is the extra work on the hot tick, not the arithmetic in it -- but the
       fix is the same either way and it is not a micro-optimisation: a
       balance run should never pay for a visual feature.

       Default TRUE, so anything that constructs a Match and draws it gets the
       liquid without asking: the live page, render.py, every shot tool. Only
       `simulate()` turns it off, at the one line that is by definition
       headless. Nothing observable changes -- no simulation code reads a
       slosh field, which engine_ab.py proves over all eighteen relics. */
    this.slLive = true;
    this.deathAge = 0;        // presentation only: drives the shatter
    this.ultFx    = null;     // presentation only: drives the ultimate set-piece
    this.killFlight = null;   // a slain ball still has a wall to meet
    this.wallCrack = null;    // presentation only: where it shattered
    this.sparks = [];         // Daybreak's drift: SIM objects, they burn and they feed
    this.clankCd = 0;
    this.clankCount = 0;
    this.clankStreak = 0;

    this.fx = []; this.rings = []; this.floats = []; this.tags = [];
    this.shake = 0; this.banner = null; this.events = [];
    /* Off by default so every headless sweep is unaffected. Presentation
       layers (the live shell, render.py) opt in. */
    this.introT = 0;
    /* Presentation clocks. Like introT in that simulate() never arms them --
       `scrunchAuto` is set by __inject and newMatch, which only presentation
       and capture layers call -- and UNLIKE introT in that step() has no early
       return for them. The hall makes room; it does not stop. */
    this.scrunchT = 0; this.scrunchMode = null; this.scrunchAuto = false;
