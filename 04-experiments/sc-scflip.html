     every size is divided back out. Otherwise a damage number is 70px tall. */
  drawFloats(m){
    const c = this.ctx, k = 1 / this.scale;
    c.save();
    c.textAlign = "center";
    for (const f of m.floats){
      c.globalAlpha = clamp(f.life, 0, 1);
      c.font = `800 ${f.size * k}px ui-sans-serif,system-ui,sans-serif`;
      c.lineWidth = 7 * k; c.strokeStyle = "#000000BB";
      c.strokeText(f.text, f.x, f.y);
      c.fillStyle = f.c; c.fillText(f.text, f.x, f.y);
    }
    c.restore();
  }

  /* Status tags, at the point of contact.

     Both of these live in arena space so they land exactly where the weapon
     met the shell, but every size below is a DEVICE pixel multiplied by k, so
     the text does not grow with the hall the way the geometry does. */
  drawTags(m){
    if (!m.tags.length) return;
    const c = this.ctx, k = 1 / this.scale, A = CONFIG.arena;
    c.save();
    for (const g of m.tags){
      const age = g.max - g.life;
      if (g.first) this._tagFirst(c, g, age, k, A);
      else         this._tagQuick(c, g, age, k, A);
    }
    c.restore();
  }

  /* Every application after the first: the name, and nothing else. */
  _tagQuick(c, g, age, k, A){
    const pop  = age < 0.09 ? 0.5 + 0.5 * (age / 0.09)
                            : 1 + 0.07 * Math.exp(-(age - 0.09) * 11);
    const fade = clamp(g.life / 0.32, 0, 1);
    /* DOWNWARD, not up. The damage number spawns at this same point and
       rises, so a status tag that also rises lands on top of it and neither is
       readable — which was true of the first version of this. The number goes
       up, the name goes down, and both stay at the contact point. */
    const rise = (34 + 46 * (1 - Math.exp(-age * 4.6)) + g.off * 0.5) * k;
    const label = g.name.toUpperCase();
    const x = clamp(g.x, 110 * k, A.w - 110 * k), y = g.y + rise;
    c.save();
    c.textAlign = "center";
    c.globalAlpha = clamp(fade, 0, 1);
    c.font = `800 ${28 * pop * k}px ui-sans-serif,system-ui,sans-serif`;
    c.lineWidth = 7 * k; c.strokeStyle = "#000000D0";
    c.strokeText(label, x, y);
    c.fillStyle = g.c;
    c.fillText(label, x, y);
    /* The rule under the word is what survives the thumbnail. At phone scale
       28px of tracking-tight caps is a smudge; a bar of the school's colour
       is still a bar, and it is the colour that names the status. */
    const w = c.measureText(label).width;
    c.fillRect(x - w / 2, y + 6 * k, w, 3.4 * k);
    c.restore();
  }

  /* The first time this status has ever landed in this match: the name plus
     the one line, at the contact point, held long enough to be read. */
  _tagFirst(c, g, age, k, A){
    const inK  = clamp(age / 0.15, 0, 1);
    const pop  = 0.74 + 0.26 * (1 - Math.pow(1 - inK, 3));
    const fade = clamp(g.life / 0.45, 0, 1) * inK;
    const w = 596 * k, h = 92 * k;
    const x = clamp(g.x - w / 2, 6, A.w - w - 6);
    let   y = g.low ? A.h - h - 30 : g.y - (150 + g.off) * k;
    if (y < 6) y = g.y + 74 * k;                    // struck near the ceiling
    y = clamp(y, 6, A.h - h - 6);
    c.save();
    c.globalAlpha = clamp(fade, 0, 1);
    c.translate(x + w / 2, y + h / 2); c.scale(pop, pop);
    c.translate(-(x + w / 2), -(y + h / 2));
    c.fillStyle = "#0B0812F2";
    this.roundRect(x, y, w, h, 9 * k); c.fill();
    c.strokeStyle = g.c + "AA"; c.lineWidth = 2 * k;
    this.roundRect(x, y, w, h, 9 * k); c.stroke();
    c.fillStyle = g.c;
    this.roundRect(x, y, 8 * k, h, 4 * k); c.fill();
    c.textAlign = "left";
    c.font = `800 ${28 * k}px ui-sans-serif,system-ui,sans-serif`;
    c.fillStyle = g.c;
    c.fillText(g.name.toUpperCase(), x + 30 * k, y + 39 * k);
    c.font = `500 ${25 * k}px ui-sans-serif,system-ui,sans-serif`;
    c.fillStyle = "#C6BBA9";
    c.fillText(g.tip, x + 30 * k, y + 73 * k);
    c.restore();
  }

  /* --------------------------------------------------------------- hud --- */
  drawHud(m){
    this.drawBar(m, m.a, 14);
    this.drawBar(m, m.b, 86);
  }

  /* No health bar. Health is on the relic. What is left here is the identity
     and the two things that would be illegible on a ball moving at 2500px/s:
     the ultimate charge, and the named status chips. */
  drawBar(m, f, y){
    const c = this.ctx;
    const pad = 34;
    const cf = clamp(f.charge / f.w.ult.charge, 0, 1);
    const hot = cf > 0.85;

    /* A colour swatch, so the name binds to the ball without reading a word. */
    c.save();
    c.fillStyle = f.aff.core;
    c.shadowColor = f.aff.core; c.shadowBlur = 16;
    c.beginPath(); c.arc(pad + 11, y + 26, 11, 0, TAU); c.fill();
    c.restore();

    c.save();
    c.font = "700 38px ui-serif,Georgia,serif";
    c.fillStyle = "#EDE3D0"; c.textAlign = "left";
    c.fillText(f.w.name.toUpperCase(), pad + 32, y + 38);
    c.font = "700 17px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#6E6378";
    c.fillText(f.aff.name.toUpperCase(), pad + 34, y + 62);
    c.restore();

    /* ult charge, right-aligned */
    const cw = 300, cx = this.W - pad - cw;
    c.save();
    c.textAlign = "right";
    c.font = "700 18px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = hot ? "#FFF4D0" : "#6E6378";
    c.fillText(f.w.ult.name.toUpperCase() + (hot ? "  READY" : ""), this.W - pad, y + 26);
    c.fillStyle = "#191424";
    this.roundRect(cx, y + 36, cw, 9, 4); c.fill();
    c.fillStyle = hot ? "#FFF4D0" : f.aff.glow;
    if (hot){ c.shadowColor = "#FFF4D0"; c.shadowBlur = 14; }
    this.roundRect(cx, y + 36, cw * cf, 9, 4); c.fill();
    c.restore();

    /* The named status chips used to live here.

       They existed because a status was illegible on a ball moving at
       2500px/s — which was true when the ball said nothing. Now every status
       animates on the thing it is happening to, and a text chip 1600px away
       from the fight is the health bar all over again: accurate, well drawn,
       and nowhere near where anyone is looking. Removed, and the HUD band
       shrank with it. */
  }

  drawClock(m){
    const c = this.ctx;
    c.save();
    c.textAlign = "center";
    c.fillStyle = "#FFF4D02E";
    c.font = "700 48px ui-monospace,monospace";
    c.fillText(m.t.toFixed(1), this.W/2, this.arenaTop + 66);
    if (m.act > 0){
      c.fillStyle = m.act === 1 ? "#C9A22766" : "#E0433F88";
      c.font = "700 20px ui-sans-serif,system-ui,sans-serif";
      c.fillText(CONFIG.acts[m.act].name, this.W/2, this.arenaTop + 96);
    }
    if (m.clankCount > 0){
      c.fillStyle = "#FFF4D024";
      c.font = "700 18px ui-sans-serif,system-ui,sans-serif";
      c.fillText(m.clankCount + " CLANK" + (m.clankCount === 1 ? "" : "S"),
                 this.W/2, this.arenaTop + this.ah - 26);
    }
    c.restore();
  }

  /* Seals only. A seal is a clock event with no place in the hall, so it keeps
     the band near the top. The ultimate's name is drawn inside the arena
     transform instead — see drawUltName. */
  drawBanner(m){
    if (m.banner && !m.banner.w) this._bannerPlain(m.banner, this.arenaTop + this.ah * 0.135);
  }

  /* Letters laid out by hand so each one can be moved independently. The names
     are at most thirteen characters, so this is thirteen fillTexts — cheaper
     than the shadow it is drawn with. `fn` returns per-letter offsets. */
  _letters(c, text, cx, cy, size, track, fn){
    c.font = `700 ${size}px ui-serif,Georgia,serif`;
    const ws = [];
    let total = -track;
    for (const ch of text){ const w = c.measureText(ch).width; ws.push(w); total += w + track; }
    let x = cx - total / 2;
    for (let i = 0; i < text.length; i++){
      const o = fn ? fn(i, text.length) : null;
      const lx = x + ws[i] / 2;
      c.save();
      if (o){
        c.translate(lx + (o.dx || 0), cy + (o.dy || 0));
        if (o.rot) c.rotate(o.rot);
        if (o.s) c.scale(o.s, o.s);
        c.translate(-lx, -cy);
        if (o.a != null) c.globalAlpha *= clamp(o.a, 0, 1);
      }
      if (c.lineWidth > 0) c.strokeText(text[i], lx, cy);
      c.fillText(text[i], lx, cy);
      c.restore();
      x += ws[i] + track;
    }
  }

  /* A seal is a clock event, not a relic. It keeps the plain treatment. */
  _bannerPlain(b, y){
    const c = this.ctx;
    c.save();
    c.globalAlpha = clamp(b.life / 0.6, 0, 1);
    c.textAlign = "center";
    c.font = "700 46px ui-serif,Georgia,serif";
    c.lineWidth = 10; c.strokeStyle = "#000000CC";
    c.strokeText(b.text, this.W/2, y);
    c.fillStyle = b.color || "#C9A227";
    c.shadowColor = b.color || "#C9A227"; c.shadowBlur = 30;
    c.fillText(b.text, this.W/2, y);
    if (b.sub){
      c.shadowBlur = 0;
      c.font = "700 27px ui-sans-serif,system-ui,sans-serif";
      c.lineWidth = 8;
      c.strokeText(b.sub, this.W/2, y + 40);
      c.fillStyle = "#EDE3D0";
      c.fillText(b.sub, this.W/2, y + 40);
    }
    c.restore();
  }

  /* The ultimate's name, at its own set-piece.

     v5 moved this out of the middle of the hall because a 60px caption sat
     directly on top of the ultimate it had stopped needing to explain. Rick
     asked for it back at the point of contact, and the reason it left is still
     real — so it comes back under three conditions that the v5 version did not
     have:

       1. It is drawn BENEATH drawUltOver. The light, the blades, the vines and
          the bolts all paint over it, so as the set-piece blooms it eclipses
          its own name. The name announces; the doing takes over. It can never
          occlude the effect, because the effect is always on top of it.
       2. It sits above the anchor, clear of the densest part of the bloom, and
          is clamped inside the hall.
       3. The huge phase still lands during the wind-up, before there is
          anything to cover.

     Everything here is in ARENA units; every design pixel is multiplied by k. */
  drawUltName(m){
    const b = m.banner;
    if (!b || !b.w) return;
    const c = this.ctx, k = 1 / this.scale, A = CONFIG.arena;
    const max = b.max || 2.1;
    const age = max - b.life;
    const ease = t => 1 - Math.pow(1 - t, 3);
    const inK  = clamp(age / 0.14, 0, 1);
    const setK = clamp((age - 0.38) / 0.24, 0, 1);
    const out  = clamp((0.44 - b.life) / 0.44, 0, 1);
    const col  = b.color || "#C9A227";
    const glow = b.glow || col;
    const H = shellHash;

    c.save();
    c.textAlign = "center";
    c.font = `700 ${46 * k}px ui-serif,Georgia,serif`;
    const w46 = c.measureText(b.text).width;              // arena units
    let scale = lerp(lerp(2.5, 1.95, ease(inK)), 1.0, ease(setK));
    scale = Math.min(scale, (A.w - 26) / Math.max(1, w46));
    const size = 46 * scale * k;
    const track = (scale - 1) * 5 * k;

    /* The clamp has to know how far the ARRIVAL throws the letters, or the
       word clips against the wall for the first tenth of a second — which is
       exactly the tenth of a second it is largest and most looked at. */
    const N = b.text.length, spreadK = 1 - ease(inK);
    const spread = { widowmaker: 52, thornwake: 64, gravemourn: 30,
                     ironhail: 46, farwarden: 118 }[b.w];
    const extra = spread ? (N - 1) / 2 * spread * k * spreadK
                : b.w === "spellbreaker" ? 65 * k * spreadK : 0;
    const half = w46 * scale * 0.5 + extra;
    /* BELOW the anchor. The damage number spawns at the quarry and rises, so
       anything else that rises collides with it — the status tags learned this
       one change ago, and lifting the name clear upward just turned it back
       into a caption floating above the fight. Numbers go up, words go down.
       That is now the rule for everything that lands at a point of contact. */
    let cx = clamp(b.bx, half + 10, A.w - half - 10);
    let cy = clamp(b.by + 78, size * 0.9, A.h - size * 0.6);
    const y = cy;

    c.globalAlpha = clamp(age / 0.04, 0, 1) * clamp(b.life / 0.4, 0, 1);
    c.lineWidth = 10 * Math.min(1.7, scale) * k;
    c.strokeStyle = "#000000E0";
    c.fillStyle = col;
    c.shadowColor = glow; c.shadowBlur = 30;

    let fn = null;

    if (b.w === "dawnbringer"){
      fn = (i) => ({ dy: -(1 - ease(clamp((age - i * 0.012) / 0.13, 0, 1))) * 230 * k });
      if (age > 0.09 && age < 0.55){
        const k2 = (age - 0.09) / 0.46;
        c.save();
        c.globalCompositeOperation = "lighter";
        c.shadowBlur = 0;
        c.globalAlpha = (1 - k2) * 0.5;
        c.fillStyle = "#FFE7A8";
        c.fillRect(cx - A.w * 0.5 * k2, y + 12 * k, A.w * k2, (3 + 9 * (1 - k2)) * k);
        c.restore();
      }
    }
    else if (b.w === "widowmaker"){
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - ease(inK)) * 52 * k });
      if (out > 0){
        c.save();
        c.shadowBlur = 0; c.globalAlpha = out * 0.85;
        c.strokeStyle = "#8E1226"; c.lineWidth = 3 * k; c.lineCap = "round";
        for (let i = 0; i < 9; i++){
          const dx = (H(31, i) - 0.5) * w46 * scale;
          c.beginPath();
          c.moveTo(cx + dx, y + 8 * k);
          c.lineTo(cx + dx, y + (8 + out * out * (26 + H(37, i) * 50)) * k);
          c.stroke();
        }
        c.restore();
      }
    }
    else if (b.w === "grudgebearer"){
      const shake = age > 0.10 ? Math.exp(-(age - 0.10) * 13) : 0;
      cx += Math.sin(age * 92) * 9 * k * shake;
      cy += Math.cos(age * 78) * 7 * k * shake;
      fn = (i) => ({ dy: -(1 - ease(clamp(age / 0.10, 0, 1))) * 170 * k,
                     rot: (H(17, i) - 0.5) * 0.10 * shake });
      if (age > 0.10 && age < 0.70){
        const k2 = (age - 0.10) / 0.6;
        c.save();
        c.shadowBlur = 0; c.globalAlpha = (1 - k2) * 0.45;
        c.fillStyle = "#C89A66";
        for (let i = 0; i < 14; i++){
          const dx = (H(43, i) - 0.5) * w46 * scale * (1 + k2 * 1.5);
          c.beginPath();
          c.arc(cx + dx, y + (12 - k2 * (10 + H(47, i) * 26)) * k,
                (2 + H(53, i) * 7 * (1 - k2 * 0.5)) * k, 0, TAU);
          c.fill();
        }
        c.restore();
      }
    }
    else if (b.w === "thornwake"){
      const cinch = ease(clamp(age / 0.34, 0, 1));
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - cinch) * 64 * k });
      c.save();
      c.shadowBlur = 0;
      c.globalAlpha = clamp(b.life / 0.4, 0, 1)
                    * (1 - clamp((age - 0.34) / 0.24, 0, 1)) * 0.95;
      c.strokeStyle = "#4FD06B"; c.lineWidth = 4.4 * k; c.lineCap = "round";
      const hw = half + 26 * k + (1 - cinch) * 190 * k;
      for (const sgn of [-1, 1]){
        const bx = cx + sgn * hw;
        c.beginPath();
        c.moveTo(bx + sgn * 16 * k, y - size * 0.70);
        c.quadraticCurveTo(bx - sgn * 20 * k, y - size * 0.20, bx + sgn * 4 * k, y + size * 0.26);
        c.quadraticCurveTo(bx + sgn * 16 * k, y + size * 0.42, bx - sgn * 6 * k, y + size * 0.46);
        c.stroke();
        c.fillStyle = "#BCF7C7";
        c.beginPath(); c.arc(bx - sgn * 3 * k, y - size * 0.16, 3.4 * k, 0, TAU); c.fill();
      }
      c.restore();
    }
    else if (b.w === "gravemourn"){
      const pull = ease(setK);
      cy += pull * 22 * k;
      c.shadowBlur = 46;
      fn = (i, N) => ({ dx: (i - (N - 1) / 2) * (1 - ease(inK)) * 30 * k * (1 - pull * 0.4),
                        dy: pull * (6 + H(59, i) * 12) * k,
                        rot: (H(61, i) - 0.5) * 0.16 * pull });
      c.save();
      c.globalCompositeOperation = "lighter";
      c.shadowBlur = 0;
      for (let i = 0; i < 16; i++){
        const ph = (age * 1.5 + H(67, i)) % 1;
        c.globalAlpha = (1 - ph) * 0.85 * clamp(b.life / 0.4, 0, 1);
        c.fillStyle = ph < 0.4 ? "#F0E2FF" : "#C99BFF";
        c.fillRect(cx + (H(71, i) - 0.5) * w46 * scale, y + (10 + ph * 70) * k,
                   2.6 * k, 13 * k);
      }
      c.restore();
    }
    else if (b.w === "farwarden"){
      /* One bearing for every letter, staggered, so the word arrives as a
         formation rather than as a scatter. `a` is fixed: this is a single
         shot landing, and a single shot comes from one place. */
      const av = 2.62;
      fn = (i) => {
        const s = 1 - ease(clamp((age - i * 0.018) / 0.20, 0, 1));
        return { dx: Math.cos(av) * s * 480 * k,
                 dy: Math.sin(av) * s * 330 * k,
                 rot: s * 0.22, a: 1 - s * 0.25 };
      };
      /* The plates, arriving behind the word and settling. Five, countable,
         same as the ward on the shell and same as the corona on the shaft --
         the third and last place a viewer meets that object, so it has to be
         the same object. */
      if (age < 0.62){
        const s = 1 - ease(clamp(age / 0.62, 0, 1));
        c.save();
        c.shadowBlur = 0;
        c.globalAlpha = (1 - ease(clamp(age / 0.62, 0, 1))) * 0.9
                      * clamp(b.life / 0.4, 0, 1);
        for (let i = 0; i < 5; i++){
          const off = (i - 2) * 34 * k;
          const px = cx + off + Math.cos(av) * s * 300 * k;
          const py = y - size * 0.30 + Math.sin(av) * s * 210 * k;
          c.save();
          c.translate(px, py);
          c.rotate(av + Math.PI + s * 0.5);
          c.fillStyle = "#1A0512";
          c.fillRect(-26 * k, -7 * k, 52 * k, 14 * k);
          c.fillStyle = col;
          c.fillRect(-22 * k, -4.2 * k, 44 * k, 8.4 * k);
          c.restore();
        }
        c.restore();
      }
    }
    else if (b.w === "ironhail"){
      /* Each letter on its own bearing, converging. `i * TAU / N` reads as
         a circle even when the letters land in a line, because the eye
         reconstructs the fan from the streaks. */
      fn = (i, N) => {
        const s = 1 - ease(clamp((age - i * 0.008) / 0.17, 0, 1));
        const a = (i / N) * TAU + 0.55;
        return { dx: Math.cos(a) * s * 300 * k,
                 dy: Math.sin(a) * s * 210 * k,
                 rot: s * (H(89, i) - 0.5) * 1.5 };
      };
      if (age < 0.30){
        const s = 1 - ease(age / 0.30);
        c.save();
        c.globalCompositeOperation = "lighter";
        c.shadowBlur = 0;
        c.globalAlpha = s * 0.75;
        c.strokeStyle = glow; c.lineCap = "round";
        const N2 = b.text.length;
        for (let i = 0; i < N2; i++){
          const a = (i / N2) * TAU + 0.55;
          const lx = cx + Math.cos(a) * s * 300 * k;
          const ly = y  + Math.sin(a) * s * 210 * k;
          c.lineWidth = (1.5 + 3.5 * s) * k;
          c.beginPath();
          c.moveTo(lx + Math.cos(a) * 70 * k, ly + Math.sin(a) * 50 * k);
          c.lineTo(lx, ly);
          c.stroke();
        }
        c.restore();
      }
    }
    else if (b.w === "spellbreaker"){
      fn = (i) => {
        const a = 1 - ease(inK), o = out * out;
        return { dx: (H(73, i) - 0.5) * (a * 130 + o * 190) * k,
                 dy: (H(79, i) - 0.5) * (a * 90 + o * 150) * k,
                 rot: (H(83, i) - 0.5) * (a * 1.1 + o * 1.5),
                 a: 1 - o * 0.85 };
      };
    }

    this._letters(c, b.text, cx, cy, size, track, fn);

    if (age < 0.42){
      const k2 = age / 0.42;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.shadowBlur = 0;
      c.globalAlpha = (1 - k2) * 0.4;
      c.strokeStyle = glow; c.lineWidth = (3 + 9 * (1 - k2)) * k;
      c.beginPath();
      c.ellipse(cx, y - size * 0.28, (60 * k) + k2 * A.w * 0.7,
                (26 * k) + k2 * A.h * 0.10, 0, 0, TAU);
      c.stroke();
      c.restore();
    }
    c.restore();
  }

  /* ------------------------------------------------------------- intro --- */
  /* Everything a first-time viewer needs before the bell: what each weapon is,
     how it compares, what its status does and what its ultimate does. Bars are
     normalised against the whole roster so they stay honest if it changes. */
  drawIntro(m){
    const c = this.ctx;
    const p = 1 - clamp(m.introT / CONFIG.intro.dur, 0, 1);   // 0 -> 1
    c.save();
    c.fillStyle = "#07050C";
    c.fillRect(0, 0, this.W, this.H);

    c.textAlign = "center";
    c.font = "700 26px ui-serif,Georgia,serif";
    c.fillStyle = "#5E5140";
    c.fillText("T H E   S U N D E R E D   C R O W N", this.W/2, 68);

    const maxOf = key => Math.max(...WEAPONS.map(w => w[key]));
    const MX = { reach: maxOf("reach"), spin: maxOf("spin"),
                 mass: maxOf("mass"), dmg: maxOf("dmg") };

    /* Each panel slides in, the second a beat after the first. */
    this._introPanel(m.a, 128, clamp(p / 0.30, 0, 1), MX, -1);
    this._introPanel(m.b, 958, clamp((p - 0.14) / 0.30, 0, 1), MX, 1);

    c.textAlign = "center";
    c.font = "800 52px ui-serif,Georgia,serif";
    c.fillStyle = "#C9A227";
    c.globalAlpha = clamp((p - 0.26) / 0.18, 0, 1);
    c.fillText("VS", this.W/2, 916);
    c.globalAlpha = 1;

    /* A countdown the viewer can read, so the cut never feels abrupt. */
    const bw = 420, bx = (this.W - bw)/2, by = this.H - 104;
    c.fillStyle = "#191424";
    this.roundRect(bx, by, bw, 7, 4); c.fill();
    c.fillStyle = "#C9A227";
    this.roundRect(bx, by, bw * p, 7, 4); c.fill();
    c.font = "700 20px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#5E5140";
    c.fillText("seed " + m.seed, this.W/2, by + 42);
    c.restore();
  }

  _introPanel(f, y0, k, MX, dir){
    if (k <= 0) return;
    const c = this.ctx;
    const pal = f.aff;
    const H = 740;
    c.save();
    c.globalAlpha = k;
    c.translate(dir * (1 - k) * 90, 0);

    c.fillStyle = "#0C0914";
    this.roundRect(40, y0, this.W - 80, H, 12); c.fill();
    c.strokeStyle = pal.core + "55"; c.lineWidth = 2;
    this.roundRect(40, y0, this.W - 80, H, 12); c.stroke();
    c.fillStyle = pal.core;
    this.roundRect(40, y0, 9, H, 5); c.fill();

    c.textAlign = "left";
    c.font = "700 62px ui-serif,Georgia,serif";
    c.fillStyle = "#EDE3D0";
    c.fillText(f.w.name.toUpperCase(), 82, y0 + 82);
    c.font = "700 24px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = pal.core;
    c.fillText(f.aff.name.toUpperCase(), 82, y0 + 120);

    /* the weapon itself, drawn big enough to read the silhouette */
    c.save();
    c.translate(258, y0 + 282);
    c.rotate(-0.40);
    c.scale(2.35, 2.35);
    c.shadowColor = pal.core; c.shadowBlur = 26;
    if (f.w.shape === "flail"){
      /* drawn with the same bowed chain it has in the arena, so the card is
         showing the viewer the thing they are about to watch */
      const L = f.w.reach * 0.50;
      c.strokeStyle = "#6B6270"; c.lineWidth = f.w.width * 0.20; c.lineCap = "round";
      c.beginPath(); c.moveTo(-26, 0); c.quadraticCurveTo(L*0.5, 17, L, 0); c.stroke();
      c.fillStyle = "#9A93A4";
      for (let i = 1; i <= 8; i++){
        const t = i / 9, u = 1 - t;
        c.beginPath();
        c.arc(u*u*-26 + 2*u*t*(L*0.5) + t*t*L, 2*u*t*17, f.w.width * 0.13, 0, TAU);
        c.fill();
      }
      c.translate(L, 0);
      SHAPES.flailHead(c, f.w.artW, pal, 0.5);
    } else {
      const fn = SHAPES[f.w.shape];
      if (fn) fn(c, f.w.reach * 0.86, f.w.artW, pal);
    }
    c.restore();

    /* stat bars, normalised across the roster */
    /* A bow's reach is not its reach. Left alone this bar reads near-empty
       on the relic with the longest effective range in the game, which is
       worse than saying nothing. */
    const ranged = !!relicShot(f.w);
    const rows = [
      ranged ? ["RANGE", 1] : ["REACH",  f.w.reach / MX.reach],
      ["SWING",  f.w.spin  / MX.spin ],
      ["IMPACT", f.w.dmg   / MX.dmg  ],
      ["WEIGHT", f.w.mass  / MX.mass ],
    ];
    const bx = 620, bw = 380;
    rows.forEach(([label, v], i) => {
      const yy = y0 + 166 + i * 60;
      c.textAlign = "left";
      c.font = "700 21px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = "#8A7F70";
      c.fillText(label, 486, yy + 15);
      c.fillStyle = "#191424";
      this.roundRect(bx, yy, bw, 14, 7); c.fill();
      c.fillStyle = pal.core;
      this.roundRect(bx, yy, Math.max(8, bw * clamp(v, 0, 1)), 14, 7); c.fill();
    });

    /* A ranged relic's defining property is not on any of the four bars, so
       it gets the empty band under them. One line, because the silhouette
       already says `bow` and the only genuinely non-obvious fact is that
       the shot can be batted out of the air. `relicShot` is the same
       function verify.py's legibility contract calls. */
    const sh = relicShot(f.w);
    if (sh){
      c.textAlign = 'left';
      c.font = '700 19px ui-sans-serif,system-ui,sans-serif';
      c.fillStyle = '#5E5140';
      c.fillText('SHOOTS', 82, y0 + 424);
      c.font = '500 25px ui-sans-serif,system-ui,sans-serif';
      c.fillStyle = pal.glow;
      c.fillText(sh.tip, 82, y0 + 452);
    }

    /* what it inflicts, and what it does when the meter fills */
    /* `IT GAINS` rather than `ON HIT` for a self-directed status. "ON HIT /
       WARD" would read as though the ENEMY gets shielded, which is nonsense --
       the tag has to state the direction or the card teaches the wrong thing. */
    const rs = relicStatus(f.w);
    const st = rs.def;
    const lines = [
      [rs.self ? "IT GAINS" : "ON HIT", st ? st.name.toUpperCase() : "—", st ? st.tip : "", pal.core],
      ["ULTIMATE", f.w.ult.name.toUpperCase(), f.w.ult.tip || "", "#FFF4D0"],
    ];
    lines.forEach(([tag, name, tip, col], i) => {
      const yy = y0 + 470 + i * 124;
      c.textAlign = "left";
      c.font = "700 19px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = "#5E5140";
      c.fillText(tag, 82, yy);
      c.font = "800 36px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = col;
      c.fillText(name, 82, yy + 42);
      c.font = "500 26px ui-sans-serif,system-ui,sans-serif";
      c.fillStyle = "#B4A996";
      c.fillText(tip, 82, yy + 80);
    });
    c.restore();
  }

  /* One line, not two. The taller hall took the space the second line used to
     sit in, and the seed is a debugging courtesy rather than something the
     viewer needs a line of its own for. */
  drawFooter(m){
    const c = this.ctx;
    const y = this.arenaTop + this.ah + 46;
    c.save();
    c.textAlign = "center";
    c.font = "700 22px ui-serif,Georgia,serif";
    c.fillStyle = "#5E5140";
    const title = "T H E   S U N D E R E D   C R O W N";
    const tw = c.measureText(title).width;
    c.fillText(title, this.W/2 - 62, y);
    c.font = "400 16px ui-monospace,monospace";
    c.fillStyle = "#3A3229";
    c.textAlign = "left";
    c.fillText("·  seed " + m.seed, this.W/2 - 62 + tw/2 + 22, y);
    c.restore();
  }

  drawResult(m){
    const c = this.ctx, w = m.winner, l = m.loser;
    /* Fade and settle instead of a hard cut. The kill already has a 550ms
       freeze and a white flash; slamming a card on top of that reads as a
       glitch rather than a verdict. `resultT` is counted up in decay(). */
    /* Held back until the shell has finished coming apart. The card used to
       start fading in on the same frame as the killing blow, so its scrim sat
       over the shatter and the most legible moment in the match — the loser
       visibly breaking — played out behind 60% black. Kill, then shatter, then
       verdict, in that order and each one on its own. */
    const HOLD = 1.05;
    const k = clamp(((m.resultT || 0) - HOLD) / 0.45, 0, 1);
    if (k <= 0) return;
    const ease = 1 - Math.pow(1 - k, 3);
    c.save();
    c.globalAlpha = ease;
    c.fillStyle = "#05040899"; c.fillRect(0, 0, this.W, this.H);
    const cardY = this.H * 0.32 + (1 - ease) * 26, cardH = this.H * 0.215;
    c.fillStyle = "#0E0A16F7";
    this.roundRect(46, cardY, this.W - 92, cardH, 6); c.fill();
    c.strokeStyle = "#C9A22799"; c.lineWidth = 3;
    this.roundRect(46, cardY, this.W - 92, cardH, 6); c.stroke();
    c.strokeStyle = "#C9A22744"; c.lineWidth = 1;
    this.roundRect(56, cardY + 10, this.W - 112, cardH - 20, 4); c.stroke();

    c.textAlign = "center";
    c.font = "700 26px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#6E6378";
    c.fillText(m.reason === "timeout" ? "THE SEALS HOLD" : "THE CROWN PASSES TO",
               this.W/2, cardY + 74);

    c.font = "700 78px ui-serif,Georgia,serif";
    c.fillStyle = w.aff.core;
    c.shadowColor = w.aff.core; c.shadowBlur = 46;
    c.fillText(w.w.name.toUpperCase(), this.W/2, cardY + 172);
    c.shadowBlur = 0;

    c.font = "700 42px ui-monospace,monospace";
    c.fillStyle = "#EDE3D0";
    c.fillText(Math.ceil(w.hp) + " HP", this.W/2, cardY + 244);

    c.font = "400 23px ui-sans-serif,system-ui,sans-serif";
    c.fillStyle = "#5E5568";
    c.fillText(`over ${l.w.name}  ·  ${m.t.toFixed(1)}s  ·  ${m.clankCount} clanks`,
               this.W/2, cardY + 300);
    c.fillText(`${w.hits} hits  ·  ${w.crits} crits  ·  seed ${m.seed}`,
               this.W/2, cardY + 338);
    c.restore();
  }

  roundRect(x, y, w, h, r){
    const c = this.ctx;
    r = Math.min(r, h/2, w/2);
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
}

/* -------------------------------------------------------- HEADLESS RUNNER */
function simulate(idA, idB, seed){
  const m = new Match(idA, idB, seed);
  const dt = CONFIG.physics.dt;
  let guard = 0;
  while (!m.over && guard++ < 200000) m.step(dt);
  return m.summary();
}

function batch(idA, idB, n){
  const out = { a:0, b:0, dur:[], hp:[], clanks:[], hits:[] };
  for (let i = 0; i < n; i++){
    const r = simulate(idA, idB, (Math.random()*4294967296) >>> 0);
    if (r.winner === WEAPON_BY_ID[idA].name) out.a++; else out.b++;
    out.dur.push(r.duration); out.hp.push(r.hp);
    out.clanks.push(r.clanks); out.hits.push(r.hits.a + r.hits.b);
  }
  const avg = arr => arr.reduce((s,v)=>s+v,0)/arr.length;
  return { a:out.a, b:out.b,
           avgDur:+avg(out.dur).toFixed(1),
           minDur:+Math.min(...out.dur).toFixed(1),
           maxDur:+Math.max(...out.dur).toFixed(1),
           avgHp:+avg(out.hp).toFixed(0),
           avgClanks:+avg(out.clanks).toFixed(1),
           avgHits:+avg(out.hits).toFixed(1) };
}

/* ------------------------------------------------------------------ SHELL */
const cv = document.getElementById("cv");
const renderer = new Renderer(cv);
const selA = document.getElementById("selA");
const selB = document.getElementById("selB");
const logEl = document.getElementById("log");

for (const w of WEAPONS){
  for (const sel of [selA, selB]){
    const o = document.createElement("option");
    o.value = w.id; o.textContent = `${w.name} — ${AFFINITIES[w.aff].name}`;
    sel.appendChild(o);
  }
}
selA.value = "dawnbringer";
selB.value = "grudgebearer";

let match = null, speed = 1, last = performance.now(), acc = 0, loggedCount = 0;
/* The card is on by default because a first-time viewer needs it, and off by
   one click because someone watching their tenth fight does not. */
let introOn = true;
let bedHandle = null;

function newMatch(idA, idB){
  if (idA === idB){
    const alts = WEAPONS.filter(w => w.id !== idA);
    idB = alts[Math.floor(Math.random()*alts.length)].id;
    selB.value = idB;
  }
  const seed = (Math.random() * 4294967296) >>> 0;
  match = new Match(idA, idB, seed);
  match.introT = introOn ? CONFIG.intro.dur : 0;
  window.__match = match;

  /* Restart the bed with the match. Seal times are offset by the card, since
     the match clock is held at zero while it is up. */
  if (bedHandle){ bedHandle.stop(); bedHandle = null; }
  if (SFX.ctx){
    const t0 = SFX.ctx.currentTime;
    bedHandle = SFX.bed(t0, CONFIG.timeout + CONFIG.intro.dur + 6,
                        CONFIG.acts.slice(1).map(a => t0 + match.introT + a.t));
  }
  loggedCount = 0;
  logEl.innerHTML = `<b>${WEAPON_BY_ID[idA].name}</b> vs <b>${WEAPON_BY_ID[idB].name}</b> · seed ${seed}<br>`;
}

function pumpLog(){
  if (!match) return;
  while (loggedCount < match.events.length){
    const e = match.events[loggedCount++];
    logEl.innerHTML += `${e.t.toFixed(1).padStart(5)}s  ${e.text}<br>`;
    logEl.scrollTop = logEl.scrollHeight;
  }
}

/* Keep the backing store matched to the pixels on screen. Off the moment the
   capture pipeline pins a resolution, so a headless viewport cannot shrink the
   frame the video is being rendered from. */
let autoFit = true;
function fitCanvas(){
  if (!autoFit) return;
  const r = cv.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) renderer.resize(r.width, r.height);
}
if (typeof ResizeObserver === "function") new ResizeObserver(fitCanvas).observe(cv);
else addEventListener("resize", fitCanvas);
fitCanvas();

function frame(now){
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (match){
    /* __frozen holds the sim still while still drawing — used by the capture
       tooling to photograph a single instant such as mid-clank. */
    if (!window.__frozen){
      acc += raw * speed;
      const dt = CONFIG.physics.dt;
      let steps = 0;
      while (acc >= dt && steps < 40){ match.step(dt); acc -= dt; steps++; }
    }
    renderer.draw(match);
    pumpLog();
  }
  requestAnimationFrame(frame);
}

document.getElementById("btnFight").onclick = () => { SFX.resume(); newMatch(selA.value, selB.value); };
document.getElementById("btnRandom").onclick = () => {
  SFX.resume();
  const pick = () => WEAPONS[Math.floor(Math.random()*WEAPONS.length)].id;
  let x = pick(), y = pick();
  while (y === x) y = pick();
  selA.value = x; selB.value = y;
  newMatch(x, y);
};
const speeds = [1, 2, 4, 0.30];
let si = 0;
document.getElementById("btnSpeed").onclick = (e) => {
  si = (si + 1) % speeds.length; speed = speeds[si];
  e.target.textContent = speed + "×";
};
const btnIntro = document.getElementById("btnIntro");
btnIntro.onclick = () => {
  introOn = !introOn;
  btnIntro.textContent = introOn ? "Intro card" : "No intro";
  btnIntro.classList.toggle("off", !introOn);
  if (match && match.t === 0) match.introT = introOn ? CONFIG.intro.dur : 0;
};

const btnMute = document.getElementById("btnMute");
btnMute.onclick = () => {
  SFX.resume(); SFX.on = !SFX.on;
  btnMute.textContent = SFX.on ? "Sound" : "Muted";
  btnMute.classList.toggle("off", !SFX.on);
};

function __inject(m){ match = m; window.__match = m; loggedCount = match.events.length; }

window.AC = { litWeapon, CONFIG, AFFINITIES, STATUS, WEAPONS, SHAPES, relicShot, relicStatus, Match, simulate, batch,
              newMatch, __inject, SFX, renderer,
              /* Pin the backing store and stop the live page fitting it to the
                 window. Every capture path — render.py, verify.py — calls this
                 first, so the video's resolution is stated rather than
                 inherited from whatever viewport a harness happened to open. */
              setResolution(w, h){
                autoFit = false;
                cv.width = w; cv.height = h;
                renderer.k = w / 1080;
                return { w: cv.width, h: cv.height, k: renderer.k };
              },
              /* Synchronous draw for the capture pipeline. Stepping and drawing
                 in lockstep keeps a headless render deterministic instead of
                 racing requestAnimationFrame. */
              __draw(m){ renderer.draw(m || match); },
              get match(){ return match; } };

newMatch(selA.value, selB.value);
requestAnimationFrame(frame);
</script>
</body>
