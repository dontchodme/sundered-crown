<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Sundered Crown</title>
<style>
  :root{
    --bg:#0A0810; --panel:#14111E; --line:#2C2438;
    --ink:#EDE3D0; --dim:#8B7F94; --gold:#C9A227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #24192E 0%, #0A0810 55%),
      #0A0810;
    color:var(--ink); font-family:ui-serif,Georgia,"Times New Roman",serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:14px; padding:18px 12px 44px;
  }
  h1{
    font-size:19px; letter-spacing:.30em; text-transform:uppercase; font-weight:700;
    color:var(--gold); text-align:center; text-shadow:0 0 26px #C9A22755;
  }
  h1 small{
    display:block; letter-spacing:.20em; font-size:9px; color:var(--dim);
    margin-top:6px; font-weight:400; font-family:ui-sans-serif,system-ui,sans-serif;
  }
  #stage{
    width:min(430px,96vw); aspect-ratio:9/16; border-radius:6px; overflow:hidden;
    border:1px solid #3A2E22; background:#07050C;
    box-shadow:0 26px 80px -20px #000, 0 0 0 1px #C9A22722 inset, 0 0 60px -30px #C9A22766;
  }
  canvas{width:100%;height:100%;display:block}
  .panel{
    width:min(430px,96vw); background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:13px; display:flex; flex-direction:column; gap:10px;
  }
  .row{display:flex;gap:8px;align-items:center}
  .row > label{
    font-size:9px; letter-spacing:.20em; text-transform:uppercase; color:var(--dim);
    width:52px; flex:none; font-weight:700; font-family:ui-sans-serif,system-ui,sans-serif;
  }
  select{
    flex:1; background:#1D1828; color:var(--ink); border:1px solid var(--line);
    border-radius:4px; padding:9px 10px; font-size:13px; font-family:inherit;
  }
  .btns{display:flex;gap:8px}
  button{
    flex:1; background:#241D33; color:var(--ink); border:1px solid #3E3350; border-radius:4px;
    padding:11px 8px; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    font-family:ui-sans-serif,system-ui,sans-serif; cursor:pointer; transition:.15s;
  }
  button:hover{background:#31284a;border-color:#5b4a78}
  button.pri{
    background:linear-gradient(180deg,#C9A227,#8A6D12); border-color:#E8C65A; color:#1A1206;
  }
  button.pri:hover{filter:brightness(1.15)}
  button.off{opacity:.45}
  #log{
    width:min(430px,96vw); font-size:11px; color:var(--dim); line-height:1.7;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; max-height:150px; overflow:auto;
    border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#100D18;
  }
  #log b{color:var(--gold);font-weight:700}
</style>
</head>
<body>

<h1>The Sundered Crown<small>six relics · one arena · no survivors</small></h1>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>

<div class="panel">
  <div class="row"><label>Champion</label><select id="selA"></select></div>
  <div class="row"><label>Rival</label><select id="selB"></select></div>
  <div class="btns">
    <button class="pri" id="btnFight">Fight</button>
    <button id="btnRandom">Random</button>
    <button id="btnSpeed">1&times;</button>
    <button id="btnMute">Sound</button>
    <button id="btnIntro">Intro card</button>
  </div>
</div>
<div id="log"></div>

<script>
"use strict";
/* ============================================================================
   THE SUNDERED CROWN
   A spectator brawler. Two enchanted relics, one arena, no input.

   Layers, strictly separated:
     CONFIG / AFFINITIES / STATUS / WEAPONS   pure data — all tuning lives here
     SHAPES                                   procedural weapon art (local space)
     Sfx                                      procedural Web Audio, no samples
     Fighter / Match                          simulation; knows nothing of drawing
     Renderer                                 draws a Match; holds no game state
     Shell                                    UI wiring

   Randomness: every match draws a fresh seed, so outcomes are a true coin flip.
   The seed is recorded so any match can be replayed exactly.
   ========================================================================= */

/* ---------------------------------------------------------------- CONFIG -- */
const CONFIG = {
  /* 740 -> 800. The arena is width-bound on screen — its rendered height is
     just `h/w × frame width` — so the 150px the HUD gave back in v3 could not
     become more arena and pooled as margin instead. Taking the hall taller in
     *sim* units is the only way to spend it. Physics change: more floor means
     less contact per second, so it forces a retune. */
  arena:   { w: 520, h: 800 },
  /* No seek. An invisible steering force toward the opponent makes the balls
     look like they are breaking their own rules; the viewer cannot see it, so
     it reads as the physics lying. Contact is bought with visible things
     instead — a small arena and the collapsing walls.
     Speed is real: `relax` is how fast a ball coasts back to `cruise` after
     being launched, so a hard hit visibly throws it. Direction is never
     touched by the relaxation, so bounces stay predictable. */
  /* `gravity` and `heightVary` are a pair and should be read together.

     Before them the hall had no up and no down: walls reflected perfectly and
     speed relaxed to a flat `cruise`, so nothing could ever accelerate. Rick
     named it exactly — "they float around like the DVD screen saver."

     `gravity` alone does not fix that. It curves the paths, and then the relax
     term drags |v| straight back to cruise, so the arcs happen at constant
     speed and still read as floaty. `heightVary` is the half that sells it:
     the relax target becomes the speed a body of conserved energy carries at
     that height, so a fall speeds the ball up and a climb slows it down. Mean
     speed over a match is still cruise, so the pace survives.

     It also pays for the framing. Gravity on its own parks the fight on the
     floor — 83% of the time in the lower half at this strength — and this hall
     is 800 tall for a reason. The height coupling puts it back to 71%, because
     a slower ball high up spends longer up there. Both numbers measured; the
     sweep is in sundered-crown-gravity.md.

     `massWeight` is deliberately not physics. A real field is mass-independent;
     this one lets Grudgebearer's 5.0 fall harder than Spellbreaker's 1.0,
     because the roster already spends that spread on clanks and free
     characterisation is worth taking. `massRef` is the current roster mean —
     if the roster grows, re-derive it or every existing relic's fall rate
     shifts underneath you. */
  physics: { dt: 1/120, cruise: 405, ballR: 34, bounceJitter: 0.11,
             relax: 0.62, speedMin: 250, speedMax: 1300,
             gravity: 900, heightVary: 1.0, floorBounce: 0.97,
             massWeight: 0.5, massRef: 2.7 },

  /* Angular chain model. The head is always going round the pivot; the spring
     only adds lag on the way and whip on the way out. `extend` is how quickly
     it flies out under speed and droops when slow. */
  /* `hilt` is the rigid haft, as a fraction of total reach. The chain hangs
     from the *end of the haft*, not from the middle of the relic — which is
     what a flail actually is, and what makes the head sweep around the handle
     instead of orbiting the ball. Total reach is unchanged: hilt + chain.
     0.58 rather than a handsomer 0.36 because reach is measured from the ball
     *centre* and the ball radius is 34 of the 96 — a 0.36 haft ends barely
     outside the shell and is invisible. Only 62 units of reach are ever on
     screen, and the handle has to be a real share of that. */
  /* `sag` is gravity on the flail head — pendulum torque about the haft tip.
     It does not answer the open flail question, which is proportion and not
     motion, but a chain that hangs when slack and lags when swung is most of
     what reads as a flail. */
  /* 0.66 -> 0.46. Rick, after gravity landed: "the problem wasn't the flail it
     was the environment it existed in." Total reach is unchanged at 96 — this
     only moves the split between the rigid haft and the hanging chain, so the
     assembly is no bigger, it just finally reads as a chain rather than as a
     head bolted to a stick. Physics change even so: the hit segment comes from
     headX/headY, which the pivot moves. */
  chain: { follow: 5.2, spring: 26, damp: 0.9955, extend: 7.0, maxAngVel: 15,
           hilt: 0.46, sag: 1.1 },
  combat:  { hitCd: 0.45, knock: 165, baseHP: 300 },

  /* Projectiles. `pad` is the extra slack on the blade-vs-shot test, and
     it is deliberately larger than the clank pad of 3: a shot is small and
     fast, and a parry that only just fails reads as a bug rather than as a
     near miss. Erring toward "the blade got it" protects melee's defence,
     which is the whole reason projectiles are clankable.
     `maxLive` is a hard ceiling on objects in flight — a runaway cadence
     should degrade the picture, never the frame budget. */
  shot: { pad: 4, maxLive: 64 },
  chaos:   { critChance: 0.09, critMul: 2.1, dmgJitter: 0.30, spawnSpread: 1.1 },

  /* Hit stop: the whole sim freezes for a few frames on impact. This is the
     single biggest contributor to hits feeling like they have weight. */
  impact: {
    stopBase: 0.045, stopPerDmg: 0.0022, stopMax: 0.13, critStopMul: 1.7,
    stunBase: 0.10,  stunPerDmg: 0.0035, stunMax: 0.26,
    stunDR: 0.55,    stunDRDecay: 0.75,   // diminishing returns on repeat hitstun
    killStop: 0.55,                       // cinematic freeze on the killing blow
  },

  /* Clank: weapon meets weapon. Both rebound and reverse; the heavier relic
     wins the exchange and eats less of the stagger. */
  clank: {
    cd: 0.22, stop: 0.15, stun: 0.34, knock: 240, shake: 30, pad: 3,
    /* Fatigue: repeated binds push each other apart harder and re-arm slower,
       so two similar-mass relics cannot lock each other out of the match. */
    cdGrowth: 0.55, knockGrowth: 0.45, stunFalloff: 0.38,
    streakDecay: 0.45, maxStreak: 6,
  },

  /* The name of a seal tells a first-time viewer nothing, exactly the way the
     name of an ultimate tells them nothing. Both now ship with the line that
     says what just changed about the fight. */
  acts: [
    { t: 0,  name: null,           sub: null,                            dmg: 1.00, spin: 1.00, reach: 1.00 },
    { t: 15, name: "SECOND SEAL",  sub: "The hall closes · +35% damage",  dmg: 1.35, spin: 1.20, reach: 1.10 },
    { t: 35, name: "THIRD SEAL",   sub: "+85% damage · +42% swing speed", dmg: 1.85, spin: 1.42, reach: 1.20 },
  ],
  /* Starts on the Second Seal, not at an arbitrary clock time: the seal breaks
     and the hall begins to close. With seek gone this is what buys contact,
     and unlike a steering force the viewer can see it happening.

     Rate and inset were softened (8 -> 4.2, 170 -> 140) because the hall was
     shutting so fast that the last third of a match was two balls trapped in a
     corridor 2.6 ball-diameters wide. Matches get longer; that was the
     accepted trade. Physics change, so it forces a retune.

     Softening it cost contact, and the thinnest pairing (Grudgebearer vs
     Gravemourn) fell under the six-hit floor. Paid for by starting the
     collapse earlier rather than by making it faster again — which meant
     moving the Second Seal to t=15, because the walls must keep moving *when
     the seal breaks*. A wall that starts closing at an unexplained clock time
     is exactly the invisible correction this project deleted `seek` over. */
  collapse: { startT: 15, rate: 4.2, maxInset: 140 },
  desperation: { at: 0.25, dmg: 1.35, spin: 1.30 },
  timeout: 80,

  /* The intro card. This project lives or dies on whether a viewer understands
     what the two weapons DO in the first few seconds, and the mechanics are now
     far too rich to infer from watching. 4s is long enough to read two stat
     blocks and short enough not to cost retention.
     `introT` defaults to 0 on a Match, so simulate(), batch() and the tuner are
     never affected — only the presentation layers switch it on. */
  intro: { dur: 4.0 },

  /* The bed. Not music — a synthesised presence layer, and it exists for a
     measured reason: with impacts over literal silence the mix rendered at
     -33 LUFS integrated against a ~-14 platform target, and closing that gap
     with limiting would have flattened the very transients that make hit stop
     read as weight. A continuous floor raises the integrated level without
     touching the peaks.
     It also does legibility work: the drone steps up in level and pitch at
     each seal, so the three-act structure is audible as well as visible.
     `gain` is the one knob — everything else is relative to it. */
  audio: {
    gain: 1.60,         // master trim for the whole score; lands near -19.8 LUFS
    root: 55,           // A1, the tonic
    step: 0.26,         // level growth per seal
    bpm: 76,            // base tempo; each seal pushes it
    bpmStep: 0.13,      // tempo growth per seal
    air: 0.0,           // filtered-noise floor. 0 = off; see Sfx.bed for why
    airCut: 90,         // Hz, lowpass — keep it under ~110 or it reads as a fan

    /* Bus glue. The bed alone cannot reach platform loudness without drowning
       the fight — measured: at bed gain 2.2 the drone already peaks louder
       than the impacts. So the rest of the gap is closed here, deliberately
       and in a stated amount, rather than by cranking the drone.
       Moderate ratio, slow-ish attack so the initial transient of a hit gets
       through before the gain reduction arrives. */
    comp: { threshold: -26, ratio: 3.2, attack: 0.012, release: 0.28, makeup: 2.6 },
  },
};

/* ------------------------------------------------------------ AFFINITIES -- */
/* High fantasy schools of enchantment. `steel` is the metal of the weapon art,
   `core` the affinity accent, `glow` the emissive highlight. */
const AFFINITIES = {
  /* SANCTIFIED AND DWARVEN MOVE TOGETHER, and that is the finding.

     They have been the closest pair in the game on all six shapes since
     the matrix doc first suspected it -- CIEDE2000 mean 8.05, and p10 2.4,
     which means a tenth of the two weapons sat at the just-noticeable
     threshold. `palette_sweep.py` says a dwarven-only fix tops out around
     14.85 and `audit-dwarven.png` says the eye does not even buy that: on
     the sheet every dwarven-only candidate reads as "the duller one", not
     as a different school, because `core` drives the shadowBlur and both
     cores stay warm no matter what the metal does.

     Moving BOTH ends separates them on VALUE instead of hue -- the axis
     this codebase has now learned three times is the one that survives
     phone size and motion. 8.05 -> 21.19, and sanctified/dwarven is no
     longer in the worst four pairs in the game.

     It also puts each school back on its own thesis. Holy light is not
     gold leaf; a forge is not a treasury. */
  sanctified: { key:"sanctified", name:"Sanctified", core:"#FFF6E2", glow:"#FFFFFF", dark:"#5A4E30", steel:"#FFFFFF", status:"smite"       },
  bloodsworn: { key:"bloodsworn", name:"Bloodsworn", core:"#E03A4E", glow:"#FF97A2", dark:"#450710", steel:"#EBD3D3", status:"hemorrhage"  },
  dwarven:    { key:"dwarven", name:"Dwarven",    core:"#9C6326", glow:"#E8A34E", dark:"#2E1B0A", steel:"#6A6E74", status:"sunder"      },
  verdant:    { key:"verdant", name:"Verdant",    core:"#4FD06B", glow:"#BCF7C7", dark:"#0D3A1A", steel:"#DCEBD8", status:"entangle"    },
  umbral:     { key:"umbral", name:"Umbral",     core:"#A45CF0", glow:"#DDB8FF", dark:"#280A44", steel:"#B6A5C9", status:"curse"       },
  runic:      { key:"runic", name:"Runic",      core:"#4A9EFF", glow:"#BCDDFF", dark:"#08264F", steel:"#D4E4FF", status:"hex"         },
  vigil:      { key:"vigil", name:"Vigil",      core:"#F06BB8", glow:"#FFD1EC", dark:"#4A0A31", steel:"#D8B9C9", status:"ward"        },
};

const STATUS = {
  /* `tip` is the one line a first-time viewer gets. It appears on the intro
     card, and again in the arena the first time the status actually lands, so
     someone who skipped the card still learns what the colour means. Keep them
     under ~34 characters or they will not read at phone size. */
  smite:      { name:"Smite",      maxStacks:4, dur:3.2, dps:1.5,
                tip:"Sears for 1.5/s a stack" },
  hemorrhage: { name:"Hemorrhage", maxStacks:4, dur:3.2, dps:1.5,
                tip:"Bleeds for 1.5/s a stack" },
  entangle:   { name:"Entangle",   maxStacks:4, dur:2.8, spin:-0.13, move:-0.06,
                tip:"Slows the swing 13% a stack" },
  hex:        { name:"Hex",        maxStacks:5, dur:2.6, stunEvery:1.15, stunFor:0.20,
                tip:"Jams the weapon shut, on a timer" },
  curse:      { name:"Curse",      maxStacks:8, dur:99,  maxHpLoss:13,
                tip:"Eats maximum life, for good" },
  sunder:     { name:"Sunder",     maxStacks:6, dur:5.0, taken:0.11,
                tip:"+11% damage taken a stack" },
  /* VIGIL / Ward. The status entry holds the CLOCK; the pool itself lives
     on f.shield. One timer, so the plate's own brightness IS the timer the
     viewer reads -- no second HUD element, no hidden state. Expiring is not
     the same event as being broken, and only a break shatters. */
  ward:       { name:"Ward",       maxStacks:1, dur:5.0,
                bank:0.55,      // share of damage dealt, banked as shield
                cap:90,         // pool ceiling
                shatter:0.40,   // burst damage as a share of the pool
                knock:210,      // base shatter knock, x the wielder knockMul
                tip:"Shields, then shatters when broken" },
};

/* --------------------------------------------------------------- WEAPONS -- */
/* `mass` decides who wins a clank. `shape` selects the art.                   */
const WEAPONS = [
  { id:"dawnbringer", name:"Dawnbringer", aff:"sanctified", shape:"greatsword",
    blades:[0], reach:116, width:14, artW:40, dmg:6.53, spin:3.4, mode:"swing", arc:1.5, mass:3.0,
    onHit:{ smite:1 },
    ult:{ name:"Judgement", charge:14, kind:"beam", dmg:18, heal:34, tip:"Pillar of light: 18 damage, heals 34" },
    blurb:"A greatsword that tracks its foe instead of spinning blind, and drinks the wound it opens." },

  /* MERGE A. Was `daggers` at reach 56 / spin 5.0 / mass 1.2. Now the
     shared twinblade profile; the difference from Spellbreaker is entirely
     in SHAPES.twinblade's bloodsworn branch. */
  { id:"widowmaker", name:"Widowmaker", aff:"bloodsworn", shape:"twinblade",
    blades:[0,0.5], reach:62, width:8, artW:30, dmg:9.56, spin:5.7, mode:"spin", mass:1.1,
    onHit:{ hemorrhage:2 },
    ult:{ name:"Exsanguinate", charge:14, kind:"nova", radius:240, dmg:16, apply:{hemorrhage:3}, knock:200, tip:"Nova: 16 damage, 3 Hemorrhage, knockback" },
    blurb:"Paired fangs. Loses every clank it enters, and opens more wounds than anything else." },

  { id:"grudgebearer", name:"Grudgebearer", aff:"dwarven", shape:"warhammer",
    blades:[0], reach:76, width:26, artW:54, dmg:25.83, spin:1.6, mode:"spin", mass:5.0, knockMul:2.3,
    onHit:{ sunder:1 },
    ult:{ name:"Mountainfall", charge:15, kind:"nova", radius:300, dmg:14, apply:{sunder:3}, knock:460, tip:"Nova: 14 damage, 3 Sunder, huge knockback" },
    blurb:"Rune-forged maul. Wins every clank in the game and flings the loser across the floor." },

  { id:"thornwake", name:"Thornwake", aff:"verdant", shape:"scythe",
    blades:[0], reach:104, width:11, artW:46, dmg:27.42, spin:3.2, mode:"spin", mass:2.4,
    onHit:{ entangle:2 },
    ult:{ name:"Bramblesnare", charge:15, kind:"freeze", radius:260, dmg:10, apply:{entangle:3}, freeze:1.6, tip:"Roots them 1.6s, 10 damage, 3 Entangle" },
    blurb:"Longest true reach. Roots its quarry until the swing can barely come around." },

  { id:"gravemourn", name:"Gravemourn", aff:"umbral", shape:"flail",
    blades:[0], reach:96, width:22, artW:52, dmg:40.27, spin:2.2, mode:"chain", mass:3.6,
    onHit:{ curse:1 },
    ult:{ name:"Dirge", charge:16, kind:"pull", radius:320, dmg:14, apply:{curse:3}, tip:"Drags them in: 14 damage, 3 Curse" },
    blurb:"A chain, not an arm. It lags, overshoots and whips — and it eats maximum life for good." },

  /* MERGE A. Was `runeblade` at reach 70 / spin 6.4 / mass 1.0 -- a type
     name that was really a school name, which is why every school that
     ever got one would have inherited runic's "held by nothing" thesis. */
  { id:"spellbreaker", name:"Spellbreaker", aff:"runic", shape:"twinblade",
    blades:[0,0.5], reach:62, width:8, artW:30, dmg:6.97, spin:5.7, mode:"spin", mass:1.1,
    onHit:{ hex:1 },
    ult:{ name:"Unmaking", charge:13, kind:"bolt", dmg:20, apply:{hex:3}, tip:"Bolt: 20 damage, 3 Hex" },
    blurb:"Conjured blades, no hilt. Chips relentlessly and hexes the enemy's arm shut." },

  /* The projectile engine's test bed, not a designed relic — same status
     Lightkeeper has. Dwarven because sunder is a pure damage-taken
     multiplier and therefore the only status that cannot confound a
     "did the shot land" measurement.
     `mode:"ranged"` spins exactly like `mode:"spin"` and additionally
     discharges along f.theta on a cadence. It KEEPS its blade segment at
     reach 54, so it still fights up close — badly. "Hits from anywhere,
     dies up close" is the type's whole shape, and the collapsing hall
     turns that into an arc for free.
     No knockMul: Rick asked for the measurement rather than the guess. */
  { id:"ironhail", name:"Ironhail", aff:"dwarven", shape:"bow",
    blades:[0], reach:54, width:9, artW:44, dmg:14.04, spin:2.8, mode:"ranged", mass:1.6,
    shot:{ cadence:0.34, speed:380, r:24, life:3.4, grav:0, dmgMul:1.0,
           tip:"Fires along its facing · shots can be clanked" },
    onHit:{ sunder:1 },
    ult:{ name:"Quarrelstorm", charge:15, kind:"volley", shots:14, spread:6.283, dmg:0,
          tip:"A ring of bolts, in every direction at once" },
    blurb:"A siege bow on a spinning mount. It does not aim — it sweeps the hall and fires." },

  /* The Ward test bed. Greatsword shape so no new art is in the experiment,
     `mode:"spin"` so it is not a second Dawnbringer, knockMul 1.0 so the
     shatter reads at baseline before the type axis is tested. */
  { id:"lightkeeper", name:"Lightkeeper", aff:"vigil", shape:"greatsword",
    blades:[0], reach:116, width:14, artW:40, dmg:8.74, spin:3.4, mode:"swing", arc:1.5, mass:3.0,
    onSelf:{ ward:1 }, knockMul:1.0,
    ult:{ name:"Bulwark", charge:15, kind:"nova", radius:260, dmg:12, knock:180,
          tip:"Nova: 12 damage, wide knockback" },
    blurb:"Banks what it deals as a plate of light, and hands it back when you break through." },

  /* THE VIGIL BOW. Ward on the ranged profile, and the first ultimate in
     the game with a cast time.
     `dmg` is a GUESS and is the one number here that has not been tuned --
     Ironhail's 11.75 as a starting point, on a school that also banks a
     shield off every hit. Expect it high. `knockMul` is deliberately unset
     so the shatter measures at baseline, per the bow brief. */
  { id:"farwarden", name:"Farwarden", aff:"vigil", shape:"bow",
    blades:[0], reach:54, width:9, artW:44, dmg:10.66, spin:2.8, mode:"ranged", mass:1.6,
    shot:{ cadence:0.34, speed:380, r:24, life:3.4, grav:0, dmgMul:1.0,
           tip:"Fires along its facing · shots can be clanked" },
    /* onSelf's VALUE is already a per-relic bank multiplier -- resolveHit
       banks `dmg * W.bank * n` -- so the school constant does not have to
       become a type table for the ranged row to work. 2.5, and it is
       measured, not chosen: Ward was designed on a GREATSWORD, where a
       single 30-point blow banks a third of the pool at once. A bow deals
       ~11 a hit and lands roughly three inside one 5-second window, so at
       n=1 the pool tops out near 20 of a 90 cap and the ultimate that is
       supposed to fire the shield fires a rumour of one. This is the first
       hard evidence that `bank 0.55 / cap 90` do not survive the type
       axis -- vigil doc, open decision 4. */
    onSelf:{ ward:2.5 },
    ult:{ name:"Reprisal", charge:16, kind:"aimedshot",
          draw:0.55,        // MINIMUM wind-up. The real one is emergent:
                            // the bow fires when its facing comes round.
          spinMul:6.0,      // 2.8 -> 16.8 rad/s, ~2.7 revolutions a second.
                            // MEASURED, not chosen: at 3.5 the bow kept
                            // just missing the crossing and having to come
                            // all the way round, so the wind-up ran to a
                            // median of 1.20s with half of all casts over
                            // 1.2s. Faster revolutions shorten the WAIT
                            // without shortening the telegraph, because
                            // `draw` is a floor the spin cannot undercut.
          dmg:34,           // base, before the ward is added to it
          speed:420,        // slower still than the basic shot: it is heavier
          grav:620,         // the arc Rick asked for. Solved for, not guessed.
          r:32, life:4.0,
          knock:260,        // at a FULL pool. Scales to nothing at an empty one.
          tip:"Spends the ward as one aimed shot" },
    blurb:"Every hit it lands becomes a plate. Every plate becomes the next arrow." },
];
/* The single source of truth for "which status does this relic teach".
   The fight card and verify.py's legibility contract BOTH call this. They used
   to each have their own copy of the lookup, the card's copy only knew about
   `onHit`, and a relic shipped with a blank status line while every check
   stayed green. A check that does not call the same function the renderer
   calls is checking a different thing. */
function relicStatus(w){
  const k = Object.keys(w.onHit || {})[0] || Object.keys(w.onSelf || {})[0];
  return { key: k, def: STATUS[k], self: !(w.onHit && w.onHit[k]) };
}

/* The single source of truth for "does this relic shoot, and what does the
   viewer get told about it". Same rule as relicStatus(): the fight card and
   verify.py both call this one function, so they cannot drift apart. */
function relicShot(w){ return w.mode === "ranged" ? (w.shot || null) : null; }

/* Launch angle for a projectile of speed v under gravity g that passes
   through the offset (dx, dy). +y is DOWN in this hall, so the standard
   up-positive solution is mirrored on the way in and on the way out.
   Returns the LOW arc. If the point is out of range the discriminant goes
   negative and this returns a flat aim -- the shot then falls short, in
   full view, which is the honest picture. */
function ballisticAngle(dx, dy, v, g){
  if (!(g > 0)) return Math.atan2(dy, dx);
  const x = Math.abs(dx), yUp = -dy, v2 = v * v;
  if (x < 1e-3) return Math.atan2(dy, dx);
  const disc = v2 * v2 - g * (g * x * x + 2 * yUp * v2);
  if (disc < 0) return Math.atan2(dy, dx);
  const th = Math.atan((v2 - Math.sqrt(disc)) / (g * x));   // up-positive
  const a = -th;                                            // back to down-positive
  return dx < 0 ? Math.PI - a : a;
}

const WEAPON_BY_ID = Object.fromEntries(WEAPONS.map(w => [w.id, w]));

/* ------------------------------------------------------------------ MATH -- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
/* signed shortest angle from a to b */
const angDiff = (a,b) => { let d = (b - a) % TAU;
  if (d >  Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d; };

function makeRng(seed){                       // mulberry32
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Distance from point P to segment AB, plus the closest point. */
function segDist(ax, ay, bx, by, px, py){
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return { d: Math.hypot(px - cx, py - cy), x: cx, y: cy };
}

/* Closest distance between two segments (Ericson, Real-Time Collision Detection).
   This is what makes clanks possible: blade against blade, not blade against ball. */
/* Does the straight run from (ox,oy) to (px,py) enter the disc (cx,cy,r)
   strictly before it arrives? Closed-form ray/circle, no sampling.

   This is the whole of the clank fix. A weapon reaches a point by travelling
   to it, and a body in the way means it never got there. Before this, 39.8%
   of every clank in the game was two blades "meeting" at a point one of them
   could only occupy by being inside the other relic -- and because the
   renderer draws weapons over shells, the viewer watched a sword pass through
   a torso and strike sparks off nothing on the far side.

   It is a SUBTRACTION, which is why it costs nothing against §0: it does not
   add a rule to read, it deletes an event that never had a cause on screen. */
function rayBlocked(ox, oy, px, py, cx, cy, r){
  const dx = px - ox, dy = py - oy;
  const a  = dx*dx + dy*dy;
  if (a === 0) return false;
  const fx = ox - cx, fy = oy - cy;
  const b  = 2*(fx*dx + fy*dy);
  const cc = fx*fx + fy*fy - r*r;
  const disc = b*b - 4*a*cc;
  if (disc < 0) return false;                       // never touches the disc
  const t = (-b - Math.sqrt(disc)) / (2*a);         // near intersection
  return t > 1e-6 && t < 1 - 1e-6;                  // ...and it is in the way
}

function segSegDist(p1x,p1y,q1x,q1y, p2x,p2y,q2x,q2y){
  const d1x=q1x-p1x, d1y=q1y-p1y;
  const d2x=q2x-p2x, d2y=q2y-p2y;
  const rx=p1x-p2x,  ry=p1y-p2y;
  const a=d1x*d1x+d1y*d1y, e=d2x*d2x+d2y*d2y, f=d2x*rx+d2y*ry;
  const EPS=1e-9;
  let s=0, t=0;
  if (a<=EPS && e<=EPS){ s=t=0; }
  else if (a<=EPS){ s=0; t=clamp(f/e,0,1); }
  else {
    const c=d1x*rx+d1y*ry;
    if (e<=EPS){ t=0; s=clamp(-c/a,0,1); }
    else {
      const b=d1x*d2x+d1y*d2y;
      const denom=a*e-b*b;
      s = denom!==0 ? clamp((b*f-c*e)/denom,0,1) : 0;
      t = (b*s+f)/e;
      if (t<0){ t=0; s=clamp(-c/a,0,1); }
      else if (t>1){ t=1; s=clamp((b-c)/a,0,1); }
    }
  }
  const c1x=p1x+d1x*s, c1y=p1y+d1y*s;
  const c2x=p2x+d2x*t, c2y=p2y+d2y*t;
  return { d: Math.hypot(c1x-c2x, c1y-c2y), x:(c1x+c2x)/2, y:(c1y+c2y)/2 };
}

/* ------------------------------------------------------------------ ART --- */
/* Every shape draws in local space: the weapon runs along +X from x=0 (the
   hand) to x=L (the tip), centred on y=0. The silhouette is the tell — you
   should be able to name what a relic does from its outline alone. */
const SHAPES = {

  /* THE RUNIC GRAMMAR, EXTRACTED SO IT CAN TRAVEL.

     `_twinConjured` proved the idea on one shape: there is no solid blade at
     all, only hard crystalline shards hanging in a blade-shaped line with real
     daylight between them, light bleeding through the gaps, and a sigil turning
     backwards in the space where a hand would be. "Held by nothing" twice over.
     `silhouette_probe.py` scores that branch at IoU 0.347 against its own
     type-mates -- nearly as far apart as two different weapon TYPES.

     This is the same grammar with the profile handed in, so any shape can wear
     it. `prof(c)` traces the blade outline the type wants; everything else --
     the fracture, the drift, the beam, the sigil -- is the school.

     MERGED 2026-08-14. `_twinConjured` kept its own copy for three sessions
     because folding it in would have changed a shipped, approved silhouette
     and nothing here could see a render regression. `tools/twin_identity.py`
     is that check, and it went in first: 20 values of `_t` over the full 20*pi
     common period, at 62x30 and at 372x180, on all three callers.

     The merge is BIT-IDENTICAL -- 0 differing pixels of 14,551,080 compared.
     It only got there because the private copy differed in three real ways,
     and `o.dark`, `o.tipX` and `o.tipR` exist to carry them: the twinblade's
     silhouette fill is the literal `#040814` and not runic's `dark` `#08264F`,
     and its point sits at `L*1.04, W*0.085` where this hardcoded `L*1.02,
     W*0.075`. All three default to what this used to hardcode, so
     `_gsConjured` and `_whConjured` did not move either. Written as a plain
     re-parameterisation without them, the same merge moves 487,407 pixels at a
     max channel delta of 249 -- `twin_identity.py --naive` still prints that
     number, and it is the reason the note said to wait.

     Deterministic in SHAPES._t. No rng. bladeSegments derives the hit segment
     from f.theta, so none of this can move a hitbox. */
  _conjure(c, L, W, p, o){
    const t = SHAPES._t || 0;
    const N = o.n, gap = o.gap, bw = o.bw, prof = o.prof;
    /* The slice window is where the shards are CUT, which is not always the
       whole weapon. A blade runs from the gap to the point, but a hammer's ink
       is all out at the head, and slicing an empty stretch of haft would spend
       two of three shards on nothing. Defaults to the blade case. */
    const sf = o.sliceFrom === undefined ? gap : o.sliceFrom;
    const st = o.sliceTo   === undefined ? L   : o.sliceTo;
    const span = st - sf;

    /* A HAIRLINE DOWN THE AXIS, DRAWN FIRST AND KEPT THIN. The twinblade's v2
       had a fat beam here and the shards looked stuck ON it; the light is
       supposed to be what shows THROUGH the gaps, which means it has to be
       narrower than the blade, not wider. `o.beam` is a fraction of W and every
       caller keeps it under 0.06. */
    c.save();                                    // the light through the gaps
    c.globalCompositeOperation = "lighter";
    const beam = c.createLinearGradient(gap, 0, L, 0);
    beam.addColorStop(0,    p.core + "00");
    beam.addColorStop(0.30, p.core + "CC");
    beam.addColorStop(1,    p.glow);
    c.strokeStyle = beam; c.lineCap = "round";
    c.lineWidth = W * o.beam;
    c.beginPath(); c.moveTo(gap, 0); c.lineTo(L, 0); c.stroke();
    c.restore();

    /* ONE BLADE, CUT INTO PIECES -- and that is the whole grammar, not a
       detail of it. The twinblade's v2 drew five independent quads and they
       read as a chain of bricks on a string, because five separate objects in
       a row IS a chain no matter what shape each one is. Here `prof` is
       defined ONCE by the caller and each shard is a CLIP of it, so the
       assembly cannot help reading as one weapon that has been shattered and
       is being held in formation. Close the gaps in your head and you get the
       type's own outline back; that is the property that was missing, and it
       is why `prof` is a path and not a list of quads.

       Each shard drifts and cants on its own phase, so the fracture lines
       never sit still and the weapon breathes while the relic does not. */
    c.lineJoin = "miter"; c.lineCap = "butt";
    for (let i = 0; i < N; i++){
      const u0 = i / N, u1 = (i + (o.frac || 0.87)) / N;   // the daylight
      const x0 = sf + span * u0, x1 = sf + span * u1;
      const cx = (x0 + x1) / 2;
      const drift = Math.sin(t * 2.1 + i * 2.3) * W * o.drift;
      const cant  = Math.sin(t * 1.6 + i * 1.4) * o.cant;

      c.save();
      c.translate(cx, drift); c.rotate(cant); c.translate(-cx, -drift);
      c.beginPath();
      c.rect(x0, drift - bw * 2.2, x1 - x0, bw * 4.4);
      c.clip();

      /* p.dark, not a near-black literal -- see _sf_patch. The mask probe
         flattens every colour to one white and therefore cannot see a
         black bar; the colour matrix showed it immediately.
         `o.dark` is the one exception and it is a debt, not a feature:
         `_twinConjured` shipped with the literal `#040814` and the merge had
         to be bit-identical, so the literal came with it. It is invisible to
         `silhouette_probe.py` unless you pass `--footprint`. Retiring it means
         moving an approved silhouette, which is a decision for eyes. */
      prof(c); c.fillStyle = o.dark || p.dark; c.fill();     // silhouette
      const g = c.createLinearGradient(cx, -bw, cx, bw);     // lit from above
      g.addColorStop(0,    p.steel);
      g.addColorStop(0.52, p.core);
      g.addColorStop(1,    p.dark);
      prof(c); c.fillStyle = g; c.globalAlpha = 0.94; c.fill(); c.globalAlpha = 1;

      /* THE FRACTURE FACES CATCH THE LIGHT -- a bright rim on the two CUT
         edges, which is what says "this was broken" rather than "this was made
         in pieces". CLIPPED TO `prof`: without that they run the full height
         of the slice rect and the weapon turns into a venetian blind, which is
         precisely what the first attempt at this looked like. */
      c.save();                                              // the cut faces
      prof(c); c.clip();
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.055);
      c.beginPath();
      c.moveTo(x0, drift - bw * 2); c.lineTo(x0, drift + bw * 2);
      c.moveTo(x1, drift - bw * 2); c.lineTo(x1, drift + bw * 2);
      c.stroke();
      c.restore();

      prof(c);
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.045); c.stroke();
      c.restore();
    }

    /* The point is light, not steel: the weapon ends in the thing holding it
       together. `tipX`/`tipR` exist only so `_twinConjured` can keep the
       slightly further, slightly larger point it shipped with -- see the merge
       note at the top. */
    c.save();                                    // the point is light, not steel
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "#FFFFFF"; c.shadowColor = p.core; c.shadowBlur = 18;
    c.beginPath(); c.arc(L * (o.tipX || 1.02), 0, W * (o.tipR || 0.075), 0, TAU); c.fill();
    c.restore();

    /* THE SIGIL, where a hand would be, turning BACKWARDS against the weapon.
       A thing that refuses to turn with what it is carrying cannot be read as
       a grip. The school's whole argument, in one moving object. */
    c.save();                                    // the sigil, turning backwards
    c.translate(gap * 0.50, 0);
    c.rotate(-t * 2.4);
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W * 0.030);
    c.shadowColor = p.core; c.shadowBlur = 14;
    const rr = W * o.sigil;
    c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3;
      const x = Math.cos(a) * rr * 0.60, y = Math.sin(a) * rr * 0.60;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.stroke();
    c.lineWidth = Math.max(1, W * 0.020);
    for (let i = 0; i < 3; i++){
      const a = i * TAU / 3 + Math.PI / 3;
      c.beginPath();
      c.moveTo(Math.cos(a) * rr * 1.15, Math.sin(a) * rr * 1.15);
      c.lineTo(Math.cos(a) * rr * 1.55, Math.sin(a) * rr * 1.55);
      c.stroke();
    }
    c.restore();
  },

  /* RUNIC GREATSWORD. The grammar's first trip to another type, and the
     hostile case on purpose: the greatsword is the longest, most solid shape
     in the game and the matrix sheet's worst cell.

     What the school takes away is as important as what it adds. There is no
     grip, no wrapped leather, no crossguard and no pommel -- the crossguard in
     particular is the single largest horizontal element on the shipped
     greatsword, and deleting it is most of why the outline stops being the
     same outline. Six shards instead of the twinblade's five, because the
     blade is nearly twice as long and five would read as chunks. */
  _gsConjured(c, L, W, p){
    const gap = L * 0.20, bw = W * 0.34, span = L - gap;
    const prof = (cc) => {
      cc.beginPath();
      cc.moveTo(gap,               -bw * 0.52);
      cc.lineTo(gap + span * 0.10, -bw);
      cc.lineTo(L * 0.86,          -bw * 0.80);
      cc.lineTo(L * 1.01,           0);
      cc.lineTo(L * 0.86,           bw * 0.80);
      cc.lineTo(gap + span * 0.10,  bw);
      cc.lineTo(gap,                bw * 0.52);
      cc.closePath();
    };
    /* `frac` 0.74, not the twinblade's 0.87. MEASURED: at 0.87 the runic
       greatsword scored IoU 0.519 against its type-mates, against the runic
       twinblade's 0.403 on the same build -- the grammar had travelled but
       arrived weaker, because six narrow gaps in a blade nearly twice as long
       remove proportionally less of it. Wider daylight is the knob, and it is
       the school's own thesis turned up rather than a new idea. */
    SHAPES._conjure(c, L, W, p, { n:6, gap, bw, prof, frac:0.74,
                                  beam:0.050, drift:0.055, cant:0.060,
                                  sigil:0.30 });
  },

  /* Darken a palette colour toward its own luminance. `k` scales value, `mix`
     pulls toward neutral grey (0 keeps the hue fully, 1 is achromatic).
     Memoised: it is called from inside per-frame draws, and this project has
     already paid once for allocating inside a draw. The cache is bounded by
     the palette, so it is at most a few dozen entries for the whole run. */
  /* A SHADOWED FACE, IN THE SCHOOL'S OWN COLOUR. `_shade` desaturates toward
     luminance, which is right for a highlight and wrong for a shadow: it sends
     all seven schools to the same grey (sanctified #808080, runic #6C727B).
     A turned-away face is lit by less of the same light, not by grey light, so
     blend toward the school's `dark`. `t` is picked per site to hold the
     luminance `_shade` produced. depth_build.py --tint. */
  _facet(steel, dark, t){
    const cache = SHAPES._facetCache || (SHAPES._facetCache = {});
    const id = steel + "|" + dark + "|" + t;
    const hit = cache[id];
    if (hit) return hit;
    const s = parseInt(steel.slice(1), 16), d = parseInt(dark.slice(1), 16);
    const mix = (sh) => Math.round((((s >> sh) & 255)
                 + ((((d >> sh) & 255)) - ((s >> sh) & 255)) * t));
    const r = mix(16), g = mix(8), b = mix(0);
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b)
                              .toString(16).slice(1));
  },

  /* WORLD LIGHT. `_lit` mirrors an interior facet about the blade axis when the
     weapon has turned over, so a shadowed face stays on the side away from the
     light instead of riding around with the object. Returns the strength: 1
     when the blade lies flat to the light, 0 when it swings edge-on, and the
     mirror happens exactly where the strength is 0. depth_build.py
     --worldlight. */
  _litN(c){
    const m = c.getTransform();
    return m.d / (Math.hypot(m.c, m.d) || 1);
  },
  _lit(c){
    const n = SHAPES._litN(c);
    if (n < 0) c.scale(1, -1);
    return Math.abs(n);
  },

  /* A NEAR-BLACK THE PALETTE OWNS. A literal near-black is invisible to every
     instrument in this project at once: no palette field moves it, and the
     silhouette mask flattens palette fields and thresholds greyscale at 40, so
     ink below 40 that is not a field cannot be seen either. It reads as a
     plausible number for a smaller object. depth_build.py --bowlit.

     Scale the school's own `dark` to the literal's luminance. The VALUE is what
     the near-black was for; the hue is what it was throwing away. */
  _ink(hex, lum){
    const cache = SHAPES._inkCache || (SHAPES._inkCache = {});
    const id = hex + "|" + lum;
    const hit = cache[id];
    if (hit) return hit;
    const n = parseInt(hex.slice(1), 16);
    const r0 = (n >> 16) & 255, g0 = (n >> 8) & 255, b0 = n & 255;
    const l0 = 0.2126 * r0 + 0.7152 * g0 + 0.0722 * b0;
    const k = l0 > 0.5 ? lum / l0 : 0;
    const q = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    const r = q(r0), g = q(g0), b = q(b0);
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b)
                              .toString(16).slice(1));
  },

  _shade(hex, k, mix){
    const cache = SHAPES._shadeCache || (SHAPES._shadeCache = {});
    const id = hex + k + "|" + mix;
    const hit = cache[id];
    if (hit) return hit;
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = Math.max(0, Math.min(255, Math.round((r + (lum - r) * mix) * k)));
    g = Math.max(0, Math.min(255, Math.round((g + (lum - g) * mix) * k)));
    b = Math.max(0, Math.min(255, Math.round((b + (lum - b) * mix) * k)));
    return (cache[id] = "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1));
  },

  /* THE MAKER'S MARK. §3.1 of the matrix doc found `SHAPES.warhammer` drawing
     what its own comment called the "dwarven chevron" on every school's hammer,
     because the shapes were written when type and school were the same thing.
     The fix §3.3 asks for is not "stop sharing shapes", it is *share the
     routine, bespoke one real detail inside it* — and the detail has to be
     STRUCTURAL. A recoloured chevron is still one chevron.

     Seven marks, one per school, each drawn from that school's own vocabulary
     so it is recognisable from the rest of the relic rather than learned here:

       dwarven     the chevron, unchanged — it was always right for dwarven
       sanctified  a sunburst: rays, the same language as Judgement's pillar
       bloodsworn  three tally cuts, the wound it counts
       verdant     a sprig, the only mark that grows out of the weapon
       umbral      tarnish: the mark is an ABSENCE, eating the face
       runic       the triangle-in-ring sigil from _twinConjured
       vigil       a riveted plate, the same plate the ward puts on the shell

     `sc` is the mark's half-size. Drawn at (x, y) in the shape's own space, so
     any shape can call it; it does not know what it is sitting on. */
  _makerMark(c, x, y, sc, W, p){
    const k = p.key;
    c.save();
    c.translate(x, y);
    const lw = Math.max(1, W * 0.05);
    c.lineWidth = lw; c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = p.core; c.fillStyle = p.core;

    if (k === "sanctified"){
      for (let i = 0; i < 8; i++){
        const a = i * TAU / 8;
        c.beginPath();
        c.moveTo(Math.cos(a) * sc * 0.34, Math.sin(a) * sc * 0.34);
        c.lineTo(Math.cos(a) * sc * (i % 2 ? 0.72 : 1.0),
                 Math.sin(a) * sc * (i % 2 ? 0.72 : 1.0));
        c.stroke();
      }
      c.beginPath(); c.arc(0, 0, sc * 0.22, 0, TAU); c.fill();

    } else if (k === "bloodsworn"){
      c.lineWidth = Math.max(1, W * 0.055);
      for (let i = -1; i <= 1; i++){
        c.beginPath();
        c.moveTo(i * sc * 0.42 - sc * 0.18, -sc * 0.85);
        c.lineTo(i * sc * 0.42 + sc * 0.18,  sc * 0.85);
        c.stroke();
      }

    } else if (k === "verdant"){
      c.lineWidth = Math.max(1, W * 0.045);
      c.beginPath();
      c.moveTo(0, sc * 0.95);
      c.quadraticCurveTo(sc * 0.10, 0, -sc * 0.10, -sc * 0.95);
      c.stroke();
      for (const sg of [-1, 1]){
        c.beginPath();
        c.moveTo(0, sg * sc * 0.30);
        c.quadraticCurveTo(sg * sc * 0.55, sg * sc * 0.30 - sc * 0.22,
                           sg * sc * 0.20, -sc * 0.10 + sg * sc * 0.30);
        c.stroke();
      }

    } else if (k === "umbral"){
      /* An absence: the mark is drawn by REMOVING the face under it, so the
         hammer looks eaten rather than stamped. destination-out is the only
         composite in here and it is scoped by the save/restore. */
      c.save();
      c.globalCompositeOperation = "destination-out";
      c.beginPath();
      for (let i = 0; i < 9; i++){
        const a = i * TAU / 9;
        const rr = sc * (0.55 + 0.42 * Math.abs(Math.sin(i * 2.7)));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
      c.restore();
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(0, 0, sc * 0.30, 0, TAU); c.fill();
      c.globalAlpha = 1;

    } else if (k === "runic"){
      c.lineWidth = Math.max(1, W * 0.038);
      c.beginPath(); c.arc(0, 0, sc * 0.92, 0, TAU); c.stroke();
      c.beginPath();
      for (let i = 0; i < 3; i++){
        const a = i * TAU / 3 - Math.PI / 2;
        const px = Math.cos(a) * sc * 0.60, py = Math.sin(a) * sc * 0.60;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.stroke();

    } else if (k === "vigil"){
      c.fillStyle = p.dark;
      c.fillRect(-sc * 0.80, -sc * 0.62, sc * 1.60, sc * 1.24);
      c.fillStyle = p.core;
      c.fillRect(-sc * 0.64, -sc * 0.46, sc * 1.28, sc * 0.92);
      c.fillStyle = p.glow;
      c.fillRect(-sc * 0.64, -sc * 0.46, sc * 1.28, sc * 0.24);
      c.fillStyle = p.dark;
      for (const sx of [-1, 1]) for (const sy of [-1, 1]){
        c.beginPath(); c.arc(sx * sc * 0.50, sy * sc * 0.30, sc * 0.12, 0, TAU); c.fill();
      }

    } else {
      /* DWARVEN, and the default for any school with no mark of its own. */
      c.beginPath();
      c.moveTo(-sc * 0.62, -sc); c.lineTo(sc * 0.62, 0); c.lineTo(-sc * 0.62, sc);
      c.stroke();
    }
    c.restore();
  },

  /* Long slender blade, wide crossguard, fuller groove. The crossguard is the
     tell: this is the only relic with a hilt built to catch another weapon. */
  /* A bow drawn side-on: the string faces BACKWARD along -x, the bolt points
     forward along +x, so the silhouette states the firing direction. That
     matters more here than on any other shape — the whole no-aim design
     rests on the viewer being able to see where the weapon is pointing.
     No school iconography, per the matrix contact-sheet finding.

     `k` is the DRAW, 0..1, and it is the reason this shape takes a fifth
     argument no other shape wants. The first contact sheet had the bolt
     permanently nocked, which meant the bow looked exactly the same the
     instant before a shot and the instant after one — the cadence, the one
     thing a viewer needs to be able to feel about a ranged weapon, was
     invisible. Now it nocks, draws, and looses: string forward and empty
     for most of the interval, bolt appearing and the string coming back
     over the last third, gone again on release. Presentation only.
     Undefined from the fight card, where a half-drawn bow is the pose that
     reads as a bow in use rather than a bow on a rack. */
  bow(c, L, W, p, k){
    const dk = k === undefined ? 0.55 : clamp(k, 0, 1);
    /* PROPORTION, FROM RICK'S REFERENCE. v1 was a slim bow held out on a
       long grip -- a thin thing poking sideways off the shell. The
       reference is a BROAD recurve sitting across the ball like a brim,
       limb span comparable to the ball's own diameter, and near-black.
       Three consequences and all of them are improvements:
         - wide reads as a bow at phone size; slim reads as a stick
         - DARK separates by VALUE on any school palette, which is the
           lesson this codebase has now learned three times, and it is most
           of the vigil contrast problem solved by the art rather than by
           the palette
         - the grip nearly vanishes, so the ARROW occupies the reach
           instead of the bow. That matters mechanically: the melee
           segment runs from R-4 to R+reach, so the thing sticking out is
           now the thing that hits you. */
    const lh = W * 0.95;                                     // limb half-span
    const rx = L * 0.13;                                     // riser, close in
    const pull = L * 0.26 * dk;                              // string travel

    /* Three passes over one path: silhouette, body, lit edge. The dark pass
       is FIRST and widest, and it is the whole reason this reads on a rose
       ball inside a rose ward. */
    c.lineCap = "round"; c.lineJoin = "round";
    const limb = (wd, col) => {
      c.strokeStyle = col; c.lineWidth = Math.max(1, wd);
      c.beginPath();
      c.moveTo(rx - L*0.06, -lh);                            // upper tip, swept back
      c.quadraticCurveTo(rx + L*0.34, -lh*0.44, rx + L*0.17, 0);
      c.quadraticCurveTo(rx + L*0.34,  lh*0.44, rx - L*0.06,  lh);
      c.stroke();
    };
    limb(W*0.30, SHAPES._ink(p.dark, 9.71));                     // silhouette, dominant
    limb(W*0.13, p.dark);                                    // body: the school, dark
    limb(W*0.045, p.steel);                                  // one lit edge, thin

    /* THE PER-SCHOOL BRANCH. One structural detail, not a colour -- the
       matrix contact sheet found every row was one silhouette in six
       palettes, and two bows sharing a shape is that failure with a
       population of two. Same pattern as SHAPES.twinblade: share the
       routine, bespoke one real thing inside it. */
    const onLimb = (sg, u) => {
      const p0x = rx - L*0.06, p0y = sg * lh;                  // tip
      const cxx = rx + L*0.34, cyy = sg * lh * 0.44;           // control
      const p1x = rx + L*0.17, p1y = 0;                        // belly
      const it = 1 - u;
      return { x: it*it*p0x + 2*it*u*cxx + u*u*p1x,
               y: it*it*p0y + 2*it*u*cyy + u*u*p1y,
               a: Math.atan2(2*it*(cyy-p0y) + 2*u*(p1y-cyy),
                             2*it*(cxx-p0x) + 2*u*(p1x-cxx)) };
    };

    if (p.key === "vigil"){
      /* VIGIL: the limbs are PLATES. The same armour the ward puts on the
         shell, laid along the bow -- so the weapon and the status are
         visibly the same material, and "every plate becomes the next
         arrow" stops being a line in a blurb and becomes something the eye
         can check. Discrete, countable, with the near-black value break
         underneath that every vigil plate in this game gets. */
      for (const sg of [-1, 1]){
        for (let i = 0; i < 3; i++){
          const u = 0.20 + i * 0.30;
          const q = onLimb(sg, u);
          c.save();
          c.translate(q.x, q.y);
          c.rotate(q.a);
          c.fillStyle = SHAPES._ink(p.dark, 10.40);
          c.fillRect(-W*0.30, -W*0.155, W*0.60, W*0.31);
          c.fillStyle = p.core;
          c.fillRect(-W*0.24, -W*0.105, W*0.48, W*0.21);
          c.fillStyle = p.glow;
          c.fillRect(-W*0.24, -W*0.105, W*0.48, W*0.045);
          c.restore();
        }
      }
    } else if (p.key === "sanctified"){
      /* SANCTIFIED: the bow is a MONSTRANCE. A ring stands in the mouth of the
         recurve with rays out of it, so the thing the arrow leaves through is
         a halo. Pierced limbs, because the light has to get out. */
      c.save();
      c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.055);
      c.beginPath(); c.arc(rx + L*0.14, 0, lh*0.52, 0, TAU); c.stroke();
      c.lineWidth = Math.max(1, W*0.035);
      for (let i = 0; i < 6; i++){
        const a = i * TAU / 6 + 0.3;
        c.beginPath();
        c.moveTo(rx + L*0.14 + Math.cos(a)*lh*0.52, Math.sin(a)*lh*0.52);
        c.lineTo(rx + L*0.14 + Math.cos(a)*lh*0.80, Math.sin(a)*lh*0.80);
        c.stroke();
      }
      c.restore();
      c.save();
      c.globalCompositeOperation = "destination-out";
      for (const sg of [-1, 1]) for (let i = 0; i < 3; i++){
        const q = onLimb(sg, 0.24 + i * 0.26);
        c.beginPath(); c.arc(q.x, q.y, W*0.052, 0, TAU); c.fill();
      }
      c.restore();

    } else if (p.key === "bloodsworn"){
      /* BLOODSWORN: barbs on the OUTSIDE of both limbs, pointing back along the
         draw, and a hook off each tip. A bow that catches is a strange object
         and that is the point -- this school's weapons are built to keep what
         they touch, even the one that never touches anything. */
      c.fillStyle = SHAPES._shade(p.steel, 0.74, 0.32);
      c.strokeStyle = SHAPES._ink(p.dark, 9.71); c.lineWidth = Math.max(1, W*0.022);
      for (const sg of [-1, 1]){
        for (let i = 0; i < 3; i++){
          const q = onLimb(sg, 0.22 + i * 0.28);
          c.save();
          c.translate(q.x, q.y); c.rotate(q.a);
          c.beginPath();
          c.moveTo(0, sg * W*0.05);
          c.lineTo(-W*0.30, sg * W*0.44);
          c.lineTo(W*0.10,  sg * W*0.14);
          c.closePath(); c.fill(); c.stroke();
          c.restore();
        }
        const t2 = onLimb(sg, 0.02);                 // and a tip hook
        c.beginPath();
        c.moveTo(t2.x, t2.y);
        c.lineTo(t2.x - W*0.16, t2.y + sg * W*0.46);
        c.lineTo(t2.x + W*0.20, t2.y + sg * W*0.12);
        c.closePath(); c.fill(); c.stroke();
      }

    } else if (p.key === "verdant"){
      /* VERDANT: the limbs are a living branch that has been bent and left
         bent, so it leafs along its length and the string is a vine. This is
         the only school for which "a bow" is not a stretch -- a bow IS a bent
         piece of wood, and every other school has to explain why theirs is
         not one. */
      c.lineCap = "round";
      for (const sg of [-1, 1]){
        for (let i = 0; i < 3; i++){
          const q = onLimb(sg, 0.20 + i * 0.28);
          c.save();
          c.translate(q.x, q.y);
          c.rotate(q.a + sg * 0.95);
          c.fillStyle = p.core;
          c.beginPath();
          c.moveTo(0, 0);
          c.quadraticCurveTo(W*0.20, -W*0.16, W*0.44, 0);
          c.quadraticCurveTo(W*0.20,  W*0.16, 0, 0);
          c.closePath(); c.fill();
          c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.020);
          c.beginPath(); c.moveTo(0,0); c.lineTo(W*0.42, 0); c.stroke();
          c.restore();
        }
      }
      c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.030);
      for (const sg of [-1, 1]){                    // a tendril off each tip
        const q = onLimb(sg, 0.02);
        c.beginPath();
        c.moveTo(q.x, q.y);
        c.quadraticCurveTo(q.x - W*0.36, q.y + sg*W*0.30,
                           q.x - W*0.10, q.y + sg*W*0.52);
        c.stroke();
      }

    } else if (p.key === "umbral"){
      /* UMBRAL: both limb TIPS are eaten off, which on a bow is the one place
         where absence is also a mechanical claim -- the tips are what the
         string is anchored to. It should not be able to fire, and it does. */
      c.save();
      c.globalCompositeOperation = "destination-out";
      for (const sg of [-1, 1]){
        const q = onLimb(sg, 0.10);
        c.beginPath();
        for (let i = 0; i < 10; i++){
          const a = i * TAU / 10;
          const rr = W * 0.30 * (0.58 + 0.50 * Math.abs(Math.sin(i * 1.9 + sg)));
          const px = q.x + Math.cos(a) * rr, py = q.y + Math.sin(a) * rr;
          if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.closePath(); c.fill();
      }
      const mid = onLimb(1, 0.55);                  // and a gap in one limb
      c.beginPath(); c.arc(mid.x, mid.y, W*0.19, 0, TAU); c.fill();
      c.restore();
      c.save();
      c.globalAlpha = 0.5; c.fillStyle = p.core;
      for (const sg of [-1, 1]){
        const q = onLimb(sg, 0.10);
        c.beginPath();
        c.moveTo(q.x, q.y);
        c.quadraticCurveTo(q.x - W*0.60, q.y + sg*W*0.50,
                           q.x - W*0.20, q.y + sg*W*0.70);
        c.quadraticCurveTo(q.x - W*0.20, q.y + sg*W*0.28, q.x, q.y);
        c.closePath(); c.fill();
      }
      c.globalAlpha = 1;
      c.restore();

    } else if (p.key === "runic"){
      /* RUNIC: the limbs are in pieces and the STRING is what holds them in
         formation -- which is the grammar's best joke and its most honest
         reading on this type. Everywhere else runic deletes the part that does
         the holding; here it cannot, because the string is the only thing left
         that could. Five segments a limb, cut out of the limb that is already
         drawn, so the recurve still reads. */
      c.save();
      c.globalCompositeOperation = "destination-out";
      for (const sg of [-1, 1]){
        for (let i = 0; i < 4; i++){
          const q = onLimb(sg, 0.16 + i * 0.21);
          c.save();
          c.translate(q.x, q.y); c.rotate(q.a);
          c.fillRect(-W*0.055, -W*0.34, W*0.11, W*0.68);
          c.restore();
        }
      }
      c.restore();
      c.save();                                     // the sigil, at the grip
      c.globalCompositeOperation = "lighter";
      c.translate(rx + L*0.13, 0);
      c.rotate(-(SHAPES._t || 0) * 2.4);
      c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.028);
      c.shadowColor = p.core; c.shadowBlur = 12;
      const rr2 = W * 0.24;
      c.beginPath(); c.arc(0, 0, rr2, 0, TAU); c.stroke();
      c.beginPath();
      for (let i = 0; i < 3; i++){
        const a = i * TAU / 3;
        const x = Math.cos(a) * rr2 * 0.60, y = Math.sin(a) * rr2 * 0.60;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath(); c.stroke();
      c.restore();

    } else if (p.key === "dwarven"){
      /* DWARVEN: a siege engine. A riveted plate over the riser and bolts
         down both limbs -- the bow is the only shape in the game that
         could plausibly have been BUILT rather than forged, and dwarven is
         the school that would build it. */
      c.save();
      c.translate(rx + L*0.13, 0);
      c.fillStyle = SHAPES._ink(p.dark, 9.71); c.fillRect(-L*0.055, -lh*0.34, L*0.11, lh*0.68);
      c.fillStyle = p.steel;   c.fillRect(-L*0.035, -lh*0.28, L*0.07, lh*0.56);
      c.fillStyle = SHAPES._ink(p.dark, 9.71);
      for (const sy of [-1, 1]){
        c.beginPath(); c.arc(0, sy * lh*0.20, W*0.075, 0, TAU); c.fill();
      }
      c.restore();
      for (const sg of [-1, 1]){
        for (let i = 0; i < 3; i++){
          const q = onLimb(sg, 0.22 + i * 0.29);
          c.fillStyle = SHAPES._ink(p.dark, 9.71);
          c.beginPath(); c.arc(q.x, q.y, W*0.10, 0, TAU); c.fill();
          c.fillStyle = p.steel;
          c.beginPath(); c.arc(q.x, q.y, W*0.058, 0, TAU); c.fill();
          c.fillStyle = SHAPES._ink(p.dark, 9.71) + "99";
          c.fillRect(q.x - W*0.058, q.y - W*0.014, W*0.116, W*0.028);
        }
      }
    }

    const nock = rx + L*0.02 - pull;                         // where the string sits
    c.strokeStyle = SHAPES._ink(p.dark, 10.92); c.lineWidth = Math.max(1.4, W*0.055);
    c.beginPath();                                           // string, dark under
    c.moveTo(rx - L*0.06, -lh); c.lineTo(nock, 0); c.lineTo(rx - L*0.06, lh);
    c.stroke();
    c.strokeStyle = "#CFC6B4"; c.lineWidth = Math.max(1, W*0.026);
    c.beginPath();                                           // string, pulled to `nock`
    c.moveTo(rx - L*0.06, -lh); c.lineTo(nock, 0); c.lineTo(rx - L*0.06, lh);
    c.stroke();

    c.fillStyle = SHAPES._ink(p.dark, 14.99);                    // riser, dark
    c.fillRect(rx + L*0.06, -W*0.30, L*0.13, W*0.60);
    c.fillStyle = p.dark;
    c.fillRect(rx + L*0.08, -W*0.24, L*0.09, W*0.48);
    c.fillStyle = p.core;                                    // the one bright mark
    c.beginPath(); c.arc(rx + L*0.125, 0, W*0.085, 0, TAU); c.fill();

    /* The bolt exists only while the bow is drawn, and it is what occupies
       the reach. An empty string is what says "it just fired"; there is no
       other cue, because the shot itself is already 15 units downrange by
       the next frame. */
    if (dk > 0.03){
      const tip = L * (0.70 + 0.30 * dk);
      c.globalAlpha = Math.min(1, dk * 2.4);
      c.strokeStyle = SHAPES._ink(p.dark, 14.99); c.lineWidth = Math.max(1.4, W*0.075);
      c.beginPath(); c.moveTo(nock, 0); c.lineTo(tip, 0); c.stroke();
      c.strokeStyle = p.dark; c.lineWidth = Math.max(1, W*0.038);
      c.beginPath(); c.moveTo(nock, 0); c.lineTo(tip, 0); c.stroke();
      c.fillStyle = p.glow;                                  // head
      c.beginPath();
      c.moveTo(tip, 0); c.lineTo(tip - L*0.13, -W*0.115); c.lineTo(tip - L*0.13, W*0.115);
      c.closePath(); c.fill();
      c.globalAlpha = 1;
    }
  },

  greatsword(c, L, W, p, k, aff){
    /* THE SCHOOL BRANCH. Same dispatch as SHAPES.twinblade -- a school
       with a grammar of its own gets a different OUTLINE here, not a
       different colour. See silhouette_build.py for why, and
       silhouette_probe.py for whether it worked. */
    const key = p.key || aff;
    if (key === "runic")      return SHAPES._gsConjured(c, L, W, p);
    if (key === "verdant")    return SHAPES._gsGrown(c, L, W, p);
    if (key === "bloodsworn") return SHAPES._gsBarbed(c, L, W, p);
    if (key === "umbral")     return SHAPES._gsEaten(c, L, W, p);
    if (key === "sanctified") return SHAPES._gsRadiant(c, L, W, p);
    if (key === "dwarven")    return SHAPES._gsBuilt(c, L, W, p);
    if (key === "vigil")      return SHAPES._gsPlated(c, L, W, p);
    return SHAPES._gsBase(c, L, W, p);
  },

  /* the blade outline on its own -- every grammar clips to it, fills it or
     eats it, and three of them disagreeing about where the edge is would show */
  _gsBlade(c, L, W){
    const bh = W * 0.19;
    c.beginPath();
    c.moveTo(L*0.225, -bh);
    c.lineTo(L*0.795, -bh*0.90);
    c.lineTo(L,        0);
    c.lineTo(L*0.795,  bh*0.90);
    c.lineTo(L*0.225,  bh);
    c.closePath();
  },

  _gsBase(c, L, W, p){
    const bh = W * 0.19;                                       // blade half-height
    c.fillStyle = SHAPES._shade(p.dark, 1.20, 0.30);            // grip
    c.fillRect(0, -W*0.085, L*0.135, W*0.17);
    c.strokeStyle = "#12100C"; c.lineWidth = Math.max(1, W*0.035);
    for (let i = 1; i <= 4; i++){                              // grip wrap
      const gx = L * 0.135 * (i/5);
      c.beginPath(); c.moveTo(gx, -W*0.085); c.lineTo(gx + L*0.012, W*0.085); c.stroke();
    }
    c.fillStyle = p.core;                                      // pommel
    c.beginPath(); c.arc(-L*0.012, 0, W*0.115, 0, TAU); c.fill();

    c.fillStyle = p.core;                                      // crossguard, flared
    c.beginPath();
    c.moveTo(L*0.135, -W*0.50); c.lineTo(L*0.185, -W*0.40);
    c.lineTo(L*0.185,  W*0.40); c.lineTo(L*0.135,  W*0.50);
    c.closePath(); c.fill();
    c.fillStyle = p.dark;                                      // ricasso
    c.fillRect(L*0.185, -bh*1.15, L*0.045, bh*2.30);

    c.beginPath();                                             // blade
    c.moveTo(L*0.225, -bh);
    c.lineTo(L*0.795, -bh*0.90);
    c.lineTo(L,        0);
    c.lineTo(L*0.795,  bh*0.90);
    c.lineTo(L*0.225,  bh);
    c.closePath();
    c.fillStyle = p.steel; c.fill();

    /* DEPTH, and it is INTERIOR: shadowBlur is zeroed so the halo stays the
       one the fill above already cast. A diamond section -- ridge down the
       axis, the lower facet turned away from the light. */
    c.save(); c.shadowBlur = 0; c.globalAlpha = SHAPES._lit(c);  /* world light */
    c.beginPath();                                             // shadowed face
    c.moveTo(L*0.225, 0);
    c.lineTo(L,       0);
    c.lineTo(L*0.795, bh*0.90);
    c.lineTo(L*0.225, bh);
    c.closePath();
    c.fillStyle = SHAPES._facet(p.steel, p.dark, 0.60); c.fill();
    /* The fuller was `p.core + "77"` across the whole width -- a lit bar over
       both facets, which is a groove that glows and crosses its own ridge. A
       groove is dark, and it lives on one face. */
    c.fillStyle = SHAPES._shade(p.dark, 1.30, 0.16);
    c.fillRect(L*0.27, -bh*0.72, L*0.46, bh*0.40);
    c.fillStyle = p.core + "55";                               // its lit lower lip
    c.fillRect(L*0.27, -bh*0.34, L*0.46, bh*0.10);
    c.restore();
    c.strokeStyle = p.glow; c.lineWidth = Math.max(1, W*0.045); // honed edge
    c.beginPath();
    c.moveTo(L*0.225, -bh); c.lineTo(L*0.795, -bh*0.90); c.lineTo(L, 0);
    c.stroke();
  },

  /* ---------------------------------------------------------- SANCTIFIED --
     RADIANT AND PIERCED. THE CELL'S FLAIR: on a hammer the halo stood off
     behind the head; a sword has no behind, so the light goes into the GUARD.
     The crossguard becomes a pair of swept wings with a ring between them, and
     the fuller becomes a row of piercings -- so the one part of a greatsword
     that is already a horizontal bar becomes the part that radiates. */
  _gsRadiant(c, L, W, p){
    const bh = W * 0.19;
    c.save();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.055);  // the ring
    c.beginPath(); c.arc(L*0.19, 0, W*0.60, 0, TAU); c.stroke();
    c.fillStyle = p.core;                                        // the wings
    for (const sg of [-1, 1]){
      c.beginPath();
      c.moveTo(L*0.155, sg * W*0.16);
      c.quadraticCurveTo(L*0.02, sg * W*1.10, L*0.29, sg * W*1.02);
      c.quadraticCurveTo(L*0.26, sg * W*0.52, L*0.225, sg * W*0.16);
      c.closePath(); c.fill();
    }
    c.restore();

    SHAPES._gsBase(c, L, W, p);

    c.save();                                                    // pierced fuller
    c.globalCompositeOperation = "destination-out";
    /* AN ERASE TAKES ITS STRENGTH FROM THE SOURCE ALPHA, and this site never
       set one -- it inherited whatever fill the base shape happened to finish
       on, so the depth of every bite in the game was decided by the last line
       of a function that knows nothing about biting. depth_build.py --erase. */
    c.fillStyle = "#00000077";
    for (let i = 0; i < 5; i++){
      c.beginPath();
      c.arc(L*(0.32 + 0.10*i), 0, bh*(0.42 - 0.045*i), 0, TAU);
      c.fill();
    }
    c.restore();
  },

  /* ------------------------------------------------------------- DWARVEN --
     BUILT. THE CELL'S FLAIR: a sword is the hardest thing in the game to
     believe was ASSEMBLED, so this one is honest about it -- two cheek plates
     riveted to a central spine that runs out past them, and the point is a
     CHISEL rather than a taper, because a bolted blade cannot come to a forged
     edge. The tip is the tell and it is visible at any size. */
  _gsBuilt(c, L, W, p){
    const bh = W * 0.19;
    const iron = SHAPES._shade(p.steel, 0.70, 0.42);
    const dark = SHAPES._shade(p.steel, 0.22, 0.55);

    c.fillStyle = SHAPES._shade(p.dark, 1.20, 0.30);             // grip
    c.fillRect(0, -W*0.085, L*0.135, W*0.17);
    c.fillStyle = p.core;
    c.beginPath(); c.arc(-L*0.012, 0, W*0.115, 0, TAU); c.fill();
    c.fillStyle = p.core;                                        // crossguard
    c.beginPath();
    c.moveTo(L*0.135, -W*0.50); c.lineTo(L*0.185, -W*0.40);
    c.lineTo(L*0.185,  W*0.40); c.lineTo(L*0.135,  W*0.50);
    c.closePath(); c.fill();

    c.fillStyle = iron;                                          // the spine
    c.fillRect(L*0.185, -bh*0.34, L*0.845, bh*0.68);
    c.beginPath();                                               // chisel point
    c.moveTo(L*1.03, -bh*0.34); c.lineTo(L*1.03, bh*0.34);
    c.lineTo(L*0.90, bh*0.34); c.lineTo(L*0.90, -bh*0.34);
    c.closePath(); c.fill();

    for (const sg of [-1, 1]){                                   // cheek plates
      c.beginPath();
      c.moveTo(L*0.235, sg * bh*0.18);
      c.lineTo(L*0.235, sg * bh);
      c.lineTo(L*0.86,  sg * bh*0.80);
      c.lineTo(L*0.86,  sg * bh*0.16);
      c.closePath();
      const g = c.createLinearGradient(0, sg*bh, 0, 0);
      g.addColorStop(0, SHAPES._shade(p.steel, 0.46, 0.45));
      g.addColorStop(1, p.steel);
      c.fillStyle = g; c.fill();
      c.strokeStyle = dark; c.lineWidth = Math.max(1, W*0.030); c.stroke();
    }
    c.fillStyle = dark;                                          // the rivets
    for (const rx of [0.30, 0.45, 0.60, 0.75]) for (const ry of [-0.62, 0.62]){
      c.beginPath(); c.arc(L*rx, bh*ry, W*0.045, 0, TAU); c.fill();
    }
    c.fillStyle = iron;                                          // and a collar
    c.fillRect(L*0.195, -bh*1.20, L*0.045, bh*2.40);
    c.strokeStyle = dark; c.lineWidth = Math.max(1, W*0.028);
    c.strokeRect(L*0.195, -bh*1.20, L*0.045, bh*2.40);
  },

  /* ---------------------------------------------------------- BLOODSWORN --
     BARBED BACKWARD. THE CELL'S FLAIR: a sword has a front and a back edge, so
     unlike the hammer or the ball there is no ambiguity -- the false edge grows
     four rearward hooks and the crossguard sweeps DOWN into two more, so the
     whole weapon rakes on the return. The cutting edge is left clean, which is
     what makes the barbs read as deliberate rather than as damage. */
  _gsBarbed(c, L, W, p){
    const bh = W * 0.19;
    SHAPES._gsBase(c, L, W, p);
    c.lineJoin = "miter";
    c.fillStyle = SHAPES._shade(p.steel, 0.74, 0.32);
    c.strokeStyle = SHAPES._shade(p.steel, 0.20, 0.52);
    c.lineWidth = Math.max(1, W*0.028);
    for (let i = 0; i < 4; i++){                                 // back-edge hooks
      const x = L * (0.34 + 0.14 * i);
      c.beginPath();
      c.moveTo(x,            bh*0.96);
      c.lineTo(x - L*0.075,  bh*2.10);
      c.lineTo(x + L*0.030,  bh*1.16);
      c.closePath(); c.fill(); c.stroke();
    }
    for (const sg of [-1, 1]){                                   // guard, swept down
      c.beginPath();
      c.moveTo(L*0.150, sg * W*0.30);
      c.quadraticCurveTo(L*0.075, sg * W*1.02, L*0.185, sg * W*0.96);
      c.quadraticCurveTo(L*0.175, sg * W*0.56, L*0.205, sg * W*0.26);
      c.closePath(); c.fill(); c.stroke();
    }
    c.fillStyle = p.core;                                        // a fed notch
    c.beginPath();
    c.moveTo(L*0.885, -bh*0.52); c.lineTo(L*0.955, -bh*0.10);
    c.lineTo(L*0.885, -bh*0.04);
    c.closePath(); c.fill();
  },

  /* ------------------------------------------------------------- VERDANT --
     GROWN. THE CELL'S FLAIR: a long straight blade is a LEAF, which is the one
     place this grammar gets an easier ride than anywhere else -- so it takes
     the harder version. The blade is a leaf with a serrated margin and a
     visible midrib, the guard is two curling shoots, and the grip is a length
     of stem that has not been stripped. */
  _gsGrown(c, L, W, p){
    const bh = W * 0.19;
    const wood = SHAPES._shade(p.dark, 1.28, 0.22);
    c.lineCap = "round"; c.lineJoin = "round";

    c.strokeStyle = wood; c.lineWidth = W*0.17;                  // the stem
    c.beginPath(); c.moveTo(-L*0.01, W*0.02); c.lineTo(L*0.20, 0); c.stroke();
    c.strokeStyle = p.core; c.lineWidth = Math.max(1, W*0.042);  // two shoots
    for (const sg of [-1, 1]){
      c.beginPath();
      c.moveTo(L*0.175, sg * W*0.05);
      c.quadraticCurveTo(L*0.10, sg * W*0.72, L*0.27, sg * W*0.66);
      c.stroke();
    }

    c.beginPath();                                               // the leaf
    c.moveTo(L*0.20, 0);
    c.bezierCurveTo(L*0.34, -bh*1.55, L*0.72, -bh*1.45, L*1.00, 0);
    c.bezierCurveTo(L*0.72,  bh*1.45, L*0.34,  bh*1.55, L*0.20, 0);
    c.closePath();
    const g = c.createLinearGradient(0, -bh*1.5, 0, bh*1.5);
    g.addColorStop(0, p.glow); g.addColorStop(0.5, p.steel);
    g.addColorStop(1, SHAPES._shade(p.steel, 0.46, 0.38));
    c.fillStyle = g; c.fill();

    c.fillStyle = p.core;                                        // serrated margin
    for (let i = 1; i <= 7; i++){
      const u = i / 8;
      const x = L * (0.20 + 0.80 * u);
      const y = bh * 1.50 * Math.sin(Math.PI * u) * 0.96;
      for (const sg of [-1, 1]){
        c.beginPath();
        c.moveTo(x - L*0.035, sg * y * 0.94);
        c.lineTo(x + L*0.015, sg * (y + bh*0.55));
        c.lineTo(x + L*0.045, sg * y * 0.90);
        c.closePath(); c.fill();
      }
    }
    c.strokeStyle = SHAPES._shade(p.dark, 1.1, 0.12);            // the midrib
    c.lineWidth = Math.max(1, W*0.045);
    c.beginPath(); c.moveTo(L*0.22, 0); c.lineTo(L*0.98, 0); c.stroke();
    c.lineWidth = Math.max(1, W*0.024);                          // and its veins
    for (let i = 1; i <= 5; i++){
      const u = i / 6, x = L * (0.24 + 0.68 * u);
      const y = bh * 1.40 * Math.sin(Math.PI * u);
      for (const sg of [-1, 1]){
        c.beginPath();
        c.moveTo(x - L*0.05, 0); c.lineTo(x + L*0.03, sg * y * 0.72); c.stroke();
      }
    }
  },

  /* -------------------------------------------------------------- UMBRAL --
     EATEN. THE CELL'S FLAIR: the POINT is gone. On a hammer the bite went
     through the haft; on a sword the most alarming thing you can remove is the
     part that does the work, so this blade ends in a broken stump two thirds of
     the way along, with the rest of it eaten out of the edges. A greatsword's
     whole property is reach, and umbral's is that the damage is permanent. */
  _gsEaten(c, L, W, p){
    const bh = W * 0.19;
    c.save();
    SHAPES._gsBase(c, L, W, p);
    c.globalCompositeOperation = "destination-out";
    /* AN ERASE TAKES ITS STRENGTH FROM THE SOURCE ALPHA, and this site never
       set one -- it inherited whatever fill the base shape happened to finish
       on, so the depth of every bite in the game was decided by the last line
       of a function that knows nothing about biting. depth_build.py --erase. */
    c.fillStyle = "#00000077";
    const bite = (bx, by, r, seed) => {
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a = i * TAU / 10;
        const rr = r * (0.58 + 0.50 * Math.abs(Math.sin(i * 1.9 + seed)));
        const px = bx + Math.cos(a) * rr, py = by + Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
    };
    /* the point, taken off with a ragged edge rather than a clean cut */
    c.beginPath();
    c.moveTo(L*0.70, -bh*1.6);
    c.lineTo(L*0.78, -bh*0.55); c.lineTo(L*0.72, -bh*0.05);
    c.lineTo(L*0.80,  bh*0.40); c.lineTo(L*0.74,  bh*1.6);
    c.lineTo(L*1.30,  bh*1.6);  c.lineTo(L*1.30, -bh*1.6);
    c.closePath(); c.fill();
    bite(L*0.36, -bh*0.92, bh*0.80, 0.4);                        // out of the edges
    bite(L*0.56,  bh*0.98, bh*0.66, 2.1);
    bite(L*0.16,  0,       bh*0.55, 1.3);                        // and the guard
    c.restore();

    c.save();                                                    // what leaks out
    c.globalAlpha = 0.5; c.fillStyle = p.core;
    c.beginPath();
    c.moveTo(L*0.76, -bh*0.30);
    c.quadraticCurveTo(L*1.02, -bh*1.30, L*1.12, -bh*0.10);
    c.quadraticCurveTo(L*0.94, -bh*0.42, L*0.78,  bh*0.26);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
    c.restore();
  },

  /* --------------------------------------------------------------- VIGIL --
     PLATED. THE CELL'S FLAIR: on a bow the plates lie along the limbs, on a
     hammer they stack up the head. On a sword they run down the blade like the
     lames of a vambrace, each stepping proud of the one before, so the edge is
     a STAIRCASE rather than a line -- and the crossguard becomes a small shield
     with the same plate on it. Countable: five lames. */
  _gsPlated(c, L, W, p){
    const bh = W * 0.19;
    SHAPES._gsBase(c, L, W, p);

    c.fillStyle = p.dark;                                        // the guard shield
    c.beginPath();
    c.moveTo(L*0.130, -W*0.62); c.lineTo(L*0.215, -W*0.50);
    c.lineTo(L*0.215,  W*0.50); c.lineTo(L*0.130,  W*0.62);
    c.closePath(); c.fill();
    c.fillStyle = p.core;
    c.fillRect(L*0.148, -W*0.40, L*0.052, W*0.80);
    c.fillStyle = p.glow;
    c.fillRect(L*0.148, -W*0.40, L*0.052, W*0.20);

    for (let i = 0; i < 5; i++){                                 // five lames
      const x = L * (0.255 + 0.145 * i);
      const h = bh * (1.28 - 0.13 * i);
      c.fillStyle = p.dark;
      c.fillRect(x, -h, L*0.130, h*2);
      c.fillStyle = p.core;
