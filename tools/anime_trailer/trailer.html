<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="s_open.js"></script>
<script src="s_fights.js"></script>
<script src="s_end.js"></script>
<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", { willReadFrequently: false });
window.ready = (async () => {
  await document.fonts.load('900 100px "Noto Sans CJK JP"', "THE 王冠");
  await document.fonts.load('700 100px "Noto Sans CJK JP"', "THE 王冠");
  await document.fonts.load('700 100px "Noto Serif CJK JP"', "砕かれた王冠");
  return true;
})();
/* One frame, by number. Returns nothing; the caller reads the canvas. */
window.renderFrame = (i) => {
  const t = i / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  renderAt(ctx, t);
};
window.grab = (q) => cv.toDataURL("image/jpeg", q || 0.95);
window.totalFrames = () => Math.round(TOTAL_BEATS * BEAT * FPS);
window.cues = () => JSON.stringify(CUES);
</script>
</body></html>
